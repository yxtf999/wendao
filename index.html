"key":false,"section":"ep10-p222"},{"id":"ep10-p223","index":223,"text":"前三条：知识、认知与意义","level":2,"key":false,"section":"ep10-p222"},{"id":"ep10-p224","index":224,"text":"终于讲到最后了，今天讲得有点多。学完别直接扔了，得像意义思维一样，分析事情时真按这个路子走。我总结十二条，不算完善，先当初级版本。要允许我们犯错，允许在错误里成长。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p225","index":225,"text":"第一，平时多看、多听、多学《人类说明书》《逆修觉者》《真相》《法界天机》这些知识。做事情时，用学到的原则对照一下，现在的决定合不合适，符合原则，再继续做。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p226","index":226,"text":"第二，建立人间的知识体系。现在逐渐进入大V时代。那些动不动喊“听懂了掌声”的，或者空说某种东西是一种智慧的，越来越不好使，因为大家整体认知提高了。现在更需要说实话的人。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p227","index":227,"text":"像我教这些知识体系，都是不收费的。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p228","index":228,"text":"我教知识时，咱们之间没有这层收费关系，我希望你跟着学就行。忽悠不忽悠都不收费，那我有什么必要忽悠？这是我自己的想法。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p229","index":229,"text":"现在网上一些大V，尤其海外的一些人，说的东西比较实在。到底对不对，也可以放到更长时间里验证。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p230","index":230,"text":"可以多听时政、经济。比如我提到的老王、鲁社长，还有讲经济的小林，这些内容我觉得讲得很好。别净看八卦，对你没多大帮助。人间的知识体系也要建立起来。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p231","index":231,"text":"第三，先想清楚意义。你要干什么，做这事是为了什么？我看过一个短剧，夫妻都失业，讨论未来怎么办，讨论两个小时，没结果。又想挣钱、解决危机，又不想吃苦，那讨论什么？如果不能解决收入问题，这次讨论的意义在哪里？","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p232","index":232,"text":"再比如，发现老公跟一个妹子多聊了会儿，你先想，此时最该做什么，想得到什么结果，再去跟他扯。别发完脾气，连自己的目的都不知道。很多人做事真不想结果，只凭感觉，这种人不在少数。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p233","index":233,"text":"第四至第六条：后果、概率与情绪","level":2,"key":false,"section":"ep10-p222"},{"id":"ep10-p234","index":234,"text":"第四，想后果，尽量推三到五层。我做完会得到什么，得到之后会产生什么影响，那个影响又会产生什么后果？推几层，觉得合适，再做。前四条能做到，我觉得就能超过一半人了。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p235","index":235,"text":"后果有两个维度。一个是影响。比如买了一辆跑车，发朋友圈，目的是什么，会带来什么？中了五百万，公开告诉大家，亲戚会有什么反应？别只做、不想。影响的影响，再往下推三到五层。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p236","index":236,"text":"另一个维度是时间。一个月、一年、十年、三十年之后，甚至按我说的下一生，会有什么影响？不合适就别做。很多事，放到更长的角度想，可能就不做了。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p237","index":237,"text":"第五，不要对低概率的事情抱有过高期望。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p238","index":238,"text":"什么叫低概率？以后讲人类金字塔还会说。比如你成为富人的概率有多大，婚姻幸福的概率有多大？我在直播里拿东北举例，随口说了“百分之七十出问题”。我要说的是，别只按自己最想要的结果来想。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p239","index":239,"text":"很多人对低概率的事情抱极大期望，活在幻想里。你得看看自己的想法，实际有多大概率。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p240","index":240,"text":"第六，检查决定里有没有情绪。喜欢一个东西就必须买，跟谁较劲就必须把那句话说出去，这都有情绪。情绪上来的时候，只要不是必须马上处理的生死急事，就先别作决定。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p241","index":241,"text":"有人说太扎心了。其实很多事成功率本来就低，只是自己不认可。看看一辈子有几个人富，凭什么一定落到你身上？可你心里已经把自己的可能性放大到百分之九十九以上了。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p242","index":242,"text":"第七至第九条：求助、验证与原则","level":2,"key":false,"section":"ep10-p222"},{"id":"ep10-p243","index":243,"text":"第七，能不能找高人指点？前面都想过了，人还是有思维茧房：认知就这么大，没办法发现认知以上的问题。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p244","index":244,"text":"认知更高的人一看，就知道你哪里选错了；自己没有那个认知，就看不出来。身边有这样的人，把事情说给他听，点你一句，可能比自己苦上十年都强。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p245","index":245,"text":"第八，按我这套方法，用法界成相看一下靠不靠谱。我做很多事，也会找仙家、神，比较大的事找更高级别的菩萨去看。确定没问题，再往前冲。你觉得各方面没问题，却还没有成相，按我的理解，一定有认知之外的东西出了问题。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p246","index":246,"text":"第九，在天道、人道的大原则上别出问题。明显违反规则的事，不要去做，不要铤而走险。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p247","index":247,"text":"第十至第十二条：能力圈、反馈与确定","level":2,"key":false,"section":"ep10-p222"},{"id":"ep10-p248","index":248,"text":"第十，能力圈以上的事情不要碰，做能力圈以内的事情。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p249","index":249,"text":"人贵在自知之明，这点很重要。有女生找我算姻缘，说自己特别漂亮，为什么还没人找？我看了照片，觉得经过PS都没有她自己说得那么好。我就问，身边没有反馈吗？","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p250","index":250,"text":"比如你走在街上，有没有很多人回头看？做游戏主播，说可以花一千块加朋友圈，有多少人愿意？或者拍生活视频，放半年，能不能有五十万、一百万粉？我举这些例子，是说别光凭自己觉得。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p251","index":251,"text":"这就到了第十一，建立反馈、修正和复盘体系。老觉得自己优秀，总得跟外面的反应对应一下。范冰冰走到街上，一堆人看，她不用怀疑自己是美女；凤姐走到街上，情况就不一样。这是直播里的一个玩笑，但要说的是，你得有反馈。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p252","index":252,"text":"第十二，只做自己确定的事。很多人根本没想清楚要不要做，就跟着别人干了。别人干什么，你就干什么，跟你有什么关系？这一点一定注意。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p253","index":253,"text":"把十二条练成习惯","level":2,"key":false,"section":"ep10-p222"},{"id":"ep10-p254","index":254,"text":"这十二条还不完善，但做大事之前，可以先用它建立一个判断过程。行，再做；不行，就别做。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p255","index":255,"text":"我平时也是这么判断。尤其情绪上来，会先想办法压住。不是每件事都能做到，但至少能意识到：现在这个决定带着情绪，不对，先等等。能意识到，已经不一样。这里面的东西，你能用上一半，就很厉害。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p256","index":256,"text":"都用上，人生出大问题的概率会低一些。能不能大富大贵，我说还得看命，但至少不容易作太大的错误决定。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p257","index":257,"text":"用熟了，判断可能就是几秒钟，不会耽误太多。刚开始逐条对，可能花很久。可很多人宁愿在错误里痛苦、悔恨，也不愿花一两分钟，或者一两天，把这些东西校正一下，很奇怪。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p258","index":258,"text":"咱们只渡能听懂、也愿意修行的人。为什么叫逆修觉者？不是明白了就一定能做到，改变生活习惯是很大的问题。这些东西，其实就是在改习惯。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p259","index":259,"text":"希望大家学完真能用，别又还给我。成立红尘道场，就是给大家练习、养成习惯的地方。不然最后又变成罗辑思维、樊登读书会，学得再多，没应用，还是一场空。","level":0,"key":false,"section":"ep10-p222"},{"id":"ep10-p260","index":260,"text":"好，今天到这儿，别忘了点赞、收藏、分享。谢谢大家，今天忽悠时间太长了，拜拜。","level":0,"key":false,"section":"ep10-p222"}]}],"cards":[{"id":"ep1-k01","course":"ep1","number":1,"topic":"课程导读","title":"人类说明书的四个阶段","summary":"本讲将“人类说明书”分为四个阶段，当前从“逆修觉者”的真相与思维模型开始。","points":["四个阶段：逆修觉者、灵魂觉者、法界天机、道法自然。","《问道》是这套内容的讲述形式，希望老听众和新听众都能听懂。"],"start":50,"end":56,"quote":"大家在群里的都看了说明书。咱们整个人类说明书，一共是四个阶段：逆修觉者、灵魂觉者、法界天机，还有道法自然。","quoteIndex":53,"related":["ep2-k30","ep3-k09"],"section":"ep1-p39","sectionTitle":"一 开场与课程安排","searchText":"问道一 系列开篇总序 第1课 问道1 人类说明书的四个阶段 本讲将“人类说明书”分为四个阶段，当前从“逆修觉者”的真相与思维模型开始。 课程导读 四个阶段：逆修觉者、灵魂觉者、法界天机、道法自然。 《问道》是这套内容的讲述形式，希望老听众和新听众都能听懂。 一 开场与课程安排 问道系列与四个阶段 好，咱们正式开始了，不耽误大家时间了。大家晚上好，我先说一下咱们的情况。等了这么多年，终于成熟了，咱们从今天开始说《问道》系列。这其实也是人类说明书的一个系列，只不过起了一个更正式的名，一会我们做正式版本的时候再说。 我们未来的正式版本叫《问道》。但是你看，越是正式的，我们越希望：很多人都能听得懂，一个是咱们老朋友能听得懂，一个就是从来都没听过的人也能听得懂。 大家在群里的都看了说明书。咱们整个人类说明书，一共是四个阶段：逆修觉者、灵魂觉者、法界天机，还有道法自然。 咱们现在讲的是逆修觉者阶段。逆修觉者阶段就没有任何封建迷信的东西，没有任何神佛仙的东西，主要处理的都是真相，还有思维模型。 越是正式的东西，我越是比较谨慎。我们需要大家先提前听，比如我直播的时候，先按自己的稿子直播一遍。这不有四个群嘛，大家疯狂吐槽。 吐槽完了之后，如果没有什么太大修改的，我就正式录制。录制的时候，肯定得换一套行头，把头型再梳梳，还得要配图。所以现在讲完了之后，如果没什么问题，会有一些相应的小伙伴得去做一些图。正式版本肯定要配图，这样能成为一个真正可以传播的东西。"},{"id":"ep1-k02","course":"ep1","number":2,"topic":"课程导读","title":"真相、思维模型与案例","summary":"课程规划既包含对具体生活问题的讲述，也包含思维模型和案例练习。","points":["逆修觉者的思维模型分为天道思维、人道思维、人设思维。","真相涉及生活、工作、婚姻、学习等题目；案例帮助理解理论如何运用。","稿中的集数和时间属于当次试讲时的规划。"],"start":57,"end":71,"quote":"所以这个东西很多，最后还有案例。你光说理论，不玩案例，肯定没戏。这是一个非常庞大的东西，你想要把人类去改变，怎么可能这么简单？不可能这么简单。","quoteIndex":71,"related":[],"section":"ep1-p39","sectionTitle":"一 开场与课程安排","searchText":"问道一 系列开篇总序 第1课 问道1 真相、思维模型与案例 课程规划既包含对具体生活问题的讲述，也包含思维模型和案例练习。 课程导读 逆修觉者的思维模型分为天道思维、人道思维、人设思维。 真相涉及生活、工作、婚姻、学习等题目；案例帮助理解理论如何运用。 稿中的集数和时间属于当次试讲时的规划。 一 开场与课程安排 正式传播与内容规划 我们正式的传播是在二〇二七年的春节之后。 为什么定这个时间？主要就是你看《推背图》四十四卦，人家本来就是丁未卦，所以咱就必须得在丁未年去干这个事。正式的就是这样，到时候播放的时候，每天一集。 我们逆修觉者这块，一共就分三大块，叫天道思维、人道思维和人设思维，三种思维模型。我估计想了一下，大概思维模型两百多集。你光思维模型是这样，还有零散的叫真相。 真相就可以不用录得那么仔细，它不像思维模型比较难理解。真相说白了，跟你说这个事，你能接受就接受，不能接受拉倒。反正你活着，怎么着也得接受这个东西。你爱接受不接受，不能接受的话，到时候被这个规则影响了，也是你活该，就属于这种样子。 所以真相会很小，有的可能十几分钟就说完了，有的可能要两三个小时，每个真相不太一样。但我尽可能把真相，比如经济的、生活的、工作的、财运的、结婚的、学习的、生孩子的、教育孩子的，还有养生的，都得说清楚。 这些东西是你一定会发生的事情，你肯定活在这个规则里，你爱信不信。真相你能接受就接受，不能接受拉倒，反正这个东西不是我去决定的。 真相的部分，逆修觉者、灵魂觉者，我估计加在一起怎么着一两千集，还是挺多的。涉及思维模型的，逆修觉者这行，两百多集我估计差不多。你想，咱们光第一期——第一期天道思维这行，现在已经确定了，目录出来的话，七十六集还是七十七集，今天可能又增加了一个，七十七集。因为随时可能增加，减可能不会减了，但加可能随时加。 不定什么时候，上面的大号啪给我一个信号：“你小子还差上一集呢，赶紧把这个给说了。”有的时候想不出来，就是憋着憋着，就憋出来了。 人道那块，我们先把天道的讲完，讲完之后，我估计可能要休息一个月，就开始再讲人道的，之后再讲人设。我估计加在一起反正是两百多集，差不多。 这两百多集，明年二三月份开始放，一天放一集，就得放一年，这还没加上真相呢。你要加上真相，说白了，就基础的、大家能经常碰到的真相，二三百集我觉得还是没什么问题的。 比如像ABC运这种东西，就不算什么思维模型，它就是一个真相。你爱信不信，反正你不信，最后他不那么倒霉的时候，你别哭。 包括咱们说的叫“人生皆已知”，至少把人生大概可能会发生什么事、什么阶段会发生什么事，大概要说一下。你爱信不信，不信的话，自己碰到的时候别哭就行。 包括金融的事情、理财的事情、给自己留点后手的东西，都得去说。我也是一边看着新闻，或者一边看着小说，一些什么东西，正好刷到了，有感悟了，赶紧写。我现在拿一个小本，赶紧给记上，到时候咱们就说这些东西。 所以这个东西很多，最后还有案例。你光说理论，不玩案例，肯定没戏。这是一个非常庞大的东西，你想要把人类去改变，怎么可能这么简单？不可能这么简单。"},{"id":"ep1-k03","course":"ep1","number":3,"topic":"课程导读","title":"为什么先试讲，再定稿？","summary":"先讲给听众听，收集不清楚的地方，再修改、配图与正式录制，是本讲说明的制作过程。","points":["先给出大纲和目录，让听众了解内容顺序。","能否听明白，是修改试讲稿的重要依据。"],"start":72,"end":76,"quote":"这个就是咱们整体的发展阶段。我们的方式方法就是，我先用直播的形式，先给大家出大纲。出完大纲之后，先用直播的方式给你录，录完之后大家吐槽。你觉得看得好还是看得不好，看不懂的，我赶紧回来修改。","quoteIndex":73,"related":["ep2-k01","ep5-k01"],"section":"ep1-p39","sectionTitle":"一 开场与课程安排","searchText":"问道一 系列开篇总序 第1课 问道1 为什么先试讲，再定稿？ 先讲给听众听，收集不清楚的地方，再修改、配图与正式录制，是本讲说明的制作过程。 课程导读 先给出大纲和目录，让听众了解内容顺序。 能否听明白，是修改试讲稿的重要依据。 一 开场与课程安排 直播讨论与定稿录制 这个就是咱们整体的发展阶段。我们的方式方法就是，我先用直播的形式，先给大家出大纲。出完大纲之后，先用直播的方式给你录，录完之后大家吐槽。你觉得看得好还是看得不好，看不懂的，我赶紧回来修改。 我们要求的就是大道至简，你别看不明白，这个就不行。所以我们的节奏是先出大纲、先出目录，让大家清楚未来讲的顺序是什么。 什么时候讲？未来讲得比较频繁，可不是一周只讲一次了。基本上我想好了，觉得写好了内容，觉得可以了，咱就开讲。所以未来讲的时间是不定的，哪天想好了咱就讲，属于这种样子。 讲完之后，欢迎大家吐槽，有三天吐槽时间。我再收集一下问题，如果没什么问题，就直接定稿。定稿完之后，我就开始录，同时也给咱们一些做图的小伙伴一些时间，就是这种样子。"},{"id":"ep1-k04","course":"ep1","number":4,"topic":"规则与实践","title":"允许理解和版本继续修订","summary":"讲者以自己对“智慧”的理解变化为例，说明内容会随着思考和实践继续修改。","points":["从零散感悟积累到系统讲述，需要时间。","前一版与后一版出现不同表述，是本讲明确保留的修订空间。"],"start":78,"end":90,"quote":"所以我也在成长，也在不停地修改。以后咱们人类说明书，第一版本这么说，第二版本就那么说了，有没有可能？肯定有这种可能。大家不要去怪，允许我在成长。","quoteIndex":89,"related":["ep1-k16","ep10-k07"],"section":"ep1-p77","sectionTitle":"二 人类说明书为什么现在开始","searchText":"问道一 系列开篇总序 第1课 问道1 允许理解和版本继续修订 讲者以自己对“智慧”的理解变化为例，说明内容会随着思考和实践继续修改。 规则与实践 从零散感悟积累到系统讲述，需要时间。 前一版与后一版出现不同表述，是本讲明确保留的修订空间。 二 人类说明书为什么现在开始 从零散感悟到正式录制 好，咱们不多说了，开始《问道》的第一期。首先得跟大家说，终于千呼万唤始出来了，咱们人类说明书正式开始录制。 为什么现在才叫正式录制？主要原因是之前讲得太零散了，但是实在也没有任何办法。为什么？天道在给你下发东西的时候，用的是因果碰撞这种方式方法。你这段时间碰到什么事、感悟到什么事，他才让你悟一个东西。 我以前都是什么？这礼拜感悟到什么东西了，觉得好像挺有意思，这个时候就开始给大家录。所以大家在听的时候，有些集会觉得很过瘾，有些集就觉得有点放水。不是我放水，关键是实在憋不出来。所以你们看的很多东西都是断断续续的，有很漂亮的集，有很感动的集。 甚至我记得在清迈的时候，都临开场十分钟了，还不知道要讲什么。 本来想给大家灌水，结果一开讲，上面大号传信息了，一下子灵感就来了，一讲大家还觉得挺满意，会出现这种情况。 这就叫顿悟，不能确定什么时候悟，哪天能悟到什么东西你也不知道。但是在长达将近十年的时间里，断断续续，通过看到一些东西、看到一些事，你会对天地之间有感悟。 对智慧的理解也在修改 所以没办法，我也一直在修改我们的很多东西。比如前段时间，如果三月份的时候，你问我什么是智慧，我还会跟你说，用高维的思维去解决低维的事，这就是智慧。看似是对的，但是再琢磨琢磨，我忘了是因为什么事了，反正突然发生了一件事情。 后来我又琢磨，好像不对，这个解释不完整。我就说，好像是从更长远的时间里面，始终保持你的正确性，叫长久正确，才是智慧。你甭管用什么方法，那是方式方法，不管，但是智慧的目的是为了解决这个东西。 弄完了之后，你就觉得很牛叉，之前的古人没人总结过这个东西，包括你用AI，你总结不出来这东西。 所以我也在成长，也在不停地修改。以后咱们人类说明书，第一版本这么说，第二版本就那么说了，有没有可能？肯定有这种可能。大家不要去怪，允许我在成长。 目前从天道上来说，基本上跟我说的是，地基打好了，可以盖楼了。那咱们人类说明书就千呼万唤始出来，正式开始。"},{"id":"ep1-k05","course":"ep1","number":5,"topic":"课程导读","title":"为什么要有一本“人类说明书”？","summary":"讲者用“人生不断做题，却没有说明书”的比喻，解释这个系列的出发点。","points":["先了解人生可能遇到哪些问题，以及需要哪些知识和训练。","把只在问题发生后应对，向事先学习和准备推进。"],"start":91,"end":100,"quote":"看了这么多之后，我非常想做的一件事情，就是让大家知道，天底下到底有多少个考题，考试的项目有什么，你需要具备什么样的知识，需要把自己锻炼成什么样子，才能进行一场好的考试，才能保证自己人生的每一关都一定能过关成功。咱别每次都裸考。","quoteIndex":99,"related":["ep2-k29"],"section":"ep1-p77","sectionTitle":"二 人类说明书为什么现在开始","searchText":"问道一 系列开篇总序 第1课 问道1 为什么要有一本“人类说明书”？ 讲者用“人生不断做题，却没有说明书”的比喻，解释这个系列的出发点。 课程导读 先了解人生可能遇到哪些问题，以及需要哪些知识和训练。 把只在问题发生后应对，向事先学习和准备推进。 二 人类说明书为什么现在开始 让人生的每一关有说明书 我们为什么起名叫人类说明书？很简单，你看我做阴阳师快十年了，也看了十万次不同的单子，处理过至少几万次不同的事情。我觉得经验还是有的，看过的人生也足够多，我相信很多人这一生都没有看过这么多人。 但是你会发现一个问题，实际上最后总结出：大家生生死死，每一世都在干的一个事情是什么？就是迷茫地活着，我觉得都是在迷茫地活着。所以贯穿整个人类、我们这个小世界人类繁衍的过程，其实人真的不知道如何更好地活着。 我也非常疑惑，每次都问：你既然要对所有的人进行考核，有因果、有惩罚、有奖励，为什么不告诉大家应该怎么做？一问到这事，人家跟你说天机，死活不跟你说，我也弄得没办法。 所以我觉得这事挺奇怪，既然天道和轮回对我们一直处于一种考验，而我们一生之中都被考验着，不停地在做题——不停地解答人生的每一道题，过每一道关，但是他不给你说明书。 比如咱们学个知识，是不是还给你本书？你得先学，学完之后给你画重点，再给一些题，你得去做做、刷刷题，再给个考试大纲和考试方向。这个时候定好时间，咱考试。这时候考不过去，那就纯属自己水平问题。 我认，我也认。但现在这个东西就太不公平了，上来就考试，啥都不给。考过了，合格；不过，对不起，你就完蛋了，扣分。你说人下来之后，有几个能考过的？所以人生不如意十之八九。 有的时候我也在想，天道这啥情况？不给考题，又要考试，你到底想让人过，还是不想让人过？所以我觉得，可能也是天道在给我们机会，别人出不了，我来吧。 看了这么多之后，我非常想做的一件事情，就是让大家知道，天底下到底有多少个考题，考试的项目有什么，你需要具备什么样的知识，需要把自己锻炼成什么样子，才能进行一场好的考试，才能保证自己人生的每一关都一定能过关成功。咱别每次都裸考。 我一直期待把这件事情做好，但准备的东西实在太多了，用了十年时间去准备，也算对得起这个东西。我觉得基本准备差不多了，至少初期阶段已经够用了，所以咱们人类说明书正式启动。"},{"id":"ep1-k06","course":"ep1","number":6,"topic":"追问根源","title":"问自己，答众生","summary":"问自己，是带着困惑追问真相、规则和方向；答众生，是在解答他人的问题时继续完善自己的理解。","points":["主动问自己为什么，而不只是等待答案。","问题与思想的碰撞，也是讲者所说的成长过程。"],"start":102,"end":110,"quote":"问自己是什么？我自己也是一样，修行也是一样，带着人生的困惑去追问真相、规则和方向。自己学会问自己为什么。","quoteIndex":107,"related":["ep1-k07","ep2-k14","ep3-k19"],"section":"ep1-p101","sectionTitle":"三 问自己与答众生","searchText":"问道一 系列开篇总序 第1课 问道1 问自己，答众生 问自己，是带着困惑追问真相、规则和方向；答众生，是在解答他人的问题时继续完善自己的理解。 追问根源 主动问自己为什么，而不只是等待答案。 问题与思想的碰撞，也是讲者所说的成长过程。 三 问自己与答众生 为什么节目叫问道 第二个事情，就要跟大家说，既然叫人类说明书，为什么节目叫《问道》？因为我们做的事，最终的结果是人类说明书，但是咱们的形式叫问道。 我记得曾经看了一本小说，有个主人公叫王林，《仙逆》，王林。有一集他在梦中轮回，所以做了一个天地大儒，心向往之。 人家讲学十年，问道十年。我就打算，虽然水平上赶不上人家，但是时间上一定要超过他。我打算问道三十年，这就是给自己规定的一个东西，是个小目标。 实际的东西是什么？两个事情：一个叫问自己，另外一个叫答众生。 问自己是什么？我自己也是一样，修行也是一样，带着人生的困惑去追问真相、规则和方向。自己学会问自己为什么。 答众生是什么？回答众生的问题，解众生之惑，同时也是圆满自己的一个过程。因为所有的问题、所有的思想，最终叫因果碰撞、思维碰撞。你没有那么多碰撞，想不出来这些事。 所以看似你在帮助众生，解答众生的问题，实际上众生也在成就你。我最终想达到智慧的圆满，但是天地之间还有你回答不出来的问题，怎么能说自己的智慧圆满了？ 我既然想修十级智慧，现在才八级，这玩意就跟焊一样，老不动了，挺郁闷。但是后来想想也是，天地间有这么多你解决不了的问题，凭什么说智慧圆满？慢慢解决吧，解决得足够多的时候，可能智慧就上升了。"},{"id":"ep1-k07","course":"ep1","number":7,"topic":"追问根源","title":"从“怎么办”继续问到“为什么”","summary":"面对痛苦和困惑，本讲提出先追问自己为何走到这里，以及哪里看错、想错。","points":["这件事背后的真相是什么？","我应当按照什么规则重新行动？","把提问、质疑与追求答案练成思维习惯。"],"start":111,"end":114,"quote":"好，咱们再回到问自己。问自己这件事情非常重要。问道中，在人痛苦、迷茫、困惑的时候，不再只问怎么办，而是开始询问：我为什么会走到今天？这件事情背后的真相是什么？我哪里看错了？哪里想错了？我应该按照什么规则重新去活？","quoteIndex":112,"related":["ep2-k14","ep2-k04"],"section":"ep1-p101","sectionTitle":"三 问自己与答众生","searchText":"问道一 系列开篇总序 第1课 问道1 从“怎么办”继续问到“为什么” 面对痛苦和困惑，本讲提出先追问自己为何走到这里，以及哪里看错、想错。 追问根源 这件事背后的真相是什么？ 我应当按照什么规则重新行动？ 把提问、质疑与追求答案练成思维习惯。 三 问自己与答众生 从怎么办到追问真相 好，咱们再回到问自己。问自己这件事情非常重要。问道中，在人痛苦、迷茫、困惑的时候，不再只问怎么办，而是开始询问：我为什么会走到今天？这件事情背后的真相是什么？我哪里看错了？哪里想错了？我应该按照什么规则重新去活？ 你一定要渴望知道真相和一切答案，而不是活在自己的梦境中。这是一种思维习惯。 我希望培养出大量敢于提问、敢于质疑、敢于追求真相，也敢于打破现有规则的破法者。这个就是破梦的必要条件。"},{"id":"ep1-k08","course":"ep1","number":8,"topic":"追问根源","title":"办公室矛盾：不只判断谁对谁错","summary":"讲者从办公室中的误会和冲突出发，追问为什么不同企业会反复出现类似问题。","points":["不止处理眼前的一次争执，还要查找反复产生不信任与情绪的原因。","把具体事件与背后的信息、关系和思维方式联系起来。"],"start":116,"end":122,"quote":"但我们在这里想的是什么？我们绝对不会去想这个事情。你要去想，为什么人类的企业一定会有这样的问题？为什么大家会产生不信任？为什么会产生情绪？","quoteIndex":120,"related":["ep1-k09","ep2-k06"],"section":"ep1-p115","sectionTitle":"四 从办公室矛盾追问问题本质","searchText":"问道一 系列开篇总序 第1课 问道1 办公室矛盾：不只判断谁对谁错 讲者从办公室中的误会和冲突出发，追问为什么不同企业会反复出现类似问题。 追问根源 不止处理眼前的一次争执，还要查找反复产生不信任与情绪的原因。 把具体事件与背后的信息、关系和思维方式联系起来。 四 从办公室矛盾追问问题本质 为什么企业总会发生这些问题 举一个最近的事情，你要学会问自己，我正好举个例子。最近我们办公室有一些小问题，发生了跟大家所有办公室都会发生的一些问题。比如员工之间互相有点小矛盾，信息有点不太流畅，说话不太注意。 最后产生的情况是什么？第一，产生了误会；第二，让领导者决策上出现了问题；第三，有些员工情绪产生波动；第四，甚至有些员工做出了不太正确的决定。这是所有企业一定会发生的事情。 那你作为老板应该干什么？先问问情况，看看谁有问题，实在不行各打五十大板，然后给个红枣，再给一个棒子，再“葫芦葫芦头”，大家继续过吧。这就是传统企业所干的事情。 但我们在这里想的是什么？我们绝对不会去想这个事情。你要去想，为什么人类的企业一定会有这样的问题？为什么大家会产生不信任？为什么会产生情绪？ 所以你一定要学会从根上找，从高维上看待这个问题，应该怎么解决？更应该解决的，不是谁对谁错。解决谁对谁错这件事情，是低维应该干的事情。 就像夫妻吵架，你永远记住，如果从低维上解决问题，这辈子都解决不完世间所有夫妻吵架的事情。他会有各种各样的吵架方式，随着时代变化，有各种各样的理由、各种各样的对错，你永远解决不了。所以最重要的是从高维解决问题。"},{"id":"ep1-k09","course":"ep1","number":9,"topic":"规则与实践","title":"信息透明，也要验证事实","summary":"信息片面和缺少核实，是本讲分析办公室内耗时提出的两个问题。","points":["听到对某人的评价，先核实事情是否真实发生。","即使事情确实发生，不同人的原因解释也可能不同，需要更全面地了解。"],"start":123,"end":130,"quote":"第二件事情，你会发现一个问题，没人去验证。比如谁说谁不好，谁做了一个什么东西，我们大概率不会验证这件事情是否真的发生。但是没有去验证，你会发现什么问题？未必是真实的。就是哪怕这个事情是真实的——大家因为什么原因产生这个事情，每个人的解释是不一样的，你要从更全面的角度上去弄。但最重要的一点，学会验证。","quoteIndex":125,"related":["ep1-k10","ep4-k13"],"section":"ep1-p115","sectionTitle":"四 从办公室矛盾追问问题本质","searchText":"问道一 系列开篇总序 第1课 问道1 信息透明，也要验证事实 信息片面和缺少核实，是本讲分析办公室内耗时提出的两个问题。 规则与实践 听到对某人的评价，先核实事情是否真实发生。 即使事情确实发生，不同人的原因解释也可能不同，需要更全面地了解。 四 从办公室矛盾追问问题本质 信息透明与验证事实 我们第一个说的是，只要办公室出现这种东西，第一件事情叫信息不透明。也就是说，事情的真相和本质你并不知道，只是看到片面。 第二件事情，你会发现一个问题，没人去验证。比如谁说谁不好，谁做了一个什么东西，我们大概率不会验证这件事情是否真的发生。但是没有去验证，你会发现什么问题？未必是真实的。就是哪怕这个事情是真实的——大家因为什么原因产生这个事情，每个人的解释是不一样的，你要从更全面的角度上去弄。但最重要的一点，学会验证。 因为在天界以上，很难出现这个问题，只有低层天界才会出现。低层天界还会有一点点人间的影子，在高维天界的时候，叫一切皆可查。一起心动念，这个事怎么回事，甚至我都不用知道怎么回事，只是凭一个感觉，就知道谁对谁错。 所以叫一切无所遁形。你可以参考三体人，三体人为什么能发展得比人类更厉害？就是因为不会产生管理上的内耗，不可能有人说谎，不可能有人隐瞒事实，不可能有人能够篡改一些东西。 所以人类世界，如果在企业上，你不解决大家信息透明的问题，或者在一个企业中大家敢于说话的事情，请记住，你的企业无论做得多大，最终解决不了内耗的问题。 最后所有员工，只是在大家发展的时候，我忍了。就像以前我在的公司，马上就上市了，二〇〇六年的时候，有些销售人员拿期权就可以拿将近一千万。你别说别人冤枉你，天天管人叫爷爷都愿意，所以都忍了。 但是一旦上市了，大家拿的期权都分完了，那就不忍了。有冤报冤，有仇报仇，都是这种样子。"},{"id":"ep1-k10","course":"ep1","number":10,"topic":"规则与实践","title":"看见别人的优点与付出","summary":"本讲把关系中的包容，与是否真正看见对方的优点和付出联系起来。","points":["下意识挑错很容易，主动寻找值得肯定的地方需要练习。","讲者用员工关系和夫妻关系说明：忽视付出，会不断消耗原有的关系。"],"start":131,"end":141,"quote":"第二，我们在指责别人的时候，总能找出很多东西，但请问你有没有看过别人的优点？应该很少看吧。记住，当你没有这种东西，看不到别人的优点，看不到别人曾经为你的付出的时候——你怎么可能爱他？你不爱他，就不会容忍他，怎么会愿意包容另一个人的错误？你觉得更多的是他耽误了你。","quoteIndex":137,"related":["ep2-k22","ep3-k23"],"section":"ep1-p115","sectionTitle":"四 从办公室矛盾追问问题本质","searchText":"问道一 系列开篇总序 第1课 问道1 看见别人的优点与付出 本讲把关系中的包容，与是否真正看见对方的优点和付出联系起来。 规则与实践 下意识挑错很容易，主动寻找值得肯定的地方需要练习。 讲者用员工关系和夫妻关系说明：忽视付出，会不断消耗原有的关系。 四 从办公室矛盾追问问题本质 真的去看见别人的优点与付出 后来我也在想另外一件事情，一个是信息透明，一个是愿意验证，但第二个事情是什么？你真的爱众生吗？ 你会发现，在下意识的时候，别人说有问题、挑别人毛病这件事情，我们天生就会。但是找别人的可爱之处、值得称赞的东西，天生不会。 都说修大爱、修慈悲，你有过真正去找别人的优点吗？哪怕有没有多看看别人怎么付出的？你想有一些东西，哪怕他做错了，他在这个事情上付出了多少？加班很晚，自己可能垫钱去弄一些东西。 我们一直说修佛，修佛其实最终的两个事情，大爱和不恨。 你真的爱众生吗？你不爱他。因为你最习惯的，是别人出问题的时候，第一时间怪他，这个人怎么样。 第二，我们在指责别人的时候，总能找出很多东西，但请问你有没有看过别人的优点？应该很少看吧。记住，当你没有这种东西，看不到别人的优点，看不到别人曾经为你的付出的时候——你怎么可能爱他？你不爱他，就不会容忍他，怎么会愿意包容另一个人的错误？你觉得更多的是他耽误了你。 所以你没有爱，就不可能产生包容，就会产生恨。你不会做到不恨不怨，愿意让众生在错误中成长。整个企业的所有人，并没有产生这种东西。如果产生了，更多的会是员工之间互相包容。 但是我们下意识地，也就是说整个人间界都会下意识地干的这些事情，都是怀疑、指责、甩锅和不信任。 最后一定会变成所有员工之间越来越出问题。你记住，你不用去努力。努力去安抚好一些员工，你只能安抚好少数，不可能安抚好多数。你只能对有缘的员工，多一些时间，跟你关系好。但是当这些事情不解决，你都在消耗你们曾经的缘分。 包括夫妻之间，如果互相能够看到对方的付出，多去感恩对方，只要对方不是一种二五眼，你记住，夫妻的感情一定会很好，很多事情就不会发生，不会产生指责。这是从本质上解决问题。"},{"id":"ep1-k11","course":"ep1","number":11,"topic":"学习路径","title":"把理解用到生活的一点一滴","summary":"本讲强调，读过理论还不够，要在具体相处与处事中练习运用。","points":["从身边的人和事入手，观察自己如何回应优点、缺点与错误。","继续通过现象追问本质，检验理解能否解决问题。"],"start":142,"end":146,"quote":"我之前讲的那些东西，很多只是理论。你记住，看完这些理论不可能成功，因为你不会把它应用在生活的一点一滴，没有真正把佛法应用在身边。","quoteIndex":144,"related":["ep2-k31","ep3-k18","ep10-k22"],"section":"ep1-p115","sectionTitle":"四 从办公室矛盾追问问题本质","searchText":"问道一 系列开篇总序 第1课 问道1 把理解用到生活的一点一滴 本讲强调，读过理论还不够，要在具体相处与处事中练习运用。 学习路径 从身边的人和事入手，观察自己如何回应优点、缺点与错误。 继续通过现象追问本质，检验理解能否解决问题。 四 从办公室矛盾追问问题本质 把佛法用到生活的一点一滴 所以，如果我的公司不想经历普通人类公司所经历的这些东西，要从本质上改变。同时也让我更加坚定的，就是佛法生活化，真正入红尘。 我之前讲的那些东西，很多只是理论。你记住，看完这些理论不可能成功，因为你不会把它应用在生活的一点一滴，没有真正把佛法应用在身边。 就像不恨和大爱这两个事情，你就甭多了，多找、只看对方的优点，包容对方的缺点。把这件事情做到了，才是佛法真正的生活化。做不到这点，学再多也没用。 所以学会问自己，没人告诉你答案，你得自己通过现象分析本质，超越一个思维去理解问题的关键是什么。只有这样，才能真正解决问题。"},{"id":"ep1-k12","course":"ep1","number":12,"topic":"规则与实践","title":"《问道》的六条讲述规则","summary":"本讲为系列内容提出六条讲述规则，强调过程、用途与实践中的修正。","points":["只讲规则、只修规则；只讲故事、感想与感悟。","不许个人崇拜；允许在错误中成长。","大道至简，但要讲清过程；交代意义、用法、场景与代价。"],"start":147,"end":182,"quote":"最后要讲的规则是什么？所有东西必须讲清意义。这个东西拿过来干什么用？解决什么问题？用法是什么？适用场景是什么？","quoteIndex":179,"related":["ep1-k17","ep1-k18"],"section":"ep1-p147","sectionTitle":"五 问道与人类说明书的讲述规则","searchText":"问道一 系列开篇总序 第1课 问道1 《问道》的六条讲述规则 本讲为系列内容提出六条讲述规则，强调过程、用途与实践中的修正。 规则与实践 只讲规则、只修规则；只讲故事、感想与感悟。 不许个人崇拜；允许在错误中成长。 大道至简，但要讲清过程；交代意义、用法、场景与代价。 五 问道与人类说明书的讲述规则 五 问道与人类说明书的讲述规则 只讲规则与只修规则 好，第三个，说咱们整个《问道》和人类说明书，先把自己的小规则订立了。 第一个，我们只讲规则，不宣传什么神通、法术这些东西。虽然我干这个干了十多年，客户很多，但是我希望让大家用理性的方法看待这些东西。 你一定明白，世间没有神通，所有神通都是高维生物通过规则在影响我们，只是有些规则你摸不着、看不着。 就跟你把电话、电脑、电视机拿到原始人那个社会，他理解不了为什么这个东西能出声、能出影。你在用他理解不了的规则改变他，这就是神通。所以没有神通，所有东西都是规则，我们只修规则。 包括佛、道，实际上也是修规则。只不过佛用佛看到世间的方式方法，总结了一套东西去修行，这叫佛法。道家也看到天地同样的规则，但用他的东西总结了一套方式方法，这叫道家，仅此而已，没有什么区别，所以最后殊途同归。我们也是只修规则。 只讲故事与只谈感悟 第二个，我们只讲故事，只闲聊，只谈我的感想和感悟，不对这些东西定对错。你也不要找我去证明，我也证明不了。 你找佛祖去证明因果、业力这些东西，我估计佛祖也给你证明不了。你爱信不信，愿意信就信吧，就是这样。所以咱不是传法，传法这件事责任就大了。咱就是闲聊，你能从闲聊中悟到什么，是你的本事。 你要是悟不到，就直接当个笑话，当个无聊的单口相声，听了就完了，乐一乐其实也挺好。 你看，上面既然管我叫悟聊天尊，虽然我对这个法号很有意见，一点也不大气。人家元始天尊、道德天尊、灵宝天尊，我这就悟聊，说得连贯点就变成无聊了：“你净说点无聊的事。”所以很郁闷。 但是毕竟是领导嘛，领导安排的东西最大，我们支持领导安排，认也得认了。要不让你去守一个鸟不拉屎的地方一千年，我估计更惨。所以悟聊就悟聊吧。 不许个人崇拜 然后，咱们不许个人崇拜，大家都是同修关系。因为你到佛界也都是同修关系，你去叫佛祖，肯定不管他叫佛祖，只能叫同修。咱们也是一样，都是同修关系。 这样也让我升高的我慢之心稍微降降。没有师徒，没有师生，都是同修。 允许在错误中成长 还要允许我在错误中成长。我虽然努力悟了十年，很努力地想把一些东西告诉大家，你说这些东西都一定正确吗？不一定，只能在实践中见真知。 它在现实中好使了，就是真的；在现实中不好使，那就扯淡，就属于这种样子。 所以未来我发现哪句话说错了，下一个版本就给改了。你说：“你怎么改了？你否定自己。”我凭啥不能否定自己？我最主要的目的，就是更好地帮助大家，所以否定自己很正常。 大道至简并讲清过程 还有咱们要求的，叫大道至简，这是最需要保持的一个东西。因为我最反感古人屁话太多，要不就是说不清楚，不说人话。所以我喜欢大道至简，只说人话。而且我最讨厌他们只说结果。 前几天也是，我这老大观音下来了，我不就问他：“我智慧怎么老是八分？这焊死在上面了，这玩意就不能挪挪位置吗？”老人家给我来了一句：“你不求智慧的时候，就是智慧圆满了。” 我说，就是因为你们佛界这帮家伙天天说这些东西，才把人间搞乱了。他说得对不对？肯定是对的，因为你不求智慧的时候才是最高智慧，这个没毛病。在佛界，大家也都知道是这样的。但是我们在人间，你不要把结果性的东西告诉我。 佛教特别喜欢说这个，道教也喜欢。《道德经》里说的很多东西都是结果性的，是圆满的结果性的东西。佛教这块也说什么“即心即佛”“平常即佛”，说得对不对？的确是对的。但是你说的是结果性的东西，而且是圆满结果性的东西。 圆满结果性的东西会出现什么情况？返璞归真。返璞归真之后，就跟没修炼是一样的。 我就跟他说，比如拿了一个武林宝典，是不是得先翻翻，先看？看完之后要不懂，得先问问。问完了，都看懂了，就练呗。练个十年八年，熟练了；再练个十年八年，精通了。 达到精通之后，这时候要做的事是什么？叫忘掉。所以此时无招胜有招，没毛病。最后你问他武功的至高境界是什么，无招胜有招。那咋练？你让小白咋练？是不是先把那本书给我？你不给书，直接说结果，就出现这种事情。 所以那天我把观音同学数落了一顿，我说祸害人间的就是你们这帮佛界的，老说结果性的东西——不告诉过程，最后弄得所有人都出问题。所以不要说结果性的东西，那是佛界的表示方法。 咱们要做的是大道至简，但是不至于无。因为一无，就没得可说了，都不要去说了。简可以，但是不能无，说大白话，保证大家都能听明白。 我得把那本书给你，还得带着你咋练。练得差不多的时候，最后跟你说：“你可以无招胜有招了，您就无去吧。”这个是可以的。 讲清意义用法与代价 最后要讲的规则是什么？所有东西必须讲清意义。这个东西拿过来干什么用？解决什么问题？用法是什么？适用场景是什么？ 任何东西使用都会有代价，你要付出什么样的代价？什么人能学？什么人不能学？都得跟人说清楚。 好，这是咱们的规则。希望通过这些规则，还这个世界一个清清白白的世界、明明白白的修行方法。 给大家一个完整版的说明书，希望大家努力修炼，希望有一天修炼完之后，学会无招胜有招。"},{"id":"ep1-k13","course":"ep1","number":13,"topic":"规则与实践","title":"用“规则”理解所讲的内容","summary":"讲者希望用规则来解释现象，并把它作为课程讨论的出发点。","points":["本节说明“只讲规则、只修规则”的含义。","涉及高维与修行的解释，沿用讲者在本次试讲中的观点。"],"start":148,"end":153,"quote":"第一个，我们只讲规则，不宣传什么神通、法术这些东西。虽然我干这个干了十多年，客户很多，但是我希望让大家用理性的方法看待这些东西。","quoteIndex":150,"related":[],"section":"ep1-p147","sectionTitle":"五 问道与人类说明书的讲述规则","searchText":"问道一 系列开篇总序 第1课 问道1 用“规则”理解所讲的内容 讲者希望用规则来解释现象，并把它作为课程讨论的出发点。 规则与实践 本节说明“只讲规则、只修规则”的含义。 涉及高维与修行的解释，沿用讲者在本次试讲中的观点。 五 问道与人类说明书的讲述规则 只讲规则与只修规则 好，第三个，说咱们整个《问道》和人类说明书，先把自己的小规则订立了。 第一个，我们只讲规则，不宣传什么神通、法术这些东西。虽然我干这个干了十多年，客户很多，但是我希望让大家用理性的方法看待这些东西。 你一定明白，世间没有神通，所有神通都是高维生物通过规则在影响我们，只是有些规则你摸不着、看不着。 就跟你把电话、电脑、电视机拿到原始人那个社会，他理解不了为什么这个东西能出声、能出影。你在用他理解不了的规则改变他，这就是神通。所以没有神通，所有东西都是规则，我们只修规则。 包括佛、道，实际上也是修规则。只不过佛用佛看到世间的方式方法，总结了一套东西去修行，这叫佛法。道家也看到天地同样的规则，但用他的东西总结了一套方式方法，这叫道家，仅此而已，没有什么区别，所以最后殊途同归。我们也是只修规则。"},{"id":"ep1-k14","course":"ep1","number":14,"topic":"规则与实践","title":"故事、感想与个人感悟","summary":"讲者在本节明确说明，课程采用闲聊方式，讲述自己的感想和感悟。","points":["讲者承认自己无法为所有相关说法提供证明。","理解这一讲述前提，再阅读后面的论述。"],"start":154,"end":159,"quote":"第二个，我们只讲故事，只闲聊，只谈我的感想和感悟，不对这些东西定对错。你也不要找我去证明
