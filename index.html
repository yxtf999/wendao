得善终的人不多，为什么还选择？想得到什么？先说伟大的，为利益众生、六道提升，不负神佛仙期待培养，感恩天道。私心是什么？得升级，要功德、众生善缘，要领导看得上，派点事都干糊，天地生你何用，得把事做好。</p><p>领导看得上，下次给更好资源，这是私心。功德、众生善缘、领导认可都有了，关心这辈子过好不好，闲的。像我已经拿天界、佛界资格，就算出门出意外，也赚了；多活一天赚一天，凭什么不活，凭什么在意未来结果？</p><p>这就是意义思维，值不值。人间看，不得善终不好，但大家来玩游戏，我已做好万一不得善终准备，肯定要玩高阶游戏：争取传法、挣功德、拿善缘、领导重视，还得善终。这是想法，能否实现不知道。越低端越不可控，越高端越好控。</p><h3>后果 大目标 真正问题与当下行动</h3><p>第四问，后面是什么？继续走，第二、第三、第四、第五步怎么样？第六步先不用问，以你们脑子不容易；聪明可以到十步，但出错概率大，能研究三到五步已经厉害。这解决长期后果。</p><p>第五问，大目标是什么？别干了小目标，毁掉大目标，叫终局反推。第六问，真正问题核心在哪里？从表象看到真相，穿透表象。第七问，此时在干什么，最应该干什么？现在做的对解决有没有帮助？没有就别干。</p><p>孩子流血还跟老公吵，对流血没帮助，先别干，处理完情绪稳了再说，这叫当下有效性。听完都说有道理，别回家没三天全忘，全还回来了。</p><p>这就是红尘道场要解决的。以后做小标签、小饰品，天天看到，喝水看意义在哪，放床头、最容易跟老婆吵架的地方。给孩子出背心，写逆修觉者，下面“请关注此时的我”，别先吵其他，我才是最大意义。</p><p>以后开始算，我花了多少生命。这时意义思维才不只是学过的学问，而是大脑工作方式。不要求人生每件事都伟大，是尽量不在稀里糊涂中消耗生命。</p><p>做事前问意义，做事中看方向，做事后看结果。小事服从大事，眼前服从长远，表象从本质看，情绪服从解决问题。</p><p>为什么做？值不值得做？然后呢？</p><p>压成最简单三句话，经常问就行。</p><h3>配套课程与下课寄语</h3><p>今天聊到这里，又耽误太长时间。过几天有两个配套小课：一生可能犯的错误，错误来自哪；另一个知识分类。别看一堆书就以为有用，要分类、想有没有用。</p><p>看大V也要想，选这个对我有什么帮助、成长？纯闲的，还是怎么？上厕所、吃早餐、洗澡无聊，旁边有声，随便。但专门用脑子听，一定反思。连大V的话都要反思：知识已知道，为什么重复听？为听故事还是掌握知识？别把生命、时间浪费在无意义事情上。</p><p>好，拜拜，大家再见，过几天再见，应该很快。</p><h2>附录 校对记录</h2><p>整理范围  依据本次上传的20260913《问道》意义思维(1)文字转写整理。原稿日期2026年9月13日，时长1小时49分44秒。保留第一人称、讲述顺序、七种模式、意义七问、案例、活动通知与结束语；删除时间戳、说话人标签、无意义卡顿与重复口头语。标题用于阅读导航。</p><p>开场活动与历史时间  9月份促销、黄财神、月光菩萨、月老、九天玄女和燃灯古佛专场均为当次讲述安排；“明天”“最近”等保留原时间语境。原稿并列八月十五与9月25日，未擅自统一历法。请福、请服依换法器与请符语境统一为请符，套服整理为套符。</p><p>01:58至06:54 环境判断  边控法规、部门权限、留学案例、网络监控及加密货币公司人员的描述，均为讲述者转述或判断，原稿未给法规名称、案件材料或出处。房价、经济大萧条15至20年等保留为当时说法，不作为当前法律、经济或出行事实。蔚来依上下文统一为未来。</p><p>06:54至13:11 电脑与网络  “荒野大镖客2077”疑似游戏名称连读，未擅自拆成两个游戏；“全打总套单”不能确认，正文加引号保留。5600、5200、5000等内存数值、2G带宽及10GB网线等单位依原稿保留，不作为已核实技术规格。2060之后的“22060”疑似卡顿或错转，正文保留并加引号；“网线转10GB的插头”同样待回听确认。</p><p>14:54至24:43 身体与洗灵经历  洗灵、启灵、喜灵、喜玲等称谓依同一段语境统一为洗灵。49式、50式依轮回语境整理为49世、50世。7月份原稿未注明历法；“1月份，7月份底”按紧接的自我修正保留7月底。20%能量或福报、15万人传功、人间与天界各100世等数值按原讲述保留，宗教经验与身体症状的因果解释未作医学核实。</p><p>26:15至30:30 年龄与医疗经历  女性40岁、男性45岁后衰运，以及倒霉促成重生的解释，为原讲述的气运观点。手术、血糖、胳膊和高血压经历依口述保留，原稿未给具体病历或药名；“直接上了这个”有现场指示但无对应影像，未补写设 先把东西直播。直播的东西肯定不是特别圆满。一般我先直播，直播完了之后，等一周、十天，你再重新看自己的直播，就有感觉了。有感觉的时候，再重新校正、编辑一些东西，感觉就不一样了。这个时候我再把它重新编辑一下，再去重新录制，这就是成品了。</p><p>我记得当时最费劲的就是《问道二》，简直是又臭又长，我天哪，就那个东西，我自己至少看了四遍。还有咱们一个同学，努力地帮我剪辑了一下，把这个都转成文字。我拿着他的文字，自己又看了四遍，又加了很多东西。而且《问道二》还加了一个大白话版，正式版讲完了之后，再来一个大白话版。这些东西可能都没有给大家看过。</p><p>到时候等他们后期都剪辑完了，如果没什么问题，我先把《问道二》给大家看看，咱们未来的成片是啥样，就给大家放一集。</p><p>以后我还就一直按这个顺序努力工作。咱们争取明年的中期，我估计怎么着也能录个六七十集了。这个时候，我估计咱们逆修觉者的天道思维，六七十集基本上都差不多了之后，就一次性放给大家，这个就是正式版。</p><p>大概就是这么一个情况。但是我觉得挺费劲的。当时录播，不是直播，录播《问道二》的时候，那真是挺费劲。我看他们剪辑，一集好像是二十分钟还是三十分钟，光《问道二》正式版本，四集了还没剪完呢。这反正是比较能忽悠，没办法，只能说东西太多，希望大家能看明白。</p><p>我觉得他们做的动画挺好。你看咱直播版本没有动画，很多都即兴发挥，所以这就是咱们的一个安排。</p><p>在我讲完两部分之后，咱们开始进行录播的时候，我估计录播怎么着也得一两个月。这一两个月的时间，我就开始凑数了，给大家开始讲真相，一周一集吧。真相反正也得去弄，我估计整体的真相全弄下来，也得五六百集，因为它涉及的各个方面都有。</p><p>我是希望，从大家出生到大家死亡，还有死后的事，你这辈子要经历什么，咱们都提前告诉大家。反正这些东西，你愿意不愿意，都得经历。怎么着都得考试的东西，你还是提前知道点答案比较好，就是这样。</p><p>好，咱们计划说完了，现在开始上广告时间。</p><h3>套符与专场的活动提醒</h3><p>首先，你们年底年初用的那些套符，赶紧该订就订。你别十二月份要用，十二月份再订，那不好使。仙家的力量的确比较强，但是有一个问题：你得让仙家有一段时间能了解你，有一些东西该布局布局，该提前准备的提前准备。你别什么东西都屎堵屁股门了再上，那玩意肯定不好使。所以赶紧请，就现在赶紧请，专门年底年初用的套符，尤其是干工作的。</p><p>第二，今天晚上——今天是几号？九月三十号。今天晚上是九九重阳节这批烧纸的最后截止日了。因为咱们又是一堆，有给仙烧的，有给家人烧的，一堆东西，你赶紧，今天晚上是最后截止日期。</p><p>你们别忘了，九九重阳节的时候，该上供的得上供，那是大日子。有仙家、供仙和供神的，一定要上点好酒，因为他们经常拿到各个界面去，跟其他朋友吹的时候，得有点好东西。你不能光给二锅头，那也太惨了，拿不出手。</p><p>咱们的专场，一个是阳历十月二号，燃灯古佛专场；一个是九九重阳节，这不用说了，重中之重。这个专场帮助仙家冲仙门，包括功过，都是这一天要上报天庭的，大家一定表现好。</p><p>你看这几天，我都趁着现在胳膊好了，已经趴在地上大忏悔了。今天咬了半天牙，忏悔了二十个。哈哈，我觉得我要说的东西有点多，忏悔一个都需要一分钟。我下次精简点，至少临时抱佛脚嘛，该表现点表现。至少咱们得忏悔个十几天，代表咱真忏悔。</p><p>你这上次都答应说要忏悔的，结果从三月三都快到九月九了，半年过去了，都忘了这事。之前可以说胳膊有问题，现在就不能说胳膊有问题了。</p><h2>二 为什么要给知识分类</h2><p>好，咱们开始吧。这次讲知识分类，下期讲人类错误或者成功的条件，都属于之前讲过的东西。只不过咱们讲了意义思维之后，我觉得有必要也给其他没听过的说一下，所以不是什么新东西，大家先凑合听听就行。</p><p>如果想听有意思的，一个是智慧那集，大概五六天之后，直播那集还是不错的；还有一个，讲修行的那个还可以。好，咱们开始吧。</p><h3>衡量知识是否适合自己</h3><p>咱们学完意义法则之后，为什么要说知识分类？主要对于我们人类来说，这一生其实都是在各种各样的信息和知识中度过，所以知识分类是非常重要的一件事。甭管是有用的知识，还是没用的垃圾知识，反正你这一生，脑子都不会太闲着，一直在吸收。</p><p>这么多种类型的知识或者信息，总得要分类：哪些东西着重听一些，哪些东西大概了解一下就行，别浪费时间。</p><p>人类很容易陷入知识混乱，一个主要根源就是知识不分级。很多人一直认为，知识越多越好、越全越好、越高级越好、越有名越好、越深奥越好，其实不是这样。好多人也觉得“读书破万卷，下笔如有神”。但其实：</p><p>真正重要的，不是这个知识到底高不高，而是是否适合你现阶段，是否能够落地，是否能够长期产生正向的结果，是否可以真正改变一个人的行为、处境和命运。</p><p>这些东西才是对你真正有用的。所以我们要给人生中经历的每一个信息分类、评级，确定它是否有用，以及有用多少，这都是咱们要做的。</p><p>如果不这样做，你就会陷入：沉迷于高维的理念，却无法实现；追求名著传记，却改变不了命运；学了很多工具技巧，却用错了方向；掌握了短期有效的方式方法，却在长期中被错误反噬。还有，把人的生命大量耗在了看似有文化，却难以改命的知识上。这些东西都很有问题。</p><p>人类的时间非常有限，看似百年，真正用来学习、提升自己的时间却非常有限。我们还要对抗社会、环境的变化，身体也有幼年、青年、中年、老年的时候。就算学习了很多东西，总得有时间应用才行。</p><h3>有限的学习时间与应用时间</h3><p>而且，不是说学了就行。你还得被家庭、孩子、父母、工作、生活上的很多琐事影响，我们的时间非常有限。本来就有限的时间，真正能够学习和应用的有多少？</p><p>在一生里面，最开始的头二三十年其实非常珍贵，脑子又好使，精力又充沛，又没有那堆屁事，也没有家庭那些屁事，也不需要挣钱。但是我们把最精华的二三十年，都用于学一些这一辈子都用不上的知识，而且还用这些知识衡量你到底是不是优秀的，其实大量浪费了时间。</p><p>二三十年学完了之后，真到社会，开始要学有用的东西，又要工作、结婚、生子，还要对抗各种各样的办公室政治，一系列事情。所以你必须在一边工作、一边生活、一边挣钱的情况下，还得想办法学习有用的东西。</p><p>而有用的东西还不是像学校的。你在学校里学的所有东西，有个性质：有书本，有明确的方向、明确的范围，也有考试大纲。但是社会上真正能提升你的这些东西，从来没有人告诉你，哪些重要、哪些有用、哪些是应该看的，你的考试方向是什么，你要经历什么。这些东西没人跟你说，你得自己琢磨。</p><p>所以，你得在有限的时间里面——比如咱们就这么说，你二十五岁，终于从学校出来，进入社会了。</p><p>这个时候，你要开始学对自己这一辈子有用的东西，可是没人教你。你得自学、自悟，自己找方向。这些东西弄完了之后，你必须在五到十年的时间里面，也就是三十五岁之前，把有用的东西基本都学到。</p><p>学完了之后，三十五岁之后还得应用，还得赶时机。如果大运不给你，时机不给你，老天不给你机会，你也扯淡。</p><p>你看我快五十岁了，老天爷才给这个机会。所以前面将近这四十八年、四十九年，纯粹叫积累、学习。这就是一个普通人，没有任何背景、任何资源，从泥腿子一点一点往上升，很费劲。</p><p>所以你想，你的时间到底够不够？绝大多数人，男的基本上四十五岁之后就走衰运了，女的基本上四十岁就开始走衰运了。你想想，实现自己抱负的时间有多少？咱们别把人生一辈子都用在没用的东西上。</p><p>现在就要开始分类。分类之后，就会避免学错知识、用错知识、沉迷错误的东西，最终被知识反过来约束。</p><h2>三 按维度与作用分类</h2><p>现在咱们对知识进行分类。我一般分类的方式有两种。当然，大家也可以按自己的习惯和方式方法分类，把觉得有用的、没用的都分开。</p><p>第一种叫知识四象限，应该是五象限，但是咱们就先说四象限吧，有一个是新加出来的。主要就是高维有用、高维无用、低维有用、低维无用，还有一个是低维看上去有用，但是高维容易错误，就是五个。</p><h3>高维有用</h3><p>高维有用，这很简单。本身这个东西很高维，比如佛经、道经讲的一些道理，就是很高维、很正确的。但有一个问题：你会发现，越高维、越正确的东西，它离你很远，因为这个规则、法则离你很远。</p><p>离你很远，就会出现一个问题：你现阶段未必能理解，也未必能够承接、实践。比如段永平的价值投资，巴菲特的长期主义、复利，还有佛教中很多高阶的修行理念。</p><p>还有很多高级的哲学、高阶的人生规划，这些东西本身是对的。但有一个很大的问题：普通人不一定具备相应的心性、认知、耐力，还有实践条件。</p><p>而且越高的东西，比如“宁损性命，终不作恶”，你如果没有几世的记忆合在一起看，几乎不可能验证它。</p><p>几乎没办法验证，因为这些东西本身就是一个很长时间的东西。越没有时间去验证，越是短时间之内不容易成功的，会出现什么情况？</p><p>人类推动行动力的一个很重要的动力，叫正反馈。这个正反馈不是没有，但是来得很迟。比如段永平投资，哪个东西也不能说三五年，马上买了之后就见效，甚至很有可能买完之后还要先跌上百分之五十。你能不能扛得住？扛不住，肯定享受不到那些东西。</p><p>像巴菲特，还有芒格，哪个不是几十年才见效？短期很难看到很大的收益，你不一定能扛得住。因为很多“道心道我”的东西没有，所以很麻烦。听完觉得有道理，但真正实操，一旦遇到诱惑、挫折或其他情况，就动摇、崩溃了。</p><p>所以不是人家的东西不好使，是门槛太高，实现起来很难，短时间之内不能见到效果。我记得当时在雪球上放段永平的投资理念，我就跟学生说：“你看吧，放了之后也没有用。”绝大多数人很难应用。</p><p>比如胖东来，大家都知道，也很熟悉。胖东来实现了这种因信任而产生的消费行为，你知道得积累多少年？短时间肯定很痛苦，见不了效果，而且很可能还要吃亏。</p><p>现在几十年的时间建立起这种信任，那绝对是无敌了。很多高维正确的东西，最大的问题就是你等不到，等不到那个时间。没有个五到十年，都看不出来你比别人……那五到十年之内，说不定你还比别人……它属于这种样子。</p><p>但真正一旦建立出来，尤其像信任这种东西，一旦建立起来，基本上别人就很难干到你。这就是高维厉害的地方。</p><p>所以高维有用，不是说不好使，关键是你使起来得有一定的时间，而且不容易看到正反馈。人就是这种样子，看不到正反馈，就不一定能坚持下去，很麻烦。想验证这些东西，都需要时间。</p><h3>高维无用</h3><p>第二，高维无用。很简单，听起来很高深、很玄妙、很有境界，但不能落地。任何理论和东西，你就问他：“这个东西我怎么能实现？在现实中怎么应用？”如果说不出来，就让他哪凉快哪待着去。</p><p>这里面有很多古代人写的东西都是这样。对不起，六祖吧，比如他的“本来无一物，何处惹尘埃”，就是这种样子。</p><p>这个东西算不算一种很高级的理论？算。但是你告诉我，人间怎么执行？如何应用在每一件事情上？平时怎么应用？如果你想证明这个世界是假的，不用说这个，很多东西都可以证明这个世界是假的，我也不用非得学这个。所以你就看，这个应用在哪。</p><p>很多东西是一些玄学的口号，包括“即心即佛”“无明所障”。到底什么叫无明？本心是啥？有没有定义？这些东西都没有一个具体的东西。它可能确实很高级，但你以后学了意义法则，就记住：只要不能进入实操，就去他们的，学了也没有用。</p><p>这么长时间，人类都没把实操研究出来，你现在学它有什么意义？几千年来没研究明白实操，也没耽误大家活着，那为什么要研究它、学习它？所以一定记住，凡是不能实操的东西，就去他们的。</p><p>“万物归一”“一切皆成空”，什么宇宙真理、超越人间，什么空空、无无，还有无无无，这就是理论上的东西。只要不能进入实操阶段，就跟我们没关系，就去他们的。</p><p>请大家一定记住，不要被这些高高在上的东西影响。曾经有一段时间，佛教也好，道教也好，都是必须高级知识分子才能研究的东西。很多时候，他们属于比拼智力：我要不说点玄而又玄的东西，你好像觉得我没水平。</p><p>但咱们不是为了这样。我只关心，这些东西能不能让你未来更幸福。如果高深的东西通过我这，你不能听明白，那是我的失败。</p><p>只学能实操的，哈哈，只学能实操的。大家记住，只要在人间没有办法验证、没有办法实操，不能告诉我这条具体在生活中如何应用，就一切都去他们的。让他们自己慢慢装逼去，古人就把他们扫进历史的尘埃里。</p><h3>低维有用</h3><p>第三，低维有用。这个不用说，比如控制情绪、识人、厚黑学，这些低维很有用。包括哪怕学点财务知识，会算个账，会编个程，这叫低维有用，不叫多高维的东西，但实际上有用。</p><p>更多都是一些技能、工具类，或者实操类的东西。我觉得比学那种高维无用的强多了。</p><h3>低维无用</h3><p>第四，低维无用。这个更简单，什么八卦、低质量的争论、情绪价值，研究哪个明星是不是谁的小三，这不闲的吗？纯粹是闲的。还有网络骂战、无价值的短视频。</p><p>这个是这样，我也看无价值的短视频，我还付费看了，哈哈。刷动画片这些东西，我也干。这是在无聊、睡不着觉、睡前准备的时候，上厕所、吃饭的时候，也刷，但纯粹是放松大脑。我是真干活了，所以放松没问题。你们好多人其实不怎么干活，你不能一天十八个小时都在放松，那就有问题了。</p><p>这些没有什么太大的实际意义，不会对你的人生产生什么，还容易让注意力被打碎、情绪被污染、判断力被降低、生命被消耗，这些东西都称为垃圾。</p><h3>低维有用但高维错误</h3><p>最后一个，叫低维有用，但高维错误。有些方式方法和认知，在短时间之内对你非常有帮助，但是在长期、整体或者更长的时间层次上看，你是犯错误的。</p><p>比如很多老板，老觉得自己是天命之子，恨不得跟皇帝一样，这属于脑子有问题。还有学什么帝王之术，你一个不是帝王的，没事学这个干什么？还有研究诈骗的，怎么P2P的，怎么用情绪控制人的，再研究点厚黑学，在办公室里折腾点。</p><p>咱们就这么说，人类中短期对自己有益、长期对自己有害的，你可以看看刑法就知道了。刑法里很多罪名，其实都是短期对自己极其有益，长期对自己是极大伤害，就是这样。</p><p>好，四象限，应该说五象限，说完了。咱们再把知识按种类分类。</p><h2>四 按功能分类与真相类知识</h2><h3>十种功能型知识</h3><p>第二种分类的方法，就是十种功能类型的知识和信息。</p><p>第一个是真相；第二个是方向引领性的知识；第三个是人性心性类的知识；第四个是学术边界类的知识；第五个是高维不确定的知识，或者就说不确定；第六个是工具、方式方法、技能类的知识；第七个是生活生存类的知识；第八个是交流沟通、人情世故类的知识；第九个是见识类、扩展类的知识；第十个就是无用的知识。</p><p>哎，对，刑法里有很多发家致富的方式方法，那都是人类智慧的结晶，哈哈，就看你有没有命扛得住了。</p><h3>真相与认知的关系</h3><p>第一个，咱们说真相知识。真相知识研究的是什么？这个世界到底怎么运行。它关注的不是表面观点，而是底层规律、因果结构和真实机制。这一类叫真相类知识，本身就很少，非常非常少，你这辈子能得到点，不容易。</p><p>上节课刚说完的认知体系：行为来自于什么？来自于思维模型。思维模型来自于认知，认知来自于真相，真相来自于缘分。一定把这个东西记熟，融入自己的生活。所以最重要的是，你要能获得有用的真相。</p><p>说到真相，就要明白什么叫思维茧房。人类要突破自己的思维茧房，本身就是一件非常困难的事情。因为这类知识，只能从更大的思维茧房里面获得，从更高维的。这其实就像天界，一层套一层，像俄罗斯套娃一样。</p><p>想知道我们这层空间的真实东西，得从上层空间获得。但上层空间就一定不是思维茧房了吗？也有，上层还有上层。所以，要破除自己当前的思维茧房，就必须从上一层的思维茧房里面获得知识。</p><p>这是很麻烦的一件事。因为思维茧房的出现，你会下意识地习以为常，觉得现有圈子里并没有出现让你觉得奇怪或者有问题的事情。但是，你发现最终的结果总是很难把握：我按现有的认知努力了、工作了，很多人辛辛苦苦干了一辈子，最后一场空，仍然过不好这一生；很多人做了一辈子好人，也没落到好的结果。</p><p>这就是思维茧房，因为你知道的真相有问题，又没有获得更真实的，或者更高层的真相认知，所以发现不了问题。时间长了，你就会发现：“怎么我按这个做，并没有得到所希望得到的东西？”</p><p>出现这种情况的时候，你就要有意识：你正活在一个思维茧房里，且知道的东西有问题。在这个思维茧房里，很难发现自己有问题，所以导致努力了一辈子，人生还是失败，还是一场空。</p><h3>常见的思维茧房</h3><h4>家庭与学校</h4><p>我们常见的四大思维茧房，第一个是家庭。人类认知第一波被影响，就是家庭。你的父母长辈、亲人，对你进行这个世界的描述，你应该干什么、不应该干什么，都来自这里。人与人之间的关系，对世界的三观，也来自家庭。所以好多人说，原生家庭有问题，容易影响这个人的人生，就是这样。</p><p>第二个，还好，你有出去溜达的机会，年轻时出去的机会就是上学。进了学校之后，认知层次已经不仅来自家庭了。有同学、老师，还有其他同学的家长，有时还能自己从网上获取信息。</p><p>所以家庭对你说的那些东西，有时就不太认可。为什么？因为已经产生了新的信息茧房，不再困在家庭里，有新的信息渠道了。虽然这个渠道不一定多正确，但至少也是一个新的。</p><p>你看，为什么很多妈妈解决不了闺女和黄毛之间的问题？主要是在闺女的思维茧房里，认为黄毛很可爱、很值得信任。但在妈妈的认知体系里，黄毛是很……可是闺女不信，因为闺女没有妈妈的认知体系。</p><p>产生认知冲突之后，谁也说服不了谁，就开始玩脾气了呗。这就是第二个思维茧房。</p><h4>社会与不同圈层</h4><p>第三个思维茧房是社会。进入社会之后，发现对世界的认知、对人性的了解，又不一样了。大家都有公司、有圈子，还有外面的社交圈子，对世界又有一个全新的认知。</p><p>你的老板、同事、朋友，还有外面的社会人士，都会给你提供新的东西。你又突破了学校的认知，产生一个新的认知，觉得更厉害了。这个时候，又进入社会的信息茧房，因为得到的认知只能从这些人得来。</p><p>而且人是分等级、分阶层的。能够给你更好认知的，可能就是这些大老板、小老板。</p><p>包括你出了一个国家，比如韩国——对不起，比如朝鲜人民，对世界的认知和我们就不太一样。我们在七十年代、八十年代——不能说七十年代、八十年代，我们说九十年代、零零年吧，那时候还没有太多网络，还要看《新闻联播》。我们认为的是什么？前二十五分钟，祖国山河一片大好；后面五分钟，国际新闻，外面的人民都生活在水深火热之中。这就是我们的认知。</p><p>所以有时得走出国家，到外面看看世界怎么样。比如现在，我们在马来西亚，也有很多马来西亚的员工出来了。他们还在说：“我们这边娶媳妇之后，要孝敬公婆，要在家伺候。”国内女生听完，瞬间震惊，表示不能接受。</p><p>这时候再看马来西亚的女生，就觉得：“你们果真生活在水深火热之中，还生活在旧社会的封建迷信之中。”你看，这就是圈子不一样。</p><p>但有些男生充满了对娶马来西亚女生的向往，因为国内女生实在拿不下。“马来西亚女生这么传统吗？真的太好了。”所以，多走几个国家，说不定结婚的问题就解决了。解决不了的问题，出去溜一趟，说不定很多事情都能解决，哈哈。</p><p>好，这边也要彩礼，但泰国不要，泰国好像没那么多事。不行，娶个俄罗斯的也行，弄个金发碧眼的，是吧？</p><p>咱们不开玩笑了。社会的思维茧房，又分很多不同等级。比如普通刚进入社会的，跟老油子对社会的认知不一样；那帮老油子，跟我这样的人不一样；我这样的人，跟一些拥有很大能量的人，认知肯定也不一样。</p><p>所以，各自到社会里面的时候，看到的真相不一样。</p><p>真相来自于什么？来自于缘分。你们有的喜欢看网上大V，跑到海外翻墙看大V。人家讲的很多东西，你们觉得很新鲜、很有意思，为什么？其实人家讲的这些东西，不是你的人生。在你的人生、你的缘分里，这辈子也碰不到这些事，包括一些讲政治、社会、历史的。</p><p>我听到这些东西，也觉得很震惊，也很羡慕、佩服人家的认知和经历。当然，要是比跟天道、法界打交道，那我直接甩你几十条街。这是什么？这是我的缘分。</p><p>不同的缘分，造就了不同的人生和能够看到的真相；不同的真相，造成了对世界不同的看法和认知。所以，一定要好好学习。</p><h4>天道认知</h4><p>第四个，你要有天道认知。人间认知再厉害，也没有用，因为很多东西叫人间正确、天道错误。你很可能努力了一辈子，辛苦了一辈子，干掉所有竞争对手，解决所有难题，最后走的是一条死路，有可能这样。这属于不知道天道认知，那就没办法了。</p><h3>破圈的几种途径</h3><h4>多走出去与不同的人交流</h4><p>既然有思维茧房，就要破圈。怎么破圈？说到真相这条，一定要记住，因为有些真相不是你有这个缘分，你才能得到的。很多缘分你没有，很多人的人生你不具备。</p><p>第一件事，多去外面走走，多跟一些人聊天，别跟你同级的人聊天。记住一点：如果跟旁边的人聊天，很长时间之内，已经没有人说出一些东西、看法、思路，让你觉得震惊、意外或者惊讶，那身边这些人，很可能跟你已经进入同一个思维茧房。明白了吧？得通过现象分析本质。</p><p>如果跟很多人聊得很快乐，但是人生已经没有“经验的东西”了，就一定记住，你已经进入一个思维茧房。这几年碰到的人，你把他们拉上一个圈，把这个圈认为是跟现在的我相同，或者比我更低。或者这个人一张嘴，就知道他要说什么，要记住，他的水平小于等于你现在的水平，没有意义。</p><p>你需要多走出去，多看世界，尤其不要只在自己的国家。甭管哪个国家，都需要到外面走走，才能了解世界的真相。我觉得这非常重要，什么风土人情，看看别的国家怎么生活。别去危险的国家，别去。</p><h4>多读有用的书</h4><p>第二，多读书，多读有用的书。有用的书其实很少。比如咱们说《逻辑思维》，还有樊登读书会，这都是公开的、能够读的书。你放心，里面绝大多数知识，都不会对你产生什么人生的提升。说白了，这种圈子已经没有用了，这种作家做出来的书，已经不可能对人类产生太大的帮助，看或者不看就那么回事。</p><p>当然，你是一个新人，值得去看看。如果三十五岁了，他讲的那些知识还能让你震惊，我觉得你本身就是一个问题，就是这样。</p><h4>看海外的视频与不同经历</h4><p>第三，多去海外看一些名人的视频。我觉得海外一些大V的视频还是值得看。有的讲政治、历史、经济、人情，讲得像奇幻似的那种，就不用看了。但是社会、经济、政治，还有历史事件的演变，我觉得对自己都很有帮助。</p><p>这些东西在国内几乎看不到，但我觉得对你们很重要。就像刚才说的，都是源自人家一生的缘分。你怎么修行也没有用，因为没有这个缘分，别费劲了。</p><p>包括你们来我这，听很多东西，我也在贩卖我的缘分。我有这个缘分接触这些真相，把东西看完、总结完告诉你们。因为你们注定累劫轮回，绝大多数情况下，也不可能有我这样的缘分，你放心，不可能有。</p><p>所以只能从我这获得。当然，一些国外大V讲政治，你听完也很佩服，心向往之，确实很厉害。</p><h4>找大哥大姐借助经验</h4><p>再往下，就是找大哥大姐，抱大腿。很多现实的东西，真是寒窗苦读十年，怎么可能比得过人家三代经商？书中的很多东西还是太简单，包括问AI，也好使不了。具体走通一些事，很多明道、暗道、机会，书里没有这些东西。</p><p>所以光读书，光自己了解，光用AI了解，解决不了问题。比如现在我们整个海外支付这套东西，说白了，我自己开个公司，专门帮助别人进行海外支付，都能开始收钱。为了走通这条路，我走了大概将近五年，交的学费多了。被坑、被骗，好不容易走通，发现还不好使，或者钱收完转不出去，或者成本太高、政策变化，事多了。</p><p>如果有大哥、大姐，人家真看得上你，一句话，那是几十年换出来的经验，可以节省你几十年的时间。所以抱大哥、抱大姐很重要，大腿很重要。</p><p>不仅在人间重要，在天界、佛界、神界也一样。人家老大指点你：“不要往这边修，修完上面没什么结果。”那都是几百万年换出来的经验。包括“执手去”，你去攻打第十魔界，那边有熟人，做个样子就完了。没事打他们第一魔界去，那不直接被干？佛祖都被拍好几个，所以很重要。</p><p>你是上面的人，出去溜一圈，混点那个啥……哎呦，操，讲太多了，不能太多。反正抱大腿很重要，要不然咋死的都不知道。很多东西是人家的经验，这一句话就可以“点火你”，一句话也可以把你坑死，而且人家还是正规的，表面上没做着坑的。这很重要。</p><h4>有好老师带着</h4><p>第五，有一个好老师带着。自己分析行不行？你就别想这事了。它又涉及几个问题：我不抱大腿，也不看别人，自己能不能推导出很多规则？能不能靠自己破解？</p><h3>自行推导面临的五种限制</h3><p>首先，这个事不是说不行，是很难，有五条规则压制着你。</p><p>第一个，底层推导上层的规则，不是说不行。你得很聪明，分析能力、洞察能力很强，说白了脑子得在线。能不能行？行，但往上推一层还可以。很多东西是推出来的，不是看出来的，很可能不全面，但能推出来一部分，已经很厉害。</p><p>比如弄元素周期表的，叫门捷列夫吧？对，门捷列夫。通过现象总结规律，直接把元素周期表推出来，确实很厉害。但你想再推上一层的上一层，能推两层，几乎算奇迹；想推到第三层，几乎不可能。从底下往上推，不是说不行，是很困难。</p><p>比如星魂这件事，说白了，距离咱们这个第三十层空间，你拿什么推？推出屎来也推不出来。像大天魂、小天魂，谁跟你说？像影魂，谁跟你说？没这水平，就看不出来。还有本源，更没戏了，都不定多少世之前的事。在人间，能看十世之内的，都算厉害了。但很多因果不是，有些老魂动不动几百世。看不到那么远，很多东西都解释不了。</p><p>第二，时间太长。人家几十年走出来的经验，你短时间之内弄出来，可能性很低。</p><p>第三，成本太高。比如我走海外支付，各种各样的海外支付，基本上都走了一遍。你想穷举一遍，得多少成本？如果没太多活钱，基本没戏。成本太高了，穷举一遍，基本上可能性不大。</p><p>第四，太危险。有些东西一旦走错，就没有回头路了，就不行了，所以不能自己往上冲。</p><p>第五，规则压制。仔细想想，当年我是泥腿子的时候，费了多少劲想往上走，就想多挣钱，就是挣不出来。</p><h3>突破圈层需要新的资源</h3><p>这是为什么？因为原有的人脉、认知、能力，不足以突破那个圈子。原有的东西突破不了，必须引入优质的机会、优质的贵人、优质的资源。</p><p>你看我从一个泥腿子往上升级，升级到阴阳师，咱们就说升级到阴阳师，没有强大的法界支持，根本不可能，别想了。经过将近十年，发展到现在这个地步。如果再想升级，怎么办？还用现有的资源，已经不可能再推动升级了。</p><p>再想升级，就要新的创新，新的可以承载更大量人群的东西，那是什么？叫天道知识，就是人类说明书。</p><p>人类说明书，得上面给你灵感、智慧、感觉，让你看到足够多的真相。不看这些东西，怎么总结？所以也得上面有大号，而且大号还得是比较……懂的东西比较多，至少也得从远古出来。要是最近一两亿年刚生出来的大号，肯定没戏，因为远古很多事没经历，对很多事情都很难推动，也是一样。</p><p>假设通过这个东西，我们的粉丝扩张到几十万、上百万、上千万。如果再往上走，又需要新的资源。这个资源谁给？一定是天道给，包括你累劫轮回里得积累这些东西，没积累肯定积累不了。</p><p>这就是破圈，很难的一件事。真相这行讲得有点多。你们最好想办法多看外面的东西，多看到比现有圈层更高级的东西。</p><p>怎么才叫比现有圈层更高级？他讲的东西足够让你震惊。如果对你没有什么感觉，肯定不叫提升。</p><p>还有，一定要学会抱大腿，抱大腿是所有生物必须掌握的。只要不抱大腿，你放心，他自己能活起来、能破圈的可能性极低，基本上就是穷人思维，不抱大腿，所以一定注意。</p><h3>已有的知识要学会降级</h3><p>真相这一块，还有一点：看大V的东西，刚开始比较有意思，但如果持续说的东西，尤其讲历史、社会的，你分析一下，跟之前讲的差不多，只换一个形式。</p><p>比如贪污，古代讲一些贪污，很厉害；现在讲贪污，就知道谁贪污了，实际上知识点没有升级。今天谁被拿下，明天谁被拿下，你会发现，拿下这个事情没变，只是人变了。</p><p>这个就要降级。记住，要学会降级。</p><p>这种认知已经有了，他只是像新闻一样，告诉你谁又出了问题。今天张三，明天李四，后天王五、麻六，实际上性质差不多。这个知识就把它降成新闻类的知识。</p><p>但有些人讲传记，有很多精彩的东西，你觉得可以总结一下，这个可以。所以一定学会分。别每次人家讲一个东西，张三被抓了，太有意思了；李四被抓了，太有意思了，其实本质、性质没什么区别。比如谁去哪了，一堆人抗议，这不是闲的吗？哪次出行不抗议？知道就行了。</p><p>你心中要把知识归类：它对我算是新闻类的知识，还是认知类的知识，还是真相类的知识？一定学会分类，这样关注点、重点就不一样。别每个东西都听一遍，那你的人生有得……类似的事不是一直在重复吗？</p><h2>五 方向引领性的知识</h2><p>第二个，就是方向引领性的东西。咱们今天肯定讲不完了，真相讲完了。</p><p>方向引领的，还有心性、人性的东西讲一下，留一大串尾巴，咱下次讲。因为直播主要很随性，为了人类说明书，先演播一遍，看看大家有没有吐槽的地方、需要修正的地方。如果没有，我就可以成稿，进入录播，就是干这事，所以就是瞎讲。</p><h3>应该往哪里走</h3><p>第二，方向引领性的东西，决定的是：我应该往哪走？什么事应该做，什么事不应该做？说白了解决这个问题，让人少走错路、少走弯路。</p><p>凡是对人类有用的东西，都不多。那种乐的、垃圾剧，一堆一堆的，什么“霸道总裁爱上了绝经的我”，这些可多了，但真正拍点有用的，很少。</p><p>为什么这类东西少？很简单，谁没事指导你？指导你有什么好处？把你指导得那么聪明，以后怎么好领导你？整个人类社会更希望你们是好用的工具，而不是有思想、有认知、有独立人格和独立思维能力的人。这个世界更多希望你为他们服务，没有人愿意希望你过得更好，就是这样。</p><p>这类知识，比如佛经肯定算一个。佛经指导的是天道之上、轮回之上的认知，用无量劫的时间、轮回之上的角度，帮助大家规避世间的问题。</p><h3>佛经与道德经</h3><p>你应该怎么走、怎么做、怎么规避问题、怎么积累能量，才能更好地活着，这就是佛经要干的事。但是整个佛经的知识点，大概大几十个吧，也就这些，其他都是证明。</p><p>你看空色，像《大般若经》，基本都讲空色，六百多卷吧。实际上佛经上的空色也没讲多深，说白了，让你知道的是世界是假的。</p><p>因为当年要给一帮泥腿子讲。咱们现在知识文化都很高了，你想两千五百年前，印度和中国差不多，读书的人很少。想给连字都不认识的人讲清楚世界是假的，他很难相信。所以当年佛经更多的任务，是让别人相信世界是假的，很难。</p><p>而且那时候流行辩论，动不动辩论输了就以死明志。辩论输了可是要死人的，很严重，不像现在输了还能给你搅和几下。</p><p>《道德经》肯定也算是。道德经说的东西更真实一些，更接近人间实操；佛经说的更长远一些。但马上去修，不一定修出非常好的结果，因为需要积累。越是高维的东西，高维程度越高，正反馈速度越慢，很麻烦。</p><p>所以之前说过，修行有一个叫洛希极限。必须先盲修，修到一定程度，达到洛希极限，超出去了，就发现有感觉了，越修越爱修。</p><p>没到这个水平，怎么修都发现没什么用：怎么我蹦多高，还是被吸引到地球上？超过这个洛希极限，就没事了，终于不用再往下走了，这叫永不退转。</p><p>道经说了很多指导性的东西，但《道德经》也有很大问题：都是结果性的智慧，没说怎么得到，很麻烦。好，这是道经。</p><h3>人类说明书与其他指导性内容</h3><p>第三，我觉得真正愿意说结果性的书籍，我们的东西算一个，叫人类说明书，是指导性的认知。真正未来愿意仔仔细细指导大家，我们的人类说明书算一个。</p><p>尤其逆修觉者这一块，是天道思维、人道思维、人设思维，这三大思维，目前应该是截至现在的历史上，对人类很多东西描写得最细、指导性最强的文字性东西，也就是我们这个东西。</p><p>包括法界天机、灵魂觉者，说的是法界的东西，其实对你也很有帮助。</p><p>还有真相部分，就是一生里面，可能碰到什么东西，哪个阶段碰到什么问题，应该怎么选择比较好。这就是真相的目的，也是帮助大家过关。</p><p>既然一定要做人生的考题，就一定把考试点弄清楚：怎么考，什么时间考，都准备好，并且在这之前尽可能多练习一下，真考的时候也不慌。</p><p>我们的目标，是关心大家这一生过得到底幸福不幸福。我并不关心你给不给我钱，更关心你过得幸福不幸福，这就是我们的东西。</p><p>历史上还有没有人生指导性的东西？也有。比如圣贤，像孔子、孟子、王阳明、曾国藩，他们写的也有指导性，但其实指导了几个点。</p><p>比如孔子的东西，指导性还多一些：什么是君子，什么是小人，应该怎么跟长辈交流，怎么跟友人交流。他定义的比较多，也算指导性的。再说有指导性的，就很少了。</p><p>包括弘一法师，一些哲学家，说的东西也有指导性。但说白了，一辈子可能也就研究出那么几个点，听听也有作用，你说能改变什么？我觉得太小。这就是之前讲的，叫星星之火难以燎原。</p><h2>六 人性与心性</h2><h3>人性与心性研究什么</h3><p>第三个需要了解的知识，叫心性和人性的东西，应该是人性和心性。什么是人性？很简单，解决的是人类遇到具体事情之后，应该怎么做。说细一点，具体事情中，怎么被触发、怎么形成想法、怎么走向行动，又受到哪些原则和底线约束，这些是人性。</p><p>心性是什么？心性跟人性其实差不多。人性研究的是人类的问题；心性研究的是你具体碰到某些事的时候，会怎么被触发，形成什么想法，有怎样的行动，又受哪些原则和底线约束，这是心性问题。</p><p>我们说一下人性，就是遇到事情之后，产生怎样的心情、感受、想法、取舍、决定和行为。一件事触动了人的什么需要？怎么理解这件事？产生哪些互相竞争的想法？哪些最后变成行动，哪些只是想想？会因为什么事情停下来，也会因为什么事情突破底线、破例？这就是人性要解决的东西。</p><p>其过程就是：遇到事情了，这件事对我意味着什么？我的感受与欲望被唤起了什么？出现什么不同想法？怎么判断与取舍？</p><p>行动或者不行动，以及面对后果应该如何做，这就是人性的东西。</p><h3>安全受威胁与利益出现时的反应</h3><p>举几个例子。当人的安全受到威胁，面临危险、失去基本保障，比如饥荒、战争、疫情、洪水，出现这种情况，最重要的是什么？害怕、求生、要自我保护。</p><p>不越界的处理方式，比如求助、防护、寻找自救的方法。但没有底线的人，为了保护自己，甚至可以把伤害转嫁给别人。</p><p>比如人吃人这种事，现在基本没有了，但古代还挺多。史书上也有，像“两脚羊”，古代十国比较多。</p><p>再举一个例子，利益和机会出现，比如有金钱、职位、资源、名气的时候，最重要的是想得到、怕错过、怕吃亏。不越界的行为，就是正当争取、提高能力、协商交换；越界的，欺骗、侵占、隐瞒重要事实，类似的事等等。</p><p>我就不继续说了，因为一说到人性和心性，我估计能说几十集，这是人类需要学习的一大块，咱们就不展开了。</p><h3>影响选择与底线的因素</h3><p>人性的东西比较多。首先，有社会标准。比如现在大家认同的社会标准是男女平等，但古代可不是这样，一定是男尊女卑，甚至觉得女性是赔钱货，家里多几个丫头属于赔钱货。这是社会标准不一样。</p><p>在不同社会标准下，还会有道德、底线的问题。有的人坚持底线，还有担心惩罚的问题，担心干了这事别人会不会报复，还有亲情、友情。</p><p>比如“宁损性命，终不作恶”，如果死我没关系，要死我们家人，这还得考虑一下。</p><p>死自己没问题，死老婆呢？有的可能开心，有的可能难过，但基本不会选择死自己的孩子。所以，不同的人，同样一个事，底线是不一样的。</p><p>还有欲望，有的人对这个东西很有欲望，有的人没有；还有情绪，因为情绪造成很多心性、人性的波动。这些是产生人性波动、选择不同的因素，我列的肯定不全。同样一件事情，不同的人为什么产生不同的改变？因素很多。</p><p>还有群体，比如朋友圈、闺蜜圈这么说，另外一个圈那么说，它不一样。不怕没好事，就怕没好人，就是这句话。包括“家有贤妻，夫不遭横祸”，也很重要。</p><p>比如老公喝多了，要跟人干仗，老婆赶紧上去劝：“算了，你还有孩子呢，跟他弄干啥？”可能劝劝就行。如果老婆说：“干死丫的，操！”说不定气势输了，人生也没了。所以旁边的、身边的人很重要。</p><h3>了解人性先保护自己</h3><p>好，这是人性。了解人性是做什么？学习人性，是了解人类在什么状态下，可能做出什么反应和行动。</p><p>知道人在什么状态下做出什么反应和行动，对自己有什么帮助？你看，这就意义思维了。第一，首先能保护自己。</p><p>我们小团队现在又开始做一些提前预防的事。我知道未来大家生活可能比较艰难，而且越来越艰难。你放心，不会有什么回转，偶尔两三年会有一个反弹，但是未来十五到二十年，大家生活一定越来越不如以前、越来越艰难。</p><p>这个时候，人性极其容易出现问题，我现在就在做防范。同时大家一定记住，十年后和十五年后，极容易发生国家和国家之间的大范围战争。</p><p>为什么？拿泰国来说，以前很欢迎大家投资，你看现在开始追你税，开始清算外国人买的房子。办证的时候，能不知道一堆外国人买房了吗？能不知道很多东西不是租借的，就是用公司持有的？肯定知道。</p><p>为什么那时不收拾你？那时候过得好，没必要玩这一套。为什么现在收拾你？很简单，没钱了，苍蝇再小也是一块肉。等以后连苍蝇肉都吃不上，你想想政府会干些什么？所以一看国家已经开始做一些不太地道的行为，就赶紧跑，别在那晃荡了。</p><p>这就叫了解人性，先保护自己，再学会如何应用人性帮助自己。比如追女朋友，得赶她伤心难过的时候去追；人家正春风得意，你去追，有你啥事？所以得了解女人什么时候容易做出“正确的选择”，这也是人性的一部分。</p><h3>修心性为了保住轮回中的成果</h3><p>修心干的是什么？可以把修心当成桶。桶是装水的，修心的桶装什么？装你在轮回里能够积累出来的好的成果，有两个：一个功德，一个善缘。</p><p>修心性主要修什么？第一，得善，善良；第二，利他；第三，仁，仁义礼智信，这些都得修，都是好的心性。包括人类好的品德、品质，都应该修。还有责任、担当、正义、公正、无私、大爱、包容等等，这就不说了。</p><p>要对抗什么？五毒四心，还有各种负面情绪。修完之后，目标是什么？达到什么状态才是好的心性？有两个东西：一个静，一个稳定。</p><p>静和稳定是修心性很重要的东西。静就是平静，但不能说没经过事。古人形容静的水平：“心中有惊雷，面如平湖者，可拜上将军。”至少不形于颜色，内心有什么变化咱不说，但至少不形于颜色。我觉得这是第一等。</p><p>第二，本身心如止水，经历大风大浪之后，仍然平静面对这一切。不被诱惑的东西影响，也不被愤怒的东西影响，几乎没什么太大的情绪波动。不是说没有情绪，是有没有情绪波动。</p><p>记住，这种东西叫免疫，而不是消除。是免疫，不是消除。最后达到的状态，叫稳定。</p><p>稳定最重要的就是不被影响，也是免疫的一种，免疫的最后就叫稳定。</p><p>当心性没有问题，在轮回里真正能影响你的，是认知、能力和意外，只剩这三个。意外不可能消除。但是知道意外不可能消除，出现意外时，为什么要产生情绪波动？也就稳定了。认知足够高，什么都看过，也就逐渐稳定，不容易做出错误的事。</p><p>当然，不可能不犯错误，但不容易因为心性的问题做出错误决定，你轮回里很多成果就容易保住。不然，成果保不住，哪怕位列仙班，在上面犯一个事，惹的麻烦更大。还不如一个泥腿子犯点事，说白了，杀个人、放个火，也不至于有多大问题。在上位面，杀个人放个火——不是说杀个人放火，是犯点错误，可能动不动就影响一界生灵几千年的幸福。</p><p>所以没有足够的心性，也别要求有更多东西，说白了就德不配位。</p><p>给你更大的东西，只能更大地伤害自己，就是这样。不是说历史上没有人往上走，有，包括法界也一样。各族天骄，最后活到最后的很少。</p><p>天骄最大的优势是什么？极其容易获得成功，获得功力、法力、神通都极其容易。但心性关只要上不去，最后很容易把自己祸害死，死得更惨，还容易惹外面的麻烦，带来全族的伤害。所以这就是心性。</p><h2>七 结尾与后续安排</h2><p>你们一定要了解人性和心性。了解人性、心性的东西很少，《资治通鉴》、很多厚黑学，包括看一些影视剧，都能够部分了解人性和心性。</p><p>我觉得可能等我写完主要东西，到时候可以在真相里面，专门涉及一个人性和心性的栏目，争取多总结一些大家经常用到的东西。也只能说试着总结，这个东西太多，到时候再说吧。</p><p>今天先说到这，一个半小时了，不聊了。肯定没说完，之后再说。还剩下估计半个小时尾巴，也懒得再说了，咱们下次再见。这两天之后见——不是，明天不说，后天继续。好，大家早点休息。</p><h1>问道七 · 意义思维与错误分类</h1><h2>一 开场近况与直播安排</h2><p>大家好，百忙之中又来听我瞎唠叨。还有几分钟，咱们先简单唠唠嗑，正式8点开始。最近直播会比较频繁，因为我正好准备了一批素材，能讲多少就讲多少。大家晚上好。</p><p>那天我还查了一下，我这不脑袋上开了一个天窗嘛，开完天窗之后，能够恢复到我这种好像一点副反应都没有的，还挺少。除了现在有时候自己摸自己的脑袋，手感不太爽之外，其他还没什么太大问题。精神状态还不错，阴阳调和，哈哈。出问题是这边，但最近这边好像头发长得还挺多，不知道怎么回事。</p><p>脖子还是有点费劲。手感不太爽，它有一道疤嘛，至少骨头少了一块，就觉得手感不好。大家晚上好，咱们正式8点开始，不废话。</p><p>还好，幸亏老天爷保佑，不然万一有什么后遗症，没办法跟大家聊天了，可能这一世也就这样了。那天做手术的时候，推进去太快，后来才知道那个不能拖。我刚开始都觉得，妈的，我都没事了，你还让我做什么手术？但后来一看CT确实不行，人家说你别拖了，拖时间长了容易死，就只能推进去了。</p><p>本来说还不行转到新加坡，但新加坡再找人、再过关，又得耽误几个小时。算了，这就是命，不过还非常好。好，咱们正式开始，8点了。我们的导播同志说，你每次都不让大家点赞，这不好。请大家一定要点赞、收藏、分享，也让我们的数据好看一点。</p><p>咱们直播的意义，就是把我自己的想法先给大家讲一遍，先溜一遍脑子，看看大家的反应，自己也反复听上几遍，再进行录播。大概就这么一个意义。</p><p>这几天我一直想赶，老想把这些东西都讲完，后来觉得自己又忘了本心、忘了初心。咱直播就是为了捋一下思路嘛。之前的直播，都是哪天直播，哪天现想今天播什么，没什么章法，想起哪块播哪块。现在要做人类说明书，基础打得差不多了，就把它弄成一个成体系的东西。</p><p>有的东西想得还不是那么完整，也请大家原谅，准备得不太好。因为很多东西都是第一次面世，有想不到的地方，也有想得不合适的时候，包括语言组织也未必多好。我觉得第一遍先走上一遍。</p><p>今天咱们把上一级知识分类后面那几个快速扫一下，主要的就是上面那些东西，底下的其实不是太重要，也没太多可说的，都是人间的东西，就不多说了。</p><p>马上开始的是什么呢？人类犯错误，主要错误可能从哪出来？或者说，你要想成一个大事，需要准备什么样的东西，把什么东西都弄好，才能成大事？我记得冯唐先生有一个叫《成事》，说得很好，不过他只能从人间的层面说，我们更多的是把人间、法界都给说了。</p><p>声音有点小吗？有的人说卡，有的人说不卡，我也搞不清楚，咱们先继续。我估计人类可能犯的错误，今天百分之百说不完。说不完，周一晚上再继续，把人类犯错的东西收一下尾。</p><p>让他们关手机，还有现场给我开声音的，真讨厌，不守规矩。</p><p>可能周二、周三是正式的大课，该讲智慧了。我估计智慧一集应该能讲完，万一讲不完，再拖一天讲。我现在也不给自己定什么目标，随意讲，什么时候讲完什么时候算，不要因为一些规矩影响了随意发挥。到时候速度会快一点。好，咱们继续开始。</p><h2>二 知识分类的后续内容</h2><p>上期讲的是知识分类，用意义法则去分类，就是你学完这个东西到底有什么用。包括我也想了一下，咱们做直播最大的意义是什么？为了帮我捋思路。既然捋思路，为什么一定要可丁可卯地在一集之内都讲完？讲不完，下次再唠点不就完了吗？又不是做节目。如果是录播、做节目，这一集是一集，直播本身就是唠嗑的事。所以我一下子也给自己放松了，没那么多事了。</p><p>上期知识分类没讲完。</p><p>上次讲的是人性和心性。人性和心性太大了，单独出一本书都没问题，不可能在一集里面讲完。我们只是讲一个知识分类：这类知识你必须去看，对你很重要。知道这些事就行了。</p><h3>第四类 学术边界类知识</h3><p>第四个知识分类，叫学术边界类知识。其实很简单，人类所有的知识，就像在一个地图上开疆破土。边界是什么？某一些知识，在整个人类版图里面，最高和最外延的点在哪里，这就是边界类知识。</p><p>比如数学，现在出什么弦理论，这已经算边界的东西了。如果突破，人类整个档次和级别就增高了。所以它不是普通科学知识，而是整个人类对世界的认知边界到底在哪里，这非常重要。</p><p>一些伟人、科学家、哲学家、某个学术的导师，他们在哲学、逻辑、语言、科学体系上，究竟把问题研究得有多高、多深，代表人类的边界到底在哪里，这就称为学术边界类知识。</p><p>比如哲学里面，维特根斯坦说的“语言即世界”，其实在哲学某一个领域里面，基本上算很高的成就了，目前还没有比这个更高的。</p><p>像霍金研究黑洞，已经是很高的理论，目前还没有人超过他。这种东西很多，跟我们日常生活、平常老百姓几乎用不到。大概知道一下就行，别去较劲，因为咱不是搞科研的。你要搞科研，就去看看这些东西。</p><p>包括前段时间北大一个女生，把一个数学难题又解决了，还获得了奖，算是中国籍第一个获得这个奖的女性，非常厉害。这也是数学的一个边界。某个数学难题，大概将近100年没人解决，她把这事解决了，人家很厉害。知道有这么一个事就行，不用知道太多。</p><p>知道这些，就知道人类现在扩张领土扩张到哪去了。虽然没必要到那个边界去，了解一下就行。像数学、物理、化学、天文类，很容易出现边界突破，一突破，就代表人类世界的认知又往外扩张了一些。</p><h3>第五类 高维不确定知识</h3><p>第五个知识分类，叫高维不确定，就是那些看起来非常高、非常深、非常接近终极，但在人类当前阶段，其真实性、完整性、验证性、现实性都还不稳定的知识。</p><p>这也不是说都是玄学，科学、哲学和修行里面都有。比如“万法归一”，万法是不是最终归一？好像也不一定，它是理论上可推的。</p><p>就像人类物理的很多公式，正着推也行，反着推也可以。公式上可行，但现实中不能够实现，做不到。只能按时间轴正向走，按时间轴负向走肯定做不到。理论上正反都一样，实际上只能往正的方向走，不能往反的方向走。所以万法归一也属于可能性。</p><p>理论上应该归一了，但真的能归一吗？不一定。对于高维不确定的东西，只需要用意义思维理解就可以：这东西对我有没有用？现实中有没有用？没有用、应用不上，就边去，不用把它当成一回事，爱谁谁就完了。</p><p>类似“本来无一物，何处惹尘埃”，又对不起六祖，又要用他的东西来弄，因为实在太高了，高得的确应用不上，哈哈。所以每次都拿六祖举例。它也没什么用，包括“无无”，还有像“五五五”，这能不能实现？理论上好像应该有这么一个，但具体跟人间界有什么关系？鸟关系都没有，也不用太看这些东西。</p><p>科学上像暗物质，你说暗物质应不应该存在？理论上应该存在，但目前无法证明。有没有外星人？可能应该有，但有没有，反正也不关我们活得好不好。</p><p>咱们就别说外星人了，身边的这帮神佛仙鬼你都看不着，就在你身边你也看不着，没事观察什么外星人？这些高维的，就在身边差一个维度的人你都查不到，就别关心外星人的事。这属于低维——对不起，高维无用。</p><p>这类理论很可能很高、很真，也可能很接近终极，但没有办法成为普通人很稳定、很确定、能够应用的真理或者手段，实际上知道也没什么意义，纯粹浪费时间，大概知道一下就行。一定记住，甭管谁说的，谁说的都不重要。</p><p>比如我跟你们说的星魂，跟你说完有什么用？好奇听一下就完了，还真去研究？星魂确实挺重要。一个星魂至少管理几十个魂，少的几十个，多的几百个，它的能量和天赋都有总数。</p><p>很可能我这一世有点穷，能不能把其他现在不用财富的分魂的东西调过来？谁来调？星魂去调。但你有相应的手段吗？能到第三十层空间吗？都没有，所以听了也没用，就别扯了。</p><h3>第六类 工具方法与技能知识</h3><p>第六种知识分类，叫工具、方式、方法、技能类知识。这个很重要。之前讲的知识都比较高，实际上不能马上起作用，但这种知识能够立竿见影地解决问题。</p><p>比如看了手机说明书，说不定就会用手机；考一个会计证，就能够从事会计行业；弄一个从医资格证，就可以当医生，给人正式看病。这属于技能类的东西。</p><p>类似的有工具类、方法类、技术类、流程类、软件类、技能类、系统类、操作手段、执行方法，还有现实转化的路径，都属于技能和工具类的书。</p><p>哪怕不会做菜，买一本厨艺大全跟着做做，至少先解决吃饭问题。这些非常有帮助。比如小学生不会写作文，看一本优秀作文300选，说不定就有感觉了；或者词汇大全，说不定能拽出点文了。</p><p>这些很容易立竿见影。如果想迅速改变自己的生活和命运，技能类的东西一定还是要多学。但是它不能提供方向，只能增加你被别人需要的程度，或者增加你应对生活中一些麻烦的技巧。</p><p>工具类的东西本身没有方向、对错，也不决定善恶。它不是方向类的，就是技能类的东西。</p><h3>第七类 生活与生存知识</h3><p>第七个，叫生活和生存类知识，就是人如何活下去、如何活得稳定、活得不崩溃。比如健康、饮食、睡眠、运动、基本财务、安全常识、基本法律、工作、家庭秩序、生活管理。</p><p>这些能够让你活得更好，大概可以看看。我觉得看看也不错，它解决的是生活质量问题。</p><h3>第八类 交流与人情世故知识</h3><p>第八个属于交流类、人情世故的知识，非常重要。因为你活在人的世界里，人和人之间怎么相处，怎么减少冲突、形成合作，这类书籍我建议还是看一看。</p><p>包括说话的分寸、办公室政治，怎么从细微表情、动作看出一个人的情绪和心理变化，我觉得很重要。</p><p>哪怕有些场合上的应酬，怎么表达感谢、怎么不打扰别人，都很重要。还有建立信任、价值交换、识别虚伪、处理冲突、懂得尊重。</p><p>一个人能力可以很强，但说话总让人不舒服，做事不顾别人感受，不懂感恩、不懂分寸，最后别人都不愿接触他、帮助他，也不愿长期合作，再有本事也走不远。</p><p>反过来，一个人可能能力中等，但懂得尊重、配合、表达，懂得给别人安全感，反而更容易获得机会。这类知识很人间化，非常重要。</p><h3>第九类 见识扩展知识</h3><p>第九个，叫见识扩展类知识。扩展知识范围，增加见闻、谈资、文化感，丰富理解素材，让人知道世界上还有不同的点。</p><p>类似《时间简史》《人类简史》《枪炮、细菌与钢铁》，还有很多名人传记、《百年孤独》，大量名著，写得的确非常好。但这些只是表达作者对人生或者一些事物的观点，具体能不能对你产生思想上的很大飞跃、能够提升什么，我觉得不一定。</p><p>这类东西看看就行，不用太浪费时间。一年我觉得看两三本就够了，或者连看都不用看。</p><p>让AI帮你解读一下，大概知道一个情况。别人聊《百年孤独》讲什么，你都不知道，这就有点low了。但需要花太多时间去读，甚至精读吗？我觉得不一定，大概理解就行。</p><h3>第十类 无用信息</h3><p>第十个就是无用的东西，对个人成长、现实、命运、判断、行动没有任何价值。比如低级八卦、网络骂战、情绪垃圾、谣言、低质量短视频、无意义争论、阴谋论垃圾，还有纯粹刺激欲望的信息，纯粹没有价值。</p><p>反而越是这种东西，越占据人很多时间。我觉得这就是浪费生命。</p><h2>三 用意义思维安排学习次序</h2><p>最后做一些总结。这十类知识，如果要改变命运、迅速提升水平，应该先看什么？先看真相类知识，再看方向指引。因为真相不了解，方向指引说多了也没用。</p><p>比如很多女孩不知道黄毛的危害，妈妈给她做方向指引，你觉得她能接受吗？肯定接受不了。所以得先有足够多的真相，再有方向引领类知识，然后看人性、心性的知识。</p><p>这三类真正决定命运，决定一个人怎么看世界、自己和众生，往哪里走，能不能承载正确的规则。这三类没有建立起来，后面建立再多也没用。工具类、生活类建立再多，方向一旦错了，基本全白费。</p><p>第二类，是在现实中马上能落地的，比如工具、方式方法、生存类知识，我觉得也非常重要。</p><p>还有人情世故，这是第二优先级要看的。这三类决定你在人间能不能活得稳、能不能做事、合作，能不能把想法变成结果。</p><p>前面三类是人生大方向，大方向别走错了，但不能解决下一顿饭怎么办。方向都对了，现在要解决吃饭问题，还不如去做个包子店。方向问题不解决吃饭问题，不解决这月工资从哪来。所以第二类也很重要，哪怕多研究研究怎么做包子，也不至于饿死。</p><p>第三类，叫学术边界和高维不确定的东西。</p><p>高维不确定的东西可以看看，代表人类至少某一层次的边界，人类世界的认知扩张到哪里，想得有多高、多宽。少量看就行，因为跟生活没太大关系，不要太多研究。</p><p>少量了解即可的知识，叫见识扩展类知识。比如看看《百年孤独》《人类简史》《时间简史》。</p><p>这些也可以，开眼界，跟人聊天、吹的时候，至少咱博学，哈哈。然后要远离无聊的东西，其实也不能说远离，上厕所、睡觉前需要酝酿感情的时候可以看看，或者吃饭时旁边放点东西、开车时旁边放点东西，属于干这事。</p><p>知识分类最后的总结是什么？人类不是缺知识，而是缺少对知识的分类。</p><p>很多人把高维知识当成当前可用的知识，陷入高维正确陷阱；把短期有效的东西当成真正有用的东西，遭到长期反噬；把见识扩展类知识当成认知提升，生命被大量消耗。</p><p>很多人掌握了工具、方式、方法，却没有真相、方向和心性，最后把错误的事情越做越大；追求学术边界、高维不确定知识，却没有解决现实人生的基本问题。</p><p>真正的智慧，不是知道得有多多，而是知道什么应该学、什么不应该学，什么该深学，什么只需略微知晓；什么知识可以改命，什么东西会耗你的命。</p><p>什么短期有效但长期有害？什么短期无感但长期有大用？所有东西一定要用意义思维去审定。</p><p>我此时此刻看的东西，对我在人生里面起到什么作用？属于哪一类？适不适合当前阶段？能不能落地？能不能在更长时间里产生正向结果？只有经得起时间检验、能持续产生正向结果的知识，我觉得对我们才非常有用。</p><p>知识分类说完了，开始今天主要的东西。先喝口水，叫错误，在错误中成长吧。我还没想好具体叫什么名字，叫成事宝典也行。</p><p>大家先点个赞、分享一下、收藏一下，别费了半天劲，最后连几个分享收藏都没有，数据不好看。我稍微休息，再等几十秒，8点30分正式开始。</p><h2>四 成事中的错误与七个环节</h2><p>你们现在还卡？真奇怪，最近老是卡，逼着我要换地方。我们已经新建了直播间，以后换个地方，不在这个小区了，这小区风水不好，决定换个好点的地方。</p><p>好，正式开始，8点30分。本来想讲意义思维在分析错误上的一些应用，后来想这时间有点太长，咱们先说结论。今天肯定讲不完，就讲到9点30分，讲一个小时，看能讲到哪。</p><p>我们说的是人类在成事上容易犯的错误。把错误都讲了，你不犯错误，不就容易成事了吗？也可以理解成成事宝典。冯唐也有《成事》，人间部分咱们肯定没有人家丰富，但总体框架上，我们肯定考虑更多因素。</p><p>想成功，不是简单一句“这个人太笨、太蠢、太情绪化、没努力”就能解释清楚的。真正看透，要分三个阶段。这不是小事，是人生做一些大事：做事之前、做事之中、做事之后，整条链路得学会拆开看。</p><p>为什么一个人会出错？可能做事之前就压根没有成功条件，也可能从来没有接触过能够让他成功的真相。看到的信息不真、不全、不对，也可能是低维的。也可能分析、学习、研究的能力不足，或者做着做着碰到压力，顶不住压力和阻力。</p><p>最后，有可能身体撑不住了。比如那个是叫张雪峰吧，就属于身体撑不住了。还有把个人情绪和不好的心性带给大家，大家产生反感，导致出问题；有可能用错人、看错人、处错关系；当然也有不会复盘、不承认错误、不愿修正。</p><p>人类犯错误有很多点，不是单点缺陷就完了，而是在整个成事链条里面，任何一层发生问题，都容易出现失真、失控和失效。</p><p>人在条件、真相、分析、研究、执行、掌握、身体承载、心性、情绪、人际关系和反馈修正这些系统环节中，任意一层发生失真、失控或者失效，都会导致判断和行动出错。一旦出错，就要承担失败的后果。</p><p>一个人想成大事，本身就是系统工程。想成就的事情越大，越需要方方面面都不能失败。所以成功的人或者能力、能量巨大的人，你会发现很少。成功的人总是千篇一律，失败的人各有不同，因为不定是在这坎失败，还是在那坎失败。</p><p>比如稻盛和夫、巴菲特、段永平，基本都是一个模子出来的，所以可以做得很成功，而且能够穿越经济周期。马斯克能不能穿越经济周期，都不好说，现在只不过还在势头上。他犯错误的概率不大，但还是有。</p><p>至少在几十条甚至上百条成功因素中，基本全部都要占优，而且不能犯太大的问题，才能保证最终成功的可能性。</p><p>互联网上，尤其海外互联网，能成为很厉害的大V的，能力、心性、品质基本都差不多。反而底下做不起来的，多多少少会有问题。</p><p>就算一时运气爆棚，偶尔成功了，基础素质出了问题，最终失败也只是早晚的事。有点像拼图，哪怕差一块，整个图版都不完整；也像木桶原则，差一块木板，积不了水，就算积上了，早晚也得漏光。</p><h3>成事的七个大方向</h3><p>我们总结了成套体系，需要在七个大部分上注意。还是只说大框，不做细致分析，因为细致分析又是一本书，东西太多。只是让大家了解方向，细致的等未来有时间再弄。什么都弄得特别细，那就别讲了。</p><p>第一，条件和真相。没干事之前，必须提前具备。</p><p>第二，这两个具备之后，才是分析、学习、研究的能力，说白了就是自我迭代。</p><p>第三，执行掌控。</p><p>第四，身体不要出问题。</p><p>第五，心性和情绪。</p><p>第六，人与人之间的问题。</p><p>第七，修正反馈。</p><p>按这七个大方向修行自己，做一个事才不容易失败，不然很容易失败。为什么很多人不成功？</p><p>把这七项都做成功的人很少，七项里面又有很多细节，一会儿再讲。我估计今天条件和真相能不能讲完，都是一个事。底下第二条到第七条，反而不是我应该讲的重点，都是人间的正确、人间的东西，包括学MBA，这些是人间已经掌握的东西。</p><p>人间已经掌握的，咱们不重点讲。我专门讲人间掌握不了的东西，这是我们应该多讲的。</p><h2>五 做事之前的条件与真相</h2><p>第一部分叫条件和真相。为什么放在前面？因为人在真正分析、学习、研究、执行之前，最先遇到的不是会不会做、努力不努力，而是两个更基本的问题：有没有成事的条件？到底有没有看到过真实的真相？</p><p>一个人没有真正的机缘，没有碰到真相的机缘，也没有成事的机会，没有贵人引导、相应天赋、相应福报，又容易被因果业力、冤债、高维对抗、环境和意外干扰，再努力也没用。</p><p>第一部分分两块，一是条件，一是真相。条件这坎，法界的东西会多一些。一个人开始做事之前，或者事情已经开始存在了，能够影响他的东西是什么？首先是机缘，第二贵人，第三天赋，第四福报，第五因果业力与冤债，第六高维对抗，第七环境与意外。</p><p>用到的就是经常说的法界成像。既然读了《道德经》，就知道“天下万物生于有，而有生于无”。什么是阴阳，什么是有无？学了咱们很多东西，一定要明白。</p><h3>法界成像与盲目跟风</h3><p>任何东西，阳间呈现的叫显化，但在阳间显化之前，法界必须提前成像。这就是我为什么不希望大家盲目跟风的主要原因。人家做成功了，你就去做成功，这不可能。</p><p>马云做成功了，你试试，就算各个条件比马云高，没有人家的气运和法界成像，也做不成功。比如我这行，应该算做人类说明书这一块，再大的努力，想超过我，可能性也没有，因为你身上没有法界成像，没有那种成像机制。</p><p>法界没有成像，再努力也不可能成功。对于绝大多数人类来说，时间基本就放在了根本没有这命、没有这运的东西上。</p><p>我有时候一直说，“王侯将相宁有种乎？”从人间层次说，不应该有，但从法界说，的确有。别管出生是什么，哪怕像朱元璋，出生就是一个碗，家里都饿死了，只要法界能成像、有帝王命，走着走着一定能当皇帝。</p><p>别管出生家庭多好，没有当帝王的命，再怎么努力，再怎么“布化”，这事也跟你没关系。本身不具备，就别在那扯。</p><p>人类不知道法界成像是前提条件，很多人把一生浪费在这些没有意义的事情上。所以一定要抓好自己的气运。尤其心念很高，觉得此生不平凡，不想做普通人，一定先确定是不是气运之子、气运之女。如果不是，把自己定义成能够抱老大大腿的人，也能沾光。</p><p>大哥大姐的大腿抱不上，踏踏实实做个普通人，别想太多。人类大量痛苦，就是在根本不可能的道路上努力。</p><p>比如学习，很多人认为逼着孩子学习，学好了就能改变命运。你们家孩子是不是学习那块料，心里没点数？比如我儿子，他就不是学习这块料，现在还上幼儿园，我就知道这事。你觉得我会逼他学习吗？根本不可能吃学习这碗饭。他能把老爹的事接班，我就阿弥陀佛了。所以不要让他在不可能成功的事上努力。</p><p>第二，很多人一生都想创业。你有创业的命，有挣大钱的命吗？不是那类人，就别想。创业能做多大也很重要。创业能成功，就去创业；不成功，别在那混。经济好的时候，混混也行，大不了半死不活，不亏钱还不至于。</p><p>但经济大萧条的时候，想创业成功，说白了，不是玩野路子的，不是资源很厉害、优势非常强的，尤其在互联网上，不能在某一个细分行业数一数二的，就别扯这蛋了。浪费自己时间，浪费家里财力，也浪费很多人。很多人追求了今生根本不可能追求的东西，所以一定记住，法界成像很重要。</p><h3>积累之财与自己的挣钱方式</h3><p>就跟我似的，能不能有钱？首先要查法界成像。你的有钱，是积累之富、积累之钱。未来积累足够多，还算有钱人。但以我现在都50岁了，估计怎么也得10年、20年后慢慢积累，因为钱属于积累之财，跟暴富命没关系。</p><p>所以别想这事。有人说，师父，不行去投资点东西吧。你看看自己的命盘，只能靠事业宫，通过做事提升命运和财力，紫微上写得很清楚，没事投资去？</p><p>投资的本质是什么？别人帮你努力，你坐享其成。有那命吗？命局的挣钱格局不是这个，投资能挣到钱？包括我们用仙家给很多人看股票，你看我买过吗？没这命就别使劲，踏踏实实干活就完了。</p><p>一定跟自己的东西对上。至少我这辈子还算能通过几十年努力挣点小钱，大钱肯定不能挣。一会儿说天赋，我就很郁闷，这他们的，这种天赋都注定不能富。</p><p>太有钱不可能，尤其太早有钱，你还会传法吗？没事研究这东西？不经历点苦难，能让你想出来？所以肯定得先穷。等快咽气了，一看，终于挣了点钱，妈的，也没来得及花，嘿嘿，这就是命。</p><h2>六 机缘之一 遇到真相的机会</h2><p>第一个先说机缘。机缘拆成两部分：碰到真相的机缘，成事的机缘。一个解决能不能见到真实的东西，一个解决能不能遇到能成的事，这是两个东西。</p><p>碰到真相的机缘，还不是真相，只是能不能碰到真相的机会，非常重要。之前讲过思维茧房、破圈，破圈很重要。碰到真相的机缘，是指有没有机会接触能够让你飞黄腾达、真正有用的东西。</p><p>还是举海外一些大V的例子，讲经济、政治、历史、国情、现实、世界新闻的，人家的见识不是你想学就能学。没有那个命、那个机缘，想去撵他们，根本撵不上。</p><p>人家讲的东西，你就觉得，都从哪听的？太有意思了，听得如痴如醉，听完觉得学习了，这是海外大V非常厉害的地方。</p><p>咱们讲天道认知也是一样，想超过我的水平挺费劲。十多年里面，我见过的东西也不是他们能看到的。没看到这些，怎么产生相应认知？别费劲，有什么样的机缘，就能看到什么样的真相。一旦看到，就会产生不一样的认知；认知能超越别人，就非常厉害。</p><p>真相至少分成三种。</p><h3>跟风真相 行业真相与高维真相</h3><p>第一种，叫跟风真相。现在可能比较难弄，但当年百度、新浪、淘宝、快递行业、电动车，还有可回收火箭，这都叫跟风。比别人更先接触这些东西，就很容易把海外先进的东西引入国内，这是90年代、00年代那帮人干的事。</p><p>百度、新浪、淘宝、快递、电动车，还有现在玩火箭回收的这帮人，不都是抄外国的吗？这叫跟风下海。能见到真相，在我们那个年代就很厉害。</p><p>像百度，我们那会儿还努力用调制解调器上网，插根电话线，嘣嘣嘣嘣，弄一堆事，最后上网了，还特别慢，偶尔打开几个网页就觉得很厉害。人家在美国，早经历过这些。没有人家那个经验，也没办法。</p><p>第二，叫行业真相。还是外网那几个很厉害的大V，讲政经、历史、经济、人生，没有一定高度的接触，根本不可能讲出来那些东西。所以非常重要。</p><p>第三，我们这种叫高维真相，天道之事、法界之事。真相大概分这几类。</p><p>想成为一个行业的翘楚，至少要接触行业的顶级真相，不然想成大事，绝对不可能。包括国美也是，人家赶上机会。能看到真相的人所创造的东西，也没什么太新鲜。包括我，我相信比我聪明的人很多，假设他们能够看到我所看到的真相，相信总结得会比我更厉害。</p><p>网上这些很厉害的大V，比他们总结能力更强的人，一定存在，只不过没那命。像人类探索世界，先看到足够多的真相，再归纳、总结、找规律，最后形成一套体系。</p><p>只不过人家有机会接触，你没机会接触，想成体系，对不起，做不到，不是脑子好使就可以。</p><p>所以为什么我说，真相来源于缘分，修行最终就是一场善缘，这很重要。什么东西跟你有缘，什么允许你超过别人、看到更有用的东西，就决定高度和方向，也决定努力有没有价值。像我这样能看到天道真相的，只不过有机缘能看到，你没有而已，所以修一场善缘非常重要。</p><p>做不到怎么办？只能一辈子在低维信息圈打转。接触不到真正的人、法、规则、门路，也接触不到真正能让你开窍的东西。这不是努力不努力，努力也没用，只是没有碰到真相的机缘。</p><p>一个人没有碰到机缘，可能学了很多东西，但都是浅的、碎的、假的、普通层面的。可能非常努力，但也只能在低层次循环。</p><p>碰到真相的机缘，看的是有没有机会接触真正接近本质、规则、高维、核心的东西，最后一定会让你产生独特、惊艳、数一数二的优势。</p><h3>怎么判断圈子能否帮助自己突破</h3><p>怎么判断遇到了很好的圈子？很简单，听别人讲的东西，对你是一种震撼，是一种渴求的状态。跟这个人在一起，有可能提升认知。</p><p>怎么判断自己成为了别人渴望的圈子？现在你说话、讲话，一堆人围着愿意听，并且很饥渴，想得到你的知识，你就成为别人期望遇到的圈子。</p><p>怎么判断自己一直处于平庸中？认识的所有人说话时，已经没有任何新鲜感，没有对知识渴望的情绪波动，一切都很平常，就代表这个圈子给你产生的知识或者认知，已经很难帮助你突破，就这么简单。</p><h2>七 机缘之二 遇到能够成事的机会</h2><p>第二，能够遇到成事的机缘。成小事靠福报，成大事靠天运。正好细谈一下收入。收入是揣到兜里、能够拿回家的钱，不是流水。</p><h3>年收入十万元以下到一百万元</h3><p>第一个，年收入10万元以下。我觉得费不了多大福报，就凑合活着，踏踏实实活着，什么都别想，做到这件事就行，以最低生活标准活着就可以了。</p><p>第二，年收入10万到30万元，尤其接近30万元的，在普通大众里面已经算优秀者。如果房车都有、没有贷款，在中国这个环境里，应该是生活非常舒服的阶层。大事做不了，但小日子只要不嘚瑟，还是挺滋润的。</p><p>偶尔吃个小烤串，没什么问题。比如明天我又要喝小啤酒，所以今天讲不完，明天也不讲，不能耽误我喝小啤酒的时间。属于这样，大钱没有，小钱还有一点，也能让孩子上上学，但别指望太大投入和支出。家人没有太大病灾，或者想实现的东西，还是可以的。</p><p>国内不要富游，一年一两次旅游问题不大，出国有点穷游，但还可以。这是年收入30万元以下，还是挺不错，而且税务局也不会找你，也不会有人盯着什么事，所以30万元以下工资还是可以的。</p><p>如果年收入达到30万到50万元，就叫小有成就。普通工人、打工的人想达到这个生活水平，尤其在经济大萧条的情况下，已经算很厉害。</p><p>很多大厂员工能达到年收入30万到50万元，已经是在优秀的人里面比较优秀的。如果年收入50万到80万元，一般是什么水平？得是985或者211、博士以上学历，还得是热门专业。咱不说超一流985，清华北大不算，说普通985、211博士，还要热门行业，普通行业基本做不到。</p><p>50万到80万元，国内的还行。80万到100万元，就得比较好的，比如清华北大博士、热门行业，或者海外名校博士、热门行业，能回国基本是这个。但都在海外博士、热门行业了，没事回国干什么？我也不知道咋想的。</p><p>100万元，请大家记住，对于人间界是很重要的分水岭。对普通人，基本就是一生的天花板。这是收入100万元，不是流水，不是公司流水。打工能达到年薪100万元，绝对万里挑一，非常艰难。</p><p>自己创业、做生意，年收入100万元，也得有一定的机缘机会。</p><p>比如得有比较厉害的特长，或者进入很厉害的行业。我年轻时，房地产还比较热，那帮小老板、包工头赶上好时期，年收入100万元问题不大。</p><p>记得当时中关村理想大厦刚开工，一帮小工头开着小面包、破桑塔纳来。</p><p>理想大厦盖完，装修都完了，这帮家伙基本换车了，要不宝马，要不奥迪A6。大概这水平。必须有很厉害的特长，或者进入较好的行业，正好赶上行业上升期。</p><p>要不就是有大哥大姐带。比如深圳的“水杯市场”，可以没学历。我见过给人干活、拉车的小伙子，嘴勤快，人也勤快，看着踏实，大哥大姐叫得很好。人家说什么东西归你了，给了一个机会，100万元挣到手，很容易。</p><p>但这是不打工的。打工想挣100万元，远比创业、做生意挣100万元难得多。到100万元这个阶层，多多少少得有点机缘、气运和能力，普通人已经很难了。</p><p>从100万元以上再说，就会发现不是靠能力，而是要靠一定气运。收入幅度越高，需要气运足够多，不是说能力很强。当然，能力也很重要。</p><h3>年收入一百万元到一千万元</h3><p>100万到300万元，年收入能够到300万元，拿回家这部分钱能到这个水平，需要在一个行业里面小有成就。至少在一个小城市，或者比较好的县城，普通县城还达不到。</p><p>在一个小行业里算比较知名，一提这个小城市、较好的县城，比如做洗车的，你们家是老大，恨不得得这样。没有这个东西，都不太容易。</p><p>300万到500万元，所需福报是另外一个层次，基本在中等城市里能做得小有名气。真拿500万元回家，生意怎么着得做一两千万、2000万到3000万元左右，还得是利润率较好的。</p><p>做电商，很可能做到5000万元或者1亿元，能不能拿500万元回家还是一个事，大概这样。</p><p>500万到1000万元，注意，1000万元又是一个坎。福报能够上升到拿1000万元入自己口袋、拿回家，生意至少得3000万到4000万元以上体量。做三四千万元，拿1000万元回家，已经算暴利了。这里说的不是销售额，是收入。</p><h3>富贵年限与福报的案例</h3><p>每年能够拿1000万元以上回家，已经不是普通人的区域。就算天界之上，也必须上仙以上级别。</p><p>比如之前说过东北一个学生，也不能说学生，人家没跟我学，是客户。一个长得很漂亮的大眼美女，我看她一年挣100多万元，现在肯定挣不到了，也就10年气运。长得漂亮，能挣钱，也有朋友帮她，主要也有朋友帮。大概是200年守护一个村庄。</p><p>这个功德换了大概10年左右、每年100多万元净利润的福报，也就这水平。长得真挺漂亮，眼睛很大，我见过本人。没见本人时，我还怀疑那眼睛是不是特效弄的，见过之后发现真不是特效，确实挺大。所以一定记住，很难。</p><p>记得还有一哥们，以前一个女同事的老公，好像跟着餐饮协会的老大混，当时给他很多资源，也是十年富贵。那十年里，我估计一年肯定上不了500万元，也就两三百万元。爱嘚瑟，换换车，也就这水平。</p><p>这是什么？前世一世在佛前供灯，换了可能不到10年富贵。之后好像做人把上面领导得罪了，人家不理他，不给资源，马上打落尘埃。</p><p>如果一年挣100万元以上，普通人大概得修行一辈子，换那么10年；那只小狐仙200年换10年，大概这水平，很不容易。</p><p>每年能拿1000万元以上，天上至少得上仙以上级别才有这样的福报。普通仙人能够拿三五百万元，就算很不错、很厉害了。</p><h3>现场延伸 灵魂等级与上古神兽</h3><p>尤其天界小婢女、小丫头、小金鱼、小灵兽，想换这个很费劲。看你们又说天庭财神殿的，人家神兽级别不一样，人都上古年代的。</p><p>上古之前没有人，只有两种生物，一种天生灵物，一种神兽。包括女娲、伏羲，有一个像，腰部以下蛇身缠在一起，上半身是人。</p><p>所以那个时候，大家还没选好人应该长什么样，没有决定出来，就没有人。我徒弟说人家是畜生，说这话被人抽活该。应该说神兽，而且上古神兽，不是上古神兽，说白了没有用。</p><p>师门也一样，真正业绩好的，还得是之前很厉害的，比如我之前左右护法。级别如果低，根本撑不起重要的事。</p><p>我这种没什么财富，但传法这事能撑起来。我当年是什么？至少是“第十三海的界主”吧，相当于第十山海界的一界之主。才有这种灵魂级别，普通人想弄不行。手底下做得比较好的，也都是一界之主，只不过第十山海下面的一界。那时候打位面战争，很多位面，你至少得一个位面之主，福报等级和各方面才行。</p><p>又有点说多了。很多事跟普通老百姓没啥关系，凑合过着就完了，别想那些。真正改变世界、大富大贵的，哪个灵魂等级低？甭管出生可能就是泥腿子，说白了没有灵魂等级低的。能挣几十亿元，灵魂等级能低吗？</p><p>所以当年只能说人家神兽，不能说畜生，这肯定不对。</p><p>像观音，也是先天灵物，就是一块紫色玉石；孙悟空不也是先天灵物？“造化金良”也是先天灵物。狮驼岭那仨，哪个水平低？不是先天灵物，是先天神兽。像唐僧、金蝉子，洪荒十大凶兽之一吧，创造的杀戮少了？</p><p>上仙不是星君，还差一级。扯多了，跟你们一开火车，就不知道开哪去了。</p><h2>八 更高收入层次与气运的讲述</h2><h3>年净收入三千万元与行业位置</h3><p>我们说3000万元。每年能踏踏实实拿回3000万元，需要的福报和气运完全不一样，最基础也得星君以上级别。</p><p>我在北京接触过做地产的小老板，自己包地、建楼。房地产好的时候，一年做一两个项目，都结算完净利润大概三四千万元，也就这水平。</p><p>做一两个小区，不是多大的小区，里面可能四五栋楼，了不得了，都结算完，能拿回家的可能3000万元，差不多。</p><p>你们想听那些东西，等讲法界天机再讲，不许给我拉偏。现在讲的是非封建迷信的东西，不能讲太多。以后讲洪荒时期的事情再说，可有意思了。</p><p>记得前段时间有些断卦还说鸿钧老祖属于邪教，为什么会出现这个情况？上面有一部分人也这么认为，属于理念不合。等讲《山海经》时，再跟你们说。</p><p>一年挣3000万元，需要星君以上的福报。为了挣这点钱，要打通银行、政府、市场、销售手法、促销各环节，还有自己的团队。智慧等级、团队等级都非常厉害。</p><p>达到这个级别，在小城市或者中等城市，行业里算得上一号人，基本能算number one。</p><p>前五名吧，前五名没问题。在大城市，至少地产圈提一下，圈里人知道有你这么一号人，才行。这是3000万元。</p><h3>五千万元到一亿元及更高层次</h3><p>一年能拿5000万元到1亿元回家，算比较高级的星君。一定记住，星君等级划分跨度非常大。真君基本下来可能性很小，威压和能力比较大。</p><p>你们能看到在人间折腾出来的，星君比较多。半佛级别，我也曾见过一个，大概4家还是6家上市公司，就这水平。人家的脑子、福报、手段、人脉确实厉害，也是泥腿子上去的。</p><p>一年能拿回家5000万元到1亿元，就是比较高级的星君。</p><p>在大城市的小圈子、小行业里，基本能排前几名。一年拿1亿元回家，产业可能得做到10亿元左右，拿这么多钱回家挺费劲。</p><p>再说普通人能接触到的，一年拿1亿到9亿元回家，产业至少得将近百亿元。</p><p>包括像王健林这些人，也不可能每年分红直接拿回家。只能说股份、资产很高，但真敢稀释吗？也不一定。股东分红都往兜里揣吗？也不敢都揣。基本上你们能见到的绝大多数人。</p><p>顶天了，净收入在1亿到9亿元，已经很厉害，产业基本得做到百亿元左右。在国内某个行业应该算老大。中国代工厂比较多，整个世界里面，有些代工厂、产业都能排前20。</p><p>一般都是比较顶级的星君以上福报，或者初级真君以上福报，才有这样的福报。不是这个级别，很麻烦。他们下来也不可能把所有功德福报都带下来，带一部分能达到这程度，也就这水平。</p><p>为什么这些人一定是这个级别、在天上有说道？他们干的事不是想干就能干，基本代表这个国家在某一个行业的代言人，属于天道在人间设立的某个行业、某个方向的代言人，带领这个国家的人类往某个方向走。</p><p>这种人要承受极重的天道气运，代表天道在人间的一些规划。再往上，一年能拿10亿元以上的，在全球范围内某个行业都得算很厉害的老大。</p><p>比如福耀玻璃，老大也不能说一年给自己分红10亿元，也不敢这么分红，已经很厉害了。相当于整个地球人类在某个行业全靠他领军。没有这种气运，不受天道加持，想玩多大，可能性不大，这才叫气运之子。</p><p>一年能拿100亿元回家的，咱就不考虑了。</p><h3>行业使命与应运而生的说法</h3><p>马斯克估计都不见得拿100亿元回家，还不敢大量稀释自己的股份。</p><p>像马斯克，不用说了。因为人类未来两条出路，一条是逆修觉者。我决定你死后能不能升级到更高位置。马斯克决定的是什么？万一人类活不过1000年，800年后完蛋了，他做的事情能够把一小部分人类带到火星，不让人类断绝，是人类气运。他这事情决定灭世的时候，整个人类能不能留下种子。</p><p>能不能留下种子，是很重要的事情，所以他气势如虹，天道气运加持在这里。我们也是一样。</p><p>比如曾经的马云，代表网购行业，他是老大。但把这个行业做完，就不代表这个行业，完成历史使命、天道使命了。剩下只要不嘚瑟，没什么太大事。</p><p>要嘚瑟，老指点江山，估计还是有人收拾你。像刘强东，虽然也做网购，但解决快递速度，基本创造了人类最快的快递速度，这是他的功绩，很大，代表一个行业在人间落地。</p><p>比如《推背图》第四十四象，叫“日月立天，群鹰慑服，百灵来朝，双语四足”。我问你，双语四足是什么？是一个生物。这句话很奇怪，前面正常，最后一句“双语四足”，前不搭村后不着地，怎么突然蹦出这么一句？这就叫寓言。</p><p>寓言是什么？让不应该听懂的人瞎猜，让能听懂的人知道这人是谁。“双语四竹”是一个生物，如果本源是这个，一听就知道说谁；本源不是这个，听完也在瞎猜。我可没说是我，不许瞎猜。</p><p>如果不是应运之人，听这些寓言故事全部是瞎猜，没有意义。</p><p>这很重要。这个人传法，过程中想成圣，你觉得努力就完了吗？想都别想。能够成为改变众生、提高整个人类智慧和思维等级的人，如果不是应运而生，想都别想。</p><h2>九 财富成像与转命的例子</h2><h3>鸟窝与四个金蛋</h3><p>讲了半天，讲的是什么？有没有干成这个事的气运。多少收入对应什么福报等级，要有什么气运。没有这气运，就别想，根本不可能。</p><p>比如之前说，我的财富是鸟窝里面四个金蛋。也就是说，以后至少同时干四种收入，都能够挣钱，这是我要做的东西。</p><p>但很可惜，只是一个鸟窝。人家厉害的，直接一大金元宝，或者金山，财富在法界成像是那样。咱就四个金蛋，还行，至少比鸡蛋大点，跟鹅蛋差不多，没有鸵鸟蛋大，但比鹌鹑蛋强多了，哈哈。都是蛋，大小不一样。</p><h3>转命与紫微中的条件</h3><p>有没有例外？原来没这个命，通过修行有了，也有，比如大家了解的袁了凡，这叫转命。</p><p>之前用紫微比较少，八字里能不能看出转命，我不太清楚。但紫微里面比较容易看到，一个人有没有转命的可能。比如命宫有右弼、迁移宫有右弼、来因宫有右弼，都具备转命、改变命运的条件。</p><p>没有，只能小步升级或者减少破坏。右弼这颗星在这三个宫位，至少有改命的可能性。但一定注意，右弼必须在水位或者木位，力量才大。在金位、火位，力量不大，只是小幅改变，不会改变多厉害。</p><p>没有气运或者过运的人比较多，比如唐伯虎、李白、孔子。孔子一直想当官，谁都不要。还有苏轼，一直在被贬的过程中，比较郁闷。咱们绝大多数都是普通人。</p><p>别说承载天地气运，有足够多福报，已经很不容易。所以做事之前，一定先看看法界有没有成像，有没有匹配的成功可能。没有就别太费劲，尤其已经走B运、C运的，很多事别多想、乱想。</p><p>法界不能成像，就没有这个影像。想做上市公司，没有这个命，就别扯淡，别以为我命由我不由天，所有东西都是天定，别费劲。</p><p>但如果是A运，建议先不要查，因为很可能做事就失败。比如我，2025年之前，做的所有事情基本都是为了打地基。要允许失败，不失败、不受挫，对未来成就是有问题的。</p><h3>称骨与人生起伏的讲述</h3><p>再多说点，可以看称骨算命。不要看前面那个东西，要看走运的部分。有很多三两多的，也有资产上亿元的，不要光看批文。之前说骨重越重，富贵、财气越好，但这不确定。</p><p>比如说“好一个抓钱手”，有这句话，至少一个阶段财运还不错。</p><p>之前一个山西朋友，忘了三两几，三两七还是三两几，有句“好一个抓钱手”。那小子挣钱速度还行，只不过后面气运败了，都被他败了，也就五年左右富贵运。虽然一些亲戚在政府或者企事业单位高层，但基本不管用，自己把福报败光了，很可惜。</p><p>看这个有什么好处？知道两点。第一个，说低于六以下的人。你看我称骨算命是六两二，我上一个、以前老板是六两一，六两一明确是大富之命。</p><p>六两二是什么？属于清流，说什么“锦鱼一时”，不是，你要看后面的解释，一看就是前面没什么戏，越往后越好。比如我50多岁“天赐麒麟送老”，至少说子女运不错。六两二先别关心多富，至少人生前面狗屎，后面越走越行。</p><p>但低于六两的，如果已经过了40岁、45岁或者50岁，基本后面没什么运，大概这样。比如四两九，我经常拿它说，因为很有意思，是M型的运。</p><p>前段时间给一个学生看紫微，他也是四两九，发现真的就是。两个运中间，30多岁到40多岁被砸下去了。四两九的人生M型，有两个波峰、一个谷底，会出现这情况，很有意思。</p><p>大概看看就知道。如果没有上六两，一定记住，45岁或50岁以后少嘚瑟，基本没什么用。四两九要注意M型，第一个成就之后赶紧把钱搂兜里，别拿出去。</p><p>像历史上越王勾践，还有史玉柱、乔布斯，都是典型的四两九、M型人生。还有明朝土木堡之变那个皇帝，“大明战神”，也是典型M型。之前当皇帝，之后当俘虏，回去又当皇帝，我觉得太神奇，谁也算不到，太厉害了。</p><p>有时大概看一下命运格局就行。有的人虽然一定会有奇迹发生，但不一定所有人。</p><h2>十 机缘的总结与后续课程</h2><p>总之，不是所有事情都值得做。这类机缘不是看有没有努力，而是这件事在法界上有没有被打开，有没有成功可能，有没有值得投入的口子。没有机缘，硬做就属于消耗。</p><p>有机缘，再考虑后面的分析、学习、研究、资源、方式方法、执行，才有可能做起来。前面的东西没有，肯定不行。所以遇到事，先看有没有机会，真的有没有成事的可能。</p><p>机缘不只是气运，而是有没有真相的入口和成事的入口。</p><p>本来还想多讲点，这个贵人都没讲完。今天先这样，周一晚上再嘚瑟。</p><p>周二、周三，我看看智慧有没有总结好。这个基本都总结好了，不用再看，周一直接上来讲就完了。智慧这几天可能要捋一下，捋完，讲完这个之后就讲智慧。</p><p>今天又白活太多，瞎白活一堆，被你们打乱了。坏事的都是你们，没事老想知道神奇的东西。还有想知道鸿钧老祖的，这不能跟你们说太多，是法界天机时讲的事。</p><p>好，今天就到这里，大家再见。</p><h1>问道八 · 意义思维：重新看懂成功与失败</h1><h2>一 开场与本课安排</h2><p>大家晚上好。我这抓紧时间往外输出，希望能给大家带来不一样的东西。</p><p>什么，最近吃胖了？明天去买个减肥药去，叫什么司美格鲁肽，对吧？好像是类似的东西，要打一下。这两天有点压不住食欲了。声音小吗？大家看看。吃嘛嘛香，也是上岁数了，做点大礼拜，腰酸背痛屁股疼。</p><p>好，八点了，咱们不耽误大家时间。本来今天还是想继续讲成事、人类犯错误的一些条件。</p><p>自己总结好了文章，从家出来的时候忘了发到本上。还好本上有一些之前写的东西。今天肯定也讲不完，基本上可以把成事有关法界的那部分讲完，我估计没问题。明天晚上讲成事的人间那部分，它也是很重要的一部分，东西还挺多。</p><p>但我不会讲太细，因为人类本身已经总结得很不错了，我就告诉大家哪些方向一定要注意。成事本身是一个非常大的工程，不可能一两集讲完，所以大概给大家列个方向。涉及法界的东西，咱轻车熟路，就多讲讲；涉及人间的，留到明天晚上。本来想今天一起讲，估计讲不完，而且稿子忘了放到我的 iPad 里，明天继续。</p><p>周三记住，是大课，正式开始讲智慧，讲完智慧再讲修行。智慧和修行都是大课。讲完意义法则之后，知识分类、成事分类，属于花絮，或者说知识拓展，不算大课之一。结果一个拓展讲了三次，你这玩意闹的。</p><p>好，咱们开始。昨天讲到哪儿都忘了，好像讲的是机缘。今天开始讲第二，贵人。</p><h2>二 贵人与破圈的机会</h2><h3>贵人怎样在关键节点拉你一把</h3><p>贵人是什么？可以在关键时刻提携你、引导你、点醒你、拉你一把的人。有时候生命中还会出现非常神奇的贵人，比如一些奇人异事，或者你怎么都想不到，还会以这种方式帮你。</p><p>现在马来西亚有一个美女，她就发现，曾经的暗卫也变成了她的贵人。很奇怪，正常情况下你不接触这个暗卫，不知道人和人之间的关系还能这样。</p><p>接触之后，有些之前不敢想的事情，就可以想到、可以去做了。没有这种人存在，你还做不到。只能说天下之大，无奇不有。</p><p>之前类似死士营那种。咱们有些学生，比较往前的前世位高权重，有自己的暗卫和死士营，坚决执行主人的命令。你会发现，这个人一见到咱们学生，就言听计从，基本没有反抗的思维。两个灵魂碰到了，就勾起曾经的前世记忆，很神奇。是谁可不能说。</p><p>再继续说，贵人可不是普通人脉。普通人脉只是认识，贵人是真的能帮你打开一扇门，少走弯路，看清规则，避开大坑。很多人不是没努力，也不是没能力，而是没人点他、带他，没人把关键的门打开，所以今生无缘。</p><p>你越干大的项目、大的事业，越会发现：不知道从哪个犄角旮旯蹦出这么个人，结果他就能把这事解决了，很厉害。</p><p>我们经常碰到的问题，之前已经说了，人类本身活在思维茧房里，也活在状态茧房里。你是什么级别的人，就会碰到什么样的问题。想用现有资源破圈，很难。你看，有很多这样的死循环。</p><h3>换房与资金的循环</h3><p>比如你想提升财运，但发现住的房子风水不行，财气不足，就想换个有财气的好房子。有没有？有。关键是你有钱换吗？这不就变成一个死局了吗？</p><p>因为住的房子不行，才没钱；想换个有财气的房子，又需要先有钱，这不就成死结了吗？很难突破。那就剩几个方法，第一，慢慢积累。比如这个房子值一百万。</p><p>我一个月挣一万块钱，就啃馒头，十年怎么着能挣到这钱了吧？能挣到，但是等你钱够的时候，房子升值了，或者早被别人买走了。好房子不等人，你看着好风水的，得想办法直接拿下。要不然，就只能铤而走险，做一些有危险、有风险的事情。</p><p>那也能破圈，但代价很大，后患无穷。说不定做完大概率得出事，就算成功了，也有很多后患。大家都明白，你可以看看刑法里的那些方式，都是来钱速度比较快的方式。</p><p>这个时候，假设有个贵人说：“小李，没事，哥借你钱。房子不是一百万吗？先借给你一百万，你以后慢慢还，先把这风水弄上去。”这个就是帮你破圈的人。</p><p>住到好的房子里，挣钱速度从一个月一万变成三万，可能三四年，这一百万就还清了。但不住这个房子，你就发现想挣这钱挣不到。</p><p>想通过积累的方式弄，可能又跟你没什么关系。请大家记住，无论思维、财运，还是境遇，都会出现这种情况。需要一个更高级的贵人，拉你一把，点你一下，或者抬你一下，这关就过去了。过去以后，到了另外一个阶层。</p><p>他不仅把你抬上去，而且给了你一个很重要的机会。没有他，你抓不住这个机会，凭自己积累也抓不住，所以很重要。</p><p>贵人的主要作用，就是帮你看见真相、理解规则、避开错路、少走弯路，进入正确的门，接触更高级的信息，在关键节点拉你一把。贵人还不是下面最主要的事，咱们先说这些。</p><p>比如刘强东，想发展没钱，没钱就发展不了，卡在那个坎上。这是一个循环，想从这个循环到上一个循环，需要有人撑一下。你看他头上有一撮白头发，那就是急的。一夜白发这个东西真能出现，在他的认知范围里已经没有招，找谁都不好使了。</p><p>后来有贵人真帮了一把，直接跨过那个圈，整个事情就能转起来。绝大多数人没办法升级，还在原来的圈子里，就是没有这样的贵人拉你，指着自己弄，过不去。</p><p>让他找找客服。好，贵人还能帮你判断什么该做、什么不该做，打开你连想都不敢想，也不可能得到的思路或者资源。</p><h3>高贵 平贵与低贵</h3><p>下面主要说贵人的种类。第一个，比你高等级的，称为高贵；第二个，跟你同级的，叫平贵；第三个，比你低一些的，叫低贵。这三个都很重要。</p><p>高贵容易理解，人家在认知、能力、水平上非常厉害，点你一下，大家就能明白，这个不用太多解释。</p><p>平贵是跟你同级别的，同行是冤家。按紫微来说，属于兄弟宫，同种属性的，竞争关系会严重一些。</p><p>比如我跟马云比，跟刘强东比，不用比，人家肯定比我强。我压根不会因为这件事有什么心理负担。但是跟我一块的同学、家里的亲戚朋友，但凡比我高了，心里就难受：“他也有这一天？凭什么？”平贵特别难处理。</p><p>低贵是帮助你的一些人，比如你当老板，能碰到几个非常得力的员工，很重要。像马云要解决网络安全的问题。</p><p>招聘时就能碰到一个大神去他们公司应聘。为了验证水平，人家能把现场办公的 Wi-Fi 弄瘫，这就是水平。在你很低的时候，就能碰到很有能力的人，正好在身边，这叫低贵。</p><p>低贵非常重要。还有一种叫桥贵，不过低贵再说一下。我们干这行，大家都知道，要烧纸，量非常大。老天想帮你的时候，可能会用一种很奇怪的方式帮你。</p><p>当时量少，都去白云观烧。认识一个大哥，应该叫大叔了，我管他叫大叔。据说从一九七八年就在白云观负责烧纸，在外面卖纸、卖桶，干这个事。</p><p>我去的时候，据说至少干了四十多年，当地的警察、城管，他都门儿清、门儿熟。人家一看是他，搭理都不搭理。</p><p>我二〇一八年开始从事这些事情，正赶上严打。到了二〇一九年，白云观门口不能烧了，给我气的：“人家干了四十年都没事，凭什么我过去就不让烧？”很挫火。那时候还没觉得应该干多大，这条道走不通，就郁闷，觉得天绝了。</p><p>后来在旁边瞎溜达，在菜市场发现一家卖这个的，一联系，还挺热情。结果这家后来发展到，我估计曾经在中国范围内，应该算烧纸行业做得最大的。没想到。他说自己也是试着租个摊位，就租了三个月，结果碰到我了。</p><p>我就觉得，甭管什么原因，老天让你专门找到这样的人，他能帮你解决问题。没想到现在这哥们国内业务不做了，因为污染这些事情比较麻烦，一直跟到泰国、马来西亚，专门从事烧纸一条龙服务。</p><p>这叫低贵，是支撑你的一个很重要的柱子。现在烧元宝，这么大一塑料袋，一千个金元宝。我们一烧三五百万，就是三五千袋。一般的火场，我跟你说，就现在这个屋子，摞满了都放不下。</p><p>上次给你们看的视频，鬼节那次，四辆卡车拉元宝，拉了两趟吧？烧纸的应该能看到，非常壮观。没有足够的场地，没有当地关系，根本别想干。这叫低贵，是支撑你的。</p><p>我们师门也有几个很好的学生，业务很厉害，也是我的低贵。还有很好的行政、财务，都很厉害。到海外以后，有些朋友告诉你怎么收现金，海外税务、工商的流程，人家都很清楚，也帮了很大的忙。</p><h3>桥贵与分离时的善缘</h3><p>还有一个很重要的，叫桥贵。什么叫桥贵？一条河拦住你，过不去，必须过这座桥。但这个桥在整个路程里，只算一难、一个节点。过去以后，可能再也没关系，可是不找他，这事就过不去。</p><p>很多人对桥贵理解不到位。未来讲因果，有一个重要法则叫镜面法则。你不认可桥贵对你一生的贡献。</p><p>以后再轮回，碰到坎过不去，你就别哭。有些事情，人家替你说一句话、递一个眼神、扫清一件事，或者劝了谁一句，事情就过去了。如果不过去，这个劫难未必能走得通。</p><p>包括小学老师。我们一般特别感激大学、硕士、博士的导师，但小学老师有时也非常重要。没有他的栽培，往上走不了，走不到那个高度，这也是桥贵。</p><p>再下面一个规则：跟谁都有一定缘分。你现在碰到的人，跟你能有一到两年的缘分，就是普通缘分；三到五年，就算不错了。</p><p>能达到十年，已经很稀少了；二十年、三十年，甚至一生，很难。之前说过，比如你在天界跟众生有几百万年的好缘分，这一生就容易处成一生的朋友。记住，几百万年。</p><p>如果只是几万年的缘分，我想想，应该除以一万倍吧，这是天界往人间转的缘分，大概是这样。所以我们必将面临一个问题，叫分离。分离，是人生碰到的各种缘分里经常要面对的事。</p><p>修行一辈子，修的是什么？众生善缘很重要。别一次次轮回，善缘越来越少，未来就活不下去了。如果每一次修行，虽然都遇到分离，但至少没有闹掰。</p><p>分离时很容易不愉快，一定要放下利益。利益对你来说不重要，更多的是众生善缘，轮回里早晚还要见面。所以众生善缘比当下利益重要得多，把这几个东西记住就行。</p><h2>三 天赋与优势的区别</h2><h3>什么程度才叫天赋</h3><p>第三个讲天赋。人欲成大事，一定要拥有天赋。天赋不是普通优势，也不是比别人强一点点，而是一个人在某一项，或者极少数人在几项能力上，天然远远超出绝大多数人的现象。</p><p>首先一定是绝对少数，不可能每个人都有，每个人都有就不叫天赋。第二，在人类某些能力上，应该达到数一数二的原则。</p><p>做大事需要天赋，普通人能有优势就算不错。下面讲什么是天赋、什么是优势，给大家一些比较和数据，就清楚了。如果想创业，想干到资产上亿，你要有超越很多众生的、很大的优势，但这还不算天赋。</p><p>第二，你得有气运。比较大的优势和气运加在一起，至少能干成一个事。但如果要成为整个人类某个行业的领袖，或者必须通过你的努力，才能改变整个人类的现状，优势就不好使了，需要天赋，非天赋不能成。</p><p>拿学习来说，学得比别人快，叫天赋吗？不叫，只能算优势。对国内的学生、观众来说，你家孩子如果连九八五、二一一都考不上，至少在学习上，我说连优势都算不上。能考个一本，算比别人学得稍微好一点。至少裸考九八五、二一一，才叫有一些学习优势。就算考上清华北大，也只是优势比较大一些。</p><p>说起来确实很扎心。可能到十二月份，我这段时间一直突击直播，到一定程度要转录播。那时还会有直播，一周一次，再讲《真相》。其中要涉及人类金字塔：什么样的人才算金字塔尖的人？要活得清清楚楚，知道在跟什么样的人竞争。</p><p>为什么你是穷人？为什么怎么做都做不起来？你就是金字塔底的一个基石，就别提塔尖的事。我跟你说一些指标，看看人家能达到的，你能不能达到。</p><p>为什么要了解这些？得清清楚楚知道自己活在哪个位置，自知者明。像韦神，算天赋。普通清华北大的，只能算优势大一些。</p><p>我记得抖音上有个讲语文的北大哥们说过一句话：“都考到北大，六百八十分进的和七百分进的，性质完全不一样。”七百分以上进的，那叫天才、天赋；六百八十分，可以通过优势和努力堆积出来，跟天赋不是一个级别。</p><p>比如同一张考卷，得九十九分和得一百分，有明显差距。得九十九分，你的水平就是九十九分；得一百分，只能说这张卷子摸不出你到底有多高，所以有区分。</p><p>清华北大学习上能堪称天赋的，我说就是七百分以上这帮人，还有能进清华姚班的。比如进哈佛、麻省理工这些热门专业，能拿到博士，或者做到博士后，这些人一般得有点天赋。所以为什么出来年薪很高？</p><p>为什么你就很费劲？最近我刷抖音，刷到 UCL，还有前段时间帝国理工的数学专业，刷下来的人一片一片。你费劲努力，好不容易到了那个点，上了帝国理工，那个专业就不是给普通人设的，一个普通人去学，根本学不动。至少学习上是这样。</p><h3>开创体系与不同层次的天赋</h3><p>历史上哪些人有天赋？高斯、牛顿、爱因斯坦，这是天赋；佛祖、老子，这是天赋；龙树，辩才第一，这是天赋；六祖慧能不识字，听一句《金刚经》悟了，这叫天赋。</p><p>很多普通事情不需要很强的天赋，靠努力、时间、纪律、稳定、经验也能完成。但是想推动人类社会的文明、规则、思想、整个体系往前走，做开创性的东西，建立一套新体系，需要天赋。</p><p>像霍金也是。我忘了，好像是上牛津大学吧？别人已经学得不行了，他一周可能就上几天课，还能拿满分，这叫天赋。</p><p>天赋还分不同等级。有的连学都不用学，比如经常说的纯种天巫血脉。这谁啊，没事说什么嫪毐？哈哈，那当然也算有天赋，但不是我们推崇的。</p><p>纯种天巫血脉，直接能跟天地沟通，都不用学习。有一个重要特点，他的魂一定是分裂状态的。比如一边听电话，一边看电视，旁边还有人说话，三个人同时说，不影响他回答。魂可以分成一个看电视，一个听旁边人说话，一个听电话，没有问题。</p><p>脑子快的，我记得像克林顿，也能一边下国际象棋，一边看电视，一边跟希拉里通电话。他是脑子快，切换速度快，属于假多线程，天巫血脉是真的多线程，不一样。没有分魂状态，就不能说自己是纯种天巫血脉。沟通天地非常容易。</p><p>第二种天赋，简单看看就行，像六祖这样的人。虽然老说“本来无一物”这个事，但必须承认，六祖的天赋确实逆天，根本不是普通人能行的。看一下就明白，这就叫天赋。</p><p>再下一层，像我这种比较水的，多少也算有点天赋。比如玩“紫占”，也能琢磨出一套全新的体系，还帮你把紫微重新定位一下，这也算。</p><p>我研究天道，那就是纯天赋，但也得憋点时间。每天早上起来望着天想，今天想什么问题？想着想着，可能想明白。我比较懒，想不明白就刷视频，刷着刷着，过两天不定因为什么事，就想明白了。</p><p>所以我估计，想不明白时，就告诉我的大号：“赶紧帮我想问题，我想不出来，你自己想吧，想好了告诉我。”可能晚上一般一点到三点传东西，传完以后，第二天不定因为什么事，突然一想：“我为什么不这么说？”就这样，也算有点天赋。</p><p>不管怎么说，有天赋的人，能在很短时间里走出别人根本走不出来的路，后期也很难有人超越。这就是天赋。但天赋里面还有很苦的天赋，比如我这种。</p><h3>天赋的觉醒条件与个人经历</h3><p>传法、传天道的天赋，属于苦逼型天赋。那天还跟观音聊，我说这天赋太苦了。人类社会不发展到一定程度，把你扔下来压根没用。因为要把天道和人间的东西结合起来，人类自己的知识体系没发展到一定程度，做不到。</p><p>比如老子、佛祖那个时期，把你扔下来有什么用？不好使。所以我这天赋可能一直都有，但是至少在人间这一百世，前面都没打开。之前属于纯混，做个算命师，去宫殿里当高官，在某个地区当土皇帝，或者法师、将军。当然也有当纨绔子弟、被人追得到处逃命的时候。</p><p>需要人类社会发展到一定程度，通过这些东西，我才能看明白一些事情。包括没有到网络时代，很难激发这种天赋，也很难做到，很麻烦。而且这种天赋，注定不能出生在大富之家，做富二代的梦想不可能，每次都得出生在苦哈哈的人家。</p><p>得从社会最底层一点点爬起来，所以前四十年很可能过得很苦。我当将军那次，弄不好不是明朝就是宋朝。当时是一个将领，忽悠元帅：“咱们这么打吧。”元帅听了意见，打赢是打赢了，但是违背朝廷，把我们抓起来，以反叛的罪名砍头。</p><p>所以为什么我脖子第六节、第七节出问题？有砍头经历，就容易有颈椎病，刀从这个位置下去。好，这个不多说。</p><p>像我的天赋就费劲。人类不发展到一定程度，你不经历很多苦难，很难真正理解世界，对世界的看法很难圆满，因为不知道普通老百姓怎么想，没有经历过。如果想传法，就不能进太好的家庭，太好的家庭会让理解世界有所残缺。</p><p>我还跟观音聊：“还不如给个厨子的天赋，包子做得好吃点，至少前期能挣点钱。”当年什么天赋都没有，就是普通人，挣点钱多费劲。不行，把算命的天赋提前打开也行，或者做包子的天赋，至少还能活嘛，啥都没有咋弄？“星空包子铺”，听着挺好。</p><p>不同天赋，觉醒时间、觉醒条件不一样。有的确实能做很伟大的事，可是前期条件太苦，还不如开包子铺，弄个厨子天赋。好，开个玩笑。</p><p>天赋也很难传下去。高斯、爱因斯坦、霍金，都没把天赋传给后代。说深一点，很多天赋是轮回第一世就给你的东西。整个众生轮回，实际上是一部棋局。天道就那么多天赋，怎么可能平均分配？会分配在一些重要的、最开始出生的众生身上。所以越是之前出生的众生，越有天赋。</p><p>你看海外一些讲政经的大 V，讲经济、人情世故、国情，人家有很强的天赋。不然怎么在行业里获得这么高的地位？听一听、看一看，马上知道经济怎么玩，脑子就在这儿。你看半天也没算明白。所以普通众生就不要再去努力这个天赋了，没有天赋，就好好做个普通人。</p><p>好好学会抱大腿，这才重要，别自己啥都没有，还往上冲。这世界奖励的是数一数二，自己做不到，就别在那费劲。像我，也不可能每一世轮回都有天赋。</p><p>以后讲法界天机再说，有个背包原则。说白了，每次下来执行某个任务，允许选十样东西，背包空间就那么多。选不同东西，或者给你不同东西，能发挥的就不一样，一定要注意。</p><h3>课堂玩笑与父子的不同方向</h3><p>自己看看有没有天赋，也比较简单。说一些曾经在佛界的事情。比如找个小美女唠唠嗑，这不违规。一个仙子走过来，你说：“仙子早上好，小生有疑问，想请教仙子。”她问什么问题，你说：“八加五乘三除四加五，到底是多少？”哈哈，看看她的反应。</p><p>如果一下就说出答案，可能是天巫系。她没算，是靠直觉摸出来的，就别忽悠人家，说“小生拜服”，赶紧放人。这是灵感系的，灵感系女生别碰，忽悠不了。如果啪啪一算，马上算出来。</p><p>那肯定是文殊那边的，脑子好使，忽悠不了，也不行。如果没算，开始柳眉倒竖，一看就是执法堂的。你要扛揍就忽悠，不扛揍就躲远点。</p><p>碰到那种听完眼神发呆，开始想，五秒钟想不明白的，就是你了，今天忽悠你。这一测试就没天赋。尤其下位面的佛界，心性纯良，赶上我们第十山海的人过去，不把你忽悠瘸了？哈哈。</p><p>好，自己也可以看有没有天赋。一定是在某方面超出众生非常多，才叫天赋。有点说多了，不能再说下去了。</p><p>比如我的天赋想传给儿子，也挺难，他基本不是。之前挺郁闷，后来觉得也对。我最重要的是把一套规则带到人间；儿子要做的，是把它发扬光大。发扬光大，应该是他的天赋。</p><p>无中生有应该是我的天赋，为什么一定要儿子继承？他再去无中生有什么？更多应该发扬光大。利用在天界或者佛界比较好的人脉，让更多人愿意支持，这是他应该做的，不是我应该做的。很多老子总希望儿子接班，其实未必。</p><h3>选对方向与长期试错</h3><p>每个人有自己的天赋、能力和优势，一定选对。优势可以下传，但概率也不大；天赋几乎不容易传下去，有就有，没有就没有。</p><p>没有天赋，又想做高端的事，基本就出问题了。不要把兴趣当成天赋，不要把短期优势、普通资质当成天赋，不要在错误赛道长期消耗自己。明明天赋在 A 方向，非要做 B，也别干。对天赋判断错误，导致路线选择错误，很愚蠢。想做开创的事，却没有相应超常能力支撑，也容易出问题。</p><p>最核心的，天赋不是比别人强一点点，而是某项能力远远超出绝大多数人。总之，要做自己有天赋、有兴趣、爱好的事情。做起来比较容易得到正反馈，人是正反馈的动物；升级也容易快，因为这是你的优势。</p><p>第三，就算有负面的东西，因为喜欢、爱好，也不容易把它当成阻力。就像当年研究占筮，至少一万到十万卦，属于无效看卦。各种事情都占，占不对的比较多，要一点点试错。</p><p>穷举和试错绝对不舒服。长达十年，几乎没什么正反馈，凭什么支持下去？就是爱好，真喜欢。所以这个东西，就叫天赋。</p><h2>四 福报与承载能力</h2><h3>门当户对与同频共振</h3><p>第四个，福报。说白了，有多大福报，做多大事。上次讲机缘已经说了一些，就不说太多。但要记住，有什么样的福气，承载什么样的气运。没那么大福报，就别扯那事，不是你能干的。</p><p>福报有两个东西。一个叫门当户对，有一个亿的福报，就干一个亿的事；只有一个包子店的福报，就干包子店。多开第二家，你都撑不住，撑不住容易败。包括福报大的，娶的老婆都长得好看。你换三五万的比亚迪，和弄一辆迈巴赫。</p><p>需要的福报等级肯定不一样。买上海江景大平层，五百平方米，和住五十平方米的鸽子窝，福报也不一样。这叫门当户对，有等级。</p><p>第二，福报还有同频共振。并不只是得到，更重要的是能托住现在的事情。</p><p>没有福报，很多资源进不来，机会接不住，贵人遇不到，财富得不到，位置坐不上去。之前哪一年，我忘了，有个小女孩，说六月份好像能碰到比较好的对象，结果没碰到。仙家一查，说福报下降了，问她干什么了，她说没干什么。</p><p>那时候仙家还比较爱说话，直接说：“自己想想干了什么不该干的事。去酒吧找一夜情，以为完了就完了？没弄点病就算不错，但扣福报肯定扣得很狠。”一定注意，邪淫扣福报比较快。福报等级低下去，相应的同频共振就振不出来了。</p><h3>消耗福报与错过后续节点</h3><p>第二，福报不要被消耗掉。很多大老板为什么中间出问题？挣钱以后乱嘚瑟，消耗福报很大，有些局就赶不上了。正常可以走十年，可能三四年就走不动。</p><p>比如去年，被我媳妇忽悠，费点事发功，给几个学生弄了一下脉轮，就那一天损失百分之二十的福报。为什么仙家都急了？因为损失这些，很多节点就不容易赶到。</p><p>还好只损失百分之二十，如果损失到只剩百分之六十，就不用努力，直接散掉，因为后面的东西肯定接不上。每次往下走，比如半年或者一年之后，有下一个机缘。要拿到，就得有相匹配的福报，叫同频共振点，达到那个位置才行。</p><p>假如下一次机缘在一年后，正好能把这百分之二十填上，虽然辛苦，至少还能拿到。但如果只剩百分之六十，努力一年也拉不出这么多福报，到同频共振时就拿不到机缘。再下一个机缘，又要更高福报，就完了。一个正在上升的企业，一定注意不要消耗这些东西。</p><p>找女朋友可以，但每一个都是以谈婚论嫁为主，真不合适，分手后再找另一个，没什么事，不算邪淫。同时交往几个，就有问题。</p><p>原来有福报，自己一嘚瑟，被消耗了，就容易财富托不住、位置托不住、事业托不住、资源和关系托不住，做着做着局面崩掉。</p><p>我在二〇一一年体验过一次。福报刚被扣时，前三个月没感觉，三个月后发现很多机缘跟你没关系，自然消失了，再想就起不来了。二〇一一年还能挣点钱，二〇一二年完全不行，果真没福气。体验过一次就知道。所以福报决定能不能得到，更决定能不能托住、接住、守住。</p><h3>有缘分却托不住的虚运</h3><p>有些人每次都能碰到一些东西。比如百度的李彦宏，我说就是典型的福报不足。老天只给了一次，后面肯定有嘚瑟的事，百分之百。百度是个很神奇的企业，次次踩点准，最后次次又没什么关系。做打车、外卖、地图，发展着发展着，好像就没什么人用了。</p><p>这叫虚运，事情跟你有缘分，但是福报托不住。</p><p>表现形式各种各样，比如资金、管理、人脉出了问题。很多人每次招标都能叫上，可是拿不下来；或者拿下来，总被别人啃掉一块，这叫虚运，不容易把事做成。</p><p>我之前认识一大姐，是典型的虚运。为人、做关系都很厉害，可是每次拿完的东西，最后都跟她没关系。好不容易拿下来，干着干着就没关系了。本来能挣一百万，最后挣十万就不错。这叫缘分很好，但是福报不足。</p><h2>五 因果业力与阴债</h2><h3>规则作用与具体债主的区别</h3><p>第五，因果业力与阴债，放在一起讲，但必须分清。因果很简单，曾经做好事，天道返一个好事；做坏事，返一个坏事。就像镜面法则，弄了什么东西，就有相应的东西找你。</p><p>之前有个台湾学生，说：“我没招这个女的，这个女鬼老折腾我干嘛？”查因果，他俩不是债主关系，叫外道关系。为什么有外道关系？想想到底触犯什么规则。以后学完天道法则，一定要学会。</p><p>从事情分析自己触犯哪条天道法则。不能用天道思维理解生命中的事，就算白跟我学了。这叫什么？伤及无辜。这小子之前肯定做过伤及无辜的事，所以别人无缘无故伤害你，也别哭。这叫因果业力。</p><p>之前查得最多的是学生。典型的，曾经在古代当官员，为难过考生。这孩子平时学习没问题，一考试就出事，尤其重大考试，一定发挥不好。曾经阻碍别人的仕途，就要承担相应的事情。</p><p>没有什么东西来找麻烦，没有债主。债主一定是具体的、对你产生仇恨的生物来找麻烦；因果业力不见得是债主，有时就是天道规则、天道惩罚。</p><p>之前讲过一个天罚，叫“天地灾杀报”。那个哥们以前当王爷，经常拿国家政策坑害老百姓。今生是我认识的一位大哥，我亲眼看过。水平不错，为人好，做关系一把好手，饭圈、酒场上很厉害，很多大哥真愿意帮他。</p><p>结果刚要帮，或者他已经投资很多事情，国家改政策，之前努力全废。不会是哪个债主能让国家改政策，那得多大力量？所以叫“天地灾杀”。</p><p>我真看过两次。一次是禁酒令，布局几年，各方面没问题，马上等富贵，禁酒令一下来就废了。后来还有什么事，我忘了，也是这样。一辈子就那么几次机会，两次重大事情隔十年各来一次，人基本就废了。这叫“天地灾杀报”，没办法。</p><p>再回顾前面，因果业力要注意，之前有没有干坏事？有，就会返一个相应的东西。比如拿刀把人捅了，至少有三种东西要承担，可能更多。</p><h3>伤害行为带来的三种影响</h3><p>第一，因为什么杀这个人？因财、因色、因怨，像镜面法则一样存到天道上，不定哪一世返到身上。什么时候不一定，但一定返，百分之百。这叫镜面法则。</p><p>第二，把人杀了，只杀了一个壳。他有灵魂，还会轮回，记着这事，这叫冤亲债主。如果他投胎了，碰到叫小人；没投胎，碰到叫阴债。</p><p>第三，杀了以后，他肯定有怨念，恨你、骂你，怨念粘在身上。他的家人也会恨、怨，诅咒你的家族，这叫众生怨念。至少三个东西产生影响，所以看看到底值不值。</p><p>坏人前程、婚姻、事业、钱财，都容易出问题。有时福报够，机缘有，天赋不错，可是一上去就被阻碍，这属于因果业力。</p><p>债主又不一样，是“我曾经就恨你，你想把这事做成功，不可能，我就折腾你”。他折腾你，看能不能扛得住，或者找法师处理一下，可能能够圆满，人家不找麻烦了。</p><p>但我见过一种债主，先想办法让你成功，等你把一切都压进去，最后再让你痛哭流涕。有直接阻碍事业的，有间接阻碍的，还有先帮你、后阴你的，这就是债主。</p><h2>六 高维对抗与环境</h2><h3>高维博弈在人间的表现</h3><p>第六，高维对抗。这种事很少，除非第一次把某样东西带到人间，容易出现高维对抗，它不是竞争对手。比如我们要把《人类说明书》带到人间，也会有高维对抗，我的发挥有时也不稳定。</p><p>佛界、神界想把东西带下来，魔界还不愿意。得看你的重要性，敌人重不重视。活到连敌人都不重视，重要性也不大。尤其利益众生，利益了一堆，居然连个魔都没来找麻烦，只能说水平还差点，连敌人都不重视。</p><p>高维对抗不是我们能决定的。我也只是神佛这边一个小棋子，老大之间互相博弈，跟我们有什么关系？正常干，上面万一有问题，也没招，在人间就倒霉。如果老大赢了，人间就出现破除万难，最后终于成功。其实成功不成功，是高维在人间的显化。</p><p>普通做生意很少。但像马云把网络购物带到中国，像抖音、马斯克，改变人间的东西，没有上面的博弈是不可能的。博弈成功就成功，失败，人间看到的就是一个伟大的天才陨落。</p><h3>同样的能力在不同环境下发挥不同</h3><p>第七，环境。我说咱们现在正处在经济大萧条，估计大家都明白。前面各方面都解决了，结果生不逢时，正好赶上大萧条，怎么办？</p><p>像我年轻二十多岁时，家里盖房要搬砖。我估计一下午搬一千块到三楼，问题不大。我们家当时住二楼，搬一千块到二楼应该没问题。这是在风和日丽时，我正常体力能发挥的。</p><p>如果烈日暴晒，四十多度，估计只能搬五百块；特别冷，出去冻成冰棍，也只能搬几百块；狂风暴雨、龙卷风，一块都搬不了，出去还容易被刮丢。这就是环境的影响。</p><p>有时得看环境，环境变了，就不一样。前面的东西可能具备，但大环境不好，就等等。大环境不好还往外走，就很麻烦。</p><h2>七 意外与给自己兜底</h2><h3>真相不清与信息不全</h3><p>跟法界有关的因素，最后一个叫意外。多说一些，因为很多人理解不透。意外就是计划之外、预判之外、准备之外，突然插进来的变量。</p><p>对了，请大家点赞、收藏、分享。导播经常说“你得说这事”，我每次都忘，让更多人看到。</p><p>好，再说意外。意外不是人的错误，是这个世界总有你掌握不了的东西，一定记住。意外也分等级。比如真相层的意外，普通人对事情的真相了解不够，这时做决定，就容易出意外。</p><p>第二，全面层。为什么我坚决不做股票？我相信很多人分析得厉害，但假设决定一只股票走向有一百个因素，普通人能掌握二三十个，已算高手；掌握五六十个，就是高手中的高手。</p><p>掌握七八十个更厉害，但世界总有你看不到的意外，千万不要完全相信自己。我更多做很有把握的事。</p><p>像巴菲特也是，九十年代末、二〇〇〇年初，放任科技股狂飙，不去碰，因为有些东西把握不了。不可能掌握全面，但对某些公司，他很有把握，所以只做确定的事情，这点很不一样。</p><h3>操作与更难确定的变量</h3><p>第三，操作层意外。自己开车，撞车、剐车时，有时明明觉得有问题，还是这么做了，很奇怪。还有资源层、高维、因果业力的意外，以及很多不明意外。</p><p>很多人问：“您都是阴阳师，能跟上面接触，是不是不可能出意外？”我可以很负责地说，看卦和得到高维信息的水平，绝对远超人类。</p><p>但是仍有解决不了的问题、不敢确定的问题。甚至知道事情应该往这边走，却连说都不敢说，想都不敢想。因为一说、一想，在法界就相当于公开，可能出变数。这叫事以密成，我们也一样。</p><p>那到大菩萨或者佛祖，就不出意外吗？也一样。每过一段时间，佛界也会有佛祖陨落，不是做到佛祖就不会陨落。别觉得能掌握一切。</p><p>我的命局、大概的财富、从哪来财，心里大概有数。怎么做能保护自己，也清楚。但有这么多神佛仙看着，有这么多准备，就一定成功吗？不一定，还是不一定。</p><p>所以我也会做一些仙家觉得奇怪的事情：做负面的准备。万一败了？万一什么都没有了？万一真出事了？这些都得准备。</p><p>意外一定有可能发生，有大有小。真出事时，必须有自己给自己兜底的，打仗还得有预备队，一定注意。</p><p>你们碰到的，多数是真相、全面性、操作层面出问题。这些没问题，却被疫情、战争、天灾、黑天鹅影响，就不好预测。</p><p>我记得疫情期间，石油能跌出负数，谁能想到？哪怕一分钱一升都认了，居然负数，一下让一帮人爆仓。所有人都不认为怎么能出负数，结果它就出了，会出现这种情况。</p><h2>八 真相判断与课程结束</h2><p>意外说完，第二个就是真相部分。这些跟法界没有太大关系。注意你了解的信息真不真、全不全、对不对，还有在第几层。之前讲过，就不多说，只告诉你有这么件事，盯着点。</p><p>要看自己在哪个境界，才能保证很多东西正确运行。上几节课，好像认知和思维模型那一节，讲过真相，这很重要。</p><p>真不真、全不全、对不对、第几层。但是能碰到真相也靠机缘，没有机缘根本碰不到。比如外网那些大 V，没有人家那个机缘，怎么知道那些真相？真的是把天上的东西拿到人间。</p><p>包括没有我的机缘，想知道这些真相，门都没有，几千年也没人跟你说这些。反正尽可能多修一些众生善缘吧。</p><p>好，今天说到这。这些是决定一个人成功或者失败的法界部分。明天再把人间部分快速捋一遍，成事这部分就讲完了。</p><p>感谢大家。愿意点赞的再点点赞，收藏、分享。谢谢大家，辛苦听我唠叨，拜拜。</p><h1>问道九 · 意义思维：成功与失败2</h1><h2>一 开场与课程安排</h2><p>听到的扣一。这网速这么好吗？还挺厉害。来，咱们先唠会儿嗑。这么多次直播，今天好不容易第一次早来。结果他们一打开电脑，今天特别白，不知道怎么调的，可能开了双重美颜。</p><p>刚开始没开美颜，我正琢磨：“这是我吗？”哈哈，发现看习惯之后，也是接受不了现实。你们看到的都是经过三十多块钱美颜的效果，正常情况不是这样。今天磨皮有点太白，不过先这样吧，反正也不追求什么，又不是什么大明星。</p><p>今天属于纯人间的，就没有那些法界的东西了，所以讲得快一点，有点 AI 整理的东西。明天决定给自己放假一天，去喝个小啤酒，不想给你们直播，后天晚上再播。周四讲智慧，基本准备得差不多了，还需要再憋一小会儿，估计上几趟厕所就憋出来了，憋点东西挺费劲。</p><p>在周一之前，含周一，再把修行给大家说了。之后先等等，我再找个地方憋十天半个月，再密集输出。剩下因果、轮回、空色、有无，就开始了。</p><p>还是觉得十二月份之前，能冲一把就冲一把，怎么着也得把《逆修觉者》冲到二十集，要不太费劲。这今年不是闰年嘛，所以一月份，我估计就进入腊月了，进入腊月二十三了。一定要在腊月二十三之前完成二十五集，要不然不得了。</p><p>上面领导问：“你丫今年干什么了？”我说：“光憋，没憋出来。”怎么着也得憋点东西。直播完就算完成任务，录播那帮人太慢，不能怪我，是他们跟不上我的速度，哈哈。这也得冲 KPI。腊月二十三，天地考核之前，必须想办法冲一把。</p><p>我觉得从去年十一月份开始憋，一直憋不出来。好不容易有点感觉，脑袋还出问题；脑袋好了，又开始憋。要把好东西带到人间，不是那么简单的事。</p><p>凌晨四五点起床，就在那憋：今天到底讲什么？然后刷着刷着视频，可能就想明白了。</p><p>今天还是讲成事的人间部分。昨天把法界部分讲完了，成事本身就分人间和法界。法界大家不特别清楚，所以讲得多些：得有缘分、有福气，对真相有足够了解，有贵人、有气运。</p><p>很多人自命不凡，“我命由我不由天”，其实早就天注定。不是那块料、不是那个命，哪怕是天地的儿子，投胎时忘了带福报下来，该缩着也得缩着。不要做无谓的努力，抓紧时间把今生能完成的事完成，珍惜缘分和机会。</p><p>跟你没关系的，别乱努力。比如动不动创业，人家可以，问题是你是不是？别浪费时间。绝大多数人把时间浪费在这些没用的事上，所以先说法界成事的条件。法界都不成相，往上冲什么？纯粹浪费时间、人力、金钱。</p><p>走 A 运时，失败一下无所谓，人要经历失败才能成长，没太大问题。但都 B 运、C 运了，就老老实实歇着。尤其福报有限，四十、四十五、五十了还没怎么样，就别觉得四十五、五十以后还能怎么样，收着点。</p><p>或者前半生已经挣过大钱，后半生还能再挣大钱的可能性很低，别乱折腾。哪怕折腾，动嘴可以，别动钱，也别做惊天动地的大事。这是法界部分主要想说的。</p><p>今天说人间部分，会比较快。估计半小时、四十分钟差不多，基本都是流水化的东西，不会说得太细。后面还有好多项，再说细了，更没完。明天休息一天，我要喝小啤酒。</p><p>周四大课，都来，讲智慧。相当于从人间界定义什么是智慧，修行方向这些就全定了。所有违背我跟你说的修行宗旨的，全是扯淡，你直接这样认为就行。周四这节课比较大，再憋几天，把修行讲了，再休息，计划就是这样。</p><h2>二 分析学习与研究能力</h2><h3>大事要在行动中不断修正</h3><p>好，讲成事的第二部分，人间部分。第一块叫分析、学习、研究。要成事，得有独立分析、独立学习、独立研究的能力。接触到信息、真相、条件之后，能不能分析明白、学进去、研究透彻，非常重要。</p><p>为什么要求这些能力？一个人不可能什么都准备好才开始。小事可以，比如出去玩，把该想到的都想好，准备好了再去，没问题。但干任何一件大事，怎么可能什么都准备好？</p><p>有些学历挺高的学生问：“你怎么证明这些事情？怎么知道一定没有意外？”我认为你觉得有意外，很正常。但非要把什么都准备好，就凭这个想法，不可能是干大事的人。人类任何足以推动进步、非常伟大的成就，从来没有一开始就准备好的。</p><p>必须在运动中，一边学习，一边准备，一边前进，一边反馈，一边修正，得这么弄才行。不是说你认为什么地方可能有意外，这个想法就不正常；有意外很正常。但是非得等所有东西都准备好了，才肯往前走，我说这个不可能。干小事和干大事，在这点上是不一样的。</p><p>只要干大事，没有人一开始就知道该怎么走、怎么变、怎么动，未来遇到什么事、什么机缘，什么又不可能。所以有几个能力重要：洞察力、学习能力、分析能力、研究能力。准备随时调整方向，应用手头资源，甚至创造新资源，这才重要。</p><p>我们要做的不是一颗子弹。狙击手把东西都调好，砰，放一枪，子弹一出枪管，你就失去控制了。</p><p>能不能打到，看前面准备得怎么样。厉害点的子弹，打一千米、两千米，也就这个水平。创造最厉害狙击纪录的人，打两千四百、两千七百米外的目标，也没有说首枪命中的，都是打一枪，看看弹着点，调整再打一枪，至少第二枪才行。为什么？变数太多。</p><p>任何细微变化，到一千米、两千米时都会放大。但有没有办法精准击中几百、几千公里外的东西？可以，用导弹。</p><p>导弹发射时，甭管往哪边，哪怕相反方向，也不影响最后击中目标。为什么？几秒钟校正一次，有时可能一秒钟一次。经常修正方向，哪怕最开始差距很大，最后也能击中目标。</p><p>人生一定要学导弹，别学子弹。这就要求自我提升、自我修正、自我进化的能力非常强。历史上谁做得厉害？还得朱元璋。开局比他惨的很少，最后达到开国皇帝的水平，你想自我提升、进化、修正得多强？</p><p>真得佩服老朱，啥都没有，开局一个碗，是不是完整的都不一定。全家好像就他和一个姐姐没饿死，其他都饿死了，实在厉害。</p><p>一定记住，小事可以准备好再做，大事不可能都准备好，必须在做中不断修正。人间的东西，一定要学会快速进化、快速迭代，这个能力非常重要。大老板和小老板的区别就在这儿。</p><h3>学习吸收与社会上的学习</h3><p>需要哪些东西？学习吸收能力、洞察悟性、抓核心的能力、高维分解、方向与资源、方式方法。当然还有更多，咱们不是讲 MBA，大概列列就行。</p><p>第一个，学习和吸收。不是接触多少信息、听多少课、看多少书就行。真正的学习，考的是能不能学懂、学明白、应用。</p><p>吸收不好，就是学不进去，听不懂，看不明白，学了不会用，只会记，不会转化。学很多，判断和行为基本没变化。你说听了多少课、看了多少书，接触了多少信息，这些还不等于你就学到了。真正考的，是学懂没有，明白没有，到事情上能不能用出来。核心一句话：学习不是知道了，而是学会了。不能理解、吸收、应用，就不能算真正学到。</p><p>这涉及社会学习和学校学习的区别。我们要求的是社会上的学习能力。学校里买哪本书，都指定好了。</p><p>大纲框架、学什么、标准是什么，相应经验、案例、考题，都给你了。好好学，学得足够多，经常刷题，基本不会出太大问题。考七百分不容易，但脑子不错，加上足够努力，上六百分问题不大。</p><p>社会完全不是这样。首先没人告诉你问题是什么，你连问题都不知道。出了问题怎么做，往哪个方向走，学什么、准备什么、应用什么，才能拿到社会上的高分？没人告诉你。</p><p>要在这些东西里迅速试错，快速找出路，归纳总结，这才是社会上的学习方式。</p><p>所以《亮剑》里，李云龙为什么能把好多上黄埔军校的打得狗吃屎？就是社会应用特别强。这也是什么原因，很多九八五、二一一、上过大学的人，最后社会成就反而不如泥腿子。</p><p>泥腿子里，有人不爱学习，但不代表学习能力差，而且没有负担。就跟排队一样：去机场换登机牌，旁边开了一个新柜台，也能换，你看谁转过去？一定排最后那帮人，没负担。“反正已经在后面，直接冲过去。”</p><p>排到前面的，是既得利益：“马上轮到我，干嘛走？”也不走。最难受的是中间，不高不低，排了一半。走吧，已经排一半；不走吧，又错失机会。几秒钟，换过去就在前面，没换过去就没机会了。人也是这样，要注重社会学习。</p><p>真正解决问题的是社会学习能力。怎么评判是不是学习能力很强？很简单。比如到一家公司，某个东西从没接触过，小规模公司、小规模行业，两三个月，如果不能在某个小领域变成绝对高手，学习能力就有点差。</p><p>大的东西，用几年的时间，咱们三五年一个小阶段，五到十年一个大阶段，必须在某个行业、某个领域，成为这个赛道全球最顶尖的人才。我说的是你能不能在一个领域里学进去，最后达到那个水平。这才是咱们这一项的评判标准，不是看你原来接触没接触过，也不是只看你原来上过什么学校。</p><p>这说明学习能力很厉害。做不到，就做个普通人，别太费劲，别太难为自己，哈哈。</p><p>包括找我们开堂口的，我都跟他们说：“我知道你们想开堂口干什么，想算命，觉得开完自己就厉害，你想错了。一定是没开堂口之前，就很厉害。开堂口只是把法界程序走完。”没开之前不厉害，开了也不会多厉害，就是这个真实情况。</p><p>我估计十二月份逐渐讲一些真相，首先讲人类金字塔。知道跟什么样的人竞争，就知道为什么一直赚不到钱。真的就是水平差，只是圈子让你感觉不到到底多差。真正看到几个厉害的，就知道为什么挣不到钱。</p><h3>洞察悟性与抓核心</h3><p>第二，洞察。看到别人看不到的问题，叫洞察。再加悟性，想明白别人想不明白的东西，叫悟性，可以合并讲。</p><p>洞察、悟性好，就能发现别人发现不了的问题，看到别人看不到的东西，想到别人想不到的东西，想明白别人想不明白的，理解别人费很大力气才能理解的，这些都重要。</p><p>没这个能力，就做不到提前发现机会和问题。等你发现问题，事已经大了；等你确定是机会，其实快没机会了。这是洞察力和悟性太弱的表现。</p><p>第三，抓核心。从复杂事物中找出真正决定成败的关键点。很多事情看着复杂，变量、信息、干扰很多，真正决定胜负的往往就那几个东西。毛主席在这方面就很厉害。</p><p>抓核心不好，就抓不住重点，容易被复杂的表面现象带跑，把次要问题当主要问题，忽略真正决定胜负的变量。花很多力气，没打中真正的问题，解决一堆小问题，大问题还在。</p><p>很多学生提交单子，知道为什么一定要出查事模板吗？二〇一八、二〇一九、二〇二〇这三年，我快被折磨疯了。有时听一个女的或者男的说俩小时，最后还不明白到底想解决什么。咱们女性客户多，所以听女的多些，真是这样。</p><p>今天好像还听了鲁社长的现场答疑，一个哥们说快十分钟，都没介绍清楚想干什么。就这样还回来当教授？别当了。的确可能紧张，但语言表达和抓重点的能力实在太差，这一点很重要。</p><h3>高维分解与方向资源</h3><p>高维分解是什么？把多层事物拆开，看懂层与层的关系。并不只是看每一层，而是看哪层是表面、哪层是原因、哪层是结构、哪层是规则、哪层是更高维的影响。</p><p>层与层怎么传导？上层如何影响下层，下层如何承接上层？要学会把问题分解。</p><p>第五，方向和资源。共同决定事情值不值得做、能不能做起来。有时想法没问题，就是没有资源，或者方向错了。</p><p>确保发展路径、方向正确。方向错，在错误道路上努力，就是不停白费精力、资源，越努力，错误越大。方向决定值不值得做，后面所有努力会不会被带偏。</p><p>资源就是整合资源，用资源再创造价值，所有东西都在用资源。包括我，忽悠能力还可以，在佛界来说。</p><p>至少排进前十大忽悠，没问题。主要是佛界的人不太能忽悠，我在佛界比较能忽悠。但在轮回里排，肯定不行。可这不就是机缘吗？咱能在佛界忽悠，底下再能忽悠，上不了佛界。</p><p>佛界的人比较好忽悠。昨天说怎么忽悠佛界美女，很简单，但后果严重。我曾经被追杀过，忽悠完容易被追杀。</p><p>非得问：“你居然小菩萨级，为什么后面还长俩翅膀？大家不都会飞吗？为什么你长翅膀才能飞？”觉得奇怪，一不小心说：“原来你是个鸟人啊！”</p><p>得，完了，被追杀多少世。有些佛界美女下手比较狠。我这吹没输过，打架没赢过，一直是被揍的对象。缘分就这么出来的，很郁闷。所以不要乱忽悠，容易出事，轮回里追杀很多。</p><p>好，资源包括时间资源、物质资源、通路资源、人脉资源、矿物资源，还有社会资源和一切可调用资源。包括智商、师父、朋友，都能调用。没有资源，除非很小众、很小规模的事，能做成功。</p><p>稍微大点的事情，就拿咱们这么小的事来说，法界没有足够多的仙家、神佛仙资源，想讲出这些东西，想什么呢？人类几千年都没讲出这些。</p><p>看评论可以说一下，关键是法界武力值不是按肌肉算。</p><p>今生像我老婆，我两百斤，她一百左右，有时不到一百。按人间来说，一划拉就给她划拉到一边。但法界不这么算，是按法力值，谁揍谁就不一定了。不同界面有不同规则。</p><h3>方式方法与复杂问题的处理</h3><p>第六，方式方法。首先方法正确，讲究效率，等级是否正确，处理问题的层次是否匹配。这些不多说。</p><p>还可以拆成几个方面。第一，结构化处理。学会把复杂问题拆分，看清关联和逻辑，把问题拆开、连通、讲通。第二，复杂问题的承载。</p><p>对创业者、领导者来说，说白了就是脑子算力够不够，多线程处理够不够，能不能把复杂问题简单处理。我年轻时做过客服，公司杂事基本都归我。</p><p>刚开始处理一个就捉襟见肘，多加几个问题、几个人，更麻烦。原来一两个员工找你，还能解决；三四十个排队找你，能不能也解决？能不能同时处理几个部门的事？这就是处理复杂问题的能力。</p><p>那时过得苦，但对处理多线程任务、高负载量，很有帮助。原来一两个问题能处理，问题一多，人一多，几个部门一起找你，你还能不能处理？这个才看得出复杂问题的承载能力。老板只能处理单线程，一来复杂的、多线程的就处理不了，肯定不行。</p><p>第三，应变能力。肯定有突然变化，事情要不要继续，要不要改，改成什么样，速度怎么样，都很重要。</p><p>再往下，推演。很多人想事情，没想做完以后可能产生什么结果，有什么预警，下意识认为照着办就行，肯定不行。</p><p>对自己的所思、所想、所行，要有更长远的规划和推演。不要求推到五步之外，至少两三步，确定安全，也行。别什么都做了，又不管产生什么情况，那不就拍脑袋？怎么叫智慧？</p><p>年轻人可能自己推演不了，也尝试着推演，变成习惯以后，其实没多大负担。</p><h2>三 执行掌控与压力阻力</h2><h3>把想明白的事情推进下去</h3><p>第三部分，大块叫执行掌控。上面都说完了，想好的东西能不能真推进下去？就像学自行车，理论教了，车有了，怎么着也得上手试试。刚开始平衡掌握不好，需要多练，这就是执行掌控。</p><p>主要是掌控力，对人、事、资源、节奏和局面，能不能有好的掌控，决定事情能不能做成。还没说具体人情世故，光到这儿，想成就伟大事业，得准备多少事？不是拍脑袋就行。</p><p>不像某些人的老婆，一拍脑袋：“咱做个高端的东西。”结果老公的钱赔得裤衩都不剩。想明白不等于能成功，真做时，要压得住局面，推得动节奏，对人、事、资源、节奏、局面有把握。</p><p>再往下，压力和阻力。做事不可能都顺，都顺不就爽文小说了？为什么爽文这么多？大家郁闷的事太多。</p><h3>小说中的机缘与成事的阻力</h3><p>现实里很难成功，就在小说、短剧世界成功。但看小说短剧的主人公，像《凡人修仙传》《仙逆》，觉得他可能是泥腿子出来的吗？没外挂、没机缘能成功，那才见鬼。</p><p>《凡人修仙传》的男主人公是普通人吗？属于轮回道祖重新投胎，要不掌天瓶怎么落到脚边？《仙逆》的“仙逆珠”凭什么落在身边？没挂、没绝对资源，想从泥腿子往上升，想什么呢？</p><p>连爽文小说都得有挂，没挂不行。有挂了，像王林，活得多苦，整个一部苦逼史，被揍、面临生死大劫，救媳妇每次失败，只有最后一次成功，失败了又重新找希望。</p><p>这就是阻力和压力。人的阻力、事的阻力、资源的阻力，都会产生很大压力，能不能成事要看能不能承受。</p><p>为什么很多女性很难成就特别大的事业？中国也好，世界也好，女性领导者、女性权贵不是很多，我说主要是在抗压、抗阻上出现问题。最后能做成大事的女性。</p><p>基本都有“男人婆”的感觉。比如撒切尔夫人、德国女总理、中国的董小姐，哪个是纯女性风格？女性各方面不比男生差，但属于感性思维，不把自己弄得非常坚定，很容易自己把自己压趴下。</p><p>顺境还行，逆境、尤其绝境，指着感性思维的人抗压，基本扛不住，包括男的也一样。居里夫人也是非常坚强的女性，都得这样才行。我说思维要很男性化，才能扛住，不然费劲。所以想成大事，就必须抗压，还要学会应对外部对抗和破坏。</p><h3>外部对抗与坚持到底的韧性</h3><p>像咱们这行业，几乎没竞争，因为在缘分、真相上，基本垄断了。放开让你竞争，也竞争不了，有些东西看不到，想竞争没用。</p><p>但正常在市场做生意不行，肯定有竞争对手，有搞破坏、挖陷阱的，有人抢资源、抢位置，反制你、拆台、制造麻烦。</p><p>或者诬陷，诱导你犯错，在关键节点翻车，能不能扛住？这涉及反制手段。对方反制手段太多，在博弈上就容易出问题。</p><p>再往下是韧性，信心、坚持、毅力，也是抗压的一种。能不能真正顶到最后，承受痛苦、消耗和反复打击，非常重要。不是说这个事一开始想好了，后面就顺着走，人在其中会有压力，外面也会有阻力。你得能顶得住，才有可能往后推进。所以执行掌控说到这儿，还不只是把事情想明白的问题。</p><h2>四 身体承载与工作状态</h2><h3>身体出问题可能中断整个事业</h3><p>说完这些就是身体，一定保护好。别小看身体，很多人出问题就在身体上。举两三个例子，像我有家族遗传带来的劫难。我们家如果不想办法抵改或者调整，男性很难活过六十，基本五十左右就出问题。</p><p>我爸算比较晚，五十七得脑血栓，瘫在床上。其他人基本连他这个岁数都没活过去。我也是正好五十左右。</p><p>来了这场劫难，熬过去就过去，没熬过去，比如现在瘫痪了，流着哈喇子，光辉伟大的事业就终止了，一瞬间的事。</p><p>比如医生开颅时，突然飞来个苍蝇，进鼻孔，打个喷嚏，一下刀多划两下，就完了。这就是身体容易出问题。</p><p>这里面我觉得最可惜的，是那段“太子奶老大”的故事。辛辛苦苦一辈子，最后所有东西给了司机，钱、老婆、孩子都没了。找个漂亮、特别听话、没主意的，好控制；这个女的唯一能接触的男性就是司机。</p><p>人走了以后，产业都给老婆。她没有社会上的帮助，司机就顶起来了。司机那句话是：“一直以为我给老板打工，没想到老板给我打工。”哈哈。这就说身体，别小看。</p><h3>清晨思考与自己的作息</h3><p>像我们这样的人，为什么四五点起床？看硅谷那帮老大，也是四五点。那时没人打扰，很静，可以一边锻炼身体，一边思考。</p><p>我虽然懒，不爱锻炼，但四五点想问题效率高。白天动不动有人找，一会儿处理问题，一会儿看单子，甚至孩子回来在楼下一叫唤，楼上就别想干活。</p><p>我大概十点到十点半就睡着，躺枕头上就能睡。也刷手机，快十点上床，刷一会儿就睡着，四点多起来。</p><p>中午一定睡午觉，不多，半小时，一般很少一小时。我要仰一下脖子，不枕脑袋，头向后，把枕头放脖子这块，这么窝着睡一下，就舒服。这对我很重要，才能保证有效工作。</p><p>首先身体不能影响事业发展，精力、体力、疲劳度、耐力都重要。以前忙、熬夜，年轻时还行，现在只要十二点以后睡，大概要休息两三天，岁数确实不行，得休息一段。</p><p>这时想也想不出东西，脑子不转，与其这样，不如踏踏实实睡觉。前段时间我也有中招，一年总得几次。像七月十五、清明前后，阴气太重，脑子不转，索性给自己放假，爱谁谁，该打游戏打游戏，该刷剧刷剧。</p><p>创造不出价值，只是机械工作，没有意义。</p><h2>五 心情情绪与延迟决定</h2><p>身体承载很重要，所有东西都得用肉身承载。下一部分是心情和情绪。很多人的错误，不是前面条件没有，而是做事时情绪波动。</p><p>碰到事恐惧、退缩，赶上好事欲望又大，成功后傲慢，觉得与众不同，不听别人说。傲慢固执、逃避懈怠、内耗敏感、情绪失控，都会出现，一出现很麻烦。</p><p>最常见是发脾气、不冷静，在冷静期之外作出错误决定。所以我们要求延迟法则：这事需不需要马上决定？不需要，哪怕员工出什么事，先等一两天，心情平复再处理。</p><p>年轻时一发现问题，啪，拿电话就开骂。但骂得对不对，有没有更好解决方式？当时正在气头上，也没去想这些。等心情平复以后，再看怎么处理，和一发现就打电话开骂，是不一样的。不是每件事都需要马上下决定，先看看需不需要，能等的就等一两天。很多缘分就是不小心这样弄掉的，所以心情、情绪控制很重要。</p><h2>六 人与人之间的问题</h2><h3>人品稳定性与边界感</h3><p>最后一部分，人与人之间的问题。要懂人情世故，了解人性、心性，在人品、稳定性、边界感、一致性、人的欲望弱点和人情世故上，都做得到位。</p><p>毕竟是人的世界，要学会跟人打交道，不能只跟机器。要很好地识人、用人、防人、处人。</p><p>人品不用多说，守不守信用，撒谎、甩锅、背刺、忘恩负义、见利忘义、底线太低，这些都是人品问题。</p><p>稳定性很重要。情绪波动很大，不稳定，不能用；上升空间很低，不能用；压力下一做事就变形，不能用；利益面前容易翻脸，不要用。</p><p>边界感，看会不会碰不该碰的东西，打探隐私、混淆公私，能不能守住分寸。欲望、弱点，像钱、色、权、名。</p><p>还有赞美、安全感、控制欲、虚荣心、报复心。人间的东西，以后讲人道思维会重点讲。</p><p>人情世故，比如吃饭吧唧嘴，到别人家到处乱溜达，跟自己家一样，没大没小；未经同意拿别人东西；该说话不会说，人家帮了你，连谢谢也不说。</p><p>好多学生普通家庭出身，家长没教过这些。再拿一个可爱的学生举例。当时在泰国，好多师兄师姐跟他吃饭，他从来没掏过钱。</p><h3>请人指点与先付出</h3><p>我说：“师兄师姐肯定看我面子才带你，你太小了。抽一天时间跟你吃饭已经不错，怎么次次不掏钱，都让他们掏？到人家那儿取经，怎么能不掏钱？”</p><p>他说：“我妈说了，别人请你，你再回请。”</p><p>我说没错，但有个问题。如果别人求到你，礼尚往来没问题。现在是你求别人，取经、处关系，得先付出。不能到人家那儿取经，还要人家请你，这就不对了。</p><p>其实就是小孩子，父母也是普通工薪阶层，没教过。</p><p>我当年不也这样？人家在桌上快打起来，我还吃得挺高兴。后来指着鼻子骂我们“silly boy”，坏了，英文也没听懂。后来才知道，是他们闹不和、快打起来了。</p><p>我哪听得懂话里的讥讽？就觉得饭好吃，赶紧吃。还问：“从哪句话听出要打架、闹问题？看着都笑得挺好，也没互相骂。”人家怎么教，没法教，说长大就明白了。</p><p>所以人情世故很重要，我在这方面也不行。</p><h2>七 反馈修正与本课结束</h2><h3>反馈和修正的速度要足够快</h3><p>最后一项，做事一定要反馈修正，这是最大一点。前面所有东西可以没有，但修正速度、反馈速度足够快，就没问题，像导弹一样。要去这边，一开始往那边飞，没关系，发现错了，扭过来就行。</p><p>反馈、修正速度要足够快。别不复盘，别人指出问题拒不承认，承认了又拒不修正，那就那样了。就是这些事。</p><p>今天速度快些，都是人间法上的东西，没太多新鲜的，简单捋一下。总算把成事讲完了。虽然粗略，也足足讲了快三期，想成一件事得多费劲？方方面面做好，才能真成就一番事业。</p><p>任何一点出问题，可能被气运、机缘推着往前走一段，但因为不圆满，没办法一直持续。所以世界上很少有人能跨越经济周期，一直富贵，就是条件里有缺，而且我列得还不全。</p><p>记得当时做法界指标，选总经理的指标大概两三百项，看看那些东西，任何一项解决不了，企业都做不下去，就是这样。</p><p>今天不是什么新鲜课，把事说完，大家知道就行。等周四正式讲智慧，很重要的一节课。周四见，明天是小啤酒时间，拜拜。别忘点赞、收藏、分享。</p><h1>问道十 · 智慧和悟</h1><h2>一 从聪明说到智慧</h2><h3>今天讲智慧，也讲领悟的悟</h3><p>看到的扣一啊。已经有人扣一了，看来网速还不错。大家晚上好，正好八点。今天是大课，值得反复听。前几期都是讲完意义思维之后，附带的一些小课。</p><p>今天美颜给得多。我最近经常看直播里的自己，就觉得自己长得帅，后来一照镜子，好像不是这样。脱了美颜都不行啊，跟气色没关系。咱们等一分钟，马上开始。今天一边憋智慧的文章，一边刷抖音。</p><p>好，大家好，今天咱们就开始吧，早点完事。</p><p>今天开始讲智慧，别忘了点赞、收藏、分享。我估计今天甭管讲到几点，都得把智慧讲完。今天是周四，下礼拜一讲修行，之后休息十天，我要去闭关。回来继续讲，到十二月份之前，应该会比较密集地输出。</p><p>输出完了，咱们休息一段时间，一周安排一次，讲点真相，我再把已经讲过的东西做成录播。从《问道》三到现在，这些都还是直播。我大号给我传东西，属于先撒上一个网，放十天半个月再回来看，可能会有不一样的感受。</p><p>所以录播会比直播更精细一些。直播嘛，大姑娘上轿头一回，能凑合说出来就行，大家也别太当回事。</p><p>今天讲一个智慧，一个领悟的悟。这个对传统国学的冲击可能比较大，还得数落他们一顿，咱们才能继续。没办法，前人存在的意义就是让我们踩在脚下；后人进步的根基，也是把我们踩在脚下，都一样。</p><h3>先看看现有的解释</h3><p>咱们先看看传统上怎么定义智慧。我找的《现代汉语词典》第七版，说的是辨析、判断、发明创造的能力。用大白话讲，就是看懂事物本质、分清对错，还能作出合适选择、解决难题的能力。你看，这就是词典给出的东西。</p><p>再看《辞海》，说的是对事物能认知、辨析、判断、处理和发明创造的能力。这样一说，智慧跟聪明有什么区别呢？</p><p>中国传统哲学的说法，是智慧不单纯是掌握知识，而是理解事物运行的规律，懂取舍、分寸，明善恶，知行合一。至少又前进了一点。儒家的说法是明是非、守仁义，遇事中庸有度；道家的说法是洞悉万物本质，顺势而为，不逞强。</p><p>可这些只是智慧的某一种表现，怎么能代表智慧本身呢？就像我的耳朵长得还可以，那只是我的一个表象，不能完全代表我。</p><p>当代心理学又给了五个要素：掌握生活事实性的知识；掌握处事策略性的知识；懂得从多角度考虑事情；认识到世事的不确定性和可变性；能权衡不同价值，兼顾多方利益。</p><p>听完这些解释，是不是反而更郁闷了？咱们用普通人的说法粗略总结一下：聪明人能快速计算得失，有智慧的人知道，有些得失不能只计算数字。聪明是大脑的算力，智慧是对取舍、分寸和长远后果的判断。</p><p>这个就有点接近了。网上找不出特别合适的定义，怎么办？看看生活里耳熟能详的人，哪些算聪明，哪些算有智慧。</p><p>先请第一位，牛顿。他在微积分、光学、引力方面有重要贡献。你可以说他有智慧，也可以说他很聪明，对吧？</p><p>第二位，冯·诺依曼，流体力学、博弈论、统计学，都很厉害。第三位，高斯，曾经是我心目中的神。据说他眼睛都睁不开了，听儿子说了一遍题，闭着眼睛在心里推了七八十步，就把题解出来了。咱们当年学数学、物理，学了多少高斯定理，偶像啊。</p><p>还有爱因斯坦，E＝mc²，这不用多说。商业上，乔布斯也绝对是天才。</p><h3>一时富贵与跨越周期</h3><p>但他们到底算不算有智慧？不好说，至少聪明肯定是聪明。马斯克也是，人家脑袋好使。我连大学都考不上，人家读国际一流大学，so easy，咱这脑子肯定不行。</p><p>再换一组人。国美的黄光裕，苏宁的张近东，恒大的许老板，乐视的贾老板，是聪明还是智慧？有点感觉了吧？再说几位：巴菲特、查理·芒格、段永平、稻盛和夫。</p><p>还有李嘉诚。我记得二〇一五年左右，他大量清理国内资产的时候，有人骂他老糊涂了。那时候房价还在涨，好像一直涨到二〇一八年。他可能从二〇一二、二〇一三年就开始逐步卖了。现在回头看十多年前这段，确实厉害。</p><p>因为他的盘子太大，不提前卖，后面就卖不出去。你家卖一套房，看清趋势，二〇一八年再卖可能还来得及；他那个资产量，到那时就不好使了。所以房价还往上冲，他已经提前出手。</p><p>点完这些人，再感觉一下，什么是聪明，什么是智慧？所有定义都要为人服务。你心里明明有感觉，知道哪些人聪明、哪些人有智慧，却找不到能对应生活的定义，那就有问题。</p><p>像国美、恒大、乐视这些老板，资产做到几个亿、几十亿、上百亿，甚至上千亿，都没问题。但可能只是一时富贵。我管这叫枭雄的性格、枭雄的气运，很聪明，大势托着的时候，一下冲起来了。</p><p>乔布斯也是这样。马斯克还没看到后面，他现在仍在势头上，有点像一几年时的马云，拿放大镜、望远镜都找不着对手。这时候还不能下结论。从目前看，更多还是势头上的聪明选择，长远布局最后怎么样，还得看。</p><p>不过，人家的布局也很厉害。我们说巴菲特、芒格、段永平、稻盛和夫、李嘉诚，看的是更长时间里，能不能始终保持正确。这里很重要的一点，叫跨越经济周期。</p><p>只能抓住一段大势，最多是一个枭雄。当然，咱们想成为枭雄都很难。但每个时代、每一年都有起来的，也有倒下的。能跨过四十年、五十年，还保持增长、保持稳定的人，整个世界也没几个。</p><p>有人说司马懿。司马懿肯定算啊。</p><p>他至少到死的时候几乎没怎么败过，那个隐忍很厉害。了解完这些人，古人总结得不合适，咱们就自己总结。</p><p>科学成就、商业成就，可能解决了人类的某个问题。比如最近说北大有个小女孩，解决了一个世界数学难题，你可以说她很聪明，却不能只凭这个说她有智慧。聪明更多是解决眼前或某一阶段的问题，智慧更多是看长久。</p><h3>眼前的问题，要不要解决</h3><p>所以，聪明和智慧的区别，不是谁反应快、谁反应慢，也不是谁更会算计，而是重点不同。聪明主要看理解、分析、解决问题的能力有多强；智慧更多看认知和思维，能不能引导人作出正确、有利、经得住长远考验的判断、取舍和行动。</p><p>大白话就是，聪明看你的CPU快不快，几核的，几纳米的，能不能解决现阶段的问题。智慧有时候甚至不解决眼前的问题，它只关心你这个想法，在这个方向上能不能长久正确。</p><p>甚至还要先问：这个问题有必要解决吗？有意义吗？你解决得对吗？更长时间里还对吗？这才是智慧考虑的事情。</p><p>比如我为什么只算小卦？几百块、千八百块的小卦，担的因果少。圈里有人想包下来，给一百万、几百万，家里有事就经常来问，行不行？我坚决不同意。看风水也只看小风水，越是重型家族的大风水，咱越不碰。</p><p>我可以帮你几年，但人有气运，谁能一直帮着？以前香港那些风水大师，现在你让他们靠风水把家族的生意重新逆转一下，试试看。在我的判断里，整个地区走下坡运了，你光靠这个能拦得住吗？</p><p>原来地区向上，家族也向上，你帮的是把前进路上的坑洼填平，让人走得更好。等人家走下坡路，你再拦一下试试。</p><p>家族从B运走到C运，这时候接风水，你觉得自己努力了，还替他踩了一脚刹车；人家却觉得，自打你动了风水，我家就越来越差。最后还是你不好使。</p><p>人家投了几个亿，给你几百万风水费，最后几个亿亏了，你把风水费退回去就完了吗？你得承受更大的东西。所以我看到的是，更长远的结果不好，就不碰。哪怕能先帮他几年，也不接。</p><p>短期内想办法弄上去，是聪明；长期关系早晚出事，自己要倒霉，那为什么还要做？这就是不能只看短期。</p><h2>二 时间尺度变了，取舍就变了</h2><h3>大智若愚是怎么来的</h3><p>聪明的商人能抓住机会，智慧的商人抓的是长久稳定的机会。这是在人间层面讲聪明和智慧。有没有更高位面的智慧？咱们引用佛祖、道祖的说法，比如“宁损性命，终不作恶”，比如“冤冤相报何时了”。</p><p>在人间，短时间有利和长时间有利，比较容易判断。我拿许老板和巴菲特作比较：一个挣得很多，二十年左右就出了事，我直播里说是“踩缝纫机去了”；另一个六七十年还在稳步增长。按这个尺度，长久的结果比较容易看出来。</p><p>可把时间尺度再拉长，很多判断就变了。“宁损性命，终不作恶”，怎么理解？连这一世的生命都愿意放弃，还在乎什么？他要保证的是更长时间里的利益和正确性。</p><p>“冤冤相报何时了”，佛教喜欢讲这个。我看西方很多电影、电视剧，常见的是以眼还眼、以牙还牙：被欺负了，先忍，忍不了就报官；正义得不到伸张，最后自己干，一定要让恶人得到报应。但佛祖看的，是更长远的未来。</p><p>在轮回这个说法里，你甭管谁对谁错，最后互相咬在一起，这一世你咬我，下一世我咬你，两个笨蛋碰到一块，叫众生恒定向下。所以才说冤冤相报何时了。</p><p>时间跨度足够长，目标不再以这一世为中心，你的目的、方式方法都会变，甚至出现大智若愚：放弃当前的利益，去保证长久的利益。</p><p>历史上也有这种例子。我想到明朝的徐阶，跟严嵩周旋，能隐忍那么多年，一有机会就把严嵩父子弄下去了。大家以为他该长期做首辅了吧，他却当了几年，扶起下一代，就回家了。下一代是谁？我记得是张居正。据说徐阶七十多岁才去世。</p><p>在古代，七十多岁已经很厉害。我看这个故事，注意的是他有接班人，能平安落地。再看张居正，很聪明，我还记得有说法，说要不是有人从中作梗，他有机会连中三元。可最后整个家族出了事。</p><p>你作的选择，能不能让自己、政策、家人、后人一直有利？不能只看当时没人动得了你，还得想十年、三十年、五十年之后，甚至你这一辈子结束之后。</p><p>你能得到什么，家族能得到什么？智慧主要考虑的就是更长远的时间。比如张良，帮刘邦打完天下，一拍屁股走了。还有范蠡，帮越王勾践之后也走了，走之前还劝朋友赶紧走。舍不得，没办法，最后还是被勾践弄死了。</p><p>再看胖东来。一个做超市的，在没有名气的时候，要建立信任是极难的。但这种东西，你坚持到一定程度，爆发出来的力量，别人很难对抗。</p><p>我举个“315曝光”的说法，就算你去曝光，人家也可能不搭理，因为当地已经建立了那种信任。可这个信任，没有几十年的痛苦期，很难建立起来。以后我们还会讲“一切都是自己的错误”。</p><p>还有“他人即世界”。你说，人不为己，天诛地灭，为什么出错了，却先想是不是自己做错了？就算别人错了，也想，我为什么会招来这个错误？为什么跟一个容易出错的人接触？</p><p>看着挺蠢，好像什么都往自己身上找。但你真这么想，还坚持下去，在我讲的整个轮回尺度里，上升会很快。很多东西就是大智若愚，眼前看着蠢，长远却很正确。《道德经》里的不争而得、无为而无不为，还有“一曰慈，二曰俭，三曰不敢为天下先”，都有这个意思。</p><h3>先问拥有智慧是为了什么</h3><p>说了这么多，聪明和智慧的区别大概清楚了，能不能具体定义一下？定义之前，先用意义法则问：我拥有智慧，目的是什么？它能解决什么问题？</p><p>别什么都觉得好，这个也要，那个也要，要完了却不知道有什么用。别读了半天《心经》，除了心静一点，什么都没弄明白；读了半天《金刚经》，只说这有智慧，却说不出它能解决生活里的什么问题。先问目的，这才重要。</p><p>所以我们先不急着下定义，先说拥有智慧，能解决生命中的什么事。</p><p>它可以让我在更长久的时间里，处理问题、做事情，一直处于正确且有利的状态。能保持多久？看你的本事。智慧越高，能顾到的时间就越长。</p><p>如果连聪明都没有，可能连一瞬间有利都很难做到。比如跟人吵架，对方骂你，你生气，揍了他一下，出了口气，爽了。这个当下，你觉得自己“正确且有利”。可打完呢？人家打110，要赔钱，未必占理；如果验出轻伤，还可能牵涉刑事责任。</p><p>接下来考公、考编、工作，都可能受影响。为了一时痛快，把更长久的生活弄出问题。骗人也是，短期获利，时间越长，被发现的可能性越大。早晚被发现，名声就臭了。</p><p>企业也一样，急功近利、做假账、乱忽悠、乱承诺，早晚要出问题。现在看起来有利，长期呢？很麻烦。</p><p>职业经理人要靠业绩，有些行为就是短期促销，像给企业打强心针。</p><p>经济上涨时，大家都往上走，这种办法比较好使；一到大萧条，我看更容易扛住的往往是家族企业，因为它能接受一段时间的波动。我记得李嘉诚的儿子有次投资亏了，就一直拿着，等了十多年，地产挣钱了再卖。换职业经理人，你可能不会给他这么久。</p><p>再看明星，有飞机、游艇、别墅，甚至私人岛，异性追求也多。从人生看，很成功，简直是现代人的典范。可要从死后、轮回的角度看，在我这套说法里，这是不是大量燃烧福报呢？</p><p>辛辛苦苦攒的福报，拿来在这么个地方充大爷。从另一个尺度看，就会有另一种判断。王朝、家族也一样。比如朱元璋，从乞丐一路打到皇帝。</p><p>中间经历多少九死一生。他想让子孙后代享福，让全国人都为这个家族服务，能不能做到？短时间可以，二百多年。可二百多年之后呢？按我讲的因果，整条家族线都要承担这些东西，后面可能很难再翻上来。</p><p>如果我有这个机会，我会学华盛顿。拼，可以；开国之功、功德、福报，可以拿。但别把一切都归自己家。你能拿住多久？</p><p>权力争斗大的地方，九死一生终于上去了，又得为了保住位置继续斗争，折腾、抓人，想提前退休都不敢。</p><p>中国皇帝里，能主动说退休的有几个？乾隆当太上皇，说不想超过爷爷的在位时间，算一个。很多人都等到死，因为中间怕有变数。争位置已经很累，为了保位置，又得折腾一堆。</p><p>最后没有哪个人、哪个家族能永远保住。一辈子保住了，家族延续几十年、上百年、二百多年，很厉害，可最后仍然是一场空。那就得算，为了这二百年的东西，付出多大代价，值不值？</p><p>尺度不一样，值不值就不一样。搁我，我觉得开国之功很好，但别硬跟家族绑在一起。家里人真有能力，大家竞选选上了，你就上；没能力，就别坐那个位置。做共和制，对自己和整个家族的影响，在我看来更小。</p><p>好，回到智慧。目的已经出来了：在更长的时间里，让自己处于正确且有利的状态。多长？看你的本事。目的明确，就可以给定义了。</p><h2>三 智慧的定义与定义的边界</h2><h3>为什么认知、思维之后还要加行为</h3><p>在更长的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维和行为，我们称为智慧。</p><p>前面是目的，后面是实现这个目的所用的东西。为什么除了认知、思维，还要加行为？因为想对了，你还得保证行为一直有效。</p><p>很多人知道减肥好，可我饿呀，最后还是做不到。你知道方法，却没法达成行为，那对你还不能算智慧。所以要把行为加上。</p><p>换一种说法：以长远视角，依靠认知、思维、行动，推动事态向正确且持续有利的方向发展。这也可以作为定义。你愿意用哪一种都行，只要说得清楚。</p><h3>终极智慧、圆满智慧与绝对正确</h3><p>什么叫终极智慧？就是在无量劫的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维与行为。这里的时间就明确了，是无量劫。</p><p>终极智慧和圆满智慧有什么区别？比如我在养生上有一套办法，按照它做，在无量劫里身体都好，这是养生方面的终极智慧。圆满智慧，则是在全方面、各种各样的事情上，都能在无量劫的尺度里做到正确且持续有利。</p><p>为什么用无量劫？上面还有没有别的时间维度？可能有，但不在我们的研究范围。我们学的东西，以佛教能发现的最高世界维度为主。我认为上面还可能有别的，但出了轮回，跟这里讨论的事就没关系了。我们先关心轮回之内，怎么让自己更厉害。轮回之外，不知道。</p><p>这又带出一个东西，叫绝对正确。有绝对正确吗？不好说。在人间，学知识、挣钱、过好生活，很多商业行为看起来正确；换到天道角度，可能只是消耗福报，没什么意义。再到无量劫，又可能是另一个态度。</p><p>无量劫之上呢？能保证佛祖看到的就一定正确吗？也不一定。但现在你能接触的最大老大就是佛祖，人家愿意跟你说点东西。你要找鸿钧老祖、菩提老祖，影儿都见不到。</p><p>所以你现在能得到的认知上限，大概就是这个范围。佛祖在他所认知的空间、佛界和轮回所囊括的范围里，认为这套办法最正确，才会有无上正等正觉这样的说法。出了这个范围还对不对？不知道，就先不用想。</p><p>意义思维最大的意义，就是跟你没关系、不能在你身上起作用、又无法验证的那些理论可能性，先放一边。空空、无无、无无无，关你什么事？这样心就放宽了。</p><p>所以我们说有绝对正确，一定要加括号：有范围。在轮回、无量劫这个范围，在佛祖、道祖的认知体系下，按那些方法走，几乎不会出问题。我们在这个意义上称它为绝对正确。</p><h3>描述了表现，不等于解释了本身</h3><p>这就是我们总结的智慧、终极智慧、圆满智慧。再看看古人怎么说，你就能听出以前《问道》讲觉醒、解脱时提到的那个问题：描述性的解释。</p><p>比如拆字说“智”，上面一个知，下面一个日，每天多知道一点、多积累一点，叫智。“慧”下面一个心，上面的部分好像扫掉灰尘，把心上的灰尘扫掉，让心干净，叫慧。这是用字形来形容。</p><p>每天多知道一点，只是达到智慧所需的条件之一；心干净一点，是帮助你作出正确决定。它们都是认知、思维、行为所需的一部分，不能拿其中一条代表整个智慧。这就是描述性的解释。</p><p>《六祖坛经》怎么说？我这里摘的意思是：“善知识，何名般若？般若者，一切处所，一切时中，念念不愚，常行智慧，即是般若。”说人话，就是不管什么时候、什么地方，每个念头都不愚钝，就是智慧。</p><p>这就是我特别讨厌的那种描述性的解释。看似解释了般若，或者说般若是到达彼岸的智慧，可智慧究竟是什么，般若究竟是什么，还是没说。只告诉我必须时时刻刻不愚钝，那我怎么做到呢？</p><p>就像你说，一个成功的人，要幸福，有钱、有权，没人欺负，想怎样就怎样，自然活得自在。可我问的是怎么达到，用得着你描述那个样子吗？再看《大乘义章》，它区分智和慧，我就不念古文了。</p><p>大概说智是懂得世间的事，慧是照见根本真理。怎么看到？还是不知道。《大智度论》又说，般若在一切智慧中最为第一，无上、无比、无等、无更胜者。你说它最好了，可它究竟是什么？又没说。</p><p>说般若是到彼岸的智慧，彼岸是什么？那个智慧是什么？有的说什么都不执着、不抓，不贪、不困。这算不算智慧？这只是达到目标时，不被一些东西影响的一种方法。能说我的耳朵就是我吗？</p><p>还有说，般若在哪里，佛就在哪里，般若波罗蜜是诸佛母。这还是在描述。</p><p>我又搜了一些《大智度论》的说法：卷四十三，说一切智慧中最高、无上无比无等；卷十八，说照见一切事物真实本质；卷八十四，说能从此岸到彼岸；卷七十七，说像虚空一样没有固定形状；卷一百，说是一切佛的母亲。</p><p>这些都在形容般若。听完之后，你能告诉我具体怎么修、在生活里怎么应用吗？这就是我说的，净说些不管用的话。还有我看到归在朱熹名下的“智者自知其所不知”，知道自己不知道。</p><p>这当然算智慧的一种表现，可不能说它就是智慧。像镜子、像虚空、像秤、像深谷，这些都只是某个方向的表现，是描述状态，不是解释本身。一个人下定义，如果只是描述现象，按我的判断，他最多抓住了一个代表现象，还没弄懂本身。</p><p>我也承认自己有不懂的。什么是爱，我想了两年，到现在也没法下定义。能举很多案例、很多现象、很多描述，但我觉得那不是爱的本质。也可能爱本来就没有定义，可能我水平低，理解不了；也可能它就是混沌的，不应该有理由，甚至不应该有目的。</p><p>我承认自己智慧水平也不高，这东西定义不出来。好，既然说古人不够，咱们得来点实在的：怎么提升智慧？这才是关键。要提升，得在六个方向上进步。</p><h2>四 提升智慧，要补哪些东西</h2><h3>六个维度，不能只看眼前</h3><p>比如想挣钱，什么叫挣钱的智慧？得保证钱越来越多，自己还一直安全。别像我前面说的许老板，钱挣着了，后面出了事；也别像黄老板，挣了钱，被关进去，放出来之后又作了几个决定，输得更惨。</p><p>还有贾老板，钱挣着了，却不敢回来，一堆人骂，何苦呢？真正要想的是，钱我要挣，我开心，大家也开心，同时我还安全。这才叫挣钱的智慧。</p><p>第一个维度，远度。智慧解决的是长久问题，至少先保证这一生没问题。就算你说我死之后哪管洪水滔天，那这辈子，钱总得花到吧？别人没死，钱先没了。</p><p>第一目标，人死了，钱正好没了。再好一点，人走了，钱还在，后代有花销，产业能继续，功德还持续增加。这个才厉害。</p><p>所以先考虑长远：更长时间里，这个事对不对，会不会带来问题？第二个，提升高度，主要是认知高度。对事情的理解，要不停往上拔。</p><p>第三个，全面不全面。了解不全面，就容易出意外。第四个，当前利益合不合适。第五个，未来利益合不合适。第六个，取舍，看你到底要什么。</p><p>比如背叛、出卖信息，只要当前利益，对未来抱侥幸，就容易作出愚蠢决定。在我讲的累劫轮回里，这不只是卖几个信息的事。</p><p>我记得一几年的时候，有个哥们特别喜欢出去玩，北京嫌贵，就往天津跑，说有个叫“繁花”的场子，比北京便宜一些，质量还高。</p><p>他找小姐，还说：“我给她钱，她开心，我也开心，大家都开心。”我说，你理解的都是短期。更长期呢？你以为这次碰过，以后不见面，就没关系了？</p><p>按我这里讲的因果，累劫轮回里，两个人可能还会被各种关系拴在一起。石头丢进水里，你不知道涟漪最后影响多大。所以要从这六个维度考虑。</p><h3>读书、实证与前人的经验</h3><p>常规怎么提升？第一，读书，读有用的书。这就是为什么讲智慧之前，先给你们讲知识分类。</p><p>读世界名著、《三体》《百年孤独》，可能有感悟，但按我这里提升智慧的目的，不会有特别大的帮助。我重视的是那五类：真相，认知和方向，心性和人性，实操，人情世故。时间花在这些以外的东西上，可能是在浪费生命。</p><p>当然，生命有时候也需要浪费。我今天研究这些东西，上厕所也刷剧。该浪费就浪费，不能太浪费。读书有帮助，但书本只是人类现有认知和知识体系的一个上限，未必解决你的全部问题。</p><p>知识大爆炸之后，读到更多东西，确实能更厉害。现在又逐渐走向大V时代，尤其一些海外的知识博主，讲政经、生活、时事，他们对事态的看法，有时比读很多书更有用。这也是一种方法，别走错路。</p><p>第二，科学实证，通常在管理、工程或具体事情上用。比如盖大厦、修水坝，希望五十年、一百年不塌，就需要大量科学实证，保证更长时间里不出问题。</p><p>第三，哲学、国学，智者的书，伟人的实践和人生金句，能不能提升智慧？可以，但也有上限。你学国学，学的是什么？我看主要是佛经、道经，再加上孔孟、王阳明、曾国藩这些人的东西。</p><p>他们对世界的看法、对事物的定义，能帮助你活得更好，少犯人生错误。</p><p>但也会出现前面讲的问题：听不懂，用不上，不明白意思，操作不了。六祖偶尔说一点，弘一法师偶尔说一点，我把它叫星星之火，难以燎原。算不算火？算，有帮助，只是还不够。</p><p>要是这些东西已经把问题解决了，人类怎么还普遍不觉醒、不解脱？在我讲之前，连觉醒、解脱的定义都说不清，又凭什么觉得真正理解了世界，知道它怎么坑你？好，再说易学占卜、法界成相。</p><h3>占卜可以辅助，不能当拐棍</h3><p>能不能解决智慧的问题？我认为能解决一部分。因为智慧是让人在更长时间里正确且有利。如果直接看这件事十年、一百年之后的结果，就能辅助判断现在的选择。</p><p>可没有核心方法，你看再多，最后可能都是不好的结局。为什么？智慧拼图没拼好，木桶的木板没搭全。改一个，占卜一下，失败；再改，往前走一点，又失败。因为你不知道一个事物要长久稳定地成功，需要多少条件，可能几百、上千个点，各方面都得优秀。</p><p>所以我说，成功的人类千篇一律，失败的人类各有不同。任何一点出问题，都可能走不到那个位置。</p><p>你说走A不通，走B不通，走C也不通，可能正确的路是先A，再B，再C，再回A、回B、回A。它是这么一条路。</p><p>你自己穷举去吧，很难穷举出来。未来又像一棵树，有很多分岔，任何小错误都可能让未来不同。所以这个方法，在我的理解里，至少能让你在事情发生前，先看到一些未来影像。</p><p>但前提是占卜得正确。第一，即使占得对，看到的也可能全是不好的结果；第二，你又不能保证占卜百分之百正确。所以不是完全不能走，是很难走通，不能把它当拐棍，辅助验证可以。这也是我一直说“法界成相”的意思。好，喝口水。</p><h2>五 冥想与悟，分别在说什么</h2><h3>我讲的冥想四个境界</h3><p>第五种增长智慧的方法，打坐、冥想、感悟，好使不好使？有人会说，佛祖不就是在菩提树下打坐悟道的吗？凭什么说我不行？我就敢说，你去打坐，未必好使。</p><p>这个本来要放在《法界天机》里讲，这里稍微穿插一点。不是所有打坐、冥想都能得到有用的东西。就靠打坐得到有用东西的人，我特别佩服佛祖和达摩。其他人不是完全不能成相，但也有条件。</p><p>这里涉及两个事，一个冥想，一个悟。我把冥想分成四个境界。</p><p>第一个，让自己静下来。很多人能做到，这件事本身有用。如果连静都静不下来，我认为要看环境磁场，有没有师父或法阵帮着清理，还要坚持一段时间。</p><p>第二个，偶尔看到影像。一个人、一幅画面，甚至一句话，在我的说法里，都叫法界成相。可能是仙家、法界师父，也可能是前世的一些碎片记忆，通过这个方式沟通上了。</p><p>但如果只是偶尔看到一点，我只能说沟通能力很一般。看完一段前世影像，想明白一件事，有没有可能？有。可想靠这点东西全面觉醒，想都不用想。</p><p>我常把它比成电视机和电视台。上面得打信号，你这台电视也得能成像，有电、有天线。老电视一开，全是雪花，你得调台，同频共振。甭管仙家、师父，还是佛祖菩萨，信号打下来，你收到了，才出现影像。</p><p>当然，我这套说法里，也可能有别的信号，灵敏度高，什么台都能收到，还可能串台。以后讲法界成相再细说。</p><p>第三个，入境，能稳定进到一个境界里，待几十分钟，甚至几天。不是偶尔闪一下，而是持续传输，大量往脑子里灌知识。那得问，你有大号吗，上面有师父吗，能定在那个境界里吗？都做不到，谁给你传？</p><p>我有大号，我老婆也有。我的大号主“忽悠”，研究道法，走文的，传这些知识没问题。我是从他那里分出来的一部分，同频共振比较方便。你跟师父关系再好，也未必是同一个东西出来的，沟通可能就费劲。</p><p>有大号还得看大号干什么。前几天说有个小姑娘是嫦娥的小号，长得挺漂亮，连上嫦娥，传点舞蹈知识可以；要传认知、佛法，那就未必是她擅长的。</p><p>我媳妇的大号要是给她传，估计传的是怎么揍我，人家是练家子。我在法界从来没打赢过她。那边不论体重，论法力。她在人间只有我一半体重，到了法界，谁揍谁还不一定。很郁闷啊。</p><p>第四个，最厉害的，是在入境中大量进行认知同步。我把佛祖在菩提树下的经历理解为这个。此前他还迷茫，后来放下一切，打坐几天，认知同步了，再看世界、再说话，底气就不一样。</p><p>所以还得看大号是谁，是不是传法、研究智慧的。不是干这个的，连上也未必有用。</p><p>就像有人说念阿弥陀佛就能往生极乐世界。在我看来，有些教这些方法的人，本来就是从佛界来的，完成任务、不犯大错就能回去。对他好使的方法，不见得直接放在你身上就好使。</p><p>佛教、道教都有很厉害的人，他们的修行方法没错，但可能只适合他们自己。这几千年打坐的人多，有几个悟道？就算说悟了，留在人间的思想、文献又有多少足够高级？所以我的判断是，还是条件没接上。</p><h3>悟的五种方式</h3><p>再说悟。一个竖心旁，一个吾，我把它理解成，有个东西把你串通起来了。这个东西挺麻烦。</p><p>第一，通过学习。学到好的知识、好的素材，明白更多，就有更大机会悟。学习对提升智慧和认知很有帮助。</p><p>第二，点。某件事想不明白，有个明白的人点一下：“你为什么不这样做？”突然就通了，不一定费多大劲，这叫点。</p><p>第三，传，有传承的。一般涉及道家的术法，或某个派系。比如我用的紫微、紫占，按我的说法，要有星辰殿的仙骨，才有灵感。大家同时为一个问题起卦，我用手指点出的盘，可能就更容易解。那一下代表机缘，方便我看。</p><p>所以才会有仙骨、仙根、传承这些说法。不是那个传承，想学就费劲。密宗、道术、法术，也不是想学就能学；得属于那一派，祖师爷认可，手势、开光、请仙才好使。别人照着学，未必有用。这是我说的传。</p><p>第四，因果碰撞，很重要。将来红尘道场里，我可以教无数知识，可你能不能真正领悟，还得靠碰撞。</p><p>学完反复练，能不能精通、真正明白，不一定。可能帮别人做了一件事，经历了一个案例，突然一下懂了，这就叫因果碰撞式的领悟。告诉你了，跟你能应用，是两码事；明白了，跟真的通透，也是两码事。</p><p>按我的理解，这种咔一下悟到的东西，轮回不散，一直能应用。有些学生说，很难感到慈悲、大爱和不恨。我讲了很多，可那是我的东西，不是他的。我只能告诉你我的理解，能不能触发你的感悟，不一定，也许时间还没到。</p><p>有一天，突然一下，原来就是这样。像《庆余年》里的大宗师，需要那个机缘，可能一生就那么一次，感觉找到了，就上去了。我拿范闲举例，他有那个感觉却没继续，后来再怎么突破，也只是无限接近，始终到不了。这是我借小说打个比方，悟有时候就是那么一种感觉，feel。</p><p>第五，像我这样，也是悟的一种，叫认知同步。我这个人极懒，仙家还说，你一天打坐半小时不行吗？我还是不想。你要让我看半小时小说，没问题。</p><p>这两天大忏悔又有点懈怠，明天得坚持。给自己找了很多理由，说忙、没时间，其实呢？</p><p>今天累计看小说也有两个小时，找到个很多小说改动画的地方，看进去就没退出来。我不愿意打坐，大号就没时间给我传；他们还老在凌晨一点到三点传，挺讨厌。</p><p>我现在的招是，研究不出来就先不研究，上个香，跟大号说：“不会了，你们自己努力。”我该干什么干什么，打游戏，喝点小啤酒。</p><p>有时候凌晨三点传，我自己有感觉。过两天再想，突然就有感觉了，眉飞色舞。所以我本着能不干活就不干活，能让大号干就让大号干。你们在佛界，跟我这个小脏号较什么劲？你们干，我享受人间，该传给大家的照样传，不耽误。</p><p>说白了，有些东西我自己想也想不明白，那就让他们干完传过来。这是我自己的方式。</p><h2>六 智慧要能在人间用起来</h2><h3>为什么不能只带一套高处的道理下来</h3><p>所以打坐、冥想、感悟能不能提升智慧？这是宗教里常见的方式，但在我看来，多数情况下，光这么做不好使。偶尔想明白一点事，和全面解决问题还是两回事。</p><p>前面征集过大家的问题，这里集中说几个。有人问，能不能直接有个大菩萨、佛祖转世下来，把道理告诉人间？我认为不行，已经试过很多次了。</p><p>越高级的上位面生命，越干净、越简单，也越容易沟通天地。比如最近我说生成了道魂，上面的大领导还问，怎么目光看着有点呆滞？其实是清明、简单。</p><p>可在下面生活不一样。要是直接下来就能解决问题，还用得着我们这样的人吗？上面的智慧带得下来，却未必能让人在下面活下去。太干净、太简单，出门就可能被骗。</p><p>所以我讲的办法，是让至高佛界、至高道界的人，转世到较低、较脏的位面里经历。我一直说，天道掌握轮回门，就很难有真正的敌人。你总要生孩子、要繁衍，下一代是谁，可能就不是你决定的了。</p><p>我理解地藏王菩萨，就是从佛界转到幽冥鬼界，再一点点成长。所以既懂佛法，又熟悉那个环境，才能创造出在那里可以用的佛法。普通佛法直接搬过去，未必好使。</p><p>人间也一样，要经过漫长时间，熟悉人间、魔界、碎片空间、夹缝空间这些环境，再结合佛界、至高道界的东西去讲，才能贴合。</p><p>还有人问，很多人聪明、能挣钱，为什么你说从法界看不算有智慧？因为他现在的所作所为，不一定让未来的自己更舒服、更快乐、更幸福。</p><p>比如我对考公务员就常有这个疑问。你没有相应条件，又想上升，好不容易到一个位置，后面还有很多限制和风险。我有个朋友，七十岁，因为很多年前牵扯到一些事，据我了解被判了十五年。也曾经是个优秀的人，这一辈子何苦呢？如果一条路很难善终，为什么非走？</p><p>挣到钱的老板也是，要看自己所处的时期，看看历史，比如汉武帝后期发生过什么，去读读冯唐讲《资治通鉴》的东西。读书得读有用的，时政也得看。知道了却舍不得走，后面又可能走不了。聪明了一辈子，最后没办法善终，何苦呢？</p><h3>一条至高智慧，还需要别的东西配合</h3><p>无上正等正觉算最高智慧吗？“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提。”在我的理解里，这是增加能量、增加福报的至高智慧。</p><p>但只拿这一条在人间活，没有其他东西辅助，你可能走不到底。这一条的原则没问题，可还得掌握别的东西，包括怎么在长久利益、短期利益之间取舍。</p><p>什么叫智慧圆满？各种事情，都能在很长的时间里，保证正确且有利。做不到，怎么叫圆满？</p><p>比如我说观世音菩萨给我的智慧打分，有时八点五分，有时八分。如果十分是满分，差的那一点五分、两分，就代表某些事情，我现在的认知还不能确保所作所为在未来圆满，可能带来伤害，或最后结算拿不到满分。</p><p>我现在也就是百分之八十到八十五做得还可以，其余仍有想不明白的。也知道某些地方不对，可能修行不到，还是不愿意选择，没办法。</p><p>怎么升级？不断磨练。在利益众生、帮人解决问题的时候，要能指出对他长远正确且有利的方法。他愿不愿干，是他的事，至少你能指出来。</p><p>《人类说明书》要干的，就是懂了理论之后，带大家解决生活里的点点滴滴：怎么做，怎么想，怎么保证执行，才能更长久地正确且有利。</p><p>讲那么多真相，是让你清楚一个决定怎么推导出来。但知道真相不是最后目的，目的是解决方方面面的事情。指望所有人自己总结应用，不现实，那就告诉他结果，带着练习，重新建立所思、所想、所行的方法。所以需要红尘道场，帮助大家练得更全面、更高、更长久。</p><h2>七 建立智慧思维体系的十二条</h2><h3>前三条：知识、认知与意义</h3><p>终于讲到最后了，今天讲得有点多。学完别直接扔了，得像意义思维一样，分析事情时真按这个路子走。我总结十二条，不算完善，先当初级版本。要允许我们犯错，允许在错误里成长。</p><p>第一，平时多看、多听、多学《人类说明书》《逆修觉者》《真相》《法界天机》这些知识。做事情时，用学到的原则对照一下，现在的决定合不合适，符合原则，再继续做。</p><p>第二，建立人间的知识体系。现在逐渐进入大V时代。那些动不动喊“听懂了掌声”的，或者空说某种东西是一种智慧的，越来越不好使，因为大家整体认知提高了。现在更需要说实话的人。</p><p>像我教这些知识体系，都是不收费的。</p><p>我教知识时，咱们之间没有这层收费关系，我希望你跟着学就行。忽悠不忽悠都不收费，那我有什么必要忽悠？这是我自己的想法。</p><p>现在网上一些大V，尤其海外的一些人，说的东西比较实在。到底对不对，也可以放到更长时间里验证。</p><p>可以多听时政、经济。比如我提到的老王、鲁社长，还有讲经济的小林，这些内容我觉得讲得很好。别净看八卦，对你没多大帮助。人间的知识体系也要建立起来。</p><p>第三，先想清楚意义。你要干什么，做这事是为了什么？我看过一个短剧，夫妻都失业，讨论未来怎么办，讨论两个小时，没结果。又想挣钱、解决危机，又不想吃苦，那讨论什么？如果不能解决收入问题，这次讨论的意义在哪里？</p><p>再比如，发现老公跟一个妹子多聊了会儿，你先想，此时最该做什么，想得到什么结果，再去跟他扯。别发完脾气，连自己的目的都不知道。很多人做事真不想结果，只凭感觉，这种人不在少数。</p><h3>第四至第六条：后果、概率与情绪</h3><p>第四，想后果，尽量推三到五层。我做完会得到什么，得到之后会产生什么影响，那个影响又会产生什么后果？推几层，觉得合适，再做。前四条能做到，我觉得就能超过一半人了。</p><p>后果有两个维度。一个是影响。比如买了一辆跑车，发朋友圈，目的是什么，会带来什么？中了五百万，公开告诉大家，亲戚会有什么反应？别只做、不想。影响的影响，再往下推三到五层。</p><p>另一个维度是时间。一个月、一年、十年、三十年之后，甚至按我说的下一生，会有什么影响？不合适就别做。很多事，放到更长的角度想，可能就不做了。</p><p>第五，不要对低概率的事情抱有过高期望。</p><p>什么叫低概率？以后讲人类金字塔还会说。比如你成为富人的概率有多大，婚姻幸福的概率有多大？我在直播里拿东北举例，随口说了“百分之七十出问题”。我要说的是，别只按自己最想要的结果来想。</p><p>很多人对低概率的事情抱极大期望，活在幻想里。你得看看自己的想法，实际有多大概率。</p><p>第六，检查决定里有没有情绪。喜欢一个东西就必须买，跟谁较劲就必须把那句话说出去，这都有情绪。情绪上来的时候，只要不是必须马上处理的生死急事，就先别作决定。</p><p>有人说太扎心了。其实很多事成功率本来就低，只是自己不认可。看看一辈子有几个人富，凭什么一定落到你身上？可你心里已经把自己的可能性放大到百分之九十九以上了。</p><h3>第七至第九条：求助、验证与原则</h3><p>第七，能不能找高人指点？前面都想过了，人还是有思维茧房：认知就这么大，没办法发现认知以上的问题。</p><p>认知更高的人一看，就知道你哪里选错了；自己没有那个认知，就看不出来。身边有这样的人，把事情说给他听，点你一句，可能比自己苦上十年都强。</p><p>第八，按我这套方法，用法界成相看一下靠不靠谱。我做很多事，也会找仙家、神，比较大的事找更高级别的菩萨去看。确定没问题，再往前冲。你觉得各方面没问题，却还没有成相，按我的理解，一定有认知之外的东西出了问题。</p><p>第九，在天道、人道的大原则上别出问题。明显违反规则的事，不要去做，不要铤而走险。</p><h3>第十至第十二条：能力圈、反馈与确定</h3><p>第十，能力圈以上的事情不要碰，做能力圈以内的事情。</p><p>人贵在自知之明，这点很重要。有女生找我算姻缘，说自己特别漂亮，为什么还没人找？我看了照片，觉得经过PS都没有她自己说得那么好。我就问，身边没有反馈吗？</p><p>比如你走在街上，有没有很多人回头看？做游戏主播，说可以花一千块加朋友圈，有多少人愿意？或者拍生活视频，放半年，能不能有五十万、一百万粉？我举这些例子，是说别光凭自己觉得。</p><p>这就到了第十一，建立反馈、修正和复盘体系。老觉得自己优秀，总得跟外面的反应对应一下。范冰冰走到街上，一堆人看，她不用怀疑自己是美女；凤姐走到街上，情况就不一样。这是直播里的一个玩笑，但要说的是，你得有反馈。</p><p>第十二，只做自己确定的事。很多人根本没想清楚要不要做，就跟着别人干了。别人干什么，你就干什么，跟你有什么关系？这一点一定注意。</p><h3>把十二条练成习惯</h3><p>这十二条还不完善，但做大事之前，可以先用它建立一个判断过程。行，再做；不行，就别做。</p><p>我平时也是这么判断。尤其情绪上来，会先想办法压住。不是每件事都能做到，但至少能意识到：现在这个决定带着情绪，不对，先等等。能意识到，已经不一样。这里面的东西，你能用上一半，就很厉害。</p><p>都用上，人生出大问题的概率会低一些。能不能大富大贵，我说还得看命，但至少不容易作太大的错误决定。</p><p>用熟了，判断可能就是几秒钟，不会耽误太多。刚开始逐条对，可能花很久。可很多人宁愿在错误里痛苦、悔恨，也不愿花一两分钟，或者一两天，把这些东西校正一下，很奇怪。</p><p>咱们只渡能听懂、也愿意修行的人。为什么叫逆修觉者？不是明白了就一定能做到，改变生活习惯是很大的问题。这些东西，其实就是在改习惯。</p><p>希望大家学完真能用，别又还给我。成立红尘道场，就是给大家练习、养成习惯的地方。不然最后又变成罗辑思维、樊登读书会，学得再多，没应用，还是一场空。</p><p>好，今天到这儿，别忘了点赞、收藏、分享。谢谢大家，今天忽悠时间太长了，拜拜。</p></div></noscript>
