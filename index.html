level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p78","index":78,"text":"所有对你产生伤害的规则，都无法再伤害你，我们才认为你真的成佛。佛教有个说法叫大自在身。为什么叫大自在？因为产生负面影响的一切规则、枷锁，都从身上拿下去了，那不就自在了吗？身上还有枷锁，怎么称为大自在？其实很简单。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p79","index":79,"text":"解脱的四个境界","level":2,"key":false,"section":"ep3-p68"},{"id":"ep3-p80","index":80,"text":"解脱加上四个境界。发现有问题，是觉醒；解决问题，是解脱。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p81","index":81,"text":"第一个境界是逃避。比如修淫念，看一个大姑娘很喜欢，一产生这个心，知道不对，动了男女桃心。所以跑到深山老林，不见女色。女色对你有没有伤害？没有了。但是解决这个问题了吗？没解决，只是在逃避。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p82","index":82,"text":"第二种是对抗。碰了女色，天天想着不净，有个叫不净观，对不起，业务不精。想着这就是一个皮囊，里面包着屎尿粪便，说白了，属于自己恶心自己，这叫对抗。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p83","index":83,"text":"白骨观也是对抗，不过是转移概念；不净观属于自己恶心自己。这些都是一种方式，但当你起心动念有这个想法时，也没有达到究竟。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p84","index":84,"text":"真正达到究竟，我们称之为免疫。比如身边有没有感冒病毒？仍然有。但吃完感冒药之后，身上产生一种抗体，虽然还能吸引感冒病毒，病毒也继续侵蚀我，却已经不会产生任何影响，这叫免疫。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p85","index":85,"text":"一次免疫是圆满吗？肯定不是。必须次次圆满，在任何情况、任何等级下，都要圆满。能达到这种状态，就叫永不退转。好，四个等级。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p86","index":86,"text":"没有解脱时的消耗与熵增","level":2,"key":false,"section":"ep3-p68"},{"id":"ep3-p87","index":87,"text":"很多同学问，如果觉醒不了，或者没按你的方法修行，会怎么样？那叫众生恒定向下，要进入熵增法则。只要不能解脱这些约束，一定进入熵增法则里，基本就叫瞎折腾。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p88","index":88,"text":"会不会有钱？会，但整个轮回过程，只是消耗自己的福报。会不会有名气？通过努力也会，但绝大多数叫消耗。使劲修行能不能飞升？可以位列仙班，干得好，说不定能当天帝。但记住，有33层天，再怎么努力，往上涨一两层天问题不大，想涨更多，对不起，只能说瞎折腾。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p89","index":89,"text":"就算达到天帝、大罗金仙，只不过往上冲，最终还得往下走。为什么？始终没有解决这个空间对你的规则影响。当你把负面规则影响全部解决，又能得到正向力量时，才能往上走。这很重要，上次没说，这次补充。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p90","index":90,"text":"四 把有用的知识成片并带进生活","level":1,"key":false,"section":"ep3-p90"},{"id":"ep3-p91","index":91,"text":"缺少定义与应用过程的问题","level":2,"key":false,"section":"ep3-p90"},{"id":"ep3-p92","index":92,"text":"上次还说，古人和圣贤定下的很多东西，没有真正的定义。没告诉你，比如智慧存在是解决什么问题，空色存在是解决什么问题。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p93","index":93,"text":"修佛法，最后要实现什么目的？无上正等正觉，平时应该怎么做？没说。这些东西传下来了，但没有定义，没有详细说明，我们认为这对整个人类有阻碍。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p94","index":94,"text":"古人的很多知识点，会出现没有意义的情况：学完后意义是什么，不知道；目的是什么，不知道；使用场景、应用条件、成本、代价，包括修行过程，都没说，这是很大的问题。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p95","index":95,"text":"最后一帮大聪明在后面猜。猜对了，可能有帮助；猜错了，扯淡，费一辈子努力，最后也修得扯淡。2500年内，虽然得到圣贤一些高端智慧，其实没怎么改变人类。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p96","index":96,"text":"这里涉及几个问题。第一，很多知识是我自己起的词，叫圆满的结果性知识。告诉你的东西对不对？对，但没告诉你怎么得到，只说修完是这个状态，怎么修出这个状态，不知道。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p97","index":97,"text":"比如无为而无不为，比如“不修智慧的时候就得智慧”，比如佛祖去燃灯佛那里无所得。你都无所得，我们应该怎么样？他说得对，但这种圆满的结果性智慧没办法操作。学武功最后无招胜有招，但之前的状态怎么得到？这就是问题。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p98","index":98,"text":"第二，很多东西是描述性的说明，不是真正定义。比如什么是爱情，没有定义，最后翻到的只是“我认为什么是爱情”，在描述爱情的一种状态。问什么是智慧，他说智慧能解决什么问题，列出其中一种状态，这叫描述性的解释，不是定义。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p99","index":99,"text":"最后没人知道修佛应该怎样。再加上一些说法，比如把佛祖当柴火烧，文殊菩萨是挑大粪的，说得对不对？是对，只是某一种意思，但没告诉你怎么弄。王阳明说“心外无物”，什么是心，为什么心外无物，又没解释。一帮大聪明只能琢磨，琢磨出一个就说想明白了。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p100","index":100,"text":"还有致良知，什么叫良知？不知道。外国史咱没学过，但中国老祖宗的文化，绝大多数没有明确的定义。前几天看到一个大聪明说：“天地不仁，以万物为刍狗，我说的跟你们不一样。”","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p101","index":101,"text":"其实说出什么都没用。只要不是老子亲自跑过来，告诉你具体什么意思，其他人都是自己琢磨。反正没有具体标准，那说呗。你看到的所有东西，都是大聪明集合。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p102","index":102,"text":"第三，叫没有用的误导，就是瞎用功。比如“本来无一物，何处惹尘埃”，前几天好像有个在美国学佛学的，据说他们几十个博士生都用这句话做论文课题，不闲的吗？","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p103","index":103,"text":"像无无这种东西，佛界都不一定能确定有，学完关你什么事？你能在人间达到无无吗？先琢磨怎么把身边的事修好吧，这就是一帮大聪明干的事。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p104","index":104,"text":"古代圣贤有没有把东西传下来？传了，但都是零星、点状的知识。老子说一部分，佛祖说一部分，圣贤又说，最后大家真的明白了吗？还是没明白。这叫星星之火没有燎原。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p105","index":105,"text":"为圣贤打补丁与体系的形成","level":2,"key":false,"section":"ep3-p90"},{"id":"ep3-p106","index":106,"text":"我们要干什么？为圣贤打补丁。成不了圣贤，打打补丁还是可以的。第一，把有用的知识成片；第二，把有用的知识真正生活化。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p107","index":107,"text":"我根本不关心谁的理论高、谁的理论低，只关心一个指标：学完以后，在轮回中有没有不再被这些规则伤害。如果学完了，规则该怎么伤害还怎么伤害，那就学了个寂寞。不伤害就是解脱，伤就是没解脱。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p108","index":108,"text":"所以一定要建立不一样的思维模式，把轮回里能持续伤害人类的问题，一个一个解决。问题很多，咱一个一个解决，应该怎么做人、怎么做事，都是这样。别跟我说无无、无无无那些高深的东西，我更关心这个事有没有从生命里拿掉。拿掉就OK，没拿掉，扯淡。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p109","index":109,"text":"这也算我的一个天赋神通。我那天仔细琢磨，自己经常干的事，就是研究古人的东西，看得一知半解就觉得不对，自己瞎琢磨，琢磨完创造出一套新的东西。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p110","index":110,"text":"比如紫微斗数，我那时候叫金刚佛光。全天下紫微斗数分两种，一种是金刚佛光的紫微斗数，一种是其他。其他的基本都是在原有基础上，大师们发现新点，或者有使用心得，基本没例外，但我的东西跟他们完全不太一样。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p111","index":111,"text":"以后修行体系也一样。我看完一堆人的体系，发现不太对，不应该这么修。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p112","index":112,"text":"但为什么，不知道，就在那里琢磨，过程很痛苦。尤其当年紫占，从迷茫、完全不知道对错里面，一条一条总结正确的东西，很费劲。大量试错，真有上万次错误，才总结出一套体系，修行这边也一样。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p113","index":113,"text":"总结了很长时间，正好将近十年，有十万个以上案例，不停看到不同人生。大量试错、大量看，发现真实的东西跟传统不太一样。知识点必须成片，不是突然悟了一两个就有用。古人终其一生，也就悟那几个知识点。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p114","index":114,"text":"那几个点不足以真正解脱、往上走，必须成片，包罗万象，涉及各个方面都能解决，这才是有用的知识。所以这就是我的天赋神通，专门喜欢研究，否定传统，再创一个新的。新的好不好使，咱们看疗效。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p115","index":115,"text":"我希望有一天，人间的修行体系也是“点亮星空的修行体系和其他”，希望能做到。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p116","index":116,"text":"紫占等我七八十岁的时候吧，这么好的运，别浪费在紫占上。对不起紫微星君，这么好的机会、大运，肯定要多为人类做事情。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p117","index":117,"text":"等76岁之后走大败运，开始写回忆录，什么决定都别做，天天啃点馒头、喝点茶。走败运别做决定，别乱花钱，离医院近点，方便抢救。其他时间，不是写回忆录，就是吹，或者聊紫微。这是我给自己想的76岁以后的养老生活。哪天一旦Game Over，拜拜，就完事了。","level":0,"key":false,"section":"ep3-p90"},{"id":"ep3-p118","index":118,"text":"五 四大框架与次第修行","level":1,"key":false,"section":"ep3-p118"},{"id":"ep3-p119","index":119,"text":"跟着老师学习人类说明书","level":2,"key":false,"section":"ep3-p118"},{"id":"ep3-p120","index":120,"text":"修行有两条线，一个是自觉、觉他、觉满，一个是他觉、觉他、觉满。自觉这件事，我觉得你们就算了。包括这么多圣人，能不能把人间坑你们的指标和规则都找出来，还不一定。一辈子也就想明白那点事，你们别再自己觉了，找明白人跟着学就行，叫他觉。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p121","index":121,"text":"就像从小学到大学，学了将近两万到四万个知识点，哪个也不是你发明的，耽误成才了吗？压根没耽误。觉醒和修行之路不易，要有老师带着。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p122","index":122,"text":"老师带着学什么？以《问道》的形式学人类说明书。框架有四个：逆修觉者、灵魂觉者、法界天机、道法自然。咱这一辈子写出这四本书就行。为什么要有这四部分？没办法，我也是吃了亏才发现，这四部分得给。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p123","index":123,"text":"天道考核与弱化神通","level":2,"key":false,"section":"ep3-p118"},{"id":"ep3-p124","index":124,"text":"第一个是天道考核。一定要站在天道立场，想想为什么成立人间。是让你当大忽悠、当大仙、当神算子吗？想什么呢？天道本身的意义，是考核人间，是培训、提高，所以要奖励这些东西。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p125","index":125,"text":"你们认为我们是什么？比如“小数除不尽”的这种人，叫系统漏洞。怎么都会有小数除不尽的这种人。漏洞分大、小，大点的漏洞能使用更多上维空间的东西，就叫有神通。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p126","index":126,"text":"但从上古年代往下走，整个世界越来越弱化神通。以前没仔细想，后来才发现，整个天道在弱化神通，但不是说不让你有。所以有很多神佛仙、鬼怪精怪的故事，灵异事件也时不时发生，却让你证明不了。这叫弱化神通。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p127","index":127,"text":"为什么一定弱化神通？为什么神佛仙不能直接显现，让大家直接求神拜佛，不就完了吗？就是为了防止这些事情，不要让大家求神拜佛。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p128","index":128,"text":"比如天道认为，创立人间界是让你学神通来的，是让你修心性来的。结果这些人没学心性、没学规则，没用正常的智慧思维解决身上的枷锁，最后都变成求神拜佛，哪行？那还要人间界干什么？法界不都能看到神佛仙鬼吗？哪个法界看不着，哪个法界不能使用神通？专门创造一个不能使用神通的地方，是为了让你偷摸使用神通的？所以这件事逐渐开始出现问题。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p129","index":129,"text":"比如之前说的南山真人、倪海厦、白龙王，都是非常有神通的人，但为什么都有突发死亡事件，不是那么长寿？有没有想过？我以前还认识一个广西特别厉害的师傅，帮人救人一辈子，真的很厉害。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p130","index":130,"text":"但为什么早亡，为什么有五弊三缺？一定要想想。因为你在人间强化神通，让更多人相信，变好不是找自己的问题，而是求神拜佛，用神通术法、风水、算命、符箓解决。这和天道设立人间大相径庭，所以天道惩罚很大。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p131","index":131,"text":"不要觉得这些人积德行善了。他们有没有短时间帮助你？有，包括还阴债，都在短时间帮你。但在轮回里，真的从问题上解脱了吗？没有，更多是拿自己的经济和天地做了交易。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p132","index":132,"text":"2025年底，我再去弄的时候，一部分认为我们有功德，一部分认为没有功德，还祸乱天下。所以为什么2025年底开始重新做这些事？首先要弱化神通，以修心、修智慧、觉醒和解脱为主。这是我们重新更改的东西，修心很重要。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p133","index":133,"text":"木桶原则与学习次第","level":2,"key":false,"section":"ep3-p118"},{"id":"ep3-p134","index":134,"text":"第四个，木桶原则。大家知道我之前干什么。为什么有的人好使，有的人不好使？因为法界力量只是木桶里的一块木板，其他东西都不行，肯定不好使。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p135","index":135,"text":"比如求贵人符，天天欠逼五六地跟贵人说话，贵人能帮你才见了鬼；请小人符，天天还踹人两脚，那人家不是你的小人才怪。所以得把所有木板弄好，最后用法界力量。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p136","index":136,"text":"为什么四个地方一起修？前三个必须成为次第。未来一定叫次第修行。首先修认知，知道轮回怎么坑你，把这个先修好，得有一个好的修行状态。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p137","index":137,"text":"没有修行好的状态，后面的东西跟你没关系，可以学，但没资格体验。2028年吧，从2028年开始，以后想学法界，想体验灵魂觉者，逆修觉者的考试得合格。想在我这里请符、还阴债、解决风水、算命，逆修觉者和灵魂觉者至少得考试及格，才有资格。不然我不卖，我也不缺这点钱。这是未来的次第学习。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p138","index":138,"text":"以前学不学，先直接卖了。有的帮上忙，有的没帮上，有的还建立错误认知，认为只要花钱就能解决。尤其洗灵，把天地怨气、不好的东西洗掉，有的人出去找小姐，回来赶紧洗灵，给我干这个，那肯定助纣为虐。所以以后前面过不去，连洗灵的资格都没有。","level":0,"key":false,"section":"ep3-p118"},{"id":"ep3-p139","index":139,"text":"六 逆修觉者 修真相认知与思维模型","level":1,"key":false,"section":"ep3-p139"},{"id":"ep3-p140","index":140,"text":"反本能 反惰性 反旧我","level":2,"key":false,"section":"ep3-p139"},{"id":"ep3-p141","index":141,"text":"继续说每个阶段主修什么。逆修觉者解决真相、认知、思维模型的问题：这事应该怎么想、怎么看、怎么行动，这是逆修觉者应该做的。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p142","index":142,"text":"逆修觉者不涉及任何神通法术，所以任何国家都可以传播，不涉及神佛仙、封建迷信，就是思维模型：碰到事情应该怎么想，应该具有什么思维。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p143","index":143,"text":"哪个地方都可以传播。既然活在梦幻泡影中，一条条枷锁把你捆在梦里，我们就要一个个从你身上拿下来。记住，非常痛苦，就跟很多人减肥一样。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p144","index":144,"text":"包括血糖仪，为什么刚开始很痛苦？吃完马上出数值，你知道这个东西吃不了了，就难受。原来那样吃不行，就得改一种吃法，都在跟自己斗争。所以叫反本能、反惰性、反旧我。不把过去的自己杀死，如何获得新生？","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p145","index":145,"text":"像我糖尿病，如果一直保持高血糖，还想活到七八十岁，想什么呢？能再活两年就不错。所以要做决定，想多活，数值必须稳定、好；不想活，那随便。想活得长，就必须改变之前的吃饭习惯。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p146","index":146,"text":"包括改变食欲。我现在只有早上吃主食，其他时间不吃主食，都吃黄瓜、胡萝卜，偶尔啃“四分之一半”的苹果。就这样还降不下180，你想反旧我多难受？但一旦做好，就没问题。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p147","index":147,"text":"脖子难受，就拿颈椎器固定。我戴着颈椎器睡觉，是防止睡着后窝着，尤其翻身时窝着睡，自己不知道，又控制不了，那就直接拿颈椎器、牵引器控制住，肯定难受。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p148","index":148,"text":"但弄完后，至少这一两周不找按摩也没问题，脖子没事，肌肉不紧张了。这叫反旧我，之前的我会让我死得更快、更难受，必须反掉。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p149","index":149,"text":"为什么叫逆修觉者？因为非常艰难。我们对伤害自己的一切太习以为常，把很多认知、思想、行为、感受、下意识反应，都变得习以为常，但就是这些事情在不停伤害我们。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p150","index":150,"text":"所以就算明白，也必须做成一个逆修者，“天地一逆修”才行，不容易，等同于逆天改命。改变曾经的习惯、意识、认知、反应，其实就相当于逆天改命，很难。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p151","index":151,"text":"天道思维与人道思维","level":2,"key":false,"section":"ep3-p139"},{"id":"ep3-p152","index":152,"text":"我们用三个思维改变：天道思维、人道思维、人设思维。天道思维的主题，是用人间之外的思维，改变人类的认知、判断和行为。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p153","index":153,"text":"古代圣贤有没有弄出来？空色、有无、六道轮回、因果，都说了，但没说透，才导致你不知道什么是智慧、慈悲、大爱、不恨、冤冤相报何时了、贪念。这些绝大多数建立在无数世轮回的角度，看你的行为到底正确还是错误。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p154","index":154,"text":"有些东西让我们舒服、快乐，有成就感，甚至短时间帮了别人，为什么还认为错误？比如现在帮人化解阴债，为什么大天道轮回认定你有问题？他被冤亲债主折腾成这样，为什么不能帮？很简单，第一，对他曾经伤害的人不公平。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p155","index":155,"text":"第二，他没通过感悟理解到底错在哪里，你不能保证未来不再犯同样错误。所以从无尽轮回角度看，还阴债没有意义，甚至更长时间看是害了一个众生，只不过没办法。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p156","index":156,"text":"第二个是人道思维，解决的是用正确的人间做法，解决碰到的问题。我觉得《道德经》里这方面的东西很多。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p157","index":157,"text":"人设思维与信任","level":2,"key":false,"section":"ep3-p139"},{"id":"ep3-p158","index":158,"text":"第三个叫人设思维。我们会下意识给人贴标签，能不能不贴？做不到，那是在改变整个人类设定。既然一定贴标签，就有一个法则，叫他人即世界。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p159","index":159,"text":"有本书叫《定位》，20年前我就见过，应该出了几十年，也没见几个人真正读懂并用在生活里。不是知道得少，是知道的东西没固化在行为上。学了定位，就要反向给自己贴标签，帮助别人更好了解你。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p160","index":160,"text":"这很重要。颜值、气息、行动、心性，最后产生信任。现在咱们有几千铁粉，为什么是铁粉？很重要的一点就是信任。很多东西我能给你们证明吗？证明不了，尤其很多产品，能证明什么？证明不了，所以这是非常有缘分的事情。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p161","index":161,"text":"建立的就是信任。信任没有为什么，就是我信你，所以你说的东西我会做，这非常难得，但信任很难建设。","level":0,"key":false,"section":"ep3-p139"},{"id":"ep3-p162","index":162,"text":"七 灵魂觉者 法界天机与道法自然","level":1,"key":false,"section":"ep3-p162"},{"id":"ep3-p163","index":163,"text":"灵魂觉者与修行阻力","level":2,"key":false,"section":"ep3-p162"},{"id":"ep3-p164","index":164,"text":"第二个是灵魂觉者。主要解决的第一大事情，叫修行阻力。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p165","index":165,"text":"你得把灵魂上的阻力弄没。比如读经读烦了，读出淫念或者谤佛的想法，这叫什么？业力重。自己根本不知道，不愿学习、不愿做事，到底有什么阻力在灵魂上影响自己。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p166","index":166,"text":"所以有时候做完一些东西，会松快很多，接受、听懂一些东西，会不一样。这是灵魂觉者要干的事。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p167","index":167,"text":"主要解决灵魂、灵力、能量。能量分正负，负能量消除，正能量提升。还有脉轮、前世。为什么涉及前世？有些人有怪异行为，需要解释，知道原来是这种情况，就明白了。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p168","index":168,"text":"对于抑郁症、魂悲、魂裂、魂缺、魂碎，他的思想不完整，跟他讲再多逆修觉者的东西，也理解不了，或者做不到。见别人反感，见一些东西害怕，不是讲道理的事，是灵魂上有些负面的东西，想办法拿掉。包括对一些人的恨、执念的爱。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p169","index":169,"text":"很奇怪的一些行为，比如同性恋，都是很大的问题，包括恐惧、怯懦、仇恨、抗拒亲密。这些不是劝的事，直接过来，把那东西拿掉，自己就好很多，就这么简单。包括身上有病气，也是很正常的。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p170","index":170,"text":"还有业力虫子、思维生命、影魂，都要解决。对灵魂、思维和法界的思维进行修补、清理、补充、增益、引导、陪伴。没有这些，想顺利学正法，不一定接受得了，身体里肯定有东西捣乱。这是灵魂觉者要做的事。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p171","index":171,"text":"法界天机的范围","level":2,"key":false,"section":"ep3-p162"},{"id":"ep3-p172","index":172,"text":"第三个是法界天机。上两个弄完，需要知道法界有什么东西，哪些有影响，哪些有帮助。灵魂觉者和法界天机，都只限海外。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p173","index":173,"text":"绝大多数国家允许，只有少部分，比如朝鲜、某些大国，会有不同意见，所以不在那边发展，都在YouTube、Facebook上说这些就完了。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p174","index":174,"text":"法界天机，我希望大家清楚知道一个真实的法界。法界无限宽广，但希望你们了解得足够多、足够系统。别最后还像一帮傻子，觉得有钱就多生儿子，靠概率总能生出一个厉害的。历代帝王、有钱人都有这个想法，但没解决。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p175","index":175,"text":"有些方式，不用使劲生，只生一个也能解决。生一堆像小猪崽，该不行还是不行，数量不决定质量。两个特别优秀的男女，能不能配出特别天才的种？很多人经历很多次了，高斯、爱因斯坦都没配出来，大概率你也不行。有些全球首富、曾经华人首富也干过，没做出这事。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p176","index":176,"text":"所以基因只能决定相貌，连身体素质都不一定能决定，更别说智商、福报，那绝对不可能，别费劲了。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p177","index":177,"text":"以后的法界天机会更全面、更细、更系统。神佛仙鬼精怪，天地人三魂、大天魂、大地魂、影魂、识魂，怎么影响你，都会说。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p178","index":178,"text":"各个位面，大世界比如六道、六道十界，小世界更多，还有碎片世界、夹缝空间、平行宇宙、思维生命。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p179","index":179,"text":"还有影魂，各种法术、符、阵、灵，算事、看事、听事、观事，念头、天劫、降头、蛊虫，都会给大家说一遍。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p180","index":180,"text":"还有法界历史演变，比如《山海经》为什么有的准、有的不准，怎么回事？法界历史和趣闻，轮回、本源、生死、因果，包括上面谁负责管，能说的都说，不能说的不行。时间法则，过去、现在、未来，也可以说说。这是老本行，之前讲了一部分，但很零散。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p181","index":181,"text":"道法自然与回归平静","level":2,"key":false,"section":"ep3-p162"},{"id":"ep3-p182","index":182,"text":"道法自然反而简单。能学到最后，最后的事叫回归平静：怎么平静生活、怎么随缘、怎么不恨、怎么大爱，还有咱们说的五爱，都是道法自然的事。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p183","index":183,"text":"这些东西估计大概一两千集。但以为学完就能成功？我可以很负责地说，别想。因为人类学习要有次第，所有东西只是知道，并没有形成知识固化，也没转成自己的本能，这非常重要。","level":0,"key":false,"section":"ep3-p162"},{"id":"ep3-p184","index":184,"text":"八 红尘道场 让知识在生活中落地","level":1,"key":false,"section":"ep3-p184"},{"id":"ep3-p185","index":185,"text":"从知道到固化 应用与本能","level":2,"key":false,"section":"ep3-p184"},{"id":"ep3-p186","index":186,"text":"连跟了我这么久的学生，有些法则在自己生活中犯了，居然没有感悟，很神奇。所以就算法则考试得100分，也没用，必须想办法，第一，法则固化、知识固化。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p187","index":187,"text":"第二，转化成本能。人类整个思维也进入第四个阶段。第一阶段，有书就行，谁家有几本书，就会不一样。第二阶段，印刷阶段，书多了，谁读得多，谁占优势。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p188","index":188,"text":"第三阶段叫精读，比如逻辑思维、樊登读书会，解决哪些东西有用、哪些没用。但记住，绝大多数东西对你没有用，就算有用，学完也只是知道，没有知识固化，没有形成本能，更没有进入知识应用、生活应用，所以学的东西没用。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p189","index":189,"text":"一生学了很多，却解决不了命运问题，就是没有在生活中改变一些东西。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p190","index":190,"text":"怎么办？最重要的其实不是讲这些，讲了没什么意义，真正的是红尘道场。主要干什么？知识落地化。我不关心哪个知识更高级、更深奥，只关心能不能在生活里解决问题，能不能让轮回中的一些错误永不发生。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p191","index":191,"text":"做不到这点，跟曾经圣贤们做的事几乎没有两样。所以我们最伟大的地方是红尘道场。但现在开不起来，因为知识还没讲完，更别说带着练习了。红尘道场很重要，也是解决所有位面众生问题的一种重要方式。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p192","index":192,"text":"实用并可以放心提问","level":2,"key":false,"section":"ep3-p184"},{"id":"ep3-p193","index":193,"text":"2025年1月之前，这个法则在天地间不存在，1月之后存在了。为什么可以用它帮助自己、解决问题？因为法则有根、有魂，这很重要，叫天道护佑。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p194","index":194,"text":"红尘道场解决几个问题。第一个是实用，不实用就没意义。一定在生活中使用天道、人道、人设知识，真正解决问题。家庭关系、婚姻、子女教育、情绪、人际沟通、人生方向、事业、财运、身体健康，都要实实在在落实。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p195","index":195,"text":"我们不玩虚的，别管什么佛祖上面还有没有佛祖，跟我们有什么关系？更关心有没有改变生活中的一个恶习，这比有没有某个佛祖重要。用规则和方法，让生活真正顺畅起来。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p196","index":196,"text":"第二，红尘道场一定让大家随便问。像我们从苦命人家长大的，从小到大学会听话、努力、忍耐，却没人教怎么判断念头正确还是错误，怎么处理情绪，怎么做决定不踩雷，怎么经营人和人生之间的关系。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p197","index":197,"text":"努力一辈子，一直不停应付一个又一个问题，能不能提前知道问题存在？上学不会学习，没人教，父母只会说。工作时人际关系、工作方法、办公室政治，没人说。谈婚论嫁犯很多错误，也没人告诉。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p198","index":198,"text":"到现在，很多男生思维理解不了女生，女生理解不了男生，基本是两个物种互相对抗。别说一起解决外部问题，不互撕就不错。所以明明很努力爱众生、爱家人、爱孩子，最后却走进死胡同，努力未必得到好结果。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p199","index":199,"text":"哪里错了不知道，就算最后明白，也没时间，不可能重来。我们希望有个地方，大家真正放下防备、戒备，放心提问。这是为什么叫《问道》的一个重要原因。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p200","index":200,"text":"学习应用与善念得到回应的环境","level":2,"key":false,"section":"ep3-p184"},{"id":"ep3-p201","index":201,"text":"第三，给大家学习和应用的环境。任何东西都得先学，再用、练习、熟练。但不是任何环境都行。比如对别人的善解，叫论心不论迹，对家人、真正的修行环境可以，叫爱敬和道敬。你试试对办公室那些人无私，看会不会把你连骨头渣都榨没。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p202","index":202,"text":"所以一定有个地方，能产生善念的正反馈，真正应用这些东西，不要在其他地方乱用。因为其他人不一定是人，没有学习之前不一定是人。对非人类使用人类的东西，对自己会有伤害。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p203","index":203,"text":"还有很多人想改变命运。我应该50岁走下坡运，不想走，怎么办？拿福报撑。比如生我们家孩子的时候，福报还差点，怎么办？得“戒功德”，而且必须是度化之功，帮助别人的功德还不行。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p204","index":204,"text":"不要光在人间努力，说好好学习、努力工作、好好对人就能怎样，没用，因为没有那个功德、福报。需要一个环境，能够产生功德、福报，产生众生善缘，这非常重要。平时连自己都帮不了，还要帮别人，可能性多大？用你的方法，根本没戏。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p205","index":205,"text":"所以要有个环境，有一堆方式，真实有效地帮助提升功德福报，这也是红尘道场很重要的一点。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p206","index":206,"text":"因果碰撞 案例与榜样","level":2,"key":false,"section":"ep3-p184"},{"id":"ep3-p207","index":207,"text":"再下一点，叫因果碰撞。想明白一个东西，不是讲明白了就明白，需要具体发生、看到、领悟一些事情。要有因果撞，但具体什么因果能把你撞醒，不知道。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p208","index":208,"text":"每条法则、规则、知识，需要多长时间、多少年，发生什么事情，才能真正明悟？没人知道，也许十万年，也许下一秒。所以需要因果碰撞。没有这个，所学就算练得滚瓜烂熟，也不能真正入心、成为本能。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p209","index":209,"text":"这需要明悟。其中有一种悟，必须通过因果碰撞才能悟，别人帮不了，我也帮不了。只有某一天碰上，才会从我的东西、学来的东西，变成你自己的东西，融合到生命、轮回里，这没有办法。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p210","index":210,"text":"红尘道场需要很多优秀案例、榜样。学完具体怎么在人间应用，具体事情怎么解决，并不知道，所以需要案例和榜样。尤其像小三那个，我们觉得案例和榜样非常厉害，应该让很多人学习，能够解决很多人的家庭问题。","level":0,"key":false,"section":"ep3-p184"},{"id":"ep3-p211","index":211,"text":"九 收入 家庭与修行正循环","level":1,"key":false,"section":"ep3-p211"},{"id":"ep3-p212","index":212,"text":"知识免费与教学劳动的费用","level":2,"key":false,"section":"ep3-p211"},{"id":"ep3-p213","index":213,"text":"最后，红尘道场需要收入，记住，收入跟我没关系。尤其有些管制严的国家地区，神神鬼鬼、封建迷信的东西说不了，只能说逆修觉者。但逆修觉者可以法布施，可以改变很多人的思维、想法，可以形成产业链。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p214","index":214,"text":"我的所有知识不收费。我不认为知识应该收费，很多东西是上天给我的，不能拿着成为自己的敛财工具，所以知识不收费。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p215","index":215,"text":"包括现在的“子非”，当年太穷，收了点“紫薇”。但更多是带着你学习，收人工费，这没问题。现在整个人类说明书，所有知识全都不收费，记住，都不收费。以后如果出书，出版社或承包商可能收点费用。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p216","index":216,"text":"毕竟有成本。但电子上的东西没有费用，也不设什么乱七八糟的版权，设了没什么用。我也不太相信偷学的能比我讲得更清楚，因为不是你悟的，说再多，也没办法生活化、具体事情具体化，偶尔几个东西还可以。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p217","index":217,"text":"我鼓励大家学完，自己出去开班教学生，产生收入。收完钱自己揣兜里，不用给我。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p218","index":218,"text":"以前佛教、道教也好，很多传播这些东西是要收费的。看命、改东西，想让别人帮，也要付钱。所以绝大多数人在别处挣钱，在这里改命、获得帮助和提升，一旦提升失败，钱就白花了。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p219","index":219,"text":"我更希望，你免费学习我的东西，用它帮助很多众生，别人付给你辛苦费。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p220","index":220,"text":"有钱后，可以买法器、还阴债、处理法界的事情，甚至更好地学习。知识既然能改变别人、让别人变好，为什么不能成为挣钱、提高收入的方式？有钱之后，用修行的钱养修行，我觉得这最重要。几乎其他门派、体系做不到，但希望我们未来能做到。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p221","index":221,"text":"让家人成为修行的第一批受益者","level":2,"key":false,"section":"ep3-p211"},{"id":"ep3-p222","index":222,"text":"我不希望再看到学生拿辛辛苦苦挣的钱，找我算事、改事、请符、请法器，觉得这样是在消耗自己。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p223","index":223,"text":"第二，有好多女生学完知识，非但没提升家庭质量，还跟老公形成对抗，觉得老公土鳖、笨蛋，自己是修行人，老公不修行，就看不起老公，这绝对不能发生。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p224","index":224,"text":"第三，有些女生非常喜欢我们的东西，大半夜不睡觉，发视频、做宣传，在这里非常感谢，但这样不对。不能既花着老公的钱，又看不起老公，老公晚上想搂你睡觉还不同意，还去发我们的东西，不等着老公举报我们，等着什么？","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p225","index":225,"text":"所以学完这些东西，第一件事，先改变跟家人的关系。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p226","index":226,"text":"一定要让老公、父母、孩子，成为你修行的第一批既得利益者。","level":0,"key":true,"section":"ep3-p211"},{"id":"ep3-p227","index":227,"text":"花点钱无所谓，至少心里舒坦，人家也认。第二，不仅得到利益，还能产生收入、利益众生、产生福报，那老公管你干什么？第三，有了收入，家庭越来越有钱、越来越和谐，还有余钱购买法器、升级自己。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p228","index":228,"text":"最后，希望大家获得一种一生不会被别人否定、不会被时代淘汰的能力。芸芸众生中笨蛋越来越多，不耽误你度化，这辈子到咽气之前都有无量众生等着度化，所以不用担心，这事干不绝，慢慢来。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p229","index":229,"text":"陪伴与共同前行","level":2,"key":false,"section":"ep3-p211"},{"id":"ep3-p230","index":230,"text":"最后，我们需要陪伴。所有众生都太孤独，需要有人陪伴、指导、指出错误，需要有人共同前行，这才最重要，也是红尘道场很重要的一点。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p231","index":231,"text":"希望真正实现修行正循环：认知、修行、提升，消灭负面的东西，增加众生善缘、增加财富，实现真正的正循环。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p232","index":232,"text":"说完了，再说一下框架。我们要做人类说明书，分四大块：逆修觉者、灵魂觉者、法界天机、道法自然。其中逆修觉者分天道思维、人道思维、人设思维。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p233","index":233,"text":"整个讲课方式，以《问道》的方式讲课，希望是问自己、答众生。最后组成红尘道场，理论没问题了，一代一代、一届一届帮助众生解决生活里的问题，形成共同群体，一起对抗末法时代，很不容易。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p234","index":234,"text":"今天到这里，下集正式开始讲理论，讲认知思维那套东西，很关键，因为所有东西几乎都出自它。明白这个，就知道为什么这辈子努力也不管用，比我聪明十万倍也不好使，来自于这条法则没弄明白。好，下次再见，拜拜。","level":0,"key":false,"section":"ep3-p211"},{"id":"ep3-p235","index":235,"text":"好，撤退。","level":0,"key":false,"section":"ep3-p211"}],"note":{"title":"本课含概念修订","text":"本课第三章明确修订第二课的用词，把发现问题的“觉醒”与不再受伤害的“解脱”分开。","target":"ep3-p68","label":"跳到修订原文"}},{"id":"ep4","number":4,"name":"问道四","title":"认知模型","speaker":"悟聊天尊","source":"20260814_问道4_认知模型_整理稿.docx","date":"2026-08-14","description":"从行为反推思维模型、认知、真相与缘分，理解判断和沟通如何产生。","blocks":[{"id":"ep4-p38","index":38,"text":"一 开场说明与活动安排","level":1,"key":false,"section":"ep4-p38"},{"id":"ep4-p39","index":39,"text":"到点了，咱就不乱唠嗑了，开始，不能耽误大家的时间。首先，咱们还是纯唠嗑、纯闲聊，你不要找我要证明，我证明不了。全都是我自己的一些观点和感悟，信就信，不信就算了，当个乐呵听就完了。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p40","index":40,"text":"第二个，咱们把广告做了。8月25号是大势至菩萨的专场。9月2号、9月5号、9月10号都连着，你们该报就报。9月2号是普安菩萨的专场，9月5号是龙树菩萨的专场，9月10号是必报的地藏王菩萨专场，正好是鬼节。咱们已经一起修行很长时间了，每年都经历鬼节和清明。一进入鬼节，就容易出现各种各样的事情，大家一定要小心。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p41","index":41,"text":"一定要注意，7月14、7月15、7月16这三天，阴气非常重。赶紧去喝暖胃茶，得提前几天喝，别当天喝，真的不管用了。能带朱砂的赶紧带上朱砂，保护好自己。这三天晚上就别出门了，容易出事。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p42","index":42,"text":"还有咱们的福利，净尘茶免费赠送活动，你们自己找助理老师申请。这不是联名做活动嘛，赠送量好像是跟体系内的消费来决定的。之前买过人家大健康产品的，额外还多送。每个客户最多可以领取8包，先安排上，赠完为止。本次所有东西都是免费的，但是你得给运费。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p43","index":43,"text":"厂家已经说了，这次净尘茶到2027年3月份到期。把净尘茶放在阴凉的地方，而且一定要干燥，实在不行就放冰箱里，我觉得这个最保险。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p44","index":44,"text":"我那天开了一下，喝不完。我在马来西亚，潮又热，待了一个月，没封口，里面布包上就长黄色霉斑了，还有小虫子爬来爬去。因为这个东西是纯天然的，所以肯定有虫子，请大家一定注意。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p45","index":45,"text":"正好厂家也卖不出去了，就送大家，能多拿走就多拿走，多申请。也别觉得8包就到头了，到时候也可以多申请。不够了，跟我或者助理说一声，说我们家人多，我就跟人家打声招呼，多拿。我看他好像还挺多，这不蹭白不蹭，谁让他卖不出去？","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p46","index":46,"text":"好，咱们正式开始。这次开始讲认知。咱们讲完了《问道》的前三章，其他都是说一些规划，今天是正式的第一次课。","level":0,"key":false,"section":"ep4-p38"},{"id":"ep4-p47","index":47,"text":"二 从行为反推成败的源头","level":1,"key":false,"section":"ep4-p47"},{"id":"ep4-p48","index":48,"text":"你认为正确不一定就正确","level":2,"key":false,"section":"ep4-p47"},{"id":"ep4-p49","index":49,"text":"能把这个东西安排在第一次课上，肯定它的重要性很大，请大家注意。我们先研究一下，人为什么成功，为什么失败？人人都在做事，也在努力干很多东西。每次做事之前，都会以当时的认知，做出我们认为最正确的选择，认为此时此刻这么做、这么选是对的。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p50","index":50,"text":"人在做任何事情的时候，一定会利己。没有人选择的时候，说这事一定失败，我就非得这么干，那不是脑子进水了吗？尤其创业或者做人生重大决定的时候，基本都按这套东西走。但是成功的寥寥无几。这时就出现一个很奇怪的事情：明明已经做了自己认为最正确的选择，为什么还会失败？","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p51","index":51,"text":"最大的问题就是，你认为的正确不一定是正确的。","level":0,"key":true,"section":"ep4-p47"},{"id":"ep4-p52","index":52,"text":"不要小看这个。人生不如意十之八九，为什么十之八九？对于人生来说，大的选择几十次，小的选择几百上千次，每次都选成功的可能性还是比较低。所以，只要是生物，我们就要研究，你的行为为什么失败？我们要反推一下。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p53","index":53,"text":"行为 思维模型 认知 真相与缘分","level":2,"key":false,"section":"ep4-p47"},{"id":"ep4-p54","index":54,"text":"我先直接把答案跟大家说。我们所有的东西都依赖于行为。行为正确不正确，来自于思维模型。什么是思维模型，不知道，别着急，后面慢慢说。思维模型来自于认知，认知来自于真相。你能掌握多少有用的真相？了解的真相全不全？你所有的真相，又来自于有没有缘分得到这份真相，你的能力和缘分。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p55","index":55,"text":"行为由思维模型主导，思维模型由认知主导，认知由真相主导，真相由缘分主导。","level":0,"key":true,"section":"ep4-p47"},{"id":"ep4-p56","index":56,"text":"请大家记住这条亘古不变，以及在任何情况下都是真理的、一层层递进的规则。这很重要。我们在轮回中是这样，轮回之外是不是这样，我不知道，但我相信大概也是这样，这是一个至高法则。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p57","index":57,"text":"决定你做事是否成功的源头，只有三个：真相、认知、思维模型。这三个东西解决不了，你做出怎样的行动，大概率成功率都会很低，做出很多选择成功率都会很低。哪怕你成佛了，你是菩萨、天帝，都要遵守真相、认知、思维模型这三个东西。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p58","index":58,"text":"这三个东西至关重要。作为生物，所有选择、决定、判断、反应，对世界的认识，都来自于这三个。你修行的几乎所有东西，也来自于这三个，这是核心的核心。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p59","index":59,"text":"经常说认知，我举几个例子。对同样一件事情，不同的认知、不同的看法，决定了成功和失败。曾经马云还说刘强东必死，结果刘强东现在活得还挺好。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p60","index":60,"text":"刘强东和马云都没重视的拼多多，结果现在干成了第一名。这就是认知，对同样一个世界的看法，决定了命运的不同。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p61","index":61,"text":"仙家会不会出现这种事情？也是一样。找一些神或者仙去看一件事情，同样一件事，会有不同看法，尤其越大的事情。普通老百姓的小事，基本不会有什么太大问题。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p62","index":62,"text":"同一件事为什么会有不同判断","level":2,"key":false,"section":"ep4-p47"},{"id":"ep4-p63","index":63,"text":"假设事情涉及的因果太大、牵扯的本源太多，就会很不一样。我举两个例子，是去年还是前年碰到的。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p64","index":64,"text":"第一个，一个上市公司，干了好多年，身价也有几百亿，老板亲自来问：“我现在的气运怎么样？走上升气运还是下降气运？”不同教主怎么回答？其中一个说：“你已经走下坡路了，不要投资。”另外一个说：“你还在走上升运，继续投资。”为什么会这样？同一个人，就上升、下降两种结果，你两边堵，这是蒙呢，还是玩呢？","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p65","index":65,"text":"其实不是这样。他们看到的东西不一样，每个仙家看到的最后结果没有问题，但是看到的过程和点不一样。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p66","index":66,"text":"这个世界有很多不同观点，观点不同，结论、认知就不一样。这位女老板实际上还有三年上升气运。其中一个教主去看，说还有上升气运，有没有问题？没有，因为她还有三年。虽然上升不会太高，至少还有三年运。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p67","index":67,"text":"另外一个教主也看到了，但她问的是能不能继续投资。她的投资可能是10块、20块的事吗？那是几个亿或者几十个亿。那个教主对这个事情把控比较好，直接说不要再投了，走下坡运。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p68","index":68,"text":"为什么这么说？第一，这三年的运已经不是这么往上走，有点走平，但的确还在上升。第二，以她的体量投资，三年想把钱撤回来，撤不回来。另外一个仙家对这个体量比较清楚。同样一件事，同样法术很厉害，但是大家的看法不一样。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p69","index":69,"text":"第二个例子，有一个孩子，从照片看各方面都没问题，长得挺漂亮、挺精神，结果有些习惯很奇怪。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p70","index":70,"text":"其中一个教主看完，说：“你得好好教育这孩子，你教他呀。”说了一些人间的东西。他觉得孩子各方面没问题，怎么会出现父母描述的情况？觉得很奇怪，是不是父母有问题？","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p71","index":71,"text":"另外一个教主直接能看到本源，就说这孩子的魂不全，是一片碎魂组成的人。本来是上古神兽转世，只不过是打碎了的上古神兽。上古神兽体量有多大？打碎成几千片，一片魂的大小还能组成一个人类，你想得有多厉害。就直接指出这跟父母没关系，父母再怎么教也没用。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p72","index":72,"text":"同样对一个孩子判断，判断出两种不同的东西，取决于你对这件事的认知、看法，对真相了解多少，了解在第几个层级。判断不一样，认知不一样，思维模型不一样，最后行动就不一样。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p73","index":73,"text":"其实就这么简单。不是大家不努力，跟你的权限、对世界的了解是否真实和全面有很大关系。好，咱们一层层反推，一层层解释。","level":0,"key":false,"section":"ep4-p47"},{"id":"ep4-p74","index":74,"text":"三 行动来自于思维模型","level":1,"key":false,"section":"ep4-p74"},{"id":"ep4-p75","index":75,"text":"什么是思维模型","level":2,"key":false,"section":"ep4-p74"},{"id":"ep4-p76","index":76,"text":"第一个，行动来自于思维模型。什么是思维模型？有官方版本，也有大白话，还有例子，我给大家讲讲。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p77","index":77,"text":"官方说法：思维模型是对现实世界运行规则的抽象与简化，是一套可以重复调用的心智框架与思维范式。第二个官方说法：思维模型是大脑理解世界和做出选择的运算规则。是不是比较官方？听不懂就上大白话。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p78","index":78,"text":"一件事发生之后，你脑子里习惯用什么方式去解释、判断和处理，这就是思维模型。","level":0,"key":true,"section":"ep4-p74"},{"id":"ep4-p79","index":79,"text":"说白了，这事发生了，我要怎么做？这就是你的思维模型。还是大白话适合你们，人类世界需要大白话。光说这个没感觉，得举例子。举一个踩脚的例子，一个帅哥踩到女生的脚，咱们用东北人的模式和台湾叫“绿茶”的方式，来回答这个事情。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p80","index":80,"text":"被踩脚时的两种反应","level":2,"key":false,"section":"ep4-p74"},{"id":"ep4-p81","index":81,"text":"首先，东北的暴脾气上来了。男的踩了女的脚，女的说：“眼瞎呀？操，你他妈的看什么呢？”男的本来不对，但是面子挂不住，都是东北人嘛：“怎么没踩死你啊？”你看，东北模式。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p82","index":82,"text":"台湾的“绿茶夹子”怎么说？男的踩了女的脚：“哎呀，哥哥你很不对呀，怎么踩我的脚了？我的脚踩得很痛。”男的听完：“老妹，你说这事闹的，哥没看着，真不好意思，还把你脚踩了。疼不疼？要不要到医院看看？”夹子说：“不疼不疼，没事。”帅哥还说：“那不行，加个微信吧，万一后期疼了，别忘了找哥，哥一定负责到底。”","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p83","index":83,"text":"同样被踩脚，东北模式和台湾的夹子模式不一样，人生就不一样。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p84","index":84,"text":"这就是思维模型。当我们碰到一件事情，对它下意识的反应，以及深思熟虑之后的反应，就称为思维模型。类似的事情很多，比如老婆发现老公出轨了。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p85","index":85,"text":"婚姻 教育与受伤后的反应","level":2,"key":false,"section":"ep4-p74"},{"id":"ep4-p86","index":86,"text":"逆修觉者怎么弄？先分析，再化解，再进行利弊取舍，最后做决定和选择。之前有一个女生，堪称经典式的反击，非常厉害。但正常人怎么着？一哭二闹三上吊，离婚，公布朋友圈，再把父母架上。这是正常人的反应，也是一种思维模型。碰到这种事，认知里只知道用这种方式解决。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p87","index":87,"text":"还有，孩子3分钟的作业做了30分钟。你进去一看，8加9等于几？不知道。这时候老娘就虎了：“8加9等于几？别光看着我，脸上没有答案！跟你爸一个德行。”这是很多正常女性的思维模型。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p88","index":88,"text":"当然，也有夫妻之间，比如老公给老婆交作业，应该一次怎么也要30分钟，结果3分钟就完事了。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p89","index":89,"text":"老婆也怒了：“你这啥‘青色’啊？喜新厌旧了是吧？看不上老娘了是吧？”老公说：“不是不是，熟能生巧，经常做，所以做得快了点。”","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p90","index":90,"text":"还有婆媳关系的处理方式。自己被欺负了，一定想“一帮坏蛋欺负我”。逆修觉者的想法是什么？一切皆是我的问题。每次失败和受伤，都要想，我应该从里面学到什么？这就是思维模型，就是碰到事情的反应。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p91","index":91,"text":"咱们逆修觉者解决的就是真相、认知、思维模型。我不认为你现在所有的思维模型，可以真正有效、无错地帮助你在轮回里升级，以及更好地活着。所以思维模型很重要。","level":0,"key":false,"section":"ep4-p74"},{"id":"ep4-p92","index":92,"text":"四 思维模型来自于认知","level":1,"key":false,"section":"ep4-p92"},{"id":"ep4-p93","index":93,"text":"认知与思维模型的区别","level":2,"key":false,"section":"ep4-p92"},{"id":"ep4-p94","index":94,"text":"思维模型来自于什么？来自于认知。先说官方的：从你看到一件事情，到理解它、记住它、判断它，这整个过程都属于认知。听明白了吗？大概率没听明白。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p95","index":95,"text":"咱们说白话：认知就是，你认为这件事情是什么，为什么会这样，意味着什么。听官方还有听明白的，说明你很聪明。有些小伙伴脑袋大了，什么是思维模型，什么是认知？","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p96","index":96,"text":"举个例子就知道了。天空很蓝，过段时间刮风，云越积越厚，变成黑色。看到这个现象，就知道有乌云，快下雨了。“有乌云，快下雨了”，这是认知。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p97","index":97,"text":"知道要发生什么事情，要对此做什么反应？要不躲起来，要不别出门，要不带把伞，这就是思维模型。这就是认知和思维模型。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p98","index":98,"text":"自己分析与从别人那里获得认知","level":2,"key":false,"section":"ep4-p92"},{"id":"ep4-p99","index":99,"text":"经常说要提高认知，认知的确非常重要。人间大家比较在意认知，网上也说认知很重要，一定要改变认知。我们要清楚知道，认知怎么得来？一个是自己分析得来的，很难；第二个是从别人那里得来的，可真可假。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p100","index":100,"text":"第一种，能自己分析出认知，我只能说你很聪明、很厉害、智商很高。要有足够的观察力、洞察力、分析能力、纠错能力，脑力足够强大才行。一会说真相的时候，会说这个分析，因为分析的肯定是真相。还要破迷，很多东西是真相和假象在一起，很难。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p101","index":101,"text":"我们现在主要说人们经常获得认知的方式：从别人那里得来。上小学、初中、高中，得来的知识也是对世界的认知，是别人告诉你的，经过验证、可以拿来使用的东西。是否真的对？也不一定，但是对的比较多。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p102","index":102,"text":"正常生活里，很多认知会决定命运。自己又获得不了那么多认知，绝大多数都是从别人那里得来的。所以能否分析认知的真假，以及适用范围，非常重要。难度有多大？相当于开盲盒，非常困难。因为对得来的认知，没有足够的智慧和能力分辨真假，以及使用方式方法，所以才影响了自己的命运。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p103","index":103,"text":"彩礼的认知与婚姻的本质","level":2,"key":false,"section":"ep4-p92"},{"id":"ep4-p104","index":104,"text":"拿几个事情来说。第一件是彩礼。嫁女儿一般都要谈彩礼，结婚的男方也涉及被女方要彩礼。很多人要彩礼，真的清楚它的作用和意义吗？","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p105","index":105,"text":"首先，你要明媒正娶别人家的闺女，或者你们家闺女不做妾、要做妻，应该下聘礼，而不是彩礼。彩礼是娶妾给的东西，娶妻叫聘礼。有聘礼就一定有陪嫁，所以叫门当户对：你家花多少钱，我们家能陪出多少钱。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p106","index":106,"text":"有些很厉害的家族，女的从嫁到男方第一天开始，一直到棺材，全都陪嫁过去。什么意思？我们女方家足够强大，不占男方家的便宜。娶妾给的是彩礼，是买断性的东西，买断的是女孩未来生死跟你家没关系。所以娶妾可以不给陪嫁。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p107","index":107,"text":"咱们说三妻四妾，头两级妾，妾和孩子可以写在族谱里，后两级妾连写族谱的权利都没有，生出男孩也不许入族谱。首先这是古代的。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p108","index":108,"text":"现代的呢？要彩礼，第一是态度，“我要的是你一个态度”。第二，有些家庭尤其有弟弟的，因为弟弟娶妻也要给别人钱，基本嫁完姐姐，就有钱给弟弟娶老婆，所以会要得比较狠，是回本。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p109","index":109,"text":"第三，看男方家的重视程度。第四，比较多的是别人家都给这么多。人家给10万、18万8，我们家只给8万8，好像我们家孩子不值钱。这是绝大多数家庭对彩礼的认知。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p110","index":110,"text":"但这里有个很大的问题，很多家庭本来就没多少钱，又要房、车、家具、装修，男方家已经掏空钱包。再要彩礼、上车费、下车费，很多普通家庭承受不了。富裕家庭要一二百万彩礼不算事，普通家庭拿不出那么多。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p111","index":111,"text":"你要的东西会对男方家庭造成极大伤害。为了结婚，到处借钱，焦头烂额。但一定记住，婚姻的本质是快乐，两个人快乐很重要。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p112","index":112,"text":"从结婚那一刻，嫁到男方之后，男方家庭背上极重的负债，活钱全用于这些没有意义的东西。如果大量借债，四处借钱，因闹彩礼闹得很痛苦，从结婚那天开始，对女方的态度就已经不对了。那结婚为了什么？这就是没有搞清楚婚姻的本质。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p113","index":113,"text":"可以用彩礼试试态度，但是我觉得，人家要给的时候就别要了，或者给完赶紧还回去。不要给别人造成太大压力，因为最后受伤的一定是你女儿。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p114","index":114,"text":"更多的是，两个小家伙组成的家庭，要有足够多的备用金，要有足够的能力和应变能力，去抗击未来的可能性。我觉得这非常重要，不要乱花钱，这是正常的。但别人要彩礼你也要，这就属于认知错误。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p115","index":115,"text":"学习能否改变命运也要看适用条件","level":2,"key":false,"section":"ep4-p92"},{"id":"ep4-p116","index":116,"text":"身边有很多这种事情。比如好好学习，因为别人都在好好学习，曾经有一段时间好好学习可以改变命运，结果就认为好好学习可以改变人。可是，这是自己验证的吗？验证的东西在未来一定有用吗？如果在未来已经不太起作用，为什么要求孩子继续好好学习？","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p117","index":117,"text":"这就是从别人那里得来的认知：“好好学习可以改变命运。”但结果出问题。还有在海外，经常听到各种频道说中国怎样怎样。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p118","index":118,"text":"找问题与系统性解决问题","level":2,"key":false,"section":"ep4-p92"},{"id":"ep4-p119","index":119,"text":"说领导人怎样怎样，你就记住了。他们说得对不对？确实有这些事发生，但代表中国就一定有问题，中国官场、组织、政体结构就一定有问题吗？不一定。任何国家都有问题。让他带14亿人口，还能带成这样，绝大多数人有车有房，保住14亿人的温饱，很多家庭有空调，已经很不容易了。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p120","index":120,"text":"为什么大家都说得咬牙切齿？找问题只需要发现现象，但想改变一个国家、一个政体、一个公司，需要系统性地解决所有问题。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p121","index":121,"text":"比如中国政体，能拼到那个位置的人，有几个福报低的，不在上面有上一号的？哪个不是尸山血海都过过的？政治斗争极其严重，还要抽时间，第一保证自己活着，第二想怎么为国家做贡献，很难。推动点东西非常费劲。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p122","index":122,"text":"骂很多东西的人，让他自己上去干，一定干得不怎么样，还不如那帮家伙，这个我敢确定。谁都会找问题。比如国足，一看就说“你往那传”。挑人家踢球毛病，很多人都能挑，而且很正确。但想组建一个非常好的足球队，这是系统性问题。解决系统性问题，比找毛病难，根本不是一个数量级。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p123","index":123,"text":"这也是认知问题。不要光人家说什么就听什么，的确有这个问题。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p124","index":124,"text":"任何政体、国家，在发展和文明递进过程中都会出现很多问题。最后要看整体发展情况怎么样，自我迭代能力怎么样，这些很重要。这也是认知。","level":0,"key":false,"section":"ep4-p92"},{"id":"ep4-p125","index":125,"text":"五 认知来自于真相","level":1,"key":false,"section":"ep4-p125"},{"id":"ep4-p126","index":126,"text":"真相的含义与三个问题","level":2,"key":false,"section":"ep4-p125"},{"id":"ep4-p127","index":127,"text":"认知来自于真相。什么是真相？官方说法：事物的本来面目与真实完整的情况，区别于表面被扭曲或者人为造假的表象和假象。大白话就是，扒掉所有滤镜之后，事物本来的样子。还是大白话比较简单。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p128","index":128,"text":"为什么真相这一部分篇幅多一些？天地、整个轮回把你卡住，最主要的方式就是用真相把你卡住。只要脑子CPU这部分没有太大问题，拥有全部真实和全部真相时，极容易产生正确认知。这个世界绝大多数人类脑子没什么太大问题，但上天不可能让所有人都把事情做对。做不对最主要的问题，是没得到全部真相。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p129","index":129,"text":"真相涉及三个主要问题：第一，你得到的真相全不全？第二，真不真？第三，在第几层？这就是思维茧房。我可以用规则压住你，这三层决定了很多问题。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p130","index":130,"text":"靠能力观察与反推真相","level":2,"key":false,"section":"ep4-p125"},{"id":"ep4-p131","index":131,"text":"怎么得到比较全、比较真的真相？两个方式，第一靠能力，第二靠缘分。能力只限于同层真相。假设涉及不同界面、位面、级别，临近的，比如一层分析二层，有点可能。但用一层现象分析十层真相，可能性几乎为零，这没招。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p132","index":132,"text":"能力也不是所有人都有，得会分析、推演、深挖。之前说过，天道把人类物质的科技树打开了，所以很多科学家可以通过很多东西反推出真相，很厉害。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p133","index":133,"text":"要学会观察，从现象分析，从细微之处分析，能够推论，通过反常推论，通过规则推论。发现真相很难。我举自己身上两个例子。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p134","index":134,"text":"比如紫微斗数，我怎么做的？第一，我相信规则，相信紫微斗数是真的。第二，我相信一切易学，要推断世间万事万物，一定要产生一一映射的关系。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p135","index":135,"text":"既然相信紫微斗数能跟万事万物一一映射，我就研究出一套紫占的方式，以秒、以分进行映射。比如在山西看到一个红发美女，没看到正脸，因为她直接进电梯了。此时心在动，怎么办？起一卦，卦象叫“七煞火星”。什么意思？没明白。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p136","index":136,"text":"为什么我的紫微能反推出这么多跟传统不一样的星和技法？就是因为我相信一一对应。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p137","index":137,"text":"美女在那儿，卦象在这儿，我相信它们一定产生一一对应的关系。但用传统紫微的星意，怎么解释此时看到的人和卦象？对不上。多收集这些东西，就能反推出来。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p138","index":138,"text":"比如喝可乐，假设还有一半，50%，正好发现太阴在“续宫”化忌。明白了，当“续宫”化忌的时候，原来是减少一半。很多东西都是这么反推出来的。要观察得足够细，从生活中反推。发现任何异常，一定琢磨，反向推理，才有可能发现真相。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p139","index":139,"text":"从细节发现帮助与建立信任","level":2,"key":false,"section":"ep4-p125"},{"id":"ep4-p140","index":140,"text":"包括我弄天地大道的东西，我看到的世界跟你们差不多，只不过还看到过更高级的世界。比如大菩萨平时说话那样，跟书本不一样，我就知道书本他妈的有杜撰。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p141","index":141,"text":"还有“无为而无不为”，或者“信”，如何建立一个信？有的大菩萨级投胎之后，帮助别人，我有时问：“为什么不让别人知道？”他说不喜欢让别人知道。我说：“你自己花钱、受累，晚上帮人挡因果，半天起不来床，人家连屁都不知道，何苦呢？”","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p142","index":142,"text":"但我发现，这些人变好了之后，脑子比较聪明，自己反推出来：“怎么去他那里待一段时间就变好了，去别的地方就不管用？再试试。”最后，虽然很多高端客户从没听他亲口说在帮他们，但都能从细节反推出来。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p143","index":143,"text":"后来我帮他总结：“智慧等级低于60分的，还是告诉他吧，因为他不会从细节分析，洞察力极差。任何反差、细微之处、推论，都不会在他生命中留下痕迹。”","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p144","index":144,"text":"智慧等级60分以上的，比较自我，跟他说在帮他，反而会不舒服。让他自己发现你在帮他，会更感恩。这是我又发现的事情，告诉他，他说我说得挺好。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p145","index":145,"text":"能力是什么？能不能从所有错误信息里发现真相，并总结成系统？极难。普通人不用想，几乎不可能。连生活中哪些东西有问题都发现不了，能发现什么真相？凑合活着就完了。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p146","index":146,"text":"我这种就属于从很多乱序东西里总结规则、总结真相，非常痛苦。尤其刚开始，没人告诉哪个对哪个错，完全凭毅力，一点点从乱象里总结。很多信息有真有假，没办法验证，只能一点点试错，通过大量试错，最后总结一套东西。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p147","index":147,"text":"我告诉你们的，无论紫微还是这些东西，全部是自己一点点试错出来的。所以你们不要去想这个，没用。","level":0,"key":false,"section":"ep4-p125"},{"id":"ep4-p148","index":148,"text":"六 获得真相的缘分","level":1,"key":false,"section":"ep4-p148"},{"id":"ep4-p149","index":149,"text":"本源 天赋与后天优势","level":2,"key":false,"section":"ep4-p148"},{"id":"ep4-p150","index":150,"text":"第二种获得真相的方式是缘分。缘分又分本源和平时积累。本源就是出生有就有，没有就没有。前段时间，我记得左护法还问：“师父，天赋这个东西可以修吗？”我说看什么级别。那种可以改变世界的天赋，不可能修，从轮回里出生那一刻，有就有，没有就没有。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p151","index":151,"text":"类似爱因斯坦、高斯、马斯克、稻盛和夫、段永平，这些都算天赋。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p152","index":152,"text":"还有霍金。这种东西让人觉得绝望。清华姚班的一些人也叫天赋，但700分考进清华，只能算聪明，不能算天赋。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p153","index":153,"text":"法界这边的天赋，比如我，叫传法天赋，一个是忽悠能力，一个是从乱序中总结规则的能力。不用学习，大概听一下、看一下就知道，你不用去想，几千年很难出这种人。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p154","index":154,"text":"包括负责看卦的天巫本源、顶级天巫血脉的人，就是天赋，从来不需要学习。需要沟通天地时，想一下、感受一下就知道。但凡还需要学习，都不叫天赋。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p155","index":155,"text":"普通人类可以积累的叫优势，有的人优势多，有的人少。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p156","index":156,"text":"优势可以积累，但顶级天赋不可能。也可以认为小天赋能训练出来，累劫轮回，多轮回几世，怎么也能比较厉害。但像写《洛神赋》的，曹植吧，应该叫曹植，这就是天赋，没办法。这叫本源。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p157","index":157,"text":"本源的缘分，比如我跟观世音菩萨、佛界的缘分，出生时就定了。你们还费劲修，我就大摇大摆带着族人跑到佛界。只不过现在变成小号，等级不行，再去佛界比较难，但现在也拿到门票了。你们要进佛界费大劲，这就叫本源。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p158","index":158,"text":"平时积累与获得信息的机缘","level":2,"key":false,"section":"ep4-p148"},{"id":"ep4-p159","index":159,"text":"第二个叫平时积累。能不能看到真相，最重要的是平时积累，在累劫轮回里靠平时积累。因为能看到什么真相，取决于有什么缘分。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p160","index":160,"text":"包括海外一些中文大V，论政治、经济的，他们一生里有你们通过学习努力也得不到的机缘和人脉，所以能进那个圈子，有幸知道这些东西，加上脑子在线，才能成就这些事。比如鲁博士分析政治很厉害，大老王说经济、国内一些事情，非常有参考价值。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p161","index":161,"text":"像老张说有趣的事情，非常有天赋，都来自于人家有这个机缘。最后会发现，能得到什么，取决于缘分。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p162","index":162,"text":"比如我，一个泥腿子、夜大学毕业、连正经高中都没上过的职高生，能坐在这里跟你们侃侃而谈，为什么？因为跟你们有不同机缘。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p163","index":163,"text":"我看到的真相，不是你们通过努力能得到的。我能得到一些上位面的东西，比如大菩萨，菩萨比较多，神也多，偶尔有天帝，佛祖很少，但我觉得够了。是这些佛祖菩萨让我直接看到了真相。我跟他们有缘分，所以能轻易得到很多人终其一生得不到的真相，法界真相对我来说很简单。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p164","index":164,"text":"我也认为自己有很好的师缘，上面有老师，有问题叫他跟我说一下就完了。有时他带我去看，一看佛界不是大家说的那样，这就是缘分不同。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p165","index":165,"text":"整个流程是，想有什么正确行为，取决于思维模型；思维模型取决于认知；认知取决于看到过、知道什么真相；能不能看到，取决于有没有这种缘分。所以缘决定一切。什么缘分最重要？师缘。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p166","index":166,"text":"师缘与生活中的各种缘分","level":2,"key":false,"section":"ep4-p148"},{"id":"ep4-p167","index":167,"text":"累劫轮回里，没办法得到重要信息，尤其跨位面信息，得不到，怎么做出正确判断？刚才说的还都是人间界的，在人间界就很难解决真相全不全。一涉及跨位面，人间再聪明也没用。几千年来这么多聪明的人类，有没有解决认识方向、认知方向的问题？没解决，一直重复错误，就在泥潭里。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p168","index":168,"text":"如果要积累缘分，第一个是师缘。师缘怎么积累？累劫轮回经常尊师重道，师缘就比较好；每次相信真理，这个缘分就很好。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p169","index":169,"text":"第二是爱情缘。老关心老公有没有找小三、劈腿、小金库，有没有伤害你，有意义吗？所有的防都没意义，还不如真心爱一个人。累劫轮回，真心爱自己的老公，真心把自己的东西做好，不用管他成功不成功，生命里一定会积累出非常好的爱情缘。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p170","index":170,"text":"有足够多的爱情缘，就能碰到对你特别好的人，还需要管这些吗？这些都没意义。包括好身体、好贵人的缘分。我最近也找到一些解决身体问题的缘分，问题就解决了。子女缘、众生缘、员工缘都一样，有时会发现，一切皆在缘分。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p171","index":171,"text":"这条路都讲完了。既然要打破之前讲知识的方式，就要树立新榜样。拆解、讲完后，一定告诉你，学完这些东西，要在脑子里建立怎样的认知？对你的意义是什么？如何帮助你在轮回里更好生活、提升？这些一定讲。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p172","index":172,"text":"不能像那帮古人的大尾巴狼一样，动不动一句高深的话，结果所有人不明白怎么做。你是秀技术，还是真打算度化众生？咱们一定把这些讲透。","level":0,"key":false,"section":"ep4-p148"},{"id":"ep4-p173","index":173,"text":"七 学完之后要建立怎样的认知","level":1,"key":false,"section":"ep4-p173"},{"id":"ep4-p174","index":174,"text":"遇到意外先反思真相与认知","level":2,"key":false,"section":"ep4-p173"},{"id":"ep4-p175","index":175,"text":"第一件事情，一定清楚所有源头都在真相、认知、思维模型。把这三个弄好，才能清清楚楚、明明白白活着，让自己顺利过关。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p176","index":176,"text":"第二，一切问题、失败、错误，都来自于对事情的认知有问题。认知有问题，一定涉及了解不全面，或者了解不真实。所以要反思自己、反思真相、反思认知。如果都没有问题，才能做到没有意外。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p177","index":177,"text":"只要发生了意料之外的事情，第一时间清醒地意识到，我一定有不知道的东西。","level":0,"key":true,"section":"ep4-p173"},{"id":"ep4-p178","index":178,"text":"发生意外，一定有不知道、不了解的东西。不要怪任何人，是自己的认知和对真相的了解不全面。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p179","index":179,"text":"不要相信自己可以掌控一切","level":2,"key":false,"section":"ep4-p173"},{"id":"ep4-p180","index":180,"text":"下一条，不要相信自己可以掌控一切。首先从轮回规则来说，不可能全面掌控一切，神佛、大菩萨都一样。上面的观世音菩萨每次跟我说东西，一定正确吗？不一定。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p181","index":181,"text":"但对我来说，能找到的最高智慧等级，能帮我看未来、做指导的，就是观世音菩萨，会亲自指导我。如果连他指导都出问题，那就是命。在指导未来、选择未来方向这件事上，我不如他。连我认为超越我的人都做出错误决定，我自己上去也不可能成功。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p182","index":182,"text":"这是一个team，大家各司其职。涉及人间的东西，上面的大菩萨还是交给我。他觉得我在人间的把控力还可以，不能说最好，但能信任的人不多。在能信任的人里，把控力比较好的可能只有我。如果我做不好，他也不可能找到更多人替代我，所以也要认。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p183","index":183,"text":"规则之下，不可能没有意外。以这种组合补缺的方式弥补，出错概率已经不多，但仍然有。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p184","index":184,"text":"对于普通人，能掌握的都是阳间的东西。再厉害，像马斯克，也只能掌握阳间，不可能掌握阴的那面。我没说阴间，我说阴的那面，法界所有东西不可能掌握。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p185","index":185,"text":"光把火箭弄上去，在阳间需要掌握多少知识？你觉得在阴间掌握的知识、需要考虑的东西会少于阳间吗？如果相信阴阳平衡，不可能。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p186","index":186,"text":"缺少一半认知、一半真相的情况下，凭什么确定自己能掌控世界？很多人都在做傻子一样的决定。知道有阴阳，却不知道阴的那面有什么，凭什么确定掌控命运、掌控世界？","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p187","index":187,"text":"第三，尽可能提升自己的圈子，不同圈子提供不同知识。我们这个圈子也有很多别人没有的认知和知识，要努力、大量积累。如果只是年轻人，请不要太相信自己的能力。","level":0,"key":false,"section":"ep4-p173"},{"id":"ep4-p188","index":188,"text":"八 认知冲突与家庭沟通","level":1,"key":false,"section":"ep4-p188"},{"id":"ep4-p189","index":189,"text":"让对方看到你所看到的真相","level":2,"key":false,"section":"ep4-p188"},{"id":"ep4-p190","index":190,"text":"下一条是认知冲突，涉及人与人之间的沟通和看法。很多矛盾来自于认知冲突，就是对同一件事有不同看法。下次不要强行说服对方，因为说服对方是在进行认知冲突。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p191","index":191,"text":"人类有一种机能叫认知保护。你说的东西跟我认为的不一样，我就进入认知保护阶段。所以不要直接灌输，有时没用，越聪明、越有主见，越不可能灌输。更多的是让他看到你能看到的真相，感受到这些真相。相信只要是正常人，他会改变。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p192","index":192,"text":"知道认知来自真相，就多带自己的孩子、让配偶多看看世界，多了解人间，多看咱们成功案例，多了解规则，对他们有帮助。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p193","index":193,"text":"女儿恋爱与父母的不同看法","level":2,"key":false,"section":"ep4-p188"},{"id":"ep4-p194","index":194,"text":"举几个例子。青少年时期搞对象，尤其女孩，直接给你找个“黄毛”，你肯定不同意。但以女儿对世界的了解，她不认为这个人坏，对自己很好。而以你三四十年、四五十年对世界的了解，女儿在干什么，你很清楚。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p195","index":195,"text":"这时你不同意，说这人的坏话，但这些在女儿那里没办法证实，她会听吗？不会。想防止女儿找“黄毛”，最重要是多看咱们案例，多看世界，看看那些被骗女生最后怎么样。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p196","index":196,"text":"我记得有个学生，之前还差点被“黄毛”卖了。但可能也是真爱吧，最后没卖成，这是咱们一个学生的真事。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p197","index":197,"text":"让配偶经历管理中的困难","level":2,"key":false,"section":"ep4-p188"},{"id":"ep4-p198","index":198,"text":"配偶也一样，夫妻有很多矛盾，是你看到的世界跟老婆不一样。像我老婆，最近涉及一些管理上的东西，为什么我基本不出手帮她管理？她未来要知道我很多事情，也会涉及很多决策。如果从没经历管理，就会决策失误，因为不知道会发生什么，不知道为什么做这些决定。她没经历伤痛、错误、痛苦。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p199","index":199,"text":"更没被各种人际关系和人类奇怪行为骚扰过，需要先经历。这样她会对自己的管理能力有清晰认识，知道哪些方面强、哪些弱，更多是知道管理不容易、很艰难。这也是让她看到很多真相。如果没看到，不会认为这些东西困难。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p200","index":200,"text":"老人带孩子与共同学习","level":2,"key":false,"section":"ep4-p188"},{"id":"ep4-p201","index":201,"text":"年轻人生完孩子让老人带，老人会用曾经带孩子的方式，年轻人就说“这样不对”。老人郁闷：“你都是我这么养大的，反而变成我不对了？”就产生很多矛盾。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p202","index":202,"text":"更多的是让老人看一些纪录片，跟你看的东西一样。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p203","index":203,"text":"大家共同学习，这时老人知道原来是这样，原来之前一些方式不是说不对，而是可能有隐患。这是解决很多人间矛盾的主要东西。我们更习惯指责。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p204","index":204,"text":"孩子能否理解你说的道理","level":2,"key":false,"section":"ep4-p188"},{"id":"ep4-p205","index":205,"text":"尤其一帮大傻子，孩子不学习，就跟孩子讲“以后会怎样怎样”，有用吗？用你的认知，让孩子明白20年后才会经历的事情，有意义吗？说的的确对，但叫正确的废话。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p206","index":206,"text":"孩子更关心玩不玩、快乐不快乐、心烦不心烦，又没经历过那些。了解这套体系后，再跟别人交流，先想想有没有必要说这些？他有没有正确理解这些认知的能力，有没有看到相应的真相？如果他看到的世界跟你不一样，肯定不行。","level":0,"key":false,"section":"ep4-p188"},{"id":"ep4-p207","index":207,"text":"九 思维茧房与缘分的积累","level":1,"key":false,"section":"ep4-p207"},{"id":"ep4-p208","index":208,"text":"家庭 学校 社会与师父","level":2,"key":false,"section":"ep4-p207"},{"id":"ep4-p209","index":209,"text":"人类要分四个阶段，称为思维茧房的四个阶段。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p210","index":210,"text":"第一个是家庭。我们不知道世界怎么样，很多事情是父母跟孩子说的，尤其女生，小女孩更不清楚、没怎么接触世界。很多认知来自父母和家庭环境。比如老公应该怎么样，该不该要彩礼，女孩没什么自己的看法，不知道，只不过你说应该这样，要看男方态度，所以她才这样，来自家庭。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p211","index":211,"text":"第二个来自学校，同学、老师，以及在学校学习的东西。第三个来自社会。第四个是能不能碰到师父，得到人间之上的认知。有些人类认知，再努力也不可能得到正确答案，因为答案不在人间。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p212","index":212,"text":"积累有益的缘分与提升圈层","level":2,"key":false,"section":"ep4-p207"},{"id":"ep4-p213","index":213,"text":"下一条，一切皆缘分。现在可能没有好缘分，但请相信生命是无量劫的，不要在意这一世的生死，更多是生生世世积累有益缘分，积累能看到、获得更多真相的缘。比如工作，管理、带人、研发，这些工作上的缘分，能看到真相，就很厉害。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p214","index":214,"text":"希望大家学会跳圈、抱大腿。为什么一定往上跳，改变阶层？因为不同圈层掌握的信息远高于你。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p215","index":215,"text":"“十年苦读怎能比得上三代经商？”现在我真理解这句话。如果家里三代都干这件事，积累的庞大人脉和经验，不是AI、不是靠学习能得到的。上面大哥告诉一些东西，比苦读十年强得多。所以记住，拼了命也要往上抱圈、抱大腿，很重要。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p216","index":216,"text":"天道打工人与下课寄语","level":2,"key":false,"section":"ep4-p207"},{"id":"ep4-p217","index":217,"text":"下一条，有缘成为天道打工人。想了解更多天道知识、系统外知识、思维茧房外的东西，凭什么得到？不能成为天道打工人，天道有必要让你知道更多吗？这一定注意。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p218","index":218,"text":"不知道的那一半，法界的东西得不到。法界东西至少占一半知识量。多少人，包括很多大老板，拼死拼活一辈子，燃烧福报，最后也没落个好，何苦呢？","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p219","index":219,"text":"最后还是说，多看、多学、多了解，非常重要。希望今天这些东西，成为大家判断事情的天道思维中很重要的一点。平时多看、多接触，学会分析，找到好老师。自己看不明白时，有个好老师愿意把真的东西告诉你，很重要，基本就靠这个。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p220","index":220,"text":"水平很高，才有可能跳出父母的圈子、摆脱学校的圈子。能接触到真正引领世界的顶级人才、资源获得者，掌权的、有钱的、有思想的、有名气的人，才能真正知道世界怎样运行。这还只是社会认知。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p221","index":221,"text":"只有真正找到通两界、跨越两界的人，才有幸得到阳之外的那部分东西。最好别走错，不然一次次失败、重来，太可惜。","level":0,"key":false,"section":"ep4-p207"},{"id":"ep4-p222","index":222,"text":"好，今天说到这里，耽误大家很多时间，再见。下次开始说阴阳法则，又要说很多，很重要，这些都是重要的思维模型。咱们下期再见，拜拜。","level":0,"key":false,"section":"ep4-p207"}]},{"id":"ep5","number":5,"name":"问道五","title":"意义思维","speaker":"悟聊天尊","source":"20260913_问道5_意义思维_整理稿.docx","date":"2026-09-13","description":"以目的和真实结果为尺度，练习七种模式与意义七问。","blocks":[{"id":"ep5-p37","index":37,"text":"一 开场活动与近况","level":1,"key":false,"section":"ep5-p37"},{"id":"ep5-p38","index":38,"text":"九月份请符与环境提醒","level":2,"key":false,"section":"ep5-p37"},{"id":"ep5-p39","index":39,"text":"好，正式8点了，咱们不耽误大家时间，正式开始。开始先不讲故事，先说一下9月份促销。每年好多人年底年初请符，其实不对，换法器、请符应该在9月份。像我这样的什么时候请都无所谓，但绝大多数人，尤其打工的、年底要账的，还是需要年底年初仙家比较给力。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p40","index":40,"text":"为什么是9月份？首先，得让新的一批仙家对你有足够了解。什么都不了解，事情也不知道，直接上去弄，肯定不好使。有三个月时间，了解差不多了，帮你调运气、调事情，要给一定缓冲时间。打工、接工程、年底年初要答谢领导的，你的套符这个时候效果最好。年底总结拿一个好总结，年初资源拿到好资源，这时候请符非常好。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p41","index":41,"text":"第二，咱们说大环境。最近好像新上了一个关于出入境的法规，之前可能忘了说。现在一些客户已经开始出问题。前几天一个客户的女儿从美国回来，再去美国时被边控了。现在能边控你的部门越来越多，以前要有明显犯罪证明，现在只要怀疑就可以，甚至县级公安部门都能边控。请大家注意。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p42","index":42,"text":"小女孩后来托人找关系，问到底哪边控的，是公安还是怎么着？无犯罪证明还能打出来，没有犯罪记录，也没警察找她。后来发现是国安边控，也没有理由，你不知道谁边控的。怀疑因为在美国上学时，可能跟一些比较敏感的学生聊过天，就被边控。再想回美国上学，回不去了。英国的也出现这种情况，整个学业就完了。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p43","index":43,"text":"还有敏感公司，比如跟美国或者全球有关的高科技公司，回中国后，很可能以国家安全和信息泄露为由边控，不算犯罪，但不允许出国。在海外一些博主底下留过言的，也一定注意，尤其翻墙的人，翻墙软件所有信息都在监控范围内，找麻烦很容易。一旦出不了国，海外的事情都没有了。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p44","index":44,"text":"在加密货币公司做职员的也悠着点。在海外待得挺好，回国探一次亲，能不能再出来不好说，尤其大公司、加密货币敏感公司的职员，肯定国安那里都有一份。普通老百姓没什么事，别去敏感地区。像我们从泰国出来非常及时，现在泰国弄得鸡飞狗跳，很麻烦。这是大环境。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p45","index":45,"text":"北京等很多大城市，吃饭、买东西、买奢侈品的人少了，上班的人也少了。很多人说找不到工作，说白了，他想要那个钱，没人要他；很多公司也找不到人，开的钱别人看不上，互相看不上。不是没有工作，是大家看不上对方。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p46","index":46,"text":"经济大萧条。最近北京有朋友卖房，腰斩又腰斩，原来至少能卖300多万，现在100万出头就得卖，很郁闷，也没办法，这就是命。未来还得跌，不卖还得跌。未来至少还有15到20年经济大萧条，现在说白了还没开始。以后少挣中国的钱，挣点国外的钱。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p47","index":47,"text":"再说专场，明天黄财神专场，赶上就赶上，赶不上拉倒，实在没办法提醒，提醒也来不及。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p48","index":48,"text":"八月十五，9月25号，月光菩萨和月老专场。八月十五晚上，别忘了念108遍月光菩萨陀罗尼咒，还是非常好的。北京房价跌成什么样了，腰斩又腰斩，这很正常。9月28号九天玄女成道日，喜欢风水的多参加。10月2号，国庆第二天，燃灯古佛专场。","level":0,"key":false,"section":"ep5-p37"},{"id":"ep5-p49","index":49,"text":"二 从近期现象反推本质","level":1,"key":false,"section":"ep5-p49"},{"id":"ep5-p50","index":50,"text":"显卡性能与电脑设置","level":2,"key":false,"section":"ep5-p49"},{"id":"ep5-p51","index":51,"text":"最近这一个月，或者半个月发生一些事情，我先说现象。首先是家里的显卡。原来买了4090，部分游戏能玩，但《黑神话悟空》进去没多久就退出，战地系列的大型游戏也玩不了。像“荒野大镖客2077”什么的没问题，一直搞不清怎么回事。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p52","index":52,"text":"后来用豆包AI帮我找机器问题，找出一部分。主板BIOS版本太低，是2023年的版本，现在2026年，差了20个版本，升级后好很多。第二，内存赫兹数，原来是5600，调5600容易崩，改5200好很多，但偶尔崩一次，现在调5000，没问题了。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p53","index":53,"text":"第三是优化，我觉得可能不是优化的事。最开始以为缺程序、支持文件，电脑配置还不错，当时在泰国就为打游戏买的，“全打总套单”。还特地买了闪来闪去、连电线都发光的。头一个月天天盯着机箱看，现在能不看就不看，过了那个阵。人也是需要过了那阵。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p54","index":54,"text":"最后发现，用双显示器玩赛车没问题，但一个横着、一个竖着，可能会出问题。我把另一个显示器一关，BIOS更新、内存调过、软件环境优化，再关一个显示器，现在所有游戏都能玩了。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p55","index":55,"text":"无线网络与有线网络","level":2,"key":false,"section":"ep5-p49"},{"id":"ep5-p56","index":56,"text":"第二件事，家里上网。马来西亚这里目前最大带宽2G，装完只能跑1400。我以为路由器有问题，把工程人员叫来，现场用他们自带Wi-Fi的光猫，也只跑1400。我想可能有损耗，大马科技不如祖国厉害，说2000跑不出2000，很正常，就没多想。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p57","index":57,"text":"长达一年，最高1400，平时1000左右，波动，最差三五百。一直认为当地网络环境有问题。5090不敢换，看了一下太贵了，四五万一块，疯了，打个游戏而已。一会讲意义思维，这就没意义。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p58","index":58,"text":"最近新开疗愈室要布网络，买几个hub，叫集线器。多弄一个给家里用上，连上10GB的网线，固定台式机全部跑出2G带宽，非常稳定，2060，“22060”，再没出问题。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p59","index":59,"text":"后来发现，这里的绝大多数Wi-Fi，只要不是特别高级、几千块钱的，基本只能跑1400。我自己也有问题，Wi-Fi是方便联网，没说最大化发挥网络环境。台式机尽可能用有线。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p60","index":60,"text":"之前线太硬，后来发现扁的超软线，不硬，随便弯，还能跑10Gb带宽。现在家里全换网线，笔记本也拿“网线转10GB的插头”，至少家里所有笔记本、台式机都是标准2G带宽。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p61","index":61,"text":"有没有想明白老天要告诉你什么？如果连这两件事都没想明白，只能说对生活敏感性太差。7月份为什么没怎么干活？第一，录播的东西要一遍遍过，太费劲，这是工作问题，不多说。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p62","index":62,"text":"洗灵过程与身体经历","level":2,"key":false,"section":"ep5-p49"},{"id":"ep5-p63","index":63,"text":"第二，一到7月份身体弱、脑子不好使、睡不醒，阴气重，我也是这么认为。但7月底应该好了，结果还出问题，因为又要升级了。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p64","index":64,"text":"还记得去年跟大家说过，给一些学生做疗愈，那场用了20%的能量，给他们改变了，差点整个师门都快崩。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p65","index":65,"text":"一定记住，不能消耗气运，越干大事越要洁身自好，很多东西靠气运。稍差一点，节拍赶不上，整个企业就崩，差一次就没了。那次只少20%，仙家很生气，但还没至于崩。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p66","index":66,"text":"这一年总算恢复回来。出问题前，洗灵师傅帮我洗灵，正好看到我在海里被一堆鲸鱼围殴。后来帮学生做了一下，福报少20%，影响很大。再想补、再做，洗灵师傅就看不到影像，同频共振不上去。大概第49世或者50世，去年发生的。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p67","index":67,"text":"今年最近终于连上，洗灵师傅有感应，说差不多，又要开始洗灵。我说行，谢谢。第一次，看到海里一个宫殿中的身体，怎么碰都不动。洗灵师傅同一时间传功，我想至少可以帮15万人同时传功，没问题，但想动我这个身体，动不了，没反应。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p68","index":68,"text":"第二次还是没反应。第三次努力之后总算改变，变成我被关在水牢里，下半身腿泡得发胀、黑黑的。见过我的都知道，我经常得用包腿布裹着。看到了吧？","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p69","index":69,"text":"一直以为年轻时不注意，再加糖尿病，小腿神经末梢有点萎缩，很怕凉。这么热的天也得裹着，否则小腿老觉得凉。现在才知道跟这个有关。当然血管萎缩也有，年轻时糟蹋也有，但跟这个关系很大。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p70","index":70,"text":"为什么展示这些？没什么秘密可言，因为什么问题出现什么事，这是一种规则，得告诉你们清楚。又没露银行密码，怕什么？也不涉及再娶房小的，要给大家好形象、好面貌，有什么事就说一下。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p71","index":71,"text":"发现这个了，但洗灵师傅弄不出来。到今年第四场，刚开始还是弄不动，以他的能量级别弄不动。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p72","index":72,"text":"后来地藏王菩萨出现在幻境里，把那个东西拿掉一些，上面一堆佛祖菩萨打金光。这时我从水牢出来，沿很长的通道走，总算走出来。可能第49世还是50世，我忘了，把那一世被关着的魂弄出来。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p73","index":73,"text":"但每次洗灵都得昏睡很久，尤其第四次，虽然解放出来，非常累，下午直接睡6小时，睡不醒。魂归位了，但受伤太严重，会拉低现在的魂能，恢复两三天才行。不是不想给大家录东西，实在有问题。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p74","index":74,"text":"从第三次洗灵时，显卡和网络出现转机。今天说一个很重要的东西，叫天道意义。未来聊天道思维，因果思维、天道布局，必须有意识：这段时间集中爆发事情，想告诉你什么？必须有从现象反推本质的能力。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p75","index":75,"text":"无论显卡还是网络，共同特性是什么？本身没有任何问题。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p76","index":76,"text":"但是有一段时间，无法发挥全部威力，发挥不了全部功效，而且极度波动，比如网络。一定从现象发现本质，连这都发现不了，活得太白了。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p77","index":77,"text":"魂回来后，精神状态完全不一样。《问道》三录播版，磨叽两星期写不出来，一弄就出来。今天的意义思维也是，磨叽两星期不知道怎么说。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p78","index":78,"text":"魂回来后，半天就OK。原来素质没问题，但想发挥，发挥不出来。之前发挥不了的，现在可以满信号发挥，CPU干到100%。以前讲东西时好时不好，就是CPU有些没更新，发挥不全。像网络，最厉害四分之三，正常一半，现象不好时四分之一，500兆带宽。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p79","index":79,"text":"通过这个事情，知道现在魂基本补全了，因为之前出现过魂裂、魂碎。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p80","index":80,"text":"第二，也知道以洗灵师傅水平，再补之后轮回的东西挺费劲。50世都这样，51世不好说。我估计用这一生再帮我干10世、20世，就了不得。但小号人间100世、天界100世，连人间100世还没干完，为什么往上修难？越回归，动用能量等级越高。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p81","index":81,"text":"不知道几亿年后，能清大号第一世。打位面战争杀人太多，不知道什么级别能帮清理冤亲债主，不好说。所以要通过现象分析本质。最近一些同学经常找我，身上总发生意外。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p82","index":82,"text":"气运变化与应急准备","level":2,"key":false,"section":"ep5-p49"},{"id":"ep5-p83","index":83,"text":"女生40岁以后、男生45岁以后，基本要走衰运。如果一件事怎么弄都出现变数，包括我帮看也有变数，我建议先等等。不管着不着急，没有解决气运，这是走败运、弱运，往下滑，要通过现象分析本质。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p84","index":84,"text":"像我，2025年换十年大运，将走这一生最好的运。换运会不会倒霉？会，但所有倒霉都是让你有更好的重生。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p85","index":85,"text":"因为走上升运，倒霉是在调整。今年身体出了多少事？首先脑子开一瓢，当时头疼，直接拉医院，照CT后就要开颅。遗书没来得及写，银行密码、钱在哪都没来得及跟媳妇说，就推进去了。万一弄一下失忆，全废了。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p86","index":86,"text":"大家提前写好遗书，不知道哪天出事。至少哪个银行有钱、密码在哪、哪个卡多少钱，跟媳妇说清楚，别真有事还得借钱。我看病时，媳妇掏不出钱，不知道放哪，还得跟学生借。手术花10万马币吧，相当于18万块钱。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p87","index":87,"text":"来不及，推进去忘说了。藏私房钱不行就让媳妇知道，至少还能救命。第一件事发生，不懂无所谓；第二件是血糖不正常，后来直接上了这个，现在血糖非常合格。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p88","index":88,"text":"这时应该有意识，好像今年这些事都是解决生命中的问题。胳膊疼，做完手术现在没事。高血压一直解决不了，后来找大夫换药，也没事。到现在所有指标、病，不管通过什么，都变好了。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p89","index":89,"text":"处理胳膊时，已意识到好像今年要把身体问题爆发出来，再想办法压制、解决。所以高血压有问题时，直接意识到是好事，但什么契机、找哪个医生，不知道。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p90","index":90,"text":"后来换药稍出意外，但最后结果非常好。今天教大家最重要一点，要学会分析天意，从现象分析本质，别天天瞎过。一件事可以叫意外，类似的发生两次，就不能叫意外，一定分析老天通过这件事想告诉什么。","level":0,"key":false,"section":"ep5-p49"},{"id":"ep5-p91","index":91,"text":"三 意义思维的定义与习惯","level":1,"key":false,"section":"ep5-p91"},{"id":"ep5-p92","index":92,"text":"正式进入意义思维。没什么太难的，最重要是分析这件事有没有意义、值不值得做、能让你得到什么。最难是融入生活，否则学了白扯。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p93","index":93,"text":"我敢确定，今天学的意义思维，如果真融入生活，命运一定改变30%以上。不要小看，没难度，只是没融入生活、没产生思维习惯。真产生习惯，人生会很有意义。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p94","index":94,"text":"意义思维是以最终目的和真实结果为尺度，对一件事情的目的、价值、代价、后果、路径、本质和当下的行动进行持续审视的一种思维模型。","level":0,"key":true,"section":"ep5-p91"},{"id":"ep5-p95","index":95,"text":"说白了，我为什么做这事？能得到什么？最后得不到怎么办？付出什么代价？值不值得？继续走会怎么样？现在做的还在服务最初初心吗？经常问，就不容易走偏。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p96","index":96,"text":"人生很大问题，是意义思维没有成为观察事物、解决问题的必选项。不是意义不存在，是大脑不主动往意义方面想。像之前说的思维枷锁，不是事情没发生，是大脑不往正确地方思考。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p97","index":97,"text":"我产生思维习惯后，身边发生事情，大概率琢磨天道想干什么。现在一个学生找房，过程中发生事情，我就知道他肯定要换运。一定从表象发现天道要教你干什么。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p98","index":98,"text":"经常出现奇怪状态：做一件事很多年，从不问为什么；学东西很多年，不知道干什么；争论几个小时，没解决问题；为了小目标，把大目标干掉；因为别人都做，自己跟着；被表象牵着走，看不到原因和因果；浪费大量时间，不算成本；发生问题先发泄，不处理最需要解决的东西。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p99","index":99,"text":"意义思维要达到的状态，不是知道它叫什么，而是成为生命的一部分，成为大脑面对事情时自动启动的检查程序。咱们说七种模式。","level":0,"key":false,"section":"ep5-p91"},{"id":"ep5-p100","index":100,"text":"四 意义判断","level":1,"key":false,"section":"ep5-p100"},{"id":"ep5-p101","index":101,"text":"把经典读薄并找到用途","level":2,"key":false,"section":"ep5-p100"},{"id":"ep5-p102","index":102,"text":"从七种模式分析合不合适。第一，意义判断。我为什么做？成了值得吗？最后得到什么？就是目的、结果、价格、价值、代价，是否值得。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p103","index":103,"text":"第一种错误，知道是好东西，却不知道有什么用。人类2500年，智慧是什么？《心经》《金刚经》《道德经》到底讲什么？学佛教、道教，能在生活中改变什么？改变了吗？没有改变，是教得不好，还是学得有问题？","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p104","index":104,"text":"《道德经》有一句重要的话，叫“为学日益，为道日损，损之又损，以至于无”。咱这“以至于无”倒不至于。学习不断增加知识没问题，但学得差不多，是不是要剥离细枝末节、重复、案例、形式、文字，琢磨最后核心是什么？读经典不能越读越厚。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p105","index":105,"text":"得越读越薄。经典几千字、几万字，大量解释、故事、比喻、举例、重复说明、不同角度展开。最后必须回答核心教什么，对改变一生有什么帮助？没帮助，学它干什么？很多人读一辈子《心经》，不知道讲什么，最后变成明心净性、让人静心的东西，这跟扯淡。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p106","index":106,"text":"《金刚经》总结起来四到五句话，讲几个事。不断注解、解释、引申，为了理解每句话，但到底干什么，对生活有什么帮助，问过自己吗？学那么多空色，《大般若经》花600卷讲，对我有什么意义？除了知道世界是假的，混沌法则、污染法则，还有什么意义？没什么，明白几个事就行。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p107","index":107,"text":"污染法则怎么对抗，人家也说了，只不过大概率不明白。不能用一句话或现实行为解释，不能融入生活，对你无用。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p108","index":108,"text":"古代经典像螺丝刀法则，给一把螺丝刀，说材质好、厉害，忘说到底干什么。至少得说拧螺丝，螺丝长什么样、什么时候拧、怎么使用。说一堆却忘了用途。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p109","index":109,"text":"一帮捧佛祖、道祖臭脚的人，以为研究几个字就厉害。得为道日损，学会把书读薄，你读薄了吗？也没看怎么样。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p110","index":110,"text":"判断研究与争论是否有价值","level":2,"key":false,"section":"ep5-p100"},{"id":"ep5-p111","index":111,"text":"第二种，把生命浪费在无法验证、无法应用、跟自己目标无关的事情上。有些人喜欢研究虚头巴脑的东西，不知道有无用、没办法验证、不知道操作、最后能改变什么，却投入几年甚至几十年。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p112","index":112,"text":"一定明白弄这东西为了什么。判断顺序：能不能验证？怎么应用？跟当前目标有没有关系？这里面占一个就别碰，占两个以上离远点。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p113","index":113,"text":"《道德经》的东西都明白吗？“无为而无不为”怎么做，会做吗？不会，研究干什么？两千年没研究出名头，凭什么确定自己对？没研究的人也没耽误成功。既然不耽误，为什么研究，闲的。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p114","index":114,"text":"为什么用现在有限生命，长期投入既不能验证、不能应用、跟当前人生没关系的东西？比如研究佛教的“无无”，有什么用？无、空，不就是假的，污染法则、混沌法则明白就行，还能弄什么花，至于赔一辈子吗？研究“本来无一物，何处惹尘埃”，还当博士论文，研究完对自己有什么影响？","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p115","index":115,"text":"对人类、自己都没影响。研究有没有外星人，关你什么事？有证据、素材、案例、经历吗？能不能解决第二天挨饿、老婆打架？解决不了，研究这个，闲的。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p116","index":116,"text":"某个明星出没出轨，你趴窗口去了？有没有离婚，到民政局查一下不就完了？两个明星有没有恋爱、是不是真心，你自己还嫁不出去，关心跟自己有关的事。甚至吵架时，先问四句话。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p117","index":117,"text":"第一，争吵内容能证明吗？谁都证明不了，吵什么？足球赛踢之前争谁赢，踢完就知道，扯这个干什么？第二，证实后能改变什么？第三，跟生活、自己目标有没有关系？第四，这场争论产生什么价值？","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p118","index":118,"text":"跟别人、媳妇、儿子、闺女吵架，先看这四个问题能不能解决。不能，就别吵，及时退出才有意义。很多人不是没时间，而是大量时间花在与人生毫无意义的事情上，人生就这么浪费。真正值得争论的，不是能不能赢你，而是答案值不值得花生命价值去争论。","level":0,"key":false,"section":"ep5-p100"},{"id":"ep5-p119","index":119,"text":"五 多步推演","level":1,"key":false,"section":"ep5-p119"},{"id":"ep5-p120","index":120,"text":"第一步有利不等于最终有利","level":2,"key":false,"section":"ep5-p119"},{"id":"ep5-p121","index":121,"text":"第二个叫多步推演，多想几步，别想一步就干，干完发现错。睿智的“睿”是什么意思？多想几步才叫睿智。不要以为第一步有好处，就值得做，真正该问第二、第三、第四、第五步，然后呢？","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p122","index":122,"text":"第一步是收益，第二步是反应，第三步是连锁，第四步是风险，第五步才是终局。","level":0,"key":true,"section":"ep5-p119"},{"id":"ep5-p123","index":123,"text":"让你们想十步不可能，想到第三、第五步就行，人生一定没问题。第一步正确、对自己有利，不代表整个事情对自己有利。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p124","index":124,"text":"比如老板加薪50%。第一步涨工资很开心，第二步发现工作时间从8小时变14小时，第三步身体越来越差。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p125","index":125,"text":"第四，经常不回家，跟老婆、孩子关系恶化。第五，几年后身体、家庭都不行，最后发现不如不拿那50%，多出来也没干什么，何苦？打工挣100万年薪非常费劲，比考清华北大费劲得多。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p126","index":126,"text":"靠打工，不是做生意。做生意大概率做对，挣100万比较简单；打工得拼，拼完值不值，要琢磨。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p127","index":127,"text":"创业一年挣一二百万，还能通过税务洼地解决税务、流水问题；净利润1000万，税务问题就麻烦。工商、税务，甚至公安、竞争对手、死对头，有人开始盯你。穷小区换车，就有人说闲话、戳脊梁骨，人际关系都变化。不是只想1000万挣到了怎么样。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p128","index":128,"text":"穷人觉得挣1000万是好事，挣过的富人知道，各方面得配得上。挣一个亿更麻烦。但在中国，一辈子挣3000万到5000万还是快乐，很多问题能解决；一年一个亿，很多问题不好解决，藏钱都难，容易惹麻烦，钱能不能拿10年、20年不好说。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p129","index":129,"text":"上10亿，麻烦更大，扛不住是灭顶之灾。10亿、几十亿，觉得国内有问题，还能跑；一两个亿不至于上红通，10亿以上就够格。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p130","index":130,"text":"如果政府要折腾，够格上红通，麻烦，但也不是不能解决。上100亿就不是红通问题。假设做100亿之间的生意，会互相产生伤害，能挣100亿的人，调配社会资源不是你能想象。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p131","index":131,"text":"不只是政府，黑白两道、暗网都可能折腾。没有保镖、安保团队、出行规划，容易出大事。涉及国家层面，甚至特工、国家层面灭杀，抓不回来直接灭，不一样。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p132","index":132,"text":"夫妻冷战也这样，开始赌气，想用这种方法让对方求我。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p133","index":133,"text":"男女都有这种想法。但你出招，对方也出招，“我也不理”，互相防御，越来越想不通，不愿沟通，到第五步感情消散。就算第一、第二步赢了，最终不愿一起过，输最多的是什么？","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p134","index":134,"text":"长期风险与储蓄兜底","level":2,"key":false,"section":"ep5-p119"},{"id":"ep5-p135","index":135,"text":"有时不是看今天、明天、下个月，而是看5年、10年、20年、30年，提前定好。像我，不管挣没挣钱，都会拿一部分作为储蓄，因为不相信人生没有意外。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p136","index":136,"text":"就算认知比很多人高、经验多，还有法界帮助，出大问题可能性不大，也不能说一定不出意外。真出意外，兜底的东西是什么，有没有？三四十岁，尤其40、45岁，存款多少？越接近50岁，父母容易出问题，孩子也开始要劲。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p137","index":137,"text":"夫妻关系容易出问题，挣钱能力大幅下降，社会排挤你，能不能解决？年轻时光嘚瑟、买东西，又出新iPhone，光惦记买，没人兜底，最后人生失败。气运、身体、世界格局、经济、家人变化都要算进去。别活太简单，越简单越痛苦。","level":0,"key":false,"section":"ep5-p119"},{"id":"ep5-p138","index":138,"text":"六 终局反推","level":1,"key":false,"section":"ep5-p138"},{"id":"ep5-p139","index":139,"text":"小目标必须服从大目标","level":2,"key":false,"section":"ep5-p138"},{"id":"ep5-p140","index":140,"text":"第三个，反向思维，叫终局反推。经常出现的问题，是现在干的跟最终想得到的不一样、没关系。所以一定先反推，最终想得到什么？","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p141","index":141,"text":"现在干的跟最终想得到的有没有关系？没有，甚至破坏，为什么做？先写好终局，再看必要条件、当前行为，是否跟终局所需一致。小目标必须服从大目标，开始人生反推。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p142","index":142,"text":"比如修行者，相信因果轮回、业力，最关心的是这一世完成后能不能升级。得看升级需要什么。福报、众生善缘是两个核心。现在干的跟增加福报、功德、众生善缘有关系吗？","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p143","index":143,"text":"为什么跟人分手，或者相处一段时间闹毛病，不想想众生善缘？下辈子见不见？因为这辈子一点事，下辈子善缘出问题，值不值？","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p144","index":144,"text":"不管别人干什么，是因果消散前最终展现。没有一辈子缘分，大多中间会出事，跟所有众生都会，很正常。出事后开始怨，还是服从众生善缘这个大原则？刷游戏、跟老婆吵架、出去happy，跟功德有关系吗？没有，为什么干？这叫人生反推。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p145","index":145,"text":"不能完成大目标，为什么干？当然偶尔休息可以。像我也刷剧、躺着、打游戏、逗儿子，肯定也干。但一天主力时间要工作，挣钱的工作先做，因为要养家糊口。第二，要大量时间利益众生。第三，照顾家人，跟儿子玩，处理家里的事，比如上保险。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p146","index":146,"text":"这些很正常，也会花时间，跟这个没关系，但让你活得更好。大原则不能违背，违背了，这一生最后是个零。小问题不要影响大原则。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p147","index":147,"text":"教育与婚姻的长久目标","level":2,"key":false,"section":"ep5-p138"},{"id":"ep5-p148","index":148,"text":"教育最终结果是什么？别老说报效祖国、报效人类，先让自己成为不会饿死、能独立生存的人。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p149","index":149,"text":"假设大量学习不能活得更好，意义是什么？得反推。这一生经常干、经常解决的是什么？先学会生存，是持续做的。结婚、处理婚姻关系，是几十年的事；养儿育女、教育孩子，是几十年；照顾身体也是。夫妻两性生活，绝经前是不是得发生，和不和谐，也几十年。身体健康、不生病，一辈子。跟父母关系、让父母善终，也几十年。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p150","index":150,"text":"这些影响一生，却在人类最美好年龄，用10年、20年学终生几乎用不上的知识道理。陪伴几十年、影响生活质量甚至一生成败的东西，却没人教。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p151","index":151,"text":"不奇怪吗？学一辈子用不到的，还用它评价成功失败、优秀不优秀，为什么用你们的标准衡量我的人生？用意义思维反推，不能别人干什么就干什么。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p152","index":152,"text":"婚姻目标是两个人长久、欢喜、愿意一起生活。反推需要信任、尊重、沟通、安全感、共同利益、亲密和情绪。每次吵架，有没有想现在是否伤害这些？为什么男人不愿回家，女人对男人失望？你是在增加还是减少这些感觉？不要陷入具体事情，因为它会影响人生。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p153","index":153,"text":"谁多干少干、谁父母有问题，钱、孩子、两性问题，一句话谁对谁错，天天争吵。就算争出对错，日子过不下去，意义是什么？事业赚钱也一样，先想大原则、大目标，此刻做的有没有伤害大目标。","level":0,"key":false,"section":"ep5-p138"},{"id":"ep5-p154","index":154,"text":"七 不盲从","level":1,"key":false,"section":"ep5-p154"},{"id":"ep5-p155","index":155,"text":"学习服务于人生","level":2,"key":false,"section":"ep5-p154"},{"id":"ep5-p156","index":156,"text":"第四个，不盲从。别人说什么就信什么，动点脑子、智慧。以前有教无类，以后不能成为逆修觉者，我都懒得度化，跟你说话浪费时间。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p157","index":157,"text":"别人做什么，不构成我应该做什么的理由。经常听“大家不都这样吗”，马上问：“大家都这样，我为什么要做，对我有什么好处？”","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p158","index":158,"text":"学习刚说很多，努力学习才有未来，本来是应该有更好未来，学习只是其中一种手段，而且现在用处逐渐削弱。幸福美好才是目的，不是学习。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p159","index":159,"text":"学习应该服务人生，而不是人生服务于学习。","level":0,"key":true,"section":"ep5-p154"},{"id":"ep5-p160","index":160,"text":"“学习好才能挣钱”，一听就是穷苦家庭、中下贫农、小市民思维，没理解什么是学习，也没理解挣钱。这种学习好后挣钱，大概率是服务资本、打工，不是创业。这里说的学习是课堂文化课，不是自我学习能力，别混了。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p161","index":161,"text":"从多个方面比较技术岗位与包子店","level":2,"key":false,"section":"ep5-p154"},{"id":"ep5-p162","index":162,"text":"没理解一个生意、行为有没有价值的根本。衡量能不能挣钱，第一竞争压力大不大？第二会不会被替代？比如马被汽车、汽车被火车、火车被飞机、飞机被火箭替代，是速度上的替代关系。第三能干多久？第四自我把握度多少？第五扩张时有没有自我生存性，能自我扩张是好生意。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p163","index":163,"text":"再往下，换公司、地方、团队，还行不行？最后，干好了能不能传承？用这些衡量年薪百万技术人员和卖包子的，谁更合适。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p164","index":164,"text":"年薪百万相当不容易。我可以负责地说，清华北大计算机博士可以；普通985博士，理工科也很难，六七十万不错。海归top前30、热门专业，七八十万以上有可能。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p165","index":165,"text":"普通的没戏。普通985本科、非热门专业，一个月两三万就烧高香。干掉全国多少人才能985、清北？拿这钱太辛苦。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p166","index":166,"text":"卖包子的，就廊坊我喜欢那家，很破，还不是临街，一年二三十万没问题，小学毕业就可以。同拿二三十万，双方付出成本不对等。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p167","index":167,"text":"二三十万，是现在985非热门专业刚毕业能拿的钱。卖包子再努力，挣三四十万，相当于985热门专业硕士。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p168","index":168,"text":"竞争压力呢？技术岗位一年一茬招生，还有其他学校。清华至少有北大，还有麻省理工、耶鲁、帝国理工、牛津，很多人竞争。包子也有竞争，但以店为原点，3公里内才有压力。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p169","index":169,"text":"超过3公里很少，超过5公里基本不竞争。就算别家好吃10倍，也不会早上专门跑5公里吃。只要干掉3公里内的就OK。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p170","index":170,"text":"研发成本简单，一天做一种馅，用AI、看视频，自己做，一年内一定能做出特别厉害的包子铺，我绝对相信。实在干不动这活，就卖包子，300多天研究，也能弄出特别的馅，竞争不难。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p171","index":171,"text":"第三，能否替代。计算机、数据库、大模型、AI，一定会被替代。包子几千年没被替代，只要有人类，还愿意吃，被替代可能极小。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p172","index":172,"text":"工作周期呢？见过华为几个P8、P9程序员——是不是叫P8、P9，我不知道，反正年薪百万——能干到45岁以后？有生命周期，男的优势45岁前，女的基本40岁前。工作丢了再找，不可能。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p173","index":173,"text":"卖包子45岁就没人吃，可能吗？只要能和面、开张，就没这个问题。自我把控，你干得好，但参加政治斗争，是A领导的人，B领导得势要干掉你，把控不高。卖包子，只要口味不下滑、附近人还在，很容易把控。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p174","index":174,"text":"自我扩张，技术到35、40岁，再扩张很难，成功性低。卖包子、做生意，我很在意不宣传的情况下，有多少通过口碑扩张。能自我传播，就有生命力，是好生意。一年或三年不宣传，能不能自我复制、扩张？不做广告、不跟人说，闻着味或凭名声过来。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p175","index":175,"text":"像我现在疗愈、身心灵这部分，基本不宣传，从不在这里宣传，就看它能不能自己发展。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p176","index":176,"text":"能发展，有生命力；不能，可能水平不行。需要广告、促销，本身就有问题。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p177","index":177,"text":"再往下，从华为出来，45岁后还有谁接？没有很危险。换公司没人接得住，就出大事。换地方呢？我从北京到廊坊、泰国、马来西亚，不影响挣钱。换公司、地方就挣不到，像从美国到日本就不行，那悠着点，很危险。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p178","index":178,"text":"卖包子要允许发展时间。别跑印度，人家不吃包子，你去卖就扯淡。但只要喜欢吃包子的地方，过去能再发展，生命力很强。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p179","index":179,"text":"有的人依赖团队、某些人，麻烦。比如田朴珺，不是王石的女人，谁搭理？Angelababy离开黄晓明，自己是什么？景甜离开某些金主爸爸呢？依赖性太强，容易出问题。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p180","index":180,"text":"最后两点，一是能否持续增长。做技术没办法持续增长，但只要有人认可我能力、提供的价值，东西就一直增长，是好生意。最后是传承，干一辈子，这代完了下代不行。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p181","index":181,"text":"像洗灵师傅，到现在没找到同源传承者，可能就这一代，老了、干不动，洗灵在人间界又消灭了。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p182","index":182,"text":"卖包子能传承吗？只要手艺没问题，很容易。要通过这些分析生意好坏，别谁说靠学习挣钱容易就信。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p183","index":183,"text":"清华计算机博士，不是顶尖姚班，只是进一线大公司，马上面临这些：容易竞争，每年新生代出来；不是不能替代；有工作周期。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p184","index":184,"text":"45岁后能否再找到相同工作，不好说。能否自我把控，好好干就越来越好，做不到；能否扩张，能扩张至于还是打工？换公司、地方、团队、老大支持，就不行。东西不停积累，客户跟着积累吗？以前我做程序员，不断学编程语言，客户还是那些，没产生积累，不是好生意。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p185","index":185,"text":"努力一辈子，能不能传下一代？不能，不是好生意。用这些判断好坏。花大价钱培养人成为别人工具，君子不器，很蠢。大目标是持久挣钱、积累、传给下一代，你做不到，只是好用的工具，用旧就扔。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p186","index":186,"text":"职业 创业与彩礼的具体条件","level":2,"key":false,"section":"ep5-p154"},{"id":"ep5-p187","index":187,"text":"从这点说，985工科博士不如包好点的包子店有价值。公务员也得考虑，现在抓多少，不行贿、不玩潜规则能上去？不上去，为伺候领导？还往里钻。有些省、市效益不好，发不出工资；赶上活动、运动，还得自己垫钱帮助民众，脑子有问题。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p188","index":188,"text":"中医也这样，“中医你得才行，你不，干不干也就那么回事”。创业，以前年轻经济好，女孩找男的说创业，好；现在男的说创业，赶紧跑，离远点，成功率极低，不一样了。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p189","index":189,"text":"彩礼，有钱就要，没什么高低。比如我儿子看上姑娘，别说18万8、28万、38万，188万愿意也给，又不是给不起，家里能扛就给。只一点，别因为彩礼，让生活更艰难、感情破裂、有芥蒂，咬牙结婚，后面都是事。","level":0,"key":false,"section":"ep5-p154"},{"id":"ep5-p190","index":190,"text":"八 穿透表象","level":1,"key":false,"section":"ep5-p190"},{"id":"ep5-p191","index":191,"text":"从言语和行为看背后的意思","level":2,"key":false,"section":"ep5-p190"},{"id":"ep5-p192","index":192,"text":"别老跟风。第五个，穿透表象，别被表面影响，分析底层意思，学会提问。老婆今天唉声叹气，是不是翻日历？一看生日，一看二月十四，“这不七夕”。","level":0,"key":false,"section":"ep5-p190"},{"id":"ep5-p193","index":193,"text":"或者立秋，该秋天第一杯奶茶，要懂事。老婆发脾气，先翻日历、问AI：“今天老婆不高兴，今天什么节日，是不是踩在哪个点？”让AI帮分析，就知道怎么回事。一定学会看表面之下，融到思维。","level":0,"key":false,"section":"ep5-p190"},{"id":"ep5-p194","index":194,"text":"领导说：“小王，多吃鱼。这鱼是好鱼，刺太多。”此时说：“领导，吃鱼肚子肉，心腹没有刺。”或者说：“鱼刺多，但有一条主干，有主心骨。”","level":0,"key":false,"section":"ep5-p190"},{"id":"ep5-p195","index":195,"text":"明白领导要干什么。菜市场吵架，挑菜叶黄、有洞，这不好那不好，是挑毛病吗？希望赶紧便宜，得明白意思。","level":0,"key":false,"section":"ep5-p190"},{"id":"ep5-p196","index":196,"text":"孩子不写作业时先问为什么","level":2,"key":false,"section":"ep5-p190"},{"id":"ep5-p197","index":197,"text":"孩子不爱写作业，别上来就骂、罚，这么蠢。越说越不敢，得看为什么。为什么叫问道？问为什么：不会、太难、害怕、太困、没兴趣、注意力有问题、家庭有问题，还是谈恋爱？都可能，从现象分析本质。","level":0,"key":false,"section":"ep5-p190"},{"id":"ep5-p198","index":198,"text":"解决表象，只让问题暂时消失，找到原因才真正改变。不要只问发生什么，还要问为什么发生，行为、事情背后想告诉什么，真正推动原因是什么。所以今天先讲天道思维，从事情理解天意。","level":0,"key":false,"section":"ep5-p190"},{"id":"ep5-p199","index":199,"text":"九 时间与成本","level":1,"key":false,"section":"ep5-p199"},{"id":"ep5-p200","index":200,"text":"把时间算成成本","level":2,"key":false,"section":"ep5-p199"},{"id":"ep5-p201","index":201,"text":"第六个，时间与成本。最好把时间算成本。越低收入越不在乎时间，很多时间去消耗；越高收入越在意，计算一小时得失。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p202","index":202,"text":"一年挣1000万，除365，再除8小时，大概3400块钱。一小时3600秒，大概率相当于一秒一块。按365天除，但不可能工作365天，按实际工作时间，大概率一秒一块，年薪百万就是一秒一毛。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p203","index":203,"text":"马斯克为什么说，你的思维赶不上我的价值、时间，是浪费时间？人家一秒多少钱，甚至几千美元都有可能，我没具体算。他听5分钟汇报，浪费多少时间、钱？","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p204","index":204,"text":"只有没钱的人不在意。为省20块开车两小时；加油站涨价前排队，一箱油差几毛、几块，排两小时，为这点钱，闲的。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p205","index":205,"text":"领10块优惠券研究半小时，便宜50块跑三趟商场，这是浪费时间，对时间能产生的价值没感觉。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p206","index":206,"text":"很多人抱怨，“有钱后找他吃顿饭也吃不着，耽误不了多久”。有钱人想的是，跟你吃饭为了什么？有意义思维，就进入不同阶级，只有高收入或对生命有价值的人才思考行动意义。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p207","index":207,"text":"吃饭交往与时间选择","level":2,"key":false,"section":"ep5-p199"},{"id":"ep5-p208","index":208,"text":"三脚踹不出屁，跟你吃什么饭？珍惜几十年同学友情，可以。工作同事没什么交集，不下坏水就不错，离开公司99.99%可能一辈子见不到，在乎什么？","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p209","index":209,"text":"我个人，吃饭能对他、对我有提升，会去，但只限学生。不是学生，哪有时间？对师门发展有帮助，会去。什么都没有、就为吃饭，目前只有一个高中同学，关系好，将近30年交情。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p210","index":210,"text":"为这交情可以吃，否则有功夫还研究东西利益众生，扯这些有什么用？这很重要。","level":0,"key":false,"section":"ep5-p199"},{"id":"ep5-p211","index":211,"text":"十 当下有效性","level":1,"key":false,"section":"ep5-p211"},{"id":"ep5-p212","index":212,"text":"孩子受伤时先解决眼前问题","level":2,"key":false,"section":"ep5-p211"},{"id":"ep5-p213","index":213,"text":"最后第七个，当下有效性。事情已经发生，此刻最需要处理什么？很多人第一反应不是解决，而是生气、害怕、抱怨、指责、追责、证明对错、发泄。真正问题摆旁边，所有人处理情绪。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p214","index":214,"text":"我自己亲历，关车门，儿子平时不扶那儿，这次扶了，我没看到，夹住了。一疼使劲一扥，整个手皮爆出来，血一下出来。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p215","index":215,"text":"场面很刺激，老婆急了，孩子叫声跟平时不一样，估计真疼。但此刻最重要，不要发泄，不要紧张。第一，伤的是手指，再严重大不了截肢，也只是手指，对一生不会有太大问题。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p216","index":216,"text":"第二，两门之间还留缝，实际上不会太严重。第三，此刻家人安抚、抱孩子，老公赶紧开车找最近医院，做伤口处理，这是应该干的。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p217","index":217,"text":"我老婆先打再指责，我说现在都别说话，会影响开车。心情不好撞别人、车，都被耽误。最该处理什么，而不是发泄、论责任，事情已发生，任何对孩子手指没帮助的，现在不要处理。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p218","index":218,"text":"还有学生，孩子玩水果刀伤手，爸爸在旁边。妈妈看孩子哭、流血，心疼，先埋怨爸爸“你在旁边干什么吃的”。有没有这么说不知道，据说话可能不太好听。爸爸马上反击：“他自己玩弄的，我还天天盯着？”进入互相埋怨、推卸责任。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p219","index":219,"text":"后来夫妻干仗，孩子看没人管，哭着、带着流血手指找姥姥。最该先解决流血，再说平时怎么防范。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p220","index":220,"text":"交通事故中的时间与处理选择","level":2,"key":false,"section":"ep5-p211"},{"id":"ep5-p221","index":221,"text":"撞车，我不先研究谁对错，下车指责“眼睛长哪，怎么开车”，没必要。先衡量处理占多少时间成本、由谁去。如果旁边有人，留下证件等让他帮处理，消耗他的时间比我的合适。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p222","index":222,"text":"该拍照、报警就做，报完该走就走。很小的事，报警、认定责任，对方又激动，我就说不管谁，我全责，赶紧弄完；或者给点钱走，跟他说话浪费时间，更多先衡量。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p223","index":223,"text":"2011年，老婆晚上开车去机场接谁，忘了。北京机场二高速一条路没灯。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p224","index":224,"text":"在里道开，绿化带突然窜出人，捡快车道可乐瓶。来不及，刹车往旁转，撞到GL8。警察来了，说报案就说你全责。老婆问为什么，不是我的事。警察说，是不是不重要，双方有保险；说为躲人，保险公司要追那人责，给你赔钱。他为了可乐瓶跑高速中间，赔得起吗？那人傻傻蹲着。老婆想算了，不管谁全责。","level":0,"
