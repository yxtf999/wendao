<noscript><style>.topbar,.sidebar,.progress,#main,.back-top{display:none}</style><div class="noscript-body"><h1>问道·直播试讲先行版</h1><p>主讲人：悟聊天尊。当前未启用脚本，以下为第1—10课完整正文。</p><p>阅读提示：第三课修订了觉醒与解脱的定义。各课保留其试讲时的表述，第五课保留原稿校对附录。</p><h1>问道一 · 系列开篇总序</h1><h2>一 开场与课程安排</h2><h3>近况与现场交流</h3><p>大家晚上好。红烧狮子头，这是啥玩意？最近的气色还行，主要睡眠质量还可以。现在可以平躺在床上睡觉了，气色就还行，以前基本上晚上都得疼醒好几次。</p><p>声音比较小？给你们来个声音大的版本。现在声音如何？哈哈，二群太能注水了，这几天不看几千条，你们都说啥呢？我天呐。没什么事就别老乱聊，以后单独给你们弄一个群，叫什么闲聊群。说正事的时候，在那群里说。</p><p>声音洪亮，晚上好。你这太能唠嗑了，你看其他群都不咋说话，就你们二群，疯了一样。今天好好吐槽。</p><p>胳膊很不错，正常的都没什么问题了。现在练习，第一个星期真的挺疼，吃止疼药好像也不太管用，但是练着练着，有点练开了。现在什么叉腰、提裤子，都问题不大。背手的话，你得容我两分钟，得给它活动一下才行，不活动一下还是背不了手。</p><p>现在把伤疤都给盖住了，这个还行，头型略有变化。但是每次用手摸的时候，想想人生总要有缺憾，少了一块，从头到尾少了一块，真也没办法。</p><p>还可以再长长一点。上次找了一个理发师，结果给我理得感觉不是很好，没有发挥出我的优势。下次换一个，这不行，还是用之前的。</p><p>就别夸了，我跟你说，最近总教主下来给我看了一下，我慢太高了，都达到五分了。分别心太高。我发现自打研究人类说明书之后，天天看一堆人都跟看……似的，你老觉得别人是……你说这个分别心能小得了吗？</p><p>你当然就觉得，这两千五百年大家都研究不出来的东西，我终于研究出来了。我说这看一切众生、看一切圣贤都跟……似的。所以最近有点压不住，我现在需要淡定。</p><p>不，总教主人家不按百分制，人家按十分制，所以就相当于五十分了。最近这方面不太行，像贪念、嗔怒什么的都还行，就我慢之心有点压不住。对，那确实就是五十分。</p><h3>问道系列与四个阶段</h3><p>好，咱们正式开始了，不耽误大家时间了。大家晚上好，我先说一下咱们的情况。等了这么多年，终于成熟了，咱们从今天开始说《问道》系列。这其实也是人类说明书的一个系列，只不过起了一个更正式的名，一会我们做正式版本的时候再说。</p><p>我们未来的正式版本叫《问道》。但是你看，越是正式的，我们越希望：很多人都能听得懂，一个是咱们老朋友能听得懂，一个就是从来都没听过的人也能听得懂。</p><p>大家在群里的都看了说明书。咱们整个人类说明书，一共是四个阶段：逆修觉者、灵魂觉者、法界天机，还有道法自然。</p><p>咱们现在讲的是逆修觉者阶段。逆修觉者阶段就没有任何封建迷信的东西，没有任何神佛仙的东西，主要处理的都是真相，还有思维模型。</p><p>越是正式的东西，我越是比较谨慎。我们需要大家先提前听，比如我直播的时候，先按自己的稿子直播一遍。这不有四个群嘛，大家疯狂吐槽。</p><p>吐槽完了之后，如果没有什么太大修改的，我就正式录制。录制的时候，肯定得换一套行头，把头型再梳梳，还得要配图。所以现在讲完了之后，如果没什么问题，会有一些相应的小伙伴得去做一些图。正式版本肯定要配图，这样能成为一个真正可以传播的东西。</p><h3>正式传播与内容规划</h3><p>我们正式的传播是在二〇二七年的春节之后。</p><p>为什么定这个时间？主要就是你看《推背图》四十四卦，人家本来就是丁未卦，所以咱就必须得在丁未年去干这个事。正式的就是这样，到时候播放的时候，每天一集。</p><p>我们逆修觉者这块，一共就分三大块，叫天道思维、人道思维和人设思维，三种思维模型。我估计想了一下，大概思维模型两百多集。你光思维模型是这样，还有零散的叫真相。</p><p>真相就可以不用录得那么仔细，它不像思维模型比较难理解。真相说白了，跟你说这个事，你能接受就接受，不能接受拉倒。反正你活着，怎么着也得接受这个东西。你爱接受不接受，不能接受的话，到时候被这个规则影响了，也是你活该，就属于这种样子。</p><p>所以真相会很小，有的可能十几分钟就说完了，有的可能要两三个小时，每个真相不太一样。但我尽可能把真相，比如经济的、生活的、工作的、财运的、结婚的、学习的、生孩子的、教育孩子的，还有养生的，都得说清楚。</p><p>这些东西是你一定会发生的事情，你肯定活在这个规则里，你爱信不信。真相你能接受就接受，不能接受拉倒，反正这个东西不是我去决定的。</p><p>真相的部分，逆修觉者、灵魂觉者，我估计加在一起怎么着一两千集，还是挺多的。涉及思维模型的，逆修觉者这行，两百多集我估计差不多。你想，咱们光第一期——第一期天道思维这行，现在已经确定了，目录出来的话，七十六集还是七十七集，今天可能又增加了一个，七十七集。因为随时可能增加，减可能不会减了，但加可能随时加。</p><p>不定什么时候，上面的大号啪给我一个信号：“你小子还差上一集呢，赶紧把这个给说了。”有的时候想不出来，就是憋着憋着，就憋出来了。</p><p>人道那块，我们先把天道的讲完，讲完之后，我估计可能要休息一个月，就开始再讲人道的，之后再讲人设。我估计加在一起反正是两百多集，差不多。</p><p>这两百多集，明年二三月份开始放，一天放一集，就得放一年，这还没加上真相呢。你要加上真相，说白了，就基础的、大家能经常碰到的真相，二三百集我觉得还是没什么问题的。</p><p>比如像ABC运这种东西，就不算什么思维模型，它就是一个真相。你爱信不信，反正你不信，最后他不那么倒霉的时候，你别哭。</p><p>包括咱们说的叫“人生皆已知”，至少把人生大概可能会发生什么事、什么阶段会发生什么事，大概要说一下。你爱信不信，不信的话，自己碰到的时候别哭就行。</p><p>包括金融的事情、理财的事情、给自己留点后手的东西，都得去说。我也是一边看着新闻，或者一边看着小说，一些什么东西，正好刷到了，有感悟了，赶紧写。我现在拿一个小本，赶紧给记上，到时候咱们就说这些东西。</p><p>所以这个东西很多，最后还有案例。你光说理论，不玩案例，肯定没戏。这是一个非常庞大的东西，你想要把人类去改变，怎么可能这么简单？不可能这么简单。</p><h3>直播讨论与定稿录制</h3><p>这个就是咱们整体的发展阶段。我们的方式方法就是，我先用直播的形式，先给大家出大纲。出完大纲之后，先用直播的方式给你录，录完之后大家吐槽。你觉得看得好还是看得不好，看不懂的，我赶紧回来修改。</p><p>我们要求的就是大道至简，你别看不明白，这个就不行。所以我们的节奏是先出大纲、先出目录，让大家清楚未来讲的顺序是什么。</p><p>什么时候讲？未来讲得比较频繁，可不是一周只讲一次了。基本上我想好了，觉得写好了内容，觉得可以了，咱就开讲。所以未来讲的时间是不定的，哪天想好了咱就讲，属于这种样子。</p><p>讲完之后，欢迎大家吐槽，有三天吐槽时间。我再收集一下问题，如果没什么问题，就直接定稿。定稿完之后，我就开始录，同时也给咱们一些做图的小伙伴一些时间，就是这种样子。</p><h2>二 人类说明书为什么现在开始</h2><h3>从零散感悟到正式录制</h3><p>好，咱们不多说了，开始《问道》的第一期。首先得跟大家说，终于千呼万唤始出来了，咱们人类说明书正式开始录制。</p><p>为什么现在才叫正式录制？主要原因是之前讲得太零散了，但是实在也没有任何办法。为什么？天道在给你下发东西的时候，用的是因果碰撞这种方式方法。你这段时间碰到什么事、感悟到什么事，他才让你悟一个东西。</p><p>我以前都是什么？这礼拜感悟到什么东西了，觉得好像挺有意思，这个时候就开始给大家录。所以大家在听的时候，有些集会觉得很过瘾，有些集就觉得有点放水。不是我放水，关键是实在憋不出来。所以你们看的很多东西都是断断续续的，有很漂亮的集，有很感动的集。</p><p>甚至我记得在清迈的时候，都临开场十分钟了，还不知道要讲什么。</p><p>本来想给大家灌水，结果一开讲，上面大号传信息了，一下子灵感就来了，一讲大家还觉得挺满意，会出现这种情况。</p><p>这就叫顿悟，不能确定什么时候悟，哪天能悟到什么东西你也不知道。但是在长达将近十年的时间里，断断续续，通过看到一些东西、看到一些事，你会对天地之间有感悟。</p><h3>对智慧的理解也在修改</h3><p>所以没办法，我也一直在修改我们的很多东西。比如前段时间，如果三月份的时候，你问我什么是智慧，我还会跟你说，用高维的思维去解决低维的事，这就是智慧。看似是对的，但是再琢磨琢磨，我忘了是因为什么事了，反正突然发生了一件事情。</p><p>后来我又琢磨，好像不对，这个解释不完整。我就说，好像是从更长远的时间里面，始终保持你的正确性，叫长久正确，才是智慧。你甭管用什么方法，那是方式方法，不管，但是智慧的目的是为了解决这个东西。</p><p>弄完了之后，你就觉得很牛叉，之前的古人没人总结过这个东西，包括你用AI，你总结不出来这东西。</p><p>所以我也在成长，也在不停地修改。以后咱们人类说明书，第一版本这么说，第二版本就那么说了，有没有可能？肯定有这种可能。大家不要去怪，允许我在成长。</p><p>目前从天道上来说，基本上跟我说的是，地基打好了，可以盖楼了。那咱们人类说明书就千呼万唤始出来，正式开始。</p><h3>让人生的每一关有说明书</h3><p>我们为什么起名叫人类说明书？很简单，你看我做阴阳师快十年了，也看了十万次不同的单子，处理过至少几万次不同的事情。我觉得经验还是有的，看过的人生也足够多，我相信很多人这一生都没有看过这么多人。</p><p>但是你会发现一个问题，实际上最后总结出：大家生生死死，每一世都在干的一个事情是什么？就是迷茫地活着，我觉得都是在迷茫地活着。所以贯穿整个人类、我们这个小世界人类繁衍的过程，其实人真的不知道如何更好地活着。</p><p>我也非常疑惑，每次都问：你既然要对所有的人进行考核，有因果、有惩罚、有奖励，为什么不告诉大家应该怎么做？一问到这事，人家跟你说天机，死活不跟你说，我也弄得没办法。</p><p>所以我觉得这事挺奇怪，既然天道和轮回对我们一直处于一种考验，而我们一生之中都被考验着，不停地在做题——不停地解答人生的每一道题，过每一道关，但是他不给你说明书。</p><p>比如咱们学个知识，是不是还给你本书？你得先学，学完之后给你画重点，再给一些题，你得去做做、刷刷题，再给个考试大纲和考试方向。这个时候定好时间，咱考试。这时候考不过去，那就纯属自己水平问题。</p><p>我认，我也认。但现在这个东西就太不公平了，上来就考试，啥都不给。考过了，合格；不过，对不起，你就完蛋了，扣分。你说人下来之后，有几个能考过的？所以人生不如意十之八九。</p><p>有的时候我也在想，天道这啥情况？不给考题，又要考试，你到底想让人过，还是不想让人过？所以我觉得，可能也是天道在给我们机会，别人出不了，我来吧。</p><p>看了这么多之后，我非常想做的一件事情，就是让大家知道，天底下到底有多少个考题，考试的项目有什么，你需要具备什么样的知识，需要把自己锻炼成什么样子，才能进行一场好的考试，才能保证自己人生的每一关都一定能过关成功。咱别每次都裸考。</p><p>我一直期待把这件事情做好，但准备的东西实在太多了，用了十年时间去准备，也算对得起这个东西。我觉得基本准备差不多了，至少初期阶段已经够用了，所以咱们人类说明书正式启动。</p><h2>三 问自己与答众生</h2><h3>为什么节目叫问道</h3><p>第二个事情，就要跟大家说，既然叫人类说明书，为什么节目叫《问道》？因为我们做的事，最终的结果是人类说明书，但是咱们的形式叫问道。</p><p>我记得曾经看了一本小说，有个主人公叫王林，《仙逆》，王林。有一集他在梦中轮回，所以做了一个天地大儒，心向往之。</p><p>人家讲学十年，问道十年。我就打算，虽然水平上赶不上人家，但是时间上一定要超过他。我打算问道三十年，这就是给自己规定的一个东西，是个小目标。</p><p>实际的东西是什么？两个事情：一个叫问自己，另外一个叫答众生。</p><p>问自己是什么？我自己也是一样，修行也是一样，带着人生的困惑去追问真相、规则和方向。自己学会问自己为什么。</p><p>答众生是什么？回答众生的问题，解众生之惑，同时也是圆满自己的一个过程。因为所有的问题、所有的思想，最终叫因果碰撞、思维碰撞。你没有那么多碰撞，想不出来这些事。</p><p>所以看似你在帮助众生，解答众生的问题，实际上众生也在成就你。我最终想达到智慧的圆满，但是天地之间还有你回答不出来的问题，怎么能说自己的智慧圆满了？</p><p>我既然想修十级智慧，现在才八级，这玩意就跟焊一样，老不动了，挺郁闷。但是后来想想也是，天地间有这么多你解决不了的问题，凭什么说智慧圆满？慢慢解决吧，解决得足够多的时候，可能智慧就上升了。</p><h3>从怎么办到追问真相</h3><p>好，咱们再回到问自己。问自己这件事情非常重要。问道中，在人痛苦、迷茫、困惑的时候，不再只问怎么办，而是开始询问：我为什么会走到今天？这件事情背后的真相是什么？我哪里看错了？哪里想错了？我应该按照什么规则重新去活？</p><p>你一定要渴望知道真相和一切答案，而不是活在自己的梦境中。这是一种思维习惯。</p><p>我希望培养出大量敢于提问、敢于质疑、敢于追求真相，也敢于打破现有规则的破法者。这个就是破梦的必要条件。</p><h2>四 从办公室矛盾追问问题本质</h2><h3>为什么企业总会发生这些问题</h3><p>举一个最近的事情，你要学会问自己，我正好举个例子。最近我们办公室有一些小问题，发生了跟大家所有办公室都会发生的一些问题。比如员工之间互相有点小矛盾，信息有点不太流畅，说话不太注意。</p><p>最后产生的情况是什么？第一，产生了误会；第二，让领导者决策上出现了问题；第三，有些员工情绪产生波动；第四，甚至有些员工做出了不太正确的决定。这是所有企业一定会发生的事情。</p><p>那你作为老板应该干什么？先问问情况，看看谁有问题，实在不行各打五十大板，然后给个红枣，再给一个棒子，再“葫芦葫芦头”，大家继续过吧。这就是传统企业所干的事情。</p><p>但我们在这里想的是什么？我们绝对不会去想这个事情。你要去想，为什么人类的企业一定会有这样的问题？为什么大家会产生不信任？为什么会产生情绪？</p><p>所以你一定要学会从根上找，从高维上看待这个问题，应该怎么解决？更应该解决的，不是谁对谁错。解决谁对谁错这件事情，是低维应该干的事情。</p><p>就像夫妻吵架，你永远记住，如果从低维上解决问题，这辈子都解决不完世间所有夫妻吵架的事情。他会有各种各样的吵架方式，随着时代变化，有各种各样的理由、各种各样的对错，你永远解决不了。所以最重要的是从高维解决问题。</p><h3>信息透明与验证事实</h3><p>我们第一个说的是，只要办公室出现这种东西，第一件事情叫信息不透明。也就是说，事情的真相和本质你并不知道，只是看到片面。</p><p>第二件事情，你会发现一个问题，没人去验证。比如谁说谁不好，谁做了一个什么东西，我们大概率不会验证这件事情是否真的发生。但是没有去验证，你会发现什么问题？未必是真实的。就是哪怕这个事情是真实的——大家因为什么原因产生这个事情，每个人的解释是不一样的，你要从更全面的角度上去弄。但最重要的一点，学会验证。</p><p>因为在天界以上，很难出现这个问题，只有低层天界才会出现。低层天界还会有一点点人间的影子，在高维天界的时候，叫一切皆可查。一起心动念，这个事怎么回事，甚至我都不用知道怎么回事，只是凭一个感觉，就知道谁对谁错。</p><p>所以叫一切无所遁形。你可以参考三体人，三体人为什么能发展得比人类更厉害？就是因为不会产生管理上的内耗，不可能有人说谎，不可能有人隐瞒事实，不可能有人能够篡改一些东西。</p><p>所以人类世界，如果在企业上，你不解决大家信息透明的问题，或者在一个企业中大家敢于说话的事情，请记住，你的企业无论做得多大，最终解决不了内耗的问题。</p><p>最后所有员工，只是在大家发展的时候，我忍了。就像以前我在的公司，马上就上市了，二〇〇六年的时候，有些销售人员拿期权就可以拿将近一千万。你别说别人冤枉你，天天管人叫爷爷都愿意，所以都忍了。</p><p>但是一旦上市了，大家拿的期权都分完了，那就不忍了。有冤报冤，有仇报仇，都是这种样子。</p><h3>真的去看见别人的优点与付出</h3><p>后来我也在想另外一件事情，一个是信息透明，一个是愿意验证，但第二个事情是什么？你真的爱众生吗？</p><p>你会发现，在下意识的时候，别人说有问题、挑别人毛病这件事情，我们天生就会。但是找别人的可爱之处、值得称赞的东西，天生不会。</p><p>都说修大爱、修慈悲，你有过真正去找别人的优点吗？哪怕有没有多看看别人怎么付出的？你想有一些东西，哪怕他做错了，他在这个事情上付出了多少？加班很晚，自己可能垫钱去弄一些东西。</p><p>我们一直说修佛，修佛其实最终的两个事情，大爱和不恨。</p><p>你真的爱众生吗？你不爱他。因为你最习惯的，是别人出问题的时候，第一时间怪他，这个人怎么样。</p><p>第二，我们在指责别人的时候，总能找出很多东西，但请问你有没有看过别人的优点？应该很少看吧。记住，当你没有这种东西，看不到别人的优点，看不到别人曾经为你的付出的时候——你怎么可能爱他？你不爱他，就不会容忍他，怎么会愿意包容另一个人的错误？你觉得更多的是他耽误了你。</p><p>所以你没有爱，就不可能产生包容，就会产生恨。你不会做到不恨不怨，愿意让众生在错误中成长。整个企业的所有人，并没有产生这种东西。如果产生了，更多的会是员工之间互相包容。</p><p>但是我们下意识地，也就是说整个人间界都会下意识地干的这些事情，都是怀疑、指责、甩锅和不信任。</p><p>最后一定会变成所有员工之间越来越出问题。你记住，你不用去努力。努力去安抚好一些员工，你只能安抚好少数，不可能安抚好多数。你只能对有缘的员工，多一些时间，跟你关系好。但是当这些事情不解决，你都在消耗你们曾经的缘分。</p><p>包括夫妻之间，如果互相能够看到对方的付出，多去感恩对方，只要对方不是一种二五眼，你记住，夫妻的感情一定会很好，很多事情就不会发生，不会产生指责。这是从本质上解决问题。</p><h3>把佛法用到生活的一点一滴</h3><p>所以，如果我的公司不想经历普通人类公司所经历的这些东西，要从本质上改变。同时也让我更加坚定的，就是佛法生活化，真正入红尘。</p><p>我之前讲的那些东西，很多只是理论。你记住，看完这些理论不可能成功，因为你不会把它应用在生活的一点一滴，没有真正把佛法应用在身边。</p><p>就像不恨和大爱这两个事情，你就甭多了，多找、只看对方的优点，包容对方的缺点。把这件事情做到了，才是佛法真正的生活化。做不到这点，学再多也没用。</p><p>所以学会问自己，没人告诉你答案，你得自己通过现象分析本质，超越一个思维去理解问题的关键是什么。只有这样，才能真正解决问题。</p><h2>五 问道与人类说明书的讲述规则</h2><h3>只讲规则与只修规则</h3><p>好，第三个，说咱们整个《问道》和人类说明书，先把自己的小规则订立了。</p><p>第一个，我们只讲规则，不宣传什么神通、法术这些东西。虽然我干这个干了十多年，客户很多，但是我希望让大家用理性的方法看待这些东西。</p><p>你一定明白，世间没有神通，所有神通都是高维生物通过规则在影响我们，只是有些规则你摸不着、看不着。</p><p>就跟你把电话、电脑、电视机拿到原始人那个社会，他理解不了为什么这个东西能出声、能出影。你在用他理解不了的规则改变他，这就是神通。所以没有神通，所有东西都是规则，我们只修规则。</p><p>包括佛、道，实际上也是修规则。只不过佛用佛看到世间的方式方法，总结了一套东西去修行，这叫佛法。道家也看到天地同样的规则，但用他的东西总结了一套方式方法，这叫道家，仅此而已，没有什么区别，所以最后殊途同归。我们也是只修规则。</p><h3>只讲故事与只谈感悟</h3><p>第二个，我们只讲故事，只闲聊，只谈我的感想和感悟，不对这些东西定对错。你也不要找我去证明，我也证明不了。</p><p>你找佛祖去证明因果、业力这些东西，我估计佛祖也给你证明不了。你爱信不信，愿意信就信吧，就是这样。所以咱不是传法，传法这件事责任就大了。咱就是闲聊，你能从闲聊中悟到什么，是你的本事。</p><p>你要是悟不到，就直接当个笑话，当个无聊的单口相声，听了就完了，乐一乐其实也挺好。</p><p>你看，上面既然管我叫悟聊天尊，虽然我对这个法号很有意见，一点也不大气。人家元始天尊、道德天尊、灵宝天尊，我这就悟聊，说得连贯点就变成无聊了：“你净说点无聊的事。”所以很郁闷。</p><p>但是毕竟是领导嘛，领导安排的东西最大，我们支持领导安排，认也得认了。要不让你去守一个鸟不拉屎的地方一千年，我估计更惨。所以悟聊就悟聊吧。</p><h3>不许个人崇拜</h3><p>然后，咱们不许个人崇拜，大家都是同修关系。因为你到佛界也都是同修关系，你去叫佛祖，肯定不管他叫佛祖，只能叫同修。咱们也是一样，都是同修关系。</p><p>这样也让我升高的我慢之心稍微降降。没有师徒，没有师生，都是同修。</p><h3>允许在错误中成长</h3><p>还要允许我在错误中成长。我虽然努力悟了十年，很努力地想把一些东西告诉大家，你说这些东西都一定正确吗？不一定，只能在实践中见真知。</p><p>它在现实中好使了，就是真的；在现实中不好使，那就扯淡，就属于这种样子。</p><p>所以未来我发现哪句话说错了，下一个版本就给改了。你说：“你怎么改了？你否定自己。”我凭啥不能否定自己？我最主要的目的，就是更好地帮助大家，所以否定自己很正常。</p><h3>大道至简并讲清过程</h3><p>还有咱们要求的，叫大道至简，这是最需要保持的一个东西。因为我最反感古人屁话太多，要不就是说不清楚，不说人话。所以我喜欢大道至简，只说人话。而且我最讨厌他们只说结果。</p><p>前几天也是，我这老大观音下来了，我不就问他：“我智慧怎么老是八分？这焊死在上面了，这玩意就不能挪挪位置吗？”老人家给我来了一句：“你不求智慧的时候，就是智慧圆满了。”</p><p>我说，就是因为你们佛界这帮家伙天天说这些东西，才把人间搞乱了。他说得对不对？肯定是对的，因为你不求智慧的时候才是最高智慧，这个没毛病。在佛界，大家也都知道是这样的。但是我们在人间，你不要把结果性的东西告诉我。</p><p>佛教特别喜欢说这个，道教也喜欢。《道德经》里说的很多东西都是结果性的，是圆满的结果性的东西。佛教这块也说什么“即心即佛”“平常即佛”，说得对不对？的确是对的。但是你说的是结果性的东西，而且是圆满结果性的东西。</p><p>圆满结果性的东西会出现什么情况？返璞归真。返璞归真之后，就跟没修炼是一样的。</p><p>我就跟他说，比如拿了一个武林宝典，是不是得先翻翻，先看？看完之后要不懂，得先问问。问完了，都看懂了，就练呗。练个十年八年，熟练了；再练个十年八年，精通了。</p><p>达到精通之后，这时候要做的事是什么？叫忘掉。所以此时无招胜有招，没毛病。最后你问他武功的至高境界是什么，无招胜有招。那咋练？你让小白咋练？是不是先把那本书给我？你不给书，直接说结果，就出现这种事情。</p><p>所以那天我把观音同学数落了一顿，我说祸害人间的就是你们这帮佛界的，老说结果性的东西——不告诉过程，最后弄得所有人都出问题。所以不要说结果性的东西，那是佛界的表示方法。</p><p>咱们要做的是大道至简，但是不至于无。因为一无，就没得可说了，都不要去说了。简可以，但是不能无，说大白话，保证大家都能听明白。</p><p>我得把那本书给你，还得带着你咋练。练得差不多的时候，最后跟你说：“你可以无招胜有招了，您就无去吧。”这个是可以的。</p><h3>讲清意义用法与代价</h3><p>最后要讲的规则是什么？所有东西必须讲清意义。这个东西拿过来干什么用？解决什么问题？用法是什么？适用场景是什么？</p><p>任何东西使用都会有代价，你要付出什么样的代价？什么人能学？什么人不能学？都得跟人说清楚。</p><p>好，这是咱们的规则。希望通过这些规则，还这个世界一个清清白白的世界、明明白白的修行方法。</p><p>给大家一个完整版的说明书，希望大家努力修炼，希望有一天修炼完之后，学会无招胜有招。</p><h2>六 时代背景与强者</h2><h3>这段时间开始讲述的时机</h3><p>为什么咱们这些东西现在才出来，为什么这段时间才讲？好时机。首先有三个时机，非常好，我说传法好，但是对大家可不见得舒服。</p><p>第一个，末法时代，哈哈，末法时代出乱象。首先叫魔作沙门，内部败坏，大家已经看到了，寺庙里抓起来的人已经不少了。然后叫僧俗颠倒，白衣说法。咱们白衣，不过今天穿的是黑衣，下次穿一个白衣。</p><p>然后叫五浊恶世，邪见炽盛，乱七八糟的什么都能说。然后叫道德崩坏，人伦失序，咱们就不做解释了，都明白。然后叫女人精进，功德积累，男人懈怠轻法，视沙门如粪土。</p><p>你看佛祖老先生，人家在两千五百年前已经说了。所以为什么咱们这叫“群阴慑服，百灵来朝”，就是这种样子，跟群阳没关系。所以最后改变世界靠女人了，男的已经解决不了问题。部分男的可能还有点希望，绝大多数男的咱们放弃吧。</p><p>天灾人祸，环境恶化，这都是末法时代的情况。咱们在人间还要经历的，叫经济大萧条。大家请参考一九二九年的全球性经济大萧条，倒牛奶那个就是一九二九年的时候发生的。</p><p>大家可以看看，十年经济大萧条。但是我们要经历多少年？二十年，哈哈哈。</p><p>时代进步了，总要多增加点年头。是否已经经历了几年？可能刚经历一两年，所以残酷的时间还在后面。未来会有更多家庭出现问题，更多人活不起，活得极其艰难，这个没有办法。同时科技在进步的时候，也在淘汰人。所以人类如果不能活出个一二三，恐怕会活得越来越艰难。</p><p>再加上九紫离火运，这好像是好运，但是一般的九紫离火运都不是特别好，哈哈。因为逢九的运代表一个时代的结束，一个运二十年，从一运走到九运，正好一百八十年。这种循环经历过很多次，你们可以看一下历史上的逢九的运，好像都不太好。</p><p>为什么？主要是时代的变革，这个时代要结束了。你还坚持用这个时代的东西，只能被淘汰。你不进行人为的淘汰——人类怎么进步？大家经历过很多，比如马车时代，汽车淘汰马车，电力时代、蒸汽机时代、内燃机时代。</p><p>还有很多人经历过的，比如像我这个岁数，七十年代人都经历过的计算机时代，九十年代的计算机时代。那个时候我在中关村卖电脑，很挣钱，能有计算机的很少。</p><h3>时代变更越来越快</h3><p>大家又经历了互联网时代，现在又经历人工智能时代，都一直在淘汰，而且时代越来越近。以前一个时代怎么着也得几十年，现在可能五年、十年就差不多了。</p><p>大概二〇一五年的时候，我记得马云还在说，我拿着望远镜都找不着竞争对手。现在你看他还敢说这话吗？时代变更太快了。</p><p>时代变更这么快，不好的东西那么多，我们应该怎么办？我们也一样，只要强者。因为大时代不好的时候，弱者活不下来。</p><p>比如特别穷、特别苦的，不是咱们不想度化人家，是你没这本事。你想用木桶原则，他就剩一桶底，一块板都没有，你咋度？这事就交给地藏王菩萨和佛祖度去。人家时间无限，咱们就匆匆几十年，能不能把这些东西讲一遍、讲明白，就算不错了。</p><p>所以很费劲，大时代不好的时候，弱者活不下来，只有强者才能活下来。你看看匈奴，还有很多游牧民族，北欧，还有动画片里什么魔族、兽族，全都是苦寒之地。越是苦寒之地，越要求个体强大、个体强悍，否则根本活不下来。</p><p>包括北极熊那种东西，越是苦寒之地，越能诞生庞大的动物，因为弱小的不行。反而非洲这些，除了特别大的象和狮子、犀牛，也就那几个稍微大点，其他并不是特别大。</p><h3>能适应新规则的人</h3><p>我们要的是什么？什么是强者？很简单，只给强者听。那强者是什么？</p><p>能适应新规则的人，敢于适应新规则，敢于否定旧我的人，我们称之为强者。</p><h3>有缘众生智慧众生与觉醒众生</h3><p>我们同时也要有缘众生、智慧众生和觉醒众生。</p><p>有缘众生是什么？不管你有钱没钱、有学问没学问，过得好与不好，只要听完这个东西之后，觉得对你有帮助，愿意听、愿意学，愿意根据上面的东西改变自己，我们称之为有缘众生。</p><p>就像我们现在很多学生，以前讲的神神鬼鬼的东西，哪个能摸得着、看得着？哪个能证实？但为什么你就信？缘分。</p><p>包括仙总，自己学紫微，当时我教紫微的时候学过来。那自己学吗？压根不学，就是听着那声音，觉得可信，就跑过来。</p><p>我记得好像现在还有一个，是一个大厂的高管，也是听了我的课、听了我的声音。他说分辨一个人，就看这个人说得自信不自信、逻辑合理不合理。刚开始听一两集，觉得这个人太能忽悠。</p><p>再听，好像说得有道理。所以这叫给有缘众生，他通过声音判断，我觉得非常重要。</p><p>第二是智慧众生，说白了脑子得在线。智慧众生是什么？纯粹用理论、逻辑分析你说得对不对。</p><p>所以你看，咱们特别能吸引清华的人，我就纳闷，怎么北大的那么少？哈哈，吸引的都是清华的，难道曾经跟清华很有缘分？有可能。这个叫智慧众生，纯靠人家脑子在线，一说就能明白，没问题。</p><p>第三个叫觉醒众生。在轮回之中，我讲的这些东西并不稀奇，你肯定听过，只是在轮回的时候喝了孟婆汤，忘了。所以我一讲就激发了你，找回了你天魂的记忆，这叫觉醒众生，“一修说醒了”。</p><p>我跟你说，你们评论区里说的有颜众生，这不行，到时候我媳妇会很有意见，不能只度化有颜众生，那就真的出事了。</p><h3>度化的三个阶段</h3><p>好，这同时也是未来咱们度化的三个阶段。我跟你说，人类世界去度化众生，就是三个阶段。</p><p>第一个，就是给有缘、智慧、觉醒这三类众生听。因为不是这三个属性的，根本听不懂、听不下去，也坚持不了。你给他说，他脑子理解不了，就属于这种样子。</p><p>第二阶段，是第一阶段积累了一定的众生之后，这些众生根据你的东西度化成功了，有很多成功案例可以往外放。这个时候，有些人奔着成功案例来：他成功了，我能不能按这个东西解决我的问题？</p><p>所以第二阶段是奔着成功案例来的，也叫学习众生，希望通过你的东西学习。</p><p>第三阶段叫跟风众生，那就三五十年之后了。咱们如果不发展出几百万、上千万信徒，没人跟风。</p><p>你看有些佛教的，就属于进入跟风阶段了，说一念阿弥陀佛，往生极乐。这就不要求你懂不懂，只要信就行。这是三大阶段。</p><h2>七 听众的六个条件</h2><h3>接受真相与接受现实</h3><p>咱们未来的听众，也要求有六个条件，不是没条件。以前那些东西就是图个乐，很多神神鬼鬼的，还有自己经历，你愿意听，啥条件都不给规定。但现在没点水平，还别来。</p><p>这几个条件是什么？第一个，接受真相，接受现实。</p><p>我们不仅讲人间的真相，也会讲到各个位面的真相。所以如果你不能接受真相，就不要听了。你连真相都接受不了，我不去给一个叫不醒的人费劲。</p><p>可能有很多真相不太好听。比如结婚，男女生过三十五岁之后很麻烦。包括女性离婚喜欢带孩子，带孩子和不带孩子的再婚率完全不一样，带男孩和带女孩的再婚率又不一样。所以我不管你爱听不爱听，这是真相。</p><p>知道这个真相之后，你找的时候就找靠谱的，别找能离婚的。你为了自己的很多东西，我喜欢帅的、喜欢有钱的，最后找了一个不靠谱的，离婚了，自己带着孩子，那只能说你活该。</p><p>因为我会告诉你哪些东西会怎样，包括你不结婚，到多少岁的时候，那个孤独感解决不了。你能接受就接受，不能接受就拉倒，我才不会哄你，你就等着物竞天择吧。</p><p>所以为什么咱们故事会叫闲聊？为什么人类说明书是在末法时代、九紫离火运和经济大萧条的时候出来？你有没有想过？</p><p>当时二〇一八年的时候，我还搓火呢。我说，让我做个阴阳师，能不能让我在盛世的时候做？这快经济大萧条了，让我做阴阳师，挣谁钱去？这不等着饿死吗？后来我发现，你就记住，上天如果想给予你的，一定是你意料不到的——意料不到的好处。所以九紫离火运最重要的，是把大家全都打回原形。怎么打回原形？你天天让人过得很幸福，每个人都觉得自己可……了。那玩意能听你的，能重新理解世界，重新审视自己错了？不扯淡吗？都觉得自己——</p><p>我命由我不由天。你让他先放飞一段时间，由自己一段时间，等吃不上饭的时候，就觉得这还是天定。</p><h3>愿意改变自己并对抗旧我</h3><p>第二件事情，愿意改变自己，修正自己，并且有足够的毅力对抗旧我，很难。</p><p>其实这就是我们说的“平时即命运”。比如我爱吃、爱喝小啤酒、爱吃小烤串，你要控制量。不控制量，就做好以后——脑血栓、对身体不好的情况的准备。因为我们家族已经发生很多事了。</p><p>现在你看我一直带着这个东西。现在找到窍门了，血糖一到6，就可以开始加餐了。以前为什么高？你都在吃饭的时候，又想吃米饭，又想吃肉，还想吃水果，还想喝可乐，所有高糖的东西都加在一起。</p><p>那不就高了吗？你可以等它下来的时候，苹果；等它再下来的时候，可乐，哪个也没耽误。但是这叫对抗旧我，因为之前的吃饭方式会产生血糖的极大波动。</p><p>以前没这个东西，也不知道天天血糖有多高。所以我很推荐这个东西，到时候讲真相，我会直接说，它对你了解一个人的血糖、改变饮食习惯极有帮助，特别有帮助。</p><p>以前我二〇〇九年就得糖尿病，开始打胰岛素了，但一直控制不好血糖，就是因为没有实时监控。有实时监控的时候，对这个东西就很清楚。我们家现在好多人、老人都弄上这东西，血糖现在全都很正常。</p><p>这就叫对抗旧我，很难受。光不吃主食、少吃主食这件事情，我直接用了十年去改变，很难受。</p><h3>相信因果轮回与高维生物</h3><p>第三，相信因果，相信轮回，相信这个世界有高维生物。</p><p>咱们前期逆修觉者这块，也不涉及什么神神鬼鬼的东西。但是所有的基础，是你得相信因果，相信轮回，相信世界上有更高维的生物影响我们。我们可能看不到、摸不着，但是你必须得信，不信不行。如果接受不了，那咱们就别看了，下面都别看了。</p><h3>学习规则与应用规则</h3><p>第四，相信一切皆是规则演化，要学习规则，应用规则。</p><h3>理性分析并重构认知</h3><p>第五，要足够理性，分析推导，并且重构自己的认知，这非常重要。用全新的认知替换过去的认知，因为过去的认知有问题，包括整个人类过去的认知，很多东西都有问题。</p><p>比如今天举例的，公司的很多东西，你看所有公司都出现这个问题吧？我跟你说，所有公司都错了。</p><p>很多人类公司之所以没有办法发展壮大，甚至壮大一段时间之后，必然出现员工之间的恶意伤害，叫内部管理的问题，是一定的，百分之百。</p><p>这里谁做得最好？稻盛和夫。因为稻盛和夫是真的爱自己员工，真愿意把这个东西分给员工，这点做得非常到位。</p><h3>完善自我圆满自我与成就众生</h3><p>第六，愿意完善自我，圆满自我，成就众生。</p><h2>八 下集预告与结束</h2><p>今天这集咱们就说完了，下集是三把锁。先说三把锁，很难，很绕脑，叫三把锁是如何把人类锁在梦境中。</p><p>因为实际上我认为你现在一直在睡觉。到时候又会说什么是梦，其实这个东西估计你从来没有仔细研究过。佛教很喜欢把人说成活在梦境中，包括《金刚经》上说梦幻泡影。但梦的原则是什么，如何觉醒，这些东西很重要。</p><p>然后再吐槽一下所有坑害我们的规则和枷锁，人间界是怎么坑害我们、阻碍人类前进的，到时候都会说。</p><p>好，今天咱们就说到这，拜拜。</p><h1>问道二 · 三把锁如何把人类锁在梦境中</h1><h2>一 开场与本期说明</h2><h3>近况与试讲安排</h3><p>大家晚上好。今天晚上的内容一定很烧脑，看不明白没关系，以后慢慢看。就跟佛经、道经似的，一次也看不明白，着什么急？也不影响自己吃喝。所以今天看不完、看不明白，不要着急，淡定，一定要淡定。</p><p>还有，跟大家说一下，以后不要再给我寄东西了。我家又收到了一些东西，也不知道是谁寄的，还是肩颈的，听说是仙总的学生。人家老给我东西，我都没有表达过自己的谢意，这有点不太合适。所以大家以后还是不要寄东西，这样最好。</p><p>第二，我的很多问题，不是你们帮忙买个什么东西就能解决的。不过还好，到现在为止，基本上我身上各种各样的问题都解决了。之前是脑子有问题，咱给脑子开了一个天窗，放放气，这一下就变聪明了。</p><p>第二是血糖有问题，一戴上这东西，严格控制自己的饮食，血糖也正常了。第三个是肩周炎。最近我们家苍蝇都少了很多，以前碰着它，你不敢打，现在恢复了，我发现使劲打的时候，胳膊已经不疼了。现在消灭苍蝇的速度大幅提升，苍蝇已经很难在我们家驻足了。肩周炎也基本上好了，可以正常睡觉了，我觉得非常好。</p><p>最后就是高血压。前几天我发现，是不是该换药了？突然一下子脑子就聪明了，说不行，该换药了，因为之前那药吃了三年了。去大医院换了一下药，真贵，半个月400马币。但这个药好像是德国的药，还不错，有些东西调整了剂量。</p><p>刚吃第一天的时候还挺凑合，这玩意不吃还不长血糖，怎么吃了之后反而血糖更高了？但要耐心给它一点时间，发现吃了第三天之后，整个血糖都正常了，这个还是挺厉害的。所以到现在为止，基本上大病小病都解决了，我觉得非常好。</p><p>今天声音稍微有点变，嗓子发炎了，搞不清楚怎么回事，可能会影响声音。但咱们主要是试讲，能把事说清楚就行。</p><p>你看，就像走运、走大运，我正好是2025年开始走大运。你在走大运的时候，碰着一些倒霉的事先别着急，它有可能是让你提前发现问题。发现问题之后，赶紧把问题解决，你才能够上升。</p><p>到现在为止，关于身体的问题都解决得不错。糖尿病和高血压都快20年了，解决不了的事，现在解决得基本上还挺不错。脑子这个问题其实一直都有，算是我人生里面最大的一个坎。不是说以后脑子不出问题，可能还会出，但是至少没有比这个更大的了。所以记住，你在运上的时候出现点问题，其实是一件好事，它在善意地提醒你，赶紧把它解决。</p><p>好，咱们不耽误大家，正式开始。今天内容非常多，一时半会儿能不能讲完还不知道，我尽可能讲，说不定今天就要讲两个小时，你们慢慢听。</p><p>这是《问道》的第二集，还是那个原则：试讲，就是吐槽版。大家听完之后，有听不明白的、有意见的、有需要吐槽的，直接到那四个群里去吐槽，到时候会有人帮大家收集。我看一下，没什么问题了，再修改，修改完之后去录制咱们正式版的文档。</p><p>这一期本来想周二给大家讲，但是东西实在太绕。我自己琢磨来琢磨去，憋到周三，才给一些写框架的学生试讲了一下。他们也提出了一些意见，所以周四、周五又修改，到今天反正也改不出来了，就是它吧。</p><p>能听懂，咱们就听；听不懂，等以后我的智慧水平更高，录《问道》第二版的时候再修改。这版实在是改不动了，太费劲了。我的原则是随缘，能想明白到什么地步，就想明白到什么地步，坚决不难为自己。你们能听明白就听明白，听不明白，就等下次我又想明白了，你再继续听，别着急，淡定。</p><p>好，咱们正式开始《问道》第二集讨论版。先做上期回顾：上期说了，我们要做人类说明书，这个节目叫《问道》，希望这套内容能够帮助大家认识真相、规则、正确的生活方向。</p><h3>本期讲轮回怎样把人困住</h3><p>这一期要讲什么？既然咱们要写人类说明书，你要知道轮回是怎么坑害你的。知道之后，你就知道怎么用人类说明书去对抗轮回对你的坑害。我们要知道它怎么做，我们怎么防。所以这一集主要说的是，轮回是怎么坑害你的。</p><p>下一集，也就是第三集，咱们再说，你应该怎么用人类说明书去防范这些事。这是咱们这两集的内容。</p><p>轮回坑害你的主要方式，我们称之为入梦。大家一点都不生疏，佛祖在《金刚经》上讲的“梦幻泡影”，这句话大家听过很多次。整个佛教也在说，你处的是一个假的世界。没看佛教，也不影响马斯克这样的人说，我们活在一个虚拟的世界里。这都是说我们在梦中。</p><p>在梦中要有什么特性？想想自己做梦的时候会碰到什么。第一个叫入幻；第二，你做的这些东西肯定不真实，是假的；第三，梦不能只是直接在里面待着，它一定要有一些故事性。哪怕坐花轿、娶媳妇，也是一个故事。</p><p>第四，你在梦中要感觉这是真的。虽然是假的，大家醒了之后都知道，但不妨碍你在梦里的时候，真实感很强。一个梦需要具备这四个条件。</p><p>梦与现实的关系是什么？其实不太好说，你自己去感觉。佛祖也说了，马斯克也说了，但你自己感觉我们的世界是真实的。包括双缝干涉实验、量子纠缠、微观不确定，你会发现很多事情，实际上都证明这个世界足够虚假。但我又不是科学家，我也证明不了什么。</p><p>我只能跟你们说，我相信佛祖老人家说的东西，我们生活在梦幻泡影中。咱们做这个节目不是为了证明这个，不是为了得诺贝尔奖。我也没有那么科学，没那么严谨，我只是个人，咱们本来就是一个闲聊的体系。</p><p>闲聊体系，就是所有东西都是我个人对一些事情的观点。今天讲的，也是我个人对现实中这场轮回大梦怎么坑害我们的一些想法。咱们只是闲聊，你能悟到什么，纯属于缘分。个人观点，闲聊，不是科学，咱也不为拿什么奖，我也不会给你证明什么。</p><p>那么我们来说，梦首先有四个阶段，请大家一定记住：第一个阶段叫迷，第二个是困，把你困住；第三个就是咱们努力的阶段，叫觉；第四个阶段是醒。咱们经常说觉醒，但觉和醒是两个事。古人的话经常是一个字代表一个意思，所以觉和醒是两个事，就是迷、困、觉、醒四个字。</p><h2>二 迷 在错误中不断重复</h2><h3>迷的三个特性</h3><p>首先，什么是迷？这个咱们经常经历。比如迷路，你在错误的道路上走来走去，找不到方向，这叫迷路。如果碰着鬼打墙，是不是也是迷路？鬼打墙最重要的是重复再重复，经常回到原点。走迷宫也是，走着走着，又走回原点了。</p><p>所以被迷的时候有几个东西：第一，找不到方向；第二，做的事情是错误的，你做的事情如果正确，那不就不迷了吗？第三，经常会重复。这是迷的三个特性。</p><p>我们人类很多时候，也是深入泥潭中而不自知。对于轮回大梦来说，它要迷住我们，让我们不停地重复犯错误。我们把这个称之为迷，这一点很重要。</p><p>到现在为止，物质文明已经发展到令人惊叹的地步，可是精神文明基本上原地打转。思维上的问题，我们和几千年前的古人一样：古人碰到什么问题，你还能碰到；古人犯什么错，你还犯什么错。这不仅仅是人性的问题，也是思维惯性的问题。</p><p>所以现在像冯唐给你讲《资治通鉴》，为什么？因为你可以通过古人所做的事情，知道我现在碰到这些事应该怎么办。</p><p>通过研究古人来解决今天的很多问题，核心原理就是：很多问题的本质压根没有变过，古人犯的问题，我们一直在重复。</p><p>当错误不是偶然发生，而是持续重复的时候，人类不是单纯遇到了一个问题，而是被困在某个规则里，在原地打转。这就是我们所说的梦中的迷。</p><p>轮回大梦有三个特性。第一个叫跨代重复。上一代犯过的错误，下一代就算看明白了，该犯还犯。历史可以变化，人物可以变化，时代可以变化，但痛苦的结构没有变化。</p><p>第二个叫形式仍然重复。有些东西只是表面上解决了，实质上换汤不换药。比如炫富，古人在炫富，现代人也在炫富；古人爱美，你也爱美；还有仇富，尤其是同学或者家里的亲戚，谁富了，说“他也有今天”。说闲话，古人说闲话，你也没少说。</p><p>古代说看他起高楼、宴宾客、楼塌了，你看现在的企业家不都一样吗？只是事不一样，性质压根一样。过去男的有点钱喜欢去青楼，现在去KTV、夜总会，本质上没有什么区别，只不过没有“熟人”这么一说了。之前想多找一个老婆，叫娶妾，现在叫找小三。说法不一样，本质一样。</p><h3>婚姻与职场里的重复</h3><p>第三种是明知后果，仍然重复。比如发脾气，谁都知道不好、不对，但是阻止你发脾气了吗？该发的时候不还发吗？这叫本能性的反应。</p><p>下面快点说一些案例。夫妻发生矛盾的时候，双方都在证明自己没错，却没人关心这段关系能不能继续。父母总担心孩子的婚姻，为其把关，希望孩子幸福。</p><p>但我们更多关注的是对方的物质条件是否匹配，却很少关注两个孩子是否能够经营婚姻，以及对抗未来的风险。所以人类的婚姻大多数不幸福，尤其在剧烈变动的今天，婚姻稳定性更差，离婚率更高。父母这份关心并没有真正解决实际问题，整个解决问题的方向都错了。</p><p>夫妻一方发现对方出轨，第一时间一哭二闹三上吊，手撕小三，昭告亲友，本意是想保住婚姻、出口气，但最后反而促成婚姻彻底决裂，自己也遍体鳞伤。古代这么干，现在也一样。</p><p>前几天还有一个女同学跟我诉苦，说老公大男子主义。古代有大男子主义，现在也有。古代好多男的觉得自己老婆笨，现在好多男的也没觉得自己老婆多聪明。</p><p>好多婚姻的问题，是老婆压根不知道生活成本是什么。整个生活运行起来，成本不少，可她忽视这个东西。我们之前讲成本思维，还有增量思维。当有这两个思维的时候，你放心，这个婚姻好不了了，因为这个时候她所有的东西都觉得理所应当。所以很多婚姻出问题，女的觉得“我离开你没有问题”，等真离开时发现不对。她从来没有算过这些。</p><p>现在的婚姻构成里面，男方为此付出了多少？整个生活质量都是谁付出的？付出了多少？她完全不算这个东西，好多女生都是这样。好多婚姻出问题，来自于她越觉得理所应当，越忽略男士在此的付出。</p><p>有的时候，一个男的一个月为家庭付出几万块钱，还不如她随便找一个健身教练，说“你真好，你很自信”，多夸她几句，她觉得这个人很好。真正供养她的，她觉得很一般。古代这样，现在也一样。</p><p>职场也是，公司一出问题就追责，所有人学会的不是避免问题，而是隐藏问题和甩锅。最后没人愿意承担问题，也没人愿意创造，创造越多、揽事越多、问题越多，倒霉的就越多。</p><p>办公室里经常拉帮结派。自己本身很讨厌拉帮结派，但为了保护自己，也得拉帮结派，最后活成了自己讨厌的人。老板害怕培养出能代替自己的人，越不培养，公司越没有人才，最后永远无法发展壮大。</p><p>中年危机，我亲自体验过。我们之前做程序员的时候，所有人都知道自己有中年危机。35岁、40岁、45岁的程序员，你看看公司里有没有这样的人，没有就知道了。所以你也知道，早晚有一天公司要把你辞退，应对的方式就是做两手准备。</p><p>但你会发现，自己每一天都活在痛苦中、等待中，拿不出太多时间真正为自己做两手准备，更多是在等待最后那个时刻出现。HR真正找你的时候，既害怕，也松了一口气，终于落定了。</p><p>这就好比一个死刑犯知道自己活不了了，但是不知道哪天枪毙他。最恐怖的不是枪毙的时候，而是等待死亡的时候。一直都是这样。</p><p>一个人为了获得权力参与斗争，获得权力后又害怕失去，只能进入更大的权力斗争，官场基本如此。你看像我们伟大祖国，还有一些其他地方，都是这样。为什么官场斗争越来越严重？他不能放，一放就完蛋了。</p><p>开会明明有不同意见，也不说，都顺着领导讲场面话。方案出了问题，又开始互相甩锅。</p><h3>历史为什么还能给今天借鉴</h3><p>下一次开会，还是继续说场面话，没人说真话。财富方面，我就不多说了。类似的事情，我不是发给你们群里了吗？你可以把我给的案例放到AI上。我基本上放到GPT上，你花点钱，别弄那个最简单的版本。</p><p>把这些东西输入进去，只需要说：“帮我找出人类类似的、一直活在错误中且不自知的案例。”你去找，无穷无尽。你看完几百上千个案例之后，真的会觉得人类从来没进步过。</p><p>为什么要学历史？历史能够对你有帮助的本质，是你相信历史会重演。这也同时代表，人类的思维模型没有进步。但凡进步了，历史对你无用，因为这件事情不会再重复。但凡事情的工作原理重复了，就代表人类在这儿没有进步。这是很重要的反推，也就是所谓魔咒。</p><p>我希望大家都去用AI找一下，真的是方方面面，哪里都有，非常恐怖。</p><p>我希望有一天，我们未来碰到的问题，历史对你没有借鉴作用，就代表人类在提升。可能没有真正走出去，走出轮回，但至少提升了，不再用之前的经验解决现在的问题。</p><p>这个就是迷。像魔咒一样，我们一直在错误中反复犯错，有的可能知道，有的可能不自知。这就是世尊所说的梦幻泡影，我们一直活在梦中而不自知，一直重复经历消耗人类的事情。这就是梦的“迷之力量”，力量的力。它用这种力量把你抓住，让你在里面迷失，这是非常重要的点。</p><h2>三 困 看不见边界的牢笼</h2><h3>小困是约束 大困是自由</h3><p>第二个是困。记住，困比迷更厉害，而且是整个轮回把你框在轮回之内的一个非常重要的手段。困分为大困和小困。小困比较简单，称之为约束，但大困是给你自由。</p><p>明显的约束可以让人产生反抗。把你圈在一个地方，你肯定不干；但是我让你哪里都能去，就是出不了地球，你觉得够玩了，觉得自己自由，但实际上一直被锁在地球上。所以大困是自由，小困是约束。</p><p>当你不知道边界在哪里，也不会产生被困的想法，这才是最可怕的。真正难以识破的牢笼，是让你看不到边界，甚至真心相信自己已经获得自由。所以大困靠自由。</p><h3>井蛙的三个阶段</h3><p>我们用一只青蛙来解释，叫井蛙的故事，一共分三个阶段。第一个阶段，井盖盖上了，什么都看不着，一直黑漆漆的。青蛙从出生那一刻就没看到过光，这个时候它最安静。为什么？因为它从来没有看到过不同，连外面有没有另外一个世界都不知道。</p><p>我记得之前有一次洗灵，看到过一个地狱的场景，里面所有众生从来没见过光。如果有一天你到这个地狱去传法，说外面很光明，他都不知道光是什么。这个才最可怕，因为没有这个东西，就没有办法产生意识差，没有追求。你跟他说的东西，他不知道，从来没听说过，这最麻烦。</p><p>第二个阶段，是给你希望，但是你够不着。</p><p>突然有一天，把井盖拿开了，它看到了蓝天白云、白天黑夜，可能还能看到星光、月亮，但信息极其有限。它知道井里是一个世界，井外是一个世界。</p><p>最麻烦的是什么？井壁是垂直的，你想往外爬，对不起，爬不了，很难。知道不知道外面？知道，但是想出去很困难。努力几次之后就放弃了，还是那句话：“臣妾做不到。”这个时候，它会主动放弃，这也是一种困。</p><p>就像很多监狱有铁栅栏，不是看不到外面的天，但是你出不去。你会跟铁栅栏较劲吗？大概率不会，因为知道较劲没用。</p><p>第三个阶段，也是最可怕的。比如在井里修个小斜坡，青蛙脚上有吸盘，它慢慢爬。你给它设置点困难，但又能让它经过努力，慢慢爬出井口。当它爬出井的那一刻，看到了满天繁星、日月轮转，天地如此广阔，世界如此缤纷。</p><p>你想它会怎么想？是不是很开心，觉得自己通过努力终于脱困了？只是它不知道，有一种困，是我在意识上困住你；有一种困，是给予你自由，而且还是通过你自己努力得到的自由。</p><p>比如大家看过的电影，《基督山伯爵》和《肖申克的救赎》。电影时间有限，只能通过历经困难、隐忍算计、慢慢行动，最后有一天终于出去了。</p><p>出去之后，就开始进入复仇和嘚瑟的环节了，因为这是电影。如果我想拍一个100集的电视剧怎么办？前50集，是他在监狱里面难受；后30集，他终于出了监狱；再后20集，他发现出了监狱，还在人家的算计中。这才最有意思。</p><p>当青蛙真正通过自己的努力逃出牢笼，最大的问题，是它认为自己自由了。当它产生一个“我自由了”的心时，才是最大的牢笼。因为它从此连“我是不是不自由”这个想法都不会再有，它认定自己通过努力获得了自由。</p><p>这就是井蛙、大困小困，我们用青蛙这个事情给大家做一个案例。所以困有三个境界。</p><h3>困的三个境界与习以为常</h3><p>第一个，我不让你看到真实，完全不让你看到，把井盖关上。当一个人生活在既有认知里，从未接触系统之外的东西，就不可能对这个系统产生怀疑。你根本不知道梦之外是什么，连醒这件事都不知道，怎么可能醒？记住，第一件事，是不让你看到真实。</p><p>第二个，我让你看到一点点，但永远得不到。你经过努力，最后得不到，自己放弃了。这个也没问题，但是很少用。</p><p>第三个，完成突破，于是相信自己自由了。这种最可怕。尤其把这些合在一起用，就是我们人类最大的问题。</p><p>第一件事，不让你看到真实。第二件事，有一些真实传过来了。你看2500年前，佛祖、老子、基督、真主都一块儿传，有没有把世界之外的真实往下传？传了，但是只给你看了一点点，很难实现。最后你们把它定义成封建迷信，觉得这是忽悠、不实之言，这是你们自己定义的。</p><p>第三件事，向人类开放科技，让人类可以通过科技改变自身的物质生活。人类不是没有看到过真实，曾经看到过一点点，但绝大多数外面的情况完全不知道。又给你开放一点真实、一点科技树，让你觉得可以掌控自己的命运。</p><p>这个时候，人类基本上完全被迷住了，因为你相信自己自由，相信可以改变世界，相信我命由我不由天。这就是把人类困住的三种方式。</p><p>困住你最大的目的，是所有东西都让你觉得习以为常，这是梦境最大的厉害之处。无论自己做梦，还是在人生的轮回大梦中，最重要的一点，是梦会把你识破它的能力拿走，让你相信这个梦境正常、正确，没有异常，一切合情合理。</p><p>它拿走了你识破它的能力，最重要的就是“一切皆正常”，你会有习以为常、本该如此的想法。</p><h2>四 三把锁怎样把人锁住</h2><h3>真相锁 让你看不到系统之外</h3><p>现实中也一样。我们太习惯身边发生的一切，并不觉得自己生活在梦幻泡影中，认为这一切难道不正常吗？当你认为一切皆正常的时候，大概率就活在轮回给你设置的梦境中。</p><p>那么，梦困住你的手段是什么？三把锁：第一把是真相锁，第二把是思维锁，第三把是设定锁。真相锁很简单，我不让你看到真实。真相解决的是输入问题。</p><p>当一个人只能接触系统内的东西，你再聪明，也只能看到系统内的东西。脑子非常好使，最多能做到丰富、深入、替换、总结，但绝对不可能突破这套系统。</p><p>这跟之前讲的熵增一样，具体的我给忘了，那个意思是在一个封闭的系统中，如果没有外力改变，这个系统总会越来越混乱，越来越消耗。你看《三体》里面，第三部叫《死神永生》。</p><p>最后宇宙的结果，就是如果宇宙之外没有力量来帮助，所有星球、所有生命都会进入热寂效应。整个宇宙越来越乱，能量不停地消耗。现在行星、恒星，包括黑洞所干的事情，都叫瞎折腾，除了瞎折腾，什么都没干。</p><p>打破熵增的是什么？系统外的能量。那打破我们死循环的是什么？也是系统外的两个东西：一个是系统外的能量，称之为功德；一个是系统外的认知，称之为智慧。系统内解决不了，因为看不到真相，看不到真相就不可能做出正确选择。</p><p>咱们别拿普通人为例，拿圣人为例。历史上主要的这些圣人，有没有逃出去？第一梯队，同一时期四大圣人：佛陀、老子、上帝、真主。可能上帝那边应该叫耶稣吧，真主那儿应该是穆罕默德。咱不太懂，但反正这四位圣人过来传法，有没有解决人类的问题？解决了一些。</p><p>但大多数人仍然在梦中。有没有人想解脱？想解脱，但认知不足以突破，最终只是做了一个叫解脱的梦。说白了，只是换了一个姿势继续睡。</p><p>当你看不到高维的东西，我们称之为低维无解。CPU再好，你只能做丰富、深入、更替、总结，不可能突破。</p><p>熟知的圣人，比如孔子，有没有探知系统外的东西？没有。孔子成圣，是立规矩、下定义，比如什么是君子，什么是小人。因为那个时候，战国后期——对不起，战国时代，基本上大家都乱了，没有标准，甚至赡养老人都得讨论讨论。</p><p>孔子在这个阶段非常重要，他给大家立了一个标准，人应该怎么活。但这个事情只是立规矩，并没有改变人类的思维模式，只是用现有系统的规矩约束了一下、改进了一下，性质没有改变，该发生的问题还会发生。</p><p>王阳明干的事情叫深入，他真正深入了一下，但他说的所有东西，还是在整个系统范围之内。</p><p>曾国藩干了什么？叫丰富。他很善于总结，也看了很多前人的书，所以有基础进行丰富。他把很多东西归类、整理，然后丰富了一下。但无论怎样，他们所做的事情，只不过是洞察通透、抓本质、归纳总结，除此以外也就这样，仍然活在思维茧房之内。</p><p>小到个人，大到人类，基本上没有突破。比如很多学生，包括我合作的老张，清华、北大的，还有很多伟人，智商明显碾压我，水平比我强很多。但智商高，只解决了CPU好。思考再多，也没有太大的意义，因为只能做丰富、深入、更替、总结，不可能突破，你没有看到系统外的真实。</p><p>AI也一样。我用AI做东西，只让它帮我找资料，比如找那些人类一直在犯错误、却没有任何察觉的事情，它能给你找一堆。搁我自己，我哪里总结得出这么多？所以脑子确实没有AI好使，但AI没有看过系统外的东西。</p><p>你让它总结什么是智慧、空色、因果、慈悲，它一定下不了定义，只能在人类现有认知里面查找，并且在这之上做一点总结归纳和提升。想做出更深刻的东西，做不到，因为没看到过那个东西。</p><p>当我不让你看到世界更真实的东西时，你再聪明没有用。这就是真相锁。再怎么聪明、再怎么研究，也没有用。盖上井盖之后，你怎么可能想到井盖之外是什么？</p><p>比如要想明白贪或者嗔，很难。贪基本上是让你快乐的事情，从来没有人一天打你800个嘴巴，然后你说“我很贪”，这做不到。为什么这么让我快乐的事情会伤害我？因为拉长了看，让你现在快乐的事情，未来会让你付出代价，会让你痛苦，所以贪才不对。</p><p>假设做的事情现在快乐，未来快乐，永久快乐，那为什么不做？只有现在做很快乐，但未来会倒霉，所以我们认为贪不好。</p><p>嗔的原理是什么？我现在愤怒了、发脾气了，可能伤害了对方，或者对方伤害了我。有的时候，我觉得自己是正义的，我用自己认为正义、有道理的方式还击对方。</p><p>但在更久远、更长远的时间里看，就是两个笨蛋互相咬，两条狗互相咬。甭管谁的理由更对一点，本质上没什么区别。嗔就是要解决这个事情。</p><p>你不以轮回的角度看待，就理解不了贪嗔。用人类的思维，站在人类一世的角度，理解不了它为什么伤害你。所以必须站在轮回之外看轮回，才能明白很多。</p><h3>思维锁 看到问题却不再追问</h3><p>第二个叫思维锁，让你看到，但是想不到。思维锁不是让人没有发现矛盾、没有发现问题，而是让人习惯性停在某个位置，不是一有问题就追根问到底，一发现毛病就打破砂锅问到底。</p><p>它让人习惯性不问、不想，下意识不往那个方向想。当我把思维给你锁上时，世间不是没有问题，是你压根不往那个方向想。这才是思维锁最大的问题，它呈现的一个重要东西就是一切皆正常。</p><p>你不觉得这是一件很意外的事。看不见，是信息的边界；不去问，是思维的边界。两者叠加，人既缺少新信息，也失去寻找新信息的动力。这就是我们为什么叫《问道》。</p><p>《问道》最重要的一点，是破思维锁。让你学会问为什么，经常质疑，恢复提问和追问的能力，这对我们很重要。</p><p>举一些简单的例子。比如智慧，你从来不去想：智慧是什么？对我们有什么用？能帮我们干什么？佛教里面讲了那么多空色，学了对我们有什么用？除了知道这个世界是假的，还有什么用？《道德经》说阴阳、说道，我知道有这个东西，它能解决生活中的什么问题？你从来不去想。</p><p>为什么要结婚？为什么要生孩子？为什么要学习？学习重要吗？学历重要吗？</p><h3>设定锁 明知道不对仍然改不了</h3><p>你有去想这些问题吗？不是它没有问题，是你下意识没去想，这才是最大的问题。</p><p>第三把锁叫设定锁。轮回怎么把你困住？就是让你明知道这个东西不对，但仍然改不了。这涉及原罪。原罪叫与生俱来，天生就会，不用学习。人类有一些天生就会自动运行、不需要学习，却会伤害自己和他人的行为、习惯，我们称之为原罪。</p><p>原罪分为三种。第一种叫天生原罪，像情绪、贪婪、嫉妒，五毒四心里面说的这些，基本上都是天生原罪。从来不需要专门学习，但绝对与生俱来。没听说谁不学一下贪、不学一下嗔，就没有贪念、不会生气。知识得学，这东西不用学。</p><p>这叫本能、天生设定。这些东西不仅被设定了，还会影响整个人类。就算知道发脾气不对，你也改不了，这就是原始设定。</p><p>第二种叫文明植入的原罪。不是人出生自带的，每个时代不一样，但每个时代都有一堆人被它影响。比如这个时代，孩子要好好学习。古代有一段，朱熹之后、民国之前，要求女人裹脚，大家都裹。</p><p>你说这对不对？肯定不对，不是残害女性吗？把脚裹得变形，多少人痛苦过来的？责任大了。但那个时候大家觉得对，女人不裹脚嫁不出去，甚至很多女的因为不裹脚而羞耻。你说这是不是很奇怪？这个叫社会原罪。</p><p>包括养老问题，有的社会有养老，有的社会不兴养老，也是社会植入的东西。重男轻女，有的社会重，有的社会不重。还有女生喜欢上嫁、慕强，也都是社会造成的。</p><p>第三种是家庭和环境造成的原罪。一个区域，以及父母的习惯、认知，都会影响你。比如东北的暴脾气，会影响离婚率。离婚率居高不下，全国第一，是东北的。但是东北夫妻遇到的问题，南方不会遇到吗？其实南方也会，只不过大家处理的方式不一样，造成离婚率不一样。</p><p>怎么办？没办法，因为他爷爷奶奶、爸爸妈妈都是这样，从小到大看到的所有人、所有朋友，处理问题都用这种方式。在他的认知里，没有出现过用其他方式处理相应问题的办法，所以只会用这种方法解决，下意识用这种方法。这叫环境产生的原罪。</p><p>好，咱们说了这么多困住你的方式。</p><h2>五 觉 发现原有系统有问题</h2><h3>第一种触发 反差太大</h3><p>下面再说觉，给人类产生希望的觉，马上入场了。觉是什么？其实很简单，发现不对了：“好像我被忽悠了。”觉察、觉醒，都是这个。发现不对，我要从原有系统中脱离出来，发现原有系统的认知、思维、行为有问题，这就是觉。</p><p>觉一共有四种。你自己想想，从睡梦中要醒来，只可能发生四种。</p><p>第一种，反差实在太大了。比如假设做梦娶媳妇，梦到娶范冰冰，虽然反差大，但不痛苦，这是多美妙的梦，为什么要醒？多睡会儿。那如果做梦发现娶了凤姐，觉得太噩梦、太痛苦了，赶紧醒了吧，这叫反差大。</p><p>再比如发现别人长了八个鼻子、九个嘴，明显不对，这也叫反差太大。不好意思，对不起凤姐，咱们只能用她来说。</p><p>但现实中反差大很难，因为你对现有的生活、人类经历的这些东西都习以为常。你觉得，难道人类不需要这样生活吗？你没看到系统之外的真实，就不觉得这个世界奇怪。</p><p>如果经常能看到天界、佛界、鬼界、阿修罗界，看到诸天位面，看完再看人间，你就会想：“我怎么到这儿了？”因为你没看到过人间界之外的东西，所以觉得人间一切皆正常。</p><p>所以很难产生反差。包括之前说的蓝天白云，其实在整个轮回的诸天位面里面，蓝天白云的界面并不多。搁我们经常看外面的，看到这个界面居然是蓝天白云，会多看一会儿。其他的天不是蓝的，不是蓝的多，蓝的少，所以觉得不一样，挺稀奇。</p><p>搁你，你觉得这不是傻子吗？天天看，蓝天白云有什么可看的？所以，没有反差，就很难从这个梦中惊醒。</p><h3>第二种触发 发现逻辑不合理</h3><p>第二件事，叫逻辑上不合理。这是从梦中醒来的一种方式，我们只是说一下。实际上能在梦中觉得这个梦不合理的很少，纵观整个人类，在现实中觉得不合理的也非常少。</p><p>比较熟悉的，龙树菩萨算其中一个。那么多佛教徒里面，能在现实里找到这个世界逻辑上不合理的，好像也就是龙树。他发明了一种叫“哥白尼反转”的梦话方式和思维方式。按照他那一套东西走，最后你会发现，所有东西都不符合逻辑。</p><p>不符合逻辑，就应该是假的，这是他的观点。能做到这种地步，我也做不到，人家确实洞察力、分析能力极高，才能发现。</p><p>对于咱们，也就发现点双缝干涉：光的成像怎么能根据观测和不观测，产生两种情况？它怎么知道我在观测？不合理，你就觉得这个世界是假的。但很难，所以我们只是在学术上列出这么一个东西，现实中真正能做到的很少。</p><p>最主要的还得有反差。你得知道系统外的世界是什么样子，才会觉得系统内有问题。</p><h3>第三种触发 痛苦超出承受范围</h3><p>第三个叫痛苦，痛苦刺激超出承受范围。比如在梦中，一堆鬼追你，打不过，最后哭了，醒了。我记得喜灵师傅有一次，好像是恶鬼化成恶犬，直接咬他的手臂，连骨头茬都咬出来了。</p><p>在梦里痛得实在受不了，突然醒了。所以能在梦中醒来，绝大多数不是睡到点了，就是痛醒、吓醒的。不刺激、不痛苦，想从梦中醒来挺费劲。假设这个梦一直不可能醒来的情况下，你得有痛苦。</p><p>所以你会发现，人类世界真正愿意追求真理的，叫心不死道不生。你不痛到一定程度，怎么会否认或者重新审视自己的思维、所思所行是否正确？你不会认为自己错误。</p><p>比如天天幸福，每天中个500万彩票，一堆美女或者帅哥追着你，要吃有吃、要喝有喝，要别墅有别墅。</p><p>要游艇有游艇，你会反思这不正常吗？更多是觉得实力所归，老天终于看到我的实力，太好了。你大概率不会反思。能在幸福中反思的都是厉害人，绝大多数人都在痛苦中反思。</p><p>所以每逢人类大灾大难之时，都是人类突破的时候。</p><p>很多科技突破，不是在战争，就是在大灾中。要没有黑死病在欧洲折腾100年，一半人，人类医学肯定突破不了。很多东西也是在战争中突破的，这没办法。所以要想改变，必须给人类痛苦。</p><p>为什么现在我们传法的时候，正好赶上这些？</p><p>末法时代、五浊恶世、经济大萧条、九紫离火运，为什么都是这些？不让大家痛得冒泡，大家想不到我要改变，就是这样。</p><h3>第四种触发 被人点醒</h3><p>第四个触发，是被人点醒。所以找一个好老师很重要。能遇到一个明白人，愿意跟你说点真话，在轮回中非常难。像以前的那些圣人，就很难得。</p><h2>六 醒 让伤害自己的错误不再重复</h2><h3>觉醒需要一个清楚的定义</h3><p>说完迷、困、觉，最后该说醒了。醒这个部分也比较多。首先需要有一个定义，什么是觉醒？你自己去找AI，它一定没有统一标准。整个人类历史在很多东西上，没有具体定义，这很奇怪。</p><p>传统定义说，从沉睡、迷惑、错误或者麻木状态中清醒过来，产生觉悟，这叫觉醒。稍微靠点边的说法是：“觉醒不是我想明白了一个问题，而是导致我痛苦和轮回的根本无明被破除。”这个说得靠谱点，但什么是无明？又没说。</p><p>底下又来一个大明白，说“明心见性就是觉醒”。何为明心？何为见性？明到什么地步，见到什么地步，怎么明？又没说。不仅中国，其他地方也一样，不把事说清楚，这是特别讨厌的一件事。</p><p>所以不看古人了，咱靠自己。先说点玩笑的：“醒来不做梦中事”，就称之为醒，这个定义不好，继续；“让自己和众生一切错误的过去不再重复”，好像靠点边；“让鉴古知今、学史明志再没有意义”，也有点贴边；“一层一层、一个一个消灭人类的顽疾”，这也算是。</p><p>你看，这些是AI总结的，它没有给出具体定义，而是用描述的方式解释。给你的叫描述性的解释，不是定义，经常这样，因为不知道定义是什么。</p><p>我们用说人话的方式，来定义什么是真正的觉醒：</p><p>发现、改正、清除轮回中让自己受伤害的一切认知、想法和行为。你能做到这点，就称之为觉醒。</p><p>每修正一个问题，就是一次觉醒。当你能把所有问题都修正，就是圆满觉醒。就这么简单。有问题，发现一个，咱就改一个、解决一个。有的时候，不仅要从表面解决，还要从根源上挖掘，说白了，一定要断根。</p><p>觉醒的目的，是让问题永远不再出现。如果只解决现在的问题，同样性质的下一次又出现，就叫没断根，只是解决了表面。</p><p>什么是断根？就是永不复现。</p><h3>用定义重新看人类的状态</h3><p>以后再有一帮大聪明跟你说，打坐念经、顿悟就能觉醒，拿个东西“梆”敲一下就觉醒了，你就大嘴巴抽他，就醒了。一个连生活问题都发现不了的人，他觉醒个屁；一个连轮回怎么坑害你都搞不清楚的人，他觉醒个屁，就是这样。</p><p>既然已经有定义，我问你，现在人类是什么状态？说好听点，半觉醒状态；说不好听点，觉醒也就是露个头。这里必须说一个问题，历史上不是没有圣贤把上面的东西带下来，有。我们也不缺少正确的智慧。</p><p>但2000年内，如果用刚才对觉醒的定义重新看人类，该犯什么问题还犯什么问题，你怎么叫觉醒了？还困在人类大梦、轮回大梦中。有了定义，再重新看人类状态，你就知道了，这叫觉醒吗？说好听点，10%吧，说得更夸张一点，半觉醒。</p><p>为什么有圣贤来人间，还是做不到人类全面觉醒？有几个断点，大家听一下。</p><h2>七 从圣贤智慧到现实应用的五个断点</h2><h3>第一个断点 用不了的智慧</h3><p>第一个断点，叫用不了的智慧。就上次讲的故事，那次我在研究智慧，观音下来了，我就问：“你看我智慧这么多年，怎么就在八这个坎上不去了呢？我到底缺哪儿？圆满智慧到底是什么？”观音老人家来了一句：“等你不研究智慧的时候，你就是圆满智慧了。”</p><p>这说得似乎很有道理，但仔细想想，我不研究智慧就圆满智慧，难道不研究就能进步了吗？这不扯淡吗？记住，你们可不能跟观音这么说，关系不到，我就可以这么说。</p><p>所以我直接薅着他说：“整个人间界，就是被你们这帮佛界的人给祸害了。”因为你们说的是“圆满的结论性的智慧”，我给它起这个名字。说得对不对？是对的，但在人间没办法用。</p><p>就跟学武功似的，给一本武功秘籍，正常情况下先学习、研究，然后得练。练个十年八年，熟悉、精通了，咱们开始忘记。这个时候有人问，学武功的至高境界是什么？就是无招胜有招，确实没毛病。</p><p>但不能跟人家刚开始的时候就说无招胜有招，你得先说怎么学的，过程怎么经历的。最后的状态的确是无招胜有招，但不能把它作为大家指导性的结论。</p><p>我跟你说，四大宗教下来的所有圣人，都是一个鸟样。为什么我能说这句话？因为见过圣人之外传法的方式。比如兜率陀天大法会上说的东西，就不是这样的。</p><p>上帝那边、耶稣那边、真主那边怎么传，我不太清楚，肯定不是大号下来，这个我敢肯定。佛教也好，道教也好，肯定是小号下来。道教的小号咱不好说，但佛界的是佛祖的一个小号，而且这个小号一定在人间传法没经验。</p><p>为什么说没经验？因为他传的是佛界佛法，很多东西是圆满的结果性智慧和指导。说得对，但在人间很多东西用不上。包括让你吃素、远离红尘、持戒，这些都是标准的佛界修行方法，记住，标准的佛界修行方法。</p><p>因为佛界那边很多众生本来不吃饭，很多一天只吃一顿饭没有问题，所以过午不食，真正的佛祖当年是过午不食。佛界很多众生没有什么人性，这不是说他坏，而是没有人类思维。</p><p>所以对很多人类的东西，他不习惯，也觉得很脏，最重要的是避开。你看整个佛教传的是尽可能远离红尘，别跟他们产生关系。这是标准的佛界佛法。</p><p>他自己明白这个东西的时候，你问观音智慧，他就这么说；问佛祖，也这么说。</p><p>为什么？因为上面的人都明白。他不认为一个吃饭的行为，还要告诉你怎么拿筷子、怎么夹东西、怎么放嘴里，不就是夹完往嘴里放吗？这个还需要说吗？</p><p>所以很多东西出了问题。什么是智慧、修行、大爱、慈悲、不恨、圆满，很多都没有说到底。</p><p>上来就说你要修慈悲，普通人类怎么可能修慈悲？慈悲是大爱的表现形式，是大爱和不恨在人间的最终表现形式。大爱和不恨没修好，不可能在人间表现出真的慈悲。</p><p>你不可能做到无限包容、无限忍让、无限成就、无限大爱，好像之前还有一个，我给忘了，一共五个。做不到这点，最多是一个好心人、一个善人，但那个不叫慈悲，不要去侮辱慈悲。</p><p>大爱从哪里来？从感恩来。大爱的来源有两种。</p><p>一个是通过感恩生出大爱，一个是女娲的慈母法则。但慈母法则很难修，因为众生不是你生出来的。女娲对众生的爱叫慈母之爱，不是说修不了，是很难修。</p><p>普通众生应该更多修的是感恩大爱，像我一样，这个比较简单。但感恩大爱要先修什么？先修成本法则、代价法则。你根本不知道众生为你付出了什么，凭什么感恩？这是一套逻辑，谁跟你讲了？肯定没人跟你说。</p><p>上来一帮傻子就说修慈悲，你不可能修出道果，认为的慈悲一定是假慈悲，经不住时间和事情的撞击。</p><p>包括智慧、修行、大爱、慈悲、不恨、圆满、空色，把这些放到AI里，最多看到描述性的解释。不能说是定义。尤其智慧，你去问什么是智慧，学了对我有什么帮助，更多是说“学了能更好”，这解决什么问题？这是描述性的解释，不是定义。</p><p>整个佛教、道教也好，我估计真主、上帝那边也好不到哪儿去。</p><p>这四个圣人是真把东西传了，但是传的人太高了，所以传的时候都是这个问题。</p><p>我们用螺丝刀理论来说。所有众生干的事情，是说这个螺丝刀可好了，用什么东西做的。所有经典多是解释、补充说明，很少有人总结，因为说不出来。都在说螺丝刀在哪里采的木头、用的铁，什么天外陨铁做的，可厉害了。</p><p>你问这东西到底有什么用，解决生活中的什么问题？不知道，因为世尊没说。很多佛教、道教经典，包括海外那些圣人的经典，都没告诉你能干什么、怎么使、什么时候使。也就是说，螺丝刀给你了，但忘了说它是拧螺丝的。</p><p>智慧能干什么，能解决人类什么问题？不知道。再去追究很多东西，比如什么是错误、什么是正确，没有人定义。修行最终的东西是什么？不知道，只能说会越来越好，但没有定义，这很奇怪。</p><h3>第二个断点 高高在上的无用智慧</h3><p>第二个，叫高高在上的无用智慧。慧能说“本来无一物，何处惹尘埃”，我不认同。既然空即是色、色即是空，凭什么说本来无一物？想修空，是不是修的色越多，空就越大？色无限，空也无限。怎么能说本来无一物？本来无一物，你下来干什么，闲的？</p><p>当你不知道真相的时候，很多哲学家、名人天天说人生没有意义。但凡动点脑，用脚趾头想想，人生没意义，为什么能活着？你觉得没意义，上天创造这个体系，费了这么大资源，会让你活着没意义吗？你脑子怎么想的？本来无一物，那你算什么东西？</p><p>你光听“应无所住而生其心”，《心经》忘了看吧？空即是色、色即是空怎么解释？空色一体怎么解释？还有一帮人没事修无无，比如把空给空掉，很多人不明白这是什么。</p><p>这是污染法则，用污染法则就说明白了，结果一堆人说不清楚。还有说继续修无无无的，那东西到底有没有？反正我这么熟佛界，都不敢确定它存在。</p><p>这就像数学。现在数学不是科学，为什么？因为很多东西无法验证，逻辑上成立，但现实中找不出来，这就是数学。</p><p>无无这个东西，理论上应该成立，但佛界有没有真的找到无无？不好说。你这属于小学生研究量子力学。研究成或者研究不成，跟逃出人间界有个屁关系？</p><p>先别想着去佛界，也别先研究无无，是不是先想咱们升上一级，去天界混混？很多东西，属于智力上的互相比拼，觉得不说出这个话就压不住他，都是这么来的。你别跟着学，很多东西到现在佛界都不一定有定论。</p><p>几千年来古人都没想明白的事，你也不用去想，不要觉得自己能想明白。几千年没想明白，也没对你产生帮助，大概率未来也不会产生帮助。多一个不多，少一个不少。把能对自己产生帮助的，先让它产生帮助。去到天界后，说不定就能发现对自己有帮助的了。</p><p>不影响去天界、不影响升一级的，能少研究就少研究。人生匆匆几十年，非要研究连佛界都搞不清楚的东西，你闲的？</p><p>怎么判断这个东西世间无用？找圈内真正明白的人，他一听就明白。像社会经验强的人，你一张嘴，我就知道什么水平；往这一站，就知道大概人品怎么样。为什么？没有为什么，我看一眼就知道，因为我懂。</p><p>比如西方说很多天使没有性别，一听就知道是色界天，因为色界天不能有性别。至少他们主神的控制范围在色界天。</p><p>有个《超体》，那女的最后说“我无处不在”。能说出这句话，就代表他们主神所在空间至少到了无色界天。无色界天没有肉身，都是以思维或能量的形式存在，当然我无处不在。所以只要说出这句话，我就知道他们主神肯定在无色界天，不然说不出来。</p><p>再比如，一帮人在人间求寿、求长生，一听就知道不是从上面来的，要不就是从上面来了之后没开脑袋、没开智。但凡从上面来做任务，你想想。</p><p>你可能在人间求长寿吗？更多是想，完事拍屁股赶紧回去，这是又脏乱差的地方。你是大城市的，好不容易跑到城中村做检查，怎么，还打算常驻城中村？在人间一求寿，我就知道什么水平，肯定不能跟上面沟通。但凡恢复上面的记忆，绝对说不出这四个字。</p><p>第二，人间修仙，修它干什么？你不是五魂状态，是三魂状态，神通法力、能量都不在身上，那不就是在沙漠里练游泳吗？真想修，回去修，功法、能量、法器到处都是，非跑这么一个旮旯角、穷了吧唧的地方学，你脑子进水。</p><p>第三，希望通过翻古籍找到答案的，我跟你说，水平一定很差。不能说很差，给你点面子，我只能说永远做不到顶尖。所有顶尖，没有一个是翻古籍的。古籍会不会看？偶尔会看看。</p><p>比如我这行，基本看完《金刚经》《心经》《地藏经》，还读过《楞严咒》《十善业道经》，偶尔每年念一次《月光菩萨陀罗尼咒》，《药师经》也读过，其他经一律不看。真明白的人，这些经文足够让你明白所有东西。不是那块料，不通透、不能连接上面，看再多也没用。</p><p>还有人说要向上修、成仙成佛，一听就是初级阶段，小伙子慢慢修。还想从底下往上修、位列仙班，因为还需要增加能量往上走。但我们已经到了通过小号往下走，你还在修上的阶段，真正的大佬都往下修，开始修圆满。</p><p>还有人想干点什么就去佛界，你当佛界是你家开的？很难的，一听就知道你不了解去佛界的难度。</p><h3>第三个断点 不知道如何做</h3><p>第三个断点，是不知道如何做。很多话没有大白话。我觉得也可能是上面传的时候，他觉得已经说完了，没有办法站在人类角度理解，这些话人类做不到。</p><p>比如无上正等正觉，“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提”，这是《金刚经》上的原话。那我请问，在人间应该怎么做？不知道。</p><p>说白了特别简单，什么都别想，把行善当成本能、习惯，当成连想都不用想的事情，这就叫无上正等正觉。不要问为什么，我就想做这事。</p><p>《金刚经》说“庄严国土，即非庄严，是名庄严”，两个事。一个是污染法则，只要有庄严佛土的想法，就一定被污染了，就不是庄严佛土。只要有想脱离生死的想法，记住，永远脱离不了生死。</p><p>第二件事是混沌。你修的是混沌，混沌不能有显相，有显相就不是混沌。所以世尊说，在燃灯佛祖那里无所得；有所得就是显相，只要有显相，就不是混沌，不是混沌法则。</p><p>说白了就这两个事，说清楚就完了，非得用那种方式表达，结果一堆人看完还是搞不清。包括功德，用很多方式表达，说白了，一个是无相功德、无量功德，一个是法布施，无量功德；一个是具体做善事，是有量功德，就这么简单。</p><p>慈悲、不恨、大爱、平等都一样，全没说清楚具体应该怎么弄，很遗憾。</p><h3>第四个断点 修行体系没有落到解脱枷锁</h3><p>第四点，也是整个文明最奇怪的一件事，我觉得可能就是时机不到。</p><p>四位非常伟大的圣人，把很多高维知识传到人间时，人间其实有非常大的觉醒机会。但是不知道怎么回事，结果传歪了。</p><p>比如说阴阳，大家都知道，那阳的部分是什么，阴的部分是什么，你倒说清楚。阴的部分绝对不是阴间。阳是摸得着、看得着的显化的东西，阴是摸不着、看不着的东西。世界由两部分组成，你倒告诉我，这摸不着、看不着的是什么？包括摸得着、看得着的，哪些重要，哪些不重要？没说。</p><p>空色也是这样，叫显相和混沌，你大概说一下，无也一样。</p><p>冰山法则最重要的，是从阴向阳、从无向有之间的转化。转化率是什么？说的是冰山法则，结果没说。连老子都说“万物生于阳，而阳生于阴”，很清楚的一套逻辑，但生多少，没说。既然已经说到阴阳，怎么不说法界成相？也没说，很奇怪。</p><p>好，这些都可以不说。你来人间，说上面有上面的位面，下面有下面的位面，上面有神有佛，下面有人、畜生、鬼，这些都说了。那么影响人间、影响人类成长的，都有哪些指标，怎么不说？</p><p>无论修佛、修道，还是修上帝、真主，问他：“在人间，我把哪些指标修了，就能确保轮回等级往上走？”没跟你说。有的可能说一点，比如修功德。那人间还有什么？这些东西没有归类总结。就觉得很奇怪，你们跑这一趟干什么来了？</p><p>包括高维世界观也没往下传。得出的智慧、五毒四心、生死这些，不都是站在高维之上才能看到的吗？那是人间能看到的吗？既然不是，为什么不说高维世界观？也没说。</p><p>最后整个宗教体系变成什么？以佛教为例，拜神、拜佛、读经、打坐、持戒、布施、练功，这叫修行。再多加一个，做好人、做善事。</p><p>道教也是，拜神，练法术、算卦，山医命相卜，念经、打坐、持戒、布施、练功，做点好事。伊斯兰教咱不知道，但信上帝的，也是做好事、不伤害、感恩。</p><p>整个修行体系完全变成这一套，跟人类解脱枷锁一点关系没有，具体思想上哪里有问题，完全没说，这就很奇怪。</p><h3>第五个断点 星星之火没有燎原</h3><p>第五个断点，叫星星之火没有燎原。在几千年的历史中，除了这四个圣人，有没有更厉害的人？其实有。比如王阳明、弘一法师，总结的一些金句非常厉害。但一生中也就几个金句。</p><p>你用AI总结这些先贤的东西，一生核心观点大概五条左右就算高人，能到十条的快成半圣，超过十条、三十条以内的，基本可以入圣，也就这水平。</p><p>不是说没给人类带来希望，带来了，但是点状的，没有成片。有没有星星之火？有，但可惜，要把人类命运改变，想都别想。所以叫星星之火没有燎原。</p><h2>八 学习与练习 走向全觉醒</h2><h3>自悟自修与跟着老师学习</h3><p>咱们要做什么？要进入全觉醒状态。全觉醒，两种方式。一个是自己觉醒，自己发现问题、解决问题。但凡你是那块料，我今天就不在这儿讲了。可能不可能？可能，但今生能达到这种状态，可能性不大。</p><p>第二个，跟着老师学习。智慧、传法、觉醒，都是两条路。一个是自悟自修，整个轮回里面也不多，这个不要去想。</p><p>就像从小学到高中，可能要学两万到四万个知识点，哪个是自己发明创造的？哪个也不是吧？耽误你变成一个非常优秀的人了吗？一点没耽误。虽然不是咱发明的，但不是不能学。</p><p>觉醒、智慧这些事情，你自己想不明白，耽误你变成有智慧的人、觉醒的人吗？压根不耽误。只要把问题和知识点学会，一样会变成非常厉害的觉醒者。</p><h3>人类说明书要做的事情</h3><p>咱们人类说明书要干什么？第一，为圣贤们打打补丁。咱这辈子成不了圣贤，不代表不能给圣贤打补丁。</p><p>第二，把影响你的所有主要木板，也就是木桶原则里的这些东西，都告诉你，把主要的先修了。</p><p>第三，把影响人间和法界的规则，只要涉及人间界，能告诉你的都告诉你，能说的都说，让你活得清清楚楚、明明白白。</p><p>第四，全面提升大家的真相和思维模型，让大家用更高级、超越人类的智慧去理解人间。</p><p>想看清庐山全貌，就必须在庐山之外，在庐山中不行。想真正在人间活明白，必须有人类之外的智慧、视角，更要有人类之外的思维。</p><p>难不难？不太容易。大家一定要用这一生和整个轮回的时间不停努力。正所谓：“难言菩提众，众生性志无定，习恶者多，纵发善心，须臾即退，为善为恶，逐恶而生。”所以不太容易。</p><p>怎么办？请大家以后跟着明白人学习人类说明书，学好之后好好练习，最后形成习惯。</p><h3>四大部分与课程安排</h3><p>人类说明书的东西非常多，首先就是四大块。第一是逆修觉者，主要解决真相和思维。你们现在听的这部分叫天道思维，首先要给大家灌输轮回之外的思维是什么。</p><p>第二是人道思维，说白了，有些做人做事的方式，你做得不对。第三是人设思维，学会给自己建防护墙。</p><p>然后，人类说明书第二部分是灵魂觉者，解决大家灵魂上的问题。</p><p>第三部分是法界天机，就是之前说的封建迷信那些东西。第四部分是道法自然，融会贯通。</p><p>这四部加在一起，我估计：天道思维现在已经确定76集、77集；人道思维、人设思维加在一起，估计也得200多集，所以加起来二三百集是有的。再加灵魂觉者、法界天机、道法自然，总共五六百集差不多。这还没加真相，再加真相，估计一两千集是有的。</p><h3>把觉醒落实在生活问题的解决上</h3><p>想觉醒容易吗？知道这些，你就知道想活明白没那么容易。还得有人带着咱们走案例。想觉醒、想不被轮回坑，不容易。</p><p>请大家记住，我不希望最后教完这些东西，又成了一堆人类吹嘘、茶余饭后比拼自己智慧高的方式。</p><p>我觉得一定要真正落实在解决人类生活中的问题。我希望看到，通过学习人类说明书，你能真实地解决那些在轮回中一次又一次伤害自己的认知、思维和行为。</p><p>咱不求一世就把所有问题解决，太难了，但要经常积累，叫正向积累。</p><p>碰到一个问题，解决一个问题。就算不能全面解决，至少解决百分之七八十，减少这些问题在生命中对我们的伤害，最终达到圆满状态。我觉得这才是真正的觉醒，带着大家觉醒。</p><p>一个觉醒者，如果发现不了生活中的问题，也解决不了生活中的问题，就不配称之为觉醒。觉醒不太容易，觉醒来自生活问题的解决，是让轮回中的错误不再伤害你，这才最重要。</p><p>好，今天就讲到这儿，讲得有点多，快两个小时。但今天这个很难，能讲明白还挺费劲。希望没有打扰大家，咱们下次再见。之后的我估计就没那么费劲了。好，拜拜。</p><h1>问道三 · 人类说明书框架</h1><h2>一 开场近况与本课安排</h2><h3>身体近况</h3><p>又发烧感冒。上次《问道》第二集的时候，嗓子已经有问题了，结果还是没扛住。我吃了一堆药，该发烧还是发烧，该感冒继续感冒，没招，脑子已经不转了，那怎么办？继续休息。</p><p>你看，要经历很多考验。首先脑子有问题，之后血糖总算弄好了，上了一个东西，还真的挺不错。我现在血糖很好，睡觉的时候都四点多了，这历史上都没发生过，控制得很好。肩周炎现在非常顺快，打苍蝇一点压力都没有。最后是血压，以为所有病都没问题了，但在不出意外的时候又出意外，来了一个重感冒。我已经半年没得感冒了。</p><p>这就是所谓病气50、病气50%，不是这儿出问题，就是那儿出问题。等感冒好了，嗓子还有点痰，但基本算好了，又发现喝凉水、热水都牙疼，这事太奇怪了。我还是很爱护牙齿的，冲牙器、牙刷、牙缝刷都倒腾一遍，再用电动牙刷、漱口水。因为知道牙不好，我得弄。好几年没出事了，血压一下来，牙又出了问题。</p><p>你看，不给你整点事，它不罢休，也搞不清楚怎么回事，这是命苦的人。所以你们修的时候，千万别修出一身病气，只要有病气，不定哪里就给你出点问题，这不好说。</p><p>好，15分了，咱们正式开始。今天应该是《问道》和人类说明书介绍的最后一节课，就不讲新的东西了。有的学生之前听过，比如什么是逆修觉者、每个阶段干什么。为了咱们伟大的人类说明书，在这里再讲一下，看看大家能不能听明白。</p><h3>上期回顾 录制计划与现场交流</h3><p>上一集观点和理念实在太多，而且有点炸。我发现好多人在反复听，就把一些重点拿到这节课，帮大家总结一下。第一，先总结上期；第二，把人类说明书、《问道》和整个章程跟大家说清楚，说完就完事了，所以今天比较简单。</p><p>在这里先替我朋友做个广告。梵音现在又在做半价活动，一直到9月10号，等于阴历七月份完事就结束。据说全新上架了，半年的、一年的、一个月的都有，都是半价。</p><p>没购买的，大家赶紧去购买。我虽然不知道未来会不会有什么意外，但坚决不同意一周只录一期。这样一年才52周，连天道思维都录不完，肯定不行。</p><p>我打算前三集录完之后，自己再重新看一下之前怎么说的。好多学生也写了非常好的提纲和细节，写得真的挺好。正式节目的时候，我还得把大家的图加上。非正式节目，也就是讨论版、碰撞版，没有图，都是讲完之后大家提感觉。所以大家该吐槽的时候，赶紧吐槽。</p><p>正常情况下，怎么也得两到三天一集，不然几百集什么时候才能录完？但老出意外，我也没招。</p><p>正式开始《问道》三。首先总结《问道》二，因为核心内容太多，颠覆性的东西也比较多，我看大家重复看的次数不少。正常情况下，就凭咱们这水平，两千多粉丝。</p><p>今天还有人说，有7100人订阅了。别着急，本年度正常情况下应该不会超过一万。去年测过、看过，好像超不了一万。明年在大陆，还有全球正式开播《问道》，估计先把天道部分播了，明年可能新增一两万粉丝。到2030年，粉丝数能上五万就算不错。</p><p>咱们上的人都是铁粉，没有虚的。不像其他主播，虚的太多，也不消费；咱们基本上还是消费，大头比较厉害。所以别着急，今年正常情况下上不了一万。你们不仅是金粉，是钻石粉。</p><p>好，正常开始。上期有一些概念，我们得重新说一下。</p><h2>二 重说迷困与三把锁</h2><h3>迷与困的定义</h3><p>第一个，什么是迷？你走错了，而且不停重复走错，就叫迷。比如迷路，转来转去，反正找不着正确方向。在轮回中，如果迷了，是一种什么现象？就是在错误中不停重复。</p><p>但谁定义正确还是错误？肯定是天道，不是你。所以你并不觉得自己生命中的很多东西是错误的。这才是迷：你不知道自己做错了，也不知道自己不知道，才会出现这种情况。</p><p>第二个，什么是困？把你限制在一个地方出不来，称之为困。物理上这样，思想上也是把你限制在某些思维、某些认知里面出不来。</p><p>困分小困和大困，小困是约束，大困是自由。之前用井底之蛙说了三种困的级别。第一种，压根不让你看到光，把井盖焊死，一点光不露出来。青蛙从来没看到过光，都不知道有井外这么个事，这是大困。</p><p>第二个是中困，让你看到光，但是你自己没出息，获得不了。试了几次不好使，那就放弃，这是第二种。</p><p>第三种，给你一种找到自由、得到解脱的方式，并且帮助你获得解脱和自由。你以为走出井口，其实只是换一种方式，又把你困在世界中。这是人类现在正在经历的超级大困。</p><p>我把科技树放开，让你看到、得到很多东西，让你看到通过自己的努力，获得物质文明的极大发展，但精神文明始终被我牢牢抓住。精神上的困，最重要的是习以为常。没觉得不一样，没觉得有差距，没觉得痛苦，还觉得一直在往上走。这才是最可怕的地方。</p><h3>真相锁 思维锁与原罪</h3><p>为了困住你，有三把锁，配合上面三种方式。第一个叫真相锁。我不让你看到真相，不让你知道井外存在，你怎么可能想井外之事？我直接不让你知道外面的世界怎样，这是真相锁的作用，对我们的约束非常大。</p><p>这么多伟大的科学家，最后居然得出人生没有意义，那只能说你没有意义，人生有意义的多了。得出这种思维的人，绝大多数没看到过人生之外的世界，所以才能得出人生没有意义。</p><p>第二个叫思维锁，很像第二种情况：让你看到真实，但不让你往真实、正确的方向想。佛祖、菩萨、佛家道家的神，有没有把一些东西传下来？传了。但传完后你使不了，而且都不觉得传下来的东西有问题，从来没怀疑过，下意识脑子就没往那方面想。</p><p>让你看到了，你就是不往那方面想，没招。这叫思维锁，把你的思维方向锁上。</p><p>第三个叫原罪。就算知道做错了，也改变不了。比如减肥，都知道多吃不好，能克服吗？不一定。都知道淫念不对，能克服吗？做不到。都知道发火不对，能克服吗？几乎克服不了。让你知道了也解决不了，这叫原罪。</p><h2>三 修正觉醒与解脱的定义</h2><h3>发现问题是觉醒 不再伤害是解脱</h3><p>我们上次说了觉醒。后来一些学生跟我聊，说你把觉醒和解脱的定义混淆了。我一想，确实这样。觉醒其实只是发现问题，但能不能真的醒，还不好说。所以现在重新更改一下觉醒的定义。</p><p>觉醒，是发现或者确定自己的哪些事情有问题。</p><p>这是非常重要的标准。如果修行半天，连轮回中所做的哪些事情有问题、怎么伤害你，都没搞清楚，修行个屁！你还活在错误中，时刻被伤害，怎么说自己醒了？所以得能够发现、觉察自己哪里有问题。</p><p>解脱，叫不再伤害、永不复现。</p><p>咱们上次说的有点问题。你想，一根绳子，不管捆得紧还是松，都还捆着你。在轮回里，什么是绳子？规则。有一些规则能影响你，让你持续犯错误。你摆脱了吗？肯定没摆脱；摆脱了，怎么还能被规则影响而犯错？比如情绪法则，你摆脱了吗？</p><p>真正的解脱，就是某些对你产生伤害的规则，无法再伤害你。这是解脱。</p><p>成佛需要什么？叫自觉、觉他、觉满。什么叫明心见性？你得清清楚楚知道轮回里的规则，哪些对自己有伤害，哪些没伤害。没伤害并且有益的，持续加强；有伤害的，坚决不能继续。这是真正的觉醒圆满，称为觉满。一般说自觉、觉他、觉满，然后可以成佛。</p><p>但咱们现在要求更严格一些，你必须解脱满了，觉满不行。觉满只是确定有些东西能伤害你，但有没有真正解脱？规则能不能永不复现？不能做到。所以我们认为，成佛的标准，至少得是解脱圆满。</p><p>所有对你产生伤害的规则，都无法再伤害你，我们才认为你真的成佛。佛教有个说法叫大自在身。为什么叫大自在？因为产生负面影响的一切规则、枷锁，都从身上拿下去了，那不就自在了吗？身上还有枷锁，怎么称为大自在？其实很简单。</p><h3>解脱的四个境界</h3><p>解脱加上四个境界。发现有问题，是觉醒；解决问题，是解脱。</p><p>第一个境界是逃避。比如修淫念，看一个大姑娘很喜欢，一产生这个心，知道不对，动了男女桃心。所以跑到深山老林，不见女色。女色对你有没有伤害？没有了。但是解决这个问题了吗？没解决，只是在逃避。</p><p>第二种是对抗。碰了女色，天天想着不净，有个叫不净观，对不起，业务不精。想着这就是一个皮囊，里面包着屎尿粪便，说白了，属于自己恶心自己，这叫对抗。</p><p>白骨观也是对抗，不过是转移概念；不净观属于自己恶心自己。这些都是一种方式，但当你起心动念有这个想法时，也没有达到究竟。</p><p>真正达到究竟，我们称之为免疫。比如身边有没有感冒病毒？仍然有。但吃完感冒药之后，身上产生一种抗体，虽然还能吸引感冒病毒，病毒也继续侵蚀我，却已经不会产生任何影响，这叫免疫。</p><p>一次免疫是圆满吗？肯定不是。必须次次圆满，在任何情况、任何等级下，都要圆满。能达到这种状态，就叫永不退转。好，四个等级。</p><h3>没有解脱时的消耗与熵增</h3><p>很多同学问，如果觉醒不了，或者没按你的方法修行，会怎么样？那叫众生恒定向下，要进入熵增法则。只要不能解脱这些约束，一定进入熵增法则里，基本就叫瞎折腾。</p><p>会不会有钱？会，但整个轮回过程，只是消耗自己的福报。会不会有名气？通过努力也会，但绝大多数叫消耗。使劲修行能不能飞升？可以位列仙班，干得好，说不定能当天帝。但记住，有33层天，再怎么努力，往上涨一两层天问题不大，想涨更多，对不起，只能说瞎折腾。</p><p>就算达到天帝、大罗金仙，只不过往上冲，最终还得往下走。为什么？始终没有解决这个空间对你的规则影响。当你把负面规则影响全部解决，又能得到正向力量时，才能往上走。这很重要，上次没说，这次补充。</p><h2>四 把有用的知识成片并带进生活</h2><h3>缺少定义与应用过程的问题</h3><p>上次还说，古人和圣贤定下的很多东西，没有真正的定义。没告诉你，比如智慧存在是解决什么问题，空色存在是解决什么问题。</p><p>修佛法，最后要实现什么目的？无上正等正觉，平时应该怎么做？没说。这些东西传下来了，但没有定义，没有详细说明，我们认为这对整个人类有阻碍。</p><p>古人的很多知识点，会出现没有意义的情况：学完后意义是什么，不知道；目的是什么，不知道；使用场景、应用条件、成本、代价，包括修行过程，都没说，这是很大的问题。</p><p>最后一帮大聪明在后面猜。猜对了，可能有帮助；猜错了，扯淡，费一辈子努力，最后也修得扯淡。2500年内，虽然得到圣贤一些高端智慧，其实没怎么改变人类。</p><p>这里涉及几个问题。第一，很多知识是我自己起的词，叫圆满的结果性知识。告诉你的东西对不对？对，但没告诉你怎么得到，只说修完是这个状态，怎么修出这个状态，不知道。</p><p>比如无为而无不为，比如“不修智慧的时候就得智慧”，比如佛祖去燃灯佛那里无所得。你都无所得，我们应该怎么样？他说得对，但这种圆满的结果性智慧没办法操作。学武功最后无招胜有招，但之前的状态怎么得到？这就是问题。</p><p>第二，很多东西是描述性的说明，不是真正定义。比如什么是爱情，没有定义，最后翻到的只是“我认为什么是爱情”，在描述爱情的一种状态。问什么是智慧，他说智慧能解决什么问题，列出其中一种状态，这叫描述性的解释，不是定义。</p><p>最后没人知道修佛应该怎样。再加上一些说法，比如把佛祖当柴火烧，文殊菩萨是挑大粪的，说得对不对？是对，只是某一种意思，但没告诉你怎么弄。王阳明说“心外无物”，什么是心，为什么心外无物，又没解释。一帮大聪明只能琢磨，琢磨出一个就说想明白了。</p><p>还有致良知，什么叫良知？不知道。外国史咱没学过，但中国老祖宗的文化，绝大多数没有明确的定义。前几天看到一个大聪明说：“天地不仁，以万物为刍狗，我说的跟你们不一样。”</p><p>其实说出什么都没用。只要不是老子亲自跑过来，告诉你具体什么意思，其他人都是自己琢磨。反正没有具体标准，那说呗。你看到的所有东西，都是大聪明集合。</p><p>第三，叫没有用的误导，就是瞎用功。比如“本来无一物，何处惹尘埃”，前几天好像有个在美国学佛学的，据说他们几十个博士生都用这句话做论文课题，不闲的吗？</p><p>像无无这种东西，佛界都不一定能确定有，学完关你什么事？你能在人间达到无无吗？先琢磨怎么把身边的事修好吧，这就是一帮大聪明干的事。</p><p>古代圣贤有没有把东西传下来？传了，但都是零星、点状的知识。老子说一部分，佛祖说一部分，圣贤又说，最后大家真的明白了吗？还是没明白。这叫星星之火没有燎原。</p><h3>为圣贤打补丁与体系的形成</h3><p>我们要干什么？为圣贤打补丁。成不了圣贤，打打补丁还是可以的。第一，把有用的知识成片；第二，把有用的知识真正生活化。</p><p>我根本不关心谁的理论高、谁的理论低，只关心一个指标：学完以后，在轮回中有没有不再被这些规则伤害。如果学完了，规则该怎么伤害还怎么伤害，那就学了个寂寞。不伤害就是解脱，伤就是没解脱。</p><p>所以一定要建立不一样的思维模式，把轮回里能持续伤害人类的问题，一个一个解决。问题很多，咱一个一个解决，应该怎么做人、怎么做事，都是这样。别跟我说无无、无无无那些高深的东西，我更关心这个事有没有从生命里拿掉。拿掉就OK，没拿掉，扯淡。</p><p>这也算我的一个天赋神通。我那天仔细琢磨，自己经常干的事，就是研究古人的东西，看得一知半解就觉得不对，自己瞎琢磨，琢磨完创造出一套新的东西。</p><p>比如紫微斗数，我那时候叫金刚佛光。全天下紫微斗数分两种，一种是金刚佛光的紫微斗数，一种是其他。其他的基本都是在原有基础上，大师们发现新点，或者有使用心得，基本没例外，但我的东西跟他们完全不太一样。</p><p>以后修行体系也一样。我看完一堆人的体系，发现不太对，不应该这么修。</p><p>但为什么，不知道，就在那里琢磨，过程很痛苦。尤其当年紫占，从迷茫、完全不知道对错里面，一条一条总结正确的东西，很费劲。大量试错，真有上万次错误，才总结出一套体系，修行这边也一样。</p><p>总结了很长时间，正好将近十年，有十万个以上案例，不停看到不同人生。大量试错、大量看，发现真实的东西跟传统不太一样。知识点必须成片，不是突然悟了一两个就有用。古人终其一生，也就悟那几个知识点。</p><p>那几个点不足以真正解脱、往上走，必须成片，包罗万象，涉及各个方面都能解决，这才是有用的知识。所以这就是我的天赋神通，专门喜欢研究，否定传统，再创一个新的。新的好不好使，咱们看疗效。</p><p>我希望有一天，人间的修行体系也是“点亮星空的修行体系和其他”，希望能做到。</p><p>紫占等我七八十岁的时候吧，这么好的运，别浪费在紫占上。对不起紫微星君，这么好的机会、大运，肯定要多为人类做事情。</p><p>等76岁之后走大败运，开始写回忆录，什么决定都别做，天天啃点馒头、喝点茶。走败运别做决定，别乱花钱，离医院近点，方便抢救。其他时间，不是写回忆录，就是吹，或者聊紫微。这是我给自己想的76岁以后的养老生活。哪天一旦Game Over，拜拜，就完事了。</p><h2>五 四大框架与次第修行</h2><h3>跟着老师学习人类说明书</h3><p>修行有两条线，一个是自觉、觉他、觉满，一个是他觉、觉他、觉满。自觉这件事，我觉得你们就算了。包括这么多圣人，能不能把人间坑你们的指标和规则都找出来，还不一定。一辈子也就想明白那点事，你们别再自己觉了，找明白人跟着学就行，叫他觉。</p><p>就像从小学到大学，学了将近两万到四万个知识点，哪个也不是你发明的，耽误成才了吗？压根没耽误。觉醒和修行之路不易，要有老师带着。</p><p>老师带着学什么？以《问道》的形式学人类说明书。框架有四个：逆修觉者、灵魂觉者、法界天机、道法自然。咱这一辈子写出这四本书就行。为什么要有这四部分？没办法，我也是吃了亏才发现，这四部分得给。</p><h3>天道考核与弱化神通</h3><p>第一个是天道考核。一定要站在天道立场，想想为什么成立人间。是让你当大忽悠、当大仙、当神算子吗？想什么呢？天道本身的意义，是考核人间，是培训、提高，所以要奖励这些东西。</p><p>你们认为我们是什么？比如“小数除不尽”的这种人，叫系统漏洞。怎么都会有小数除不尽的这种人。漏洞分大、小，大点的漏洞能使用更多上维空间的东西，就叫有神通。</p><p>但从上古年代往下走，整个世界越来越弱化神通。以前没仔细想，后来才发现，整个天道在弱化神通，但不是说不让你有。所以有很多神佛仙、鬼怪精怪的故事，灵异事件也时不时发生，却让你证明不了。这叫弱化神通。</p><p>为什么一定弱化神通？为什么神佛仙不能直接显现，让大家直接求神拜佛，不就完了吗？就是为了防止这些事情，不要让大家求神拜佛。</p><p>比如天道认为，创立人间界是让你学神通来的，是让你修心性来的。结果这些人没学心性、没学规则，没用正常的智慧思维解决身上的枷锁，最后都变成求神拜佛，哪行？那还要人间界干什么？法界不都能看到神佛仙鬼吗？哪个法界看不着，哪个法界不能使用神通？专门创造一个不能使用神通的地方，是为了让你偷摸使用神通的？所以这件事逐渐开始出现问题。</p><p>比如之前说的南山真人、倪海厦、白龙王，都是非常有神通的人，但为什么都有突发死亡事件，不是那么长寿？有没有想过？我以前还认识一个广西特别厉害的师傅，帮人救人一辈子，真的很厉害。</p><p>但为什么早亡，为什么有五弊三缺？一定要想想。因为你在人间强化神通，让更多人相信，变好不是找自己的问题，而是求神拜佛，用神通术法、风水、算命、符箓解决。这和天道设立人间大相径庭，所以天道惩罚很大。</p><p>不要觉得这些人积德行善了。他们有没有短时间帮助你？有，包括还阴债，都在短时间帮你。但在轮回里，真的从问题上解脱了吗？没有，更多是拿自己的经济和天地做了交易。</p><p>2025年底，我再去弄的时候，一部分认为我们有功德，一部分认为没有功德，还祸乱天下。所以为什么2025年底开始重新做这些事？首先要弱化神通，以修心、修智慧、觉醒和解脱为主。这是我们重新更改的东西，修心很重要。</p><h3>木桶原则与学习次第</h3><p>第四个，木桶原则。大家知道我之前干什么。为什么有的人好使，有的人不好使？因为法界力量只是木桶里的一块木板，其他东西都不行，肯定不好使。</p><p>比如求贵人符，天天欠逼五六地跟贵人说话，贵人能帮你才见了鬼；请小人符，天天还踹人两脚，那人家不是你的小人才怪。所以得把所有木板弄好，最后用法界力量。</p><p>为什么四个地方一起修？前三个必须成为次第。未来一定叫次第修行。首先修认知，知道轮回怎么坑你，把这个先修好，得有一个好的修行状态。</p><p>没有修行好的状态，后面的东西跟你没关系，可以学，但没资格体验。2028年吧，从2028年开始，以后想学法界，想体验灵魂觉者，逆修觉者的考试得合格。想在我这里请符、还阴债、解决风水、算命，逆修觉者和灵魂觉者至少得考试及格，才有资格。不然我不卖，我也不缺这点钱。这是未来的次第学习。</p><p>以前学不学，先直接卖了。有的帮上忙，有的没帮上，有的还建立错误认知，认为只要花钱就能解决。尤其洗灵，把天地怨气、不好的东西洗掉，有的人出去找小姐，回来赶紧洗灵，给我干这个，那肯定助纣为虐。所以以后前面过不去，连洗灵的资格都没有。</p><h2>六 逆修觉者 修真相认知与思维模型</h2><h3>反本能 反惰性 反旧我</h3><p>继续说每个阶段主修什么。逆修觉者解决真相、认知、思维模型的问题：这事应该怎么想、怎么看、怎么行动，这是逆修觉者应该做的。</p><p>逆修觉者不涉及任何神通法术，所以任何国家都可以传播，不涉及神佛仙、封建迷信，就是思维模型：碰到事情应该怎么想，应该具有什么思维。</p><p>哪个地方都可以传播。既然活在梦幻泡影中，一条条枷锁把你捆在梦里，我们就要一个个从你身上拿下来。记住，非常痛苦，就跟很多人减肥一样。</p><p>包括血糖仪，为什么刚开始很痛苦？吃完马上出数值，你知道这个东西吃不了了，就难受。原来那样吃不行，就得改一种吃法，都在跟自己斗争。所以叫反本能、反惰性、反旧我。不把过去的自己杀死，如何获得新生？</p><p>像我糖尿病，如果一直保持高血糖，还想活到七八十岁，想什么呢？能再活两年就不错。所以要做决定，想多活，数值必须稳定、好；不想活，那随便。想活得长，就必须改变之前的吃饭习惯。</p><p>包括改变食欲。我现在只有早上吃主食，其他时间不吃主食，都吃黄瓜、胡萝卜，偶尔啃“四分之一半”的苹果。就这样还降不下180，你想反旧我多难受？但一旦做好，就没问题。</p><p>脖子难受，就拿颈椎器固定。我戴着颈椎器睡觉，是防止睡着后窝着，尤其翻身时窝着睡，自己不知道，又控制不了，那就直接拿颈椎器、牵引器控制住，肯定难受。</p><p>但弄完后，至少这一两周不找按摩也没问题，脖子没事，肌肉不紧张了。这叫反旧我，之前的我会让我死得更快、更难受，必须反掉。</p><p>为什么叫逆修觉者？因为非常艰难。我们对伤害自己的一切太习以为常，把很多认知、思想、行为、感受、下意识反应，都变得习以为常，但就是这些事情在不停伤害我们。</p><p>所以就算明白，也必须做成一个逆修者，“天地一逆修”才行，不容易，等同于逆天改命。改变曾经的习惯、意识、认知、反应，其实就相当于逆天改命，很难。</p><h3>天道思维与人道思维</h3><p>我们用三个思维改变：天道思维、人道思维、人设思维。天道思维的主题，是用人间之外的思维，改变人类的认知、判断和行为。</p><p>古代圣贤有没有弄出来？空色、有无、六道轮回、因果，都说了，但没说透，才导致你不知道什么是智慧、慈悲、大爱、不恨、冤冤相报何时了、贪念。这些绝大多数建立在无数世轮回的角度，看你的行为到底正确还是错误。</p><p>有些东西让我们舒服、快乐，有成就感，甚至短时间帮了别人，为什么还认为错误？比如现在帮人化解阴债，为什么大天道轮回认定你有问题？他被冤亲债主折腾成这样，为什么不能帮？很简单，第一，对他曾经伤害的人不公平。</p><p>第二，他没通过感悟理解到底错在哪里，你不能保证未来不再犯同样错误。所以从无尽轮回角度看，还阴债没有意义，甚至更长时间看是害了一个众生，只不过没办法。</p><p>第二个是人道思维，解决的是用正确的人间做法，解决碰到的问题。我觉得《道德经》里这方面的东西很多。</p><h3>人设思维与信任</h3><p>第三个叫人设思维。我们会下意识给人贴标签，能不能不贴？做不到，那是在改变整个人类设定。既然一定贴标签，就有一个法则，叫他人即世界。</p><p>有本书叫《定位》，20年前我就见过，应该出了几十年，也没见几个人真正读懂并用在生活里。不是知道得少，是知道的东西没固化在行为上。学了定位，就要反向给自己贴标签，帮助别人更好了解你。</p><p>这很重要。颜值、气息、行动、心性，最后产生信任。现在咱们有几千铁粉，为什么是铁粉？很重要的一点就是信任。很多东西我能给你们证明吗？证明不了，尤其很多产品，能证明什么？证明不了，所以这是非常有缘分的事情。</p><p>建立的就是信任。信任没有为什么，就是我信你，所以你说的东西我会做，这非常难得，但信任很难建设。</p><h2>七 灵魂觉者 法界天机与道法自然</h2><h3>灵魂觉者与修行阻力</h3><p>第二个是灵魂觉者。主要解决的第一大事情，叫修行阻力。</p><p>你得把灵魂上的阻力弄没。比如读经读烦了，读出淫念或者谤佛的想法，这叫什么？业力重。自己根本不知道，不愿学习、不愿做事，到底有什么阻力在灵魂上影响自己。</p><p>所以有时候做完一些东西，会松快很多，接受、听懂一些东西，会不一样。这是灵魂觉者要干的事。</p><p>主要解决灵魂、灵力、能量。能量分正负，负能量消除，正能量提升。还有脉轮、前世。为什么涉及前世？有些人有怪异行为，需要解释，知道原来是这种情况，就明白了。</p><p>对于抑郁症、魂悲、魂裂、魂缺、魂碎，他的思想不完整，跟他讲再多逆修觉者的东西，也理解不了，或者做不到。见别人反感，见一些东西害怕，不是讲道理的事，是灵魂上有些负面的东西，想办法拿掉。包括对一些人的恨、执念的爱。</p><p>很奇怪的一些行为，比如同性恋，都是很大的问题，包括恐惧、怯懦、仇恨、抗拒亲密。这些不是劝的事，直接过来，把那东西拿掉，自己就好很多，就这么简单。包括身上有病气，也是很正常的。</p><p>还有业力虫子、思维生命、影魂，都要解决。对灵魂、思维和法界的思维进行修补、清理、补充、增益、引导、陪伴。没有这些，想顺利学正法，不一定接受得了，身体里肯定有东西捣乱。这是灵魂觉者要做的事。</p><h3>法界天机的范围</h3><p>第三个是法界天机。上两个弄完，需要知道法界有什么东西，哪些有影响，哪些有帮助。灵魂觉者和法界天机，都只限海外。</p><p>绝大多数国家允许，只有少部分，比如朝鲜、某些大国，会有不同意见，所以不在那边发展，都在YouTube、Facebook上说这些就完了。</p><p>法界天机，我希望大家清楚知道一个真实的法界。法界无限宽广，但希望你们了解得足够多、足够系统。别最后还像一帮傻子，觉得有钱就多生儿子，靠概率总能生出一个厉害的。历代帝王、有钱人都有这个想法，但没解决。</p><p>有些方式，不用使劲生，只生一个也能解决。生一堆像小猪崽，该不行还是不行，数量不决定质量。两个特别优秀的男女，能不能配出特别天才的种？很多人经历很多次了，高斯、爱因斯坦都没配出来，大概率你也不行。有些全球首富、曾经华人首富也干过，没做出这事。</p><p>所以基因只能决定相貌，连身体素质都不一定能决定，更别说智商、福报，那绝对不可能，别费劲了。</p><p>以后的法界天机会更全面、更细、更系统。神佛仙鬼精怪，天地人三魂、大天魂、大地魂、影魂、识魂，怎么影响你，都会说。</p><p>各个位面，大世界比如六道、六道十界，小世界更多，还有碎片世界、夹缝空间、平行宇宙、思维生命。</p><p>还有影魂，各种法术、符、阵、灵，算事、看事、听事、观事，念头、天劫、降头、蛊虫，都会给大家说一遍。</p><p>还有法界历史演变，比如《山海经》为什么有的准、有的不准，怎么回事？法界历史和趣闻，轮回、本源、生死、因果，包括上面谁负责管，能说的都说，不能说的不行。时间法则，过去、现在、未来，也可以说说。这是老本行，之前讲了一部分，但很零散。</p><h3>道法自然与回归平静</h3><p>道法自然反而简单。能学到最后，最后的事叫回归平静：怎么平静生活、怎么随缘、怎么不恨、怎么大爱，还有咱们说的五爱，都是道法自然的事。</p><p>这些东西估计大概一两千集。但以为学完就能成功？我可以很负责地说，别想。因为人类学习要有次第，所有东西只是知道，并没有形成知识固化，也没转成自己的本能，这非常重要。</p><h2>八 红尘道场 让知识在生活中落地</h2><h3>从知道到固化 应用与本能</h3><p>连跟了我这么久的学生，有些法则在自己生活中犯了，居然没有感悟，很神奇。所以就算法则考试得100分，也没用，必须想办法，第一，法则固化、知识固化。</p><p>第二，转化成本能。人类整个思维也进入第四个阶段。第一阶段，有书就行，谁家有几本书，就会不一样。第二阶段，印刷阶段，书多了，谁读得多，谁占优势。</p><p>第三阶段叫精读，比如逻辑思维、樊登读书会，解决哪些东西有用、哪些没用。但记住，绝大多数东西对你没有用，就算有用，学完也只是知道，没有知识固化，没有形成本能，更没有进入知识应用、生活应用，所以学的东西没用。</p><p>一生学了很多，却解决不了命运问题，就是没有在生活中改变一些东西。</p><p>怎么办？最重要的其实不是讲这些，讲了没什么意义，真正的是红尘道场。主要干什么？知识落地化。我不关心哪个知识更高级、更深奥，只关心能不能在生活里解决问题，能不能让轮回中的一些错误永不发生。</p><p>做不到这点，跟曾经圣贤们做的事几乎没有两样。所以我们最伟大的地方是红尘道场。但现在开不起来，因为知识还没讲完，更别说带着练习了。红尘道场很重要，也是解决所有位面众生问题的一种重要方式。</p><h3>实用并可以放心提问</h3><p>2025年1月之前，这个法则在天地间不存在，1月之后存在了。为什么可以用它帮助自己、解决问题？因为法则有根、有魂，这很重要，叫天道护佑。</p><p>红尘道场解决几个问题。第一个是实用，不实用就没意义。一定在生活中使用天道、人道、人设知识，真正解决问题。家庭关系、婚姻、子女教育、情绪、人际沟通、人生方向、事业、财运、身体健康，都要实实在在落实。</p><p>我们不玩虚的，别管什么佛祖上面还有没有佛祖，跟我们有什么关系？更关心有没有改变生活中的一个恶习，这比有没有某个佛祖重要。用规则和方法，让生活真正顺畅起来。</p><p>第二，红尘道场一定让大家随便问。像我们从苦命人家长大的，从小到大学会听话、努力、忍耐，却没人教怎么判断念头正确还是错误，怎么处理情绪，怎么做决定不踩雷，怎么经营人和人生之间的关系。</p><p>努力一辈子，一直不停应付一个又一个问题，能不能提前知道问题存在？上学不会学习，没人教，父母只会说。工作时人际关系、工作方法、办公室政治，没人说。谈婚论嫁犯很多错误，也没人告诉。</p><p>到现在，很多男生思维理解不了女生，女生理解不了男生，基本是两个物种互相对抗。别说一起解决外部问题，不互撕就不错。所以明明很努力爱众生、爱家人、爱孩子，最后却走进死胡同，努力未必得到好结果。</p><p>哪里错了不知道，就算最后明白，也没时间，不可能重来。我们希望有个地方，大家真正放下防备、戒备，放心提问。这是为什么叫《问道》的一个重要原因。</p><h3>学习应用与善念得到回应的环境</h3><p>第三，给大家学习和应用的环境。任何东西都得先学，再用、练习、熟练。但不是任何环境都行。比如对别人的善解，叫论心不论迹，对家人、真正的修行环境可以，叫爱敬和道敬。你试试对办公室那些人无私，看会不会把你连骨头渣都榨没。</p><p>所以一定有个地方，能产生善念的正反馈，真正应用这些东西，不要在其他地方乱用。因为其他人不一定是人，没有学习之前不一定是人。对非人类使用人类的东西，对自己会有伤害。</p><p>还有很多人想改变命运。我应该50岁走下坡运，不想走，怎么办？拿福报撑。比如生我们家孩子的时候，福报还差点，怎么办？得“戒功德”，而且必须是度化之功，帮助别人的功德还不行。</p><p>不要光在人间努力，说好好学习、努力工作、好好对人就能怎样，没用，因为没有那个功德、福报。需要一个环境，能够产生功德、福报，产生众生善缘，这非常重要。平时连自己都帮不了，还要帮别人，可能性多大？用你的方法，根本没戏。</p><p>所以要有个环境，有一堆方式，真实有效地帮助提升功德福报，这也是红尘道场很重要的一点。</p><h3>因果碰撞 案例与榜样</h3><p>再下一点，叫因果碰撞。想明白一个东西，不是讲明白了就明白，需要具体发生、看到、领悟一些事情。要有因果撞，但具体什么因果能把你撞醒，不知道。</p><p>每条法则、规则、知识，需要多长时间、多少年，发生什么事情，才能真正明悟？没人知道，也许十万年，也许下一秒。所以需要因果碰撞。没有这个，所学就算练得滚瓜烂熟，也不能真正入心、成为本能。</p><p>这需要明悟。其中有一种悟，必须通过因果碰撞才能悟，别人帮不了，我也帮不了。只有某一天碰上，才会从我的东西、学来的东西，变成你自己的东西，融合到生命、轮回里，这没有办法。</p><p>红尘道场需要很多优秀案例、榜样。学完具体怎么在人间应用，具体事情怎么解决，并不知道，所以需要案例和榜样。尤其像小三那个，我们觉得案例和榜样非常厉害，应该让很多人学习，能够解决很多人的家庭问题。</p><h2>九 收入 家庭与修行正循环</h2><h3>知识免费与教学劳动的费用</h3><p>最后，红尘道场需要收入，记住，收入跟我没关系。尤其有些管制严的国家地区，神神鬼鬼、封建迷信的东西说不了，只能说逆修觉者。但逆修觉者可以法布施，可以改变很多人的思维、想法，可以形成产业链。</p><p>我的所有知识不收费。我不认为知识应该收费，很多东西是上天给我的，不能拿着成为自己的敛财工具，所以知识不收费。</p><p>包括现在的“子非”，当年太穷，收了点“紫薇”。但更多是带着你学习，收人工费，这没问题。现在整个人类说明书，所有知识全都不收费，记住，都不收费。以后如果出书，出版社或承包商可能收点费用。</p><p>毕竟有成本。但电子上的东西没有费用，也不设什么乱七八糟的版权，设了没什么用。我也不太相信偷学的能比我讲得更清楚，因为不是你悟的，说再多，也没办法生活化、具体事情具体化，偶尔几个东西还可以。</p><p>我鼓励大家学完，自己出去开班教学生，产生收入。收完钱自己揣兜里，不用给我。</p><p>以前佛教、道教也好，很多传播这些东西是要收费的。看命、改东西，想让别人帮，也要付钱。所以绝大多数人在别处挣钱，在这里改命、获得帮助和提升，一旦提升失败，钱就白花了。</p><p>我更希望，你免费学习我的东西，用它帮助很多众生，别人付给你辛苦费。</p><p>有钱后，可以买法器、还阴债、处理法界的事情，甚至更好地学习。知识既然能改变别人、让别人变好，为什么不能成为挣钱、提高收入的方式？有钱之后，用修行的钱养修行，我觉得这最重要。几乎其他门派、体系做不到，但希望我们未来能做到。</p><h3>让家人成为修行的第一批受益者</h3><p>我不希望再看到学生拿辛辛苦苦挣的钱，找我算事、改事、请符、请法器，觉得这样是在消耗自己。</p><p>第二，有好多女生学完知识，非但没提升家庭质量，还跟老公形成对抗，觉得老公土鳖、笨蛋，自己是修行人，老公不修行，就看不起老公，这绝对不能发生。</p><p>第三，有些女生非常喜欢我们的东西，大半夜不睡觉，发视频、做宣传，在这里非常感谢，但这样不对。不能既花着老公的钱，又看不起老公，老公晚上想搂你睡觉还不同意，还去发我们的东西，不等着老公举报我们，等着什么？</p><p>所以学完这些东西，第一件事，先改变跟家人的关系。</p><p>一定要让老公、父母、孩子，成为你修行的第一批既得利益者。</p><p>花点钱无所谓，至少心里舒坦，人家也认。第二，不仅得到利益，还能产生收入、利益众生、产生福报，那老公管你干什么？第三，有了收入，家庭越来越有钱、越来越和谐，还有余钱购买法器、升级自己。</p><p>最后，希望大家获得一种一生不会被别人否定、不会被时代淘汰的能力。芸芸众生中笨蛋越来越多，不耽误你度化，这辈子到咽气之前都有无量众生等着度化，所以不用担心，这事干不绝，慢慢来。</p><h3>陪伴与共同前行</h3><p>最后，我们需要陪伴。所有众生都太孤独，需要有人陪伴、指导、指出错误，需要有人共同前行，这才最重要，也是红尘道场很重要的一点。</p><p>希望真正实现修行正循环：认知、修行、提升，消灭负面的东西，增加众生善缘、增加财富，实现真正的正循环。</p><p>说完了，再说一下框架。我们要做人类说明书，分四大块：逆修觉者、灵魂觉者、法界天机、道法自然。其中逆修觉者分天道思维、人道思维、人设思维。</p><p>整个讲课方式，以《问道》的方式讲课，希望是问自己、答众生。最后组成红尘道场，理论没问题了，一代一代、一届一届帮助众生解决生活里的问题，形成共同群体，一起对抗末法时代，很不容易。</p><p>今天到这里，下集正式开始讲理论，讲认知思维那套东西，很关键，因为所有东西几乎都出自它。明白这个，就知道为什么这辈子努力也不管用，比我聪明十万倍也不好使，来自于这条法则没弄明白。好，下次再见，拜拜。</p><p>好，撤退。</p><h1>问道四 · 认知模型</h1><h2>一 开场说明与活动安排</h2><p>到点了，咱就不乱唠嗑了，开始，不能耽误大家的时间。首先，咱们还是纯唠嗑、纯闲聊，你不要找我要证明，我证明不了。全都是我自己的一些观点和感悟，信就信，不信就算了，当个乐呵听就完了。</p><p>第二个，咱们把广告做了。8月25号是大势至菩萨的专场。9月2号、9月5号、9月10号都连着，你们该报就报。9月2号是普安菩萨的专场，9月5号是龙树菩萨的专场，9月10号是必报的地藏王菩萨专场，正好是鬼节。咱们已经一起修行很长时间了，每年都经历鬼节和清明。一进入鬼节，就容易出现各种各样的事情，大家一定要小心。</p><p>一定要注意，7月14、7月15、7月16这三天，阴气非常重。赶紧去喝暖胃茶，得提前几天喝，别当天喝，真的不管用了。能带朱砂的赶紧带上朱砂，保护好自己。这三天晚上就别出门了，容易出事。</p><p>还有咱们的福利，净尘茶免费赠送活动，你们自己找助理老师申请。这不是联名做活动嘛，赠送量好像是跟体系内的消费来决定的。之前买过人家大健康产品的，额外还多送。每个客户最多可以领取8包，先安排上，赠完为止。本次所有东西都是免费的，但是你得给运费。</p><p>厂家已经说了，这次净尘茶到2027年3月份到期。把净尘茶放在阴凉的地方，而且一定要干燥，实在不行就放冰箱里，我觉得这个最保险。</p><p>我那天开了一下，喝不完。我在马来西亚，潮又热，待了一个月，没封口，里面布包上就长黄色霉斑了，还有小虫子爬来爬去。因为这个东西是纯天然的，所以肯定有虫子，请大家一定注意。</p><p>正好厂家也卖不出去了，就送大家，能多拿走就多拿走，多申请。也别觉得8包就到头了，到时候也可以多申请。不够了，跟我或者助理说一声，说我们家人多，我就跟人家打声招呼，多拿。我看他好像还挺多，这不蹭白不蹭，谁让他卖不出去？</p><p>好，咱们正式开始。这次开始讲认知。咱们讲完了《问道》的前三章，其他都是说一些规划，今天是正式的第一次课。</p><h2>二 从行为反推成败的源头</h2><h3>你认为正确不一定就正确</h3><p>能把这个东西安排在第一次课上，肯定它的重要性很大，请大家注意。我们先研究一下，人为什么成功，为什么失败？人人都在做事，也在努力干很多东西。每次做事之前，都会以当时的认知，做出我们认为最正确的选择，认为此时此刻这么做、这么选是对的。</p><p>人在做任何事情的时候，一定会利己。没有人选择的时候，说这事一定失败，我就非得这么干，那不是脑子进水了吗？尤其创业或者做人生重大决定的时候，基本都按这套东西走。但是成功的寥寥无几。这时就出现一个很奇怪的事情：明明已经做了自己认为最正确的选择，为什么还会失败？</p><p>最大的问题就是，你认为的正确不一定是正确的。</p><p>不要小看这个。人生不如意十之八九，为什么十之八九？对于人生来说，大的选择几十次，小的选择几百上千次，每次都选成功的可能性还是比较低。所以，只要是生物，我们就要研究，你的行为为什么失败？我们要反推一下。</p><h3>行为 思维模型 认知 真相与缘分</h3><p>我先直接把答案跟大家说。我们所有的东西都依赖于行为。行为正确不正确，来自于思维模型。什么是思维模型，不知道，别着急，后面慢慢说。思维模型来自于认知，认知来自于真相。你能掌握多少有用的真相？了解的真相全不全？你所有的真相，又来自于有没有缘分得到这份真相，你的能力和缘分。</p><p>行为由思维模型主导，思维模型由认知主导，认知由真相主导，真相由缘分主导。</p><p>请大家记住这条亘古不变，以及在任何情况下都是真理的、一层层递进的规则。这很重要。我们在轮回中是这样，轮回之外是不是这样，我不知道，但我相信大概也是这样，这是一个至高法则。</p><p>决定你做事是否成功的源头，只有三个：真相、认知、思维模型。这三个东西解决不了，你做出怎样的行动，大概率成功率都会很低，做出很多选择成功率都会很低。哪怕你成佛了，你是菩萨、天帝，都要遵守真相、认知、思维模型这三个东西。</p><p>这三个东西至关重要。作为生物，所有选择、决定、判断、反应，对世界的认识，都来自于这三个。你修行的几乎所有东西，也来自于这三个，这是核心的核心。</p><p>经常说认知，我举几个例子。对同样一件事情，不同的认知、不同的看法，决定了成功和失败。曾经马云还说刘强东必死，结果刘强东现在活得还挺好。</p><p>刘强东和马云都没重视的拼多多，结果现在干成了第一名。这就是认知，对同样一个世界的看法，决定了命运的不同。</p><p>仙家会不会出现这种事情？也是一样。找一些神或者仙去看一件事情，同样一件事，会有不同看法，尤其越大的事情。普通老百姓的小事，基本不会有什么太大问题。</p><h3>同一件事为什么会有不同判断</h3><p>假设事情涉及的因果太大、牵扯的本源太多，就会很不一样。我举两个例子，是去年还是前年碰到的。</p><p>第一个，一个上市公司，干了好多年，身价也有几百亿，老板亲自来问：“我现在的气运怎么样？走上升气运还是下降气运？”不同教主怎么回答？其中一个说：“你已经走下坡路了，不要投资。”另外一个说：“你还在走上升运，继续投资。”为什么会这样？同一个人，就上升、下降两种结果，你两边堵，这是蒙呢，还是玩呢？</p><p>其实不是这样。他们看到的东西不一样，每个仙家看到的最后结果没有问题，但是看到的过程和点不一样。</p><p>这个世界有很多不同观点，观点不同，结论、认知就不一样。这位女老板实际上还有三年上升气运。其中一个教主去看，说还有上升气运，有没有问题？没有，因为她还有三年。虽然上升不会太高，至少还有三年运。</p><p>另外一个教主也看到了，但她问的是能不能继续投资。她的投资可能是10块、20块的事吗？那是几个亿或者几十个亿。那个教主对这个事情把控比较好，直接说不要再投了，走下坡运。</p><p>为什么这么说？第一，这三年的运已经不是这么往上走，有点走平，但的确还在上升。第二，以她的体量投资，三年想把钱撤回来，撤不回来。另外一个仙家对这个体量比较清楚。同样一件事，同样法术很厉害，但是大家的看法不一样。</p><p>第二个例子，有一个孩子，从照片看各方面都没问题，长得挺漂亮、挺精神，结果有些习惯很奇怪。</p><p>其中一个教主看完，说：“你得好好教育这孩子，你教他呀。”说了一些人间的东西。他觉得孩子各方面没问题，怎么会出现父母描述的情况？觉得很奇怪，是不是父母有问题？</p><p>另外一个教主直接能看到本源，就说这孩子的魂不全，是一片碎魂组成的人。本来是上古神兽转世，只不过是打碎了的上古神兽。上古神兽体量有多大？打碎成几千片，一片魂的大小还能组成一个人类，你想得有多厉害。就直接指出这跟父母没关系，父母再怎么教也没用。</p><p>同样对一个孩子判断，判断出两种不同的东西，取决于你对这件事的认知、看法，对真相了解多少，了解在第几个层级。判断不一样，认知不一样，思维模型不一样，最后行动就不一样。</p><p>其实就这么简单。不是大家不努力，跟你的权限、对世界的了解是否真实和全面有很大关系。好，咱们一层层反推，一层层解释。</p><h2>三 行动来自于思维模型</h2><h3>什么是思维模型</h3><p>第一个，行动来自于思维模型。什么是思维模型？有官方版本，也有大白话，还有例子，我给大家讲讲。</p><p>官方说法：思维模型是对现实世界运行规则的抽象与简化，是一套可以重复调用的心智框架与思维范式。第二个官方说法：思维模型是大脑理解世界和做出选择的运算规则。是不是比较官方？听不懂就上大白话。</p><p>一件事发生之后，你脑子里习惯用什么方式去解释、判断和处理，这就是思维模型。</p><p>说白了，这事发生了，我要怎么做？这就是你的思维模型。还是大白话适合你们，人类世界需要大白话。光说这个没感觉，得举例子。举一个踩脚的例子，一个帅哥踩到女生的脚，咱们用东北人的模式和台湾叫“绿茶”的方式，来回答这个事情。</p><h3>被踩脚时的两种反应</h3><p>首先，东北的暴脾气上来了。男的踩了女的脚，女的说：“眼瞎呀？操，你他妈的看什么呢？”男的本来不对，但是面子挂不住，都是东北人嘛：“怎么没踩死你啊？”你看，东北模式。</p><p>台湾的“绿茶夹子”怎么说？男的踩了女的脚：“哎呀，哥哥你很不对呀，怎么踩我的脚了？我的脚踩得很痛。”男的听完：“老妹，你说这事闹的，哥没看着，真不好意思，还把你脚踩了。疼不疼？要不要到医院看看？”夹子说：“不疼不疼，没事。”帅哥还说：“那不行，加个微信吧，万一后期疼了，别忘了找哥，哥一定负责到底。”</p><p>同样被踩脚，东北模式和台湾的夹子模式不一样，人生就不一样。</p><p>这就是思维模型。当我们碰到一件事情，对它下意识的反应，以及深思熟虑之后的反应，就称为思维模型。类似的事情很多，比如老婆发现老公出轨了。</p><h3>婚姻 教育与受伤后的反应</h3><p>逆修觉者怎么弄？先分析，再化解，再进行利弊取舍，最后做决定和选择。之前有一个女生，堪称经典式的反击，非常厉害。但正常人怎么着？一哭二闹三上吊，离婚，公布朋友圈，再把父母架上。这是正常人的反应，也是一种思维模型。碰到这种事，认知里只知道用这种方式解决。</p><p>还有，孩子3分钟的作业做了30分钟。你进去一看，8加9等于几？不知道。这时候老娘就虎了：“8加9等于几？别光看着我，脸上没有答案！跟你爸一个德行。”这是很多正常女性的思维模型。</p><p>当然，也有夫妻之间，比如老公给老婆交作业，应该一次怎么也要30分钟，结果3分钟就完事了。</p><p>老婆也怒了：“你这啥‘青色’啊？喜新厌旧了是吧？看不上老娘了是吧？”老公说：“不是不是，熟能生巧，经常做，所以做得快了点。”</p><p>还有婆媳关系的处理方式。自己被欺负了，一定想“一帮坏蛋欺负我”。逆修觉者的想法是什么？一切皆是我的问题。每次失败和受伤，都要想，我应该从里面学到什么？这就是思维模型，就是碰到事情的反应。</p><p>咱们逆修觉者解决的就是真相、认知、思维模型。我不认为你现在所有的思维模型，可以真正有效、无错地帮助你在轮回里升级，以及更好地活着。所以思维模型很重要。</p><h2>四 思维模型来自于认知</h2><h3>认知与思维模型的区别</h3><p>思维模型来自于什么？来自于认知。先说官方的：从你看到一件事情，到理解它、记住它、判断它，这整个过程都属于认知。听明白了吗？大概率没听明白。</p><p>咱们说白话：认知就是，你认为这件事情是什么，为什么会这样，意味着什么。听官方还有听明白的，说明你很聪明。有些小伙伴脑袋大了，什么是思维模型，什么是认知？</p><p>举个例子就知道了。天空很蓝，过段时间刮风，云越积越厚，变成黑色。看到这个现象，就知道有乌云，快下雨了。“有乌云，快下雨了”，这是认知。</p><p>知道要发生什么事情，要对此做什么反应？要不躲起来，要不别出门，要不带把伞，这就是思维模型。这就是认知和思维模型。</p><h3>自己分析与从别人那里获得认知</h3><p>经常说要提高认知，认知的确非常重要。人间大家比较在意认知，网上也说认知很重要，一定要改变认知。我们要清楚知道，认知怎么得来？一个是自己分析得来的，很难；第二个是从别人那里得来的，可真可假。</p><p>第一种，能自己分析出认知，我只能说你很聪明、很厉害、智商很高。要有足够的观察力、洞察力、分析能力、纠错能力，脑力足够强大才行。一会说真相的时候，会说这个分析，因为分析的肯定是真相。还要破迷，很多东西是真相和假象在一起，很难。</p><p>我们现在主要说人们经常获得认知的方式：从别人那里得来。上小学、初中、高中，得来的知识也是对世界的认知，是别人告诉你的，经过验证、可以拿来使用的东西。是否真的对？也不一定，但是对的比较多。</p><p>正常生活里，很多认知会决定命运。自己又获得不了那么多认知，绝大多数都是从别人那里得来的。所以能否分析认知的真假，以及适用范围，非常重要。难度有多大？相当于开盲盒，非常困难。因为对得来的认知，没有足够的智慧和能力分辨真假，以及使用方式方法，所以才影响了自己的命运。</p><h3>彩礼的认知与婚姻的本质</h3><p>拿几个事情来说。第一件是彩礼。嫁女儿一般都要谈彩礼，结婚的男方也涉及被女方要彩礼。很多人要彩礼，真的清楚它的作用和意义吗？</p><p>首先，你要明媒正娶别人家的闺女，或者你们家闺女不做妾、要做妻，应该下聘礼，而不是彩礼。彩礼是娶妾给的东西，娶妻叫聘礼。有聘礼就一定有陪嫁，所以叫门当户对：你家花多少钱，我们家能陪出多少钱。</p><p>有些很厉害的家族，女的从嫁到男方第一天开始，一直到棺材，全都陪嫁过去。什么意思？我们女方家足够强大，不占男方家的便宜。娶妾给的是彩礼，是买断性的东西，买断的是女孩未来生死跟你家没关系。所以娶妾可以不给陪嫁。</p><p>咱们说三妻四妾，头两级妾，妾和孩子可以写在族谱里，后两级妾连写族谱的权利都没有，生出男孩也不许入族谱。首先这是古代的。</p><p>现代的呢？要彩礼，第一是态度，“我要的是你一个态度”。第二，有些家庭尤其有弟弟的，因为弟弟娶妻也要给别人钱，基本嫁完姐姐，就有钱给弟弟娶老婆，所以会要得比较狠，是回本。</p><p>第三，看男方家的重视程度。第四，比较多的是别人家都给这么多。人家给10万、18万8，我们家只给8万8，好像我们家孩子不值钱。这是绝大多数家庭对彩礼的认知。</p><p>但这里有个很大的问题，很多家庭本来就没多少钱，又要房、车、家具、装修，男方家已经掏空钱包。再要彩礼、上车费、下车费，很多普通家庭承受不了。富裕家庭要一二百万彩礼不算事，普通家庭拿不出那么多。</p><p>你要的东西会对男方家庭造成极大伤害。为了结婚，到处借钱，焦头烂额。但一定记住，婚姻的本质是快乐，两个人快乐很重要。</p><p>从结婚那一刻，嫁到男方之后，男方家庭背上极重的负债，活钱全用于这些没有意义的东西。如果大量借债，四处借钱，因闹彩礼闹得很痛苦，从结婚那天开始，对女方的态度就已经不对了。那结婚为了什么？这就是没有搞清楚婚姻的本质。</p><p>可以用彩礼试试态度，但是我觉得，人家要给的时候就别要了，或者给完赶紧还回去。不要给别人造成太大压力，因为最后受伤的一定是你女儿。</p><p>更多的是，两个小家伙组成的家庭，要有足够多的备用金，要有足够的能力和应变能力，去抗击未来的可能性。我觉得这非常重要，不要乱花钱，这是正常的。但别人要彩礼你也要，这就属于认知错误。</p><h3>学习能否改变命运也要看适用条件</h3><p>身边有很多这种事情。比如好好学习，因为别人都在好好学习，曾经有一段时间好好学习可以改变命运，结果就认为好好学习可以改变人。可是，这是自己验证的吗？验证的东西在未来一定有用吗？如果在未来已经不太起作用，为什么要求孩子继续好好学习？</p><p>这就是从别人那里得来的认知：“好好学习可以改变命运。”但结果出问题。还有在海外，经常听到各种频道说中国怎样怎样。</p><h3>找问题与系统性解决问题</h3><p>说领导人怎样怎样，你就记住了。他们说得对不对？确实有这些事发生，但代表中国就一定有问题，中国官场、组织、政体结构就一定有问题吗？不一定。任何国家都有问题。让他带14亿人口，还能带成这样，绝大多数人有车有房，保住14亿人的温饱，很多家庭有空调，已经很不容易了。</p><p>为什么大家都说得咬牙切齿？找问题只需要发现现象，但想改变一个国家、一个政体、一个公司，需要系统性地解决所有问题。</p><p>比如中国政体，能拼到那个位置的人，有几个福报低的，不在上面有上一号的？哪个不是尸山血海都过过的？政治斗争极其严重，还要抽时间，第一保证自己活着，第二想怎么为国家做贡献，很难。推动点东西非常费劲。</p><p>骂很多东西的人，让他自己上去干，一定干得不怎么样，还不如那帮家伙，这个我敢确定。谁都会找问题。比如国足，一看就说“你往那传”。挑人家踢球毛病，很多人都能挑，而且很正确。但想组建一个非常好的足球队，这是系统性问题。解决系统性问题，比找毛病难，根本不是一个数量级。</p><p>这也是认知问题。不要光人家说什么就听什么，的确有这个问题。</p><p>任何政体、国家，在发展和文明递进过程中都会出现很多问题。最后要看整体发展情况怎么样，自我迭代能力怎么样，这些很重要。这也是认知。</p><h2>五 认知来自于真相</h2><h3>真相的含义与三个问题</h3><p>认知来自于真相。什么是真相？官方说法：事物的本来面目与真实完整的情况，区别于表面被扭曲或者人为造假的表象和假象。大白话就是，扒掉所有滤镜之后，事物本来的样子。还是大白话比较简单。</p><p>为什么真相这一部分篇幅多一些？天地、整个轮回把你卡住，最主要的方式就是用真相把你卡住。只要脑子CPU这部分没有太大问题，拥有全部真实和全部真相时，极容易产生正确认知。这个世界绝大多数人类脑子没什么太大问题，但上天不可能让所有人都把事情做对。做不对最主要的问题，是没得到全部真相。</p><p>真相涉及三个主要问题：第一，你得到的真相全不全？第二，真不真？第三，在第几层？这就是思维茧房。我可以用规则压住你，这三层决定了很多问题。</p><h3>靠能力观察与反推真相</h3><p>怎么得到比较全、比较真的真相？两个方式，第一靠能力，第二靠缘分。能力只限于同层真相。假设涉及不同界面、位面、级别，临近的，比如一层分析二层，有点可能。但用一层现象分析十层真相，可能性几乎为零，这没招。</p><p>能力也不是所有人都有，得会分析、推演、深挖。之前说过，天道把人类物质的科技树打开了，所以很多科学家可以通过很多东西反推出真相，很厉害。</p><p>要学会观察，从现象分析，从细微之处分析，能够推论，通过反常推论，通过规则推论。发现真相很难。我举自己身上两个例子。</p><p>比如紫微斗数，我怎么做的？第一，我相信规则，相信紫微斗数是真的。第二，我相信一切易学，要推断世间万事万物，一定要产生一一映射的关系。</p><p>既然相信紫微斗数能跟万事万物一一映射，我就研究出一套紫占的方式，以秒、以分进行映射。比如在山西看到一个红发美女，没看到正脸，因为她直接进电梯了。此时心在动，怎么办？起一卦，卦象叫“七煞火星”。什么意思？没明白。</p><p>为什么我的紫微能反推出这么多跟传统不一样的星和技法？就是因为我相信一一对应。</p><p>美女在那儿，卦象在这儿，我相信它们一定产生一一对应的关系。但用传统紫微的星意，怎么解释此时看到的人和卦象？对不上。多收集这些东西，就能反推出来。</p><p>比如喝可乐，假设还有一半，50%，正好发现太阴在“续宫”化忌。明白了，当“续宫”化忌的时候，原来是减少一半。很多东西都是这么反推出来的。要观察得足够细，从生活中反推。发现任何异常，一定琢磨，反向推理，才有可能发现真相。</p><h3>从细节发现帮助与建立信任</h3><p>包括我弄天地大道的东西，我看到的世界跟你们差不多，只不过还看到过更高级的世界。比如大菩萨平时说话那样，跟书本不一样，我就知道书本他妈的有杜撰。</p><p>还有“无为而无不为”，或者“信”，如何建立一个信？有的大菩萨级投胎之后，帮助别人，我有时问：“为什么不让别人知道？”他说不喜欢让别人知道。我说：“你自己花钱、受累，晚上帮人挡因果，半天起不来床，人家连屁都不知道，何苦呢？”</p><p>但我发现，这些人变好了之后，脑子比较聪明，自己反推出来：“怎么去他那里待一段时间就变好了，去别的地方就不管用？再试试。”最后，虽然很多高端客户从没听他亲口说在帮他们，但都能从细节反推出来。</p><p>后来我帮他总结：“智慧等级低于60分的，还是告诉他吧，因为他不会从细节分析，洞察力极差。任何反差、细微之处、推论，都不会在他生命中留下痕迹。”</p><p>智慧等级60分以上的，比较自我，跟他说在帮他，反而会不舒服。让他自己发现你在帮他，会更感恩。这是我又发现的事情，告诉他，他说我说得挺好。</p><p>能力是什么？能不能从所有错误信息里发现真相，并总结成系统？极难。普通人不用想，几乎不可能。连生活中哪些东西有问题都发现不了，能发现什么真相？凑合活着就完了。</p><p>我这种就属于从很多乱序东西里总结规则、总结真相，非常痛苦。尤其刚开始，没人告诉哪个对哪个错，完全凭毅力，一点点从乱象里总结。很多信息有真有假，没办法验证，只能一点点试错，通过大量试错，最后总结一套东西。</p><p>我告诉你们的，无论紫微还是这些东西，全部是自己一点点试错出来的。所以你们不要去想这个，没用。</p><h2>六 获得真相的缘分</h2><h3>本源 天赋与后天优势</h3><p>第二种获得真相的方式是缘分。缘分又分本源和平时积累。本源就是出生有就有，没有就没有。前段时间，我记得左护法还问：“师父，天赋这个东西可以修吗？”我说看什么级别。那种可以改变世界的天赋，不可能修，从轮回里出生那一刻，有就有，没有就没有。</p><p>类似爱因斯坦、高斯、马斯克、稻盛和夫、段永平，这些都算天赋。</p><p>还有霍金。这种东西让人觉得绝望。清华姚班的一些人也叫天赋，但700分考进清华，只能算聪明，不能算天赋。</p><p>法界这边的天赋，比如我，叫传法天赋，一个是忽悠能力，一个是从乱序中总结规则的能力。不用学习，大概听一下、看一下就知道，你不用去想，几千年很难出这种人。</p><p>包括负责看卦的天巫本源、顶级天巫血脉的人，就是天赋，从来不需要学习。需要沟通天地时，想一下、感受一下就知道。但凡还需要学习，都不叫天赋。</p><p>普通人类可以积累的叫优势，有的人优势多，有的人少。</p><p>优势可以积累，但顶级天赋不可能。也可以认为小天赋能训练出来，累劫轮回，多轮回几世，怎么也能比较厉害。但像写《洛神赋》的，曹植吧，应该叫曹植，这就是天赋，没办法。这叫本源。</p><p>本源的缘分，比如我跟观世音菩萨、佛界的缘分，出生时就定了。你们还费劲修，我就大摇大摆带着族人跑到佛界。只不过现在变成小号，等级不行，再去佛界比较难，但现在也拿到门票了。你们要进佛界费大劲，这就叫本源。</p><h3>平时积累与获得信息的机缘</h3><p>第二个叫平时积累。能不能看到真相，最重要的是平时积累，在累劫轮回里靠平时积累。因为能看到什么真相，取决于有什么缘分。</p><p>包括海外一些中文大V，论政治、经济的，他们一生里有你们通过学习努力也得不到的机缘和人脉，所以能进那个圈子，有幸知道这些东西，加上脑子在线，才能成就这些事。比如鲁博士分析政治很厉害，大老王说经济、国内一些事情，非常有参考价值。</p><p>像老张说有趣的事情，非常有天赋，都来自于人家有这个机缘。最后会发现，能得到什么，取决于缘分。</p><p>比如我，一个泥腿子、夜大学毕业、连正经高中都没上过的职高生，能坐在这里跟你们侃侃而谈，为什么？因为跟你们有不同机缘。</p><p>我看到的真相，不是你们通过努力能得到的。我能得到一些上位面的东西，比如大菩萨，菩萨比较多，神也多，偶尔有天帝，佛祖很少，但我觉得够了。是这些佛祖菩萨让我直接看到了真相。我跟他们有缘分，所以能轻易得到很多人终其一生得不到的真相，法界真相对我来说很简单。</p><p>我也认为自己有很好的师缘，上面有老师，有问题叫他跟我说一下就完了。有时他带我去看，一看佛界不是大家说的那样，这就是缘分不同。</p><p>整个流程是，想有什么正确行为，取决于思维模型；思维模型取决于认知；认知取决于看到过、知道什么真相；能不能看到，取决于有没有这种缘分。所以缘决定一切。什么缘分最重要？师缘。</p><h3>师缘与生活中的各种缘分</h3><p>累劫轮回里，没办法得到重要信息，尤其跨位面信息，得不到，怎么做出正确判断？刚才说的还都是人间界的，在人间界就很难解决真相全不全。一涉及跨位面，人间再聪明也没用。几千年来这么多聪明的人类，有没有解决认识方向、认知方向的问题？没解决，一直重复错误，就在泥潭里。</p><p>如果要积累缘分，第一个是师缘。师缘怎么积累？累劫轮回经常尊师重道，师缘就比较好；每次相信真理，这个缘分就很好。</p><p>第二是爱情缘。老关心老公有没有找小三、劈腿、小金库，有没有伤害你，有意义吗？所有的防都没意义，还不如真心爱一个人。累劫轮回，真心爱自己的老公，真心把自己的东西做好，不用管他成功不成功，生命里一定会积累出非常好的爱情缘。</p><p>有足够多的爱情缘，就能碰到对你特别好的人，还需要管这些吗？这些都没意义。包括好身体、好贵人的缘分。我最近也找到一些解决身体问题的缘分，问题就解决了。子女缘、众生缘、员工缘都一样，有时会发现，一切皆在缘分。</p><p>这条路都讲完了。既然要打破之前讲知识的方式，就要树立新榜样。拆解、讲完后，一定告诉你，学完这些东西，要在脑子里建立怎样的认知？对你的意义是什么？如何帮助你在轮回里更好生活、提升？这些一定讲。</p><p>不能像那帮古人的大尾巴狼一样，动不动一句高深的话，结果所有人不明白怎么做。你是秀技术，还是真打算度化众生？咱们一定把这些讲透。</p><h2>七 学完之后要建立怎样的认知</h2><h3>遇到意外先反思真相与认知</h3><p>第一件事情，一定清楚所有源头都在真相、认知、思维模型。把这三个弄好，才能清清楚楚、明明白白活着，让自己顺利过关。</p><p>第二，一切问题、失败、错误，都来自于对事情的认知有问题。认知有问题，一定涉及了解不全面，或者了解不真实。所以要反思自己、反思真相、反思认知。如果都没有问题，才能做到没有意外。</p><p>只要发生了意料之外的事情，第一时间清醒地意识到，我一定有不知道的东西。</p><p>发生意外，一定有不知道、不了解的东西。不要怪任何人，是自己的认知和对真相的了解不全面。</p><h3>不要相信自己可以掌控一切</h3><p>下一条，不要相信自己可以掌控一切。首先从轮回规则来说，不可能全面掌控一切，神佛、大菩萨都一样。上面的观世音菩萨每次跟我说东西，一定正确吗？不一定。</p><p>但对我来说，能找到的最高智慧等级，能帮我看未来、做指导的，就是观世音菩萨，会亲自指导我。如果连他指导都出问题，那就是命。在指导未来、选择未来方向这件事上，我不如他。连我认为超越我的人都做出错误决定，我自己上去也不可能成功。</p><p>这是一个team，大家各司其职。涉及人间的东西，上面的大菩萨还是交给我。他觉得我在人间的把控力还可以，不能说最好，但能信任的人不多。在能信任的人里，把控力比较好的可能只有我。如果我做不好，他也不可能找到更多人替代我，所以也要认。</p><p>规则之下，不可能没有意外。以这种组合补缺的方式弥补，出错概率已经不多，但仍然有。</p><p>对于普通人，能掌握的都是阳间的东西。再厉害，像马斯克，也只能掌握阳间，不可能掌握阴的那面。我没说阴间，我说阴的那面，法界所有东西不可能掌握。</p><p>光把火箭弄上去，在阳间需要掌握多少知识？你觉得在阴间掌握的知识、需要考虑的东西会少于阳间吗？如果相信阴阳平衡，不可能。</p><p>缺少一半认知、一半真相的情况下，凭什么确定自己能掌控世界？很多人都在做傻子一样的决定。知道有阴阳，却不知道阴的那面有什么，凭什么确定掌控命运、掌控世界？</p><p>第三，尽可能提升自己的圈子，不同圈子提供不同知识。我们这个圈子也有很多别人没有的认知和知识，要努力、大量积累。如果只是年轻人，请不要太相信自己的能力。</p><h2>八 认知冲突与家庭沟通</h2><h3>让对方看到你所看到的真相</h3><p>下一条是认知冲突，涉及人与人之间的沟通和看法。很多矛盾来自于认知冲突，就是对同一件事有不同看法。下次不要强行说服对方，因为说服对方是在进行认知冲突。</p><p>人类有一种机能叫认知保护。你说的东西跟我认为的不一样，我就进入认知保护阶段。所以不要直接灌输，有时没用，越聪明、越有主见，越不可能灌输。更多的是让他看到你能看到的真相，感受到这些真相。相信只要是正常人，他会改变。</p><p>知道认知来自真相，就多带自己的孩子、让配偶多看看世界，多了解人间，多看咱们成功案例，多了解规则，对他们有帮助。</p><h3>女儿恋爱与父母的不同看法</h3><p>举几个例子。青少年时期搞对象，尤其女孩，直接给你找个“黄毛”，你肯定不同意。但以女儿对世界的了解，她不认为这个人坏，对自己很好。而以你三四十年、四五十年对世界的了解，女儿在干什么，你很清楚。</p><p>这时你不同意，说这人的坏话，但这些在女儿那里没办法证实，她会听吗？不会。想防止女儿找“黄毛”，最重要是多看咱们案例，多看世界，看看那些被骗女生最后怎么样。</p><p>我记得有个学生，之前还差点被“黄毛”卖了。但可能也是真爱吧，最后没卖成，这是咱们一个学生的真事。</p><h3>让配偶经历管理中的困难</h3><p>配偶也一样，夫妻有很多矛盾，是你看到的世界跟老婆不一样。像我老婆，最近涉及一些管理上的东西，为什么我基本不出手帮她管理？她未来要知道我很多事情，也会涉及很多决策。如果从没经历管理，就会决策失误，因为不知道会发生什么，不知道为什么做这些决定。她没经历伤痛、错误、痛苦。</p><p>更没被各种人际关系和人类奇怪行为骚扰过，需要先经历。这样她会对自己的管理能力有清晰认识，知道哪些方面强、哪些弱，更多是知道管理不容易、很艰难。这也是让她看到很多真相。如果没看到，不会认为这些东西困难。</p><h3>老人带孩子与共同学习</h3><p>年轻人生完孩子让老人带，老人会用曾经带孩子的方式，年轻人就说“这样不对”。老人郁闷：“你都是我这么养大的，反而变成我不对了？”就产生很多矛盾。</p><p>更多的是让老人看一些纪录片，跟你看的东西一样。</p><p>大家共同学习，这时老人知道原来是这样，原来之前一些方式不是说不对，而是可能有隐患。这是解决很多人间矛盾的主要东西。我们更习惯指责。</p><h3>孩子能否理解你说的道理</h3><p>尤其一帮大傻子，孩子不学习，就跟孩子讲“以后会怎样怎样”，有用吗？用你的认知，让孩子明白20年后才会经历的事情，有意义吗？说的的确对，但叫正确的废话。</p><p>孩子更关心玩不玩、快乐不快乐、心烦不心烦，又没经历过那些。了解这套体系后，再跟别人交流，先想想有没有必要说这些？他有没有正确理解这些认知的能力，有没有看到相应的真相？如果他看到的世界跟你不一样，肯定不行。</p><h2>九 思维茧房与缘分的积累</h2><h3>家庭 学校 社会与师父</h3><p>人类要分四个阶段，称为思维茧房的四个阶段。</p><p>第一个是家庭。我们不知道世界怎么样，很多事情是父母跟孩子说的，尤其女生，小女孩更不清楚、没怎么接触世界。很多认知来自父母和家庭环境。比如老公应该怎么样，该不该要彩礼，女孩没什么自己的看法，不知道，只不过你说应该这样，要看男方态度，所以她才这样，来自家庭。</p><p>第二个来自学校，同学、老师，以及在学校学习的东西。第三个来自社会。第四个是能不能碰到师父，得到人间之上的认知。有些人类认知，再努力也不可能得到正确答案，因为答案不在人间。</p><h3>积累有益的缘分与提升圈层</h3><p>下一条，一切皆缘分。现在可能没有好缘分，但请相信生命是无量劫的，不要在意这一世的生死，更多是生生世世积累有益缘分，积累能看到、获得更多真相的缘。比如工作，管理、带人、研发，这些工作上的缘分，能看到真相，就很厉害。</p><p>希望大家学会跳圈、抱大腿。为什么一定往上跳，改变阶层？因为不同圈层掌握的信息远高于你。</p><p>“十年苦读怎能比得上三代经商？”现在我真理解这句话。如果家里三代都干这件事，积累的庞大人脉和经验，不是AI、不是靠学习能得到的。上面大哥告诉一些东西，比苦读十年强得多。所以记住，拼了命也要往上抱圈、抱大腿，很重要。</p><h3>天道打工人与下课寄语</h3><p>下一条，有缘成为天道打工人。想了解更多天道知识、系统外知识、思维茧房外的东西，凭什么得到？不能成为天道打工人，天道有必要让你知道更多吗？这一定注意。</p><p>不知道的那一半，法界的东西得不到。法界东西至少占一半知识量。多少人，包括很多大老板，拼死拼活一辈子，燃烧福报，最后也没落个好，何苦呢？</p><p>最后还是说，多看、多学、多了解，非常重要。希望今天这些东西，成为大家判断事情的天道思维中很重要的一点。平时多看、多接触，学会分析，找到好老师。自己看不明白时，有个好老师愿意把真的东西告诉你，很重要，基本就靠这个。</p><p>水平很高，才有可能跳出父母的圈子、摆脱学校的圈子。能接触到真正引领世界的顶级人才、资源获得者，掌权的、有钱的、有思想的、有名气的人，才能真正知道世界怎样运行。这还只是社会认知。</p><p>只有真正找到通两界、跨越两界的人，才有幸得到阳之外的那部分东西。最好别走错，不然一次次失败、重来，太可惜。</p><p>好，今天说到这里，耽误大家很多时间，再见。下次开始说阴阳法则，又要说很多，很重要，这些都是重要的思维模型。咱们下期再见，拜拜。</p><h1>问道五 · 意义思维</h1><h2>一 开场活动与近况</h2><h3>九月份请符与环境提醒</h3><p>好，正式8点了，咱们不耽误大家时间，正式开始。开始先不讲故事，先说一下9月份促销。每年好多人年底年初请符，其实不对，换法器、请符应该在9月份。像我这样的什么时候请都无所谓，但绝大多数人，尤其打工的、年底要账的，还是需要年底年初仙家比较给力。</p><p>为什么是9月份？首先，得让新的一批仙家对你有足够了解。什么都不了解，事情也不知道，直接上去弄，肯定不好使。有三个月时间，了解差不多了，帮你调运气、调事情，要给一定缓冲时间。打工、接工程、年底年初要答谢领导的，你的套符这个时候效果最好。年底总结拿一个好总结，年初资源拿到好资源，这时候请符非常好。</p><p>第二，咱们说大环境。最近好像新上了一个关于出入境的法规，之前可能忘了说。现在一些客户已经开始出问题。前几天一个客户的女儿从美国回来，再去美国时被边控了。现在能边控你的部门越来越多，以前要有明显犯罪证明，现在只要怀疑就可以，甚至县级公安部门都能边控。请大家注意。</p><p>小女孩后来托人找关系，问到底哪边控的，是公安还是怎么着？无犯罪证明还能打出来，没有犯罪记录，也没警察找她。后来发现是国安边控，也没有理由，你不知道谁边控的。怀疑因为在美国上学时，可能跟一些比较敏感的学生聊过天，就被边控。再想回美国上学，回不去了。英国的也出现这种情况，整个学业就完了。</p><p>还有敏感公司，比如跟美国或者全球有关的高科技公司，回中国后，很可能以国家安全和信息泄露为由边控，不算犯罪，但不允许出国。在海外一些博主底下留过言的，也一定注意，尤其翻墙的人，翻墙软件所有信息都在监控范围内，找麻烦很容易。一旦出不了国，海外的事情都没有了。</p><p>在加密货币公司做职员的也悠着点。在海外待得挺好，回国探一次亲，能不能再出来不好说，尤其大公司、加密货币敏感公司的职员，肯定国安那里都有一份。普通老百姓没什么事，别去敏感地区。像我们从泰国出来非常及时，现在泰国弄得鸡飞狗跳，很麻烦。这是大环境。</p><p>北京等很多大城市，吃饭、买东西、买奢侈品的人少了，上班的人也少了。很多人说找不到工作，说白了，他想要那个钱，没人要他；很多公司也找不到人，开的钱别人看不上，互相看不上。不是没有工作，是大家看不上对方。</p><p>经济大萧条。最近北京有朋友卖房，腰斩又腰斩，原来至少能卖300多万，现在100万出头就得卖，很郁闷，也没办法，这就是命。未来还得跌，不卖还得跌。未来至少还有15到20年经济大萧条，现在说白了还没开始。以后少挣中国的钱，挣点国外的钱。</p><p>再说专场，明天黄财神专场，赶上就赶上，赶不上拉倒，实在没办法提醒，提醒也来不及。</p><p>八月十五，9月25号，月光菩萨和月老专场。八月十五晚上，别忘了念108遍月光菩萨陀罗尼咒，还是非常好的。北京房价跌成什么样了，腰斩又腰斩，这很正常。9月28号九天玄女成道日，喜欢风水的多参加。10月2号，国庆第二天，燃灯古佛专场。</p><h2>二 从近期现象反推本质</h2><h3>显卡性能与电脑设置</h3><p>最近这一个月，或者半个月发生一些事情，我先说现象。首先是家里的显卡。原来买了4090，部分游戏能玩，但《黑神话悟空》进去没多久就退出，战地系列的大型游戏也玩不了。像“荒野大镖客2077”什么的没问题，一直搞不清怎么回事。</p><p>后来用豆包AI帮我找机器问题，找出一部分。主板BIOS版本太低，是2023年的版本，现在2026年，差了20个版本，升级后好很多。第二，内存赫兹数，原来是5600，调5600容易崩，改5200好很多，但偶尔崩一次，现在调5000，没问题了。</p><p>第三是优化，我觉得可能不是优化的事。最开始以为缺程序、支持文件，电脑配置还不错，当时在泰国就为打游戏买的，“全打总套单”。还特地买了闪来闪去、连电线都发光的。头一个月天天盯着机箱看，现在能不看就不看，过了那个阵。人也是需要过了那阵。</p><p>最后发现，用双显示器玩赛车没问题，但一个横着、一个竖着，可能会出问题。我把另一个显示器一关，BIOS更新、内存调过、软件环境优化，再关一个显示器，现在所有游戏都能玩了。</p><h3>无线网络与有线网络</h3><p>第二件事，家里上网。马来西亚这里目前最大带宽2G，装完只能跑1400。我以为路由器有问题，把工程人员叫来，现场用他们自带Wi-Fi的光猫，也只跑1400。我想可能有损耗，大马科技不如祖国厉害，说2000跑不出2000，很正常，就没多想。</p><p>长达一年，最高1400，平时1000左右，波动，最差三五百。一直认为当地网络环境有问题。5090不敢换，看了一下太贵了，四五万一块，疯了，打个游戏而已。一会讲意义思维，这就没意义。</p><p>最近新开疗愈室要布网络，买几个hub，叫集线器。多弄一个给家里用上，连上10GB的网线，固定台式机全部跑出2G带宽，非常稳定，2060，“22060”，再没出问题。</p><p>后来发现，这里的绝大多数Wi-Fi，只要不是特别高级、几千块钱的，基本只能跑1400。我自己也有问题，Wi-Fi是方便联网，没说最大化发挥网络环境。台式机尽可能用有线。</p><p>之前线太硬，后来发现扁的超软线，不硬，随便弯，还能跑10Gb带宽。现在家里全换网线，笔记本也拿“网线转10GB的插头”，至少家里所有笔记本、台式机都是标准2G带宽。</p><p>有没有想明白老天要告诉你什么？如果连这两件事都没想明白，只能说对生活敏感性太差。7月份为什么没怎么干活？第一，录播的东西要一遍遍过，太费劲，这是工作问题，不多说。</p><h3>洗灵过程与身体经历</h3><p>第二，一到7月份身体弱、脑子不好使、睡不醒，阴气重，我也是这么认为。但7月底应该好了，结果还出问题，因为又要升级了。</p><p>还记得去年跟大家说过，给一些学生做疗愈，那场用了20%的能量，给他们改变了，差点整个师门都快崩。</p><p>一定记住，不能消耗气运，越干大事越要洁身自好，很多东西靠气运。稍差一点，节拍赶不上，整个企业就崩，差一次就没了。那次只少20%，仙家很生气，但还没至于崩。</p><p>这一年总算恢复回来。出问题前，洗灵师傅帮我洗灵，正好看到我在海里被一堆鲸鱼围殴。后来帮学生做了一下，福报少20%，影响很大。再想补、再做，洗灵师傅就看不到影像，同频共振不上去。大概第49世或者50世，去年发生的。</p><p>今年最近终于连上，洗灵师傅有感应，说差不多，又要开始洗灵。我说行，谢谢。第一次，看到海里一个宫殿中的身体，怎么碰都不动。洗灵师傅同一时间传功，我想至少可以帮15万人同时传功，没问题，但想动我这个身体，动不了，没反应。</p><p>第二次还是没反应。第三次努力之后总算改变，变成我被关在水牢里，下半身腿泡得发胀、黑黑的。见过我的都知道，我经常得用包腿布裹着。看到了吧？</p><p>一直以为年轻时不注意，再加糖尿病，小腿神经末梢有点萎缩，很怕凉。这么热的天也得裹着，否则小腿老觉得凉。现在才知道跟这个有关。当然血管萎缩也有，年轻时糟蹋也有，但跟这个关系很大。</p><p>为什么展示这些？没什么秘密可言，因为什么问题出现什么事，这是一种规则，得告诉你们清楚。又没露银行密码，怕什么？也不涉及再娶房小的，要给大家好形象、好面貌，有什么事就说一下。</p><p>发现这个了，但洗灵师傅弄不出来。到今年第四场，刚开始还是弄不动，以他的能量级别弄不动。</p><p>后来地藏王菩萨出现在幻境里，把那个东西拿掉一些，上面一堆佛祖菩萨打金光。这时我从水牢出来，沿很长的通道走，总算走出来。可能第49世还是50世，我忘了，把那一世被关着的魂弄出来。</p><p>但每次洗灵都得昏睡很久，尤其第四次，虽然解放出来，非常累，下午直接睡6小时，睡不醒。魂归位了，但受伤太严重，会拉低现在的魂能，恢复两三天才行。不是不想给大家录东西，实在有问题。</p><p>从第三次洗灵时，显卡和网络出现转机。今天说一个很重要的东西，叫天道意义。未来聊天道思维，因果思维、天道布局，必须有意识：这段时间集中爆发事情，想告诉你什么？必须有从现象反推本质的能力。</p><p>无论显卡还是网络，共同特性是什么？本身没有任何问题。</p><p>但是有一段时间，无法发挥全部威力，发挥不了全部功效，而且极度波动，比如网络。一定从现象发现本质，连这都发现不了，活得太白了。</p><p>魂回来后，精神状态完全不一样。《问道》三录播版，磨叽两星期写不出来，一弄就出来。今天的意义思维也是，磨叽两星期不知道怎么说。</p><p>魂回来后，半天就OK。原来素质没问题，但想发挥，发挥不出来。之前发挥不了的，现在可以满信号发挥，CPU干到100%。以前讲东西时好时不好，就是CPU有些没更新，发挥不全。像网络，最厉害四分之三，正常一半，现象不好时四分之一，500兆带宽。</p><p>通过这个事情，知道现在魂基本补全了，因为之前出现过魂裂、魂碎。</p><p>第二，也知道以洗灵师傅水平，再补之后轮回的东西挺费劲。50世都这样，51世不好说。我估计用这一生再帮我干10世、20世，就了不得。但小号人间100世、天界100世，连人间100世还没干完，为什么往上修难？越回归，动用能量等级越高。</p><p>不知道几亿年后，能清大号第一世。打位面战争杀人太多，不知道什么级别能帮清理冤亲债主，不好说。所以要通过现象分析本质。最近一些同学经常找我，身上总发生意外。</p><h3>气运变化与应急准备</h3><p>女生40岁以后、男生45岁以后，基本要走衰运。如果一件事怎么弄都出现变数，包括我帮看也有变数，我建议先等等。不管着不着急，没有解决气运，这是走败运、弱运，往下滑，要通过现象分析本质。</p><p>像我，2025年换十年大运，将走这一生最好的运。换运会不会倒霉？会，但所有倒霉都是让你有更好的重生。</p><p>因为走上升运，倒霉是在调整。今年身体出了多少事？首先脑子开一瓢，当时头疼，直接拉医院，照CT后就要开颅。遗书没来得及写，银行密码、钱在哪都没来得及跟媳妇说，就推进去了。万一弄一下失忆，全废了。</p><p>大家提前写好遗书，不知道哪天出事。至少哪个银行有钱、密码在哪、哪个卡多少钱，跟媳妇说清楚，别真有事还得借钱。我看病时，媳妇掏不出钱，不知道放哪，还得跟学生借。手术花10万马币吧，相当于18万块钱。</p><p>来不及，推进去忘说了。藏私房钱不行就让媳妇知道，至少还能救命。第一件事发生，不懂无所谓；第二件是血糖不正常，后来直接上了这个，现在血糖非常合格。</p><p>这时应该有意识，好像今年这些事都是解决生命中的问题。胳膊疼，做完手术现在没事。高血压一直解决不了，后来找大夫换药，也没事。到现在所有指标、病，不管通过什么，都变好了。</p><p>处理胳膊时，已意识到好像今年要把身体问题爆发出来，再想办法压制、解决。所以高血压有问题时，直接意识到是好事，但什么契机、找哪个医生，不知道。</p><p>后来换药稍出意外，但最后结果非常好。今天教大家最重要一点，要学会分析天意，从现象分析本质，别天天瞎过。一件事可以叫意外，类似的发生两次，就不能叫意外，一定分析老天通过这件事想告诉什么。</p><h2>三 意义思维的定义与习惯</h2><p>正式进入意义思维。没什么太难的，最重要是分析这件事有没有意义、值不值得做、能让你得到什么。最难是融入生活，否则学了白扯。</p><p>我敢确定，今天学的意义思维，如果真融入生活，命运一定改变30%以上。不要小看，没难度，只是没融入生活、没产生思维习惯。真产生习惯，人生会很有意义。</p><p>意义思维是以最终目的和真实结果为尺度，对一件事情的目的、价值、代价、后果、路径、本质和当下的行动进行持续审视的一种思维模型。</p><p>说白了，我为什么做这事？能得到什么？最后得不到怎么办？付出什么代价？值不值得？继续走会怎么样？现在做的还在服务最初初心吗？经常问，就不容易走偏。</p><p>人生很大问题，是意义思维没有成为观察事物、解决问题的必选项。不是意义不存在，是大脑不主动往意义方面想。像之前说的思维枷锁，不是事情没发生，是大脑不往正确地方思考。</p><p>我产生思维习惯后，身边发生事情，大概率琢磨天道想干什么。现在一个学生找房，过程中发生事情，我就知道他肯定要换运。一定从表象发现天道要教你干什么。</p><p>经常出现奇怪状态：做一件事很多年，从不问为什么；学东西很多年，不知道干什么；争论几个小时，没解决问题；为了小目标，把大目标干掉；因为别人都做，自己跟着；被表象牵着走，看不到原因和因果；浪费大量时间，不算成本；发生问题先发泄，不处理最需要解决的东西。</p><p>意义思维要达到的状态，不是知道它叫什么，而是成为生命的一部分，成为大脑面对事情时自动启动的检查程序。咱们说七种模式。</p><h2>四 意义判断</h2><h3>把经典读薄并找到用途</h3><p>从七种模式分析合不合适。第一，意义判断。我为什么做？成了值得吗？最后得到什么？就是目的、结果、价格、价值、代价，是否值得。</p><p>第一种错误，知道是好东西，却不知道有什么用。人类2500年，智慧是什么？《心经》《金刚经》《道德经》到底讲什么？学佛教、道教，能在生活中改变什么？改变了吗？没有改变，是教得不好，还是学得有问题？</p><p>《道德经》有一句重要的话，叫“为学日益，为道日损，损之又损，以至于无”。咱这“以至于无”倒不至于。学习不断增加知识没问题，但学得差不多，是不是要剥离细枝末节、重复、案例、形式、文字，琢磨最后核心是什么？读经典不能越读越厚。</p><p>得越读越薄。经典几千字、几万字，大量解释、故事、比喻、举例、重复说明、不同角度展开。最后必须回答核心教什么，对改变一生有什么帮助？没帮助，学它干什么？很多人读一辈子《心经》，不知道讲什么，最后变成明心净性、让人静心的东西，这跟扯淡。</p><p>《金刚经》总结起来四到五句话，讲几个事。不断注解、解释、引申，为了理解每句话，但到底干什么，对生活有什么帮助，问过自己吗？学那么多空色，《大般若经》花600卷讲，对我有什么意义？除了知道世界是假的，混沌法则、污染法则，还有什么意义？没什么，明白几个事就行。</p><p>污染法则怎么对抗，人家也说了，只不过大概率不明白。不能用一句话或现实行为解释，不能融入生活，对你无用。</p><p>古代经典像螺丝刀法则，给一把螺丝刀，说材质好、厉害，忘说到底干什么。至少得说拧螺丝，螺丝长什么样、什么时候拧、怎么使用。说一堆却忘了用途。</p><p>一帮捧佛祖、道祖臭脚的人，以为研究几个字就厉害。得为道日损，学会把书读薄，你读薄了吗？也没看怎么样。</p><h3>判断研究与争论是否有价值</h3><p>第二种，把生命浪费在无法验证、无法应用、跟自己目标无关的事情上。有些人喜欢研究虚头巴脑的东西，不知道有无用、没办法验证、不知道操作、最后能改变什么，却投入几年甚至几十年。</p><p>一定明白弄这东西为了什么。判断顺序：能不能验证？怎么应用？跟当前目标有没有关系？这里面占一个就别碰，占两个以上离远点。</p><p>《道德经》的东西都明白吗？“无为而无不为”怎么做，会做吗？不会，研究干什么？两千年没研究出名头，凭什么确定自己对？没研究的人也没耽误成功。既然不耽误，为什么研究，闲的。</p><p>为什么用现在有限生命，长期投入既不能验证、不能应用、跟当前人生没关系的东西？比如研究佛教的“无无”，有什么用？无、空，不就是假的，污染法则、混沌法则明白就行，还能弄什么花，至于赔一辈子吗？研究“本来无一物，何处惹尘埃”，还当博士论文，研究完对自己有什么影响？</p><p>对人类、自己都没影响。研究有没有外星人，关你什么事？有证据、素材、案例、经历吗？能不能解决第二天挨饿、老婆打架？解决不了，研究这个，闲的。</p><p>某个明星出没出轨，你趴窗口去了？有没有离婚，到民政局查一下不就完了？两个明星有没有恋爱、是不是真心，你自己还嫁不出去，关心跟自己有关的事。甚至吵架时，先问四句话。</p><p>第一，争吵内容能证明吗？谁都证明不了，吵什么？足球赛踢之前争谁赢，踢完就知道，扯这个干什么？第二，证实后能改变什么？第三，跟生活、自己目标有没有关系？第四，这场争论产生什么价值？</p><p>跟别人、媳妇、儿子、闺女吵架，先看这四个问题能不能解决。不能，就别吵，及时退出才有意义。很多人不是没时间，而是大量时间花在与人生毫无意义的事情上，人生就这么浪费。真正值得争论的，不是能不能赢你，而是答案值不值得花生命价值去争论。</p><h2>五 多步推演</h2><h3>第一步有利不等于最终有利</h3><p>第二个叫多步推演，多想几步，别想一步就干，干完发现错。睿智的“睿”是什么意思？多想几步才叫睿智。不要以为第一步有好处，就值得做，真正该问第二、第三、第四、第五步，然后呢？</p><p>第一步是收益，第二步是反应，第三步是连锁，第四步是风险，第五步才是终局。</p><p>让你们想十步不可能，想到第三、第五步就行，人生一定没问题。第一步正确、对自己有利，不代表整个事情对自己有利。</p><p>比如老板加薪50%。第一步涨工资很开心，第二步发现工作时间从8小时变14小时，第三步身体越来越差。</p><p>第四，经常不回家，跟老婆、孩子关系恶化。第五，几年后身体、家庭都不行，最后发现不如不拿那50%，多出来也没干什么，何苦？打工挣100万年薪非常费劲，比考清华北大费劲得多。</p><p>靠打工，不是做生意。做生意大概率做对，挣100万比较简单；打工得拼，拼完值不值，要琢磨。</p><p>创业一年挣一二百万，还能通过税务洼地解决税务、流水问题；净利润1000万，税务问题就麻烦。工商、税务，甚至公安、竞争对手、死对头，有人开始盯你。穷小区换车，就有人说闲话、戳脊梁骨，人际关系都变化。不是只想1000万挣到了怎么样。</p><p>穷人觉得挣1000万是好事，挣过的富人知道，各方面得配得上。挣一个亿更麻烦。但在中国，一辈子挣3000万到5000万还是快乐，很多问题能解决；一年一个亿，很多问题不好解决，藏钱都难，容易惹麻烦，钱能不能拿10年、20年不好说。</p><p>上10亿，麻烦更大，扛不住是灭顶之灾。10亿、几十亿，觉得国内有问题，还能跑；一两个亿不至于上红通，10亿以上就够格。</p><p>如果政府要折腾，够格上红通，麻烦，但也不是不能解决。上100亿就不是红通问题。假设做100亿之间的生意，会互相产生伤害，能挣100亿的人，调配社会资源不是你能想象。</p><p>不只是政府，黑白两道、暗网都可能折腾。没有保镖、安保团队、出行规划，容易出大事。涉及国家层面，甚至特工、国家层面灭杀，抓不回来直接灭，不一样。</p><p>夫妻冷战也这样，开始赌气，想用这种方法让对方求我。</p><p>男女都有这种想法。但你出招，对方也出招，“我也不理”，互相防御，越来越想不通，不愿沟通，到第五步感情消散。就算第一、第二步赢了，最终不愿一起过，输最多的是什么？</p><h3>长期风险与储蓄兜底</h3><p>有时不是看今天、明天、下个月，而是看5年、10年、20年、30年，提前定好。像我，不管挣没挣钱，都会拿一部分作为储蓄，因为不相信人生没有意外。</p><p>就算认知比很多人高、经验多，还有法界帮助，出大问题可能性不大，也不能说一定不出意外。真出意外，兜底的东西是什么，有没有？三四十岁，尤其40、45岁，存款多少？越接近50岁，父母容易出问题，孩子也开始要劲。</p><p>夫妻关系容易出问题，挣钱能力大幅下降，社会排挤你，能不能解决？年轻时光嘚瑟、买东西，又出新iPhone，光惦记买，没人兜底，最后人生失败。气运、身体、世界格局、经济、家人变化都要算进去。别活太简单，越简单越痛苦。</p><h2>六 终局反推</h2><h3>小目标必须服从大目标</h3><p>第三个，反向思维，叫终局反推。经常出现的问题，是现在干的跟最终想得到的不一样、没关系。所以一定先反推，最终想得到什么？</p><p>现在干的跟最终想得到的有没有关系？没有，甚至破坏，为什么做？先写好终局，再看必要条件、当前行为，是否跟终局所需一致。小目标必须服从大目标，开始人生反推。</p><p>比如修行者，相信因果轮回、业力，最关心的是这一世完成后能不能升级。得看升级需要什么。福报、众生善缘是两个核心。现在干的跟增加福报、功德、众生善缘有关系吗？</p><p>为什么跟人分手，或者相处一段时间闹毛病，不想想众生善缘？下辈子见不见？因为这辈子一点事，下辈子善缘出问题，值不值？</p><p>不管别人干什么，是因果消散前最终展现。没有一辈子缘分，大多中间会出事，跟所有众生都会，很正常。出事后开始怨，还是服从众生善缘这个大原则？刷游戏、跟老婆吵架、出去happy，跟功德有关系吗？没有，为什么干？这叫人生反推。</p><p>不能完成大目标，为什么干？当然偶尔休息可以。像我也刷剧、躺着、打游戏、逗儿子，肯定也干。但一天主力时间要工作，挣钱的工作先做，因为要养家糊口。第二，要大量时间利益众生。第三，照顾家人，跟儿子玩，处理家里的事，比如上保险。</p><p>这些很正常，也会花时间，跟这个没关系，但让你活得更好。大原则不能违背，违背了，这一生最后是个零。小问题不要影响大原则。</p><h3>教育与婚姻的长久目标</h3><p>教育最终结果是什么？别老说报效祖国、报效人类，先让自己成为不会饿死、能独立生存的人。</p><p>假设大量学习不能活得更好，意义是什么？得反推。这一生经常干、经常解决的是什么？先学会生存，是持续做的。结婚、处理婚姻关系，是几十年的事；养儿育女、教育孩子，是几十年；照顾身体也是。夫妻两性生活，绝经前是不是得发生，和不和谐，也几十年。身体健康、不生病，一辈子。跟父母关系、让父母善终，也几十年。</p><p>这些影响一生，却在人类最美好年龄，用10年、20年学终生几乎用不上的知识道理。陪伴几十年、影响生活质量甚至一生成败的东西，却没人教。</p><p>不奇怪吗？学一辈子用不到的，还用它评价成功失败、优秀不优秀，为什么用你们的标准衡量我的人生？用意义思维反推，不能别人干什么就干什么。</p><p>婚姻目标是两个人长久、欢喜、愿意一起生活。反推需要信任、尊重、沟通、安全感、共同利益、亲密和情绪。每次吵架，有没有想现在是否伤害这些？为什么男人不愿回家，女人对男人失望？你是在增加还是减少这些感觉？不要陷入具体事情，因为它会影响人生。</p><p>谁多干少干、谁父母有问题，钱、孩子、两性问题，一句话谁对谁错，天天争吵。就算争出对错，日子过不下去，意义是什么？事业赚钱也一样，先想大原则、大目标，此刻做的有没有伤害大目标。</p><h2>七 不盲从</h2><h3>学习服务于人生</h3><p>第四个，不盲从。别人说什么就信什么，动点脑子、智慧。以前有教无类，以后不能成为逆修觉者，我都懒得度化，跟你说话浪费时间。</p><p>别人做什么，不构成我应该做什么的理由。经常听“大家不都这样吗”，马上问：“大家都这样，我为什么要做，对我有什么好处？”</p><p>学习刚说很多，努力学习才有未来，本来是应该有更好未来，学习只是其中一种手段，而且现在用处逐渐削弱。幸福美好才是目的，不是学习。</p><p>学习应该服务人生，而不是人生服务于学习。</p><p>“学习好才能挣钱”，一听就是穷苦家庭、中下贫农、小市民思维，没理解什么是学习，也没理解挣钱。这种学习好后挣钱，大概率是服务资本、打工，不是创业。这里说的学习是课堂文化课，不是自我学习能力，别混了。</p><h3>从多个方面比较技术岗位与包子店</h3><p>没理解一个生意、行为有没有价值的根本。衡量能不能挣钱，第一竞争压力大不大？第二会不会被替代？比如马被汽车、汽车被火车、火车被飞机、飞机被火箭替代，是速度上的替代关系。第三能干多久？第四自我把握度多少？第五扩张时有没有自我生存性，能自我扩张是好生意。</p><p>再往下，换公司、地方、团队，还行不行？最后，干好了能不能传承？用这些衡量年薪百万技术人员和卖包子的，谁更合适。</p><p>年薪百万相当不容易。我可以负责地说，清华北大计算机博士可以；普通985博士，理工科也很难，六七十万不错。海归top前30、热门专业，七八十万以上有可能。</p><p>普通的没戏。普通985本科、非热门专业，一个月两三万就烧高香。干掉全国多少人才能985、清北？拿这钱太辛苦。</p><p>卖包子的，就廊坊我喜欢那家，很破，还不是临街，一年二三十万没问题，小学毕业就可以。同拿二三十万，双方付出成本不对等。</p><p>二三十万，是现在985非热门专业刚毕业能拿的钱。卖包子再努力，挣三四十万，相当于985热门专业硕士。</p><p>竞争压力呢？技术岗位一年一茬招生，还有其他学校。清华至少有北大，还有麻省理工、耶鲁、帝国理工、牛津，很多人竞争。包子也有竞争，但以店为原点，3公里内才有压力。</p><p>超过3公里很少，超过5公里基本不竞争。就算别家好吃10倍，也不会早上专门跑5公里吃。只要干掉3公里内的就OK。</p><p>研发成本简单，一天做一种馅，用AI、看视频，自己做，一年内一定能做出特别厉害的包子铺，我绝对相信。实在干不动这活，就卖包子，300多天研究，也能弄出特别的馅，竞争不难。</p><p>第三，能否替代。计算机、数据库、大模型、AI，一定会被替代。包子几千年没被替代，只要有人类，还愿意吃，被替代可能极小。</p><p>工作周期呢？见过华为几个P8、P9程序员——是不是叫P8、P9，我不知道，反正年薪百万——能干到45岁以后？有生命周期，男的优势45岁前，女的基本40岁前。工作丢了再找，不可能。</p><p>卖包子45岁就没人吃，可能吗？只要能和面、开张，就没这个问题。自我把控，你干得好，但参加政治斗争，是A领导的人，B领导得势要干掉你，把控不高。卖包子，只要口味不下滑、附近人还在，很容易把控。</p><p>自我扩张，技术到35、40岁，再扩张很难，成功性低。卖包子、做生意，我很在意不宣传的情况下，有多少通过口碑扩张。能自我传播，就有生命力，是好生意。一年或三年不宣传，能不能自我复制、扩张？不做广告、不跟人说，闻着味或凭名声过来。</p><p>像我现在疗愈、身心灵这部分，基本不宣传，从不在这里宣传，就看它能不能自己发展。</p><p>能发展，有生命力；不能，可能水平不行。需要广告、促销，本身就有问题。</p><p>再往下，从华为出来，45岁后还有谁接？没有很危险。换公司没人接得住，就出大事。换地方呢？我从北京到廊坊、泰国、马来西亚，不影响挣钱。换公司、地方就挣不到，像从美国到日本就不行，那悠着点，很危险。</p><p>卖包子要允许发展时间。别跑印度，人家不吃包子，你去卖就扯淡。但只要喜欢吃包子的地方，过去能再发展，生命力很强。</p><p>有的人依赖团队、某些人，麻烦。比如田朴珺，不是王石的女人，谁搭理？Angelababy离开黄晓明，自己是什么？景甜离开某些金主爸爸呢？依赖性太强，容易出问题。</p><p>最后两点，一是能否持续增长。做技术没办法持续增长，但只要有人认可我能力、提供的价值，东西就一直增长，是好生意。最后是传承，干一辈子，这代完了下代不行。</p><p>像洗灵师傅，到现在没找到同源传承者，可能就这一代，老了、干不动，洗灵在人间界又消灭了。</p><p>卖包子能传承吗？只要手艺没问题，很容易。要通过这些分析生意好坏，别谁说靠学习挣钱容易就信。</p><p>清华计算机博士，不是顶尖姚班，只是进一线大公司，马上面临这些：容易竞争，每年新生代出来；不是不能替代；有工作周期。</p><p>45岁后能否再找到相同工作，不好说。能否自我把控，好好干就越来越好，做不到；能否扩张，能扩张至于还是打工？换公司、地方、团队、老大支持，就不行。东西不停积累，客户跟着积累吗？以前我做程序员，不断学编程语言，客户还是那些，没产生积累，不是好生意。</p><p>努力一辈子，能不能传下一代？不能，不是好生意。用这些判断好坏。花大价钱培养人成为别人工具，君子不器，很蠢。大目标是持久挣钱、积累、传给下一代，你做不到，只是好用的工具，用旧就扔。</p><h3>职业 创业与彩礼的具体条件</h3><p>从这点说，985工科博士不如包好点的包子店有价值。公务员也得考虑，现在抓多少，不行贿、不玩潜规则能上去？不上去，为伺候领导？还往里钻。有些省、市效益不好，发不出工资；赶上活动、运动，还得自己垫钱帮助民众，脑子有问题。</p><p>中医也这样，“中医你得才行，你不，干不干也就那么回事”。创业，以前年轻经济好，女孩找男的说创业，好；现在男的说创业，赶紧跑，离远点，成功率极低，不一样了。</p><p>彩礼，有钱就要，没什么高低。比如我儿子看上姑娘，别说18万8、28万、38万，188万愿意也给，又不是给不起，家里能扛就给。只一点，别因为彩礼，让生活更艰难、感情破裂、有芥蒂，咬牙结婚，后面都是事。</p><h2>八 穿透表象</h2><h3>从言语和行为看背后的意思</h3><p>别老跟风。第五个，穿透表象，别被表面影响，分析底层意思，学会提问。老婆今天唉声叹气，是不是翻日历？一看生日，一看二月十四，“这不七夕”。</p><p>或者立秋，该秋天第一杯奶茶，要懂事。老婆发脾气，先翻日历、问AI：“今天老婆不高兴，今天什么节日，是不是踩在哪个点？”让AI帮分析，就知道怎么回事。一定学会看表面之下，融到思维。</p><p>领导说：“小王，多吃鱼。这鱼是好鱼，刺太多。”此时说：“领导，吃鱼肚子肉，心腹没有刺。”或者说：“鱼刺多，但有一条主干，有主心骨。”</p><p>明白领导要干什么。菜市场吵架，挑菜叶黄、有洞，这不好那不好，是挑毛病吗？希望赶紧便宜，得明白意思。</p><h3>孩子不写作业时先问为什么</h3><p>孩子不爱写作业，别上来就骂、罚，这么蠢。越说越不敢，得看为什么。为什么叫问道？问为什么：不会、太难、害怕、太困、没兴趣、注意力有问题、家庭有问题，还是谈恋爱？都可能，从现象分析本质。</p><p>解决表象，只让问题暂时消失，找到原因才真正改变。不要只问发生什么，还要问为什么发生，行为、事情背后想告诉什么，真正推动原因是什么。所以今天先讲天道思维，从事情理解天意。</p><h2>九 时间与成本</h2><h3>把时间算成成本</h3><p>第六个，时间与成本。最好把时间算成本。越低收入越不在乎时间，很多时间去消耗；越高收入越在意，计算一小时得失。</p><p>一年挣1000万，除365，再除8小时，大概3400块钱。一小时3600秒，大概率相当于一秒一块。按365天除，但不可能工作365天，按实际工作时间，大概率一秒一块，年薪百万就是一秒一毛。</p><p>马斯克为什么说，你的思维赶不上我的价值、时间，是浪费时间？人家一秒多少钱，甚至几千美元都有可能，我没具体算。他听5分钟汇报，浪费多少时间、钱？</p><p>只有没钱的人不在意。为省20块开车两小时；加油站涨价前排队，一箱油差几毛、几块，排两小时，为这点钱，闲的。</p><p>领10块优惠券研究半小时，便宜50块跑三趟商场，这是浪费时间，对时间能产生的价值没感觉。</p><p>很多人抱怨，“有钱后找他吃顿饭也吃不着，耽误不了多久”。有钱人想的是，跟你吃饭为了什么？有意义思维，就进入不同阶级，只有高收入或对生命有价值的人才思考行动意义。</p><h3>吃饭交往与时间选择</h3><p>三脚踹不出屁，跟你吃什么饭？珍惜几十年同学友情，可以。工作同事没什么交集，不下坏水就不错，离开公司99.99%可能一辈子见不到，在乎什么？</p><p>我个人，吃饭能对他、对我有提升，会去，但只限学生。不是学生，哪有时间？对师门发展有帮助，会去。什么都没有、就为吃饭，目前只有一个高中同学，关系好，将近30年交情。</p><p>为这交情可以吃，否则有功夫还研究东西利益众生，扯这些有什么用？这很重要。</p><h2>十 当下有效性</h2><h3>孩子受伤时先解决眼前问题</h3><p>最后第七个，当下有效性。事情已经发生，此刻最需要处理什么？很多人第一反应不是解决，而是生气、害怕、抱怨、指责、追责、证明对错、发泄。真正问题摆旁边，所有人处理情绪。</p><p>我自己亲历，关车门，儿子平时不扶那儿，这次扶了，我没看到，夹住了。一疼使劲一扥，整个手皮爆出来，血一下出来。</p><p>场面很刺激，老婆急了，孩子叫声跟平时不一样，估计真疼。但此刻最重要，不要发泄，不要紧张。第一，伤的是手指，再严重大不了截肢，也只是手指，对一生不会有太大问题。</p><p>第二，两门之间还留缝，实际上不会太严重。第三，此刻家人安抚、抱孩子，老公赶紧开车找最近医院，做伤口处理，这是应该干的。</p><p>我老婆先打再指责，我说现在都别说话，会影响开车。心情不好撞别人、车，都被耽误。最该处理什么，而不是发泄、论责任，事情已发生，任何对孩子手指没帮助的，现在不要处理。</p><p>还有学生，孩子玩水果刀伤手，爸爸在旁边。妈妈看孩子哭、流血，心疼，先埋怨爸爸“你在旁边干什么吃的”。有没有这么说不知道，据说话可能不太好听。爸爸马上反击：“他自己玩弄的，我还天天盯着？”进入互相埋怨、推卸责任。</p><p>后来夫妻干仗，孩子看没人管，哭着、带着流血手指找姥姥。最该先解决流血，再说平时怎么防范。</p><h3>交通事故中的时间与处理选择</h3><p>撞车，我不先研究谁对错，下车指责“眼睛长哪，怎么开车”，没必要。先衡量处理占多少时间成本、由谁去。如果旁边有人，留下证件等让他帮处理，消耗他的时间比我的合适。</p><p>该拍照、报警就做，报完该走就走。很小的事，报警、认定责任，对方又激动，我就说不管谁，我全责，赶紧弄完；或者给点钱走，跟他说话浪费时间，更多先衡量。</p><p>2011年，老婆晚上开车去机场接谁，忘了。北京机场二高速一条路没灯。</p><p>在里道开，绿化带突然窜出人，捡快车道可乐瓶。来不及，刹车往旁转，撞到GL8。警察来了，说报案就说你全责。老婆问为什么，不是我的事。警察说，是不是不重要，双方有保险；说为躲人，保险公司要追那人责，给你赔钱。他为了可乐瓶跑高速中间，赔得起吗？那人傻傻蹲着。老婆想算了，不管谁全责。</p><p>GL8车主说，看到了，知道一定往这拐，也躲不开，不怪，谁遇上没辙。警察水平还挺好。后来走一个全责，都有保险，各自修车。那人让他走吧，说话不利落，下次跑哪根本预测不了。</p><h3>婚姻出现问题时先看目标与利益</h3><p>老婆发现老公有小三，情绪激动，也要用意义思维评价，此刻所做对处理有没有帮助。思维模型不应该是闹、谁对不起谁，重要是让自己利益最大化。</p><p>第一先想婚姻还要不要，第二考虑老公走上升运还是败运。败运就算了，分家产，反正没感觉，也选择别人，还扯什么。但正在上升运，凭什么把位置让出？</p><p>想都别想，老娘熬也熬死你。此刻坚决跟老公站一起，抵制小三。尤其生孩子想上位，只关心老公在A、B、C哪个运。C运就分，人家找别人；A运，想占后面的运，想都别想。</p><p>生活真有这样的人，这才正确。能不能继续过，看心情、利益、缘分。很多男人找小三图一时，时间长腻，哪个娶回也腻，还得找其他。不用管能跟多久，我们是用规则拯救人类的。</p><h2>十一 意义七问与日常应用</h2><h3>为什么做 能得到什么 值不值得</h3><p>把意义思维浓缩为意义七问，一定融入生活，不然就废。</p><p>第一问，为什么做这件事？先搞清目的。第二问，能得到什么？学完改变什么，解决什么，价值和结果是什么？第三问，值不值？付出这么多，得到值不值？想想包子店和博士后。时间、金钱、健康、精力、风险、关系，值得吗？解决成本问题。</p><p>比如历史上传法
