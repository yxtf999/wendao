法。 给大家一个完整版的说明书，希望大家努力修炼，希望有一天修炼完之后，学会无招胜有招。"},{"id":"ep1-k19","course":"ep1","number":19,"topic":"课程导读","title":"时代背景与改变的必要性","summary":"讲者在本节谈及自己对时代的判断，并把环境变化与适应新规则联系起来。","points":["本节的时代预测与解释属于当次试讲的论述。","其中贯穿的问题是：旧方式遇到新环境时，是否愿意重新调整？"],"start":184,"end":201,"quote":"大家又经历了互联网时代，现在又经历人工智能时代，都一直在淘汰，而且时代越来越近。以前一个时代怎么着也得几十年，现在可能五年、十年就差不多了。","quoteIndex":196,"related":[],"section":"ep1-p183","sectionTitle":"六 时代背景与强者","searchText":"问道一 系列开篇总序 第1课 问道1 时代背景与改变的必要性 讲者在本节谈及自己对时代的判断，并把环境变化与适应新规则联系起来。 课程导读 本节的时代预测与解释属于当次试讲的论述。 其中贯穿的问题是：旧方式遇到新环境时，是否愿意重新调整？ 六 时代背景与强者 这段时间开始讲述的时机 为什么咱们这些东西现在才出来，为什么这段时间才讲？好时机。首先有三个时机，非常好，我说传法好，但是对大家可不见得舒服。 第一个，末法时代，哈哈，末法时代出乱象。首先叫魔作沙门，内部败坏，大家已经看到了，寺庙里抓起来的人已经不少了。然后叫僧俗颠倒，白衣说法。咱们白衣，不过今天穿的是黑衣，下次穿一个白衣。 然后叫五浊恶世，邪见炽盛，乱七八糟的什么都能说。然后叫道德崩坏，人伦失序，咱们就不做解释了，都明白。然后叫女人精进，功德积累，男人懈怠轻法，视沙门如粪土。 你看佛祖老先生，人家在两千五百年前已经说了。所以为什么咱们这叫“群阴慑服，百灵来朝”，就是这种样子，跟群阳没关系。所以最后改变世界靠女人了，男的已经解决不了问题。部分男的可能还有点希望，绝大多数男的咱们放弃吧。 天灾人祸，环境恶化，这都是末法时代的情况。咱们在人间还要经历的，叫经济大萧条。大家请参考一九二九年的全球性经济大萧条，倒牛奶那个就是一九二九年的时候发生的。 大家可以看看，十年经济大萧条。但是我们要经历多少年？二十年，哈哈哈。 时代进步了，总要多增加点年头。是否已经经历了几年？可能刚经历一两年，所以残酷的时间还在后面。未来会有更多家庭出现问题，更多人活不起，活得极其艰难，这个没有办法。同时科技在进步的时候，也在淘汰人。所以人类如果不能活出个一二三，恐怕会活得越来越艰难。 再加上九紫离火运，这好像是好运，但是一般的九紫离火运都不是特别好，哈哈。因为逢九的运代表一个时代的结束，一个运二十年，从一运走到九运，正好一百八十年。这种循环经历过很多次，你们可以看一下历史上的逢九的运，好像都不太好。 为什么？主要是时代的变革，这个时代要结束了。你还坚持用这个时代的东西，只能被淘汰。你不进行人为的淘汰——人类怎么进步？大家经历过很多，比如马车时代，汽车淘汰马车，电力时代、蒸汽机时代、内燃机时代。 还有很多人经历过的，比如像我这个岁数，七十年代人都经历过的计算机时代，九十年代的计算机时代。那个时候我在中关村卖电脑，很挣钱，能有计算机的很少。 时代变更越来越快 大家又经历了互联网时代，现在又经历人工智能时代，都一直在淘汰，而且时代越来越近。以前一个时代怎么着也得几十年，现在可能五年、十年就差不多了。 大概二〇一五年的时候，我记得马云还在说，我拿着望远镜都找不着竞争对手。现在你看他还敢说这话吗？时代变更太快了。 时代变更这么快，不好的东西那么多，我们应该怎么办？我们也一样，只要强者。因为大时代不好的时候，弱者活不下来。 比如特别穷、特别苦的，不是咱们不想度化人家，是你没这本事。你想用木桶原则，他就剩一桶底，一块板都没有，你咋度？这事就交给地藏王菩萨和佛祖度去。人家时间无限，咱们就匆匆几十年，能不能把这些东西讲一遍、讲明白，就算不错了。 所以很费劲，大时代不好的时候，弱者活不下来，只有强者才能活下来。你看看匈奴，还有很多游牧民族，北欧，还有动画片里什么魔族、兽族，全都是苦寒之地。越是苦寒之地，越要求个体强大、个体强悍，否则根本活不下来。 包括北极熊那种东西，越是苦寒之地，越能诞生庞大的动物，因为弱小的不行。反而非洲这些，除了特别大的象和狮子、犀牛，也就那几个稍微大点，其他并不是特别大。"},{"id":"ep1-k20","course":"ep1","number":20,"topic":"学习路径","title":"本讲怎样定义“强者”？","summary":"本讲所说的强者，着重指愿意适应新规则，并敢于否定旧我的人。","points":["强者在这里是一种面对变化的态度与行动要求。","把“愿意改变”放到日常选择中观察，而不只停留在称谓上。"],"start":202,"end":204,"quote":"能适应新规则的人，敢于适应新规则，敢于否定旧我的人，我们称之为强者。","quoteIndex":204,"related":["ep1-k24"],"section":"ep1-p183","sectionTitle":"六 时代背景与强者","searchText":"问道一 系列开篇总序 第1课 问道1 本讲怎样定义“强者”？ 本讲所说的强者，着重指愿意适应新规则，并敢于否定旧我的人。 学习路径 强者在这里是一种面对变化的态度与行动要求。 把“愿意改变”放到日常选择中观察，而不只停留在称谓上。 六 时代背景与强者 能适应新规则的人 我们要的是什么？什么是强者？很简单，只给强者听。那强者是什么？ 能适应新规则的人，敢于适应新规则，敢于否定旧我的人，我们称之为强者。"},{"id":"ep1-k21","course":"ep1","number":21,"topic":"课程导读","title":"三类听众：有缘、智慧、觉醒","summary":"本讲分别用有缘、智慧、觉醒来描述三种进入课程的方式。","points":["有缘：觉得有帮助，愿意听、学，并尝试改变。","智慧：通过理论与逻辑分析理解内容。","觉醒：讲者用自身的轮回观解释听后被唤起理解的体验。"],"start":205,"end":215,"quote":"有缘众生是什么？不管你有钱没钱、有学问没学问，过得好与不好，只要听完这个东西之后，觉得对你有帮助，愿意听、愿意学，愿意根据上面的东西改变自己，我们称之为有缘众生。","quoteIndex":207,"related":[],"section":"ep1-p183","sectionTitle":"六 时代背景与强者","searchText":"问道一 系列开篇总序 第1课 问道1 三类听众：有缘、智慧、觉醒 本讲分别用有缘、智慧、觉醒来描述三种进入课程的方式。 课程导读 有缘：觉得有帮助，愿意听、学，并尝试改变。 智慧：通过理论与逻辑分析理解内容。 觉醒：讲者用自身的轮回观解释听后被唤起理解的体验。 六 时代背景与强者 有缘众生智慧众生与觉醒众生 我们同时也要有缘众生、智慧众生和觉醒众生。 有缘众生是什么？不管你有钱没钱、有学问没学问，过得好与不好，只要听完这个东西之后，觉得对你有帮助，愿意听、愿意学，愿意根据上面的东西改变自己，我们称之为有缘众生。 就像我们现在很多学生，以前讲的神神鬼鬼的东西，哪个能摸得着、看得着？哪个能证实？但为什么你就信？缘分。 包括仙总，自己学紫微，当时我教紫微的时候学过来。那自己学吗？压根不学，就是听着那声音，觉得可信，就跑过来。 我记得好像现在还有一个，是一个大厂的高管，也是听了我的课、听了我的声音。他说分辨一个人，就看这个人说得自信不自信、逻辑合理不合理。刚开始听一两集，觉得这个人太能忽悠。 再听，好像说得有道理。所以这叫给有缘众生，他通过声音判断，我觉得非常重要。 第二是智慧众生，说白了脑子得在线。智慧众生是什么？纯粹用理论、逻辑分析你说得对不对。 所以你看，咱们特别能吸引清华的人，我就纳闷，怎么北大的那么少？哈哈，吸引的都是清华的，难道曾经跟清华很有缘分？有可能。这个叫智慧众生，纯靠人家脑子在线，一说就能明白，没问题。 第三个叫觉醒众生。在轮回之中，我讲的这些东西并不稀奇，你肯定听过，只是在轮回的时候喝了孟婆汤，忘了。所以我一讲就激发了你，找回了你天魂的记忆，这叫觉醒众生，“一修说醒了”。 我跟你说，你们评论区里说的有颜众生，这不行，到时候我媳妇会很有意见，不能只度化有颜众生，那就真的出事了。"},{"id":"ep1-k22","course":"ep1","number":22,"topic":"课程导读","title":"传播的三个阶段","summary":"讲者把未来传播设想为从初期听众，到成功案例吸引学习者，再到更广泛跟随的过程。","points":["第一阶段：有缘、智慧、觉醒三类听众。","第二阶段：学习者受到实际案例吸引。","第三阶段：形成更广泛的跟随；这是本讲对未来的设想。"],"start":216,"end":222,"quote":"第二阶段，是第一阶段积累了一定的众生之后，这些众生根据你的东西度化成功了，有很多成功案例可以往外放。这个时候，有些人奔着成功案例来：他成功了，我能不能按这个东西解决我的问题？","quoteIndex":219,"related":[],"section":"ep1-p183","sectionTitle":"六 时代背景与强者","searchText":"问道一 系列开篇总序 第1课 问道1 传播的三个阶段 讲者把未来传播设想为从初期听众，到成功案例吸引学习者，再到更广泛跟随的过程。 课程导读 第一阶段：有缘、智慧、觉醒三类听众。 第二阶段：学习者受到实际案例吸引。 第三阶段：形成更广泛的跟随；这是本讲对未来的设想。 六 时代背景与强者 度化的三个阶段 好，这同时也是未来咱们度化的三个阶段。我跟你说，人类世界去度化众生，就是三个阶段。 第一个，就是给有缘、智慧、觉醒这三类众生听。因为不是这三个属性的，根本听不懂、听不下去，也坚持不了。你给他说，他脑子理解不了，就属于这种样子。 第二阶段，是第一阶段积累了一定的众生之后，这些众生根据你的东西度化成功了，有很多成功案例可以往外放。这个时候，有些人奔着成功案例来：他成功了，我能不能按这个东西解决我的问题？ 所以第二阶段是奔着成功案例来的，也叫学习众生，希望通过你的东西学习。 第三阶段叫跟风众生，那就三五十年之后了。咱们如果不发展出几百万、上千万信徒，没人跟风。 你看有些佛教的，就属于进入跟风阶段了，说一念阿弥陀佛，往生极乐。这就不要求你懂不懂，只要信就行。这是三大阶段。"},{"id":"ep1-k23","course":"ep1","number":23,"topic":"学习路径","title":"听众的六个条件","summary":"本讲列出的六个条件，涉及接受现实、改变自己、课程信念前提、学习规则、重构认知与成就众生。","points":["接受真相与现实；愿意修正自己并对抗旧我。","接受讲者所列的因果、轮回与高维信念前提；学习并应用规则。","理性分析、重构认知；完善自我、圆满自我、成就众生。"],"start":223,"end":253,"quote":"第五，要足够理性，分析推导，并且重构自己的认知，这非常重要。用全新的认知替换过去的认知，因为过去的认知有问题，包括整个人类过去的认知，很多东西都有问题。","quoteIndex":248,"related":["ep1-k24","ep2-k28"],"section":"ep1-p223","sectionTitle":"七 听众的六个条件","searchText":"问道一 系列开篇总序 第1课 问道1 听众的六个条件 本讲列出的六个条件，涉及接受现实、改变自己、课程信念前提、学习规则、重构认知与成就众生。 学习路径 接受真相与现实；愿意修正自己并对抗旧我。 接受讲者所列的因果、轮回与高维信念前提；学习并应用规则。 理性分析、重构认知；完善自我、圆满自我、成就众生。 七 听众的六个条件 七 听众的六个条件 接受真相与接受现实 咱们未来的听众，也要求有六个条件，不是没条件。以前那些东西就是图个乐，很多神神鬼鬼的，还有自己经历，你愿意听，啥条件都不给规定。但现在没点水平，还别来。 这几个条件是什么？第一个，接受真相，接受现实。 我们不仅讲人间的真相，也会讲到各个位面的真相。所以如果你不能接受真相，就不要听了。你连真相都接受不了，我不去给一个叫不醒的人费劲。 可能有很多真相不太好听。比如结婚，男女生过三十五岁之后很麻烦。包括女性离婚喜欢带孩子，带孩子和不带孩子的再婚率完全不一样，带男孩和带女孩的再婚率又不一样。所以我不管你爱听不爱听，这是真相。 知道这个真相之后，你找的时候就找靠谱的，别找能离婚的。你为了自己的很多东西，我喜欢帅的、喜欢有钱的，最后找了一个不靠谱的，离婚了，自己带着孩子，那只能说你活该。 因为我会告诉你哪些东西会怎样，包括你不结婚，到多少岁的时候，那个孤独感解决不了。你能接受就接受，不能接受就拉倒，我才不会哄你，你就等着物竞天择吧。 所以为什么咱们故事会叫闲聊？为什么人类说明书是在末法时代、九紫离火运和经济大萧条的时候出来？你有没有想过？ 当时二〇一八年的时候，我还搓火呢。我说，让我做个阴阳师，能不能让我在盛世的时候做？这快经济大萧条了，让我做阴阳师，挣谁钱去？这不等着饿死吗？后来我发现，你就记住，上天如果想给予你的，一定是你意料不到的——意料不到的好处。所以九紫离火运最重要的，是把大家全都打回原形。怎么打回原形？你天天让人过得很幸福，每个人都觉得自己可……了。那玩意能听你的，能重新理解世界，重新审视自己错了？不扯淡吗？都觉得自己—— 我命由我不由天。你让他先放飞一段时间，由自己一段时间，等吃不上饭的时候，就觉得这还是天定。 愿意改变自己并对抗旧我 第二件事情，愿意改变自己，修正自己，并且有足够的毅力对抗旧我，很难。 其实这就是我们说的“平时即命运”。比如我爱吃、爱喝小啤酒、爱吃小烤串，你要控制量。不控制量，就做好以后——脑血栓、对身体不好的情况的准备。因为我们家族已经发生很多事了。 现在你看我一直带着这个东西。现在找到窍门了，血糖一到6，就可以开始加餐了。以前为什么高？你都在吃饭的时候，又想吃米饭，又想吃肉，还想吃水果，还想喝可乐，所有高糖的东西都加在一起。 那不就高了吗？你可以等它下来的时候，苹果；等它再下来的时候，可乐，哪个也没耽误。但是这叫对抗旧我，因为之前的吃饭方式会产生血糖的极大波动。 以前没这个东西，也不知道天天血糖有多高。所以我很推荐这个东西，到时候讲真相，我会直接说，它对你了解一个人的血糖、改变饮食习惯极有帮助，特别有帮助。 以前我二〇〇九年就得糖尿病，开始打胰岛素了，但一直控制不好血糖，就是因为没有实时监控。有实时监控的时候，对这个东西就很清楚。我们家现在好多人、老人都弄上这东西，血糖现在全都很正常。 这就叫对抗旧我，很难受。光不吃主食、少吃主食这件事情，我直接用了十年去改变，很难受。 相信因果轮回与高维生物 第三，相信因果，相信轮回，相信这个世界有高维生物。 咱们前期逆修觉者这块，也不涉及什么神神鬼鬼的东西。但是所有的基础，是你得相信因果，相信轮回，相信世界上有更高维的生物影响我们。我们可能看不到、摸不着，但是你必须得信，不信不行。如果接受不了，那咱们就别看了，下面都别看了。 学习规则与应用规则 第四，相信一切皆是规则演化，要学习规则，应用规则。 理性分析并重构认知 第五，要足够理性，分析推导，并且重构自己的认知，这非常重要。用全新的认知替换过去的认知，因为过去的认知有问题，包括整个人类过去的认知，很多东西都有问题。 比如今天举例的，公司的很多东西，你看所有公司都出现这个问题吧？我跟你说，所有公司都错了。 很多人类公司之所以没有办法发展壮大，甚至壮大一段时间之后，必然出现员工之间的恶意伤害，叫内部管理的问题，是一定的，百分之百。 这里谁做得最好？稻盛和夫。因为稻盛和夫是真的爱自己员工，真愿意把这个东西分给员工，这点做得非常到位。 完善自我圆满自我与成就众生 第六，愿意完善自我，圆满自我，成就众生。"},{"id":"ep1-k24","course":"ep1","number":24,"topic":"学习路径","title":"知道要改变，为什么仍然很难？","summary":"本讲用改变日常习惯的经历，说明“知道”与持续对抗旧有习惯之间仍有距离。","points":["改变不仅是同意一个道理，还包含反复调整日常做法。","这一节与第二课的“设定锁”可以对照阅读。"],"start":234,"end":241,"quote":"第二件事情，愿意改变自己，修正自己，并且有足够的毅力对抗旧我，很难。","quoteIndex":235,"related":["ep2-k15","ep3-k12"],"section":"ep1-p223","sectionTitle":"七 听众的六个条件","searchText":"问道一 系列开篇总序 第1课 问道1 知道要改变，为什么仍然很难？ 本讲用改变日常习惯的经历，说明“知道”与持续对抗旧有习惯之间仍有距离。 学习路径 改变不仅是同意一个道理，还包含反复调整日常做法。 这一节与第二课的“设定锁”可以对照阅读。 七 听众的六个条件 愿意改变自己并对抗旧我 第二件事情，愿意改变自己，修正自己，并且有足够的毅力对抗旧我，很难。 其实这就是我们说的“平时即命运”。比如我爱吃、爱喝小啤酒、爱吃小烤串，你要控制量。不控制量，就做好以后——脑血栓、对身体不好的情况的准备。因为我们家族已经发生很多事了。 现在你看我一直带着这个东西。现在找到窍门了，血糖一到6，就可以开始加餐了。以前为什么高？你都在吃饭的时候，又想吃米饭，又想吃肉，还想吃水果，还想喝可乐，所有高糖的东西都加在一起。 那不就高了吗？你可以等它下来的时候，苹果；等它再下来的时候，可乐，哪个也没耽误。但是这叫对抗旧我，因为之前的吃饭方式会产生血糖的极大波动。 以前没这个东西，也不知道天天血糖有多高。所以我很推荐这个东西，到时候讲真相，我会直接说，它对你了解一个人的血糖、改变饮食习惯极有帮助，特别有帮助。 以前我二〇〇九年就得糖尿病，开始打胰岛素了，但一直控制不好血糖，就是因为没有实时监控。有实时监控的时候，对这个东西就很清楚。我们家现在好多人、老人都弄上这东西，血糖现在全都很正常。 这就叫对抗旧我，很难受。光不吃主食、少吃主食这件事情，我直接用了十年去改变，很难受。"},{"id":"ep2-k01","course":"ep2","number":1,"topic":"课程导读","title":"先读开场：这是试讲版本","summary":"第二课再次说明试讲、收集意见、修改和正式录制的过程。","points":["一时看不明白，可以留待回看与后续学习。","本讲保留进一步修订的空间。"],"start":37,"end":51,"quote":"这是《问道》的第二集，还是那个原则：试讲，就是吐槽版。大家听完之后，有听不明白的、有意见的、有需要吐槽的，直接到那四个群里去吐槽，到时候会有人帮大家收集。我看一下，没什么问题了，再修改，修改完之后去录制咱们正式版的文档。","quoteIndex":48,"related":[],"section":"ep2-p36","sectionTitle":"一 开场与本期说明","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 先读开场：这是试讲版本 第二课再次说明试讲、收集意见、修改和正式录制的过程。 课程导读 一时看不明白，可以留待回看与后续学习。 本讲保留进一步修订的空间。 一 开场与本期说明 近况与试讲安排 大家晚上好。今天晚上的内容一定很烧脑，看不明白没关系，以后慢慢看。就跟佛经、道经似的，一次也看不明白，着什么急？也不影响自己吃喝。所以今天看不完、看不明白，不要着急，淡定，一定要淡定。 还有，跟大家说一下，以后不要再给我寄东西了。我家又收到了一些东西，也不知道是谁寄的，还是肩颈的，听说是仙总的学生。人家老给我东西，我都没有表达过自己的谢意，这有点不太合适。所以大家以后还是不要寄东西，这样最好。 第二，我的很多问题，不是你们帮忙买个什么东西就能解决的。不过还好，到现在为止，基本上我身上各种各样的问题都解决了。之前是脑子有问题，咱给脑子开了一个天窗，放放气，这一下就变聪明了。 第二是血糖有问题，一戴上这东西，严格控制自己的饮食，血糖也正常了。第三个是肩周炎。最近我们家苍蝇都少了很多，以前碰着它，你不敢打，现在恢复了，我发现使劲打的时候，胳膊已经不疼了。现在消灭苍蝇的速度大幅提升，苍蝇已经很难在我们家驻足了。肩周炎也基本上好了，可以正常睡觉了，我觉得非常好。 最后就是高血压。前几天我发现，是不是该换药了？突然一下子脑子就聪明了，说不行，该换药了，因为之前那药吃了三年了。去大医院换了一下药，真贵，半个月400马币。但这个药好像是德国的药，还不错，有些东西调整了剂量。 刚吃第一天的时候还挺凑合，这玩意不吃还不长血糖，怎么吃了之后反而血糖更高了？但要耐心给它一点时间，发现吃了第三天之后，整个血糖都正常了，这个还是挺厉害的。所以到现在为止，基本上大病小病都解决了，我觉得非常好。 今天声音稍微有点变，嗓子发炎了，搞不清楚怎么回事，可能会影响声音。但咱们主要是试讲，能把事说清楚就行。 你看，就像走运、走大运，我正好是2025年开始走大运。你在走大运的时候，碰着一些倒霉的事先别着急，它有可能是让你提前发现问题。发现问题之后，赶紧把问题解决，你才能够上升。 到现在为止，关于身体的问题都解决得不错。糖尿病和高血压都快20年了，解决不了的事，现在解决得基本上还挺不错。脑子这个问题其实一直都有，算是我人生里面最大的一个坎。不是说以后脑子不出问题，可能还会出，但是至少没有比这个更大的了。所以记住，你在运上的时候出现点问题，其实是一件好事，它在善意地提醒你，赶紧把它解决。 好，咱们不耽误大家，正式开始。今天内容非常多，一时半会儿能不能讲完还不知道，我尽可能讲，说不定今天就要讲两个小时，你们慢慢听。 这是《问道》的第二集，还是那个原则：试讲，就是吐槽版。大家听完之后，有听不明白的、有意见的、有需要吐槽的，直接到那四个群里去吐槽，到时候会有人帮大家收集。我看一下，没什么问题了，再修改，修改完之后去录制咱们正式版的文档。 这一期本来想周二给大家讲，但是东西实在太绕。我自己琢磨来琢磨去，憋到周三，才给一些写框架的学生试讲了一下。他们也提出了一些意见，所以周四、周五又修改，到今天反正也改不出来了，就是它吧。 能听懂，咱们就听；听不懂，等以后我的智慧水平更高，录《问道》第二版的时候再修改。这版实在是改不动了，太费劲了。我的原则是随缘，能想明白到什么地步，就想明白到什么地步，坚决不难为自己。你们能听明白就听明白，听不明白，就等下次我又想明白了，你再继续听，别着急，淡定。 好，咱们正式开始《问道》第二集讨论版。先做上期回顾：上期说了，我们要做人类说明书，这个节目叫《问道》，希望这套内容能够帮助大家认识真相、规则、正确的生活方向。"},{"id":"ep2-k02","course":"ep2","number":2,"topic":"迷与困","title":"本讲所说的“梦”有四个条件","summary":"讲者用梦来展开对轮回与现实的理解，并明确说明这是个人观点。","points":["四个条件：入幻、不真实、有故事性、身在其中时感到真实。","本节的作用是说明后文的比喻与讨论前提。"],"start":52,"end":60,"quote":"闲聊体系，就是所有东西都是我个人对一些事情的观点。今天讲的，也是我个人对现实中这场轮回大梦怎么坑害我们的一些想法。咱们只是闲聊，你能悟到什么，纯属于缘分。个人观点，闲聊，不是科学，咱也不为拿什么奖，我也不会给你证明什么。","quoteIndex":60,"related":[],"section":"ep2-p36","sectionTitle":"一 开场与本期说明","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 本讲所说的“梦”有四个条件 讲者用梦来展开对轮回与现实的理解，并明确说明这是个人观点。 迷与困 四个条件：入幻、不真实、有故事性、身在其中时感到真实。 本节的作用是说明后文的比喻与讨论前提。 一 开场与本期说明 本期讲轮回怎样把人困住 这一期要讲什么？既然咱们要写人类说明书，你要知道轮回是怎么坑害你的。知道之后，你就知道怎么用人类说明书去对抗轮回对你的坑害。我们要知道它怎么做，我们怎么防。所以这一集主要说的是，轮回是怎么坑害你的。 下一集，也就是第三集，咱们再说，你应该怎么用人类说明书去防范这些事。这是咱们这两集的内容。 轮回坑害你的主要方式，我们称之为入梦。大家一点都不生疏，佛祖在《金刚经》上讲的“梦幻泡影”，这句话大家听过很多次。整个佛教也在说，你处的是一个假的世界。没看佛教，也不影响马斯克这样的人说，我们活在一个虚拟的世界里。这都是说我们在梦中。 在梦中要有什么特性？想想自己做梦的时候会碰到什么。第一个叫入幻；第二，你做的这些东西肯定不真实，是假的；第三，梦不能只是直接在里面待着，它一定要有一些故事性。哪怕坐花轿、娶媳妇，也是一个故事。 第四，你在梦中要感觉这是真的。虽然是假的，大家醒了之后都知道，但不妨碍你在梦里的时候，真实感很强。一个梦需要具备这四个条件。 梦与现实的关系是什么？其实不太好说，你自己去感觉。佛祖也说了，马斯克也说了，但你自己感觉我们的世界是真实的。包括双缝干涉实验、量子纠缠、微观不确定，你会发现很多事情，实际上都证明这个世界足够虚假。但我又不是科学家，我也证明不了什么。 我只能跟你们说，我相信佛祖老人家说的东西，我们生活在梦幻泡影中。咱们做这个节目不是为了证明这个，不是为了得诺贝尔奖。我也没有那么科学，没那么严谨，我只是个人，咱们本来就是一个闲聊的体系。 闲聊体系，就是所有东西都是我个人对一些事情的观点。今天讲的，也是我个人对现实中这场轮回大梦怎么坑害我们的一些想法。咱们只是闲聊，你能悟到什么，纯属于缘分。个人观点，闲聊，不是科学，咱也不为拿什么奖，我也不会给你证明什么。"},{"id":"ep2-k03","course":"ep2","number":3,"topic":"迷与困","title":"迷、困、觉、醒，分开理解","summary":"本讲把“觉”与“醒”分开，依次讨论从重复与受困，到发现问题与修正问题。","points":["迷：反复走在错误中；困：被边界与习惯限制。","觉：发现原有认知、思维或行为有问题；醒：进一步修正造成伤害的问题。"],"start":61,"end":61,"quote":"那么我们来说，梦首先有四个阶段，请大家一定记住：第一个阶段叫迷，第二个是困，把你困住；第三个就是咱们努力的阶段，叫觉；第四个阶段是醒。咱们经常说觉醒，但觉和醒是两个事。古人的话经常是一个字代表一个意思，所以觉和醒是两个事，就是迷、困、觉、醒四个字。","quoteIndex":61,"related":["ep2-k04","ep2-k17","ep3-k04"],"section":"ep2-p36","sectionTitle":"一 开场与本期说明","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 迷、困、觉、醒，分开理解 本讲把“觉”与“醒”分开，依次讨论从重复与受困，到发现问题与修正问题。 迷与困 迷：反复走在错误中；困：被边界与习惯限制。 觉：发现原有认知、思维或行为有问题；醒：进一步修正造成伤害的问题。 一 开场与本期说明 那么我们来说，梦首先有四个阶段，请大家一定记住：第一个阶段叫迷，第二个是困，把你困住；第三个就是咱们努力的阶段，叫觉；第四个阶段是醒。咱们经常说觉醒，但觉和醒是两个事。古人的话经常是一个字代表一个意思，所以觉和醒是两个事，就是迷、困、觉、醒四个字。","note":{"title":"第三课已修订概念","text":"第三课将两者分开：觉醒是发现或确定问题；解脱是不再伤害、永不复现。第二课正文保留当时的表述。","target":"ep3-p68","label":"查看第三课修订"}},{"id":"ep2-k04","course":"ep2","number":4,"topic":"迷与困","title":"“迷”的三个特性与三种重复","summary":"本讲从迷路、迷宫的例子说明，迷包含找不到方向、做错事情、反复回到原点。","points":["重复可能跨代发生，也可能换一种表面形式继续。","还有一种重复，是明知后果却仍然照做。"],"start":63,"end":75,"quote":"当错误不是偶然发生，而是持续重复的时候，人类不是单纯遇到了一个问题，而是被困在某个规则里，在原地打转。这就是我们所说的梦中的迷。","quoteIndex":70,"related":["ep2-k07","ep2-k18"],"section":"ep2-p62","sectionTitle":"二 迷 在错误中不断重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 “迷”的三个特性与三种重复 本讲从迷路、迷宫的例子说明，迷包含找不到方向、做错事情、反复回到原点。 迷与困 重复可能跨代发生，也可能换一种表面形式继续。 还有一种重复，是明知后果却仍然照做。 二 迷 在错误中不断重复 迷的三个特性 首先，什么是迷？这个咱们经常经历。比如迷路，你在错误的道路上走来走去，找不到方向，这叫迷路。如果碰着鬼打墙，是不是也是迷路？鬼打墙最重要的是重复再重复，经常回到原点。走迷宫也是，走着走着，又走回原点了。 所以被迷的时候有几个东西：第一，找不到方向；第二，做的事情是错误的，你做的事情如果正确，那不就不迷了吗？第三，经常会重复。这是迷的三个特性。 我们人类很多时候，也是深入泥潭中而不自知。对于轮回大梦来说，它要迷住我们，让我们不停地重复犯错误。我们把这个称之为迷，这一点很重要。 到现在为止，物质文明已经发展到令人惊叹的地步，可是精神文明基本上原地打转。思维上的问题，我们和几千年前的古人一样：古人碰到什么问题，你还能碰到；古人犯什么错，你还犯什么错。这不仅仅是人性的问题，也是思维惯性的问题。 所以现在像冯唐给你讲《资治通鉴》，为什么？因为你可以通过古人所做的事情，知道我现在碰到这些事应该怎么办。 通过研究古人来解决今天的很多问题，核心原理就是：很多问题的本质压根没有变过，古人犯的问题，我们一直在重复。 当错误不是偶然发生，而是持续重复的时候，人类不是单纯遇到了一个问题，而是被困在某个规则里，在原地打转。这就是我们所说的梦中的迷。 轮回大梦有三个特性。第一个叫跨代重复。上一代犯过的错误，下一代就算看明白了，该犯还犯。历史可以变化，人物可以变化，时代可以变化，但痛苦的结构没有变化。 第二个叫形式仍然重复。有些东西只是表面上解决了，实质上换汤不换药。比如炫富，古人在炫富，现代人也在炫富；古人爱美，你也爱美；还有仇富，尤其是同学或者家里的亲戚，谁富了，说“他也有今天”。说闲话，古人说闲话，你也没少说。 古代说看他起高楼、宴宾客、楼塌了，你看现在的企业家不都一样吗？只是事不一样，性质压根一样。过去男的有点钱喜欢去青楼，现在去KTV、夜总会，本质上没有什么区别，只不过没有“熟人”这么一说了。之前想多找一个老婆，叫娶妾，现在叫找小三。说法不一样，本质一样。 婚姻与职场里的重复 第三种是明知后果，仍然重复。比如发脾气，谁都知道不好、不对，但是阻止你发脾气了吗？该发的时候不还发吗？这叫本能性的反应。"},{"id":"ep2-k05","course":"ep2","number":5,"topic":"追问根源","title":"婚姻案例：善意是否用对了方向？","summary":"讲者通过争执、择偶与处理关系的案例，讨论出发点与实际结果为何可能不一致。","points":["只证明自己没错，可能忽略关系是否还能继续。","只看外在条件，也可能忽略经营关系和面对风险的能力。"],"start":74,"end":82,"quote":"下面快点说一些案例。夫妻发生矛盾的时候，双方都在证明自己没错，却没人关心这段关系能不能继续。父母总担心孩子的婚姻，为其把关，希望孩子幸福。","quoteIndex":76,"related":["ep1-k10"],"section":"ep2-p62","sectionTitle":"二 迷 在错误中不断重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 婚姻案例：善意是否用对了方向？ 讲者通过争执、择偶与处理关系的案例，讨论出发点与实际结果为何可能不一致。 追问根源 只证明自己没错，可能忽略关系是否还能继续。 只看外在条件，也可能忽略经营关系和面对风险的能力。 二 迷 在错误中不断重复 婚姻与职场里的重复 第三种是明知后果，仍然重复。比如发脾气，谁都知道不好、不对，但是阻止你发脾气了吗？该发的时候不还发吗？这叫本能性的反应。 下面快点说一些案例。夫妻发生矛盾的时候，双方都在证明自己没错，却没人关心这段关系能不能继续。父母总担心孩子的婚姻，为其把关，希望孩子幸福。 但我们更多关注的是对方的物质条件是否匹配，却很少关注两个孩子是否能够经营婚姻，以及对抗未来的风险。所以人类的婚姻大多数不幸福，尤其在剧烈变动的今天，婚姻稳定性更差，离婚率更高。父母这份关心并没有真正解决实际问题，整个解决问题的方向都错了。 夫妻一方发现对方出轨，第一时间一哭二闹三上吊，手撕小三，昭告亲友，本意是想保住婚姻、出口气，但最后反而促成婚姻彻底决裂，自己也遍体鳞伤。古代这么干，现在也一样。 前几天还有一个女同学跟我诉苦，说老公大男子主义。古代有大男子主义，现在也有。古代好多男的觉得自己老婆笨，现在好多男的也没觉得自己老婆多聪明。 好多婚姻的问题，是老婆压根不知道生活成本是什么。整个生活运行起来，成本不少，可她忽视这个东西。我们之前讲成本思维，还有增量思维。当有这两个思维的时候，你放心，这个婚姻好不了了，因为这个时候她所有的东西都觉得理所应当。所以很多婚姻出问题，女的觉得“我离开你没有问题”，等真离开时发现不对。她从来没有算过这些。 现在的婚姻构成里面，男方为此付出了多少？整个生活质量都是谁付出的？付出了多少？她完全不算这个东西，好多女生都是这样。好多婚姻出问题，来自于她越觉得理所应当，越忽略男士在此的付出。 有的时候，一个男的一个月为家庭付出几万块钱，还不如她随便找一个健身教练，说“你真好，你很自信”，多夸她几句，她觉得这个人很好。真正供养她的，她觉得很一般。古代这样，现在也一样。"},{"id":"ep2-k06","course":"ep2","number":6,"topic":"追问根源","title":"职场里的反复循环","summary":"本讲列举追责、甩锅、拉帮结派和人才培养等情境，观察应对方式怎样让旧问题继续。","points":["只追究责任，可能使人把精力放在隐藏问题。","明知需要准备，却一直等待，也是讲者讨论的重复模式。"],"start":83,"end":89,"quote":"职场也是，公司一出问题就追责，所有人学会的不是避免问题，而是隐藏问题和甩锅。最后没人愿意承担问题，也没人愿意创造，创造越多、揽事越多、问题越多，倒霉的就越多。","quoteIndex":83,"related":[],"section":"ep2-p62","sectionTitle":"二 迷 在错误中不断重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 职场里的反复循环 本讲列举追责、甩锅、拉帮结派和人才培养等情境，观察应对方式怎样让旧问题继续。 追问根源 只追究责任，可能使人把精力放在隐藏问题。 明知需要准备，却一直等待，也是讲者讨论的重复模式。 二 迷 在错误中不断重复 职场也是，公司一出问题就追责，所有人学会的不是避免问题，而是隐藏问题和甩锅。最后没人愿意承担问题，也没人愿意创造，创造越多、揽事越多、问题越多，倒霉的就越多。 办公室里经常拉帮结派。自己本身很讨厌拉帮结派，但为了保护自己，也得拉帮结派，最后活成了自己讨厌的人。老板害怕培养出能代替自己的人，越不培养，公司越没有人才，最后永远无法发展壮大。 中年危机，我亲自体验过。我们之前做程序员的时候，所有人都知道自己有中年危机。35岁、40岁、45岁的程序员，你看看公司里有没有这样的人，没有就知道了。所以你也知道，早晚有一天公司要把你辞退，应对的方式就是做两手准备。 但你会发现，自己每一天都活在痛苦中、等待中，拿不出太多时间真正为自己做两手准备，更多是在等待最后那个时刻出现。HR真正找你的时候，既害怕，也松了一口气，终于落定了。 这就好比一个死刑犯知道自己活不了了，但是不知道哪天枪毙他。最恐怖的不是枪毙的时候，而是等待死亡的时候。一直都是这样。 一个人为了获得权力参与斗争，获得权力后又害怕失去，只能进入更大的权力斗争，官场基本如此。你看像我们伟大祖国，还有一些其他地方，都是这样。为什么官场斗争越来越严重？他不能放，一放就完蛋了。 开会明明有不同意见，也不说，都顺着领导讲场面话。方案出了问题，又开始互相甩锅。"},{"id":"ep2-k07","course":"ep2","number":7,"topic":"迷与困","title":"为什么历史案例仍能被借鉴？","summary":"讲者把古今相似的问题，作为观察人类思维模式反复出现的切入口。","points":["比较案例时，不只看人物和时代是否相同。","继续追问问题结构、处理方式和结果是否仍在重复。"],"start":90,"end":96,"quote":"为什么要学历史？历史能够对你有帮助的本质，是你相信历史会重演。这也同时代表，人类的思维模型没有进步。但凡进步了，历史对你无用，因为这件事情不会再重复。但凡事情的工作原理重复了，就代表人类在这儿没有进步。这是很重要的反推，也就是所谓魔咒。","quoteIndex":93,"related":[],"section":"ep2-p62","sectionTitle":"二 迷 在错误中不断重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 为什么历史案例仍能被借鉴？ 讲者把古今相似的问题，作为观察人类思维模式反复出现的切入口。 迷与困 比较案例时，不只看人物和时代是否相同。 继续追问问题结构、处理方式和结果是否仍在重复。 二 迷 在错误中不断重复 历史为什么还能给今天借鉴 下一次开会，还是继续说场面话，没人说真话。财富方面，我就不多说了。类似的事情，我不是发给你们群里了吗？你可以把我给的案例放到AI上。我基本上放到GPT上，你花点钱，别弄那个最简单的版本。 把这些东西输入进去，只需要说：“帮我找出人类类似的、一直活在错误中且不自知的案例。”你去找，无穷无尽。你看完几百上千个案例之后，真的会觉得人类从来没进步过。 为什么要学历史？历史能够对你有帮助的本质，是你相信历史会重演。这也同时代表，人类的思维模型没有进步。但凡进步了，历史对你无用，因为这件事情不会再重复。但凡事情的工作原理重复了，就代表人类在这儿没有进步。这是很重要的反推，也就是所谓魔咒。 我希望大家都去用AI找一下，真的是方方面面，哪里都有，非常恐怖。 我希望有一天，我们未来碰到的问题，历史对你没有借鉴作用，就代表人类在提升。可能没有真正走出去，走出轮回，但至少提升了，不再用之前的经验解决现在的问题。 这个就是迷。像魔咒一样，我们一直在错误中反复犯错，有的可能知道，有的可能不自知。这就是世尊所说的梦幻泡影，我们一直活在梦中而不自知，一直重复经历消耗人类的事情。这就是梦的“迷之力量”，力量的力。它用这种力量把你抓住，让你在里面迷失，这是非常重要的点。"},{"id":"ep2-k08","course":"ep2","number":8,"topic":"迷与困","title":"小困是约束，大困是自由","summary":"本讲用两种“困”的比喻，区分能直接察觉的限制与难以发现的边界。","points":["明显的限制容易引发反抗。","若从未考虑边界在哪里，就可能把有限空间理解为全部自由。"],"start":98,"end":101,"quote":"当你不知道边界在哪里，也不会产生被困的想法，这才是最可怕的。真正难以识破的牢笼，是让你看不到边界，甚至真心相信自己已经获得自由。所以大困靠自由。","quoteIndex":101,"related":["ep2-k09","ep2-k10"],"section":"ep2-p97","sectionTitle":"三 困 看不见边界的牢笼","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 小困是约束，大困是自由 本讲用两种“困”的比喻，区分能直接察觉的限制与难以发现的边界。 迷与困 明显的限制容易引发反抗。 若从未考虑边界在哪里，就可能把有限空间理解为全部自由。 三 困 看不见边界的牢笼 小困是约束 大困是自由 第二个是困。记住，困比迷更厉害，而且是整个轮回把你框在轮回之内的一个非常重要的手段。困分为大困和小困。小困比较简单，称之为约束，但大困是给你自由。 明显的约束可以让人产生反抗。把你圈在一个地方，你肯定不干；但是我让你哪里都能去，就是出不了地球，你觉得够玩了，觉得自己自由，但实际上一直被锁在地球上。所以大困是自由，小困是约束。 当你不知道边界在哪里，也不会产生被困的想法，这才是最可怕的。真正难以识破的牢笼，是让你看不到边界，甚至真心相信自己已经获得自由。所以大困靠自由。"},{"id":"ep2-k09","course":"ep2","number":9,"topic":"迷与困","title":"井蛙的三个阶段","summary":"井蛙的故事依次呈现看不到外面、看到却出不去，以及突破后认定自己已经自由。","points":["井盖盖上：没有接触不同世界的机会。","井盖打开：看见希望，但难以到达。","爬出井口：取得突破，也可能因此停止继续追问边界。"],"start":102,"end":114,"quote":"当青蛙真正通过自己的努力逃出牢笼，最大的问题，是它认为自己自由了。当它产生一个“我自由了”的心时，才是最大的牢笼。因为它从此连“我是不是不自由”这个想法都不会再有，它认定自己通过努力获得了自由。","quoteIndex":113,"related":["ep2-k12"],"section":"ep2-p97","sectionTitle":"三 困 看不见边界的牢笼","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 井蛙的三个阶段 井蛙的故事依次呈现看不到外面、看到却出不去，以及突破后认定自己已经自由。 迷与困 井盖盖上：没有接触不同世界的机会。 井盖打开：看见希望，但难以到达。 爬出井口：取得突破，也可能因此停止继续追问边界。 三 困 看不见边界的牢笼 井蛙的三个阶段 我们用一只青蛙来解释，叫井蛙的故事，一共分三个阶段。第一个阶段，井盖盖上了，什么都看不着，一直黑漆漆的。青蛙从出生那一刻就没看到过光，这个时候它最安静。为什么？因为它从来没有看到过不同，连外面有没有另外一个世界都不知道。 我记得之前有一次洗灵，看到过一个地狱的场景，里面所有众生从来没见过光。如果有一天你到这个地狱去传法，说外面很光明，他都不知道光是什么。这个才最可怕，因为没有这个东西，就没有办法产生意识差，没有追求。你跟他说的东西，他不知道，从来没听说过，这最麻烦。 第二个阶段，是给你希望，但是你够不着。 突然有一天，把井盖拿开了，它看到了蓝天白云、白天黑夜，可能还能看到星光、月亮，但信息极其有限。它知道井里是一个世界，井外是一个世界。 最麻烦的是什么？井壁是垂直的，你想往外爬，对不起，爬不了，很难。知道不知道外面？知道，但是想出去很困难。努力几次之后就放弃了，还是那句话：“臣妾做不到。”这个时候，它会主动放弃，这也是一种困。 就像很多监狱有铁栅栏，不是看不到外面的天，但是你出不去。你会跟铁栅栏较劲吗？大概率不会，因为知道较劲没用。 第三个阶段，也是最可怕的。比如在井里修个小斜坡，青蛙脚上有吸盘，它慢慢爬。你给它设置点困难，但又能让它经过努力，慢慢爬出井口。当它爬出井的那一刻，看到了满天繁星、日月轮转，天地如此广阔，世界如此缤纷。 你想它会怎么想？是不是很开心，觉得自己通过努力终于脱困了？只是它不知道，有一种困，是我在意识上困住你；有一种困，是给予你自由，而且还是通过你自己努力得到的自由。 比如大家看过的电影，《基督山伯爵》和《肖申克的救赎》。电影时间有限，只能通过历经困难、隐忍算计、慢慢行动，最后有一天终于出去了。 出去之后，就开始进入复仇和嘚瑟的环节了，因为这是电影。如果我想拍一个100集的电视剧怎么办？前50集，是他在监狱里面难受；后30集，他终于出了监狱；再后20集，他发现出了监狱，还在人家的算计中。这才最有意思。 当青蛙真正通过自己的努力逃出牢笼，最大的问题，是它认为自己自由了。当它产生一个“我自由了”的心时，才是最大的牢笼。因为它从此连“我是不是不自由”这个想法都不会再有，它认定自己通过努力获得了自由。 这就是井蛙、大困小困，我们用青蛙这个事情给大家做一个案例。所以困有三个境界。"},{"id":"ep2-k10","course":"ep2","number":10,"topic":"迷与困","title":"习以为常，为什么会停止追问？","summary":"本讲将“不觉得异常”视为受困的重要表现：人会把熟悉的东西理解为本该如此。","points":["看不到真实、看到却放弃、突破后认定已自由，是本讲归纳的三种方式。","“一直这样”是否足以说明“这样合理”，是这一节引出的追问。"],"start":115,"end":123,"quote":"它拿走了你识破它的能力，最重要的就是“一切皆正常”，你会有习以为常、本该如此的想法。","quoteIndex":123,"related":["ep2-k14"],"section":"ep2-p97","sectionTitle":"三 困 看不见边界的牢笼","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 习以为常，为什么会停止追问？ 本讲将“不觉得异常”视为受困的重要表现：人会把熟悉的东西理解为本该如此。 迷与困 看不到真实、看到却放弃、突破后认定已自由，是本讲归纳的三种方式。 “一直这样”是否足以说明“这样合理”，是这一节引出的追问。 三 困 看不见边界的牢笼 困的三个境界与习以为常 第一个，我不让你看到真实，完全不让你看到，把井盖关上。当一个人生活在既有认知里，从未接触系统之外的东西，就不可能对这个系统产生怀疑。你根本不知道梦之外是什么，连醒这件事都不知道，怎么可能醒？记住，第一件事，是不让你看到真实。 第二个，我让你看到一点点，但永远得不到。你经过努力，最后得不到，自己放弃了。这个也没问题，但是很少用。 第三个，完成突破，于是相信自己自由了。这种最可怕。尤其把这些合在一起用，就是我们人类最大的问题。 第一件事，不让你看到真实。第二件事，有一些真实传过来了。你看2500年前，佛祖、老子、基督、真主都一块儿传，有没有把世界之外的真实往下传？传了，但是只给你看了一点点，很难实现。最后你们把它定义成封建迷信，觉得这是忽悠、不实之言，这是你们自己定义的。 第三件事，向人类开放科技，让人类可以通过科技改变自身的物质生活。人类不是没有看到过真实，曾经看到过一点点，但绝大多数外面的情况完全不知道。又给你开放一点真实、一点科技树，让你觉得可以掌控自己的命运。 这个时候，人类基本上完全被迷住了，因为你相信自己自由，相信可以改变世界，相信我命由我不由天。这就是把人类困住的三种方式。 困住你最大的目的，是所有东西都让你觉得习以为常，这是梦境最大的厉害之处。无论自己做梦，还是在人生的轮回大梦中，最重要的一点，是梦会把你识破它的能力拿走，让你相信这个梦境正常、正确，没有异常，一切合情合理。 它拿走了你识破它的能力，最重要的就是“一切皆正常”，你会有习以为常、本该如此的想法。"},{"id":"ep2-k11","course":"ep2","number":11,"topic":"三把锁","title":"三把锁：看不见、不追问、改不了","summary":"本讲用真相锁、思维锁、设定锁，分别讨论信息输入、提问习惯与行为惯性。","points":["真相锁：接触到的信息有边界。","思维锁：发现问题却没有继续追问。","设定锁：明知道不对，仍然难以改变。"],"start":124,"end":165,"quote":"那么，梦困住你的手段是什么？三把锁：第一把是真相锁，第二把是思维锁，第三把是设定锁。真相锁很简单，我不让你看到真实。真相解决的是输入问题。","quoteIndex":127,"related":["ep2-k12","ep2-k14","ep2-k15","ep3-k03"],"section":"ep2-p124","sectionTitle":"四 三把锁怎样把人锁住","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 三把锁：看不见、不追问、改不了 本讲用真相锁、思维锁、设定锁，分别讨论信息输入、提问习惯与行为惯性。 三把锁 真相锁：接触到的信息有边界。 思维锁：发现问题却没有继续追问。 设定锁：明知道不对，仍然难以改变。 四 三把锁怎样把人锁住 四 三把锁怎样把人锁住 真相锁 让你看不到系统之外 现实中也一样。我们太习惯身边发生的一切，并不觉得自己生活在梦幻泡影中，认为这一切难道不正常吗？当你认为一切皆正常的时候，大概率就活在轮回给你设置的梦境中。 那么，梦困住你的手段是什么？三把锁：第一把是真相锁，第二把是思维锁，第三把是设定锁。真相锁很简单，我不让你看到真实。真相解决的是输入问题。 当一个人只能接触系统内的东西，你再聪明，也只能看到系统内的东西。脑子非常好使，最多能做到丰富、深入、替换、总结，但绝对不可能突破这套系统。 这跟之前讲的熵增一样，具体的我给忘了，那个意思是在一个封闭的系统中，如果没有外力改变，这个系统总会越来越混乱，越来越消耗。你看《三体》里面，第三部叫《死神永生》。 最后宇宙的结果，就是如果宇宙之外没有力量来帮助，所有星球、所有生命都会进入热寂效应。整个宇宙越来越乱，能量不停地消耗。现在行星、恒星，包括黑洞所干的事情，都叫瞎折腾，除了瞎折腾，什么都没干。 打破熵增的是什么？系统外的能量。那打破我们死循环的是什么？也是系统外的两个东西：一个是系统外的能量，称之为功德；一个是系统外的认知，称之为智慧。系统内解决不了，因为看不到真相，看不到真相就不可能做出正确选择。 咱们别拿普通人为例，拿圣人为例。历史上主要的这些圣人，有没有逃出去？第一梯队，同一时期四大圣人：佛陀、老子、上帝、真主。可能上帝那边应该叫耶稣吧，真主那儿应该是穆罕默德。咱不太懂，但反正这四位圣人过来传法，有没有解决人类的问题？解决了一些。 但大多数人仍然在梦中。有没有人想解脱？想解脱，但认知不足以突破，最终只是做了一个叫解脱的梦。说白了，只是换了一个姿势继续睡。 当你看不到高维的东西，我们称之为低维无解。CPU再好，你只能做丰富、深入、更替、总结，不可能突破。 熟知的圣人，比如孔子，有没有探知系统外的东西？没有。孔子成圣，是立规矩、下定义，比如什么是君子，什么是小人。因为那个时候，战国后期——对不起，战国时代，基本上大家都乱了，没有标准，甚至赡养老人都得讨论讨论。 孔子在这个阶段非常重要，他给大家立了一个标准，人应该怎么活。但这个事情只是立规矩，并没有改变人类的思维模式，只是用现有系统的规矩约束了一下、改进了一下，性质没有改变，该发生的问题还会发生。 王阳明干的事情叫深入，他真正深入了一下，但他说的所有东西，还是在整个系统范围之内。 曾国藩干了什么？叫丰富。他很善于总结，也看了很多前人的书，所以有基础进行丰富。他把很多东西归类、整理，然后丰富了一下。但无论怎样，他们所做的事情，只不过是洞察通透、抓本质、归纳总结，除此以外也就这样，仍然活在思维茧房之内。 小到个人，大到人类，基本上没有突破。比如很多学生，包括我合作的老张，清华、北大的，还有很多伟人，智商明显碾压我，水平比我强很多。但智商高，只解决了CPU好。思考再多，也没有太大的意义，因为只能做丰富、深入、更替、总结，不可能突破，你没有看到系统外的真实。 AI也一样。我用AI做东西，只让它帮我找资料，比如找那些人类一直在犯错误、却没有任何察觉的事情，它能给你找一堆。搁我自己，我哪里总结得出这么多？所以脑子确实没有AI好使，但AI没有看过系统外的东西。 你让它总结什么是智慧、空色、因果、慈悲，它一定下不了定义，只能在人类现有认知里面查找，并且在这之上做一点总结归纳和提升。想做出更深刻的东西，做不到，因为没看到过那个东西。 当我不让你看到世界更真实的东西时，你再聪明没有用。这就是真相锁。再怎么聪明、再怎么研究，也没有用。盖上井盖之后，你怎么可能想到井盖之外是什么？ 比如要想明白贪或者嗔，很难。贪基本上是让你快乐的事情，从来没有人一天打你800个嘴巴，然后你说“我很贪”，这做不到。为什么这么让我快乐的事情会伤害我？因为拉长了看，让你现在快乐的事情，未来会让你付出代价，会让你痛苦，所以贪才不对。 假设做的事情现在快乐，未来快乐，永久快乐，那为什么不做？只有现在做很快乐，但未来会倒霉，所以我们认为贪不好。 嗔的原理是什么？我现在愤怒了、发脾气了，可能伤害了对方，或者对方伤害了我。有的时候，我觉得自己是正义的，我用自己认为正义、有道理的方式还击对方。 但在更久远、更长远的时间里看，就是两个笨蛋互相咬，两条狗互相咬。甭管谁的理由更对一点，本质上没什么区别。嗔就是要解决这个事情。 你不以轮回的角度看待，就理解不了贪嗔。用人类的思维，站在人类一世的角度，理解不了它为什么伤害你。所以必须站在轮回之外看轮回，才能明白很多。 思维锁 看到问题却不再追问 第二个叫思维锁，让你看到，但是想不到。思维锁不是让人没有发现矛盾、没有发现问题，而是让人习惯性停在某个位置，不是一有问题就追根问到底，一发现毛病就打破砂锅问到底。 它让人习惯性不问、不想，下意识不往那个方向想。当我把思维给你锁上时，世间不是没有问题，是你压根不往那个方向想。这才是思维锁最大的问题，它呈现的一个重要东西就是一切皆正常。 你不觉得这是一件很意外的事。看不见，是信息的边界；不去问，是思维的边界。两者叠加，人既缺少新信息，也失去寻找新信息的动力。这就是我们为什么叫《问道》。 《问道》最重要的一点，是破思维锁。让你学会问为什么，经常质疑，恢复提问和追问的能力，这对我们很重要。 举一些简单的例子。比如智慧，你从来不去想：智慧是什么？对我们有什么用？能帮我们干什么？佛教里面讲了那么多空色，学了对我们有什么用？除了知道这个世界是假的，还有什么用？《道德经》说阴阳、说道，我知道有这个东西，它能解决生活中的什么问题？你从来不去想。 为什么要结婚？为什么要生孩子？为什么要学习？学习重要吗？学历重要吗？ 设定锁 明知道不对仍然改不了 你有去想这些问题吗？不是它没有问题，是你下意识没去想，这才是最大的问题。 第三把锁叫设定锁。轮回怎么把你困住？就是让你明知道这个东西不对，但仍然改不了。这涉及原罪。原罪叫与生俱来，天生就会，不用学习。人类有一些天生就会自动运行、不需要学习，却会伤害自己和他人的行为、习惯，我们称之为原罪。 原罪分为三种。第一种叫天生原罪，像情绪、贪婪、嫉妒，五毒四心里面说的这些，基本上都是天生原罪。从来不需要专门学习，但绝对与生俱来。没听说谁不学一下贪、不学一下嗔，就没有贪念、不会生气。知识得学，这东西不用学。 这叫本能、天生设定。这些东西不仅被设定了，还会影响整个人类。就算知道发脾气不对，你也改不了，这就是原始设定。 第二种叫文明植入的原罪。不是人出生自带的，每个时代不一样，但每个时代都有一堆人被它影响。比如这个时代，孩子要好好学习。古代有一段，朱熹之后、民国之前，要求女人裹脚，大家都裹。 你说这对不对？肯定不对，不是残害女性吗？把脚裹得变形，多少人痛苦过来的？责任大了。但那个时候大家觉得对，女人不裹脚嫁不出去，甚至很多女的因为不裹脚而羞耻。你说这是不是很奇怪？这个叫社会原罪。 包括养老问题，有的社会有养老，有的社会不兴养老，也是社会植入的东西。重男轻女，有的社会重，有的社会不重。还有女生喜欢上嫁、慕强，也都是社会造成的。 第三种是家庭和环境造成的原罪。一个区域，以及父母的习惯、认知，都会影响你。比如东北的暴脾气，会影响离婚率。离婚率居高不下，全国第一，是东北的。但是东北夫妻遇到的问题，南方不会遇到吗？其实南方也会，只不过大家处理的方式不一样，造成离婚率不一样。 怎么办？没办法，因为他爷爷奶奶、爸爸妈妈都是这样，从小到大看到的所有人、所有朋友，处理问题都用这种方式。在他的认知里，没有出现过用其他方式处理相应问题的办法，所以只会用这种方法解决，下意识用这种方法。这叫环境产生的原罪。 好，咱们说了这么多困住你的方式。"},{"id":"ep2-k12","course":"ep2","number":12,"topic":"三把锁","title":"真相锁：思考受输入的边界影响","summary":"讲者区分思考能力与信息来源，认为只在既有范围内思考，仍可能难以突破原有认知。","points":["聪明与知道得多，并不自动消除输入信息的限制。","本讲用封闭系统、井盖和资料总结等比喻展开这一观点。"],"start":125,"end":142,"quote":"当一个人只能接触系统内的东西，你再聪明，也只能看到系统内的东西。脑子非常好使，最多能做到丰富、深入、替换、总结，但绝对不可能突破这套系统。","quoteIndex":128,"related":["ep2-k14","ep4-k13"],"section":"ep2-p124","sectionTitle":"四 三把锁怎样把人锁住","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 真相锁：思考受输入的边界影响 讲者区分思考能力与信息来源，认为只在既有范围内思考，仍可能难以突破原有认知。 三把锁 聪明与知道得多，并不自动消除输入信息的限制。 本讲用封闭系统、井盖和资料总结等比喻展开这一观点。 四 三把锁怎样把人锁住 真相锁 让你看不到系统之外 现实中也一样。我们太习惯身边发生的一切，并不觉得自己生活在梦幻泡影中，认为这一切难道不正常吗？当你认为一切皆正常的时候，大概率就活在轮回给你设置的梦境中。 那么，梦困住你的手段是什么？三把锁：第一把是真相锁，第二把是思维锁，第三把是设定锁。真相锁很简单，我不让你看到真实。真相解决的是输入问题。 当一个人只能接触系统内的东西，你再聪明，也只能看到系统内的东西。脑子非常好使，最多能做到丰富、深入、替换、总结，但绝对不可能突破这套系统。 这跟之前讲的熵增一样，具体的我给忘了，那个意思是在一个封闭的系统中，如果没有外力改变，这个系统总会越来越混乱，越来越消耗。你看《三体》里面，第三部叫《死神永生》。 最后宇宙的结果，就是如果宇宙之外没有力量来帮助，所有星球、所有生命都会进入热寂效应。整个宇宙越来越乱，能量不停地消耗。现在行星、恒星，包括黑洞所干的事情，都叫瞎折腾，除了瞎折腾，什么都没干。 打破熵增的是什么？系统外的能量。那打破我们死循环的是什么？也是系统外的两个东西：一个是系统外的能量，称之为功德；一个是系统外的认知，称之为智慧。系统内解决不了，因为看不到真相，看不到真相就不可能做出正确选择。 咱们别拿普通人为例，拿圣人为例。历史上主要的这些圣人，有没有逃出去？第一梯队，同一时期四大圣人：佛陀、老子、上帝、真主。可能上帝那边应该叫耶稣吧，真主那儿应该是穆罕默德。咱不太懂，但反正这四位圣人过来传法，有没有解决人类的问题？解决了一些。 但大多数人仍然在梦中。有没有人想解脱？想解脱，但认知不足以突破，最终只是做了一个叫解脱的梦。说白了，只是换了一个姿势继续睡。 当你看不到高维的东西，我们称之为低维无解。CPU再好，你只能做丰富、深入、更替、总结，不可能突破。 熟知的圣人，比如孔子，有没有探知系统外的东西？没有。孔子成圣，是立规矩、下定义，比如什么是君子，什么是小人。因为那个时候，战国后期——对不起，战国时代，基本上大家都乱了，没有标准，甚至赡养老人都得讨论讨论。 孔子在这个阶段非常重要，他给大家立了一个标准，人应该怎么活。但这个事情只是立规矩，并没有改变人类的思维模式，只是用现有系统的规矩约束了一下、改进了一下，性质没有改变，该发生的问题还会发生。 王阳明干的事情叫深入，他真正深入了一下，但他说的所有东西，还是在整个系统范围之内。 曾国藩干了什么？叫丰富。他很善于总结，也看了很多前人的书，所以有基础进行丰富。他把很多东西归类、整理，然后丰富了一下。但无论怎样，他们所做的事情，只不过是洞察通透、抓本质、归纳总结，除此以外也就这样，仍然活在思维茧房之内。 小到个人，大到人类，基本上没有突破。比如很多学生，包括我合作的老张，清华、北大的，还有很多伟人，智商明显碾压我，水平比我强很多。但智商高，只解决了CPU好。思考再多，也没有太大的意义，因为只能做丰富、深入、更替、总结，不可能突破，你没有看到系统外的真实。 AI也一样。我用AI做东西，只让它帮我找资料，比如找那些人类一直在犯错误、却没有任何察觉的事情，它能给你找一堆。搁我自己，我哪里总结得出这么多？所以脑子确实没有AI好使，但AI没有看过系统外的东西。 你让它总结什么是智慧、空色、因果、慈悲，它一定下不了定义，只能在人类现有认知里面查找，并且在这之上做一点总结归纳和提升。想做出更深刻的东西，做不到，因为没看到过那个东西。 当我不让你看到世界更真实的东西时，你再聪明没有用。这就是真相锁。再怎么聪明、再怎么研究，也没有用。盖上井盖之后，你怎么可能想到井盖之外是什么？"},{"id":"ep2-k13","course":"ep2","number":13,"topic":"三把锁","title":"把时间拉长，再看眼前的得失","summary":"本讲在讨论贪与嗔时，强调把当前感受放进更长时间中观察。","points":["现在让人快乐的行为，可能在后来产生代价。","此刻觉得有理的反击，也要看双方长期付出了什么。"],"start":143,"end":147,"quote":"假设做的事情现在快乐，未来快乐，永久快乐，那为什么不做？只有现在做很快乐，但未来会倒霉，所以我们认为贪不好。","quoteIndex":144,"related":["ep6-k09","ep10-k04"],"section":"ep2-p124","sectionTitle":"四 三把锁怎样把人锁住","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 把时间拉长，再看眼前的得失 本讲在讨论贪与嗔时，强调把当前感受放进更长时间中观察。 三把锁 现在让人快乐的行为，可能在后来产生代价。 此刻觉得有理的反击，也要看双方长期付出了什么。 四 三把锁怎样把人锁住 比如要想明白贪或者嗔，很难。贪基本上是让你快乐的事情，从来没有人一天打你800个嘴巴，然后你说“我很贪”，这做不到。为什么这么让我快乐的事情会伤害我？因为拉长了看，让你现在快乐的事情，未来会让你付出代价，会让你痛苦，所以贪才不对。 假设做的事情现在快乐，未来快乐，永久快乐，那为什么不做？只有现在做很快乐，但未来会倒霉，所以我们认为贪不好。 嗔的原理是什么？我现在愤怒了、发脾气了，可能伤害了对方，或者对方伤害了我。有的时候，我觉得自己是正义的，我用自己认为正义、有道理的方式还击对方。 但在更久远、更长远的时间里看，就是两个笨蛋互相咬，两条狗互相咬。甭管谁的理由更对一点，本质上没什么区别。嗔就是要解决这个事情。 你不以轮回的角度看待，就理解不了贪嗔。用人类的思维，站在人类一世的角度，理解不了它为什么伤害你。所以必须站在轮回之外看轮回，才能明白很多。"},{"id":"ep2-k14","course":"ep2","number":14,"topic":"三把锁","title":"思维锁：问题出现后，还追问吗？","summary":"思维锁并不一定意味着没发现问题，也可能意味着习惯性停在某个答案上。","points":["看不见，是信息的边界；不去问，是思维的边界。","本讲把恢复“为什么”的提问能力，作为《问道》的重要用意。"],"start":148,"end":154,"quote":"你不觉得这是一件很意外的事。看不见，是信息的边界；不去问，是思维的边界。两者叠加，人既缺少新信息，也失去寻找新信息的动力。这就是我们为什么叫《问道》。","quoteIndex":151,"related":[],"section":"ep2-p124","sectionTitle":"四 三把锁怎样把人锁住","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 思维锁：问题出现后，还追问吗？ 思维锁并不一定意味着没发现问题，也可能意味着习惯性停在某个答案上。 三把锁 看不见，是信息的边界；不去问，是思维的边界。 本讲把恢复“为什么”的提问能力，作为《问道》的重要用意。 四 三把锁怎样把人锁住 思维锁 看到问题却不再追问 第二个叫思维锁，让你看到，但是想不到。思维锁不是让人没有发现矛盾、没有发现问题，而是让人习惯性停在某个位置，不是一有问题就追根问到底，一发现毛病就打破砂锅问到底。 它让人习惯性不问、不想，下意识不往那个方向想。当我把思维给你锁上时，世间不是没有问题，是你压根不往那个方向想。这才是思维锁最大的问题，它呈现的一个重要东西就是一切皆正常。 你不觉得这是一件很意外的事。看不见，是信息的边界；不去问，是思维的边界。两者叠加，人既缺少新信息，也失去寻找新信息的动力。这就是我们为什么叫《问道》。 《问道》最重要的一点，是破思维锁。让你学会问为什么，经常质疑，恢复提问和追问的能力，这对我们很重要。 举一些简单的例子。比如智慧，你从来不去想：智慧是什么？对我们有什么用？能帮我们干什么？佛教里面讲了那么多空色，学了对我们有什么用？除了知道这个世界是假的，还有什么用？《道德经》说阴阳、说道，我知道有这个东西，它能解决生活中的什么问题？你从来不去想。 为什么要结婚？为什么要生孩子？为什么要学习？学习重要吗？学历重要吗？"},{"id":"ep2-k15","course":"ep2","number":15,"topic":"三把锁","title":"设定锁：三种习惯来源","summary":"本讲将自动运行、难以改变的行为习惯，分为天生设定、文明植入、家庭与环境三类。","points":["有些反应不需要专门学习就会出现。","社会观念、家庭示范与周围的处理方式，也会塑造默认反应。","讲者用“原罪”称呼这些可能伤害自己与他人的默认行为。"],"start":155,"end":165,"quote":"第三把锁叫设定锁。轮回怎么把你困住？就是让你明知道这个东西不对，但仍然改不了。这涉及原罪。原罪叫与生俱来，天生就会，不用学习。人类有一些天生就会自动运行、不需要学习，却会伤害自己和他人的行为、习惯，我们称之为原罪。","quoteIndex":157,"related":["ep1-k24","ep2-k31"],"section":"ep2-p124","sectionTitle":"四 三把锁怎样把人锁住","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 设定锁：三种习惯来源 本讲将自动运行、难以改变的行为习惯，分为天生设定、文明植入、家庭与环境三类。 三把锁 有些反应不需要专门学习就会出现。 社会观念、家庭示范与周围的处理方式，也会塑造默认反应。 讲者用“原罪”称呼这些可能伤害自己与他人的默认行为。 四 三把锁怎样把人锁住 设定锁 明知道不对仍然改不了 你有去想这些问题吗？不是它没有问题，是你下意识没去想，这才是最大的问题。 第三把锁叫设定锁。轮回怎么把你困住？就是让你明知道这个东西不对，但仍然改不了。这涉及原罪。原罪叫与生俱来，天生就会，不用学习。人类有一些天生就会自动运行、不需要学习，却会伤害自己和他人的行为、习惯，我们称之为原罪。 原罪分为三种。第一种叫天生原罪，像情绪、贪婪、嫉妒，五毒四心里面说的这些，基本上都是天生原罪。从来不需要专门学习，但绝对与生俱来。没听说谁不学一下贪、不学一下嗔，就没有贪念、不会生气。知识得学，这东西不用学。 这叫本能、天生设定。这些东西不仅被设定了，还会影响整个人类。就算知道发脾气不对，你也改不了，这就是原始设定。 第二种叫文明植入的原罪。不是人出生自带的，每个时代不一样，但每个时代都有一堆人被它影响。比如这个时代，孩子要好好学习。古代有一段，朱熹之后、民国之前，要求女人裹脚，大家都裹。 你说这对不对？肯定不对，不是残害女性吗？把脚裹得变形，多少人痛苦过来的？责任大了。但那个时候大家觉得对，女人不裹脚嫁不出去，甚至很多女的因为不裹脚而羞耻。你说这是不是很奇怪？这个叫社会原罪。 包括养老问题，有的社会有养老，有的社会不兴养老，也是社会植入的东西。重男轻女，有的社会重，有的社会不重。还有女生喜欢上嫁、慕强，也都是社会造成的。 第三种是家庭和环境造成的原罪。一个区域，以及父母的习惯、认知，都会影响你。比如东北的暴脾气，会影响离婚率。离婚率居高不下，全国第一，是东北的。但是东北夫妻遇到的问题，南方不会遇到吗？其实南方也会，只不过大家处理的方式不一样，造成离婚率不一样。 怎么办？没办法，因为他爷爷奶奶、爸爸妈妈都是这样，从小到大看到的所有人、所有朋友，处理问题都用这种方式。在他的认知里，没有出现过用其他方式处理相应问题的办法，所以只会用这种方法解决，下意识用这种方法。这叫环境产生的原罪。 好，咱们说了这么多困住你的方式。"},{"id":"ep2-k16","course":"ep2","number":16,"topic":"觉醒与解脱","title":"“觉”的四种触发","summary":"讲者把发现原有系统有问题的触发，归纳为反差、逻辑矛盾、痛苦与他人点醒。","points":["看见反差，或发现原有解释不合理。","痛苦促使人重新审视，也可能有人指出此前忽略的问题。","这里的“觉”着重于开始发现问题。"],"start":166,"end":193,"quote":"下面再说觉，给人类产生希望的觉，马上入场了。觉是什么？其实很简单，发现不对了：“好像我被忽悠了。”觉察、觉醒，都是这个。发现不对，我要从原有系统中脱离出来，发现原有系统的认知、思维、行为有问题，这就是觉。","quoteIndex":168,"related":["ep2-k17"],"section":"ep2-p166","sectionTitle":"五 觉 发现原有系统有问题","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 “觉”的四种触发 讲者把发现原有系统有问题的触发，归纳为反差、逻辑矛盾、痛苦与他人点醒。 觉醒与解脱 看见反差，或发现原有解释不合理。 痛苦促使人重新审视，也可能有人指出此前忽略的问题。 这里的“觉”着重于开始发现问题。 五 觉 发现原有系统有问题 五 觉 发现原有系统有问题 第一种触发 反差太大 下面再说觉，给人类产生希望的觉，马上入场了。觉是什么？其实很简单，发现不对了：“好像我被忽悠了。”觉察、觉醒，都是这个。发现不对，我要从原有系统中脱离出来，发现原有系统的认知、思维、行为有问题，这就是觉。 觉一共有四种。你自己想想，从睡梦中要醒来，只可能发生四种。 第一种，反差实在太大了。比如假设做梦娶媳妇，梦到娶范冰冰，虽然反差大，但不痛苦，这是多美妙的梦，为什么要醒？多睡会儿。那如果做梦发现娶了凤姐，觉得太噩梦、太痛苦了，赶紧醒了吧，这叫反差大。 再比如发现别人长了八个鼻子、九个嘴，明显不对，这也叫反差太大。不好意思，对不起凤姐，咱们只能用她来说。 但现实中反差大很难，因为你对现有的生活、人类经历的这些东西都习以为常。你觉得，难道人类不需要这样生活吗？你没看到系统之外的真实，就不觉得这个世界奇怪。 如果经常能看到天界、佛界、鬼界、阿修罗界，看到诸天位面，看完再看人间，你就会想：“我怎么到这儿了？”因为你没看到过人间界之外的东西，所以觉得人间一切皆正常。 所以很难产生反差。包括之前说的蓝天白云，其实在整个轮回的诸天位面里面，蓝天白云的界面并不多。搁我们经常看外面的，看到这个界面居然是蓝天白云，会多看一会儿。其他的天不是蓝的，不是蓝的多，蓝的少，所以觉得不一样，挺稀奇。 搁你，你觉得这不是傻子吗？天天看，蓝天白云有什么可看的？所以，没有反差，就很难从这个梦中惊醒。 第二种触发 发现逻辑不合理 第二件事，叫逻辑上不合理。这是从梦中醒来的一种方式，我们只是说一下。实际上能在梦中觉得这个梦不合理的很少，纵观整个人类，在现实中觉得不合理的也非常少。 比较熟悉的，龙树菩萨算其中一个。那么多佛教徒里面，能在现实里找到这个世界逻辑上不合理的，好像也就是龙树。他发明了一种叫“哥白尼反转”的梦话方式和思维方式。按照他那一套东西走，最后你会发现，所有东西都不符合逻辑。 不符合逻辑，就应该是假的，这是他的观点。能做到这种地步，我也做不到，人家确实洞察力、分析能力极高，才能发现。 对于咱们，也就发现点双缝干涉：光的成像怎么能根据观测和不观测，产生两种情况？它怎么知道我在观测？不合理，你就觉得这个世界是假的。但很难，所以我们只是在学术上列出这么一个东西，现实中真正能做到的很少。 最主要的还得有反差。你得知道系统外的世界是什么样子，才会觉得系统内有问题。 第三种触发 痛苦超出承受范围 第三个叫痛苦，痛苦刺激超出承受范围。比如在梦中，一堆鬼追你，打不过，最后哭了，醒了。我记得喜灵师傅有一次，好像是恶鬼化成恶犬，直接咬他的手臂，连骨头茬都咬出来了。 在梦里痛得实在受不了，突然醒了。所以能在梦中醒来，绝大多数不是睡到点了，就是痛醒、吓醒的。不刺激、不痛苦，想从梦中醒来挺费劲。假设这个梦一直不可能醒来的情况下，你得有痛苦。 所以你会发现，人类世界真正愿意追求真理的，叫心不死道不生。你不痛到一定程度，怎么会否认或者重新审视自己的思维、所思所行是否正确？你不会认为自己错误。 比如天天幸福，每天中个500万彩票，一堆美女或者帅哥追着你，要吃有吃、要喝有喝，要别墅有别墅。 要游艇有游艇，你会反思这不正常吗？更多是觉得实力所归，老天终于看到我的实力，太好了。你大概率不会反思。能在幸福中反思的都是厉害人，绝大多数人都在痛苦中反思。 所以每逢人类大灾大难之时，都是人类突破的时候。 很多科技突破，不是在战争，就是在大灾中。要没有黑死病在欧洲折腾100年，一半人，人类医学肯定突破不了。很多东西也是在战争中突破的，这没办法。所以要想改变，必须给人类痛苦。 为什么现在我们传法的时候，正好赶上这些？ 末法时代、五浊恶世、经济大萧条、九紫离火运，为什么都是这些？不让大家痛得冒泡，大家想不到我要改变，就是这样。 第四种触发 被人点醒 第四个触发，是被人点醒。所以找一个好老师很重要。能遇到一个明白人，愿意跟你说点真话，在轮回中非常难。像以前的那些圣人，就很难得。"},{"id":"ep2-k17","course":"ep2","number":17,"topic":"觉醒与解脱","title":"本讲对“觉醒”的具体定义","summary":"本讲将觉醒定义为发现、改正、清除那些让自己受伤害的认知、想法和行为。","points":["发现一个问题，修正一个问题，是逐步推进的过程。","不只停留在“想明白了”，还要观察认知和行为有没有变化。"],"start":195,"end":203,"quote":"发现、改正、清除轮回中让自己受伤害的一切认知、想法和行为。你能做到这点，就称之为觉醒。","quoteIndex":202,"related":["ep2-k18","ep2-k31","ep3-k04"],"section":"ep2-p194","sectionTitle":"六 醒 让伤害自己的错误不再重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 本讲对“觉醒”的具体定义 本讲将觉醒定义为发现、改正、清除那些让自己受伤害的认知、想法和行为。 觉醒与解脱 发现一个问题，修正一个问题，是逐步推进的过程。 不只停留在“想明白了”，还要观察认知和行为有没有变化。 六 醒 让伤害自己的错误不再重复 觉醒需要一个清楚的定义 说完迷、困、觉，最后该说醒了。醒这个部分也比较多。首先需要有一个定义，什么是觉醒？你自己去找AI，它一定没有统一标准。整个人类历史在很多东西上，没有具体定义，这很奇怪。 传统定义说，从沉睡、迷惑、错误或者麻木状态中清醒过来，产生觉悟，这叫觉醒。稍微靠点边的说法是：“觉醒不是我想明白了一个问题，而是导致我痛苦和轮回的根本无明被破除。”这个说得靠谱点，但什么是无明？又没说。 底下又来一个大明白，说“明心见性就是觉醒”。何为明心？何为见性？明到什么地步，见到什么地步，怎么明？又没说。不仅中国，其他地方也一样，不把事说清楚，这是特别讨厌的一件事。 所以不看古人了，咱靠自己。先说点玩笑的：“醒来不做梦中事”，就称之为醒，这个定义不好，继续；“让自己和众生一切错误的过去不再重复”，好像靠点边；“让鉴古知今、学史明志再没有意义”，也有点贴边；“一层一层、一个一个消灭人类的顽疾”，这也算是。 你看，这些是AI总结的，它没有给出具体定义，而是用描述的方式解释。给你的叫描述性的解释，不是定义，经常这样，因为不知道定义是什么。 我们用说人话的方式，来定义什么是真正的觉醒： 发现、改正、清除轮回中让自己受伤害的一切认知、想法和行为。你能做到这点，就称之为觉醒。 每修正一个问题，就是一次觉醒。当你能把所有问题都修正，就是圆满觉醒。就这么简单。有问题，发现一个，咱就改一个、解决一个。有的时候，不仅要从表面解决，还要从根源上挖掘，说白了，一定要断根。","note":{"title":"第三课已修订概念","text":"第三课将两者分开：觉醒是发现或确定问题；解脱是不再伤害、永不复现。第二课正文保留当时的表述。","target":"ep3-p68","label":"查看第三课修订"}},{"id":"ep2-k18","course":"ep2","number":18,"topic":"觉醒与解脱","title":"断根：同性质的问题不再复现","summary":"本讲把“永不复现”作为断根的目标，用来区分处理表面与处理根源。","points":["当前问题暂时平息，并不一定意味着根源消失。","需要继续观察下一次相似情境中，旧反应和旧伤害是否重复。"],"start":203,"end":205,"quote":"觉醒的目的，是让问题永远不再出现。如果只解决现在的问题，同样性质的下一次又出现，就叫没断根，只是解决了表面。","quoteIndex":204,"related":["ep1-k08","ep3-k04","ep3-k05"],"section":"ep2-p194","sectionTitle":"六 醒 让伤害自己的错误不再重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 断根：同性质的问题不再复现 本讲把“永不复现”作为断根的目标，用来区分处理表面与处理根源。 觉醒与解脱 当前问题暂时平息，并不一定意味着根源消失。 需要继续观察下一次相似情境中，旧反应和旧伤害是否重复。 六 醒 让伤害自己的错误不再重复 每修正一个问题，就是一次觉醒。当你能把所有问题都修正，就是圆满觉醒。就这么简单。有问题，发现一个，咱就改一个、解决一个。有的时候，不仅要从表面解决，还要从根源上挖掘，说白了，一定要断根。 觉醒的目的，是让问题永远不再出现。如果只解决现在的问题，同样性质的下一次又出现，就叫没断根，只是解决了表面。 什么是断根？就是永不复现。","note":{"title":"第三课已修订概念","text":"第三课将两者分开：觉醒是发现或确定问题；解脱是不再伤害、永不复现。第二课正文保留当时的表述。","target":"ep3-p68","label":"查看第三课修订"}},{"id":"ep2-k19","course":"ep2","number":19,"topic":"觉醒与解脱","title":"用生活结果重新检验“觉醒”","summary":"讲者依据前面的定义，追问人是否真的减少了反复造成伤害的问题。","points":["拥有知识和说出道理，并不自动等于行为已经改变。","这一追问引出后文：智慧为何没有充分转化为生活中的改变？"],"start":206,"end":210,"quote":"既然已经有定义，我问你，现在人类是什么状态？说好听点，半觉醒状态；说不好听点，觉醒也就是露个头。这里必须说一个问题，历史上不是没有圣贤把上面的东西带下来，有。我们也不缺少正确的智慧。","quoteIndex":208,"related":["ep3-k04"],"section":"ep2-p194","sectionTitle":"六 醒 让伤害自己的错误不再重复","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 用生活结果重新检验“觉醒” 讲者依据前面的定义，追问人是否真的减少了反复造成伤害的问题。 觉醒与解脱 拥有知识和说出道理，并不自动等于行为已经改变。 这一追问引出后文：智慧为何没有充分转化为生活中的改变？ 六 醒 让伤害自己的错误不再重复 用定义重新看人类的状态 以后再有一帮大聪明跟你说，打坐念经、顿悟就能觉醒，拿个东西“梆”敲一下就觉醒了，你就大嘴巴抽他，就醒了。一个连生活问题都发现不了的人，他觉醒个屁；一个连轮回怎么坑害你都搞不清楚的人，他觉醒个屁，就是这样。 既然已经有定义，我问你，现在人类是什么状态？说好听点，半觉醒状态；说不好听点，觉醒也就是露个头。这里必须说一个问题，历史上不是没有圣贤把上面的东西带下来，有。我们也不缺少正确的智慧。 但2000年内，如果用刚才对觉醒的定义重新看人类，该犯什么问题还犯什么问题，你怎么叫觉醒了？还困在人类大梦、轮回大梦中。有了定义，再重新看人类状态，你就知道了，这叫觉醒吗？说好听点，10%吧，说得更夸张一点，半觉醒。 为什么有圣贤来人间，还是做不到人类全面觉醒？有几个断点，大家听一下。","note":{"title":"第三课已修订概念","text":"第三课将两者分开：觉醒是发现或确定问题；解脱是不再伤害、永不复现。第二课正文保留当时的表述。","target":"ep3-p68","label":"查看第三课修订"}},{"id":"ep2-k20","course":"ep2","number":20,"topic":"智慧落地","title":"从智慧到现实应用的五个断点","summary":"本讲用五个断点解释：即使已经有知识，实际改变仍可能在中途停住。","points":["一：只有圆满结论，初学者用不了。二：研究高远问题，却脱离眼前用途。","三：不知道具体怎么做。四：修行体系没有落实到解开思想与行为的枷锁。","五：零散的点状智慧，没有形成能够系统运用的整体。"],"start":211,"end":281,"quote":"不是说没给人类带来希望，带来了，但是点状的，没有成片。有没有星星之火？有，但可惜，要把人类命运改变，想都别想。所以叫星星之火没有燎原。","quoteIndex":281,"related":["ep2-k21","ep2-k24","ep2-k25","ep3-k07","ep10-k20"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 从智慧到现实应用的五个断点 本讲用五个断点解释：即使已经有知识，实际改变仍可能在中途停住。 智慧落地 一：只有圆满结论，初学者用不了。二：研究高远问题，却脱离眼前用途。 三：不知道具体怎么做。四：修行体系没有落实到解开思想与行为的枷锁。 五：零散的点状智慧，没有形成能够系统运用的整体。 七 从圣贤智慧到现实应用的五个断点 七 从圣贤智慧到现实应用的五个断点 第一个断点 用不了的智慧 第一个断点，叫用不了的智慧。就上次讲的故事，那次我在研究智慧，观音下来了，我就问：“你看我智慧这么多年，怎么就在八这个坎上不去了呢？我到底缺哪儿？圆满智慧到底是什么？”观音老人家来了一句：“等你不研究智慧的时候，你就是圆满智慧了。” 这说得似乎很有道理，但仔细想想，我不研究智慧就圆满智慧，难道不研究就能进步了吗？这不扯淡吗？记住，你们可不能跟观音这么说，关系不到，我就可以这么说。 所以我直接薅着他说：“整个人间界，就是被你们这帮佛界的人给祸害了。”因为你们说的是“圆满的结论性的智慧”，我给它起这个名字。说得对不对？是对的，但在人间没办法用。 就跟学武功似的，给一本武功秘籍，正常情况下先学习、研究，然后得练。练个十年八年，熟悉、精通了，咱们开始忘记。这个时候有人问，学武功的至高境界是什么？就是无招胜有招，确实没毛病。 但不能跟人家刚开始的时候就说无招胜有招，你得先说怎么学的，过程怎么经历的。最后的状态的确是无招胜有招，但不能把它作为大家指导性的结论。 我跟你说，四大宗教下来的所有圣人，都是一个鸟样。为什么我能说这句话？因为见过圣人之外传法的方式。比如兜率陀天大法会上说的东西，就不是这样的。 上帝那边、耶稣那边、真主那边怎么传，我不太清楚，肯定不是大号下来，这个我敢肯定。佛教也好，道教也好，肯定是小号下来。道教的小号咱不好说，但佛界的是佛祖的一个小号，而且这个小号一定在人间传法没经验。 为什么说没经验？因为他传的是佛界佛法，很多东西是圆满的结果性智慧和指导。说得对，但在人间很多东西用不上。包括让你吃素、远离红尘、持戒，这些都是标准的佛界修行方法，记住，标准的佛界修行方法。 因为佛界那边很多众生本来不吃饭，很多一天只吃一顿饭没有问题，所以过午不食，真正的佛祖当年是过午不食。佛界很多众生没有什么人性，这不是说他坏，而是没有人类思维。 所以对很多人类的东西，他不习惯，也觉得很脏，最重要的是避开。你看整个佛教传的是尽可能远离红尘，别跟他们产生关系。这是标准的佛界佛法。 他自己明白这个东西的时候，你问观音智慧，他就这么说；问佛祖，也这么说。 为什么？因为上面的人都明白。他不认为一个吃饭的行为，还要告诉你怎么拿筷子、怎么夹东西、怎么放嘴里，不就是夹完往嘴里放吗？这个还需要说吗？ 所以很多东西出了问题。什么是智慧、修行、大爱、慈悲、不恨、圆满，很多都没有说到底。 上来就说你要修慈悲，普通人类怎么可能修慈悲？慈悲是大爱的表现形式，是大爱和不恨在人间的最终表现形式。大爱和不恨没修好，不可能在人间表现出真的慈悲。 你不可能做到无限包容、无限忍让、无限成就、无限大爱，好像之前还有一个，我给忘了，一共五个。做不到这点，最多是一个好心人、一个善人，但那个不叫慈悲，不要去侮辱慈悲。 大爱从哪里来？从感恩来。大爱的来源有两种。 一个是通过感恩生出大爱，一个是女娲的慈母法则。但慈母法则很难修，因为众生不是你生出来的。女娲对众生的爱叫慈母之爱，不是说修不了，是很难修。 普通众生应该更多修的是感恩大爱，像我一样，这个比较简单。但感恩大爱要先修什么？先修成本法则、代价法则。你根本不知道众生为你付出了什么，凭什么感恩？这是一套逻辑，谁跟你讲了？肯定没人跟你说。 上来一帮傻子就说修慈悲，你不可能修出道果，认为的慈悲一定是假慈悲，经不住时间和事情的撞击。 包括智慧、修行、大爱、慈悲、不恨、圆满、空色，把这些放到AI里，最多看到描述性的解释。不能说是定义。尤其智慧，你去问什么是智慧，学了对我有什么帮助，更多是说“学了能更好”，这解决什么问题？这是描述性的解释，不是定义。 整个佛教、道教也好，我估计真主、上帝那边也好不到哪儿去。 这四个圣人是真把东西传了，但是传的人太高了，所以传的时候都是这个问题。 我们用螺丝刀理论来说。所有众生干的事情，是说这个螺丝刀可好了，用什么东西做的。所有经典多是解释、补充说明，很少有人总结，因为说不出来。都在说螺丝刀在哪里采的木头、用的铁，什么天外陨铁做的，可厉害了。 你问这东西到底有什么用，解决生活中的什么问题？不知道，因为世尊没说。很多佛教、道教经典，包括海外那些圣人的经典，都没告诉你能干什么、怎么使、什么时候使。也就是说，螺丝刀给你了，但忘了说它是拧螺丝的。 智慧能干什么，能解决人类什么问题？不知道。再去追究很多东西，比如什么是错误、什么是正确，没有人定义。修行最终的东西是什么？不知道，只能说会越来越好，但没有定义，这很奇怪。 第二个断点 高高在上的无用智慧 第二个，叫高高在上的无用智慧。慧能说“本来无一物，何处惹尘埃”，我不认同。既然空即是色、色即是空，凭什么说本来无一物？想修空，是不是修的色越多，空就越大？色无限，空也无限。怎么能说本来无一物？本来无一物，你下来干什么，闲的？ 当你不知道真相的时候，很多哲学家、名人天天说人生没有意义。但凡动点脑，用脚趾头想想，人生没意义，为什么能活着？你觉得没意义，上天创造这个体系，费了这么大资源，会让你活着没意义吗？你脑子怎么想的？本来无一物，那你算什么东西？ 你光听“应无所住而生其心”，《心经》忘了看吧？空即是色、色即是空怎么解释？空色一体怎么解释？还有一帮人没事修无无，比如把空给空掉，很多人不明白这是什么。 这是污染法则，用污染法则就说明白了，结果一堆人说不清楚。还有说继续修无无无的，那东西到底有没有？反正我这么熟佛界，都不敢确定它存在。 这就像数学。现在数学不是科学，为什么？因为很多东西无法验证，逻辑上成立，但现实中找不出来，这就是数学。 无无这个东西，理论上应该成立，但佛界有没有真的找到无无？不好说。你这属于小学生研究量子力学。研究成或者研究不成，跟逃出人间界有个屁关系？ 先别想着去佛界，也别先研究无无，是不是先想咱们升上一级，去天界混混？很多东西，属于智力上的互相比拼，觉得不说出这个话就压不住他，都是这么来的。你别跟着学，很多东西到现在佛界都不一定有定论。 几千年来古人都没想明白的事，你也不用去想，不要觉得自己能想明白。几千年没想明白，也没对你产生帮助，大概率未来也不会产生帮助。多一个不多，少一个不少。把能对自己产生帮助的，先让它产生帮助。去到天界后，说不定就能发现对自己有帮助的了。 不影响去天界、不影响升一级的，能少研究就少研究。人生匆匆几十年，非要研究连佛界都搞不清楚的东西，你闲的？ 怎么判断这个东西世间无用？找圈内真正明白的人，他一听就明白。像社会经验强的人，你一张嘴，我就知道什么水平；往这一站，就知道大概人品怎么样。为什么？没有为什么，我看一眼就知道，因为我懂。 比如西方说很多天使没有性别，一听就知道是色界天，因为色界天不能有性别。至少他们主神的控制范围在色界天。 有个《超体》，那女的最后说“我无处不在”。能说出这句话，就代表他们主神所在空间至少到了无色界天。无色界天没有肉身，都是以思维或能量的形式存在，当然我无处不在。所以只要说出这句话，我就知道他们主神肯定在无色界天，不然说不出来。 再比如，一帮人在人间求寿、求长生，一听就知道不是从上面来的，要不就是从上面来了之后没开脑袋、没开智。但凡从上面来做任务，你想想。 你可能在人间求长寿吗？更多是想，完事拍屁股赶紧回去，这是又脏乱差的地方。你是大城市的，好不容易跑到城中村做检查，怎么，还打算常驻城中村？在人间一求寿，我就知道什么水平，肯定不能跟上面沟通。但凡恢复上面的记忆，绝对说不出这四个字。 第二，人间修仙，修它干什么？你不是五魂状态，是三魂状态，神通法力、能量都不在身上，那不就是在沙漠里练游泳吗？真想修，回去修，功法、能量、法器到处都是，非跑这么一个旮旯角、穷了吧唧的地方学，你脑子进水。 第三，希望通过翻古籍找到答案的，我跟你说，水平一定很差。不能说很差，给你点面子，我只能说永远做不到顶尖。所有顶尖，没有一个是翻古籍的。古籍会不会看？偶尔会看看。 比如我这行，基本看完《金刚经》《心经》《地藏经》，还读过《楞严咒》《十善业道经》，偶尔每年念一次《月光菩萨陀罗尼咒》，《药师经》也读过，其他经一律不看。真明白的人，这些经文足够让你明白所有东西。不是那块料，不通透、不能连接上面，看再多也没用。 还有人说要向上修、成仙成佛，一听就是初级阶段，小伙子慢慢修。还想从底下往上修、位列仙班，因为还需要增加能量往上走。但我们已经到了通过小号往下走，你还在修上的阶段，真正的大佬都往下修，开始修圆满。 还有人想干点什么就去佛界，你当佛界是你家开的？很难的，一听就知道你不了解去佛界的难度。 第三个断点 不知道如何做 第三个断点，是不知道如何做。很多话没有大白话。我觉得也可能是上面传的时候，他觉得已经说完了，没有办法站在人类角度理解，这些话人类做不到。 比如无上正等正觉，“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提”，这是《金刚经》上的原话。那我请问，在人间应该怎么做？不知道。 说白了特别简单，什么都别想，把行善当成本能、习惯，当成连想都不用想的事情，这就叫无上正等正觉。不要问为什么，我就想做这事。 《金刚经》说“庄严国土，即非庄严，是名庄严”，两个事。一个是污染法则，只要有庄严佛土的想法，就一定被污染了，就不是庄严佛土。只要有想脱离生死的想法，记住，永远脱离不了生死。 第二件事是混沌。你修的是混沌，混沌不能有显相，有显相就不是混沌。所以世尊说，在燃灯佛祖那里无所得；有所得就是显相，只要有显相，就不是混沌，不是混沌法则。 说白了就这两个事，说清楚就完了，非得用那种方式表达，结果一堆人看完还是搞不清。包括功德，用很多方式表达，说白了，一个是无相功德、无量功德，一个是法布施，无量功德；一个是具体做善事，是有量功德，就这么简单。 慈悲、不恨、大爱、平等都一样，全没说清楚具体应该怎么弄，很遗憾。 第四个断点 修行体系没有落到解脱枷锁 第四点，也是整个文明最奇怪的一件事，我觉得可能就是时机不到。 四位非常伟大的圣人，把很多高维知识传到人间时，人间其实有非常大的觉醒机会。但是不知道怎么回事，结果传歪了。 比如说阴阳，大家都知道，那阳的部分是什么，阴的部分是什么，你倒说清楚。阴的部分绝对不是阴间。阳是摸得着、看得着的显化的东西，阴是摸不着、看不着的东西。世界由两部分组成，你倒告诉我，这摸不着、看不着的是什么？包括摸得着、看得着的，哪些重要，哪些不重要？没说。 空色也是这样，叫显相和混沌，你大概说一下，无也一样。 冰山法则最重要的，是从阴向阳、从无向有之间的转化。转化率是什么？说的是冰山法则，结果没说。连老子都说“万物生于阳，而阳生于阴”，很清楚的一套逻辑，但生多少，没说。既然已经说到阴阳，怎么不说法界成相？也没说，很奇怪。 好，这些都可以不说。你来人间，说上面有上面的位面，下面有下面的位面，上面有神有佛，下面有人、畜生、鬼，这些都说了。那么影响人间、影响人类成长的，都有哪些指标，怎么不说？ 无论修佛、修道，还是修上帝、真主，问他：“在人间，我把哪些指标修了，就能确保轮回等级往上走？”没跟你说。有的可能说一点，比如修功德。那人间还有什么？这些东西没有归类总结。就觉得很奇怪，你们跑这一趟干什么来了？ 包括高维世界观也没往下传。得出的智慧、五毒四心、生死这些，不都是站在高维之上才能看到的吗？那是人间能看到的吗？既然不是，为什么不说高维世界观？也没说。 最后整个宗教体系变成什么？以佛教为例，拜神、拜佛、读经、打坐、持戒、布施、练功，这叫修行。再多加一个，做好人、做善事。 道教也是，拜神，练法术、算卦，山医命相卜，念经、打坐、持戒、布施、练功，做点好事。伊斯兰教咱不知道，但信上帝的，也是做好事、不伤害、感恩。 整个修行体系完全变成这一套，跟人类解脱枷锁一点关系没有，具体思想上哪里有问题，完全没说，这就很奇怪。 第五个断点 星星之火没有燎原 第五个断点，叫星星之火没有燎原。在几千年的历史中，除了这四个圣人，有没有更厉害的人？其实有。比如王阳明、弘一法师，总结的一些金句非常厉害。但一生中也就几个金句。 你用AI总结这些先贤的东西，一生核心观点大概五条左右就算高人，能到十条的快成半圣，超过十条、三十条以内的，基本可以入圣，也就这水平。 不是说没给人类带来希望，带来了，但是点状的，没有成片。有没有星星之火？有，但可惜，要把人类命运改变，想都别想。所以叫星星之火没有燎原。"},{"id":"ep2-k21","course":"ep2","number":21,"topic":"智慧落地","title":"断点一：只有终点，没有过程","summary":"本讲用武功学习比喻说明，最终的圆满状态不应直接替代入门训练。","points":["先学习、研究和练习，才可能进入熟悉、精通的阶段。","讲授内容时，需要考虑听众已有的基础。"],"start":212,"end":225,"quote":"但不能跟人家刚开始的时候就说无招胜有招，你得先说怎么学的，过程怎么经历的。最后的状态的确是无招胜有招，但不能把它作为大家指导性的结论。","quoteIndex":217,"related":["ep1-k17"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 断点一：只有终点，没有过程 本讲用武功学习比喻说明，最终的圆满状态不应直接替代入门训练。 智慧落地 先学习、研究和练习，才可能进入熟悉、精通的阶段。 讲授内容时，需要考虑听众已有的基础。 七 从圣贤智慧到现实应用的五个断点 第一个断点 用不了的智慧 第一个断点，叫用不了的智慧。就上次讲的故事，那次我在研究智慧，观音下来了，我就问：“你看我智慧这么多年，怎么就在八这个坎上不去了呢？我到底缺哪儿？圆满智慧到底是什么？”观音老人家来了一句：“等你不研究智慧的时候，你就是圆满智慧了。” 这说得似乎很有道理，但仔细想想，我不研究智慧就圆满智慧，难道不研究就能进步了吗？这不扯淡吗？记住，你们可不能跟观音这么说，关系不到，我就可以这么说。 所以我直接薅着他说：“整个人间界，就是被你们这帮佛界的人给祸害了。”因为你们说的是“圆满的结论性的智慧”，我给它起这个名字。说得对不对？是对的，但在人间没办法用。 就跟学武功似的，给一本武功秘籍，正常情况下先学习、研究，然后得练。练个十年八年，熟悉、精通了，咱们开始忘记。这个时候有人问，学武功的至高境界是什么？就是无招胜有招，确实没毛病。 但不能跟人家刚开始的时候就说无招胜有招，你得先说怎么学的，过程怎么经历的。最后的状态的确是无招胜有招，但不能把它作为大家指导性的结论。 我跟你说，四大宗教下来的所有圣人，都是一个鸟样。为什么我能说这句话？因为见过圣人之外传法的方式。比如兜率陀天大法会上说的东西，就不是这样的。 上帝那边、耶稣那边、真主那边怎么传，我不太清楚，肯定不是大号下来，这个我敢肯定。佛教也好，道教也好，肯定是小号下来。道教的小号咱不好说，但佛界的是佛祖的一个小号，而且这个小号一定在人间传法没经验。 为什么说没经验？因为他传的是佛界佛法，很多东西是圆满的结果性智慧和指导。说得对，但在人间很多东西用不上。包括让你吃素、远离红尘、持戒，这些都是标准的佛界修行方法，记住，标准的佛界修行方法。 因为佛界那边很多众生本来不吃饭，很多一天只吃一顿饭没有问题，所以过午不食，真正的佛祖当年是过午不食。佛界很多众生没有什么人性，这不是说他坏，而是没有人类思维。 所以对很多人类的东西，他不习惯，也觉得很脏，最重要的是避开。你看整个佛教传的是尽可能远离红尘，别跟他们产生关系。这是标准的佛界佛法。 他自己明白这个东西的时候，你问观音智慧，他就这么说；问佛祖，也这么说。 为什么？因为上面的人都明白。他不认为一个吃饭的行为，还要告诉你怎么拿筷子、怎么夹东西、怎么放嘴里，不就是夹完往嘴里放吗？这个还需要说吗？ 所以很多东西出了问题。什么是智慧、修行、大爱、慈悲、不恨、圆满，很多都没有说到底。"},{"id":"ep2-k22","course":"ep2","number":22,"topic":"智慧落地","title":"从看见付出，到感恩与大爱","summary":"讲者尝试把“修慈悲”拆成可以理解的前后关系，说明中间过程不能省略。","points":["在本讲的解释中，先看见别人的成本与代价，再谈感恩。","感恩、大爱、不恨与慈悲，被放在同一条学习路径中讨论。"],"start":226,"end":231,"quote":"普通众生应该更多修的是感恩大爱，像我一样，这个比较简单。但感恩大爱要先修什么？先修成本法则、代价法则。你根本不知道众生为你付出了什么，凭什么感恩？这是一套逻辑，谁跟你讲了？肯定没人跟你说。","quoteIndex":230,"related":["ep1-k10"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 从看见付出，到感恩与大爱 讲者尝试把“修慈悲”拆成可以理解的前后关系，说明中间过程不能省略。 智慧落地 在本讲的解释中，先看见别人的成本与代价，再谈感恩。 感恩、大爱、不恨与慈悲，被放在同一条学习路径中讨论。 七 从圣贤智慧到现实应用的五个断点 上来就说你要修慈悲，普通人类怎么可能修慈悲？慈悲是大爱的表现形式，是大爱和不恨在人间的最终表现形式。大爱和不恨没修好，不可能在人间表现出真的慈悲。 你不可能做到无限包容、无限忍让、无限成就、无限大爱，好像之前还有一个，我给忘了，一共五个。做不到这点，最多是一个好心人、一个善人，但那个不叫慈悲，不要去侮辱慈悲。 大爱从哪里来？从感恩来。大爱的来源有两种。 一个是通过感恩生出大爱，一个是女娲的慈母法则。但慈母法则很难修，因为众生不是你生出来的。女娲对众生的爱叫慈母之爱，不是说修不了，是很难修。 普通众生应该更多修的是感恩大爱，像我一样，这个比较简单。但感恩大爱要先修什么？先修成本法则、代价法则。你根本不知道众生为你付出了什么，凭什么感恩？这是一套逻辑，谁跟你讲了？肯定没人跟你说。 上来一帮傻子就说修慈悲，你不可能修出道果，认为的慈悲一定是假慈悲，经不住时间和事情的撞击。"},{"id":"ep2-k23","course":"ep2","number":23,"topic":"智慧落地","title":"螺丝刀理论：它到底用来做什么？","summary":"知道工具的材料和来历，并不等于知道它的用途；本讲用这个比喻反问知识学习。","points":["是什么之外，还要追问能干什么、怎么使、什么时候使。","如果说不清能解决什么问题，对知识的理解仍不完整。"],"start":232,"end":237,"quote":"你问这东西到底有什么用，解决生活中的什么问题？不知道，因为世尊没说。很多佛教、道教经典，包括海外那些圣人的经典，都没告诉你能干什么、怎么使、什么时候使。也就是说，螺丝刀给你了，但忘了说它是拧螺丝的。","quoteIndex":236,"related":["ep1-k18","ep5-k06"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 螺丝刀理论：它到底用来做什么？ 知道工具的材料和来历，并不等于知道它的用途；本讲用这个比喻反问知识学习。 智慧落地 是什么之外，还要追问能干什么、怎么使、什么时候使。 如果说不清能解决什么问题，对知识的理解仍不完整。 七 从圣贤智慧到现实应用的五个断点 包括智慧、修行、大爱、慈悲、不恨、圆满、空色，把这些放到AI里，最多看到描述性的解释。不能说是定义。尤其智慧，你去问什么是智慧，学了对我有什么帮助，更多是说“学了能更好”，这解决什么问题？这是描述性的解释，不是定义。 整个佛教、道教也好，我估计真主、上帝那边也好不到哪儿去。 这四个圣人是真把东西传了，但是传的人太高了，所以传的时候都是这个问题。 我们用螺丝刀理论来说。所有众生干的事情，是说这个螺丝刀可好了，用什么东西做的。所有经典多是解释、补充说明，很少有人总结，因为说不出来。都在说螺丝刀在哪里采的木头、用的铁，什么天外陨铁做的，可厉害了。 你问这东西到底有什么用，解决生活中的什么问题？不知道，因为世尊没说。很多佛教、道教经典，包括海外那些圣人的经典，都没告诉你能干什么、怎么使、什么时候使。也就是说，螺丝刀给你了，但忘了说它是拧螺丝的。 智慧能干什么，能解决人类什么问题？不知道。再去追究很多东西，比如什么是错误、什么是正确，没有人定义。修行最终的东西是什么？不知道，只能说会越来越好，但没有定义，这很奇怪。"},{"id":"ep2-k24","course":"ep2","number":24,"topic":"智慧落地","title":"断点二：研究得很高，却用在哪里？","summary":"第二个断点着重讨论研究对象与当下目标之间的距离。","points":["先弄清这项研究能否帮助自己解决当前问题。","讲者主张优先让能够产生帮助的内容发挥作用。","可与断点一对照：一个缺少学习过程，一个偏离当前用途。"],"start":238,"end":257,"quote":"几千年来古人都没想明白的事，你也不用去想，不要觉得自己能想明白。几千年没想明白，也没对你产生帮助，大概率未来也不会产生帮助。多一个不多，少一个不少。把能对自己产生帮助的，先让它产生帮助。去到天界后，说不定就能发现对自己有帮助的了。","quoteIndex":246,"related":["ep2-k21"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 断点二：研究得很高，却用在哪里？ 第二个断点着重讨论研究对象与当下目标之间的距离。 智慧落地 先弄清这项研究能否帮助自己解决当前问题。 讲者主张优先让能够产生帮助的内容发挥作用。 可与断点一对照：一个缺少学习过程，一个偏离当前用途。 七 从圣贤智慧到现实应用的五个断点 第二个断点 高高在上的无用智慧 第二个，叫高高在上的无用智慧。慧能说“本来无一物，何处惹尘埃”，我不认同。既然空即是色、色即是空，凭什么说本来无一物？想修空，是不是修的色越多，空就越大？色无限，空也无限。怎么能说本来无一物？本来无一物，你下来干什么，闲的？ 当你不知道真相的时候，很多哲学家、名人天天说人生没有意义。但凡动点脑，用脚趾头想想，人生没意义，为什么能活着？你觉得没意义，上天创造这个体系，费了这么大资源，会让你活着没意义吗？你脑子怎么想的？本来无一物，那你算什么东西？ 你光听“应无所住而生其心”，《心经》忘了看吧？空即是色、色即是空怎么解释？空色一体怎么解释？还有一帮人没事修无无，比如把空给空掉，很多人不明白这是什么。 这是污染法则，用污染法则就说明白了，结果一堆人说不清楚。还有说继续修无无无的，那东西到底有没有？反正我这么熟佛界，都不敢确定它存在。 这就像数学。现在数学不是科学，为什么？因为很多东西无法验证，逻辑上成立，但现实中找不出来，这就是数学。 无无这个东西，理论上应该成立，但佛界有没有真的找到无无？不好说。你这属于小学生研究量子力学。研究成或者研究不成，跟逃出人间界有个屁关系？ 先别想着去佛界，也别先研究无无，是不是先想咱们升上一级，去天界混混？很多东西，属于智力上的互相比拼，觉得不说出这个话就压不住他，都是这么来的。你别跟着学，很多东西到现在佛界都不一定有定论。 几千年来古人都没想明白的事，你也不用去想，不要觉得自己能想明白。几千年没想明白，也没对你产生帮助，大概率未来也不会产生帮助。多一个不多，少一个不少。把能对自己产生帮助的，先让它产生帮助。去到天界后，说不定就能发现对自己有帮助的了。 不影响去天界、不影响升一级的，能少研究就少研究。人生匆匆几十年，非要研究连佛界都搞不清楚的东西，你闲的？ 怎么判断这个东西世间无用？找圈内真正明白的人，他一听就明白。像社会经验强的人，你一张嘴，我就知道什么水平；往这一站，就知道大概人品怎么样。为什么？没有为什么，我看一眼就知道，因为我懂。 比如西方说很多天使没有性别，一听就知道是色界天，因为色界天不能有性别。至少他们主神的控制范围在色界天。 有个《超体》，那女的最后说“我无处不在”。能说出这句话，就代表他们主神所在空间至少到了无色界天。无色界天没有肉身，都是以思维或能量的形式存在，当然我无处不在。所以只要说出这句话，我就知道他们主神肯定在无色界天，不然说不出来。 再比如，一帮人在人间求寿、求长生，一听就知道不是从上面来的，要不就是从上面来了之后没开脑袋、没开智。但凡从上面来做任务，你想想。 你可能在人间求长寿吗？更多是想，完事拍屁股赶紧回去，这是又脏乱差的地方。你是大城市的，好不容易跑到城中村做检查，怎么，还打算常驻城中村？在人间一求寿，我就知道什么水平，肯定不能跟上面沟通。但凡恢复上面的记忆，绝对说不出这四个字。 第二，人间修仙，修它干什么？你不是五魂状态，是三魂状态，神通法力、能量都不在身上，那不就是在沙漠里练游泳吗？真想修，回去修，功法、能量、法器到处都是，非跑这么一个旮旯角、穷了吧唧的地方学，你脑子进水。 第三，希望通过翻古籍找到答案的，我跟你说，水平一定很差。不能说很差，给你点面子，我只能说永远做不到顶尖。所有顶尖，没有一个是翻古籍的。古籍会不会看？偶尔会看看。 比如我这行，基本看完《金刚经》《心经》《地藏经》，还读过《楞严咒》《十善业道经》，偶尔每年念一次《月光菩萨陀罗尼咒》，《药师经》也读过，其他经一律不看。真明白的人，这些经文足够让你明白所有东西。不是那块料，不通透、不能连接上面，看再多也没用。 还有人说要向上修、成仙成佛，一听就是初级阶段，小伙子慢慢修。还想从底下往上修、位列仙班，因为还需要增加能量往上走。但我们已经到了通过小号往下走，你还在修上的阶段，真正的大佬都往下修，开始修圆满。 还有人想干点什么就去佛界，你当佛界是你家开的？很难的，一听就知道你不了解去佛界的难度。"},{"id":"ep2-k25","course":"ep2","number":25,"topic":"智慧落地","title":"断点三：听懂一句话，仍不知道怎么做","summary":"本讲认为，抽象的表述需要进一步说明，才能转成日常的具体行动。","points":["讲清楚概念之外，还需要讲清楚人在生活中如何练习。","不把“听过一个词”或“记住一句话”当成已经会用。"],"start":258,"end":265,"quote":"第三个断点，是不知道如何做。很多话没有大白话。我觉得也可能是上面传的时候，他觉得已经说完了，没有办法站在人类角度理解，这些话人类做不到。","quoteIndex":259,"related":[],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 断点三：听懂一句话，仍不知道怎么做 本讲认为，抽象的表述需要进一步说明，才能转成日常的具体行动。 智慧落地 讲清楚概念之外，还需要讲清楚人在生活中如何练习。 不把“听过一个词”或“记住一句话”当成已经会用。 七 从圣贤智慧到现实应用的五个断点 第三个断点 不知道如何做 第三个断点，是不知道如何做。很多话没有大白话。我觉得也可能是上面传的时候，他觉得已经说完了，没有办法站在人类角度理解，这些话人类做不到。 比如无上正等正觉，“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提”，这是《金刚经》上的原话。那我请问，在人间应该怎么做？不知道。 说白了特别简单，什么都别想，把行善当成本能、习惯，当成连想都不用想的事情，这就叫无上正等正觉。不要问为什么，我就想做这事。 《金刚经》说“庄严国土，即非庄严，是名庄严”，两个事。一个是污染法则，只要有庄严佛土的想法，就一定被污染了，就不是庄严佛土。只要有想脱离生死的想法，记住，永远脱离不了生死。 第二件事是混沌。你修的是混沌，混沌不能有显相，有显相就不是混沌。所以世尊说，在燃灯佛祖那里无所得；有所得就是显相，只要有显相，就不是混沌，不是混沌法则。 说白了就这两个事，说清楚就完了，非得用那种方式表达，结果一堆人看完还是搞不清。包括功德，用很多方式表达，说白了，一个是无相功德、无量功德，一个是法布施，无量功德；一个是具体做善事，是有量功德，就这么简单。 慈悲、不恨、大爱、平等都一样，全没说清楚具体应该怎么弄，很遗憾。"},{"id":"ep2-k26","course":"ep2","number":26,"topic":"智慧落地","title":"断点四：练习与解开枷锁是否相连？","summary":"讲者在这一节追问：既有练习有没有指出思想和行为的具体问题，以及改变的方向。","points":["不仅列出做什么，也要说明它对应解决什么。","把活动形式与实际变化联系起来，才有可能检验效果。"],"start":266,"end":277,"quote":"整个修行体系完全变成这一套，跟人类解脱枷锁一点关系没有，具体思想上哪里有问题，完全没说，这就很奇怪。","quoteIndex":277,"related":["ep2-k31"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 断点四：练习与解开枷锁是否相连？ 讲者在这一节追问：既有练习有没有指出思想和行为的具体问题，以及改变的方向。 智慧落地 不仅列出做什么，也要说明它对应解决什么。 把活动形式与实际变化联系起来，才有可能检验效果。 七 从圣贤智慧到现实应用的五个断点 第四个断点 修行体系没有落到解脱枷锁 第四点，也是整个文明最奇怪的一件事，我觉得可能就是时机不到。 四位非常伟大的圣人，把很多高维知识传到人间时，人间其实有非常大的觉醒机会。但是不知道怎么回事，结果传歪了。 比如说阴阳，大家都知道，那阳的部分是什么，阴的部分是什么，你倒说清楚。阴的部分绝对不是阴间。阳是摸得着、看得着的显化的东西，阴是摸不着、看不着的东西。世界由两部分组成，你倒告诉我，这摸不着、看不着的是什么？包括摸得着、看得着的，哪些重要，哪些不重要？没说。 空色也是这样，叫显相和混沌，你大概说一下，无也一样。 冰山法则最重要的，是从阴向阳、从无向有之间的转化。转化率是什么？说的是冰山法则，结果没说。连老子都说“万物生于阳，而阳生于阴”，很清楚的一套逻辑，但生多少，没说。既然已经说到阴阳，怎么不说法界成相？也没说，很奇怪。 好，这些都可以不说。你来人间，说上面有上面的位面，下面有下面的位面，上面有神有佛，下面有人、畜生、鬼，这些都说了。那么影响人间、影响人类成长的，都有哪些指标，怎么不说？ 无论修佛、修道，还是修上帝、真主，问他：“在人间，我把哪些指标修了，就能确保轮回等级往上走？”没跟你说。有的可能说一点，比如修功德。那人间还有什么？这些东西没有归类总结。就觉得很奇怪，你们跑这一趟干什么来了？ 包括高维世界观也没往下传。得出的智慧、五毒四心、生死这些，不都是站在高维之上才能看到的吗？那是人间能看到的吗？既然不是，为什么不说高维世界观？也没说。 最后整个宗教体系变成什么？以佛教为例，拜神、拜佛、读经、打坐、持戒、布施、练功，这叫修行。再多加一个，做好人、做善事。 道教也是，拜神，练法术、算卦，山医命相卜，念经、打坐、持戒、布施、练功，做点好事。伊斯兰教咱不知道，但信上帝的，也是做好事、不伤害、感恩。 整个修行体系完全变成这一套，跟人类解脱枷锁一点关系没有，具体思想上哪里有问题，完全没说，这就很奇怪。"},{"id":"ep2-k27","course":"ep2","number":27,"topic":"智慧落地","title":"断点五：点状智慧没有形成整体","summary":"本讲用“星星之火没有燎原”比喻零散的洞见尚未形成系统。","points":["有少数好观点，不等于已经覆盖复杂的生活问题。","需要继续连接知识、补足过程，并形成可学习的内容结构。"],"start":278,"end":281,"quote":"不是说没给人类带来希望，带来了，但是点状的，没有成片。有没有星星之火？有，但可惜，要把人类命运改变，想都别想。所以叫星星之火没有燎原。","quoteIndex":281,"related":["ep2-k29","ep3-k08"],"section":"ep2-p211","sectionTitle":"七 从圣贤智慧到现实应用的五个断点","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 断点五：点状智慧没有形成整体 本讲用“星星之火没有燎原”比喻零散的洞见尚未形成系统。 智慧落地 有少数好观点，不等于已经覆盖复杂的生活问题。 需要继续连接知识、补足过程，并形成可学习的内容结构。 七 从圣贤智慧到现实应用的五个断点 第五个断点 星星之火没有燎原 第五个断点，叫星星之火没有燎原。在几千年的历史中，除了这四个圣人，有没有更厉害的人？其实有。比如王阳明、弘一法师，总结的一些金句非常厉害。但一生中也就几个金句。 你用AI总结这些先贤的东西，一生核心观点大概五条左右就算高人，能到十条的快成半圣，超过十条、三十条以内的，基本可以入圣，也就这水平。 不是说没给人类带来希望，带来了，但是点状的，没有成片。有没有星星之火？有，但可惜，要把人类命运改变，想都别想。所以叫星星之火没有燎原。"},{"id":"ep2-k28","course":"ep2","number":28,"topic":"学习路径","title":"不必全靠自己发明，仍然可以学习","summary":"本讲区分自悟自修与跟着老师学习，用学校教育作类比。","points":["知识不一定由自己原创，仍然可以通过学习掌握。","目标是把问题和知识点学会，并继续练习。"],"start":283,"end":287,"quote":"觉醒、智慧这些事情，你自己想不明白，耽误你变成有智慧的人、觉醒的人吗？压根不耽误。只要把问题和知识点学会，一样会变成非常厉害的觉醒者。","quoteIndex":287,"related":["ep2-k29","ep2-k31"],"section":"ep2-p282","sectionTitle":"八 学习与练习 走向全觉醒","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 不必全靠自己发明，仍然可以学习 本讲区分自悟自修与跟着老师学习，用学校教育作类比。 学习路径 知识不一定由自己原创，仍然可以通过学习掌握。 目标是把问题和知识点学会，并继续练习。 八 学习与练习 走向全觉醒 自悟自修与跟着老师学习 咱们要做什么？要进入全觉醒状态。全觉醒，两种方式。一个是自己觉醒，自己发现问题、解决问题。但凡你是那块料，我今天就不在这儿讲了。可能不可能？可能，但今生能达到这种状态，可能性不大。 第二个，跟着老师学习。智慧、传法、觉醒，都是两条路。一个是自悟自修，整个轮回里面也不多，这个不要去想。 就像从小学到高中，可能要学两万到四万个知识点，哪个是自己发明创造的？哪个也不是吧？耽误你变成一个非常优秀的人了吗？一点没耽误。虽然不是咱发明的，但不是不能学。 觉醒、智慧这些事情，你自己想不明白，耽误你变成有智慧的人、觉醒的人吗？压根不耽误。只要把问题和知识点学会，一样会变成非常厉害的觉醒者。"},{"id":"ep2-k29","course":"ep2","number":29,"topic":"学习路径","title":"人类说明书要做的四件事","summary":"本讲用四项工作说明课程希望补充哪些内容。","points":["补足已有讲述中缺少的过程；指出影响自身的主要方面。","讲清涉及人间的规则；提升真相认知与思维模型。","学好之后继续练习，逐步形成习惯。"],"start":288,"end":295,"quote":"怎么办？请大家以后跟着明白人学习人类说明书，学好之后好好练习，最后形成习惯。","quoteIndex":295,"related":[],"section":"ep2-p282","sectionTitle":"八 学习与练习 走向全觉醒","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 人类说明书要做的四件事 本讲用四项工作说明课程希望补充哪些内容。 学习路径 补足已有讲述中缺少的过程；指出影响自身的主要方面。 讲清涉及人间的规则；提升真相认知与思维模型。 学好之后继续练习，逐步形成习惯。 八 学习与练习 走向全觉醒 人类说明书要做的事情 咱们人类说明书要干什么？第一，为圣贤们打打补丁。咱这辈子成不了圣贤，不代表不能给圣贤打补丁。 第二，把影响你的所有主要木板，也就是木桶原则里的这些东西，都告诉你，把主要的先修了。 第三，把影响人间和法界的规则，只要涉及人间界，能告诉你的都告诉你，能说的都说，让你活得清清楚楚、明明白白。 第四，全面提升大家的真相和思维模型，让大家用更高级、超越人类的智慧去理解人间。 想看清庐山全貌，就必须在庐山之外，在庐山中不行。想真正在人间活明白，必须有人类之外的智慧、视角，更要有人类之外的思维。 难不难？不太容易。大家一定要用这一生和整个轮回的时间不停努力。正所谓：“难言菩提众，众生性志无定，习恶者多，纵发善心，须臾即退，为善为恶，逐恶而生。”所以不太容易。 怎么办？请大家以后跟着明白人学习人类说明书，学好之后好好练习，最后形成习惯。"},{"id":"ep2-k30","course":"ep2","number":30,"topic":"课程导读","title":"四大部分与三类思维","summary":"四个阶段之中，“逆修觉者”先围绕真相和思维展开，再细分三类思维。","points":["逆修觉者：天道思维、人道思维、人设思维。","其后是灵魂觉者、法界天机、道法自然。","本节的预计集数保留在正文中，属于当次试讲规划。"],"start":296,"end":301,"quote":"人类说明书的东西非常多，首先就是四大块。第一是逆修觉者，主要解决真相和思维。你们现在听的这部分叫天道思维，首先要给大家灌输轮回之外的思维是什么。","quoteIndex":297,"related":["ep1-k01","ep3-k09"],"section":"ep2-p282","sectionTitle":"八 学习与练习 走向全觉醒","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 四大部分与三类思维 四个阶段之中，“逆修觉者”先围绕真相和思维展开，再细分三类思维。 课程导读 逆修觉者：天道思维、人道思维、人设思维。 其后是灵魂觉者、法界天机、道法自然。 本节的预计集数保留在正文中，属于当次试讲规划。 八 学习与练习 走向全觉醒 四大部分与课程安排 人类说明书的东西非常多，首先就是四大块。第一是逆修觉者，主要解决真相和思维。你们现在听的这部分叫天道思维，首先要给大家灌输轮回之外的思维是什么。 第二是人道思维，说白了，有些做人做事的方式，你做得不对。第三是人设思维，学会给自己建防护墙。 然后，人类说明书第二部分是灵魂觉者，解决大家灵魂上的问题。 第三部分是法界天机，就是之前说的封建迷信那些东西。第四部分是道法自然，融会贯通。 这四部加在一起，我估计：天道思维现在已经确定76集、77集；人道思维、人设思维加在一起，估计也得200多集，所以加起来二三百集是有的。再加灵魂觉者、法界天机、道法自然，总共五六百集差不多。这还没加真相，再加真相，估计一两千集是有的。"},{"id":"ep2-k31","course":"ep2","number":31,"topic":"学习路径","title":"把觉醒落实在生活问题的解决上","summary":"第二课以解决实际生活问题收束，强调持续减少反复出现的伤害。","points":["碰到一个问题，争取解决一个问题。","即使一时不能完全解决，也可观察伤害有没有减少。","知识应当帮助改变认知、思维和行为，而不只用于谈论和展示。"],"start":302,"end":309,"quote":"我觉得一定要真正落实在解决人类生活中的问题。我希望看到，通过学习人类说明书，你能真实地解决那些在轮回中一次又一次伤害自己的认知、思维和行为。","quoteIndex":305,"related":["ep2-k17","ep2-k18","ep3-k18","ep3-k23"],"section":"ep2-p282","sectionTitle":"八 学习与练习 走向全觉醒","searchText":"问道二 三把锁如何把人类锁在梦境中 第2课 问道2 把觉醒落实在生活问题的解决上 第二课以解决实际生活问题收束，强调持续减少反复出现的伤害。 学习路径 碰到一个问题，争取解决一个问题。 即使一时不能完全解决，也可观察伤害有没有减少。 知识应当帮助改变认知、思维和行为，而不只用于谈论和展示。 八 学习与练习 走向全觉醒 把觉醒落实在生活问题的解决上 想觉醒容易吗？知道这些，你就知道想活明白没那么容易。还得有人带着咱们走案例。想觉醒、想不被轮回坑，不容易。 请大家记住，我不希望最后教完这些东西，又成了一堆人类吹嘘、茶余饭后比拼自己智慧高的方式。 我觉得一定要真正落实在解决人类生活中的问题。我希望看到，通过学习人类说明书，你能真实地解决那些在轮回中一次又一次伤害自己的认知、思维和行为。 咱不求一世就把所有问题解决，太难了，但要经常积累，叫正向积累。 碰到一个问题，解决一个问题。就算不能全面解决，至少解决百分之七八十，减少这些问题在生命中对我们的伤害，最终达到圆满状态。我觉得这才是真正的觉醒，带着大家觉醒。 一个觉醒者，如果发现不了生活中的问题，也解决不了生活中的问题，就不配称之为觉醒。觉醒不太容易，觉醒来自生活问题的解决，是让轮回中的错误不再伤害你，这才最重要。 好，今天就讲到这儿，讲得有点多，快两个小时。但今天这个很难，能讲明白还挺费劲。希望没有打扰大家，咱们下次再见。之后的我估计就没那么费劲了。好，拜拜。"},{"id":"ep3-k01","course":"ep3","number":1,"topic":"课程导读","title":"第三课做什么：回顾、修订与框架","summary":"第三课先回顾第二课中的关键概念，再说明人类说明书的整体框架与后续实践安排。","points":["试讲中的讨论与反馈，会继续进入正式内容的修改。","本课既补充定义，也交代每个阶段要学习什么。"],"start":43,"end":52,"quote":"上一集观点和理念实在太多，而且有点炸。我发现好多人在反复听，就把一些重点拿到这节课，帮大家总结一下。第一，先总结上期；第二，把人类说明书、《问道》和整个章程跟大家说清楚，说完就完事了，所以今天比较简单。","quoteIndex":44,"related":["ep2-k01","ep3-k04"],"section":"ep3-p36","sectionTitle":"一 开场近况与本课安排","searchText":"问道三 人类说明书框架 第3课 问道3 第三课做什么：回顾、修订与框架 第三课先回顾第二课中的关键概念，再说明人类说明书的整体框架与后续实践安排。 课程导读 试讲中的讨论与反馈，会继续进入正式内容的修改。 本课既补充定义，也交代每个阶段要学习什么。 一 开场近况与本课安排 上期回顾 录制计划与现场交流 上一集观点和理念实在太多，而且有点炸。我发现好多人在反复听，就把一些重点拿到这节课，帮大家总结一下。第一，先总结上期；第二，把人类说明书、《问道》和整个章程跟大家说清楚，说完就完事了，所以今天比较简单。 在这里先替我朋友做个广告。梵音现在又在做半价活动，一直到9月10号，等于阴历七月份完事就结束。据说全新上架了，半年的、一年的、一个月的都有，都是半价。 没购买的，大家赶紧去购买。我虽然不知道未来会不会有什么意外，但坚决不同意一周只录一期。这样一年才52周，连天道思维都录不完，肯定不行。 我打算前三集录完之后，自己再重新看一下之前怎么说的。好多学生也写了非常好的提纲和细节，写得真的挺好。正式节目的时候，我还得把大家的图加上。非正式节目，也就是讨论版、碰撞版，没有图，都是讲完之后大家提感觉。所以大家该吐槽的时候，赶紧吐槽。 正常情况下，怎么也得两到三天一集，不然几百集什么时候才能录完？但老出意外，我也没招。 正式开始《问道》三。首先总结《问道》二，因为核心内容太多，颠覆性的东西也比较多，我看大家重复看的次数不少。正常情况下，就凭咱们这水平，两千多粉丝。 今天还有人说，有7100人订阅了。别着急，本年度正常情况下应该不会超过一万。去年测过、看过，好像超不了一万。明年在大陆，还有全球正式开播《问道》，估计先把天道部分播了，明年可能新增一两万粉丝。到2030年，粉丝数能上五万就算不错。 咱们上的人都是铁粉，没有虚的。不像其他主播，虚的太多，也不消费；咱们基本上还是消费，大头比较厉害。所以别着急，今年正常情况下上不了一万。你们不仅是金粉，是钻石粉。 好，正常开始。上期有一些概念，我们得重新说一下。"},{"id":"ep3-k02","course":"ep3","number":2,"topic":"迷与困","title":"再说迷与困：重复与限制","summary":"本课再次区分在错误中不断重复的“迷”，与被限制在某种认知或空间中的“困”。","points":["迷：走错，而且反复走错。","困：限制可能来自物理边界，也可能来自思想与认知。","讲者继续用井蛙和习以为常说明难以察觉的限制。"],"start":54,"end":61,"quote":"第一个，什么是迷？你走错了，而且不停重复走错，就叫迷。比如迷路，转来转去，反正找不着正确方向。在轮回中，如果迷了，是一种什么现象？就是在错误中不停重复。","quoteIndex":55,"related":["ep2-k04","ep2-k09"],"section":"ep3-p53","sectionTitle":"二 重说迷困与三把锁","searchText":"问道三 人类说明书框架 第3课 问道3 再说迷与困：重复与限制 本课再次区分在错误中不断重复的“迷”，与被限制在某种认知或空间中的“困”。 迷与困 迷：走错，而且反复走错。 困：限制可能来自物理边界，也可能来自思想与认知。 讲者继续用井蛙和习以为常说明难以察觉的限制。 二 重说迷困与三把锁 迷与困的定义 第一个，什么是迷？你走错了，而且不停重复走错，就叫迷。比如迷路，转来转去，反正找不着正确方向。在轮回中，如果迷了，是一种什么现象？就是在错误中不停重复。 但谁定义正确还是错误？肯定是天道，不是你。所以你并不觉得自己生命中的很多东西是错误的。这才是迷：你不知道自己做错了，也不知道自己不知道，才会出现这种情况。 第二个，什么是困？把你限制在一个地方出不来，称之为困。物理上这样，思想上也是把你限制在某些思维、某些认知里面出不来。 困分小困和大困，小困是约束，大困是自由。之前用井底之蛙说了三种困的级别。第一种，压根不让你看到光，把井盖焊死，一点光不露出来。青蛙从来没看到过光，都不知道有井外这么个事，这是大困。 第二个是中困，让你看到光，但是你自己没出息，获得不了。试了几次不好使，那就放弃，这是第二种。 第三种，给你一种找到自由、得到解脱的方式，并且帮助你获得解脱和自由。你以为走出井口，其实只是换一种方式，又把你困在世界中。这是人类现在正在经历的超级大困。 我把科技树放开，让你看到、得到很多东西，让你看到通过自己的努力，获得物质文明的极大发展，但精神文明始终被我牢牢抓住。精神上的困，最重要的是习以为常。没觉得不一样，没觉得有差距，没觉得痛苦，还觉得一直在往上走。这才是最可怕的地方。"},{"id":"ep3-k03","course":"ep3","number":3,"topic":"三把锁","title":"三把锁的复述：知道之后仍可能做不到","summary":"本课依次回顾真相锁、思维锁，以及明知不对仍难以克服的“原罪”。","points":["真相锁：没有机会接触相关信息。","思维锁：接触到了，却不继续沿着问题追问。","第三种限制接续第二课的设定锁，着重讨论难以改变的默认反应。"],"start":62,"end":67,"quote":"为了困住你，有三把锁，配合上面三种方式。第一个叫真相锁。我不让你看到真相，不让你知道井外存在，你怎么可能想井外之事？我直接不让你知道外面的世界怎样，这是真相锁的作用，对我们的约束非常大。","quoteIndex":63,"related":["ep2-k11","ep2-k15"],"section":"ep3-p53","sectionTitle":"二 重说迷困与三把锁","searchText":"问道三 人类说明书框架 第3课 问道3 三把锁的复述：知道之后仍可能做不到 本课依次回顾真相锁、思维锁，以及明知不对仍难以克服的“原罪”。 三把锁 真相锁：没有机会接触相关信息。 思维锁：接触到了，却不继续沿着问题追问。 第三种限制接续第二课的设定锁，着重讨论难以改变的默认反应。 二 重说迷困与三把锁 真相锁 思维锁与原罪 为了困住你，有三把锁，配合上面三种方式。第一个叫真相锁。我不让你看到真相，不让你知道井外存在，你怎么可能想井外之事？我直接不让你知道外面的世界怎样，这是真相锁的作用，对我们的约束非常大。 这么多伟大的科学家，最后居然得出人生没有意义，那只能说你没有意义，人生有意义的多了。得出这种思维的人，绝大多数没看到过人生之外的世界，所以才能得出人生没有意义。 第二个叫思维锁，很像第二种情况：让你看到真实，但不让你往真实、正确的方向想。佛祖、菩萨、佛家道家的神，有没有把一些东西传下来？传了。但传完后你使不了，而且都不觉得传下来的东西有问题，从来没怀疑过，下意识脑子就没往那方面想。 让你看到了，你就是不往那方面想，没招。这叫思维锁，把你的思维方向锁上。 第三个叫原罪。就算知道做错了，也改变不了。比如减肥，都知道多吃不好，能克服吗？不一定。都知道淫念不对，能克服吗？做不到。都知道发火不对，能克服吗？几乎克服不了。让你知道了也解决不了，这叫原罪。"},{"id":"ep3-k04","course":"ep3","number":4,"topic":"觉醒与解脱","title":"第三课修订：觉醒与解脱分开定义","summary":"讲者明确修正第二课的混用：觉醒是发现或确定问题；解脱是不再伤害、永不复现。","points":["觉醒：发现或者确定自己的哪些事情有问题。","解脱：那些原本造成伤害的规则，不再继续伤害自己。","发现问题与解决问题，在本课被分开讨论。"],"start":68,"end":78,"quote":"我们上次说了觉醒。后来一些学生跟我聊，说你把觉醒和解脱的定义混淆了。我一想，确实这样。觉醒其实只是发现问题，但能不能真的醒，还不好说。所以现在重新更改一下觉醒的定义。","quoteIndex":70,"related":["ep2-k17","ep3-k05"],"section":"ep3-p68","sectionTitle":"三 修正觉醒与解脱的定义","searchText":"问道三 人类说明书框架 第3课 问道3 第三课修订：觉醒与解脱分开定义 讲者明确修正第二课的混用：觉醒是发现或确定问题；解脱是不再伤害、永不复现。 觉醒与解脱 觉醒：发现或者确定自己的哪些事情有问题。 解脱：那些原本造成伤害的规则，不再继续伤害自己。 发现问题与解决问题，在本课被分开讨论。 三 修正觉醒与解脱的定义 三 修正觉醒与解脱的定义 发现问题是觉醒 不再伤害是解脱 我们上次说了觉醒。后来一些学生跟我聊，说你把觉醒和解脱的定义混淆了。我一想，确实这样。觉醒其实只是发现问题，但能不能真的醒，还不好说。所以现在重新更改一下觉醒的定义。 觉醒，是发现或者确定自己的哪些事情有问题。 这是非常重要的标准。如果修行半天，连轮回中所做的哪些事情有问题、怎么伤害你，都没搞清楚，修行个屁！你还活在错误中，时刻被伤害，怎么说自己醒了？所以得能够发现、觉察自己哪里有问题。 解脱，叫不再伤害、永不复现。 咱们上次说的有点问题。你想，一根绳子，不管捆得紧还是松，都还捆着你。在轮回里，什么是绳子？规则。有一些规则能影响你，让你持续犯错误。你摆脱了吗？肯定没摆脱；摆脱了，怎么还能被规则影响而犯错？比如情绪法则，你摆脱了吗？ 真正的解脱，就是某些对你产生伤害的规则，无法再伤害你。这是解脱。 成佛需要什么？叫自觉、觉他、觉满。什么叫明心见性？你得清清楚楚知道轮回里的规则，哪些对自己有伤害，哪些没伤害。没伤害并且有益的，持续加强；有伤害的，坚决不能继续。这是真正的觉醒圆满，称为觉满。一般说自觉、觉他、觉满，然后可以成佛。 但咱们现在要求更严格一些，你必须解脱满了，觉满不行。觉满只是确定有些东西能伤害你，但有没有真正解脱？规则能不能永不复现？不能做到。所以我们认为，成佛的标准，至少得是解脱圆满。 所有对你产生伤害的规则，都无法再伤害你，我们才认为你真的成佛。佛教有个说法叫大自在身。为什么叫大自在？因为产生负面影响的一切规则、枷锁，都从身上拿下去了，那不就自在了吗？身上还有枷锁，怎么称为大自在？其实很简单。"},{"id":"ep3-k05","course":"ep3","number":5,"topic":"觉醒与解脱","title":"解脱的四个境界","summary":"本课将解脱的进程分为逃避、对抗、免疫、永不退转四个境界。","points":["逃避：通过离开相关情境，暂时避免影响。","对抗：面对情境时，仍需要用力压制或转移反应。","免疫：面对同样影响时不再受其伤害；永不退转则要求这种状态持续稳定。"],"start":79,"end":85,"quote":"解脱加上四个境界。发现有问题，是觉醒；解决问题，是解脱。","quoteIndex":80,"related":["ep2-k18","ep3-k12","ep6-k27","ep8-k14"],"section":"ep3-p68","sectionTitle":"三 修正觉醒与解脱的定义","searchText":"问道三 人类说明书框架 第3课 问道3 解脱的四个境界 本课将解脱的进程分为逃避、对抗、免疫、永不退转四个境界。 觉醒与解脱 逃避：通过离开相关情境，暂时避免影响。 对抗：面对情境时，仍需要用力压制或转移反应。 免疫：面对同样影响时不再受其伤害；永不退转则要求这种状态持续稳定。 三 修正觉醒与解脱的定义 解脱的四个境界 解脱加上四个境界。发现有问题，是觉醒；解决问题，是解脱。 第一个境界是逃避。比如修淫念，看一个大姑娘很喜欢，一产生这个心，知道不对，动了男女桃心。所以跑到深山老林，不见女色。女色对你有没有伤害？没有了。但是解决这个问题了吗？没解决，只是在逃避。 第二种是对抗。碰了女色，天天想着不净，有个叫不净观，对不起，业务不精。想着这就是一个皮囊，里面包着屎尿粪便，说白了，属于自己恶心自己，这叫对抗。 白骨观也是对抗，不过是转移概念；不净观属于自己恶心自己。这些都是一种方式，但当你起心动念有这个想法时，也没有达到究竟。 真正达到究竟，我们称之为免疫。比如身边有没有感冒病毒？仍然有。但吃完感冒药之后，身上产生一种抗体，虽然还能吸引感冒病毒，病毒也继续侵蚀我，却已经不会产生任何影响，这叫免疫。 一次免疫是圆满吗？肯定不是。必须次次圆满，在任何情况、任何等级下，都要圆满。能达到这种状态，就叫永不退转。好，四个等级。"},{"id":"ep3-k06","course":"ep3","number":6,"topic":"觉醒与解脱","title":"得到外在结果，也要看是否减少消耗","summary":"讲者在自身的轮回观中，用“熵增”类比未摆脱负面影响时的持续消耗。","points":["本节区分获得财富、名气或地位，与是否真正解决反复造成伤害的问题。","“持续消耗”的判断属于本课所使用的解释框架。"],"start":86,"end":89,"quote":"就算达到天帝、大罗金仙，只不过往上冲，最终还得往下走。为什么？始终没有解决这个空间对你的规则影响。当你把负面规则影响全部解决，又能得到正向力量时，才能往上走。这很重要，上次没说，这次补充。","quoteIndex":89,"related":["ep3-k04"],"section":"ep3-p68","sectionTitle":"三 修正觉醒与解脱的定义","searchText":"问道三 人类说明书框架 第3课 问道3 得到外在结果，也要看是否减少消耗 讲者在自身的轮回观中，用“熵增”类比未摆脱负面影响时的持续消耗。 觉醒与解脱 本节区分获得财富、名气或地位，与是否真正解决反复造成伤害的问题。 “持续消耗”的判断属于本课所使用的解释框架。 三 修正觉醒与解脱的定义 没有解脱时的消耗与熵增 很多同学问，如果觉醒不了，或者没按你的方法修行，会怎么样？那叫众生恒定向下，要进入熵增法则。只要不能解脱这些约束，一定进入熵增法则里，基本就叫瞎折腾。 会不会有钱？会，但整个轮回过程，只是消耗自己的福报。会不会有名气？通过努力也会，但绝大多数叫消耗。使劲修行能不能飞升？可以位列仙班，干得好，说不定能当天帝。但记住，有33层天，再怎么努力，往上涨一两层天问题不大，想涨更多，对不起，只能说瞎折腾。 就算达到天帝、大罗金仙，只不过往上冲，最终还得往下走。为什么？始终没有解决这个空间对你的规则影响。当你把负面规则影响全部解决，又能得到正向力量时，才能往上走。这很重要，上次没说，这次补充。"},{"id":"ep3-k07","course":"ep3","number":7,"topic":"智慧落地","title":"定义、用途和应用过程都要讲清","summary":"本课延续对结果性知识和描述性解释的讨论，追问学完之后如何真正使用。","points":["需要说明目的、使用场景、应用条件、成本与代价。","只说最高状态，不能替代达到该状态的具体过程。","零散的观点，还需要连接为可理解、可应用的结构。"],"start":91,"end":104,"quote":"古人的很多知识点，会出现没有意义的情况：学完后意义是什么，不知道；目的是什么，不知道；使用场景、应用条件、成本、代价，包括修行过程，都没说，这是很大的问题。","quoteIndex":94,"related":["ep1-k18","ep2-k20"],"section":"ep3-p90","sectionTitle":"四 把有用的知识成片并带进生活","searchText":"问道三 人类说明书框架 第3课 问道3 定义、用途和应用过程都要讲清 本课延续对结果性知识和描述性解释的讨论，追问学完之后如何真正使用。 智慧落地 需要说明目的、使用场景、应用条件、成本与代价。 只说最高状态，不能替代达到该状态的具体过程。 零散的观点，还需要连接为可理解、可应用的结构。 四 把有用的知识成片并带进生活 缺少定义与应用过程的问题 上次还说，古人和圣贤定下的很多东西，没有真正的定义。没告诉你，比如智慧存在是解决什么问题，空色存在是解决什么问题。 修佛法，最后要实现什么目的？无上正等正觉，平时应该怎么做？没说。这些东西传下来了，但没有定义，没有详细说明，我们认为这对整个人类有阻碍。 古人的很多知识点，会出现没有意义的情况：学完后意义是什么，不知道；目的是什么，不知道；使用场景、应用条件、成本、代价，包括修行过程，都没说，这是很大的问题。 最后一帮大聪明在后面猜。猜对了，可能有帮助；猜错了，扯淡，费一辈子努力，最后也修得扯淡。2500年内，虽然得到圣贤一些高端智慧，其实没怎么改变人类。 这里涉及几个问题。第一，很多知识是我自己起的词，叫圆满的结果性知识。告诉你的东西对不对？对，但没告诉你怎么得到，只说修完是这个状态，怎么修出这个状态，不知道。 比如无为而无不为，比如“不修智慧的时候就得智慧”，比如佛祖去燃灯佛那里无所得。你都无所得，我们应该怎么样？他说得对，但这种圆满的结果性智慧没办法操作。学武功最后无招胜有招，但之前的状态怎么得到？这就是问题。 第二，很多东西是描述性的说明，不是真正定义。比如什么是爱情，没有定义，最后翻到的只是“我认为什么是爱情”，在描述爱情的一种状态。问什么是智慧，他说智慧能解决什么问题，列出其中一种状态，这叫描述性的解释，不是定义。 最后没人知道修佛应该怎样。再加上一些说法，比如把佛祖当柴火烧，文殊菩萨是挑大粪的，说得对不对？是对，只是某一种意思，但没告诉你怎么弄。王阳明说“心外无物”，什么是心，为什么心外无物，又没解释。一帮大聪明只能琢磨，琢磨出一个就说想明白了。 还有致良知，什么叫良知？不知道。外国史咱没学过，但中国老祖宗的文化，绝大多数没有明确的定义。前几天看到一个大聪明说：“天地不仁，以万物为刍狗，我说的跟你们不一样。” 其实说出什么都没用。只要不是老子亲自跑过来，告诉你具体什么意思，其他人都是自己琢磨。反正没有具体标准，那说呗。你看到的所有东西，都是大聪明集合。 第三，叫没有用的误导，就是瞎用功。比如“本来无一物，何处惹尘埃”，前几天好像有个在美国学佛学的，据说他们几十个博士生都用这句话做论文课题，不闲的吗？ 像无无这种东西，佛界都不一定能确定有，学完关你什么事？你能在人间达到无无吗？先琢磨怎么把身边的事修好吧，这就是一帮大聪明干的事。 古代圣贤有没有把东西传下来？传了，但都是零星、点状的知识。老子说一部分，佛祖说一部分，圣贤又说，最后大家真的明白了吗？还是没明白。这叫星星之火没有燎原。"},{"id":"ep3-k08","course":"ep3","number":8,"topic":"智慧落地","title":"把有用的知识成片，带进生活","summary":"“为圣贤打补丁”在本课指向两件事：连接有用知识，并让知识真正生活化。","points":["不只比较理论高低，也观察生活中的问题有没有改变。","逐个处理会持续造成伤害的问题，把观点变成能使用的方法。"],"start":105,"end":117,"quote":"我们要干什么？为圣贤打补丁。成不了圣贤，打打补丁还是可以的。第一，把有用的知识成片；第二，把有用的知识真正生活化。","quoteIndex":106,"related":["ep2-k27","ep3-k18"],"section":"ep3-p90","sectionTitle":"四 把有用的知识成片并带进生活","searchText":"问道三 人类说明书框架 第3课 问道3 把有用的知识成片，带进生活 “为圣贤打补丁”在本课指向两件事：连接有用知识，并让知识真正生活化。 智慧落地 不只比较理论高低，也观察生活中的问题有没有改变。 逐个处理会持续造成伤害的问题，把观点变成能使用的方法。 四 把有用的知识成片并带进生活 为圣贤打补丁与体系的形成 我们要干什么？为圣贤打补丁。成不了圣贤，打打补丁还是可以的。第一，把有用的知识成片；第二，把有用的知识真正生活化。 我根本不关心谁的理论高、谁的理论低，只关心一个指标：学完以后，在轮回中有没有不再被这些规则伤害。如果学完了，规则该怎么伤害还怎么伤害，那就学了个寂寞。不伤害就是解脱，伤就是没解脱。 所以一定要建立不一样的思维模式，把轮回里能持续伤害人类的问题，一个一个解决。问题很多，咱一个一个解决，应该怎么做人、怎么做事，都是这样。别跟我说无无、无无无那些高深的东西，我更关心这个事有没有从生命里拿掉。拿掉就OK，没拿掉，扯淡。 这也算我的一个天赋神通。我那天仔细琢磨，自己经常干的事，就是研究古人的东西，看得一知半解就觉得不对，自己瞎琢磨，琢磨完创造出一套新的东西。 比如紫微斗数，我那时候叫金刚佛光。全天下紫微斗数分两种，一种是金刚佛光的紫微斗数，一种是其他。其他的基本都是在原有基础上，大师们发现新点，或者有使用心得，基本没例外，但我的东西跟他们完全不太一样。 以后修行体系也一样。我看完一堆人的体系，发现不太对，不应该这么修。 但为什么，不知道，就在那里琢磨，过程很痛苦。尤其当年紫占，从迷茫、完全不知道对错里面，一条一条总结正确的东西，很费劲。大量试错，真有上万次错误，才总结出一套体系，修行这边也一样。 总结了很长时间，正好将近十年，有十万个以上案例，不停看到不同人生。大量试错、大量看，发现真实的东西跟传统不太一样。知识点必须成片，不是突然悟了一两个就有用。古人终其一生，也就悟那几个知识点。 那几个点不足以真正解脱、往上走，必须成片，包罗万象，涉及各个方面都能解决，这才是有用的知识。所以这就是我的天赋神通，专门喜欢研究，否定传统，再创一个新的。新的好不好使，咱们看疗效。 我希望有一天，人间的修行体系也是“点亮星空的修行体系和其他”，希望能做到。 紫占等我七八十岁的时候吧，这么好的运，别浪费在紫占上。对不起紫微星君，这么好的机会、大运，肯定要多为人类做事情。 等76岁之后走大败运，开始写回忆录，什么决定都别做，天天啃点馒头、喝点茶。走败运别做决定，别乱花钱，离医院近点，方便抢救。其他时间，不是写回忆录，就是吹，或者聊紫微。这是我给自己想的76岁以后的养老生活。哪天一旦Game Over，拜拜，就完事了。"},{"id":"ep3-k09","course":"ep3","number":9,"topic":"课程导读","title":"人类说明书的四大框架","summary":"本课再次明确：以《问道》的形式，讲述人类说明书的四个部分。","points":["逆修觉者、灵魂觉者、法界天机、道法自然。","讲者用学习已有知识的例子，说明可以在他人的指导下理解和练习。"],"start":119,"end":122,"quote":"老师带着学什么？以《问道》的形式学人类说明书。框架有四个：逆修觉者、灵魂觉者、法界天机、道法自然。咱这一辈子写出这四本书就行。为什么要有这四部分？没办法，我也是吃了亏才发现，这四部分得给。","quoteIndex":122,"related":["ep1-k01","ep2-k30"],"section":"ep3-p118","sectionTitle":"五 四大框架与次第修行","searchText":"问道三 人类说明书框架 第3课 问道3 人类说明书的四大框架 本课再次明确：以《问道》的形式，讲述人类说明书的四个部分。 课程导读 逆修觉者、灵魂觉者、法界天机、道法自然。 讲者用学习已有知识的例子，说明可以在他人的指导下理解和练习。 五 四大框架与次第修行 跟着老师学习人类说明书 修行有两条线，一个是自觉、觉他、觉满，一个是他觉、觉他、觉满。自觉这件事，我觉得你们就算了。包括这么多圣人，能不能把人间坑你们的指标和规则都找出来，还不一定。一辈子也就想明白那点事，你们别再自己觉了，找明白人跟着学就行，叫他觉。 就像从小学到大学，学了将近两万到四万个知识点，哪个也不是你发明的，耽误成才了吗？压根没耽误。觉醒和修行之路不易，要有老师带着。 老师带着学什么？以《问道》的形式学人类说明书。框架有四个：逆修觉者、灵魂觉者、法界天机、道法自然。咱这一辈子写出这四本书就行。为什么要有这四部分？没办法，我也是吃了亏才发现，这四部分得给。"},{"id":"ep3-k10","course":"ep3","number":10,"topic":"规则与实践","title":"体系重心：修心、智慧、觉醒与解脱","summary":"讲者在本节解释自身体系为何调整重心，强调发现并处理自己的问题。","points":["本节以讲者的天道观说明“弱化神通”的想法。","核心追问是：获得暂时帮助之后，是否真正改变了原来的认知和行为？"],"start":123,"end":132,"quote":"2025年底，我再去弄的时候，一部分认为我们有功德，一部分认为没有功德，还祸乱天下。所以为什么2025年底开始重新做这些事？首先要弱化神通，以修心、修智慧、觉醒和解脱为主。这是我们重新更改的东西，修心很重要。","quoteIndex":132,"related":["ep3-k11","ep3-k12"],"section":"ep3-p118","sectionTitle":"五 四大框架与次第修行","searchText":"问道三 人类说明书框架 第3课 问道3 体系重心：修心、智慧、觉醒与解脱 讲者在本节解释自身体系为何调整重心，强调发现并处理自己的问题。 规则与实践 本节以讲者的天道观说明“弱化神通”的想法。 核心追问是：获得暂时帮助之后，是否真正改变了原来的认知和行为？ 五 四大框架与次第修行 天道考核与弱化神通 第一个是天道考核。一定要站在天道立场，想想为什么成立人间。是让你当大忽悠、当大仙、当神算子吗？想什么呢？天道本身的意义，是考核人间，是培训、提高，所以要奖励这些东西。 你们认为我们是什么？比如“小数除不尽”的这种人，叫系统漏洞。怎么都会有小数除不尽的这种人。漏洞分大、小，大点的漏洞能使用更多上维空间的东西，就叫有神通。 但从上古年代往下走，整个世界越来越弱化神通。以前没仔细想，后来才发现，整个天道在弱化神通，但不是说不让你有。所以有很多神佛仙、鬼怪精怪的故事，灵异事件也时不时发生，却让你证明不了。这叫弱化神通。 为什么一定弱化神通？为什么神佛仙不能直接显现，让大家直接求神拜佛，不就完了吗？就是为了防止这些事情，不要让大家求神拜佛。 比如天道认为，创立人间界是让你学神通来的，是让你修心性来的。结果这些人没学心性、没学规则，没用正常的智慧思维解决身上的枷锁，最后都变成求神拜佛，哪行？那还要人间界干什么？法界不都能看到神佛仙鬼吗？哪个法界看不着，哪个法界不能使用神通？专门创造一个不能使用神通的地方，是为了让你偷摸使用神通的？所以这件事逐渐开始出现问题。 比如之前说的南山真人、倪海厦、白龙王，都是非常有神通的人，但为什么都有突发死亡事件，不是那么长寿？有没有想过？我以前还认识一个广西特别厉害的师傅，帮人救人一辈子，真的很厉害。 但为什么早亡，为什么有五弊三缺？一定要想想。因为你在人间强化神通，让更多人相信，变好不是找自己的问题，而是求神拜佛，用神通术法、风水、算命、符箓解决。这和天道设立人间大相径庭，所以天道惩罚很大。 不要觉得这些人积德行善了。他们有没有短时间帮助你？有，包括还阴债，都在短时间帮你。但在轮回里，真的从问题上解脱了吗？没有，更多是拿自己的经济和天地做了交易。 2025年底，我再去弄的时候，一部分认为我们有功德，一部分认为没有功德，还祸乱天下。所以为什么2025年底开始重新做这些事？首先要弱化神通，以修心、修智慧、觉醒和解脱为主。这是我们重新更改的东西，修心很重要。"},{"id":"ep3-k11","course":"ep3","number":11,"topic":"学习路径","title":"木桶原则与学习次第","summary":"本课用木桶的比喻说明，单一帮助未必能弥补其他方面的缺口。","points":["先修认知，形成适合继续学习的状态。","把行为、关系和理解一起纳入考察。","稿中具体年份及考核安排，是当次试讲中的规划。"],"start":133,"end":138,"quote":"为什么四个地方一起修？前三个必须成为次第。未来一定叫次第修行。首先修认知，知道轮回怎么坑你，把这个先修好，得有一个好的修行状态。","quoteIndex":136,"related":["ep3-k09","ep3-k12"],"section":"ep3-p118","sectionTitle":"五 四大框架与次第修行","searchText":"问道三 人类说明书框架 第3课 问道3 木桶原则与学习次第 本课用木桶的比喻说明，单一帮助未必能弥补其他方面的缺口。 学习路径 先修认知，形成适合继续学习的状态。 把行为、关系和理解一起纳入考察。 稿中具体年份及考核安排，是当次试讲中的规划。 五 四大框架与次第修行 木桶原则与学习次第 第四个，木桶原则。大家知道我之前干什么。为什么有的人好使，有的人不好使？因为法界力量只是木桶里的一块木板，其他东西都不行，肯定不好使。 比如求贵人符，天天欠逼五六地跟贵人说话，贵人能帮你才见了鬼；请小人符，天天还踹人两脚，那人家不是你的小人才怪。所以得把所有木板弄好，最后用法界力量。 为什么四个地方一起修？前三个必须成为次第。未来一定叫次第修行。首先修认知，知道轮回怎么坑你，把这个先修好，得有一个好的修行状态。 没有修行好的状态，后面的东西跟你没关系，可以学，但没资格体验。2028年吧，从2028年开始，以后想学法界，想体验灵魂觉者，逆修觉者的考试得合格。想在我这里请符、还阴债、解决风水、算命，逆修觉者和灵魂觉者至少得考试及格，才有资格。不然我不卖，我也不缺这点钱。这是未来的次第学习。 以前学不学，先直接卖了。有的帮上忙，有的没帮上，有的还建立错误认知，认为只要花钱就能解决。尤其洗灵，把天地怨气、不好的东西洗掉，有的人出去找小姐，回来赶紧洗灵，给我干这个，那肯定助纣为虐。所以以后前面过不去，连洗灵的资格都没有。"},{"id":"ep3-k12","course":"ep3","number":12,"topic":"学习路径","title":"逆修觉者：反本能、反惰性、反旧我","summary":"本课将逆修觉者的任务放在真相、认知和思维模型上，讨论如何改变已经熟悉的反应。","points":["不仅理解一件事，也要改变看法与行动。","习以为常的认知和行为，可能正是需要重新检查的部分。","知道要改与真正改变之间，仍需要持续练习。"],"start":139,"end":150,"quote":"继续说每个阶段主修什么。逆修觉者解决真相、认知、思维模型的问题：这事应该怎么想、怎么看、怎么行动，这是逆修觉者应该做的。","quoteIndex":141,"related":["ep1-k24","ep4-k03"],"section":"ep3-p139","sectionTitle":"六 逆修觉者 修真相认知与思维模型","searchText":"问道三 人类说明书框架 第3课 问道3 逆修觉者：反本能、反惰性、反旧我 本课将逆修觉者的任务放在真相、认知和思维模型上，讨论如何改变已经熟悉的反应。 学习路径 不仅理解一件事，也要改变看法与行动。 习以为常的认知和行为，可能正是需要重新检查的部分。 知道要改与真正改变之间，仍需要持续练习。 六 逆修觉者 修真相认知与思维模型 六 逆修觉者 修真相认知与思维模型 反本能 反惰性 反旧我 继续说每个阶段主修什么。逆修觉者解决真相、认知、思维模型的问题：这事应该怎么想、怎么看、怎么行动，这是逆修觉者应该做的。 逆修觉者不涉及任何神通法术，所以任何国家都可以传播，不涉及神佛仙、封建迷信，就是思维模型：碰到事情应该怎么想，应该具有什么思维。 哪个地方都可以传播。既然活在梦幻泡影中，一条条枷锁把你捆在梦里，我们就要一个个从你身上拿下来。记住，非常痛苦，就跟很多人减肥一样。 包括血糖仪，为什么刚开始很痛苦？吃完马上出数值，你知道这个东西吃不了了，就难受。原来那样吃不行，就得改一种吃法，都在跟自己斗争。所以叫反本能、反惰性、反旧我。不把过去的自己杀死，如何获得新生？ 像我糖尿病，如果一直保持高血糖，还想活到七八十岁，想什么呢？能再活两年就不错。所以要做决定，想多活，数值必须稳定、好；不想活，那随便。想活得长，就必须改变之前的吃饭习惯。 包括改变食欲。我现在只有早上吃主食，其他时间不吃主食，都吃黄瓜、胡萝卜，偶尔啃“四分之一半”的苹果。就这样还降不下180，你想反旧我多难受？但一旦做好，就没问题。 脖子难受，就拿颈椎器固定。我戴着颈椎器睡觉，是防止睡着后窝着，尤其翻身时窝着睡，自己不知道，又控制不了，那就直接拿颈椎器、牵引器控制住，肯定难受。 但弄完后，至少这一两周不找按摩也没问题，脖子没事，肌肉不紧张了。这叫反旧我，之前的我会让我死得更快、更难受，必须反掉。 为什么叫逆修觉者？因为非常艰难。我们对伤害自己的一切太习以为常，把很多认知、思想、行为、感受、下意识反应，都变得习以为常，但就是这些事情在不停伤害我们。 所以就算明白，也必须做成一个逆修者，“天地一逆修”才行，不容易，等同于逆天改命。改变曾经的习惯、意识、认知、反应，其实就相当于逆天改命，很难。"},{"id":"ep3-k13","course":"ep3","number":13,"topic":"课程导读","title":"天道思维与人道思维","summary":"本课介绍三类思维中的前两类：天道思维强调讲者所说的人间之外的视角，人道思维处理人间的做人做事。","points":["天道思维在本课程中使用较长时间和轮回的视角。","人道思维关注具体问题在人间如何处理。"],"start":151,"end":156,"quote":"我们用三个思维改变：天道思维、人道思维、人设思维。天道思维的主题，是用人间之外的思维，改变人类的认知、判断和行为。","quoteIndex":152,"related":["ep3-k14"],"section":"ep3-p139","sectionTitle":"六 逆修觉者 修真相认知与思维模型","searchText":"问道三 人类说明书框架 第3课 问道3 天道思维与人道思维 本课介绍三类思维中的前两类：天道思维强调讲者所说的人间之外的视角，人道思维处理人间的做人做事。 课程导读 天道思维在本课程中使用较长时间和轮回的视角。 人道思维关注具体问题在人间如何处理。 六 逆修觉者 修真相认知与思维模型 天道思维与人道思维 我们用三个思维改变：天道思维、人道思维、人设思维。天道思维的主题，是用人间之外的思维，改变人类的认知、判断和行为。 古代圣贤有没有弄出来？空色、有无、六道轮回、因果，都说了，但没说透，才导致你不知道什么是智慧、慈悲、大爱、不恨、冤冤相报何时了、贪念。这些绝大多数建立在无数世轮回的角度，看你的行为到底正确还是错误。 有些东西让我们舒服、快乐，有成就感，甚至短时间帮了别人，为什么还认为错误？比如现在帮人化解阴债，为什么大天道轮回认定你有问题？他被冤亲债主折腾成这样，为什么不能帮？很简单，第一，对他曾经伤害的人不公平。 第二，他没通过感悟理解到底错在哪里，你不能保证未来不再犯同样错误。所以从无尽轮回角度看，还阴债没有意义，甚至更长时间看是害了一个众生，只不过没办法。 第二个是人道思维，解决的是用正确的人间做法，解决碰到的问题。我觉得《道德经》里这方面的东西很多。"},{"id":"ep3-k14","course":"ep3","number":14,"topic":"认知与思维","title":"人设思维：别人如何认识你？","summary":"本课把人设思维与他人形成印象、理解自己及建立信任联系起来。","points":["讲者借“定位”的概念，讨论如何让他人更清楚地认识自己。","学到的知识，需要体现在行为中，而不只停留在知道。"],"start":157,"end":161,"quote":"有本书叫《定位》，20年前我就见过，应该出了几十年，也没见几个人真正读懂并用在生活里。不是知道得少，是知道的东西没固化在行为上。学了定位，就要反向给自己贴标签，帮助别人更好了解你。","quoteIndex":159,"related":["ep4-k05","ep4-k15"],"section":"ep3-p139","sectionTitle":"六 逆修觉者 修真相认知与思维模型","searchText":"问道三 人类说明书框架 第3课 问道3 人设思维：别人如何认识你？ 本课把人设思维与他人形成印象、理解自己及建立信任联系起来。 认知与思维 讲者借“定位”的概念，讨论如何让他人更清楚地认识自己。 学到的知识，需要体现在行为中，而不只停留在知道。 六 逆修觉者 修真相认知与思维模型 人设思维与信任 第三个叫人设思维。我们会下意识给人贴标签，能不能不贴？做不到，那是在改变整个人类设定。既然一定贴标签，就有一个法则，叫他人即世界。 有本书叫《定位》，20年前我就见过，应该出了几十年，也没见几个人真正读懂并用在生活里。不是知道得少，是知道的东西没固化在行为上。学了定位，就要反向给自己贴标签，帮助别人更好了解你。 这很重要。颜值、气息、行动、心性，最后产生信任。现在咱们有几千铁粉，为什么是铁粉？很重要的一点就是信任。很多东西我能给你们证明吗？证明不了，尤其很多产品，能证明什么？证明不了，所以这是非常有缘分的事情。 建立的就是信任。信任没有为什么，就是我信你，所以你说的东西我会做，这非常难得，但信任很难建设。"},{"id":"ep3-k15","course":"ep3","number":15,"topic":"课程导读","title":"灵魂觉者在课程中的位置","summary":"本节介绍人类说明书第二部分的定位，沿用讲者自身的灵魂与法界观。","points":["讲者将这一部分定位为处理其所说的“修行阻力”。","与前一部分的真相、认知和思维训练，在课程框架中分开讲述。"],"start":163,"end":170,"quote":"第二个是灵魂觉者。主要解决的第一大事情，叫修行阻力。","quoteIndex":164,"related":["ep3-k09","ep3-k16"],"section":"ep3-p162","sectionTitle":"七 灵魂觉者 法界天机与道法自然","searchText":"问道三 人类说明书框架 第3课 问道3 灵魂觉者在课程中的位置 本节介绍人类说明书第二部分的定位，沿用讲者自身的灵魂与法界观。 课程导读 讲者将这一部分定位为处理其所说的“修行阻力”。 与前一部分的真相、认知和思维训练，在课程框架中分开讲述。 七 灵魂觉者 法界天机与道法自然 灵魂觉者与修行阻力 第二个是灵魂觉者。主要解决的第一大事情，叫修行阻力。 你得把灵魂上的阻力弄没。比如读经读烦了，读出淫念或者谤佛的想法，这叫什么？业力重。自己根本不知道，不愿学习、不愿做事，到底有什么阻力在灵魂上影响自己。 所以有时候做完一些东西，会松快很多，接受、听懂一些东西，会不一样。这是灵魂觉者要干的事。 主要解决灵魂、灵力、能量。能量分正负，负能量消除，正能量提升。还有脉轮、前世。为什么涉及前世？有些人有怪异行为，需要解释，知道原来是这种情况，就明白了。 对于抑郁症、魂悲、魂裂、魂缺、魂碎，他的思想不完整，跟他讲再多逆修觉者的东西，也理解不了，或者做不到。见别人反感，见一些东西害怕，不是讲道理的事，是灵魂上有些负面的东西，想办法拿掉。包括对一些人的恨、执念的爱。 很奇怪的一些行为，比如同性恋，都是很大的问题，包括恐惧、怯懦、仇恨、抗拒亲密。这些不是劝的事，直接过来，把那东西拿掉，自己就好很多，就这么简单。包括身上有病气，也是很正常的。 还有业力虫子、思维生命、影魂，都要解决。对灵魂、思维和法界的思维进行修补、清理、补充、增益、引导、陪伴。没有这些，想顺利学正法，不一定接受得了，身体里肯定有东西捣乱。这是灵魂觉者要做的事。"},{"id":"ep3-k16","course":"ep3","number":16,"topic":"课程导读","title":"法界天机计划讲哪些内容？","summary":"本节列出讲者拟在第三部分讲述的法界体系、历史及相关概念。","points":["内容按讲者的体系涉及神佛仙鬼、魂、位面等概念。","从以往的零散讲述，转向较为系统的介绍，是本节的规划。"],"start":171,"end":180,"quote":"以后的法界天机会更全面、更细、更系统。神佛仙鬼精怪，天地人三魂、大天魂、大地魂、影魂、识魂，怎么影响你，都会说。","quoteIndex":177,"related":["ep3-k09","ep3-k17"],"section":"ep3-p162","sectionTitle":"七 灵魂觉者 法界天机与道法自然","searchText":"问道三 人类说明书框架 第3课 问道3 法界天机计划讲哪些内容？ 本节列出讲者拟在第三部分讲述的法界体系、历史及相关概念。 课程导读 内容按讲者的体系涉及神佛仙鬼、魂、位面等概念。 从以往的零散讲述，转向较为系统的介绍，是本节的规划。 七 灵魂觉者 法界天机与道法自然 法界天机的范围 第三个是法界天机。上两个弄完，需要知道法界有什么东西，哪些有影响，哪些有帮助。灵魂觉者和法界天机，都只限海外。 绝大多数国家允许，只有少部分，比如朝鲜、某些大国，会有不同意见，所以不在那边发展，都在YouTube、Facebook上说这些就完了。 法界天机，我希望大家清楚知道一个真实的法界。法界无限宽广，但希望你们了解得足够多、足够系统。别最后还像一帮傻子，觉得有钱就多生儿子，靠概率总能生出一个厉害的。历代帝王、有钱人都有这个想法，但没解决。 有些方式，不用使劲生，只生一个也能解决。生一堆像小猪崽，该不行还是不行，数量不决定质量。两个特别优秀的男女，能不能配出特别天才的种？很多人经历很多次了，高斯、爱因斯坦都没配出来，大概率你也不行。有些全球首富、曾经华人首富也干过，没做出这事。 所以基因只能决定相貌，连身体素质都不一定能决定，更别说智商、福报，那绝对不可能，别费劲了。 以后的法界天机会更全面、更细、更系统。神佛仙鬼精怪，天地人三魂、大天魂、大地魂、影魂、识魂，怎么影响你，都会说。 各个位面，大世界比如六道、六道十界，小世界更多，还有碎片世界、夹缝空间、平行宇宙、思维生命。 还有影魂，各种法术、符、阵、灵，算事、看事、听事、观事，念头、天劫、降头、蛊虫，都会给大家说一遍。 还有法界历史演变，比如《山海经》为什么有的准、有的不准，怎么回事？法界历史和趣闻，轮回、本源、生死、因果，包括上面谁负责管，能说的都说，不能说的不行。时间法则，过去、现在、未来，也可以说说。这是老本行，之前讲了一部分，但很零散。"},{"id":"ep3-k17","course":"ep3","number":17,"topic":"学习路径","title":"道法自然：回归平静","summary":"本课把第四部分描述为回归平静，讨论平静生活、随缘、不恨和大爱。","points":["学习内容很多，并不意味着知道之后就已经会用。","本节随后引出知识固化与转化成本能的问题。"],"start":181,"end":183,"quote":"道法自然反而简单。能学到最后，最后的事叫回归平静：怎么平静生活、怎么随缘、怎么不恨、怎么大爱，还有咱们说的五爱，都是道法自然的事。","quoteIndex":182,"related":["ep3-k18"],"section":"ep3-p162","sectionTitle":"七 灵魂觉者 法界天机与道法自然","searchText":"问道三 人类说明书框架 第3课 问道3 道法自然：回归平静 本课把第四部分描述为回归平静，讨论平静生活、随缘、不恨和大爱。 学习路径 学习内容很多，并不意味着知道之后就已经会用。 本节随后引出知识固化与转化成本能的问题。 七 灵魂觉者 法界天机与道法自然 道法自然与回归平静 道法自然反而简单。能学到最后，最后的事叫回归平静：怎么平静生活、怎么随缘、怎么不恨、怎么大爱，还有咱们说的五爱，都是道法自然的事。 这些东西估计大概一两千集。但以为学完就能成功？我可以很负责地说，别想。因为人类学习要有次第，所有东西只是知道，并没有形成知识固化，也没转成自己的本能，这非常重要。"},{"id":"ep3-k18","course":"ep3","number":18,"topic":"学习路径","title":"从知道，到固化、应用与本能","summary":"本课区分记住法则、熟悉知识，与实际遇事时能够自然应用。","points":["考试能答对，不等于在生活里能识别和使用。","红尘道场在本课中的任务，是让知识落实到具体问题。","衡量重点是生活有没有改变，而非知识听起来多高深。"],"start":185,"end":191,"quote":"怎么办？最重要的其实不是讲这些，讲了没什么意义，真正的是红尘道场。主要干什么？知识落地化。我不关心哪个知识更高级、更深奥，只关心能不能在生活里解决问题，能不能让轮回中的一些错误永不发生。","quoteIndex":190,"related":["ep1-k11","ep2-k31","ep9-k04","ep10-k27"],"section":"ep3-p184","sectionTitle":"八 红尘道场 让知识在生活中落地","searchText":"问道三 人类说明书框架 第3课 问道3 从知道，到固化、应用与本能 本课区分记住法则、熟悉知识，与实际遇事时能够自然应用。 学习路径 考试能答对，不等于在生活里能识别和使用。 红尘道场在本课中的任务，是让知识落实到具体问题。 衡量重点是生活有没有改变，而非知识听起来多高深。 八 红尘道场 让知识在生活中落地 从知道到固化 应用与本能 连跟了我这么久的学生，有些法则在自己生活中犯了，居然没有感悟，很神奇。所以就算法则考试得100分，也没用，必须想办法，第一，法则固化、知识固化。 第二，转化成本能。人类整个思维也进入第四个阶段。第一阶段，有书就行，谁家有几本书，就会不一样。第二阶段，印刷阶段，书多了，谁读得多，谁占优势。 第三阶段叫精读，比如逻辑思维、樊登读书会，解决哪些东西有用、哪些没用。但记住，绝大多数东西对你没有用，就算有用，学完也只是知道，没有知识固化，没有形成本能，更没有进入知识应用、生活应用，所以学的东西没用。 一生学了很多，却解决不了命运问题，就是没有在生活中改变一些东西。 怎么办？最重要的其实不是讲这些，讲了没什么意义，真正的是红尘道场。主要干什么？知识落地化。我不关心哪个知识更高级、更深奥，只关心能不能在生活里解决问题，能不能让轮回中的一些错误永不发生。 做不到这点，跟曾经圣贤们做的事几乎没有两样。所以我们最伟大的地方是红尘道场。但现在开不起来，因为知识还没讲完，更别说带着练习了。红尘道场很重要，也是解决所有位面众生问题的一种重要方式。"},{"id":"ep3-k19","course":"ep3","number":19,"topic":"智慧落地","title":"实用，也要有能放心提问的地方","summary":"本课希望学习环境既能处理生活问题，也允许人放下防备，提出真正的困惑。","points":["家庭、沟通、事业和人生方向等，都被列为实践场景。","除了要求努力，也要说明怎样判断、做决定和经营关系。"],"start":192,"end":199,"quote":"红尘道场解决几个问题。第一个是实用，不实用就没意义。一定在生活中使用天道、人道、人设知识，真正解决问题。家庭关系、婚姻、子女教育、情绪、人际沟通、人生方向、事业、财运、身体健康，都要实实在在落实。","quoteIndex":194,"related":["ep1-k06","ep3-k23"],"section":"ep3-p184","sectionTitle":"八 红尘道场 让知识在生活中落地","searchText":"问道三 人类说明书框架 第3课 问道3 实用，也要有能放心提问的地方 本课希望学习环境既能处理生活问题，也允许人放下防备，提出真正的困惑。 智慧落地 家庭、沟通、事业和人生方向等，都被列为实践场景。 除了要求努力，也要说明怎样判断、做决定和经营关系。 八 红尘道场 让知识在生活中落地 实用并可以放心提问 2025年1月之前，这个法则在天地间不存在，1月之后存在了。为什么可以用它帮助自己、解决问题？因为法则有根、有魂，这很重要，叫天道护佑。 红尘道场解决几个问题。第一个是实用，不实用就没意义。一定在生活中使用天道、人道、人设知识，真正解决问题。家庭关系、婚姻、子女教育、情绪、人际沟通、人生方向、事业、财运、身体健康，都要实实在在落实。 我们不玩虚的，别管什么佛祖上面还有没有佛祖，跟我们有什么关系？更关心有没有改变生活中的一个恶习，这比有没有某个佛祖重要。用规则和方法，让生活真正顺畅起来。 第二，红尘道场一定让大家随便问。像我们从苦命人家长大的，从小到大学会听话、努力、忍耐，却没人教怎么判断念头正确还是错误，怎么处理情绪，怎么做决定不踩雷，怎么经营人和人生之间的关系。 努力一辈子，一直不停应付一个又一个问题，能不能提前知道问题存在？上学不会学习，没人教，父母只会说。工作时人际关系、工作方法、办公室政治，没人说。谈婚论嫁犯很多错误，也没人告诉。 到现在，很多男生思维理解不了女生，女生理解不了男生，基本是两个物种互相对抗。别说一起解决外部问题，不互撕就不错。所以明明很努力爱众生、爱家人、爱孩子，最后却走进死胡同，努力未必得到好结果。 哪里错了不知道，就算最后明白，也没时间，不可能重来。我们希望有个地方，大家真正放下防备、戒备，放心提问。这是为什么叫《问道》的一个重要原因。"},{"id":"ep3-k20","course":"ep3","number":20,"topic":"学习路径","title":"学习与练习，也需要合适的环境","summary":"本节讨论知识的使用条件，以及环境对练习与反馈的影响。","points":["先学，再使用、练习和熟练。","讲者强调，应用方式需要结合具体关系与情境。","在能够得到回应的环境中，观察和调整自己的做法。"],"start":200,"end":205,"quote":"第三，给大家学习和应用的环境。任何东西都得先学，再用、练习、熟练。但不是任何环境都行。比如对别人的善解，叫论心不论迹，对家人、真正的修行环境可以，叫爱敬和道敬。你试试对办公室那些人无私，看会不会把你连骨头渣都榨没。","quoteIndex":201,"related":["ep3-k21"],"section":"ep3-p184","sectionTitle":"八 红尘道场 让知识在生活中落地","searchText":"问道三 人类说明书框架 第3课 问道3 学习与练习，也需要合适的环境 本节讨论知识的使用条件，以及环境对练习与反馈的影响。 学习路径 先学，再使用、练习和熟练。 讲者强调，应用方式需要结合具体关系与情境。 在能够得到回应的环境中，观察和调整自己的做法。 八 红尘道场 让知识在生活中落地 学习应用与善念得到回应的环境 第三，给大家学习和应用的环境。任何东西都得先学，再用、练习、熟练。但不是任何环境都行。比如对别人的善解，叫论心不论迹，对家人、真正的修行环境可以，叫爱敬和道敬。你试试对办公室那些人无私，看会不会把你连骨头渣都榨没。 所以一定有个地方，能产生善念的正反馈，真正应用这些东西，不要在其他地方乱用。因为其他人不一定是人，没有学习之前不一定是人。对非人类使用人类的东西，对自己会有伤害。 还有很多人想改变命运。我应该50岁走下坡运，不想走，怎么办？拿福报撑。比如生我们家孩子的时候，福报还差点，怎么办？得“戒功德”，而且必须是度化之功，帮助别人的功德还不行。 不要光在人间努力，说好好学习、努力工作、好好对人就能怎样，没用，因为没有那个功德、福报。需要一个环境，能够产生功德、福报，产生众生善缘，这非常重要。平时连自己都帮不了，还要帮别人，可能性多大？用你的方法，根本没戏。 所以要有个环境，有一堆方式，真实有效地帮助提升功德福报，这也是红尘道场很重要的一点。"},{"id":"ep3-k21","course":"ep3","number":21,"topic":"学习路径","title":"因果碰撞、案例与榜样","summary":"讲者用“因果碰撞”描述：某些理解需要在亲历、观察和领悟中逐渐变成自己的东西。","points":["听明白、练熟与真正入心，并非同一个阶段。","具体案例和榜样，能帮助理解知识在人间怎样应用。"],"start":206,"end":210,"quote":"这需要明悟。其中有一种悟，必须通过因果碰撞才能悟，别人帮不了，我也帮不了。只有某一天碰上，才会从我的东西、学来的东西，变成你自己的东西，融合到生命、轮回里，这没有办法。","quoteIndex":209,"related":["ep3-k18","ep4-k23","ep10-k22"],"section":"ep3-p184","sectionTitle":"八 红尘道场 让知识在生活中落地","searchText":"问道三 人类说明书框架 第3课 问道3 因果碰撞、案例与榜样 讲者用“因果碰撞”描述：某些理解需要在亲历、观察和领悟中逐渐变成自己的东西。 学习路径 听明白、练熟与真正入心，并非同一个阶段。 具体案例和榜样，能帮助理解知识在人间怎样应用。 八 红尘道场 让知识在生活中落地 因果碰撞 案例与榜样 再下一点，叫因果碰撞。想明白一个东西，不是讲明白了就明白，需要具体发生、看到、领悟一些事情。要有因果撞，但具体什么因果能把你撞醒，不知道。 每条法则、规则、知识，需要多长时间、多少年，发生什么事情，才能真正明悟？没人知道，也许十万年，也许下一秒。所以需要因果碰撞。没有这个，所学就算练得滚瓜烂熟，也不能真正入心、成为本能。 这需要明悟。其中有一种悟，必须通过因果碰撞才能悟，别人帮不了，我也帮不了。只有某一天碰上，才会从我的东西、学来的东西，变成你自己的东西，融合到生命、轮回里，这没有办法。 红尘道场需要很多优秀案例、榜样。学完具体怎么在人间应用，具体事情怎么解决，并不知道，所以需要案例和榜样。尤其像小三那个，我们觉得案例和榜样非常厉害，应该让很多人学习，能够解决很多人的家庭问题。"},{"id":"ep3-k22","course":"ep3","number":22,"topic":"课程导读","title":"知识传播与教学劳动的费用","summary":"本节说明讲者对知识传播和带领学习的劳动费用所作的区分。","points":["讲者提出其知识内容不收费，出版等实际成本另作讨论。","本节也谈到学习者通过教学帮助他人的设想。","这些是当次试讲陈述的原则与规划。"],"start":212,"end":220,"quote":"我的所有知识不收费。我不认为知识应该收费，很多东西是上天给我的，不能拿着成为自己的敛财工具，所以知识不收费。","quoteIndex":214,"related":["ep3-k23"],"section":"ep3-p211","sectionTitle":"九 收入 家庭与修行正循环","searchText":"问道三 人类说明书框架 第3课 问道3 知识传播与教学劳动的费用 本节说明讲者对知识传播和带领学习的劳动费用所作的区分。 课程导读 讲者提出其知识内容不收费，出版等实际成本另作讨论。 本节也谈到学习者通过教学帮助他人的设想。 这些是当次试讲陈述的原则与规划。 九 收入 家庭与修行正循环 知识免费与教学劳动的费用 最后，红尘道场需要收入，记住，收入跟我没关系。尤其有些管制严的国家地区，神神鬼鬼、封建迷信的东西说不了，只能说逆修觉者。但逆修觉者可以法布施，可以改变很多人的思维、想法，可以形成产业链。 我的所有知识不收费。我不认为知识应该收费，很多东西是上天给我的，不能拿着成为自己的敛财工具，所以知识不收费。 包括现在的“子非”，当年太穷，收了点“紫薇”。但更多是带着你学习，收人工费，这没问题。现在整个人类说明书，所有知识全都不收费，记住，都不收费。以后如果出书，出版社或承包商可能收点费用。 毕竟有成本。但电子上的东西没有费用，也不设什么乱七八糟的版权，设了没什么用。我也不太相信偷学的能比我讲得更清楚，因为不是你悟的，说再多，也没办法生活化、具体事情具体化，偶尔几个东西还可以。 我鼓励大家学完，自己出去开班教学生，产生收入。收完钱自己揣兜里，不用给我。 以前佛教、道教也好，很多传播这些东西是要收费的。看命、改东西，想让别人帮，也要付钱。所以绝大多数人在别处挣钱，在这里改命、获得帮助和提升，一旦提升失败，钱就白花了。 我更希望，你免费学习我的东西，用它帮助很多众生，别人付给你辛苦费。 有钱后，可以买法器、还阴债、处理法界的事情，甚至更好地学习。知识既然能改变别人、让别人变好，为什么不能成为挣钱、提高收入的方式？有钱之后，用修行的钱养修行，我觉得这最重要。几乎其他门派、体系做不到，但希望我们未来能做到。"},{"id":"ep3-k23","course":"ep3","number":23,"topic":"家庭与沟通","title":"让家人成为修行的第一批受益者","summary":"本课明确把改善与家人的关系，放在学习后的实际变化之中。","points":["不要因自己在学习，就轻视或对抗家人。","先观察配偶、父母和孩子，是否真正从自己的改变中受益。","家庭关系与生活质量的改善，是本节强调的检验方向。"],"start":221,"end":228,"quote":"一定要让老公、父母、孩子，成为你修行的第一批既得利益者。","quoteIndex":226,"related":["ep1-k10","ep4-k21"],"section":"ep3-p211","sectionTitle":"九 收入 家庭与修行正循环","searchText":"问道三 人类说明书框架 第3课 问道3 让家人成为修行的第一批受益者 本课明确把改善与家人的关系，放在学习后的实际变化之中。 家庭与沟通 不要因自己在学习，就轻视或对抗家人。 先观察配偶、父母和孩子，是否真正从自己的改变中受益。 家庭关系与生活质量的改善，是本节强调的检验方向。 九 收入 家庭与修行正循环 让家人成为修行的第一批受益者 我不希望再看到学生拿辛辛苦苦挣的钱，找我算事、改事、请符、请法器，觉得这样是在消耗自己。 第二，有好多女生学完知识，非但没提升家庭质量，还跟老公形成对抗，觉得老公土鳖、笨蛋，自己是修行人，老公不修行，就看不起老公，这绝对不能发生。 第三，有些女生非常喜欢我们的东西，大半夜不睡觉，发视频、做宣传，在这里非常感谢，但这样不对。不能既花着老公的钱，又看不起老公，老公晚上想搂你睡觉还不同意，还去发我们的东西，不等着老公举报我们，等着什么？ 所以学完这些东西，第一件事，先改变跟家人的关系。 一定要让老公、父母、孩子，成为你修行的第一批既得利益者。 花点钱无所谓，至少心里舒坦，人家也认。第二，不仅得到利益，还能产生收入、利益众生、产生福报，那老公管你干什么？第三，有了收入，家庭越来越有钱、越来越和谐，还有余钱购买法器、升级自己。 最后，希望大家获得一种一生不会被别人否定、不会被时代淘汰的能力。芸芸众生中笨蛋越来越多，不耽误你度化，这辈子到咽气之前都有无量众生等着度化，所以不用担心，这事干不绝，慢慢来。"},{"id":"ep3-k24","course":"ep3","number":24,"topic":"学习路径","title":"陪伴、指出错误与共同前行","summary":"本课最后把陪伴和共同实践，列为红尘道场的重要部分。","points":["有人共同学习，也有人帮助指出问题。","以问自己、答众生的方式继续学习，并把理论带进生活。"],"start":229,"end":235,"quote":"最后，我们需要陪伴。所有众生都太孤独，需要有人陪伴、指导、指出错误，需要有人共同前行，这才最重要，也是红尘道场很重要的一点。","quoteIndex":230,"related":["ep3-k23","ep4-k28"],"section":"ep3-p211","sectionTitle":"九 收入 家庭与修行正循环","searchText":"问道三 人类说明书框架 第3课 问道3 陪伴、指出错误与共同前行 本课最后把陪伴和共同实践，列为红尘道场的重要部分。 学习路径 有人共同学习，也有人帮助指出问题。 以问自己、答众生的方式继续学习，并把理论带进生活。 九 收入 家庭与修行正循环 陪伴与共同前行 最后，我们需要陪伴。所有众生都太孤独，需要有人陪伴、指导、指出错误，需要有人共同前行，这才最重要，也是红尘道场很重要的一点。 希望真正实现修行正循环：认知、修行、提升，消灭负面的东西，增加众生善缘、增加财富，实现真正的正循环。 说完了，再说一下框架。我们要做人类说明书，分四大块：逆修觉者、灵魂觉者、法界天机、道法自然。其中逆修觉者分天道思维、人道思维、人设思维。 整个讲课方式，以《问道》的方式讲课，希望是问自己、答众生。最后组成红尘道场，理论没问题了，一代一代、一届一届帮助众生解决生活里的问题，形成共同群体，一起对抗末法时代，很不容易。 今天到这里，下集正式开始讲理论，讲认知思维
