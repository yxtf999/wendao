key":false,"section":"ep5-p211"},{"id":"ep5-p225","index":225,"text":"GL8车主说，看到了，知道一定往这拐，也躲不开，不怪，谁遇上没辙。警察水平还挺好。后来走一个全责，都有保险，各自修车。那人让他走吧，说话不利落，下次跑哪根本预测不了。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p226","index":226,"text":"婚姻出现问题时先看目标与利益","level":2,"key":false,"section":"ep5-p211"},{"id":"ep5-p227","index":227,"text":"老婆发现老公有小三，情绪激动，也要用意义思维评价，此刻所做对处理有没有帮助。思维模型不应该是闹、谁对不起谁，重要是让自己利益最大化。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p228","index":228,"text":"第一先想婚姻还要不要，第二考虑老公走上升运还是败运。败运就算了，分家产，反正没感觉，也选择别人，还扯什么。但正在上升运，凭什么把位置让出？","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p229","index":229,"text":"想都别想，老娘熬也熬死你。此刻坚决跟老公站一起，抵制小三。尤其生孩子想上位，只关心老公在A、B、C哪个运。C运就分，人家找别人；A运，想占后面的运，想都别想。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p230","index":230,"text":"生活真有这样的人，这才正确。能不能继续过，看心情、利益、缘分。很多男人找小三图一时，时间长腻，哪个娶回也腻，还得找其他。不用管能跟多久，我们是用规则拯救人类的。","level":0,"key":false,"section":"ep5-p211"},{"id":"ep5-p231","index":231,"text":"十一 意义七问与日常应用","level":1,"key":false,"section":"ep5-p231"},{"id":"ep5-p232","index":232,"text":"为什么做 能得到什么 值不值得","level":2,"key":false,"section":"ep5-p231"},{"id":"ep5-p233","index":233,"text":"把意义思维浓缩为意义七问，一定融入生活，不然就废。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p234","index":234,"text":"第一问，为什么做这件事？先搞清目的。第二问，能得到什么？学完改变什么，解决什么，价值和结果是什么？第三问，值不值？付出这么多，得到值不值？想想包子店和博士后。时间、金钱、健康、精力、风险、关系，值得吗？解决成本问题。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p235","index":235,"text":"比如历史上传法得善终的人不多，为什么还选择？想得到什么？先说伟大的，为利益众生、六道提升，不负神佛仙期待培养，感恩天道。私心是什么？得升级，要功德、众生善缘，要领导看得上，派点事都干糊，天地生你何用，得把事做好。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p236","index":236,"text":"领导看得上，下次给更好资源，这是私心。功德、众生善缘、领导认可都有了，关心这辈子过好不好，闲的。像我已经拿天界、佛界资格，就算出门出意外，也赚了；多活一天赚一天，凭什么不活，凭什么在意未来结果？","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p237","index":237,"text":"这就是意义思维，值不值。人间看，不得善终不好，但大家来玩游戏，我已做好万一不得善终准备，肯定要玩高阶游戏：争取传法、挣功德、拿善缘、领导重视，还得善终。这是想法，能否实现不知道。越低端越不可控，越高端越好控。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p238","index":238,"text":"后果 大目标 真正问题与当下行动","level":2,"key":false,"section":"ep5-p231"},{"id":"ep5-p239","index":239,"text":"第四问，后面是什么？继续走，第二、第三、第四、第五步怎么样？第六步先不用问，以你们脑子不容易；聪明可以到十步，但出错概率大，能研究三到五步已经厉害。这解决长期后果。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p240","index":240,"text":"第五问，大目标是什么？别干了小目标，毁掉大目标，叫终局反推。第六问，真正问题核心在哪里？从表象看到真相，穿透表象。第七问，此时在干什么，最应该干什么？现在做的对解决有没有帮助？没有就别干。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p241","index":241,"text":"孩子流血还跟老公吵，对流血没帮助，先别干，处理完情绪稳了再说，这叫当下有效性。听完都说有道理，别回家没三天全忘，全还回来了。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p242","index":242,"text":"这就是红尘道场要解决的。以后做小标签、小饰品，天天看到，喝水看意义在哪，放床头、最容易跟老婆吵架的地方。给孩子出背心，写逆修觉者，下面“请关注此时的我”，别先吵其他，我才是最大意义。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p243","index":243,"text":"以后开始算，我花了多少生命。这时意义思维才不只是学过的学问，而是大脑工作方式。不要求人生每件事都伟大，是尽量不在稀里糊涂中消耗生命。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p244","index":244,"text":"做事前问意义，做事中看方向，做事后看结果。小事服从大事，眼前服从长远，表象从本质看，情绪服从解决问题。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p245","index":245,"text":"为什么做？值不值得做？然后呢？","level":0,"key":true,"section":"ep5-p231"},{"id":"ep5-p246","index":246,"text":"压成最简单三句话，经常问就行。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p247","index":247,"text":"配套课程与下课寄语","level":2,"key":false,"section":"ep5-p231"},{"id":"ep5-p248","index":248,"text":"今天聊到这里，又耽误太长时间。过几天有两个配套小课：一生可能犯的错误，错误来自哪；另一个知识分类。别看一堆书就以为有用，要分类、想有没有用。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p249","index":249,"text":"看大V也要想，选这个对我有什么帮助、成长？纯闲的，还是怎么？上厕所、吃早餐、洗澡无聊，旁边有声，随便。但专门用脑子听，一定反思。连大V的话都要反思：知识已知道，为什么重复听？为听故事还是掌握知识？别把生命、时间浪费在无意义事情上。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p250","index":250,"text":"好，拜拜，大家再见，过几天再见，应该很快。","level":0,"key":false,"section":"ep5-p231"},{"id":"ep5-p251","index":251,"text":"附录 校对记录","level":1,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p252","index":252,"text":"整理范围  依据本次上传的20260913《问道》意义思维(1)文字转写整理。原稿日期2026年9月13日，时长1小时49分44秒。保留第一人称、讲述顺序、七种模式、意义七问、案例、活动通知与结束语；删除时间戳、说话人标签、无意义卡顿与重复口头语。标题用于阅读导航。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p253","index":253,"text":"开场活动与历史时间  9月份促销、黄财神、月光菩萨、月老、九天玄女和燃灯古佛专场均为当次讲述安排；“明天”“最近”等保留原时间语境。原稿并列八月十五与9月25日，未擅自统一历法。请福、请服依换法器与请符语境统一为请符，套服整理为套符。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p254","index":254,"text":"01:58至06:54 环境判断  边控法规、部门权限、留学案例、网络监控及加密货币公司人员的描述，均为讲述者转述或判断，原稿未给法规名称、案件材料或出处。房价、经济大萧条15至20年等保留为当时说法，不作为当前法律、经济或出行事实。蔚来依上下文统一为未来。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p255","index":255,"text":"06:54至13:11 电脑与网络  “荒野大镖客2077”疑似游戏名称连读，未擅自拆成两个游戏；“全打总套单”不能确认，正文加引号保留。5600、5200、5000等内存数值、2G带宽及10GB网线等单位依原稿保留，不作为已核实技术规格。2060之后的“22060”疑似卡顿或错转，正文保留并加引号；“网线转10GB的插头”同样待回听确认。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p256","index":256,"text":"14:54至24:43 身体与洗灵经历  洗灵、启灵、喜灵、喜玲等称谓依同一段语境统一为洗灵。49式、50式依轮回语境整理为49世、50世。7月份原稿未注明历法；“1月份，7月份底”按紧接的自我修正保留7月底。20%能量或福报、15万人传功、人间与天界各100世等数值按原讲述保留，宗教经验与身体症状的因果解释未作医学核实。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p257","index":257,"text":"26:15至30:30 年龄与医疗经历  女性40岁、男性45岁后衰运，以及倒霉促成重生的解释，为原讲述的气运观点。手术、血糖、胳膊和高血压经历依口述保留，原稿未给具体病历或药名；“直接上了这个”有现场指示但无对应影像，未补写设备名称。10万马币相当于18万元为讲述者当时口述，未按当前汇率改算。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p258","index":258,"text":"31:12至44:27 定义与经典  意义思维、异议思维、异义思维、异思维统一为意义思维；定义中“当下的行进持续审视”整理为“当下的行动进行持续审视”。命运改变30%以上属于讲述者断言，未视为统计效果。道德经引文保留原稿“以至于无”，未自行补成“无为”；经文评价和“无无”保留为原表达。41:05“占一个、占两个”依上下文指无法验证、无法应用及目标无关的情形。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p259","index":259,"text":"45:53至53:24 收益与风险推演  50%加薪、8小时变14小时、财富规模、红通及安保风险等为原案例和推演，不作为工资行情、法律门槛或风险概率。正文保留5年至30年思考、储蓄与人生意外的说明，没有增补避税、逃避执法或隐匿资金的操作方法。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p260","index":260,"text":"54:03至01:22:32 职业比较  保留修行、家庭、教育、技术岗位与包子店比较的全部讨论顺序。工资、学历、年龄、3至5公里竞争范围等数字为讲述者估计或判断，未核实为普遍规律。原稿“华为P8、P9”保留，同时保留讲述者“不知道”的限定；“摇班”整理为姚班。列举生意标准时原编号有重复跳号，按叙述整理，未强行确立统一条数。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p261","index":261,"text":"01:15:38至01:21:36 人物与疑句  田朴珺、王石、Angelababy、黄晓明、景甜等相关依赖性评价按原说法保留，未作为人物关系或资源来源的独立核实。“中医你得才行，你不，干不干也就那么回事”无法仅凭文本确认，正文加引号保留，待回听。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p262","index":262,"text":"01:22:32至01:25:27 节日与表象  “别老跟分”依语境整理为“别老跟风”。原稿“二月十四，这不七夕”存在节日混说，正文保留并加引号，未悄然替换；领导吃鱼、菜市场议价与孩子作业等为讲述者示例，不代表对具体人物动机的确认。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p263","index":263,"text":"01:26:09至01:30:45 时间换算  1000万除365再除8约为每小时3425元，原稿“大概3400”保留。每秒一元、年薪百万每秒一毛属于近似换算，原稿亦调整为实际工作时间的估计；马斯克每秒收入保留“没具体算”的限定。“开车20俩小时”依语义整理为开车两小时。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p264","index":264,"text":"01:30:45至01:40:23 事故与婚姻案例  孩子夹手的严重程度判断为当事人口述，不作为伤情评估标准。学生孩子刀伤案例保留“有没有这么说不知道”“据说”等限定。2011年车祸中的责任及保险处理是原故事，未作为通用法律、保险或事故处理指引。婚姻与A、B、C运的取舍按原观点保留，未补写各运的定义。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p265","index":265,"text":"01:41:01至结束 七问与课程安排  意义七问依原顺序为为什么做、能得到什么、值不值、后面是什么、大目标是什么、真正问题核心在哪里、此刻最应该干什么。传法、功德、善缘、善终的说法保留讲述者愿望与不确定性；标签、饰品、背心与配套课程为当次构想或计划。","level":0,"key":false,"section":"ep5-p251","appendix":true},{"id":"ep5-p266","index":266,"text":"原生态处理原则  正文保留讲述者口语、反问、粗口、评价及宗教立场，也保留“我觉得”“可能”“估计”“我忘了”“不一定”等限制。未添加整理者案例、解释或结论。疑点列于本附录，待音频确认后可进一步校订。","level":0,"key":false,"section":"ep5-p251","appendix":true}]},{"id":"ep6","number":6,"name":"问道六","title":"意义思维的应用与知识分类","speaker":"悟聊天尊","source":"20260930_问道6_意义思维的应用与知识分类_整理稿.docx","date":"2026-09-30","description":"用五象限与功能分类选择知识，理解真相、方向、人性与心性。","blocks":[{"id":"ep6-p33","index":33,"text":"一 开场与课程安排","level":1,"key":false,"section":"ep6-p33"},{"id":"ep6-p34","index":34,"text":"直播计划与正式版制作","level":2,"key":false,"section":"ep6-p33"},{"id":"ep6-p35","index":35,"text":"希望我们在十一月份之前，能够换一个地方给大家直播，看看施工怎么样。今天我刚把两个疗愈室的网络给调好，还挺费劲的，不过网速还是杠杠的，全部都从无线改成有线了。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p36","index":36,"text":"大家晚上好。咱们现在直播，直接就上吧。今天讲知识分类，也是意义思维的一个延续。上次讲了意义思维，你得应用。应用的时候，找两个东西应用：一个是知识分类，一个是错误分类，或者叫成功的条件，这是咱们这两次讲的。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p37","index":37,"text":"正好这段时间我出差，虽然出差了，但是每天也是弄很多东西，所以最近直播的速度就会快一点。大概的流程是这样：今天先知识分类，明天、后天——后天就是错误分类，或者叫成功的条件。再过两天，咱们就是讲智慧，还有什么延时法则、当下困局，都是在智慧里面讲。再往下走，就是修行的意义。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p38","index":38,"text":"这四个的草稿都已经弄好了，所以讲得会快一点。基本上前面是隔一天讲一个，后面是隔两天讲一个。所以在十几天的时间里面，可能要连着上四次直播，赶紧都讲完。看看能不能还有时间，把因果法则和轮回法则给大家讲了。讲完这个，某一阶段就完事了。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p39","index":39,"text":"然后我可能又要去憋一段时间大招。憋完大招之后，咱就直接讲有无、空色、法界成相、冰山法则，还有为什么要有人间、考验思维、万物皆可查、用高维思维去理解人间、大轮回观、大因果观，什么叫全面正向思维、木桶原则，还有从时间角度看修行。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p40","index":40,"text":"这是第二阶段的东西。讲完了之后，咱们就先闭关一下。还是咱们之前的玩法：我先有感觉的，先把东西直播。直播的东西肯定不是特别圆满。一般我先直播，直播完了之后，等一周、十天，你再重新看自己的直播，就有感觉了。有感觉的时候，再重新校正、编辑一些东西，感觉就不一样了。这个时候我再把它重新编辑一下，再去重新录制，这就是成品了。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p41","index":41,"text":"我记得当时最费劲的就是《问道二》，简直是又臭又长，我天哪，就那个东西，我自己至少看了四遍。还有咱们一个同学，努力地帮我剪辑了一下，把这个都转成文字。我拿着他的文字，自己又看了四遍，又加了很多东西。而且《问道二》还加了一个大白话版，正式版讲完了之后，再来一个大白话版。这些东西可能都没有给大家看过。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p42","index":42,"text":"到时候等他们后期都剪辑完了，如果没什么问题，我先把《问道二》给大家看看，咱们未来的成片是啥样，就给大家放一集。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p43","index":43,"text":"以后我还就一直按这个顺序努力工作。咱们争取明年的中期，我估计怎么着也能录个六七十集了。这个时候，我估计咱们逆修觉者的天道思维，六七十集基本上都差不多了之后，就一次性放给大家，这个就是正式版。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p44","index":44,"text":"大概就是这么一个情况。但是我觉得挺费劲的。当时录播，不是直播，录播《问道二》的时候，那真是挺费劲。我看他们剪辑，一集好像是二十分钟还是三十分钟，光《问道二》正式版本，四集了还没剪完呢。这反正是比较能忽悠，没办法，只能说东西太多，希望大家能看明白。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p45","index":45,"text":"我觉得他们做的动画挺好。你看咱直播版本没有动画，很多都即兴发挥，所以这就是咱们的一个安排。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p46","index":46,"text":"在我讲完两部分之后，咱们开始进行录播的时候，我估计录播怎么着也得一两个月。这一两个月的时间，我就开始凑数了，给大家开始讲真相，一周一集吧。真相反正也得去弄，我估计整体的真相全弄下来，也得五六百集，因为它涉及的各个方面都有。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p47","index":47,"text":"我是希望，从大家出生到大家死亡，还有死后的事，你这辈子要经历什么，咱们都提前告诉大家。反正这些东西，你愿意不愿意，都得经历。怎么着都得考试的东西，你还是提前知道点答案比较好，就是这样。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p48","index":48,"text":"好，咱们计划说完了，现在开始上广告时间。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p49","index":49,"text":"套符与专场的活动提醒","level":2,"key":false,"section":"ep6-p33"},{"id":"ep6-p50","index":50,"text":"首先，你们年底年初用的那些套符，赶紧该订就订。你别十二月份要用，十二月份再订，那不好使。仙家的力量的确比较强，但是有一个问题：你得让仙家有一段时间能了解你，有一些东西该布局布局，该提前准备的提前准备。你别什么东西都屎堵屁股门了再上，那玩意肯定不好使。所以赶紧请，就现在赶紧请，专门年底年初用的套符，尤其是干工作的。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p51","index":51,"text":"第二，今天晚上——今天是几号？九月三十号。今天晚上是九九重阳节这批烧纸的最后截止日了。因为咱们又是一堆，有给仙烧的，有给家人烧的，一堆东西，你赶紧，今天晚上是最后截止日期。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p52","index":52,"text":"你们别忘了，九九重阳节的时候，该上供的得上供，那是大日子。有仙家、供仙和供神的，一定要上点好酒，因为他们经常拿到各个界面去，跟其他朋友吹的时候，得有点好东西。你不能光给二锅头，那也太惨了，拿不出手。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p53","index":53,"text":"咱们的专场，一个是阳历十月二号，燃灯古佛专场；一个是九九重阳节，这不用说了，重中之重。这个专场帮助仙家冲仙门，包括功过，都是这一天要上报天庭的，大家一定表现好。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p54","index":54,"text":"你看这几天，我都趁着现在胳膊好了，已经趴在地上大忏悔了。今天咬了半天牙，忏悔了二十个。哈哈，我觉得我要说的东西有点多，忏悔一个都需要一分钟。我下次精简点，至少临时抱佛脚嘛，该表现点表现。至少咱们得忏悔个十几天，代表咱真忏悔。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p55","index":55,"text":"你这上次都答应说要忏悔的，结果从三月三都快到九月九了，半年过去了，都忘了这事。之前可以说胳膊有问题，现在就不能说胳膊有问题了。","level":0,"key":false,"section":"ep6-p33"},{"id":"ep6-p56","index":56,"text":"二 为什么要给知识分类","level":1,"key":false,"section":"ep6-p56"},{"id":"ep6-p57","index":57,"text":"好，咱们开始吧。这次讲知识分类，下期讲人类错误或者成功的条件，都属于之前讲过的东西。只不过咱们讲了意义思维之后，我觉得有必要也给其他没听过的说一下，所以不是什么新东西，大家先凑合听听就行。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p58","index":58,"text":"如果想听有意思的，一个是智慧那集，大概五六天之后，直播那集还是不错的；还有一个，讲修行的那个还可以。好，咱们开始吧。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p59","index":59,"text":"衡量知识是否适合自己","level":2,"key":false,"section":"ep6-p56"},{"id":"ep6-p60","index":60,"text":"咱们学完意义法则之后，为什么要说知识分类？主要对于我们人类来说，这一生其实都是在各种各样的信息和知识中度过，所以知识分类是非常重要的一件事。甭管是有用的知识，还是没用的垃圾知识，反正你这一生，脑子都不会太闲着，一直在吸收。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p61","index":61,"text":"这么多种类型的知识或者信息，总得要分类：哪些东西着重听一些，哪些东西大概了解一下就行，别浪费时间。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p62","index":62,"text":"人类很容易陷入知识混乱，一个主要根源就是知识不分级。很多人一直认为，知识越多越好、越全越好、越高级越好、越有名越好、越深奥越好，其实不是这样。好多人也觉得“读书破万卷，下笔如有神”。但其实：","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p63","index":63,"text":"真正重要的，不是这个知识到底高不高，而是是否适合你现阶段，是否能够落地，是否能够长期产生正向的结果，是否可以真正改变一个人的行为、处境和命运。","level":0,"key":true,"section":"ep6-p56"},{"id":"ep6-p64","index":64,"text":"这些东西才是对你真正有用的。所以我们要给人生中经历的每一个信息分类、评级，确定它是否有用，以及有用多少，这都是咱们要做的。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p65","index":65,"text":"如果不这样做，你就会陷入：沉迷于高维的理念，却无法实现；追求名著传记，却改变不了命运；学了很多工具技巧，却用错了方向；掌握了短期有效的方式方法，却在长期中被错误反噬。还有，把人的生命大量耗在了看似有文化，却难以改命的知识上。这些东西都很有问题。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p66","index":66,"text":"人类的时间非常有限，看似百年，真正用来学习、提升自己的时间却非常有限。我们还要对抗社会、环境的变化，身体也有幼年、青年、中年、老年的时候。就算学习了很多东西，总得有时间应用才行。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p67","index":67,"text":"有限的学习时间与应用时间","level":2,"key":false,"section":"ep6-p56"},{"id":"ep6-p68","index":68,"text":"而且，不是说学了就行。你还得被家庭、孩子、父母、工作、生活上的很多琐事影响，我们的时间非常有限。本来就有限的时间，真正能够学习和应用的有多少？","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p69","index":69,"text":"在一生里面，最开始的头二三十年其实非常珍贵，脑子又好使，精力又充沛，又没有那堆屁事，也没有家庭那些屁事，也不需要挣钱。但是我们把最精华的二三十年，都用于学一些这一辈子都用不上的知识，而且还用这些知识衡量你到底是不是优秀的，其实大量浪费了时间。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p70","index":70,"text":"二三十年学完了之后，真到社会，开始要学有用的东西，又要工作、结婚、生子，还要对抗各种各样的办公室政治，一系列事情。所以你必须在一边工作、一边生活、一边挣钱的情况下，还得想办法学习有用的东西。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p71","index":71,"text":"而有用的东西还不是像学校的。你在学校里学的所有东西，有个性质：有书本，有明确的方向、明确的范围，也有考试大纲。但是社会上真正能提升你的这些东西，从来没有人告诉你，哪些重要、哪些有用、哪些是应该看的，你的考试方向是什么，你要经历什么。这些东西没人跟你说，你得自己琢磨。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p72","index":72,"text":"所以，你得在有限的时间里面——比如咱们就这么说，你二十五岁，终于从学校出来，进入社会了。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p73","index":73,"text":"这个时候，你要开始学对自己这一辈子有用的东西，可是没人教你。你得自学、自悟，自己找方向。这些东西弄完了之后，你必须在五到十年的时间里面，也就是三十五岁之前，把有用的东西基本都学到。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p74","index":74,"text":"学完了之后，三十五岁之后还得应用，还得赶时机。如果大运不给你，时机不给你，老天不给你机会，你也扯淡。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p75","index":75,"text":"你看我快五十岁了，老天爷才给这个机会。所以前面将近这四十八年、四十九年，纯粹叫积累、学习。这就是一个普通人，没有任何背景、任何资源，从泥腿子一点一点往上升，很费劲。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p76","index":76,"text":"所以你想，你的时间到底够不够？绝大多数人，男的基本上四十五岁之后就走衰运了，女的基本上四十岁就开始走衰运了。你想想，实现自己抱负的时间有多少？咱们别把人生一辈子都用在没用的东西上。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p77","index":77,"text":"现在就要开始分类。分类之后，就会避免学错知识、用错知识、沉迷错误的东西，最终被知识反过来约束。","level":0,"key":false,"section":"ep6-p56"},{"id":"ep6-p78","index":78,"text":"三 按维度与作用分类","level":1,"key":false,"section":"ep6-p78"},{"id":"ep6-p79","index":79,"text":"现在咱们对知识进行分类。我一般分类的方式有两种。当然，大家也可以按自己的习惯和方式方法分类，把觉得有用的、没用的都分开。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p80","index":80,"text":"第一种叫知识四象限，应该是五象限，但是咱们就先说四象限吧，有一个是新加出来的。主要就是高维有用、高维无用、低维有用、低维无用，还有一个是低维看上去有用，但是高维容易错误，就是五个。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p81","index":81,"text":"高维有用","level":2,"key":false,"section":"ep6-p78"},{"id":"ep6-p82","index":82,"text":"高维有用，这很简单。本身这个东西很高维，比如佛经、道经讲的一些道理，就是很高维、很正确的。但有一个问题：你会发现，越高维、越正确的东西，它离你很远，因为这个规则、法则离你很远。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p83","index":83,"text":"离你很远，就会出现一个问题：你现阶段未必能理解，也未必能够承接、实践。比如段永平的价值投资，巴菲特的长期主义、复利，还有佛教中很多高阶的修行理念。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p84","index":84,"text":"还有很多高级的哲学、高阶的人生规划，这些东西本身是对的。但有一个很大的问题：普通人不一定具备相应的心性、认知、耐力，还有实践条件。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p85","index":85,"text":"而且越高的东西，比如“宁损性命，终不作恶”，你如果没有几世的记忆合在一起看，几乎不可能验证它。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p86","index":86,"text":"几乎没办法验证，因为这些东西本身就是一个很长时间的东西。越没有时间去验证，越是短时间之内不容易成功的，会出现什么情况？","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p87","index":87,"text":"人类推动行动力的一个很重要的动力，叫正反馈。这个正反馈不是没有，但是来得很迟。比如段永平投资，哪个东西也不能说三五年，马上买了之后就见效，甚至很有可能买完之后还要先跌上百分之五十。你能不能扛得住？扛不住，肯定享受不到那些东西。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p88","index":88,"text":"像巴菲特，还有芒格，哪个不是几十年才见效？短期很难看到很大的收益，你不一定能扛得住。因为很多“道心道我”的东西没有，所以很麻烦。听完觉得有道理，但真正实操，一旦遇到诱惑、挫折或其他情况，就动摇、崩溃了。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p89","index":89,"text":"所以不是人家的东西不好使，是门槛太高，实现起来很难，短时间之内不能见到效果。我记得当时在雪球上放段永平的投资理念，我就跟学生说：“你看吧，放了之后也没有用。”绝大多数人很难应用。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p90","index":90,"text":"比如胖东来，大家都知道，也很熟悉。胖东来实现了这种因信任而产生的消费行为，你知道得积累多少年？短时间肯定很痛苦，见不了效果，而且很可能还要吃亏。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p91","index":91,"text":"现在几十年的时间建立起这种信任，那绝对是无敌了。很多高维正确的东西，最大的问题就是你等不到，等不到那个时间。没有个五到十年，都看不出来你比别人……那五到十年之内，说不定你还比别人……它属于这种样子。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p92","index":92,"text":"但真正一旦建立出来，尤其像信任这种东西，一旦建立起来，基本上别人就很难干到你。这就是高维厉害的地方。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p93","index":93,"text":"所以高维有用，不是说不好使，关键是你使起来得有一定的时间，而且不容易看到正反馈。人就是这种样子，看不到正反馈，就不一定能坚持下去，很麻烦。想验证这些东西，都需要时间。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p94","index":94,"text":"高维无用","level":2,"key":false,"section":"ep6-p78"},{"id":"ep6-p95","index":95,"text":"第二，高维无用。很简单，听起来很高深、很玄妙、很有境界，但不能落地。任何理论和东西，你就问他：“这个东西我怎么能实现？在现实中怎么应用？”如果说不出来，就让他哪凉快哪待着去。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p96","index":96,"text":"这里面有很多古代人写的东西都是这样。对不起，六祖吧，比如他的“本来无一物，何处惹尘埃”，就是这种样子。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p97","index":97,"text":"这个东西算不算一种很高级的理论？算。但是你告诉我，人间怎么执行？如何应用在每一件事情上？平时怎么应用？如果你想证明这个世界是假的，不用说这个，很多东西都可以证明这个世界是假的，我也不用非得学这个。所以你就看，这个应用在哪。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p98","index":98,"text":"很多东西是一些玄学的口号，包括“即心即佛”“无明所障”。到底什么叫无明？本心是啥？有没有定义？这些东西都没有一个具体的东西。它可能确实很高级，但你以后学了意义法则，就记住：只要不能进入实操，就去他们的，学了也没有用。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p99","index":99,"text":"这么长时间，人类都没把实操研究出来，你现在学它有什么意义？几千年来没研究明白实操，也没耽误大家活着，那为什么要研究它、学习它？所以一定记住，凡是不能实操的东西，就去他们的。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p100","index":100,"text":"“万物归一”“一切皆成空”，什么宇宙真理、超越人间，什么空空、无无，还有无无无，这就是理论上的东西。只要不能进入实操阶段，就跟我们没关系，就去他们的。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p101","index":101,"text":"请大家一定记住，不要被这些高高在上的东西影响。曾经有一段时间，佛教也好，道教也好，都是必须高级知识分子才能研究的东西。很多时候，他们属于比拼智力：我要不说点玄而又玄的东西，你好像觉得我没水平。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p102","index":102,"text":"但咱们不是为了这样。我只关心，这些东西能不能让你未来更幸福。如果高深的东西通过我这，你不能听明白，那是我的失败。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p103","index":103,"text":"只学能实操的，哈哈，只学能实操的。大家记住，只要在人间没有办法验证、没有办法实操，不能告诉我这条具体在生活中如何应用，就一切都去他们的。让他们自己慢慢装逼去，古人就把他们扫进历史的尘埃里。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p104","index":104,"text":"低维有用","level":2,"key":false,"section":"ep6-p78"},{"id":"ep6-p105","index":105,"text":"第三，低维有用。这个不用说，比如控制情绪、识人、厚黑学，这些低维很有用。包括哪怕学点财务知识，会算个账，会编个程，这叫低维有用，不叫多高维的东西，但实际上有用。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p106","index":106,"text":"更多都是一些技能、工具类，或者实操类的东西。我觉得比学那种高维无用的强多了。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p107","index":107,"text":"低维无用","level":2,"key":false,"section":"ep6-p78"},{"id":"ep6-p108","index":108,"text":"第四，低维无用。这个更简单，什么八卦、低质量的争论、情绪价值，研究哪个明星是不是谁的小三，这不闲的吗？纯粹是闲的。还有网络骂战、无价值的短视频。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p109","index":109,"text":"这个是这样，我也看无价值的短视频，我还付费看了，哈哈。刷动画片这些东西，我也干。这是在无聊、睡不着觉、睡前准备的时候，上厕所、吃饭的时候，也刷，但纯粹是放松大脑。我是真干活了，所以放松没问题。你们好多人其实不怎么干活，你不能一天十八个小时都在放松，那就有问题了。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p110","index":110,"text":"这些没有什么太大的实际意义，不会对你的人生产生什么，还容易让注意力被打碎、情绪被污染、判断力被降低、生命被消耗，这些东西都称为垃圾。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p111","index":111,"text":"低维有用但高维错误","level":2,"key":false,"section":"ep6-p78"},{"id":"ep6-p112","index":112,"text":"最后一个，叫低维有用，但高维错误。有些方式方法和认知，在短时间之内对你非常有帮助，但是在长期、整体或者更长的时间层次上看，你是犯错误的。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p113","index":113,"text":"比如很多老板，老觉得自己是天命之子，恨不得跟皇帝一样，这属于脑子有问题。还有学什么帝王之术，你一个不是帝王的，没事学这个干什么？还有研究诈骗的，怎么P2P的，怎么用情绪控制人的，再研究点厚黑学，在办公室里折腾点。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p114","index":114,"text":"咱们就这么说，人类中短期对自己有益、长期对自己有害的，你可以看看刑法就知道了。刑法里很多罪名，其实都是短期对自己极其有益，长期对自己是极大伤害，就是这样。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p115","index":115,"text":"好，四象限，应该说五象限，说完了。咱们再把知识按种类分类。","level":0,"key":false,"section":"ep6-p78"},{"id":"ep6-p116","index":116,"text":"四 按功能分类与真相类知识","level":1,"key":false,"section":"ep6-p116"},{"id":"ep6-p117","index":117,"text":"十种功能型知识","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p118","index":118,"text":"第二种分类的方法，就是十种功能类型的知识和信息。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p119","index":119,"text":"第一个是真相；第二个是方向引领性的知识；第三个是人性心性类的知识；第四个是学术边界类的知识；第五个是高维不确定的知识，或者就说不确定；第六个是工具、方式方法、技能类的知识；第七个是生活生存类的知识；第八个是交流沟通、人情世故类的知识；第九个是见识类、扩展类的知识；第十个就是无用的知识。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p120","index":120,"text":"哎，对，刑法里有很多发家致富的方式方法，那都是人类智慧的结晶，哈哈，就看你有没有命扛得住了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p121","index":121,"text":"真相与认知的关系","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p122","index":122,"text":"第一个，咱们说真相知识。真相知识研究的是什么？这个世界到底怎么运行。它关注的不是表面观点，而是底层规律、因果结构和真实机制。这一类叫真相类知识，本身就很少，非常非常少，你这辈子能得到点，不容易。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p123","index":123,"text":"上节课刚说完的认知体系：行为来自于什么？来自于思维模型。思维模型来自于认知，认知来自于真相，真相来自于缘分。一定把这个东西记熟，融入自己的生活。所以最重要的是，你要能获得有用的真相。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p124","index":124,"text":"说到真相，就要明白什么叫思维茧房。人类要突破自己的思维茧房，本身就是一件非常困难的事情。因为这类知识，只能从更大的思维茧房里面获得，从更高维的。这其实就像天界，一层套一层，像俄罗斯套娃一样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p125","index":125,"text":"想知道我们这层空间的真实东西，得从上层空间获得。但上层空间就一定不是思维茧房了吗？也有，上层还有上层。所以，要破除自己当前的思维茧房，就必须从上一层的思维茧房里面获得知识。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p126","index":126,"text":"这是很麻烦的一件事。因为思维茧房的出现，你会下意识地习以为常，觉得现有圈子里并没有出现让你觉得奇怪或者有问题的事情。但是，你发现最终的结果总是很难把握：我按现有的认知努力了、工作了，很多人辛辛苦苦干了一辈子，最后一场空，仍然过不好这一生；很多人做了一辈子好人，也没落到好的结果。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p127","index":127,"text":"这就是思维茧房，因为你知道的真相有问题，又没有获得更真实的，或者更高层的真相认知，所以发现不了问题。时间长了，你就会发现：“怎么我按这个做，并没有得到所希望得到的东西？”","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p128","index":128,"text":"出现这种情况的时候，你就要有意识：你正活在一个思维茧房里，且知道的东西有问题。在这个思维茧房里，很难发现自己有问题，所以导致努力了一辈子，人生还是失败，还是一场空。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p129","index":129,"text":"常见的思维茧房","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p130","index":130,"text":"家庭与学校","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p131","index":131,"text":"我们常见的四大思维茧房，第一个是家庭。人类认知第一波被影响，就是家庭。你的父母长辈、亲人，对你进行这个世界的描述，你应该干什么、不应该干什么，都来自这里。人与人之间的关系，对世界的三观，也来自家庭。所以好多人说，原生家庭有问题，容易影响这个人的人生，就是这样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p132","index":132,"text":"第二个，还好，你有出去溜达的机会，年轻时出去的机会就是上学。进了学校之后，认知层次已经不仅来自家庭了。有同学、老师，还有其他同学的家长，有时还能自己从网上获取信息。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p133","index":133,"text":"所以家庭对你说的那些东西，有时就不太认可。为什么？因为已经产生了新的信息茧房，不再困在家庭里，有新的信息渠道了。虽然这个渠道不一定多正确，但至少也是一个新的。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p134","index":134,"text":"你看，为什么很多妈妈解决不了闺女和黄毛之间的问题？主要是在闺女的思维茧房里，认为黄毛很可爱、很值得信任。但在妈妈的认知体系里，黄毛是很……可是闺女不信，因为闺女没有妈妈的认知体系。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p135","index":135,"text":"产生认知冲突之后，谁也说服不了谁，就开始玩脾气了呗。这就是第二个思维茧房。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p136","index":136,"text":"社会与不同圈层","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p137","index":137,"text":"第三个思维茧房是社会。进入社会之后，发现对世界的认知、对人性的了解，又不一样了。大家都有公司、有圈子，还有外面的社交圈子，对世界又有一个全新的认知。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p138","index":138,"text":"你的老板、同事、朋友，还有外面的社会人士，都会给你提供新的东西。你又突破了学校的认知，产生一个新的认知，觉得更厉害了。这个时候，又进入社会的信息茧房，因为得到的认知只能从这些人得来。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p139","index":139,"text":"而且人是分等级、分阶层的。能够给你更好认知的，可能就是这些大老板、小老板。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p140","index":140,"text":"包括你出了一个国家，比如韩国——对不起，比如朝鲜人民，对世界的认知和我们就不太一样。我们在七十年代、八十年代——不能说七十年代、八十年代，我们说九十年代、零零年吧，那时候还没有太多网络，还要看《新闻联播》。我们认为的是什么？前二十五分钟，祖国山河一片大好；后面五分钟，国际新闻，外面的人民都生活在水深火热之中。这就是我们的认知。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p141","index":141,"text":"所以有时得走出国家，到外面看看世界怎么样。比如现在，我们在马来西亚，也有很多马来西亚的员工出来了。他们还在说：“我们这边娶媳妇之后，要孝敬公婆，要在家伺候。”国内女生听完，瞬间震惊，表示不能接受。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p142","index":142,"text":"这时候再看马来西亚的女生，就觉得：“你们果真生活在水深火热之中，还生活在旧社会的封建迷信之中。”你看，这就是圈子不一样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p143","index":143,"text":"但有些男生充满了对娶马来西亚女生的向往，因为国内女生实在拿不下。“马来西亚女生这么传统吗？真的太好了。”所以，多走几个国家，说不定结婚的问题就解决了。解决不了的问题，出去溜一趟，说不定很多事情都能解决，哈哈。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p144","index":144,"text":"好，这边也要彩礼，但泰国不要，泰国好像没那么多事。不行，娶个俄罗斯的也行，弄个金发碧眼的，是吧？","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p145","index":145,"text":"咱们不开玩笑了。社会的思维茧房，又分很多不同等级。比如普通刚进入社会的，跟老油子对社会的认知不一样；那帮老油子，跟我这样的人不一样；我这样的人，跟一些拥有很大能量的人，认知肯定也不一样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p146","index":146,"text":"所以，各自到社会里面的时候，看到的真相不一样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p147","index":147,"text":"真相来自于什么？来自于缘分。你们有的喜欢看网上大V，跑到海外翻墙看大V。人家讲的很多东西，你们觉得很新鲜、很有意思，为什么？其实人家讲的这些东西，不是你的人生。在你的人生、你的缘分里，这辈子也碰不到这些事，包括一些讲政治、社会、历史的。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p148","index":148,"text":"我听到这些东西，也觉得很震惊，也很羡慕、佩服人家的认知和经历。当然，要是比跟天道、法界打交道，那我直接甩你几十条街。这是什么？这是我的缘分。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p149","index":149,"text":"不同的缘分，造就了不同的人生和能够看到的真相；不同的真相，造成了对世界不同的看法和认知。所以，一定要好好学习。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p150","index":150,"text":"天道认知","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p151","index":151,"text":"第四个，你要有天道认知。人间认知再厉害，也没有用，因为很多东西叫人间正确、天道错误。你很可能努力了一辈子，辛苦了一辈子，干掉所有竞争对手，解决所有难题，最后走的是一条死路，有可能这样。这属于不知道天道认知，那就没办法了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p152","index":152,"text":"破圈的几种途径","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p153","index":153,"text":"多走出去与不同的人交流","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p154","index":154,"text":"既然有思维茧房，就要破圈。怎么破圈？说到真相这条，一定要记住，因为有些真相不是你有这个缘分，你才能得到的。很多缘分你没有，很多人的人生你不具备。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p155","index":155,"text":"第一件事，多去外面走走，多跟一些人聊天，别跟你同级的人聊天。记住一点：如果跟旁边的人聊天，很长时间之内，已经没有人说出一些东西、看法、思路，让你觉得震惊、意外或者惊讶，那身边这些人，很可能跟你已经进入同一个思维茧房。明白了吧？得通过现象分析本质。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p156","index":156,"text":"如果跟很多人聊得很快乐，但是人生已经没有“经验的东西”了，就一定记住，你已经进入一个思维茧房。这几年碰到的人，你把他们拉上一个圈，把这个圈认为是跟现在的我相同，或者比我更低。或者这个人一张嘴，就知道他要说什么，要记住，他的水平小于等于你现在的水平，没有意义。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p157","index":157,"text":"你需要多走出去，多看世界，尤其不要只在自己的国家。甭管哪个国家，都需要到外面走走，才能了解世界的真相。我觉得这非常重要，什么风土人情，看看别的国家怎么生活。别去危险的国家，别去。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p158","index":158,"text":"多读有用的书","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p159","index":159,"text":"第二，多读书，多读有用的书。有用的书其实很少。比如咱们说《逻辑思维》，还有樊登读书会，这都是公开的、能够读的书。你放心，里面绝大多数知识，都不会对你产生什么人生的提升。说白了，这种圈子已经没有用了，这种作家做出来的书，已经不可能对人类产生太大的帮助，看或者不看就那么回事。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p160","index":160,"text":"当然，你是一个新人，值得去看看。如果三十五岁了，他讲的那些知识还能让你震惊，我觉得你本身就是一个问题，就是这样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p161","index":161,"text":"看海外的视频与不同经历","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p162","index":162,"text":"第三，多去海外看一些名人的视频。我觉得海外一些大V的视频还是值得看。有的讲政治、历史、经济、人情，讲得像奇幻似的那种，就不用看了。但是社会、经济、政治，还有历史事件的演变，我觉得对自己都很有帮助。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p163","index":163,"text":"这些东西在国内几乎看不到，但我觉得对你们很重要。就像刚才说的，都是源自人家一生的缘分。你怎么修行也没有用，因为没有这个缘分，别费劲了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p164","index":164,"text":"包括你们来我这，听很多东西，我也在贩卖我的缘分。我有这个缘分接触这些真相，把东西看完、总结完告诉你们。因为你们注定累劫轮回，绝大多数情况下，也不可能有我这样的缘分，你放心，不可能有。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p165","index":165,"text":"所以只能从我这获得。当然，一些国外大V讲政治，你听完也很佩服，心向往之，确实很厉害。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p166","index":166,"text":"找大哥大姐借助经验","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p167","index":167,"text":"再往下，就是找大哥大姐，抱大腿。很多现实的东西，真是寒窗苦读十年，怎么可能比得过人家三代经商？书中的很多东西还是太简单，包括问AI，也好使不了。具体走通一些事，很多明道、暗道、机会，书里没有这些东西。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p168","index":168,"text":"所以光读书，光自己了解，光用AI了解，解决不了问题。比如现在我们整个海外支付这套东西，说白了，我自己开个公司，专门帮助别人进行海外支付，都能开始收钱。为了走通这条路，我走了大概将近五年，交的学费多了。被坑、被骗，好不容易走通，发现还不好使，或者钱收完转不出去，或者成本太高、政策变化，事多了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p169","index":169,"text":"如果有大哥、大姐，人家真看得上你，一句话，那是几十年换出来的经验，可以节省你几十年的时间。所以抱大哥、抱大姐很重要，大腿很重要。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p170","index":170,"text":"不仅在人间重要，在天界、佛界、神界也一样。人家老大指点你：“不要往这边修，修完上面没什么结果。”那都是几百万年换出来的经验。包括“执手去”，你去攻打第十魔界，那边有熟人，做个样子就完了。没事打他们第一魔界去，那不直接被干？佛祖都被拍好几个，所以很重要。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p171","index":171,"text":"你是上面的人，出去溜一圈，混点那个啥……哎呦，操，讲太多了，不能太多。反正抱大腿很重要，要不然咋死的都不知道。很多东西是人家的经验，这一句话就可以“点火你”，一句话也可以把你坑死，而且人家还是正规的，表面上没做着坑的。这很重要。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p172","index":172,"text":"有好老师带着","level":3,"key":false,"section":"ep6-p116"},{"id":"ep6-p173","index":173,"text":"第五，有一个好老师带着。自己分析行不行？你就别想这事了。它又涉及几个问题：我不抱大腿，也不看别人，自己能不能推导出很多规则？能不能靠自己破解？","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p174","index":174,"text":"自行推导面临的五种限制","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p175","index":175,"text":"首先，这个事不是说不行，是很难，有五条规则压制着你。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p176","index":176,"text":"第一个，底层推导上层的规则，不是说不行。你得很聪明，分析能力、洞察能力很强，说白了脑子得在线。能不能行？行，但往上推一层还可以。很多东西是推出来的，不是看出来的，很可能不全面，但能推出来一部分，已经很厉害。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p177","index":177,"text":"比如弄元素周期表的，叫门捷列夫吧？对，门捷列夫。通过现象总结规律，直接把元素周期表推出来，确实很厉害。但你想再推上一层的上一层，能推两层，几乎算奇迹；想推到第三层，几乎不可能。从底下往上推，不是说不行，是很困难。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p178","index":178,"text":"比如星魂这件事，说白了，距离咱们这个第三十层空间，你拿什么推？推出屎来也推不出来。像大天魂、小天魂，谁跟你说？像影魂，谁跟你说？没这水平，就看不出来。还有本源，更没戏了，都不定多少世之前的事。在人间，能看十世之内的，都算厉害了。但很多因果不是，有些老魂动不动几百世。看不到那么远，很多东西都解释不了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p179","index":179,"text":"第二，时间太长。人家几十年走出来的经验，你短时间之内弄出来，可能性很低。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p180","index":180,"text":"第三，成本太高。比如我走海外支付，各种各样的海外支付，基本上都走了一遍。你想穷举一遍，得多少成本？如果没太多活钱，基本没戏。成本太高了，穷举一遍，基本上可能性不大。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p181","index":181,"text":"第四，太危险。有些东西一旦走错，就没有回头路了，就不行了，所以不能自己往上冲。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p182","index":182,"text":"第五，规则压制。仔细想想，当年我是泥腿子的时候，费了多少劲想往上走，就想多挣钱，就是挣不出来。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p183","index":183,"text":"突破圈层需要新的资源","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p184","index":184,"text":"这是为什么？因为原有的人脉、认知、能力，不足以突破那个圈子。原有的东西突破不了，必须引入优质的机会、优质的贵人、优质的资源。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p185","index":185,"text":"你看我从一个泥腿子往上升级，升级到阴阳师，咱们就说升级到阴阳师，没有强大的法界支持，根本不可能，别想了。经过将近十年，发展到现在这个地步。如果再想升级，怎么办？还用现有的资源，已经不可能再推动升级了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p186","index":186,"text":"再想升级，就要新的创新，新的可以承载更大量人群的东西，那是什么？叫天道知识，就是人类说明书。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p187","index":187,"text":"人类说明书，得上面给你灵感、智慧、感觉，让你看到足够多的真相。不看这些东西，怎么总结？所以也得上面有大号，而且大号还得是比较……懂的东西比较多，至少也得从远古出来。要是最近一两亿年刚生出来的大号，肯定没戏，因为远古很多事没经历，对很多事情都很难推动，也是一样。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p188","index":188,"text":"假设通过这个东西，我们的粉丝扩张到几十万、上百万、上千万。如果再往上走，又需要新的资源。这个资源谁给？一定是天道给，包括你累劫轮回里得积累这些东西，没积累肯定积累不了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p189","index":189,"text":"这就是破圈，很难的一件事。真相这行讲得有点多。你们最好想办法多看外面的东西，多看到比现有圈层更高级的东西。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p190","index":190,"text":"怎么才叫比现有圈层更高级？他讲的东西足够让你震惊。如果对你没有什么感觉，肯定不叫提升。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p191","index":191,"text":"还有，一定要学会抱大腿，抱大腿是所有生物必须掌握的。只要不抱大腿，你放心，他自己能活起来、能破圈的可能性极低，基本上就是穷人思维，不抱大腿，所以一定注意。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p192","index":192,"text":"已有的知识要学会降级","level":2,"key":false,"section":"ep6-p116"},{"id":"ep6-p193","index":193,"text":"真相这一块，还有一点：看大V的东西，刚开始比较有意思，但如果持续说的东西，尤其讲历史、社会的，你分析一下，跟之前讲的差不多，只换一个形式。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p194","index":194,"text":"比如贪污，古代讲一些贪污，很厉害；现在讲贪污，就知道谁贪污了，实际上知识点没有升级。今天谁被拿下，明天谁被拿下，你会发现，拿下这个事情没变，只是人变了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p195","index":195,"text":"这个就要降级。记住，要学会降级。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p196","index":196,"text":"这种认知已经有了，他只是像新闻一样，告诉你谁又出了问题。今天张三，明天李四，后天王五、麻六，实际上性质差不多。这个知识就把它降成新闻类的知识。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p197","index":197,"text":"但有些人讲传记，有很多精彩的东西，你觉得可以总结一下，这个可以。所以一定学会分。别每次人家讲一个东西，张三被抓了，太有意思了；李四被抓了，太有意思了，其实本质、性质没什么区别。比如谁去哪了，一堆人抗议，这不是闲的吗？哪次出行不抗议？知道就行了。","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p198","index":198,"text":"你心中要把知识归类：它对我算是新闻类的知识，还是认知类的知识，还是真相类的知识？一定学会分类，这样关注点、重点就不一样。别每个东西都听一遍，那你的人生有得……类似的事不是一直在重复吗？","level":0,"key":false,"section":"ep6-p116"},{"id":"ep6-p199","index":199,"text":"五 方向引领性的知识","level":1,"key":false,"section":"ep6-p199"},{"id":"ep6-p200","index":200,"text":"第二个，就是方向引领性的东西。咱们今天肯定讲不完了，真相讲完了。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p201","index":201,"text":"方向引领的，还有心性、人性的东西讲一下，留一大串尾巴，咱下次讲。因为直播主要很随性，为了人类说明书，先演播一遍，看看大家有没有吐槽的地方、需要修正的地方。如果没有，我就可以成稿，进入录播，就是干这事，所以就是瞎讲。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p202","index":202,"text":"应该往哪里走","level":2,"key":false,"section":"ep6-p199"},{"id":"ep6-p203","index":203,"text":"第二，方向引领性的东西，决定的是：我应该往哪走？什么事应该做，什么事不应该做？说白了解决这个问题，让人少走错路、少走弯路。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p204","index":204,"text":"凡是对人类有用的东西，都不多。那种乐的、垃圾剧，一堆一堆的，什么“霸道总裁爱上了绝经的我”，这些可多了，但真正拍点有用的，很少。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p205","index":205,"text":"为什么这类东西少？很简单，谁没事指导你？指导你有什么好处？把你指导得那么聪明，以后怎么好领导你？整个人类社会更希望你们是好用的工具，而不是有思想、有认知、有独立人格和独立思维能力的人。这个世界更多希望你为他们服务，没有人愿意希望你过得更好，就是这样。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p206","index":206,"text":"这类知识，比如佛经肯定算一个。佛经指导的是天道之上、轮回之上的认知，用无量劫的时间、轮回之上的角度，帮助大家规避世间的问题。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p207","index":207,"text":"佛经与道德经","level":2,"key":false,"section":"ep6-p199"},{"id":"ep6-p208","index":208,"text":"你应该怎么走、怎么做、怎么规避问题、怎么积累能量，才能更好地活着，这就是佛经要干的事。但是整个佛经的知识点，大概大几十个吧，也就这些，其他都是证明。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p209","index":209,"text":"你看空色，像《大般若经》，基本都讲空色，六百多卷吧。实际上佛经上的空色也没讲多深，说白了，让你知道的是世界是假的。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p210","index":210,"text":"因为当年要给一帮泥腿子讲。咱们现在知识文化都很高了，你想两千五百年前，印度和中国差不多，读书的人很少。想给连字都不认识的人讲清楚世界是假的，他很难相信。所以当年佛经更多的任务，是让别人相信世界是假的，很难。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p211","index":211,"text":"而且那时候流行辩论，动不动辩论输了就以死明志。辩论输了可是要死人的，很严重，不像现在输了还能给你搅和几下。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p212","index":212,"text":"《道德经》肯定也算是。道德经说的东西更真实一些，更接近人间实操；佛经说的更长远一些。但马上去修，不一定修出非常好的结果，因为需要积累。越是高维的东西，高维程度越高，正反馈速度越慢，很麻烦。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p213","index":213,"text":"所以之前说过，修行有一个叫洛希极限。必须先盲修，修到一定程度，达到洛希极限，超出去了，就发现有感觉了，越修越爱修。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p214","index":214,"text":"没到这个水平，怎么修都发现没什么用：怎么我蹦多高，还是被吸引到地球上？超过这个洛希极限，就没事了，终于不用再往下走了，这叫永不退转。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p215","index":215,"text":"道经说了很多指导性的东西，但《道德经》也有很大问题：都是结果性的智慧，没说怎么得到，很麻烦。好，这是道经。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p216","index":216,"text":"人类说明书与其他指导性内容","level":2,"key":false,"section":"ep6-p199"},{"id":"ep6-p217","index":217,"text":"第三，我觉得真正愿意说结果性的书籍，我们的东西算一个，叫人类说明书，是指导性的认知。真正未来愿意仔仔细细指导大家，我们的人类说明书算一个。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p218","index":218,"text":"尤其逆修觉者这一块，是天道思维、人道思维、人设思维，这三大思维，目前应该是截至现在的历史上，对人类很多东西描写得最细、指导性最强的文字性东西，也就是我们这个东西。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p219","index":219,"text":"包括法界天机、灵魂觉者，说的是法界的东西，其实对你也很有帮助。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p220","index":220,"text":"还有真相部分，就是一生里面，可能碰到什么东西，哪个阶段碰到什么问题，应该怎么选择比较好。这就是真相的目的，也是帮助大家过关。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p221","index":221,"text":"既然一定要做人生的考题，就一定把考试点弄清楚：怎么考，什么时间考，都准备好，并且在这之前尽可能多练习一下，真考的时候也不慌。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p222","index":222,"text":"我们的目标，是关心大家这一生过得到底幸福不幸福。我并不关心你给不给我钱，更关心你过得幸福不幸福，这就是我们的东西。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p223","index":223,"text":"历史上还有没有人生指导性的东西？也有。比如圣贤，像孔子、孟子、王阳明、曾国藩，他们写的也有指导性，但其实指导了几个点。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p224","index":224,"text":"比如孔子的东西，指导性还多一些：什么是君子，什么是小人，应该怎么跟长辈交流，怎么跟友人交流。他定义的比较多，也算指导性的。再说有指导性的，就很少了。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p225","index":225,"text":"包括弘一法师，一些哲学家，说的东西也有指导性。但说白了，一辈子可能也就研究出那么几个点，听听也有作用，你说能改变什么？我觉得太小。这就是之前讲的，叫星星之火难以燎原。","level":0,"key":false,"section":"ep6-p199"},{"id":"ep6-p226","index":226,"text":"六 人性与心性","level":1,"key":false,"section":"ep6-p226"},{"id":"ep6-p227","index":227,"text":"人性与心性研究什么","level":2,"key":false,"section":"ep6-p226"},{"id":"ep6-p228","index":228,"text":"第三个需要了解的知识，叫心性和人性的东西，应该是人性和心性。什么是人性？很简单，解决的是人类遇到具体事情之后，应该怎么做。说细一点，具体事情中，怎么被触发、怎么形成想法、怎么走向行动，又受到哪些原则和底线约束，这些是人性。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p229","index":229,"text":"心性是什么？心性跟人性其实差不多。人性研究的是人类的问题；心性研究的是你具体碰到某些事的时候，会怎么被触发，形成什么想法，有怎样的行动，又受哪些原则和底线约束，这是心性问题。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p230","index":230,"text":"我们说一下人性，就是遇到事情之后，产生怎样的心情、感受、想法、取舍、决定和行为。一件事触动了人的什么需要？怎么理解这件事？产生哪些互相竞争的想法？哪些最后变成行动，哪些只是想想？会因为什么事情停下来，也会因为什么事情突破底线、破例？这就是人性要解决的东西。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p231","index":231,"text":"其过程就是：遇到事情了，这件事对我意味着什么？我的感受与欲望被唤起了什么？出现什么不同想法？怎么判断与取舍？","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p232","index":232,"text":"行动或者不行动，以及面对后果应该如何做，这就是人性的东西。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p233","index":233,"text":"安全受威胁与利益出现时的反应","level":2,"key":false,"section":"ep6-p226"},{"id":"ep6-p234","index":234,"text":"举几个例子。当人的安全受到威胁，面临危险、失去基本保障，比如饥荒、战争、疫情、洪水，出现这种情况，最重要的是什么？害怕、求生、要自我保护。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p235","index":235,"text":"不越界的处理方式，比如求助、防护、寻找自救的方法。但没有底线的人，为了保护自己，甚至可以把伤害转嫁给别人。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p236","index":236,"text":"比如人吃人这种事，现在基本没有了，但古代还挺多。史书上也有，像“两脚羊”，古代十国比较多。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p237","index":237,"text":"再举一个例子，利益和机会出现，比如有金钱、职位、资源、名气的时候，最重要的是想得到、怕错过、怕吃亏。不越界的行为，就是正当争取、提高能力、协商交换；越界的，欺骗、侵占、隐瞒重要事实，类似的事等等。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p238","index":238,"text":"我就不继续说了，因为一说到人性和心性，我估计能说几十集，这是人类需要学习的一大块，咱们就不展开了。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p239","index":239,"text":"影响选择与底线的因素","level":2,"key":false,"section":"ep6-p226"},{"id":"ep6-p240","index":240,"text":"人性的东西比较多。首先，有社会标准。比如现在大家认同的社会标准是男女平等，但古代可不是这样，一定是男尊女卑，甚至觉得女性是赔钱货，家里多几个丫头属于赔钱货。这是社会标准不一样。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p241","index":241,"text":"在不同社会标准下，还会有道德、底线的问题。有的人坚持底线，还有担心惩罚的问题，担心干了这事别人会不会报复，还有亲情、友情。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p242","index":242,"text":"比如“宁损性命，终不作恶”，如果死我没关系，要死我们家人，这还得考虑一下。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p243","index":243,"text":"死自己没问题，死老婆呢？有的可能开心，有的可能难过，但基本不会选择死自己的孩子。所以，不同的人，同样一个事，底线是不一样的。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p244","index":244,"text":"还有欲望，有的人对这个东西很有欲望，有的人没有；还有情绪，因为情绪造成很多心性、人性的波动。这些是产生人性波动、选择不同的因素，我列的肯定不全。同样一件事情，不同的人为什么产生不同的改变？因素很多。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p245","index":245,"text":"还有群体，比如朋友圈、闺蜜圈这么说，另外一个圈那么说，它不一样。不怕没好事，就怕没好人，就是这句话。包括“家有贤妻，夫不遭横祸”，也很重要。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p246","index":246,"text":"比如老公喝多了，要跟人干仗，老婆赶紧上去劝：“算了，你还有孩子呢，跟他弄干啥？”可能劝劝就行。如果老婆说：“干死丫的，操！”说不定气势输了，人生也没了。所以旁边的、身边的人很重要。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p247","index":247,"text":"了解人性先保护自己","level":2,"key":false,"section":"ep6-p226"},{"id":"ep6-p248","index":248,"text":"好，这是人性。了解人性是做什么？学习人性，是了解人类在什么状态下，可能做出什么反应和行动。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p249","index":249,"text":"知道人在什么状态下做出什么反应和行动，对自己有什么帮助？你看，这就意义思维了。第一，首先能保护自己。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p250","index":250,"text":"我们小团队现在又开始做一些提前预防的事。我知道未来大家生活可能比较艰难，而且越来越艰难。你放心，不会有什么回转，偶尔两三年会有一个反弹，但是未来十五到二十年，大家生活一定越来越不如以前、越来越艰难。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p251","index":251,"text":"这个时候，人性极其容易出现问题，我现在就在做防范。同时大家一定记住，十年后和十五年后，极容易发生国家和国家之间的大范围战争。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p252","index":252,"text":"为什么？拿泰国来说，以前很欢迎大家投资，你看现在开始追你税，开始清算外国人买的房子。办证的时候，能不知道一堆外国人买房了吗？能不知道很多东西不是租借的，就是用公司持有的？肯定知道。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p253","index":253,"text":"为什么那时不收拾你？那时候过得好，没必要玩这一套。为什么现在收拾你？很简单，没钱了，苍蝇再小也是一块肉。等以后连苍蝇肉都吃不上，你想想政府会干些什么？所以一看国家已经开始做一些不太地道的行为，就赶紧跑，别在那晃荡了。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p254","index":254,"text":"这就叫了解人性，先保护自己，再学会如何应用人性帮助自己。比如追女朋友，得赶她伤心难过的时候去追；人家正春风得意，你去追，有你啥事？所以得了解女人什么时候容易做出“正确的选择”，这也是人性的一部分。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p255","index":255,"text":"修心性为了保住轮回中的成果","level":2,"key":false,"section":"ep6-p226"},{"id":"ep6-p256","index":256,"text":"修心干的是什么？可以把修心当成桶。桶是装水的，修心的桶装什么？装你在轮回里能够积累出来的好的成果，有两个：一个功德，一个善缘。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p257","index":257,"text":"修心性主要修什么？第一，得善，善良；第二，利他；第三，仁，仁义礼智信，这些都得修，都是好的心性。包括人类好的品德、品质，都应该修。还有责任、担当、正义、公正、无私、大爱、包容等等，这就不说了。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p258","index":258,"text":"要对抗什么？五毒四心，还有各种负面情绪。修完之后，目标是什么？达到什么状态才是好的心性？有两个东西：一个静，一个稳定。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p259","index":259,"text":"静和稳定是修心性很重要的东西。静就是平静，但不能说没经过事。古人形容静的水平：“心中有惊雷，面如平湖者，可拜上将军。”至少不形于颜色，内心有什么变化咱不说，但至少不形于颜色。我觉得这是第一等。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p260","index":260,"text":"第二，本身心如止水，经历大风大浪之后，仍然平静面对这一切。不被诱惑的东西影响，也不被愤怒的东西影响，几乎没什么太大的情绪波动。不是说没有情绪，是有没有情绪波动。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p261","index":261,"text":"记住，这种东西叫免疫，而不是消除。是免疫，不是消除。最后达到的状态，叫稳定。","level":0,"key":true,"section":"ep6-p226"},{"id":"ep6-p262","index":262,"text":"稳定最重要的就是不被影响，也是免疫的一种，免疫的最后就叫稳定。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p263","index":263,"text":"当心性没有问题，在轮回里真正能影响你的，是认知、能力和意外，只剩这三个。意外不可能消除。但是知道意外不可能消除，出现意外时，为什么要产生情绪波动？也就稳定了。认知足够高，什么都看过，也就逐渐稳定，不容易做出错误的事。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p264","index":264,"text":"当然，不可能不犯错误，但不容易因为心性的问题做出错误决定，你轮回里很多成果就容易保住。不然，成果保不住，哪怕位列仙班，在上面犯一个事，惹的麻烦更大。还不如一个泥腿子犯点事，说白了，杀个人、放个火，也不至于有多大问题。在上位面，杀个人放个火——不是说杀个人放火，是犯点错误，可能动不动就影响一界生灵几千年的幸福。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p265","index":265,"text":"所以没有足够的心性，也别要求有更多东西，说白了就德不配位。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p266","index":266,"text":"给你更大的东西，只能更大地伤害自己，就是这样。不是说历史上没有人往上走，有，包括法界也一样。各族天骄，最后活到最后的很少。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p267","index":267,"text":"天骄最大的优势是什么？极其容易获得成功，获得功力、法力、神通都极其容易。但心性关只要上不去，最后很容易把自己祸害死，死得更惨，还容易惹外面的麻烦，带来全族的伤害。所以这就是心性。","level":0,"key":false,"section":"ep6-p226"},{"id":"ep6-p268","index":268,"text":"七 结尾与后续安排","level":1,"key":false,"section":"ep6-p268"},{"id":"ep6-p269","index":269,"text":"你们一定要了解人性和心性。了解人性、心性的东西很少，《资治通鉴》、很多厚黑学，包括看一些影视剧，都能够部分了解人性和心性。","level":0,"key":false,"section":"ep6-p268"},{"id":"ep6-p270","index":270,"text":"我觉得可能等我写完主要东西，到时候可以在真相里面，专门涉及一个人性和心性的栏目，争取多总结一些大家经常用到的东西。也只能说试着总结，这个东西太多，到时候再说吧。","level":0,"key":false,"section":"ep6-p268"},{"id":"ep6-p271","index":271,"text":"今天先说到这，一个半小时了，不聊了。肯定没说完，之后再说。还剩下估计半个小时尾巴，也懒得再说了，咱们下次再见。这两天之后见——不是，明天不说，后天继续。好，大家早点休息。","level":0,"key":false,"section":"ep6-p268"}]},{"id":"ep7","number":7,"name":"问道七","title":"意义思维与错误分类","speaker":"悟聊天尊","source":"20261003_问道7_意义思维与错误分类_整理稿.docx","date":"2026-10-03","description":"补齐十种知识类型，从成事七项框架进入条件、真相与机缘。","blocks":[{"id":"ep7-p34","index":34,"text":"一 开场近况与直播安排","level":1,"key":false,"section":"ep7-p34"},{"id":"ep7-p35","index":35,"text":"大家好，百忙之中又来听我瞎唠叨。还有几分钟，咱们先简单唠唠嗑，正式8点开始。最近直播会比较频繁，因为我正好准备了一批素材，能讲多少就讲多少。大家晚上好。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p36","index":36,"text":"那天我还查了一下，我这不脑袋上开了一个天窗嘛，开完天窗之后，能够恢复到我这种好像一点副反应都没有的，还挺少。除了现在有时候自己摸自己的脑袋，手感不太爽之外，其他还没什么太大问题。精神状态还不错，阴阳调和，哈哈。出问题是这边，但最近这边好像头发长得还挺多，不知道怎么回事。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p37","index":37,"text":"脖子还是有点费劲。手感不太爽，它有一道疤嘛，至少骨头少了一块，就觉得手感不好。大家晚上好，咱们正式8点开始，不废话。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p38","index":38,"text":"还好，幸亏老天爷保佑，不然万一有什么后遗症，没办法跟大家聊天了，可能这一世也就这样了。那天做手术的时候，推进去太快，后来才知道那个不能拖。我刚开始都觉得，妈的，我都没事了，你还让我做什么手术？但后来一看CT确实不行，人家说你别拖了，拖时间长了容易死，就只能推进去了。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p39","index":39,"text":"本来说还不行转到新加坡，但新加坡再找人、再过关，又得耽误几个小时。算了，这就是命，不过还非常好。好，咱们正式开始，8点了。我们的导播同志说，你每次都不让大家点赞，这不好。请大家一定要点赞、收藏、分享，也让我们的数据好看一点。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p40","index":40,"text":"咱们直播的意义，就是把我自己的想法先给大家讲一遍，先溜一遍脑子，看看大家的反应，自己也反复听上几遍，再进行录播。大概就这么一个意义。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p41","index":41,"text":"这几天我一直想赶，老想把这些东西都讲完，后来觉得自己又忘了本心、忘了初心。咱直播就是为了捋一下思路嘛。之前的直播，都是哪天直播，哪天现想今天播什么，没什么章法，想起哪块播哪块。现在要做人类说明书，基础打得差不多了，就把它弄成一个成体系的东西。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p42","index":42,"text":"有的东西想得还不是那么完整，也请大家原谅，准备得不太好。因为很多东西都是第一次面世，有想不到的地方，也有想得不合适的时候，包括语言组织也未必多好。我觉得第一遍先走上一遍。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p43","index":43,"text":"今天咱们把上一级知识分类后面那几个快速扫一下，主要的就是上面那些东西，底下的其实不是太重要，也没太多可说的，都是人间的东西，就不多说了。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p44","index":44,"text":"马上开始的是什么呢？人类犯错误，主要错误可能从哪出来？或者说，你要想成一个大事，需要准备什么样的东西，把什么东西都弄好，才能成大事？我记得冯唐先生有一个叫《成事》，说得很好，不过他只能从人间的层面说，我们更多的是把人间、法界都给说了。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p45","index":45,"text":"声音有点小吗？有的人说卡，有的人说不卡，我也搞不清楚，咱们先继续。我估计人类可能犯的错误，今天百分之百说不完。说不完，周一晚上再继续，把人类犯错的东西收一下尾。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p46","index":46,"text":"让他们关手机，还有现场给我开声音的，真讨厌，不守规矩。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p47","index":47,"text":"可能周二、周三是正式的大课，该讲智慧了。我估计智慧一集应该能讲完，万一讲不完，再拖一天讲。我现在也不给自己定什么目标，随意讲，什么时候讲完什么时候算，不要因为一些规矩影响了随意发挥。到时候速度会快一点。好，咱们继续开始。","level":0,"key":false,"section":"ep7-p34"},{"id":"ep7-p48","index":48,"text":"二 知识分类的后续内容","level":1,"key":false,"section":"ep7-p48"},{"id":"ep7-p49","index":49,"text":"上期讲的是知识分类，用意义法则去分类，就是你学完这个东西到底有什么用。包括我也想了一下，咱们做直播最大的意义是什么？为了帮我捋思路。既然捋思路，为什么一定要可丁可卯地在一集之内都讲完？讲不完，下次再唠点不就完了吗？又不是做节目。如果是录播、做节目，这一集是一集，直播本身就是唠嗑的事。所以我一下子也给自己放松了，没那么多事了。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p50","index":50,"text":"上期知识分类没讲完。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p51","index":51,"text":"上次讲的是人性和心性。人性和心性太大了，单独出一本书都没问题，不可能在一集里面讲完。我们只是讲一个知识分类：这类知识你必须去看，对你很重要。知道这些事就行了。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p52","index":52,"text":"第四类 学术边界类知识","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p53","index":53,"text":"第四个知识分类，叫学术边界类知识。其实很简单，人类所有的知识，就像在一个地图上开疆破土。边界是什么？某一些知识，在整个人类版图里面，最高和最外延的点在哪里，这就是边界类知识。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p54","index":54,"text":"比如数学，现在出什么弦理论，这已经算边界的东西了。如果突破，人类整个档次和级别就增高了。所以它不是普通科学知识，而是整个人类对世界的认知边界到底在哪里，这非常重要。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p55","index":55,"text":"一些伟人、科学家、哲学家、某个学术的导师，他们在哲学、逻辑、语言、科学体系上，究竟把问题研究得有多高、多深，代表人类的边界到底在哪里，这就称为学术边界类知识。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p56","index":56,"text":"比如哲学里面，维特根斯坦说的“语言即世界”，其实在哲学某一个领域里面，基本上算很高的成就了，目前还没有比这个更高的。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p57","index":57,"text":"像霍金研究黑洞，已经是很高的理论，目前还没有人超过他。这种东西很多，跟我们日常生活、平常老百姓几乎用不到。大概知道一下就行，别去较劲，因为咱不是搞科研的。你要搞科研，就去看看这些东西。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p58","index":58,"text":"包括前段时间北大一个女生，把一个数学难题又解决了，还获得了奖，算是中国籍第一个获得这个奖的女性，非常厉害。这也是数学的一个边界。某个数学难题，大概将近100年没人解决，她把这事解决了，人家很厉害。知道有这么一个事就行，不用知道太多。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p59","index":59,"text":"知道这些，就知道人类现在扩张领土扩张到哪去了。虽然没必要到那个边界去，了解一下就行。像数学、物理、化学、天文类，很容易出现边界突破，一突破，就代表人类世界的认知又往外扩张了一些。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p60","index":60,"text":"第五类 高维不确定知识","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p61","index":61,"text":"第五个知识分类，叫高维不确定，就是那些看起来非常高、非常深、非常接近终极，但在人类当前阶段，其真实性、完整性、验证性、现实性都还不稳定的知识。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p62","index":62,"text":"这也不是说都是玄学，科学、哲学和修行里面都有。比如“万法归一”，万法是不是最终归一？好像也不一定，它是理论上可推的。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p63","index":63,"text":"就像人类物理的很多公式，正着推也行，反着推也可以。公式上可行，但现实中不能够实现，做不到。只能按时间轴正向走，按时间轴负向走肯定做不到。理论上正反都一样，实际上只能往正的方向走，不能往反的方向走。所以万法归一也属于可能性。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p64","index":64,"text":"理论上应该归一了，但真的能归一吗？不一定。对于高维不确定的东西，只需要用意义思维理解就可以：这东西对我有没有用？现实中有没有用？没有用、应用不上，就边去，不用把它当成一回事，爱谁谁就完了。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p65","index":65,"text":"类似“本来无一物，何处惹尘埃”，又对不起六祖，又要用他的东西来弄，因为实在太高了，高得的确应用不上，哈哈。所以每次都拿六祖举例。它也没什么用，包括“无无”，还有像“五五五”，这能不能实现？理论上好像应该有这么一个，但具体跟人间界有什么关系？鸟关系都没有，也不用太看这些东西。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p66","index":66,"text":"科学上像暗物质，你说暗物质应不应该存在？理论上应该存在，但目前无法证明。有没有外星人？可能应该有，但有没有，反正也不关我们活得好不好。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p67","index":67,"text":"咱们就别说外星人了，身边的这帮神佛仙鬼你都看不着，就在你身边你也看不着，没事观察什么外星人？这些高维的，就在身边差一个维度的人你都查不到，就别关心外星人的事。这属于低维——对不起，高维无用。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p68","index":68,"text":"这类理论很可能很高、很真，也可能很接近终极，但没有办法成为普通人很稳定、很确定、能够应用的真理或者手段，实际上知道也没什么意义，纯粹浪费时间，大概知道一下就行。一定记住，甭管谁说的，谁说的都不重要。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p69","index":69,"text":"比如我跟你们说的星魂，跟你说完有什么用？好奇听一下就完了，还真去研究？星魂确实挺重要。一个星魂至少管理几十个魂，少的几十个，多的几百个，它的能量和天赋都有总数。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p70","index":70,"text":"很可能我这一世有点穷，能不能把其他现在不用财富的分魂的东西调过来？谁来调？星魂去调。但你有相应的手段吗？能到第三十层空间吗？都没有，所以听了也没用，就别扯了。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p71","index":71,"text":"第六类 工具方法与技能知识","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p72","index":72,"text":"第六种知识分类，叫工具、方式、方法、技能类知识。这个很重要。之前讲的知识都比较高，实际上不能马上起作用，但这种知识能够立竿见影地解决问题。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p73","index":73,"text":"比如看了手机说明书，说不定就会用手机；考一个会计证，就能够从事会计行业；弄一个从医资格证，就可以当医生，给人正式看病。这属于技能类的东西。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p74","index":74,"text":"类似的有工具类、方法类、技术类、流程类、软件类、技能类、系统类、操作手段、执行方法，还有现实转化的路径，都属于技能和工具类的书。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p75","index":75,"text":"哪怕不会做菜，买一本厨艺大全跟着做做，至少先解决吃饭问题。这些非常有帮助。比如小学生不会写作文，看一本优秀作文300选，说不定就有感觉了；或者词汇大全，说不定能拽出点文了。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p76","index":76,"text":"这些很容易立竿见影。如果想迅速改变自己的生活和命运，技能类的东西一定还是要多学。但是它不能提供方向，只能增加你被别人需要的程度，或者增加你应对生活中一些麻烦的技巧。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p77","index":77,"text":"工具类的东西本身没有方向、对错，也不决定善恶。它不是方向类的，就是技能类的东西。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p78","index":78,"text":"第七类 生活与生存知识","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p79","index":79,"text":"第七个，叫生活和生存类知识，就是人如何活下去、如何活得稳定、活得不崩溃。比如健康、饮食、睡眠、运动、基本财务、安全常识、基本法律、工作、家庭秩序、生活管理。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p80","index":80,"text":"这些能够让你活得更好，大概可以看看。我觉得看看也不错，它解决的是生活质量问题。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p81","index":81,"text":"第八类 交流与人情世故知识","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p82","index":82,"text":"第八个属于交流类、人情世故的知识，非常重要。因为你活在人的世界里，人和人之间怎么相处，怎么减少冲突、形成合作，这类书籍我建议还是看一看。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p83","index":83,"text":"包括说话的分寸、办公室政治，怎么从细微表情、动作看出一个人的情绪和心理变化，我觉得很重要。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p84","index":84,"text":"哪怕有些场合上的应酬，怎么表达感谢、怎么不打扰别人，都很重要。还有建立信任、价值交换、识别虚伪、处理冲突、懂得尊重。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p85","index":85,"text":"一个人能力可以很强，但说话总让人不舒服，做事不顾别人感受，不懂感恩、不懂分寸，最后别人都不愿接触他、帮助他，也不愿长期合作，再有本事也走不远。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p86","index":86,"text":"反过来，一个人可能能力中等，但懂得尊重、配合、表达，懂得给别人安全感，反而更容易获得机会。这类知识很人间化，非常重要。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p87","index":87,"text":"第九类 见识扩展知识","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p88","index":88,"text":"第九个，叫见识扩展类知识。扩展知识范围，增加见闻、谈资、文化感，丰富理解素材，让人知道世界上还有不同的点。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p89","index":89,"text":"类似《时间简史》《人类简史》《枪炮、细菌与钢铁》，还有很多名人传记、《百年孤独》，大量名著，写得的确非常好。但这些只是表达作者对人生或者一些事物的观点，具体能不能对你产生思想上的很大飞跃、能够提升什么，我觉得不一定。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p90","index":90,"text":"这类东西看看就行，不用太浪费时间。一年我觉得看两三本就够了，或者连看都不用看。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p91","index":91,"text":"让AI帮你解读一下，大概知道一个情况。别人聊《百年孤独》讲什么，你都不知道，这就有点low了。但需要花太多时间去读，甚至精读吗？我觉得不一定，大概理解就行。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p92","index":92,"text":"第十类 无用信息","level":2,"key":false,"section":"ep7-p48"},{"id":"ep7-p93","index":93,"text":"第十个就是无用的东西，对个人成长、现实、命运、判断、行动没有任何价值。比如低级八卦、网络骂战、情绪垃圾、谣言、低质量短视频、无意义争论、阴谋论垃圾，还有纯粹刺激欲望的信息，纯粹没有价值。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p94","index":94,"text":"反而越是这种东西，越占据人很多时间。我觉得这就是浪费生命。","level":0,"key":false,"section":"ep7-p48"},{"id":"ep7-p95","index":95,"text":"三 用意义思维安排学习次序","level":1,"key":false,"section":"ep7-p95"},{"id":"ep7-p96","index":96,"text":"最后做一些总结。这十类知识，如果要改变命运、迅速提升水平，应该先看什么？先看真相类知识，再看方向指引。因为真相不了解，方向指引说多了也没用。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p97","index":97,"text":"比如很多女孩不知道黄毛的危害，妈妈给她做方向指引，你觉得她能接受吗？肯定接受不了。所以得先有足够多的真相，再有方向引领类知识，然后看人性、心性的知识。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p98","index":98,"text":"这三类真正决定命运，决定一个人怎么看世界、自己和众生，往哪里走，能不能承载正确的规则。这三类没有建立起来，后面建立再多也没用。工具类、生活类建立再多，方向一旦错了，基本全白费。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p99","index":99,"text":"第二类，是在现实中马上能落地的，比如工具、方式方法、生存类知识，我觉得也非常重要。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p100","index":100,"text":"还有人情世故，这是第二优先级要看的。这三类决定你在人间能不能活得稳、能不能做事、合作，能不能把想法变成结果。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p101","index":101,"text":"前面三类是人生大方向，大方向别走错了，但不能解决下一顿饭怎么办。方向都对了，现在要解决吃饭问题，还不如去做个包子店。方向问题不解决吃饭问题，不解决这月工资从哪来。所以第二类也很重要，哪怕多研究研究怎么做包子，也不至于饿死。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p102","index":102,"text":"第三类，叫学术边界和高维不确定的东西。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p103","index":103,"text":"高维不确定的东西可以看看，代表人类至少某一层次的边界，人类世界的认知扩张到哪里，想得有多高、多宽。少量看就行，因为跟生活没太大关系，不要太多研究。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p104","index":104,"text":"少量了解即可的知识，叫见识扩展类知识。比如看看《百年孤独》《人类简史》《时间简史》。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p105","index":105,"text":"这些也可以，开眼界，跟人聊天、吹的时候，至少咱博学，哈哈。然后要远离无聊的东西，其实也不能说远离，上厕所、睡觉前需要酝酿感情的时候可以看看，或者吃饭时旁边放点东西、开车时旁边放点东西，属于干这事。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p106","index":106,"text":"知识分类最后的总结是什么？人类不是缺知识，而是缺少对知识的分类。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p107","index":107,"text":"很多人把高维知识当成当前可用的知识，陷入高维正确陷阱；把短期有效的东西当成真正有用的东西，遭到长期反噬；把见识扩展类知识当成认知提升，生命被大量消耗。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p108","index":108,"text":"很多人掌握了工具、方式、方法，却没有真相、方向和心性，最后把错误的事情越做越大；追求学术边界、高维不确定知识，却没有解决现实人生的基本问题。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p109","index":109,"text":"真正的智慧，不是知道得有多多，而是知道什么应该学、什么不应该学，什么该深学，什么只需略微知晓；什么知识可以改命，什么东西会耗你的命。","level":0,"key":true,"section":"ep7-p95"},{"id":"ep7-p110","index":110,"text":"什么短期有效但长期有害？什么短期无感但长期有大用？所有东西一定要用意义思维去审定。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p111","index":111,"text":"我此时此刻看的东西，对我在人生里面起到什么作用？属于哪一类？适不适合当前阶段？能不能落地？能不能在更长时间里产生正向结果？只有经得起时间检验、能持续产生正向结果的知识，我觉得对我们才非常有用。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p112","index":112,"text":"知识分类说完了，开始今天主要的东西。先喝口水，叫错误，在错误中成长吧。我还没想好具体叫什么名字，叫成事宝典也行。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p113","index":113,"text":"大家先点个赞、分享一下、收藏一下，别费了半天劲，最后连几个分享收藏都没有，数据不好看。我稍微休息，再等几十秒，8点30分正式开始。","level":0,"key":false,"section":"ep7-p95"},{"id":"ep7-p114","index":114,"text":"四 成事中的错误与七个环节","level":1,"key":false,"section":"ep7-p114"},{"id":"ep7-p115","index":115,"text":"你们现在还卡？真奇怪，最近老是卡，逼着我要换地方。我们已经新建了直播间，以后换个地方，不在这个小区了，这小区风水不好，决定换个好点的地方。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p116","index":116,"text":"好，正式开始，8点30分。本来想讲意义思维在分析错误上的一些应用，后来想这时间有点太长，咱们先说结论。今天肯定讲不完，就讲到9点30分，讲一个小时，看能讲到哪。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p117","index":117,"text":"我们说的是人类在成事上容易犯的错误。把错误都讲了，你不犯错误，不就容易成事了吗？也可以理解成成事宝典。冯唐也有《成事》，人间部分咱们肯定没有人家丰富，但总体框架上，我们肯定考虑更多因素。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p118","index":118,"text":"想成功，不是简单一句“这个人太笨、太蠢、太情绪化、没努力”就能解释清楚的。真正看透，要分三个阶段。这不是小事，是人生做一些大事：做事之前、做事之中、做事之后，整条链路得学会拆开看。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p119","index":119,"text":"为什么一个人会出错？可能做事之前就压根没有成功条件，也可能从来没有接触过能够让他成功的真相。看到的信息不真、不全、不对，也可能是低维的。也可能分析、学习、研究的能力不足，或者做着做着碰到压力，顶不住压力和阻力。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p120","index":120,"text":"最后，有可能身体撑不住了。比如那个是叫张雪峰吧，就属于身体撑不住了。还有把个人情绪和不好的心性带给大家，大家产生反感，导致出问题；有可能用错人、看错人、处错关系；当然也有不会复盘、不承认错误、不愿修正。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p121","index":121,"text":"人类犯错误有很多点，不是单点缺陷就完了，而是在整个成事链条里面，任何一层发生问题，都容易出现失真、失控和失效。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p122","index":122,"text":"人在条件、真相、分析、研究、执行、掌握、身体承载、心性、情绪、人际关系和反馈修正这些系统环节中，任意一层发生失真、失控或者失效，都会导致判断和行动出错。一旦出错，就要承担失败的后果。","level":0,"key":true,"section":"ep7-p114"},{"id":"ep7-p123","index":123,"text":"一个人想成大事，本身就是系统工程。想成就的事情越大，越需要方方面面都不能失败。所以成功的人或者能力、能量巨大的人，你会发现很少。成功的人总是千篇一律，失败的人各有不同，因为不定是在这坎失败，还是在那坎失败。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p124","index":124,"text":"比如稻盛和夫、巴菲特、段永平，基本都是一个模子出来的，所以可以做得很成功，而且能够穿越经济周期。马斯克能不能穿越经济周期，都不好说，现在只不过还在势头上。他犯错误的概率不大，但还是有。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p125","index":125,"text":"至少在几十条甚至上百条成功因素中，基本全部都要占优，而且不能犯太大的问题，才能保证最终成功的可能性。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p126","index":126,"text":"互联网上，尤其海外互联网，能成为很厉害的大V的，能力、心性、品质基本都差不多。反而底下做不起来的，多多少少会有问题。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p127","index":127,"text":"就算一时运气爆棚，偶尔成功了，基础素质出了问题，最终失败也只是早晚的事。有点像拼图，哪怕差一块，整个图版都不完整；也像木桶原则，差一块木板，积不了水，就算积上了，早晚也得漏光。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p128","index":128,"text":"成事的七个大方向","level":2,"key":false,"section":"ep7-p114"},{"id":"ep7-p129","index":129,"text":"我们总结了成套体系，需要在七个大部分上注意。还是只说大框，不做细致分析，因为细致分析又是一本书，东西太多。只是让大家了解方向，细致的等未来有时间再弄。什么都弄得特别细，那就别讲了。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p130","index":130,"text":"第一，条件和真相。没干事之前，必须提前具备。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p131","index":131,"text":"第二，这两个具备之后，才是分析、学习、研究的能力，说白了就是自我迭代。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p132","index":132,"text":"第三，执行掌控。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p133","index":133,"text":"第四，身体不要出问题。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p134","index":134,"text":"第五，心性和情绪。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p135","index":135,"text":"第六，人与人之间的问题。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p136","index":136,"text":"第七，修正反馈。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p137","index":137,"text":"按这七个大方向修行自己，做一个事才不容易失败，不然很容易失败。为什么很多人不成功？","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p138","index":138,"text":"把这七项都做成功的人很少，七项里面又有很多细节，一会儿再讲。我估计今天条件和真相能不能讲完，都是一个事。底下第二条到第七条，反而不是我应该讲的重点，都是人间的正确、人间的东西，包括学MBA，这些是人间已经掌握的东西。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p139","index":139,"text":"人间已经掌握的，咱们不重点讲。我专门讲人间掌握不了的东西，这是我们应该多讲的。","level":0,"key":false,"section":"ep7-p114"},{"id":"ep7-p140","index":140,"text":"五 做事之前的条件与真相","level":1,"key":false,"section":"ep7-p140"},{"id":"ep7-p141","index":141,"text":"第一部分叫条件和真相。为什么放在前面？因为人在真正分析、学习、研究、执行之前，最先遇到的不是会不会做、努力不努力，而是两个更基本的问题：有没有成事的条件？到底有没有看到过真实的真相？","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p142","index":142,"text":"一个人没有真正的机缘，没有碰到真相的机缘，也没有成事的机会，没有贵人引导、相应天赋、相应福报，又容易被因果业力、冤债、高维对抗、环境和意外干扰，再努力也没用。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p143","index":143,"text":"第一部分分两块，一是条件，一是真相。条件这坎，法界的东西会多一些。一个人开始做事之前，或者事情已经开始存在了，能够影响他的东西是什么？首先是机缘，第二贵人，第三天赋，第四福报，第五因果业力与冤债，第六高维对抗，第七环境与意外。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p144","index":144,"text":"用到的就是经常说的法界成像。既然读了《道德经》，就知道“天下万物生于有，而有生于无”。什么是阴阳，什么是有无？学了咱们很多东西，一定要明白。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p145","index":145,"text":"法界成像与盲目跟风","level":2,"key":false,"section":"ep7-p140"},{"id":"ep7-p146","index":146,"text":"任何东西，阳间呈现的叫显化，但在阳间显化之前，法界必须提前成像。这就是我为什么不希望大家盲目跟风的主要原因。人家做成功了，你就去做成功，这不可能。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p147","index":147,"text":"马云做成功了，你试试，就算各个条件比马云高，没有人家的气运和法界成像，也做不成功。比如我这行，应该算做人类说明书这一块，再大的努力，想超过我，可能性也没有，因为你身上没有法界成像，没有那种成像机制。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p148","index":148,"text":"法界没有成像，再努力也不可能成功。对于绝大多数人类来说，时间基本就放在了根本没有这命、没有这运的东西上。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p149","index":149,"text":"我有时候一直说，“王侯将相宁有种乎？”从人间层次说，不应该有，但从法界说，的确有。别管出生是什么，哪怕像朱元璋，出生就是一个碗，家里都饿死了，只要法界能成像、有帝王命，走着走着一定能当皇帝。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p150","index":150,"text":"别管出生家庭多好，没有当帝王的命，再怎么努力，再怎么“布化”，这事也跟你没关系。本身不具备，就别在那扯。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p151","index":151,"text":"人类不知道法界成像是前提条件，很多人把一生浪费在这些没有意义的事情上。所以一定要抓好自己的气运。尤其心念很高，觉得此生不平凡，不想做普通人，一定先确定是不是气运之子、气运之女。如果不是，把自己定义成能够抱老大大腿的人，也能沾光。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p152","index":152,"text":"大哥大姐的大腿抱不上，踏踏实实做个普通人，别想太多。人类大量痛苦，就是在根本不可能的道路上努力。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p153","index":153,"text":"比如学习，很多人认为逼着孩子学习，学好了就能改变命运。你们家孩子是不是学习那块料，心里没点数？比如我儿子，他就不是学习这块料，现在还上幼儿园，我就知道这事。你觉得我会逼他学习吗？根本不可能吃学习这碗饭。他能把老爹的事接班，我就阿弥陀佛了。所以不要让他在不可能成功的事上努力。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p154","index":154,"text":"第二，很多人一生都想创业。你有创业的命，有挣大钱的命吗？不是那类人，就别想。创业能做多大也很重要。创业能成功，就去创业；不成功，别在那混。经济好的时候，混混也行，大不了半死不活，不亏钱还不至于。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p155","index":155,"text":"但经济大萧条的时候，想创业成功，说白了，不是玩野路子的，不是资源很厉害、优势非常强的，尤其在互联网上，不能在某一个细分行业数一数二的，就别扯这蛋了。浪费自己时间，浪费家里财力，也浪费很多人。很多人追求了今生根本不可能追求的东西，所以一定记住，法界成像很重要。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p156","index":156,"text":"积累之财与自己的挣钱方式","level":2,"key":false,"section":"ep7-p140"},{"id":"ep7-p157","index":157,"text":"就跟我似的，能不能有钱？首先要查法界成像。你的有钱，是积累之富、积累之钱。未来积累足够多，还算有钱人。但以我现在都50岁了，估计怎么也得10年、20年后慢慢积累，因为钱属于积累之财，跟暴富命没关系。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p158","index":158,"text":"所以别想这事。有人说，师父，不行去投资点东西吧。你看看自己的命盘，只能靠事业宫，通过做事提升命运和财力，紫微上写得很清楚，没事投资去？","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p159","index":159,"text":"投资的本质是什么？别人帮你努力，你坐享其成。有那命吗？命局的挣钱格局不是这个，投资能挣到钱？包括我们用仙家给很多人看股票，你看我买过吗？没这命就别使劲，踏踏实实干活就完了。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p160","index":160,"text":"一定跟自己的东西对上。至少我这辈子还算能通过几十年努力挣点小钱，大钱肯定不能挣。一会儿说天赋，我就很郁闷，这他们的，这种天赋都注定不能富。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p161","index":161,"text":"太有钱不可能，尤其太早有钱，你还会传法吗？没事研究这东西？不经历点苦难，能让你想出来？所以肯定得先穷。等快咽气了，一看，终于挣了点钱，妈的，也没来得及花，嘿嘿，这就是命。","level":0,"key":false,"section":"ep7-p140"},{"id":"ep7-p162","index":162,"text":"六 机缘之一 遇到真相的机会","level":1,"key":false,"section":"ep7-p162"},{"id":"ep7-p163","index":163,"text":"第一个先说机缘。机缘拆成两部分：碰到真相的机缘，成事的机缘。一个解决能不能见到真实的东西，一个解决能不能遇到能成的事，这是两个东西。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p164","index":164,"text":"碰到真相的机缘，还不是真相，只是能不能碰到真相的机会，非常重要。之前讲过思维茧房、破圈，破圈很重要。碰到真相的机缘，是指有没有机会接触能够让你飞黄腾达、真正有用的东西。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p165","index":165,"text":"还是举海外一些大V的例子，讲经济、政治、历史、国情、现实、世界新闻的，人家的见识不是你想学就能学。没有那个命、那个机缘，想去撵他们，根本撵不上。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p166","index":166,"text":"人家讲的东西，你就觉得，都从哪听的？太有意思了，听得如痴如醉，听完觉得学习了，这是海外大V非常厉害的地方。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p167","index":167,"text":"咱们讲天道认知也是一样，想超过我的水平挺费劲。十多年里面，我见过的东西也不是他们能看到的。没看到这些，怎么产生相应认知？别费劲，有什么样的机缘，就能看到什么样的真相。一旦看到，就会产生不一样的认知；认知能超越别人，就非常厉害。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p168","index":168,"text":"真相至少分成三种。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p169","index":169,"text":"跟风真相 行业真相与高维真相","level":2,"key":false,"section":"ep7-p162"},{"id":"ep7-p170","index":170,"text":"第一种，叫跟风真相。现在可能比较难弄，但当年百度、新浪、淘宝、快递行业、电动车，还有可回收火箭，这都叫跟风。比别人更先接触这些东西，就很容易把海外先进的东西引入国内，这是90年代、00年代那帮人干的事。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p171","index":171,"text":"百度、新浪、淘宝、快递、电动车，还有现在玩火箭回收的这帮人，不都是抄外国的吗？这叫跟风下海。能见到真相，在我们那个年代就很厉害。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p172","index":172,"text":"像百度，我们那会儿还努力用调制解调器上网，插根电话线，嘣嘣嘣嘣，弄一堆事，最后上网了，还特别慢，偶尔打开几个网页就觉得很厉害。人家在美国，早经历过这些。没有人家那个经验，也没办法。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p173","index":173,"text":"第二，叫行业真相。还是外网那几个很厉害的大V，讲政经、历史、经济、人生，没有一定高度的接触，根本不可能讲出来那些东西。所以非常重要。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p174","index":174,"text":"第三，我们这种叫高维真相，天道之事、法界之事。真相大概分这几类。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p175","index":175,"text":"想成为一个行业的翘楚，至少要接触行业的顶级真相，不然想成大事，绝对不可能。包括国美也是，人家赶上机会。能看到真相的人所创造的东西，也没什么太新鲜。包括我，我相信比我聪明的人很多，假设他们能够看到我所看到的真相，相信总结得会比我更厉害。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p176","index":176,"text":"网上这些很厉害的大V，比他们总结能力更强的人，一定存在，只不过没那命。像人类探索世界，先看到足够多的真相，再归纳、总结、找规律，最后形成一套体系。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p177","index":177,"text":"只不过人家有机会接触，你没机会接触，想成体系，对不起，做不到，不是脑子好使就可以。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p178","index":178,"text":"所以为什么我说，真相来源于缘分，修行最终就是一场善缘，这很重要。什么东西跟你有缘，什么允许你超过别人、看到更有用的东西，就决定高度和方向，也决定努力有没有价值。像我这样能看到天道真相的，只不过有机缘能看到，你没有而已，所以修一场善缘非常重要。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p179","index":179,"text":"做不到怎么办？只能一辈子在低维信息圈打转。接触不到真正的人、法、规则、门路，也接触不到真正能让你开窍的东西。这不是努力不努力，努力也没用，只是没有碰到真相的机缘。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p180","index":180,"text":"一个人没有碰到机缘，可能学了很多东西，但都是浅的、碎的、假的、普通层面的。可能非常努力，但也只能在低层次循环。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p181","index":181,"text":"碰到真相的机缘，看的是有没有机会接触真正接近本质、规则、高维、核心的东西，最后一定会让你产生独特、惊艳、数一数二的优势。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p182","index":182,"text":"怎么判断圈子能否帮助自己突破","level":2,"key":false,"section":"ep7-p162"},{"id":"ep7-p183","index":183,"text":"怎么判断遇到了很好的圈子？很简单，听别人讲的东西，对你是一种震撼，是一种渴求的状态。跟这个人在一起，有可能提升认知。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p184","index":184,"text":"怎么判断自己成为了别人渴望的圈子？现在你说话、讲话，一堆人围着愿意听，并且很饥渴，想得到你的知识，你就成为别人期望遇到的圈子。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p185","index":185,"text":"怎么判断自己一直处于平庸中？认识的所有人说话时，已经没有任何新鲜感，没有对知识渴望的情绪波动，一切都很平常，就代表这个圈子给你产生的知识或者认知，已经很难帮助你突破，就这么简单。","level":0,"key":false,"section":"ep7-p162"},{"id":"ep7-p186","index":186,"text":"七 机缘之二 遇到能够成事的机会","level":1,"key":false,"section":"ep7-p186"},{"id":"ep7-p187","index":187,"text":"第二，能够遇到成事的机缘。成小事靠福报，成大事靠天运。正好细谈一下收入。收入是揣到兜里、能够拿回家的钱，不是流水。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p188","index":188,"text":"年收入十万元以下到一百万元","level":2,"key":false,"section":"ep7-p186"},{"id":"ep7-p189","index":189,"text":"第一个，年收入10万元以下。我觉得费不了多大福报，就凑合活着，踏踏实实活着，什么都别想，做到这件事就行，以最低生活标准活着就可以了。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p190","index":190,"text":"第二，年收入10万到30万元，尤其接近30万元的，在普通大众里面已经算优秀者。如果房车都有、没有贷款，在中国这个环境里，应该是生活非常舒服的阶层。大事做不了，但小日子只要不嘚瑟，还是挺滋润的。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p191","index":191,"text":"偶尔吃个小烤串，没什么问题。比如明天我又要喝小啤酒，所以今天讲不完，明天也不讲，不能耽误我喝小啤酒的时间。属于这样，大钱没有，小钱还有一点，也能让孩子上上学，但别指望太大投入和支出。家人没有太大病灾，或者想实现的东西，还是可以的。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p192","index":192,"text":"国内不要富游，一年一两次旅游问题不大，出国有点穷游，但还可以。这是年收入30万元以下，还是挺不错，而且税务局也不会找你，也不会有人盯着什么事，所以30万元以下工资还是可以的。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p193","index":193,"text":"如果年收入达到30万到50万元，就叫小有成就。普通工人、打工的人想达到这个生活水平，尤其在经济大萧条的情况下，已经算很厉害。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p194","index":194,"text":"很多大厂员工能达到年收入30万到50万元，已经是在优秀的人里面比较优秀的。如果年收入50万到80万元，一般是什么水平？得是985或者211、博士以上学历，还得是热门专业。咱不说超一流985，清华北大不算，说普通985、211博士，还要热门行业，普通行业基本做不到。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p195","index":195,"text":"50万到80万元，国内的还行。80万到100万元，就得比较好的，比如清华北大博士、热门行业，或者海外名校博士、热门行业，能回国基本是这个。但都在海外博士、热门行业了，没事回国干什么？我也不知道咋想的。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p196","index":196,"text":"100万元，请大家记住，对于人间界是很重要的分水岭。对普通人，基本就是一生的天花板。这是收入100万元，不是流水，不是公司流水。打工能达到年薪100万元，绝对万里挑一，非常艰难。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p197","index":197,"text":"自己创业、做生意，年收入100万元，也得有一定的机缘机会。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p198","index":198,"text":"比如得有比较厉害的特长，或者进入很厉害的行业。我年轻时，房地产还比较热，那帮小老板、包工头赶上好时期，年收入100万元问题不大。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p199","index":199,"text":"记得当时中关村理想大厦刚开工，一帮小工头开着小面包、破桑塔纳来。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p200","index":200,"text":"理想大厦盖完，装修都完了，这帮家伙基本换车了，要不宝马，要不奥迪A6。大概这水平。必须有很厉害的特长，或者进入较好的行业，正好赶上行业上升期。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p201","index":201,"text":"要不就是有大哥大姐带。比如深圳的“水杯市场”，可以没学历。我见过给人干活、拉车的小伙子，嘴勤快，人也勤快，看着踏实，大哥大姐叫得很好。人家说什么东西归你了，给了一个机会，100万元挣到手，很容易。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p202","index":202,"text":"但这是不打工的。打工想挣100万元，远比创业、做生意挣100万元难得多。到100万元这个阶层，多多少少得有点机缘、气运和能力，普通人已经很难了。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p203","index":203,"text":"从100万元以上再说，就会发现不是靠能力，而是要靠一定气运。收入幅度越高，需要气运足够多，不是说能力很强。当然，能力也很重要。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p204","index":204,"text":"年收入一百万元到一千万元","level":2,"key":false,"section":"ep7-p186"},{"id":"ep7-p205","index":205,"text":"100万到300万元，年收入能够到300万元，拿回家这部分钱能到这个水平，需要在一个行业里面小有成就。至少在一个小城市，或者比较好的县城，普通县城还达不到。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p206","index":206,"text":"在一个小行业里算比较知名，一提这个小城市、较好的县城，比如做洗车的，你们家是老大，恨不得得这样。没有这个东西，都不太容易。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p207","index":207,"text":"300万到500万元，所需福报是另外一个层次，基本在中等城市里能做得小有名气。真拿500万元回家，生意怎么着得做一两千万、2000万到3000万元左右，还得是利润率较好的。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p208","index":208,"text":"做电商，很可能做到5000万元或者1亿元，能不能拿500万元回家还是一个事，大概这样。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p209","index":209,"text":"500万到1000万元，注意，1000万元又是一个坎。福报能够上升到拿1000万元入自己口袋、拿回家，生意至少得3000万到4000万元以上体量。做三四千万元，拿1000万元回家，已经算暴利了。这里说的不是销售额，是收入。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p210","index":210,"text":"富贵年限与福报的案例","level":2,"key":false,"section":"ep7-p186"},{"id":"ep7-p211","index":211,"text":"每年能够拿1000万元以上回家，已经不是普通人的区域。就算天界之上，也必须上仙以上级别。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p212","index":212,"text":"比如之前说过东北一个学生，也不能说学生，人家没跟我学，是客户。一个长得很漂亮的大眼美女，我看她一年挣100多万元，现在肯定挣不到了，也就10年气运。长得漂亮，能挣钱，也有朋友帮她，主要也有朋友帮。大概是200年守护一个村庄。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p213","index":213,"text":"这个功德换了大概10年左右、每年100多万元净利润的福报，也就这水平。长得真挺漂亮，眼睛很大，我见过本人。没见本人时，我还怀疑那眼睛是不是特效弄的，见过之后发现真不是特效，确实挺大。所以一定记住，很难。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p214","index":214,"text":"记得还有一哥们，以前一个女同事的老公，好像跟着餐饮协会的老大混，当时给他很多资源，也是十年富贵。那十年里，我估计一年肯定上不了500万元，也就两三百万元。爱嘚瑟，换换车，也就这水平。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p215","index":215,"text":"这是什么？前世一世在佛前供灯，换了可能不到10年富贵。之后好像做人把上面领导得罪了，人家不理他，不给资源，马上打落尘埃。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p216","index":216,"text":"如果一年挣100万元以上，普通人大概得修行一辈子，换那么10年；那只小狐仙200年换10年，大概这水平，很不容易。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p217","index":217,"text":"每年能拿1000万元以上，天上至少得上仙以上级别才有这样的福报。普通仙人能够拿三五百万元，就算很不错、很厉害了。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p218","index":218,"text":"现场延伸 灵魂等级与上古神兽","level":2,"key":false,"section":"ep7-p186"},{"id":"ep7-p219","index":219,"text":"尤其天界小婢女、小丫头、小金鱼、小灵兽，想换这个很费劲。看你们又说天庭财神殿的，人家神兽级别不一样，人都上古年代的。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p220","index":220,"text":"上古之前没有人，只有两种生物，一种天生灵物，一种神兽。包括女娲、伏羲，有一个像，腰部以下蛇身缠在一起，上半身是人。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p221","index":221,"text":"所以那个时候，大家还没选好人应该长什么样，没有决定出来，就没有人。我徒弟说人家是畜生，说这话被人抽活该。应该说神兽，而且上古神兽，不是上古神兽，说白了没有用。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p222","index":222,"text":"师门也一样，真正业绩好的，还得是之前很厉害的，比如我之前左右护法。级别如果低，根本撑不起重要的事。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p223","index":223,"text":"我这种没什么财富，但传法这事能撑起来。我当年是什么？至少是“第十三海的界主”吧，相当于第十山海界的一界之主。才有这种灵魂级别，普通人想弄不行。手底下做得比较好的，也都是一界之主，只不过第十山海下面的一界。那时候打位面战争，很多位面，你至少得一个位面之主，福报等级和各方面才行。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p224","index":224,"text":"又有点说多了。很多事跟普通老百姓没啥关系，凑合过着就完了，别想那些。真正改变世界、大富大贵的，哪个灵魂等级低？甭管出生可能就是泥腿子，说白了没有灵魂等级低的。能挣几十亿元，灵魂等级能低吗？","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p225","index":225,"text":"所以当年只能说人家神兽，不能说畜生，这肯定不对。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p226","index":226,"text":"像观音，也是先天灵物，就是一块紫色玉石；孙悟空不也是先天灵物？“造化金良”也是先天灵物。狮驼岭那仨，哪个水平低？不是先天灵物，是先天神兽。像唐僧、金蝉子，洪荒十大凶兽之一吧，创造的杀戮少了？","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p227","index":227,"text":"上仙不是星君，还差一级。扯多了，跟你们一开火车，就不知道开哪去了。","level":0,"key":false,"section":"ep7-p186"},{"id":"ep7-p228","index":228,"text":"八 更高收入层次与气运的讲述","level":1,"key":false,"section":"ep7-p228"},{"id":"ep7-p229","index":229,"text":"年净收入三千万元与行业位置","level":2,"key":false,"section":"ep7-p228"},{"id":"ep7-p230","index":230,"text":"我们说3000万元。每年能踏踏实实拿回3000万元，需要的福报和气运完全不一样，最基础也得星君以上级别。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p231","index":231,"text":"我在北京接触过做地产的小老板，自己包地、建楼。房地产好的时候，一年做一两个项目，都结算完净利润大概三四千万元，也就这水平。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p232","index":232,"text":"做一两个小区，不是多大的小区，里面可能四五栋楼，了不得了，都结算完，能拿回家的可能3000万元，差不多。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p233","index":233,"text":"你们想听那些东西，等讲法界天机再讲，不许给我拉偏。现在讲的是非封建迷信的东西，不能讲太多。以后讲洪荒时期的事情再说，可有意思了。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p234","index":234,"text":"记得前段时间有些断卦还说鸿钧老祖属于邪教，为什么会出现这个情况？上面有一部分人也这么认为，属于理念不合。等讲《山海经》时，再跟你们说。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p235","index":235,"text":"一年挣3000万元，需要星君以上的福报。为了挣这点钱，要打通银行、政府、市场、销售手法、促销各环节，还有自己的团队。智慧等级、团队等级都非常厉害。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p236","index":236,"text":"达到这个级别，在小城市或者中等城市，行业里算得上一号人，基本能算number one。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p237","index":237,"text":"前五名吧，前五名没问题。在大城市，至少地产圈提一下，圈里人知道有你这么一号人，才行。这是3000万元。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p238","index":238,"text":"五千万元到一亿元及更高层次","level":2,"key":false,"section":"ep7-p228"},{"id":"ep7-p239","index":239,"text":"一年能拿5000万元到1亿元回家，算比较高级的星君。一定记住，星君等级划分跨度非常大。真君基本下来可能性很小，威压和能力比较大。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p240","index":240,"text":"你们能看到在人间折腾出来的，星君比较多。半佛级别，我也曾见过一个，大概4家还是6家上市公司，就这水平。人家的脑子、福报、手段、人脉确实厉害，也是泥腿子上去的。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p241","index":241,"text":"一年能拿回家5000万元到1亿元，就是比较高级的星君。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p242","index":242,"text":"在大城市的小圈子、小行业里，基本能排前几名。一年拿1亿元回家，产业可能得做到10亿元左右，拿这么多钱回家挺费劲。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p243","index":243,"text":"再说普通人能接触到的，一年拿1亿到9亿元回家，产业至少得将近百亿元。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p244","index":244,"text":"包括像王健林这些人，也不可能每年分红直接拿回家。只能说股份、资产很高，但真敢稀释吗？也不一定。股东分红都往兜里揣吗？也不敢都揣。基本上你们能见到的绝大多数人。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p245","index":245,"text":"顶天了，净收入在1亿到9亿元，已经很厉害，产业基本得做到百亿元左右。在国内某个行业应该算老大。中国代工厂比较多，整个世界里面，有些代工厂、产业都能排前20。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p246","index":246,"text":"一般都是比较顶级的星君以上福报，或者初级真君以上福报，才有这样的福报。不是这个级别，很麻烦。他们下来也不可能把所有功德福报都带下来，带一部分能达到这程度，也就这水平。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p247","index":247,"text":"为什么这些人一定是这个级别、在天上有说道？他们干的事不是想干就能干，基本代表这个国家在某一个行业的代言人，属于天道在人间设立的某个行业、某个方向的代言人，带领这个国家的人类往某个方向走。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p248","index":248,"text":"这种人要承受极重的天道气运，代表天道在人间的一些规划。再往上，一年能拿10亿元以上的，在全球范围内某个行业都得算很厉害的老大。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p249","index":249,"text":"比如福耀玻璃，老大也不能说一年给自己分红10亿元，也不敢这么分红，已经很厉害了。相当于整个地球人类在某个行业全靠他领军。没有这种气运，不受天道加持，想玩多大，可能性不大，这才叫气运之子。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p250","index":250,"text":"一年能拿100亿元回家的，咱就不考虑了。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p251","index":251,"text":"行业使命与应运而生的说法","level":2,"key":false,"section":"ep7-p228"},{"id":"ep7-p252","index":252,"text":"马斯克估计都不见得拿100亿元回家，还不敢大量稀释自己的股份。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p253","index":253,"text":"像马斯克，不用说了。因为人类未来两条出路，一条是逆修觉者。我决定你死后能不能升级到更高位置。马斯克决定的是什么？万一人类活不过1000年，800年后完蛋了，他做的事情能够把一小部分人类带到火星，不让人类断绝，是人类气运。他这事情决定灭世的时候，整个人类能不能留下种子。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p254","index":254,"text":"能不能留下种子，是很重要的事情，所以他气势如虹，天道气运加持在这里。我们也是一样。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p255","index":255,"text":"比如曾经的马云，代表网购行业，他是老大。但把这个行业做完，就不代表这个行业，完成历史使命、天道使命了。剩下只要不嘚瑟，没什么太大事。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p256","index":256,"text":"要嘚瑟，老指点江山，估计还是有人收拾你。像刘强东，虽然也做网购，但解决快递速度，基本创造了人类最快的快递速度，这是他的功绩，很大，代表一个行业在人间落地。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p257","index":257,"text":"比如《推背图》第四十四象，叫“日月立天，群鹰慑服，百灵来朝，双语四足”。我问你，双语四足是什么？是一个生物。这句话很奇怪，前面正常，最后一句“双语四足”，前不搭村后不着地，怎么突然蹦出这么一句？这就叫寓言。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p258","index":258,"text":"寓言是什么？让不应该听懂的人瞎猜，让能听懂的人知道这人是谁。“双语四竹”是一个生物，如果本源是这个，一听就知道说谁；本源不是这个，听完也在瞎猜。我可没说是我，不许瞎猜。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p259","index":259,"text":"如果不是应运之人，听这些寓言故事全部是瞎猜，没有意义。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p260","index":260,"text":"这很重要。这个人传法，过程中想成圣，你觉得努力就完了吗？想都别想。能够成为改变众生、提高整个人类智慧和思维等级的人，如果不是应运而生，想都别想。","level":0,"key":false,"section":"ep7-p228"},{"id":"ep7-p261","index":261,"text":"九 财富成像与转命的例子","level":1,"key":false,"section":"ep7-p261"},{"id":"ep7-p262","index":262,"text":"鸟窝与四个金蛋","level":2,"key":false,"section":"ep7-p261"},{"id":"ep7-p263","index":263,"text":"讲了半天，讲的是什么？有没有干成这个事的气运。多少收入对应什么福报等级，要有什么气运。没有这气运，就别想，根本不可能。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p264","index":264,"text":"比如之前说，我的财富是鸟窝里面四个金蛋。也就是说，以后至少同时干四种收入，都能够挣钱，这是我要做的东西。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p265","index":265,"text":"但很可惜，只是一个鸟窝。人家厉害的，直接一大金元宝，或者金山，财富在法界成像是那样。咱就四个金蛋，还行，至少比鸡蛋大点，跟鹅蛋差不多，没有鸵鸟蛋大，但比鹌鹑蛋强多了，哈哈。都是蛋，大小不一样。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p266","index":266,"text":"转命与紫微中的条件","level":2,"key":false,"section":"ep7-p261"},{"id":"ep7-p267","index":267,"text":"有没有例外？原来没这个命，通过修行有了，也有，比如大家了解的袁了凡，这叫转命。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p268","index":268,"text":"之前用紫微比较少，八字里能不能看出转命，我不太清楚。但紫微里面比较容易看到，一个人有没有转命的可能。比如命宫有右弼、迁移宫有右弼、来因宫有右弼，都具备转命、改变命运的条件。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p269","index":269,"text":"没有，只能小步升级或者减少破坏。右弼这颗星在这三个宫位，至少有改命的可能性。但一定注意，右弼必须在水位或者木位，力量才大。在金位、火位，力量不大，只是小幅改变，不会改变多厉害。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p270","index":270,"text":"没有气运或者过运的人比较多，比如唐伯虎、李白、孔子。孔子一直想当官，谁都不要。还有苏轼，一直在被贬的过程中，比较郁闷。咱们绝大多数都是普通人。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p271","index":271,"text":"别说承载天地气运，有足够多福报，已经很不容易。所以做事之前，一定先看看法界有没有成像，有没有匹配的成功可能。没有就别太费劲，尤其已经走B运、C运的，很多事别多想、乱想。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p272","index":272,"text":"法界不能成像，就没有这个影像。想做上市公司，没有这个命，就别扯淡，别以为我命由我不由天，所有东西都是天定，别费劲。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p273","index":273,"text":"但如果是A运，建议先不要查，因为很可能做事就失败。比如我，2025年之前，做的所有事情基本都是为了打地基。要允许失败，不失败、不受挫，对未来成就是有问题的。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p274","index":274,"text":"称骨与人生起伏的讲述","level":2,"key":false,"section":"ep7-p261"},{"id":"ep7-p275","index":275,"text":"再多说点，可以看称骨算命。不要看前面那个东西，要看走运的部分。有很多三两多的，也有资产上亿元的，不要光看批文。之前说骨重越重，富贵、财气越好，但这不确定。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p276","index":276,"text":"比如说“好一个抓钱手”，有这句话，至少一个阶段财运还不错。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p277","index":277,"text":"之前一个山西朋友，忘了三两几，三两七还是三两几，有句“好一个抓钱手”。那小子挣钱速度还行，只不过后面气运败了，都被他败了，也就五年左右富贵运。虽然一些亲戚在政府或者企事业单位高层，但基本不管用，自己把福报败光了，很可惜。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p278","index":278,"text":"看这个有什么好处？知道两点。第一个，说低于六以下的人。你看我称骨算命是六两二，我上一个、以前老板是六两一，六两一明确是大富之命。","level":0,"key":false,"section":"ep7-p261"
