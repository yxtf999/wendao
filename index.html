},{"id":"ep7-p279","index":279,"text":"六两二是什么？属于清流，说什么“锦鱼一时”，不是，你要看后面的解释，一看就是前面没什么戏，越往后越好。比如我50多岁“天赐麒麟送老”，至少说子女运不错。六两二先别关心多富，至少人生前面狗屎，后面越走越行。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p280","index":280,"text":"但低于六两的，如果已经过了40岁、45岁或者50岁，基本后面没什么运，大概这样。比如四两九，我经常拿它说，因为很有意思，是M型的运。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p281","index":281,"text":"前段时间给一个学生看紫微，他也是四两九，发现真的就是。两个运中间，30多岁到40多岁被砸下去了。四两九的人生M型，有两个波峰、一个谷底，会出现这情况，很有意思。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p282","index":282,"text":"大概看看就知道。如果没有上六两，一定记住，45岁或50岁以后少嘚瑟，基本没什么用。四两九要注意M型，第一个成就之后赶紧把钱搂兜里，别拿出去。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p283","index":283,"text":"像历史上越王勾践，还有史玉柱、乔布斯，都是典型的四两九、M型人生。还有明朝土木堡之变那个皇帝，“大明战神”，也是典型M型。之前当皇帝，之后当俘虏，回去又当皇帝，我觉得太神奇，谁也算不到，太厉害了。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p284","index":284,"text":"有时大概看一下命运格局就行。有的人虽然一定会有奇迹发生，但不一定所有人。","level":0,"key":false,"section":"ep7-p261"},{"id":"ep7-p285","index":285,"text":"十 机缘的总结与后续课程","level":1,"key":false,"section":"ep7-p285"},{"id":"ep7-p286","index":286,"text":"总之，不是所有事情都值得做。这类机缘不是看有没有努力，而是这件事在法界上有没有被打开，有没有成功可能，有没有值得投入的口子。没有机缘，硬做就属于消耗。","level":0,"key":false,"section":"ep7-p285"},{"id":"ep7-p287","index":287,"text":"有机缘，再考虑后面的分析、学习、研究、资源、方式方法、执行，才有可能做起来。前面的东西没有，肯定不行。所以遇到事，先看有没有机会，真的有没有成事的可能。","level":0,"key":false,"section":"ep7-p285"},{"id":"ep7-p288","index":288,"text":"机缘不只是气运，而是有没有真相的入口和成事的入口。","level":0,"key":true,"section":"ep7-p285"},{"id":"ep7-p289","index":289,"text":"本来还想多讲点，这个贵人都没讲完。今天先这样，周一晚上再嘚瑟。","level":0,"key":false,"section":"ep7-p285"},{"id":"ep7-p290","index":290,"text":"周二、周三，我看看智慧有没有总结好。这个基本都总结好了，不用再看，周一直接上来讲就完了。智慧这几天可能要捋一下，捋完，讲完这个之后就讲智慧。","level":0,"key":false,"section":"ep7-p285"},{"id":"ep7-p291","index":291,"text":"今天又白活太多，瞎白活一堆，被你们打乱了。坏事的都是你们，没事老想知道神奇的东西。还有想知道鸿钧老祖的，这不能跟你们说太多，是法界天机时讲的事。","level":0,"key":false,"section":"ep7-p285"},{"id":"ep7-p292","index":292,"text":"好，今天就到这里，大家再见。","level":0,"key":false,"section":"ep7-p285"}]},{"id":"ep8","number":8,"name":"问道八","title":"意义思维：重新看懂成功与失败","speaker":"悟聊天尊","source":"20261005_问道8_意义思维_重新看懂成功与失败_整理稿.docx","date":"2026-10-05","description":"接续成事条件，讨论贵人、天赋、福报、环境、意外与兜底。","blocks":[{"id":"ep8-p28","index":28,"text":"一 开场与本课安排","level":1,"key":false,"section":"ep8-p28"},{"id":"ep8-p29","index":29,"text":"大家晚上好。我这抓紧时间往外输出，希望能给大家带来不一样的东西。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p30","index":30,"text":"什么，最近吃胖了？明天去买个减肥药去，叫什么司美格鲁肽，对吧？好像是类似的东西，要打一下。这两天有点压不住食欲了。声音小吗？大家看看。吃嘛嘛香，也是上岁数了，做点大礼拜，腰酸背痛屁股疼。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p31","index":31,"text":"好，八点了，咱们不耽误大家时间。本来今天还是想继续讲成事、人类犯错误的一些条件。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p32","index":32,"text":"自己总结好了文章，从家出来的时候忘了发到本上。还好本上有一些之前写的东西。今天肯定也讲不完，基本上可以把成事有关法界的那部分讲完，我估计没问题。明天晚上讲成事的人间那部分，它也是很重要的一部分，东西还挺多。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p33","index":33,"text":"但我不会讲太细，因为人类本身已经总结得很不错了，我就告诉大家哪些方向一定要注意。成事本身是一个非常大的工程，不可能一两集讲完，所以大概给大家列个方向。涉及法界的东西，咱轻车熟路，就多讲讲；涉及人间的，留到明天晚上。本来想今天一起讲，估计讲不完，而且稿子忘了放到我的 iPad 里，明天继续。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p34","index":34,"text":"周三记住，是大课，正式开始讲智慧，讲完智慧再讲修行。智慧和修行都是大课。讲完意义法则之后，知识分类、成事分类，属于花絮，或者说知识拓展，不算大课之一。结果一个拓展讲了三次，你这玩意闹的。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p35","index":35,"text":"好，咱们开始。昨天讲到哪儿都忘了，好像讲的是机缘。今天开始讲第二，贵人。","level":0,"key":false,"section":"ep8-p28"},{"id":"ep8-p36","index":36,"text":"二 贵人与破圈的机会","level":1,"key":false,"section":"ep8-p36"},{"id":"ep8-p37","index":37,"text":"贵人怎样在关键节点拉你一把","level":2,"key":false,"section":"ep8-p36"},{"id":"ep8-p38","index":38,"text":"贵人是什么？可以在关键时刻提携你、引导你、点醒你、拉你一把的人。有时候生命中还会出现非常神奇的贵人，比如一些奇人异事，或者你怎么都想不到，还会以这种方式帮你。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p39","index":39,"text":"现在马来西亚有一个美女，她就发现，曾经的暗卫也变成了她的贵人。很奇怪，正常情况下你不接触这个暗卫，不知道人和人之间的关系还能这样。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p40","index":40,"text":"接触之后，有些之前不敢想的事情，就可以想到、可以去做了。没有这种人存在，你还做不到。只能说天下之大，无奇不有。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p41","index":41,"text":"之前类似死士营那种。咱们有些学生，比较往前的前世位高权重，有自己的暗卫和死士营，坚决执行主人的命令。你会发现，这个人一见到咱们学生，就言听计从，基本没有反抗的思维。两个灵魂碰到了，就勾起曾经的前世记忆，很神奇。是谁可不能说。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p42","index":42,"text":"再继续说，贵人可不是普通人脉。普通人脉只是认识，贵人是真的能帮你打开一扇门，少走弯路，看清规则，避开大坑。很多人不是没努力，也不是没能力，而是没人点他、带他，没人把关键的门打开，所以今生无缘。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p43","index":43,"text":"你越干大的项目、大的事业，越会发现：不知道从哪个犄角旮旯蹦出这么个人，结果他就能把这事解决了，很厉害。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p44","index":44,"text":"我们经常碰到的问题，之前已经说了，人类本身活在思维茧房里，也活在状态茧房里。你是什么级别的人，就会碰到什么样的问题。想用现有资源破圈，很难。你看，有很多这样的死循环。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p45","index":45,"text":"换房与资金的循环","level":2,"key":false,"section":"ep8-p36"},{"id":"ep8-p46","index":46,"text":"比如你想提升财运，但发现住的房子风水不行，财气不足，就想换个有财气的好房子。有没有？有。关键是你有钱换吗？这不就变成一个死局了吗？","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p47","index":47,"text":"因为住的房子不行，才没钱；想换个有财气的房子，又需要先有钱，这不就成死结了吗？很难突破。那就剩几个方法，第一，慢慢积累。比如这个房子值一百万。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p48","index":48,"text":"我一个月挣一万块钱，就啃馒头，十年怎么着能挣到这钱了吧？能挣到，但是等你钱够的时候，房子升值了，或者早被别人买走了。好房子不等人，你看着好风水的，得想办法直接拿下。要不然，就只能铤而走险，做一些有危险、有风险的事情。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p49","index":49,"text":"那也能破圈，但代价很大，后患无穷。说不定做完大概率得出事，就算成功了，也有很多后患。大家都明白，你可以看看刑法里的那些方式，都是来钱速度比较快的方式。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p50","index":50,"text":"这个时候，假设有个贵人说：“小李，没事，哥借你钱。房子不是一百万吗？先借给你一百万，你以后慢慢还，先把这风水弄上去。”这个就是帮你破圈的人。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p51","index":51,"text":"住到好的房子里，挣钱速度从一个月一万变成三万，可能三四年，这一百万就还清了。但不住这个房子，你就发现想挣这钱挣不到。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p52","index":52,"text":"想通过积累的方式弄，可能又跟你没什么关系。请大家记住，无论思维、财运，还是境遇，都会出现这种情况。需要一个更高级的贵人，拉你一把，点你一下，或者抬你一下，这关就过去了。过去以后，到了另外一个阶层。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p53","index":53,"text":"他不仅把你抬上去，而且给了你一个很重要的机会。没有他，你抓不住这个机会，凭自己积累也抓不住，所以很重要。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p54","index":54,"text":"贵人的主要作用，就是帮你看见真相、理解规则、避开错路、少走弯路，进入正确的门，接触更高级的信息，在关键节点拉你一把。贵人还不是下面最主要的事，咱们先说这些。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p55","index":55,"text":"比如刘强东，想发展没钱，没钱就发展不了，卡在那个坎上。这是一个循环，想从这个循环到上一个循环，需要有人撑一下。你看他头上有一撮白头发，那就是急的。一夜白发这个东西真能出现，在他的认知范围里已经没有招，找谁都不好使了。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p56","index":56,"text":"后来有贵人真帮了一把，直接跨过那个圈，整个事情就能转起来。绝大多数人没办法升级，还在原来的圈子里，就是没有这样的贵人拉你，指着自己弄，过不去。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p57","index":57,"text":"让他找找客服。好，贵人还能帮你判断什么该做、什么不该做，打开你连想都不敢想，也不可能得到的思路或者资源。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p58","index":58,"text":"高贵 平贵与低贵","level":2,"key":false,"section":"ep8-p36"},{"id":"ep8-p59","index":59,"text":"下面主要说贵人的种类。第一个，比你高等级的，称为高贵；第二个，跟你同级的，叫平贵；第三个，比你低一些的，叫低贵。这三个都很重要。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p60","index":60,"text":"高贵容易理解，人家在认知、能力、水平上非常厉害，点你一下，大家就能明白，这个不用太多解释。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p61","index":61,"text":"平贵是跟你同级别的，同行是冤家。按紫微来说，属于兄弟宫，同种属性的，竞争关系会严重一些。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p62","index":62,"text":"比如我跟马云比，跟刘强东比，不用比，人家肯定比我强。我压根不会因为这件事有什么心理负担。但是跟我一块的同学、家里的亲戚朋友，但凡比我高了，心里就难受：“他也有这一天？凭什么？”平贵特别难处理。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p63","index":63,"text":"低贵是帮助你的一些人，比如你当老板，能碰到几个非常得力的员工，很重要。像马云要解决网络安全的问题。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p64","index":64,"text":"招聘时就能碰到一个大神去他们公司应聘。为了验证水平，人家能把现场办公的 Wi-Fi 弄瘫，这就是水平。在你很低的时候，就能碰到很有能力的人，正好在身边，这叫低贵。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p65","index":65,"text":"低贵非常重要。还有一种叫桥贵，不过低贵再说一下。我们干这行，大家都知道，要烧纸，量非常大。老天想帮你的时候，可能会用一种很奇怪的方式帮你。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p66","index":66,"text":"当时量少，都去白云观烧。认识一个大哥，应该叫大叔了，我管他叫大叔。据说从一九七八年就在白云观负责烧纸，在外面卖纸、卖桶，干这个事。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p67","index":67,"text":"我去的时候，据说至少干了四十多年，当地的警察、城管，他都门儿清、门儿熟。人家一看是他，搭理都不搭理。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p68","index":68,"text":"我二〇一八年开始从事这些事情，正赶上严打。到了二〇一九年，白云观门口不能烧了，给我气的：“人家干了四十年都没事，凭什么我过去就不让烧？”很挫火。那时候还没觉得应该干多大，这条道走不通，就郁闷，觉得天绝了。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p69","index":69,"text":"后来在旁边瞎溜达，在菜市场发现一家卖这个的，一联系，还挺热情。结果这家后来发展到，我估计曾经在中国范围内，应该算烧纸行业做得最大的。没想到。他说自己也是试着租个摊位，就租了三个月，结果碰到我了。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p70","index":70,"text":"我就觉得，甭管什么原因，老天让你专门找到这样的人，他能帮你解决问题。没想到现在这哥们国内业务不做了，因为污染这些事情比较麻烦，一直跟到泰国、马来西亚，专门从事烧纸一条龙服务。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p71","index":71,"text":"这叫低贵，是支撑你的一个很重要的柱子。现在烧元宝，这么大一塑料袋，一千个金元宝。我们一烧三五百万，就是三五千袋。一般的火场，我跟你说，就现在这个屋子，摞满了都放不下。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p72","index":72,"text":"上次给你们看的视频，鬼节那次，四辆卡车拉元宝，拉了两趟吧？烧纸的应该能看到，非常壮观。没有足够的场地，没有当地关系，根本别想干。这叫低贵，是支撑你的。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p73","index":73,"text":"我们师门也有几个很好的学生，业务很厉害，也是我的低贵。还有很好的行政、财务，都很厉害。到海外以后，有些朋友告诉你怎么收现金，海外税务、工商的流程，人家都很清楚，也帮了很大的忙。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p74","index":74,"text":"桥贵与分离时的善缘","level":2,"key":false,"section":"ep8-p36"},{"id":"ep8-p75","index":75,"text":"还有一个很重要的，叫桥贵。什么叫桥贵？一条河拦住你，过不去，必须过这座桥。但这个桥在整个路程里，只算一难、一个节点。过去以后，可能再也没关系，可是不找他，这事就过不去。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p76","index":76,"text":"很多人对桥贵理解不到位。未来讲因果，有一个重要法则叫镜面法则。你不认可桥贵对你一生的贡献。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p77","index":77,"text":"以后再轮回，碰到坎过不去，你就别哭。有些事情，人家替你说一句话、递一个眼神、扫清一件事，或者劝了谁一句，事情就过去了。如果不过去，这个劫难未必能走得通。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p78","index":78,"text":"包括小学老师。我们一般特别感激大学、硕士、博士的导师，但小学老师有时也非常重要。没有他的栽培，往上走不了，走不到那个高度，这也是桥贵。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p79","index":79,"text":"再下面一个规则：跟谁都有一定缘分。你现在碰到的人，跟你能有一到两年的缘分，就是普通缘分；三到五年，就算不错了。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p80","index":80,"text":"能达到十年，已经很稀少了；二十年、三十年，甚至一生，很难。之前说过，比如你在天界跟众生有几百万年的好缘分，这一生就容易处成一生的朋友。记住，几百万年。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p81","index":81,"text":"如果只是几万年的缘分，我想想，应该除以一万倍吧，这是天界往人间转的缘分，大概是这样。所以我们必将面临一个问题，叫分离。分离，是人生碰到的各种缘分里经常要面对的事。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p82","index":82,"text":"修行一辈子，修的是什么？众生善缘很重要。别一次次轮回，善缘越来越少，未来就活不下去了。如果每一次修行，虽然都遇到分离，但至少没有闹掰。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p83","index":83,"text":"分离时很容易不愉快，一定要放下利益。利益对你来说不重要，更多的是众生善缘，轮回里早晚还要见面。所以众生善缘比当下利益重要得多，把这几个东西记住就行。","level":0,"key":false,"section":"ep8-p36"},{"id":"ep8-p84","index":84,"text":"三 天赋与优势的区别","level":1,"key":false,"section":"ep8-p84"},{"id":"ep8-p85","index":85,"text":"什么程度才叫天赋","level":2,"key":false,"section":"ep8-p84"},{"id":"ep8-p86","index":86,"text":"第三个讲天赋。人欲成大事，一定要拥有天赋。天赋不是普通优势，也不是比别人强一点点，而是一个人在某一项，或者极少数人在几项能力上，天然远远超出绝大多数人的现象。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p87","index":87,"text":"首先一定是绝对少数，不可能每个人都有，每个人都有就不叫天赋。第二，在人类某些能力上，应该达到数一数二的原则。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p88","index":88,"text":"做大事需要天赋，普通人能有优势就算不错。下面讲什么是天赋、什么是优势，给大家一些比较和数据，就清楚了。如果想创业，想干到资产上亿，你要有超越很多众生的、很大的优势，但这还不算天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p89","index":89,"text":"第二，你得有气运。比较大的优势和气运加在一起，至少能干成一个事。但如果要成为整个人类某个行业的领袖，或者必须通过你的努力，才能改变整个人类的现状，优势就不好使了，需要天赋，非天赋不能成。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p90","index":90,"text":"拿学习来说，学得比别人快，叫天赋吗？不叫，只能算优势。对国内的学生、观众来说，你家孩子如果连九八五、二一一都考不上，至少在学习上，我说连优势都算不上。能考个一本，算比别人学得稍微好一点。至少裸考九八五、二一一，才叫有一些学习优势。就算考上清华北大，也只是优势比较大一些。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p91","index":91,"text":"说起来确实很扎心。可能到十二月份，我这段时间一直突击直播，到一定程度要转录播。那时还会有直播，一周一次，再讲《真相》。其中要涉及人类金字塔：什么样的人才算金字塔尖的人？要活得清清楚楚，知道在跟什么样的人竞争。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p92","index":92,"text":"为什么你是穷人？为什么怎么做都做不起来？你就是金字塔底的一个基石，就别提塔尖的事。我跟你说一些指标，看看人家能达到的，你能不能达到。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p93","index":93,"text":"为什么要了解这些？得清清楚楚知道自己活在哪个位置，自知者明。像韦神，算天赋。普通清华北大的，只能算优势大一些。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p94","index":94,"text":"我记得抖音上有个讲语文的北大哥们说过一句话：“都考到北大，六百八十分进的和七百分进的，性质完全不一样。”七百分以上进的，那叫天才、天赋；六百八十分，可以通过优势和努力堆积出来，跟天赋不是一个级别。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p95","index":95,"text":"比如同一张考卷，得九十九分和得一百分，有明显差距。得九十九分，你的水平就是九十九分；得一百分，只能说这张卷子摸不出你到底有多高，所以有区分。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p96","index":96,"text":"清华北大学习上能堪称天赋的，我说就是七百分以上这帮人，还有能进清华姚班的。比如进哈佛、麻省理工这些热门专业，能拿到博士，或者做到博士后，这些人一般得有点天赋。所以为什么出来年薪很高？","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p97","index":97,"text":"为什么你就很费劲？最近我刷抖音，刷到 UCL，还有前段时间帝国理工的数学专业，刷下来的人一片一片。你费劲努力，好不容易到了那个点，上了帝国理工，那个专业就不是给普通人设的，一个普通人去学，根本学不动。至少学习上是这样。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p98","index":98,"text":"开创体系与不同层次的天赋","level":2,"key":false,"section":"ep8-p84"},{"id":"ep8-p99","index":99,"text":"历史上哪些人有天赋？高斯、牛顿、爱因斯坦，这是天赋；佛祖、老子，这是天赋；龙树，辩才第一，这是天赋；六祖慧能不识字，听一句《金刚经》悟了，这叫天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p100","index":100,"text":"很多普通事情不需要很强的天赋，靠努力、时间、纪律、稳定、经验也能完成。但是想推动人类社会的文明、规则、思想、整个体系往前走，做开创性的东西，建立一套新体系，需要天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p101","index":101,"text":"像霍金也是。我忘了，好像是上牛津大学吧？别人已经学得不行了，他一周可能就上几天课，还能拿满分，这叫天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p102","index":102,"text":"天赋还分不同等级。有的连学都不用学，比如经常说的纯种天巫血脉。这谁啊，没事说什么嫪毐？哈哈，那当然也算有天赋，但不是我们推崇的。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p103","index":103,"text":"纯种天巫血脉，直接能跟天地沟通，都不用学习。有一个重要特点，他的魂一定是分裂状态的。比如一边听电话，一边看电视，旁边还有人说话，三个人同时说，不影响他回答。魂可以分成一个看电视，一个听旁边人说话，一个听电话，没有问题。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p104","index":104,"text":"脑子快的，我记得像克林顿，也能一边下国际象棋，一边看电视，一边跟希拉里通电话。他是脑子快，切换速度快，属于假多线程，天巫血脉是真的多线程，不一样。没有分魂状态，就不能说自己是纯种天巫血脉。沟通天地非常容易。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p105","index":105,"text":"第二种天赋，简单看看就行，像六祖这样的人。虽然老说“本来无一物”这个事，但必须承认，六祖的天赋确实逆天，根本不是普通人能行的。看一下就明白，这就叫天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p106","index":106,"text":"再下一层，像我这种比较水的，多少也算有点天赋。比如玩“紫占”，也能琢磨出一套全新的体系，还帮你把紫微重新定位一下，这也算。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p107","index":107,"text":"我研究天道，那就是纯天赋，但也得憋点时间。每天早上起来望着天想，今天想什么问题？想着想着，可能想明白。我比较懒，想不明白就刷视频，刷着刷着，过两天不定因为什么事，就想明白了。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p108","index":108,"text":"所以我估计，想不明白时，就告诉我的大号：“赶紧帮我想问题，我想不出来，你自己想吧，想好了告诉我。”可能晚上一般一点到三点传东西，传完以后，第二天不定因为什么事，突然一想：“我为什么不这么说？”就这样，也算有点天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p109","index":109,"text":"不管怎么说，有天赋的人，能在很短时间里走出别人根本走不出来的路，后期也很难有人超越。这就是天赋。但天赋里面还有很苦的天赋，比如我这种。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p110","index":110,"text":"天赋的觉醒条件与个人经历","level":2,"key":false,"section":"ep8-p84"},{"id":"ep8-p111","index":111,"text":"传法、传天道的天赋，属于苦逼型天赋。那天还跟观音聊，我说这天赋太苦了。人类社会不发展到一定程度，把你扔下来压根没用。因为要把天道和人间的东西结合起来，人类自己的知识体系没发展到一定程度，做不到。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p112","index":112,"text":"比如老子、佛祖那个时期，把你扔下来有什么用？不好使。所以我这天赋可能一直都有，但是至少在人间这一百世，前面都没打开。之前属于纯混，做个算命师，去宫殿里当高官，在某个地区当土皇帝，或者法师、将军。当然也有当纨绔子弟、被人追得到处逃命的时候。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p113","index":113,"text":"需要人类社会发展到一定程度，通过这些东西，我才能看明白一些事情。包括没有到网络时代，很难激发这种天赋，也很难做到，很麻烦。而且这种天赋，注定不能出生在大富之家，做富二代的梦想不可能，每次都得出生在苦哈哈的人家。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p114","index":114,"text":"得从社会最底层一点点爬起来，所以前四十年很可能过得很苦。我当将军那次，弄不好不是明朝就是宋朝。当时是一个将领，忽悠元帅：“咱们这么打吧。”元帅听了意见，打赢是打赢了，但是违背朝廷，把我们抓起来，以反叛的罪名砍头。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p115","index":115,"text":"所以为什么我脖子第六节、第七节出问题？有砍头经历，就容易有颈椎病，刀从这个位置下去。好，这个不多说。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p116","index":116,"text":"像我的天赋就费劲。人类不发展到一定程度，你不经历很多苦难，很难真正理解世界，对世界的看法很难圆满，因为不知道普通老百姓怎么想，没有经历过。如果想传法，就不能进太好的家庭，太好的家庭会让理解世界有所残缺。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p117","index":117,"text":"我还跟观音聊：“还不如给个厨子的天赋，包子做得好吃点，至少前期能挣点钱。”当年什么天赋都没有，就是普通人，挣点钱多费劲。不行，把算命的天赋提前打开也行，或者做包子的天赋，至少还能活嘛，啥都没有咋弄？“星空包子铺”，听着挺好。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p118","index":118,"text":"不同天赋，觉醒时间、觉醒条件不一样。有的确实能做很伟大的事，可是前期条件太苦，还不如开包子铺，弄个厨子天赋。好，开个玩笑。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p119","index":119,"text":"天赋也很难传下去。高斯、爱因斯坦、霍金，都没把天赋传给后代。说深一点，很多天赋是轮回第一世就给你的东西。整个众生轮回，实际上是一部棋局。天道就那么多天赋，怎么可能平均分配？会分配在一些重要的、最开始出生的众生身上。所以越是之前出生的众生，越有天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p120","index":120,"text":"你看海外一些讲政经的大 V，讲经济、人情世故、国情，人家有很强的天赋。不然怎么在行业里获得这么高的地位？听一听、看一看，马上知道经济怎么玩，脑子就在这儿。你看半天也没算明白。所以普通众生就不要再去努力这个天赋了，没有天赋，就好好做个普通人。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p121","index":121,"text":"好好学会抱大腿，这才重要，别自己啥都没有，还往上冲。这世界奖励的是数一数二，自己做不到，就别在那费劲。像我，也不可能每一世轮回都有天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p122","index":122,"text":"以后讲法界天机再说，有个背包原则。说白了，每次下来执行某个任务，允许选十样东西，背包空间就那么多。选不同东西，或者给你不同东西，能发挥的就不一样，一定要注意。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p123","index":123,"text":"课堂玩笑与父子的不同方向","level":2,"key":false,"section":"ep8-p84"},{"id":"ep8-p124","index":124,"text":"自己看看有没有天赋，也比较简单。说一些曾经在佛界的事情。比如找个小美女唠唠嗑，这不违规。一个仙子走过来，你说：“仙子早上好，小生有疑问，想请教仙子。”她问什么问题，你说：“八加五乘三除四加五，到底是多少？”哈哈，看看她的反应。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p125","index":125,"text":"如果一下就说出答案，可能是天巫系。她没算，是靠直觉摸出来的，就别忽悠人家，说“小生拜服”，赶紧放人。这是灵感系的，灵感系女生别碰，忽悠不了。如果啪啪一算，马上算出来。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p126","index":126,"text":"那肯定是文殊那边的，脑子好使，忽悠不了，也不行。如果没算，开始柳眉倒竖，一看就是执法堂的。你要扛揍就忽悠，不扛揍就躲远点。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p127","index":127,"text":"碰到那种听完眼神发呆，开始想，五秒钟想不明白的，就是你了，今天忽悠你。这一测试就没天赋。尤其下位面的佛界，心性纯良，赶上我们第十山海的人过去，不把你忽悠瘸了？哈哈。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p128","index":128,"text":"好，自己也可以看有没有天赋。一定是在某方面超出众生非常多，才叫天赋。有点说多了，不能再说下去了。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p129","index":129,"text":"比如我的天赋想传给儿子，也挺难，他基本不是。之前挺郁闷，后来觉得也对。我最重要的是把一套规则带到人间；儿子要做的，是把它发扬光大。发扬光大，应该是他的天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p130","index":130,"text":"无中生有应该是我的天赋，为什么一定要儿子继承？他再去无中生有什么？更多应该发扬光大。利用在天界或者佛界比较好的人脉，让更多人愿意支持，这是他应该做的，不是我应该做的。很多老子总希望儿子接班，其实未必。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p131","index":131,"text":"选对方向与长期试错","level":2,"key":false,"section":"ep8-p84"},{"id":"ep8-p132","index":132,"text":"每个人有自己的天赋、能力和优势，一定选对。优势可以下传，但概率也不大；天赋几乎不容易传下去，有就有，没有就没有。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p133","index":133,"text":"没有天赋，又想做高端的事，基本就出问题了。不要把兴趣当成天赋，不要把短期优势、普通资质当成天赋，不要在错误赛道长期消耗自己。明明天赋在 A 方向，非要做 B，也别干。对天赋判断错误，导致路线选择错误，很愚蠢。想做开创的事，却没有相应超常能力支撑，也容易出问题。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p134","index":134,"text":"最核心的，天赋不是比别人强一点点，而是某项能力远远超出绝大多数人。总之，要做自己有天赋、有兴趣、爱好的事情。做起来比较容易得到正反馈，人是正反馈的动物；升级也容易快，因为这是你的优势。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p135","index":135,"text":"第三，就算有负面的东西，因为喜欢、爱好，也不容易把它当成阻力。就像当年研究占筮，至少一万到十万卦，属于无效看卦。各种事情都占，占不对的比较多，要一点点试错。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p136","index":136,"text":"穷举和试错绝对不舒服。长达十年，几乎没什么正反馈，凭什么支持下去？就是爱好，真喜欢。所以这个东西，就叫天赋。","level":0,"key":false,"section":"ep8-p84"},{"id":"ep8-p137","index":137,"text":"四 福报与承载能力","level":1,"key":false,"section":"ep8-p137"},{"id":"ep8-p138","index":138,"text":"门当户对与同频共振","level":2,"key":false,"section":"ep8-p137"},{"id":"ep8-p139","index":139,"text":"第四个，福报。说白了，有多大福报，做多大事。上次讲机缘已经说了一些，就不说太多。但要记住，有什么样的福气，承载什么样的气运。没那么大福报，就别扯那事，不是你能干的。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p140","index":140,"text":"福报有两个东西。一个叫门当户对，有一个亿的福报，就干一个亿的事；只有一个包子店的福报，就干包子店。多开第二家，你都撑不住，撑不住容易败。包括福报大的，娶的老婆都长得好看。你换三五万的比亚迪，和弄一辆迈巴赫。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p141","index":141,"text":"需要的福报等级肯定不一样。买上海江景大平层，五百平方米，和住五十平方米的鸽子窝，福报也不一样。这叫门当户对，有等级。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p142","index":142,"text":"第二，福报还有同频共振。并不只是得到，更重要的是能托住现在的事情。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p143","index":143,"text":"没有福报，很多资源进不来，机会接不住，贵人遇不到，财富得不到，位置坐不上去。之前哪一年，我忘了，有个小女孩，说六月份好像能碰到比较好的对象，结果没碰到。仙家一查，说福报下降了，问她干什么了，她说没干什么。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p144","index":144,"text":"那时候仙家还比较爱说话，直接说：“自己想想干了什么不该干的事。去酒吧找一夜情，以为完了就完了？没弄点病就算不错，但扣福报肯定扣得很狠。”一定注意，邪淫扣福报比较快。福报等级低下去，相应的同频共振就振不出来了。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p145","index":145,"text":"消耗福报与错过后续节点","level":2,"key":false,"section":"ep8-p137"},{"id":"ep8-p146","index":146,"text":"第二，福报不要被消耗掉。很多大老板为什么中间出问题？挣钱以后乱嘚瑟，消耗福报很大，有些局就赶不上了。正常可以走十年，可能三四年就走不动。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p147","index":147,"text":"比如去年，被我媳妇忽悠，费点事发功，给几个学生弄了一下脉轮，就那一天损失百分之二十的福报。为什么仙家都急了？因为损失这些，很多节点就不容易赶到。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p148","index":148,"text":"还好只损失百分之二十，如果损失到只剩百分之六十，就不用努力，直接散掉，因为后面的东西肯定接不上。每次往下走，比如半年或者一年之后，有下一个机缘。要拿到，就得有相匹配的福报，叫同频共振点，达到那个位置才行。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p149","index":149,"text":"假如下一次机缘在一年后，正好能把这百分之二十填上，虽然辛苦，至少还能拿到。但如果只剩百分之六十，努力一年也拉不出这么多福报，到同频共振时就拿不到机缘。再下一个机缘，又要更高福报，就完了。一个正在上升的企业，一定注意不要消耗这些东西。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p150","index":150,"text":"找女朋友可以，但每一个都是以谈婚论嫁为主，真不合适，分手后再找另一个，没什么事，不算邪淫。同时交往几个，就有问题。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p151","index":151,"text":"原来有福报，自己一嘚瑟，被消耗了，就容易财富托不住、位置托不住、事业托不住、资源和关系托不住，做着做着局面崩掉。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p152","index":152,"text":"我在二〇一一年体验过一次。福报刚被扣时，前三个月没感觉，三个月后发现很多机缘跟你没关系，自然消失了，再想就起不来了。二〇一一年还能挣点钱，二〇一二年完全不行，果真没福气。体验过一次就知道。所以福报决定能不能得到，更决定能不能托住、接住、守住。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p153","index":153,"text":"有缘分却托不住的虚运","level":2,"key":false,"section":"ep8-p137"},{"id":"ep8-p154","index":154,"text":"有些人每次都能碰到一些东西。比如百度的李彦宏，我说就是典型的福报不足。老天只给了一次，后面肯定有嘚瑟的事，百分之百。百度是个很神奇的企业，次次踩点准，最后次次又没什么关系。做打车、外卖、地图，发展着发展着，好像就没什么人用了。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p155","index":155,"text":"这叫虚运，事情跟你有缘分，但是福报托不住。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p156","index":156,"text":"表现形式各种各样，比如资金、管理、人脉出了问题。很多人每次招标都能叫上，可是拿不下来；或者拿下来，总被别人啃掉一块，这叫虚运，不容易把事做成。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p157","index":157,"text":"我之前认识一大姐，是典型的虚运。为人、做关系都很厉害，可是每次拿完的东西，最后都跟她没关系。好不容易拿下来，干着干着就没关系了。本来能挣一百万，最后挣十万就不错。这叫缘分很好，但是福报不足。","level":0,"key":false,"section":"ep8-p137"},{"id":"ep8-p158","index":158,"text":"五 因果业力与阴债","level":1,"key":false,"section":"ep8-p158"},{"id":"ep8-p159","index":159,"text":"规则作用与具体债主的区别","level":2,"key":false,"section":"ep8-p158"},{"id":"ep8-p160","index":160,"text":"第五，因果业力与阴债，放在一起讲，但必须分清。因果很简单，曾经做好事，天道返一个好事；做坏事，返一个坏事。就像镜面法则，弄了什么东西，就有相应的东西找你。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p161","index":161,"text":"之前有个台湾学生，说：“我没招这个女的，这个女鬼老折腾我干嘛？”查因果，他俩不是债主关系，叫外道关系。为什么有外道关系？想想到底触犯什么规则。以后学完天道法则，一定要学会。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p162","index":162,"text":"从事情分析自己触犯哪条天道法则。不能用天道思维理解生命中的事，就算白跟我学了。这叫什么？伤及无辜。这小子之前肯定做过伤及无辜的事，所以别人无缘无故伤害你，也别哭。这叫因果业力。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p163","index":163,"text":"之前查得最多的是学生。典型的，曾经在古代当官员，为难过考生。这孩子平时学习没问题，一考试就出事，尤其重大考试，一定发挥不好。曾经阻碍别人的仕途，就要承担相应的事情。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p164","index":164,"text":"没有什么东西来找麻烦，没有债主。债主一定是具体的、对你产生仇恨的生物来找麻烦；因果业力不见得是债主，有时就是天道规则、天道惩罚。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p165","index":165,"text":"之前讲过一个天罚，叫“天地灾杀报”。那个哥们以前当王爷，经常拿国家政策坑害老百姓。今生是我认识的一位大哥，我亲眼看过。水平不错，为人好，做关系一把好手，饭圈、酒场上很厉害，很多大哥真愿意帮他。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p166","index":166,"text":"结果刚要帮，或者他已经投资很多事情，国家改政策，之前努力全废。不会是哪个债主能让国家改政策，那得多大力量？所以叫“天地灾杀”。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p167","index":167,"text":"我真看过两次。一次是禁酒令，布局几年，各方面没问题，马上等富贵，禁酒令一下来就废了。后来还有什么事，我忘了，也是这样。一辈子就那么几次机会，两次重大事情隔十年各来一次，人基本就废了。这叫“天地灾杀报”，没办法。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p168","index":168,"text":"再回顾前面，因果业力要注意，之前有没有干坏事？有，就会返一个相应的东西。比如拿刀把人捅了，至少有三种东西要承担，可能更多。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p169","index":169,"text":"伤害行为带来的三种影响","level":2,"key":false,"section":"ep8-p158"},{"id":"ep8-p170","index":170,"text":"第一，因为什么杀这个人？因财、因色、因怨，像镜面法则一样存到天道上，不定哪一世返到身上。什么时候不一定，但一定返，百分之百。这叫镜面法则。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p171","index":171,"text":"第二，把人杀了，只杀了一个壳。他有灵魂，还会轮回，记着这事，这叫冤亲债主。如果他投胎了，碰到叫小人；没投胎，碰到叫阴债。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p172","index":172,"text":"第三，杀了以后，他肯定有怨念，恨你、骂你，怨念粘在身上。他的家人也会恨、怨，诅咒你的家族，这叫众生怨念。至少三个东西产生影响，所以看看到底值不值。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p173","index":173,"text":"坏人前程、婚姻、事业、钱财，都容易出问题。有时福报够，机缘有，天赋不错，可是一上去就被阻碍，这属于因果业力。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p174","index":174,"text":"债主又不一样，是“我曾经就恨你，你想把这事做成功，不可能，我就折腾你”。他折腾你，看能不能扛得住，或者找法师处理一下，可能能够圆满，人家不找麻烦了。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p175","index":175,"text":"但我见过一种债主，先想办法让你成功，等你把一切都压进去，最后再让你痛哭流涕。有直接阻碍事业的，有间接阻碍的，还有先帮你、后阴你的，这就是债主。","level":0,"key":false,"section":"ep8-p158"},{"id":"ep8-p176","index":176,"text":"六 高维对抗与环境","level":1,"key":false,"section":"ep8-p176"},{"id":"ep8-p177","index":177,"text":"高维博弈在人间的表现","level":2,"key":false,"section":"ep8-p176"},{"id":"ep8-p178","index":178,"text":"第六，高维对抗。这种事很少，除非第一次把某样东西带到人间，容易出现高维对抗，它不是竞争对手。比如我们要把《人类说明书》带到人间，也会有高维对抗，我的发挥有时也不稳定。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p179","index":179,"text":"佛界、神界想把东西带下来，魔界还不愿意。得看你的重要性，敌人重不重视。活到连敌人都不重视，重要性也不大。尤其利益众生，利益了一堆，居然连个魔都没来找麻烦，只能说水平还差点，连敌人都不重视。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p180","index":180,"text":"高维对抗不是我们能决定的。我也只是神佛这边一个小棋子，老大之间互相博弈，跟我们有什么关系？正常干，上面万一有问题，也没招，在人间就倒霉。如果老大赢了，人间就出现破除万难，最后终于成功。其实成功不成功，是高维在人间的显化。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p181","index":181,"text":"普通做生意很少。但像马云把网络购物带到中国，像抖音、马斯克，改变人间的东西，没有上面的博弈是不可能的。博弈成功就成功，失败，人间看到的就是一个伟大的天才陨落。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p182","index":182,"text":"同样的能力在不同环境下发挥不同","level":2,"key":false,"section":"ep8-p176"},{"id":"ep8-p183","index":183,"text":"第七，环境。我说咱们现在正处在经济大萧条，估计大家都明白。前面各方面都解决了，结果生不逢时，正好赶上大萧条，怎么办？","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p184","index":184,"text":"像我年轻二十多岁时，家里盖房要搬砖。我估计一下午搬一千块到三楼，问题不大。我们家当时住二楼，搬一千块到二楼应该没问题。这是在风和日丽时，我正常体力能发挥的。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p185","index":185,"text":"如果烈日暴晒，四十多度，估计只能搬五百块；特别冷，出去冻成冰棍，也只能搬几百块；狂风暴雨、龙卷风，一块都搬不了，出去还容易被刮丢。这就是环境的影响。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p186","index":186,"text":"有时得看环境，环境变了，就不一样。前面的东西可能具备，但大环境不好，就等等。大环境不好还往外走，就很麻烦。","level":0,"key":false,"section":"ep8-p176"},{"id":"ep8-p187","index":187,"text":"七 意外与给自己兜底","level":1,"key":false,"section":"ep8-p187"},{"id":"ep8-p188","index":188,"text":"真相不清与信息不全","level":2,"key":false,"section":"ep8-p187"},{"id":"ep8-p189","index":189,"text":"跟法界有关的因素，最后一个叫意外。多说一些，因为很多人理解不透。意外就是计划之外、预判之外、准备之外，突然插进来的变量。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p190","index":190,"text":"对了，请大家点赞、收藏、分享。导播经常说“你得说这事”，我每次都忘，让更多人看到。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p191","index":191,"text":"好，再说意外。意外不是人的错误，是这个世界总有你掌握不了的东西，一定记住。意外也分等级。比如真相层的意外，普通人对事情的真相了解不够，这时做决定，就容易出意外。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p192","index":192,"text":"第二，全面层。为什么我坚决不做股票？我相信很多人分析得厉害，但假设决定一只股票走向有一百个因素，普通人能掌握二三十个，已算高手；掌握五六十个，就是高手中的高手。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p193","index":193,"text":"掌握七八十个更厉害，但世界总有你看不到的意外，千万不要完全相信自己。我更多做很有把握的事。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p194","index":194,"text":"像巴菲特也是，九十年代末、二〇〇〇年初，放任科技股狂飙，不去碰，因为有些东西把握不了。不可能掌握全面，但对某些公司，他很有把握，所以只做确定的事情，这点很不一样。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p195","index":195,"text":"操作与更难确定的变量","level":2,"key":false,"section":"ep8-p187"},{"id":"ep8-p196","index":196,"text":"第三，操作层意外。自己开车，撞车、剐车时，有时明明觉得有问题，还是这么做了，很奇怪。还有资源层、高维、因果业力的意外，以及很多不明意外。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p197","index":197,"text":"很多人问：“您都是阴阳师，能跟上面接触，是不是不可能出意外？”我可以很负责地说，看卦和得到高维信息的水平，绝对远超人类。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p198","index":198,"text":"但是仍有解决不了的问题、不敢确定的问题。甚至知道事情应该往这边走，却连说都不敢说，想都不敢想。因为一说、一想，在法界就相当于公开，可能出变数。这叫事以密成，我们也一样。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p199","index":199,"text":"那到大菩萨或者佛祖，就不出意外吗？也一样。每过一段时间，佛界也会有佛祖陨落，不是做到佛祖就不会陨落。别觉得能掌握一切。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p200","index":200,"text":"我的命局、大概的财富、从哪来财，心里大概有数。怎么做能保护自己，也清楚。但有这么多神佛仙看着，有这么多准备，就一定成功吗？不一定，还是不一定。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p201","index":201,"text":"所以我也会做一些仙家觉得奇怪的事情：做负面的准备。万一败了？万一什么都没有了？万一真出事了？这些都得准备。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p202","index":202,"text":"意外一定有可能发生，有大有小。真出事时，必须有自己给自己兜底的，打仗还得有预备队，一定注意。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p203","index":203,"text":"你们碰到的，多数是真相、全面性、操作层面出问题。这些没问题，却被疫情、战争、天灾、黑天鹅影响，就不好预测。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p204","index":204,"text":"我记得疫情期间，石油能跌出负数，谁能想到？哪怕一分钱一升都认了，居然负数，一下让一帮人爆仓。所有人都不认为怎么能出负数，结果它就出了，会出现这种情况。","level":0,"key":false,"section":"ep8-p187"},{"id":"ep8-p205","index":205,"text":"八 真相判断与课程结束","level":1,"key":false,"section":"ep8-p205"},{"id":"ep8-p206","index":206,"text":"意外说完，第二个就是真相部分。这些跟法界没有太大关系。注意你了解的信息真不真、全不全、对不对，还有在第几层。之前讲过，就不多说，只告诉你有这么件事，盯着点。","level":0,"key":false,"section":"ep8-p205"},{"id":"ep8-p207","index":207,"text":"要看自己在哪个境界，才能保证很多东西正确运行。上几节课，好像认知和思维模型那一节，讲过真相，这很重要。","level":0,"key":false,"section":"ep8-p205"},{"id":"ep8-p208","index":208,"text":"真不真、全不全、对不对、第几层。但是能碰到真相也靠机缘，没有机缘根本碰不到。比如外网那些大 V，没有人家那个机缘，怎么知道那些真相？真的是把天上的东西拿到人间。","level":0,"key":false,"section":"ep8-p205"},{"id":"ep8-p209","index":209,"text":"包括没有我的机缘，想知道这些真相，门都没有，几千年也没人跟你说这些。反正尽可能多修一些众生善缘吧。","level":0,"key":false,"section":"ep8-p205"},{"id":"ep8-p210","index":210,"text":"好，今天说到这。这些是决定一个人成功或者失败的法界部分。明天再把人间部分快速捋一遍，成事这部分就讲完了。","level":0,"key":false,"section":"ep8-p205"},{"id":"ep8-p211","index":211,"text":"感谢大家。愿意点赞的再点点赞，收藏、分享。谢谢大家，辛苦听我唠叨，拜拜。","level":0,"key":false,"section":"ep8-p205"}]},{"id":"ep9","number":9,"name":"问道九","title":"意义思维：成功与失败2","speaker":"悟聊天尊","source":"20261006_问道9_意义思维_成功与失败2_整理稿.docx","date":"2026-10-06","description":"从学习、分析到执行，检查身体、情绪、关系与反馈修正。","blocks":[{"id":"ep9-p22","index":22,"text":"一 开场与课程安排","level":1,"key":false,"section":"ep9-p22"},{"id":"ep9-p23","index":23,"text":"听到的扣一。这网速这么好吗？还挺厉害。来，咱们先唠会儿嗑。这么多次直播，今天好不容易第一次早来。结果他们一打开电脑，今天特别白，不知道怎么调的，可能开了双重美颜。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p24","index":24,"text":"刚开始没开美颜，我正琢磨：“这是我吗？”哈哈，发现看习惯之后，也是接受不了现实。你们看到的都是经过三十多块钱美颜的效果，正常情况不是这样。今天磨皮有点太白，不过先这样吧，反正也不追求什么，又不是什么大明星。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p25","index":25,"text":"今天属于纯人间的，就没有那些法界的东西了，所以讲得快一点，有点 AI 整理的东西。明天决定给自己放假一天，去喝个小啤酒，不想给你们直播，后天晚上再播。周四讲智慧，基本准备得差不多了，还需要再憋一小会儿，估计上几趟厕所就憋出来了，憋点东西挺费劲。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p26","index":26,"text":"在周一之前，含周一，再把修行给大家说了。之后先等等，我再找个地方憋十天半个月，再密集输出。剩下因果、轮回、空色、有无，就开始了。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p27","index":27,"text":"还是觉得十二月份之前，能冲一把就冲一把，怎么着也得把《逆修觉者》冲到二十集，要不太费劲。这今年不是闰年嘛，所以一月份，我估计就进入腊月了，进入腊月二十三了。一定要在腊月二十三之前完成二十五集，要不然不得了。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p28","index":28,"text":"上面领导问：“你丫今年干什么了？”我说：“光憋，没憋出来。”怎么着也得憋点东西。直播完就算完成任务，录播那帮人太慢，不能怪我，是他们跟不上我的速度，哈哈。这也得冲 KPI。腊月二十三，天地考核之前，必须想办法冲一把。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p29","index":29,"text":"我觉得从去年十一月份开始憋，一直憋不出来。好不容易有点感觉，脑袋还出问题；脑袋好了，又开始憋。要把好东西带到人间，不是那么简单的事。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p30","index":30,"text":"凌晨四五点起床，就在那憋：今天到底讲什么？然后刷着刷着视频，可能就想明白了。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p31","index":31,"text":"今天还是讲成事的人间部分。昨天把法界部分讲完了，成事本身就分人间和法界。法界大家不特别清楚，所以讲得多些：得有缘分、有福气，对真相有足够了解，有贵人、有气运。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p32","index":32,"text":"很多人自命不凡，“我命由我不由天”，其实早就天注定。不是那块料、不是那个命，哪怕是天地的儿子，投胎时忘了带福报下来，该缩着也得缩着。不要做无谓的努力，抓紧时间把今生能完成的事完成，珍惜缘分和机会。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p33","index":33,"text":"跟你没关系的，别乱努力。比如动不动创业，人家可以，问题是你是不是？别浪费时间。绝大多数人把时间浪费在这些没用的事上，所以先说法界成事的条件。法界都不成相，往上冲什么？纯粹浪费时间、人力、金钱。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p34","index":34,"text":"走 A 运时，失败一下无所谓，人要经历失败才能成长，没太大问题。但都 B 运、C 运了，就老老实实歇着。尤其福报有限，四十、四十五、五十了还没怎么样，就别觉得四十五、五十以后还能怎么样，收着点。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p35","index":35,"text":"或者前半生已经挣过大钱，后半生还能再挣大钱的可能性很低，别乱折腾。哪怕折腾，动嘴可以，别动钱，也别做惊天动地的大事。这是法界部分主要想说的。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p36","index":36,"text":"今天说人间部分，会比较快。估计半小时、四十分钟差不多，基本都是流水化的东西，不会说得太细。后面还有好多项，再说细了，更没完。明天休息一天，我要喝小啤酒。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p37","index":37,"text":"周四大课，都来，讲智慧。相当于从人间界定义什么是智慧，修行方向这些就全定了。所有违背我跟你说的修行宗旨的，全是扯淡，你直接这样认为就行。周四这节课比较大，再憋几天，把修行讲了，再休息，计划就是这样。","level":0,"key":false,"section":"ep9-p22"},{"id":"ep9-p38","index":38,"text":"二 分析学习与研究能力","level":1,"key":false,"section":"ep9-p38"},{"id":"ep9-p39","index":39,"text":"大事要在行动中不断修正","level":2,"key":false,"section":"ep9-p38"},{"id":"ep9-p40","index":40,"text":"好，讲成事的第二部分，人间部分。第一块叫分析、学习、研究。要成事，得有独立分析、独立学习、独立研究的能力。接触到信息、真相、条件之后，能不能分析明白、学进去、研究透彻，非常重要。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p41","index":41,"text":"为什么要求这些能力？一个人不可能什么都准备好才开始。小事可以，比如出去玩，把该想到的都想好，准备好了再去，没问题。但干任何一件大事，怎么可能什么都准备好？","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p42","index":42,"text":"有些学历挺高的学生问：“你怎么证明这些事情？怎么知道一定没有意外？”我认为你觉得有意外，很正常。但非要把什么都准备好，就凭这个想法，不可能是干大事的人。人类任何足以推动进步、非常伟大的成就，从来没有一开始就准备好的。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p43","index":43,"text":"必须在运动中，一边学习，一边准备，一边前进，一边反馈，一边修正，得这么弄才行。不是说你认为什么地方可能有意外，这个想法就不正常；有意外很正常。但是非得等所有东西都准备好了，才肯往前走，我说这个不可能。干小事和干大事，在这点上是不一样的。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p44","index":44,"text":"只要干大事，没有人一开始就知道该怎么走、怎么变、怎么动，未来遇到什么事、什么机缘，什么又不可能。所以有几个能力重要：洞察力、学习能力、分析能力、研究能力。准备随时调整方向，应用手头资源，甚至创造新资源，这才重要。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p45","index":45,"text":"我们要做的不是一颗子弹。狙击手把东西都调好，砰，放一枪，子弹一出枪管，你就失去控制了。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p46","index":46,"text":"能不能打到，看前面准备得怎么样。厉害点的子弹，打一千米、两千米，也就这个水平。创造最厉害狙击纪录的人，打两千四百、两千七百米外的目标，也没有说首枪命中的，都是打一枪，看看弹着点，调整再打一枪，至少第二枪才行。为什么？变数太多。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p47","index":47,"text":"任何细微变化，到一千米、两千米时都会放大。但有没有办法精准击中几百、几千公里外的东西？可以，用导弹。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p48","index":48,"text":"导弹发射时，甭管往哪边，哪怕相反方向，也不影响最后击中目标。为什么？几秒钟校正一次，有时可能一秒钟一次。经常修正方向，哪怕最开始差距很大，最后也能击中目标。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p49","index":49,"text":"人生一定要学导弹，别学子弹。这就要求自我提升、自我修正、自我进化的能力非常强。历史上谁做得厉害？还得朱元璋。开局比他惨的很少，最后达到开国皇帝的水平，你想自我提升、进化、修正得多强？","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p50","index":50,"text":"真得佩服老朱，啥都没有，开局一个碗，是不是完整的都不一定。全家好像就他和一个姐姐没饿死，其他都饿死了，实在厉害。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p51","index":51,"text":"一定记住，小事可以准备好再做，大事不可能都准备好，必须在做中不断修正。人间的东西，一定要学会快速进化、快速迭代，这个能力非常重要。大老板和小老板的区别就在这儿。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p52","index":52,"text":"学习吸收与社会上的学习","level":2,"key":false,"section":"ep9-p38"},{"id":"ep9-p53","index":53,"text":"需要哪些东西？学习吸收能力、洞察悟性、抓核心的能力、高维分解、方向与资源、方式方法。当然还有更多，咱们不是讲 MBA，大概列列就行。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p54","index":54,"text":"第一个，学习和吸收。不是接触多少信息、听多少课、看多少书就行。真正的学习，考的是能不能学懂、学明白、应用。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p55","index":55,"text":"吸收不好，就是学不进去，听不懂，看不明白，学了不会用，只会记，不会转化。学很多，判断和行为基本没变化。你说听了多少课、看了多少书，接触了多少信息，这些还不等于你就学到了。真正考的，是学懂没有，明白没有，到事情上能不能用出来。核心一句话：学习不是知道了，而是学会了。不能理解、吸收、应用，就不能算真正学到。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p56","index":56,"text":"这涉及社会学习和学校学习的区别。我们要求的是社会上的学习能力。学校里买哪本书，都指定好了。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p57","index":57,"text":"大纲框架、学什么、标准是什么，相应经验、案例、考题，都给你了。好好学，学得足够多，经常刷题，基本不会出太大问题。考七百分不容易，但脑子不错，加上足够努力，上六百分问题不大。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p58","index":58,"text":"社会完全不是这样。首先没人告诉你问题是什么，你连问题都不知道。出了问题怎么做，往哪个方向走，学什么、准备什么、应用什么，才能拿到社会上的高分？没人告诉你。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p59","index":59,"text":"要在这些东西里迅速试错，快速找出路，归纳总结，这才是社会上的学习方式。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p60","index":60,"text":"所以《亮剑》里，李云龙为什么能把好多上黄埔军校的打得狗吃屎？就是社会应用特别强。这也是什么原因，很多九八五、二一一、上过大学的人，最后社会成就反而不如泥腿子。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p61","index":61,"text":"泥腿子里，有人不爱学习，但不代表学习能力差，而且没有负担。就跟排队一样：去机场换登机牌，旁边开了一个新柜台，也能换，你看谁转过去？一定排最后那帮人，没负担。“反正已经在后面，直接冲过去。”","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p62","index":62,"text":"排到前面的，是既得利益：“马上轮到我，干嘛走？”也不走。最难受的是中间，不高不低，排了一半。走吧，已经排一半；不走吧，又错失机会。几秒钟，换过去就在前面，没换过去就没机会了。人也是这样，要注重社会学习。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p63","index":63,"text":"真正解决问题的是社会学习能力。怎么评判是不是学习能力很强？很简单。比如到一家公司，某个东西从没接触过，小规模公司、小规模行业，两三个月，如果不能在某个小领域变成绝对高手，学习能力就有点差。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p64","index":64,"text":"大的东西，用几年的时间，咱们三五年一个小阶段，五到十年一个大阶段，必须在某个行业、某个领域，成为这个赛道全球最顶尖的人才。我说的是你能不能在一个领域里学进去，最后达到那个水平。这才是咱们这一项的评判标准，不是看你原来接触没接触过，也不是只看你原来上过什么学校。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p65","index":65,"text":"这说明学习能力很厉害。做不到，就做个普通人，别太费劲，别太难为自己，哈哈。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p66","index":66,"text":"包括找我们开堂口的，我都跟他们说：“我知道你们想开堂口干什么，想算命，觉得开完自己就厉害，你想错了。一定是没开堂口之前，就很厉害。开堂口只是把法界程序走完。”没开之前不厉害，开了也不会多厉害，就是这个真实情况。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p67","index":67,"text":"我估计十二月份逐渐讲一些真相，首先讲人类金字塔。知道跟什么样的人竞争，就知道为什么一直赚不到钱。真的就是水平差，只是圈子让你感觉不到到底多差。真正看到几个厉害的，就知道为什么挣不到钱。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p68","index":68,"text":"洞察悟性与抓核心","level":2,"key":false,"section":"ep9-p38"},{"id":"ep9-p69","index":69,"text":"第二，洞察。看到别人看不到的问题，叫洞察。再加悟性，想明白别人想不明白的东西，叫悟性，可以合并讲。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p70","index":70,"text":"洞察、悟性好，就能发现别人发现不了的问题，看到别人看不到的东西，想到别人想不到的东西，想明白别人想不明白的，理解别人费很大力气才能理解的，这些都重要。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p71","index":71,"text":"没这个能力，就做不到提前发现机会和问题。等你发现问题，事已经大了；等你确定是机会，其实快没机会了。这是洞察力和悟性太弱的表现。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p72","index":72,"text":"第三，抓核心。从复杂事物中找出真正决定成败的关键点。很多事情看着复杂，变量、信息、干扰很多，真正决定胜负的往往就那几个东西。毛主席在这方面就很厉害。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p73","index":73,"text":"抓核心不好，就抓不住重点，容易被复杂的表面现象带跑，把次要问题当主要问题，忽略真正决定胜负的变量。花很多力气，没打中真正的问题，解决一堆小问题，大问题还在。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p74","index":74,"text":"很多学生提交单子，知道为什么一定要出查事模板吗？二〇一八、二〇一九、二〇二〇这三年，我快被折磨疯了。有时听一个女的或者男的说俩小时，最后还不明白到底想解决什么。咱们女性客户多，所以听女的多些，真是这样。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p75","index":75,"text":"今天好像还听了鲁社长的现场答疑，一个哥们说快十分钟，都没介绍清楚想干什么。就这样还回来当教授？别当了。的确可能紧张，但语言表达和抓重点的能力实在太差，这一点很重要。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p76","index":76,"text":"高维分解与方向资源","level":2,"key":false,"section":"ep9-p38"},{"id":"ep9-p77","index":77,"text":"高维分解是什么？把多层事物拆开，看懂层与层的关系。并不只是看每一层，而是看哪层是表面、哪层是原因、哪层是结构、哪层是规则、哪层是更高维的影响。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p78","index":78,"text":"层与层怎么传导？上层如何影响下层，下层如何承接上层？要学会把问题分解。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p79","index":79,"text":"第五，方向和资源。共同决定事情值不值得做、能不能做起来。有时想法没问题，就是没有资源，或者方向错了。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p80","index":80,"text":"确保发展路径、方向正确。方向错，在错误道路上努力，就是不停白费精力、资源，越努力，错误越大。方向决定值不值得做，后面所有努力会不会被带偏。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p81","index":81,"text":"资源就是整合资源，用资源再创造价值，所有东西都在用资源。包括我，忽悠能力还可以，在佛界来说。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p82","index":82,"text":"至少排进前十大忽悠，没问题。主要是佛界的人不太能忽悠，我在佛界比较能忽悠。但在轮回里排，肯定不行。可这不就是机缘吗？咱能在佛界忽悠，底下再能忽悠，上不了佛界。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p83","index":83,"text":"佛界的人比较好忽悠。昨天说怎么忽悠佛界美女，很简单，但后果严重。我曾经被追杀过，忽悠完容易被追杀。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p84","index":84,"text":"非得问：“你居然小菩萨级，为什么后面还长俩翅膀？大家不都会飞吗？为什么你长翅膀才能飞？”觉得奇怪，一不小心说：“原来你是个鸟人啊！”","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p85","index":85,"text":"得，完了，被追杀多少世。有些佛界美女下手比较狠。我这吹没输过，打架没赢过，一直是被揍的对象。缘分就这么出来的，很郁闷。所以不要乱忽悠，容易出事，轮回里追杀很多。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p86","index":86,"text":"好，资源包括时间资源、物质资源、通路资源、人脉资源、矿物资源，还有社会资源和一切可调用资源。包括智商、师父、朋友，都能调用。没有资源，除非很小众、很小规模的事，能做成功。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p87","index":87,"text":"稍微大点的事情，就拿咱们这么小的事来说，法界没有足够多的仙家、神佛仙资源，想讲出这些东西，想什么呢？人类几千年都没讲出这些。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p88","index":88,"text":"看评论可以说一下，关键是法界武力值不是按肌肉算。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p89","index":89,"text":"今生像我老婆，我两百斤，她一百左右，有时不到一百。按人间来说，一划拉就给她划拉到一边。但法界不这么算，是按法力值，谁揍谁就不一定了。不同界面有不同规则。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p90","index":90,"text":"方式方法与复杂问题的处理","level":2,"key":false,"section":"ep9-p38"},{"id":"ep9-p91","index":91,"text":"第六，方式方法。首先方法正确，讲究效率，等级是否正确，处理问题的层次是否匹配。这些不多说。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p92","index":92,"text":"还可以拆成几个方面。第一，结构化处理。学会把复杂问题拆分，看清关联和逻辑，把问题拆开、连通、讲通。第二，复杂问题的承载。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p93","index":93,"text":"对创业者、领导者来说，说白了就是脑子算力够不够，多线程处理够不够，能不能把复杂问题简单处理。我年轻时做过客服，公司杂事基本都归我。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p94","index":94,"text":"刚开始处理一个就捉襟见肘，多加几个问题、几个人，更麻烦。原来一两个员工找你，还能解决；三四十个排队找你，能不能也解决？能不能同时处理几个部门的事？这就是处理复杂问题的能力。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p95","index":95,"text":"那时过得苦，但对处理多线程任务、高负载量，很有帮助。原来一两个问题能处理，问题一多，人一多，几个部门一起找你，你还能不能处理？这个才看得出复杂问题的承载能力。老板只能处理单线程，一来复杂的、多线程的就处理不了，肯定不行。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p96","index":96,"text":"第三，应变能力。肯定有突然变化，事情要不要继续，要不要改，改成什么样，速度怎么样，都很重要。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p97","index":97,"text":"再往下，推演。很多人想事情，没想做完以后可能产生什么结果，有什么预警，下意识认为照着办就行，肯定不行。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p98","index":98,"text":"对自己的所思、所想、所行，要有更长远的规划和推演。不要求推到五步之外，至少两三步，确定安全，也行。别什么都做了，又不管产生什么情况，那不就拍脑袋？怎么叫智慧？","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p99","index":99,"text":"年轻人可能自己推演不了，也尝试着推演，变成习惯以后，其实没多大负担。","level":0,"key":false,"section":"ep9-p38"},{"id":"ep9-p100","index":100,"text":"三 执行掌控与压力阻力","level":1,"key":false,"section":"ep9-p100"},{"id":"ep9-p101","index":101,"text":"把想明白的事情推进下去","level":2,"key":false,"section":"ep9-p100"},{"id":"ep9-p102","index":102,"text":"第三部分，大块叫执行掌控。上面都说完了，想好的东西能不能真推进下去？就像学自行车，理论教了，车有了，怎么着也得上手试试。刚开始平衡掌握不好，需要多练，这就是执行掌控。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p103","index":103,"text":"主要是掌控力，对人、事、资源、节奏和局面，能不能有好的掌控，决定事情能不能做成。还没说具体人情世故，光到这儿，想成就伟大事业，得准备多少事？不是拍脑袋就行。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p104","index":104,"text":"不像某些人的老婆，一拍脑袋：“咱做个高端的东西。”结果老公的钱赔得裤衩都不剩。想明白不等于能成功，真做时，要压得住局面，推得动节奏，对人、事、资源、节奏、局面有把握。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p105","index":105,"text":"再往下，压力和阻力。做事不可能都顺，都顺不就爽文小说了？为什么爽文这么多？大家郁闷的事太多。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p106","index":106,"text":"小说中的机缘与成事的阻力","level":2,"key":false,"section":"ep9-p100"},{"id":"ep9-p107","index":107,"text":"现实里很难成功，就在小说、短剧世界成功。但看小说短剧的主人公，像《凡人修仙传》《仙逆》，觉得他可能是泥腿子出来的吗？没外挂、没机缘能成功，那才见鬼。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p108","index":108,"text":"《凡人修仙传》的男主人公是普通人吗？属于轮回道祖重新投胎，要不掌天瓶怎么落到脚边？《仙逆》的“仙逆珠”凭什么落在身边？没挂、没绝对资源，想从泥腿子往上升，想什么呢？","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p109","index":109,"text":"连爽文小说都得有挂，没挂不行。有挂了，像王林，活得多苦，整个一部苦逼史，被揍、面临生死大劫，救媳妇每次失败，只有最后一次成功，失败了又重新找希望。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p110","index":110,"text":"这就是阻力和压力。人的阻力、事的阻力、资源的阻力，都会产生很大压力，能不能成事要看能不能承受。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p111","index":111,"text":"为什么很多女性很难成就特别大的事业？中国也好，世界也好，女性领导者、女性权贵不是很多，我说主要是在抗压、抗阻上出现问题。最后能做成大事的女性。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p112","index":112,"text":"基本都有“男人婆”的感觉。比如撒切尔夫人、德国女总理、中国的董小姐，哪个是纯女性风格？女性各方面不比男生差，但属于感性思维，不把自己弄得非常坚定，很容易自己把自己压趴下。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p113","index":113,"text":"顺境还行，逆境、尤其绝境，指着感性思维的人抗压，基本扛不住，包括男的也一样。居里夫人也是非常坚强的女性，都得这样才行。我说思维要很男性化，才能扛住，不然费劲。所以想成大事，就必须抗压，还要学会应对外部对抗和破坏。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p114","index":114,"text":"外部对抗与坚持到底的韧性","level":2,"key":false,"section":"ep9-p100"},{"id":"ep9-p115","index":115,"text":"像咱们这行业，几乎没竞争，因为在缘分、真相上，基本垄断了。放开让你竞争，也竞争不了，有些东西看不到，想竞争没用。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p116","index":116,"text":"但正常在市场做生意不行，肯定有竞争对手，有搞破坏、挖陷阱的，有人抢资源、抢位置，反制你、拆台、制造麻烦。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p117","index":117,"text":"或者诬陷，诱导你犯错，在关键节点翻车，能不能扛住？这涉及反制手段。对方反制手段太多，在博弈上就容易出问题。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p118","index":118,"text":"再往下是韧性，信心、坚持、毅力，也是抗压的一种。能不能真正顶到最后，承受痛苦、消耗和反复打击，非常重要。不是说这个事一开始想好了，后面就顺着走，人在其中会有压力，外面也会有阻力。你得能顶得住，才有可能往后推进。所以执行掌控说到这儿，还不只是把事情想明白的问题。","level":0,"key":false,"section":"ep9-p100"},{"id":"ep9-p119","index":119,"text":"四 身体承载与工作状态","level":1,"key":false,"section":"ep9-p119"},{"id":"ep9-p120","index":120,"text":"身体出问题可能中断整个事业","level":2,"key":false,"section":"ep9-p119"},{"id":"ep9-p121","index":121,"text":"说完这些就是身体，一定保护好。别小看身体，很多人出问题就在身体上。举两三个例子，像我有家族遗传带来的劫难。我们家如果不想办法抵改或者调整，男性很难活过六十，基本五十左右就出问题。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p122","index":122,"text":"我爸算比较晚，五十七得脑血栓，瘫在床上。其他人基本连他这个岁数都没活过去。我也是正好五十左右。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p123","index":123,"text":"来了这场劫难，熬过去就过去，没熬过去，比如现在瘫痪了，流着哈喇子，光辉伟大的事业就终止了，一瞬间的事。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p124","index":124,"text":"比如医生开颅时，突然飞来个苍蝇，进鼻孔，打个喷嚏，一下刀多划两下，就完了。这就是身体容易出问题。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p125","index":125,"text":"这里面我觉得最可惜的，是那段“太子奶老大”的故事。辛辛苦苦一辈子，最后所有东西给了司机，钱、老婆、孩子都没了。找个漂亮、特别听话、没主意的，好控制；这个女的唯一能接触的男性就是司机。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p126","index":126,"text":"人走了以后，产业都给老婆。她没有社会上的帮助，司机就顶起来了。司机那句话是：“一直以为我给老板打工，没想到老板给我打工。”哈哈。这就说身体，别小看。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p127","index":127,"text":"清晨思考与自己的作息","level":2,"key":false,"section":"ep9-p119"},{"id":"ep9-p128","index":128,"text":"像我们这样的人，为什么四五点起床？看硅谷那帮老大，也是四五点。那时没人打扰，很静，可以一边锻炼身体，一边思考。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p129","index":129,"text":"我虽然懒，不爱锻炼，但四五点想问题效率高。白天动不动有人找，一会儿处理问题，一会儿看单子，甚至孩子回来在楼下一叫唤，楼上就别想干活。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p130","index":130,"text":"我大概十点到十点半就睡着，躺枕头上就能睡。也刷手机，快十点上床，刷一会儿就睡着，四点多起来。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p131","index":131,"text":"中午一定睡午觉，不多，半小时，一般很少一小时。我要仰一下脖子，不枕脑袋，头向后，把枕头放脖子这块，这么窝着睡一下，就舒服。这对我很重要，才能保证有效工作。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p132","index":132,"text":"首先身体不能影响事业发展，精力、体力、疲劳度、耐力都重要。以前忙、熬夜，年轻时还行，现在只要十二点以后睡，大概要休息两三天，岁数确实不行，得休息一段。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p133","index":133,"text":"这时想也想不出东西，脑子不转，与其这样，不如踏踏实实睡觉。前段时间我也有中招，一年总得几次。像七月十五、清明前后，阴气太重，脑子不转，索性给自己放假，爱谁谁，该打游戏打游戏，该刷剧刷剧。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p134","index":134,"text":"创造不出价值，只是机械工作，没有意义。","level":0,"key":false,"section":"ep9-p119"},{"id":"ep9-p135","index":135,"text":"五 心情情绪与延迟决定","level":1,"key":false,"section":"ep9-p135"},{"id":"ep9-p136","index":136,"text":"身体承载很重要，所有东西都得用肉身承载。下一部分是心情和情绪。很多人的错误，不是前面条件没有，而是做事时情绪波动。","level":0,"key":false,"section":"ep9-p135"},{"id":"ep9-p137","index":137,"text":"碰到事恐惧、退缩，赶上好事欲望又大，成功后傲慢，觉得与众不同，不听别人说。傲慢固执、逃避懈怠、内耗敏感、情绪失控，都会出现，一出现很麻烦。","level":0,"key":false,"section":"ep9-p135"},{"id":"ep9-p138","index":138,"text":"最常见是发脾气、不冷静，在冷静期之外作出错误决定。所以我们要求延迟法则：这事需不需要马上决定？不需要，哪怕员工出什么事，先等一两天，心情平复再处理。","level":0,"key":false,"section":"ep9-p135"},{"id":"ep9-p139","index":139,"text":"年轻时一发现问题，啪，拿电话就开骂。但骂得对不对，有没有更好解决方式？当时正在气头上，也没去想这些。等心情平复以后，再看怎么处理，和一发现就打电话开骂，是不一样的。不是每件事都需要马上下决定，先看看需不需要，能等的就等一两天。很多缘分就是不小心这样弄掉的，所以心情、情绪控制很重要。","level":0,"key":false,"section":"ep9-p135"},{"id":"ep9-p140","index":140,"text":"六 人与人之间的问题","level":1,"key":false,"section":"ep9-p140"},{"id":"ep9-p141","index":141,"text":"人品稳定性与边界感","level":2,"key":false,"section":"ep9-p140"},{"id":"ep9-p142","index":142,"text":"最后一部分，人与人之间的问题。要懂人情世故，了解人性、心性，在人品、稳定性、边界感、一致性、人的欲望弱点和人情世故上，都做得到位。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p143","index":143,"text":"毕竟是人的世界，要学会跟人打交道，不能只跟机器。要很好地识人、用人、防人、处人。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p144","index":144,"text":"人品不用多说，守不守信用，撒谎、甩锅、背刺、忘恩负义、见利忘义、底线太低，这些都是人品问题。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p145","index":145,"text":"稳定性很重要。情绪波动很大，不稳定，不能用；上升空间很低，不能用；压力下一做事就变形，不能用；利益面前容易翻脸，不要用。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p146","index":146,"text":"边界感，看会不会碰不该碰的东西，打探隐私、混淆公私，能不能守住分寸。欲望、弱点，像钱、色、权、名。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p147","index":147,"text":"还有赞美、安全感、控制欲、虚荣心、报复心。人间的东西，以后讲人道思维会重点讲。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p148","index":148,"text":"人情世故，比如吃饭吧唧嘴，到别人家到处乱溜达，跟自己家一样，没大没小；未经同意拿别人东西；该说话不会说，人家帮了你，连谢谢也不说。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p149","index":149,"text":"好多学生普通家庭出身，家长没教过这些。再拿一个可爱的学生举例。当时在泰国，好多师兄师姐跟他吃饭，他从来没掏过钱。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p150","index":150,"text":"请人指点与先付出","level":2,"key":false,"section":"ep9-p140"},{"id":"ep9-p151","index":151,"text":"我说：“师兄师姐肯定看我面子才带你，你太小了。抽一天时间跟你吃饭已经不错，怎么次次不掏钱，都让他们掏？到人家那儿取经，怎么能不掏钱？”","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p152","index":152,"text":"他说：“我妈说了，别人请你，你再回请。”","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p153","index":153,"text":"我说没错，但有个问题。如果别人求到你，礼尚往来没问题。现在是你求别人，取经、处关系，得先付出。不能到人家那儿取经，还要人家请你，这就不对了。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p154","index":154,"text":"其实就是小孩子，父母也是普通工薪阶层，没教过。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p155","index":155,"text":"我当年不也这样？人家在桌上快打起来，我还吃得挺高兴。后来指着鼻子骂我们“silly boy”，坏了，英文也没听懂。后来才知道，是他们闹不和、快打起来了。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p156","index":156,"text":"我哪听得懂话里的讥讽？就觉得饭好吃，赶紧吃。还问：“从哪句话听出要打架、闹问题？看着都笑得挺好，也没互相骂。”人家怎么教，没法教，说长大就明白了。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p157","index":157,"text":"所以人情世故很重要，我在这方面也不行。","level":0,"key":false,"section":"ep9-p140"},{"id":"ep9-p158","index":158,"text":"七 反馈修正与本课结束","level":1,"key":false,"section":"ep9-p158"},{"id":"ep9-p159","index":159,"text":"反馈和修正的速度要足够快","level":2,"key":false,"section":"ep9-p158"},{"id":"ep9-p160","index":160,"text":"最后一项，做事一定要反馈修正，这是最大一点。前面所有东西可以没有，但修正速度、反馈速度足够快，就没问题，像导弹一样。要去这边，一开始往那边飞，没关系，发现错了，扭过来就行。","level":0,"key":false,"section":"ep9-p158"},{"id":"ep9-p161","index":161,"text":"反馈、修正速度要足够快。别不复盘，别人指出问题拒不承认，承认了又拒不修正，那就那样了。就是这些事。","level":0,"key":false,"section":"ep9-p158"},{"id":"ep9-p162","index":162,"text":"今天速度快些，都是人间法上的东西，没太多新鲜的，简单捋一下。总算把成事讲完了。虽然粗略，也足足讲了快三期，想成一件事得多费劲？方方面面做好，才能真成就一番事业。","level":0,"key":false,"section":"ep9-p158"},{"id":"ep9-p163","index":163,"text":"任何一点出问题，可能被气运、机缘推着往前走一段，但因为不圆满，没办法一直持续。所以世界上很少有人能跨越经济周期，一直富贵，就是条件里有缺，而且我列得还不全。","level":0,"key":false,"section":"ep9-p158"},{"id":"ep9-p164","index":164,"text":"记得当时做法界指标，选总经理的指标大概两三百项，看看那些东西，任何一项解决不了，企业都做不下去，就是这样。","level":0,"key":false,"section":"ep9-p158"},{"id":"ep9-p165","index":165,"text":"今天不是什么新鲜课，把事说完，大家知道就行。等周四正式讲智慧，很重要的一节课。周四见，明天是小啤酒时间，拜拜。别忘点赞、收藏、分享。","level":0,"key":false,"section":"ep9-p158"}]},{"id":"ep10","number":10,"name":"问道十","title":"智慧和悟","speaker":"悟聊天尊","source":"20261008_问道10_智慧和悟_整理稿.docx","date":"2026-10-08","description":"区分聪明与智慧，讨论六个维度、悟的方式和十二条判断练习。","blocks":[{"id":"ep10-p30","index":30,"text":"一 从聪明说到智慧","level":1,"key":false,"section":"ep10-p30"},{"id":"ep10-p31","index":31,"text":"今天讲智慧，也讲领悟的悟","level":2,"key":false,"section":"ep10-p30"},{"id":"ep10-p32","index":32,"text":"看到的扣一啊。已经有人扣一了，看来网速还不错。大家晚上好，正好八点。今天是大课，值得反复听。前几期都是讲完意义思维之后，附带的一些小课。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p33","index":33,"text":"今天美颜给得多。我最近经常看直播里的自己，就觉得自己长得帅，后来一照镜子，好像不是这样。脱了美颜都不行啊，跟气色没关系。咱们等一分钟，马上开始。今天一边憋智慧的文章，一边刷抖音。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p34","index":34,"text":"好，大家好，今天咱们就开始吧，早点完事。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p35","index":35,"text":"今天开始讲智慧，别忘了点赞、收藏、分享。我估计今天甭管讲到几点，都得把智慧讲完。今天是周四，下礼拜一讲修行，之后休息十天，我要去闭关。回来继续讲，到十二月份之前，应该会比较密集地输出。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p36","index":36,"text":"输出完了，咱们休息一段时间，一周安排一次，讲点真相，我再把已经讲过的东西做成录播。从《问道》三到现在，这些都还是直播。我大号给我传东西，属于先撒上一个网，放十天半个月再回来看，可能会有不一样的感受。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p37","index":37,"text":"所以录播会比直播更精细一些。直播嘛，大姑娘上轿头一回，能凑合说出来就行，大家也别太当回事。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p38","index":38,"text":"今天讲一个智慧，一个领悟的悟。这个对传统国学的冲击可能比较大，还得数落他们一顿，咱们才能继续。没办法，前人存在的意义就是让我们踩在脚下；后人进步的根基，也是把我们踩在脚下，都一样。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p39","index":39,"text":"先看看现有的解释","level":2,"key":false,"section":"ep10-p30"},{"id":"ep10-p40","index":40,"text":"咱们先看看传统上怎么定义智慧。我找的《现代汉语词典》第七版，说的是辨析、判断、发明创造的能力。用大白话讲，就是看懂事物本质、分清对错，还能作出合适选择、解决难题的能力。你看，这就是词典给出的东西。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p41","index":41,"text":"再看《辞海》，说的是对事物能认知、辨析、判断、处理和发明创造的能力。这样一说，智慧跟聪明有什么区别呢？","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p42","index":42,"text":"中国传统哲学的说法，是智慧不单纯是掌握知识，而是理解事物运行的规律，懂取舍、分寸，明善恶，知行合一。至少又前进了一点。儒家的说法是明是非、守仁义，遇事中庸有度；道家的说法是洞悉万物本质，顺势而为，不逞强。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p43","index":43,"text":"可这些只是智慧的某一种表现，怎么能代表智慧本身呢？就像我的耳朵长得还可以，那只是我的一个表象，不能完全代表我。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p44","index":44,"text":"当代心理学又给了五个要素：掌握生活事实性的知识；掌握处事策略性的知识；懂得从多角度考虑事情；认识到世事的不确定性和可变性；能权衡不同价值，兼顾多方利益。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p45","index":45,"text":"听完这些解释，是不是反而更郁闷了？咱们用普通人的说法粗略总结一下：聪明人能快速计算得失，有智慧的人知道，有些得失不能只计算数字。聪明是大脑的算力，智慧是对取舍、分寸和长远后果的判断。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p46","index":46,"text":"这个就有点接近了。网上找不出特别合适的定义，怎么办？看看生活里耳熟能详的人，哪些算聪明，哪些算有智慧。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p47","index":47,"text":"先请第一位，牛顿。他在微积分、光学、引力方面有重要贡献。你可以说他有智慧，也可以说他很聪明，对吧？","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p48","index":48,"text":"第二位，冯·诺依曼，流体力学、博弈论、统计学，都很厉害。第三位，高斯，曾经是我心目中的神。据说他眼睛都睁不开了，听儿子说了一遍题，闭着眼睛在心里推了七八十步，就把题解出来了。咱们当年学数学、物理，学了多少高斯定理，偶像啊。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p49","index":49,"text":"还有爱因斯坦，E＝mc²，这不用多说。商业上，乔布斯也绝对是天才。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p50","index":50,"text":"一时富贵与跨越周期","level":2,"key":false,"section":"ep10-p30"},{"id":"ep10-p51","index":51,"text":"但他们到底算不算有智慧？不好说，至少聪明肯定是聪明。马斯克也是，人家脑袋好使。我连大学都考不上，人家读国际一流大学，so easy，咱这脑子肯定不行。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p52","index":52,"text":"再换一组人。国美的黄光裕，苏宁的张近东，恒大的许老板，乐视的贾老板，是聪明还是智慧？有点感觉了吧？再说几位：巴菲特、查理·芒格、段永平、稻盛和夫。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p53","index":53,"text":"还有李嘉诚。我记得二〇一五年左右，他大量清理国内资产的时候，有人骂他老糊涂了。那时候房价还在涨，好像一直涨到二〇一八年。他可能从二〇一二、二〇一三年就开始逐步卖了。现在回头看十多年前这段，确实厉害。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p54","index":54,"text":"因为他的盘子太大，不提前卖，后面就卖不出去。你家卖一套房，看清趋势，二〇一八年再卖可能还来得及；他那个资产量，到那时就不好使了。所以房价还往上冲，他已经提前出手。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p55","index":55,"text":"点完这些人，再感觉一下，什么是聪明，什么是智慧？所有定义都要为人服务。你心里明明有感觉，知道哪些人聪明、哪些人有智慧，却找不到能对应生活的定义，那就有问题。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p56","index":56,"text":"像国美、恒大、乐视这些老板，资产做到几个亿、几十亿、上百亿，甚至上千亿，都没问题。但可能只是一时富贵。我管这叫枭雄的性格、枭雄的气运，很聪明，大势托着的时候，一下冲起来了。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p57","index":57,"text":"乔布斯也是这样。马斯克还没看到后面，他现在仍在势头上，有点像一几年时的马云，拿放大镜、望远镜都找不着对手。这时候还不能下结论。从目前看，更多还是势头上的聪明选择，长远布局最后怎么样，还得看。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p58","index":58,"text":"不过，人家的布局也很厉害。我们说巴菲特、芒格、段永平、稻盛和夫、李嘉诚，看的是更长时间里，能不能始终保持正确。这里很重要的一点，叫跨越经济周期。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p59","index":59,"text":"只能抓住一段大势，最多是一个枭雄。当然，咱们想成为枭雄都很难。但每个时代、每一年都有起来的，也有倒下的。能跨过四十年、五十年，还保持增长、保持稳定的人，整个世界也没几个。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p60","index":60,"text":"有人说司马懿。司马懿肯定算啊。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p61","index":61,"text":"他至少到死的时候几乎没怎么败过，那个隐忍很厉害。了解完这些人，古人总结得不合适，咱们就自己总结。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p62","index":62,"text":"科学成就、商业成就，可能解决了人类的某个问题。比如最近说北大有个小女孩，解决了一个世界数学难题，你可以说她很聪明，却不能只凭这个说她有智慧。聪明更多是解决眼前或某一阶段的问题，智慧更多是看长久。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p63","index":63,"text":"眼前的问题，要不要解决","level":2,"key":false,"section":"ep10-p30"},{"id":"ep10-p64","index":64,"text":"所以，聪明和智慧的区别，不是谁反应快、谁反应慢，也不是谁更会算计，而是重点不同。聪明主要看理解、分析、解决问题的能力有多强；智慧更多看认知和思维，能不能引导人作出正确、有利、经得住长远考验的判断、取舍和行动。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p65","index":65,"text":"大白话就是，聪明看你的CPU快不快，几核的，几纳米的，能不能解决现阶段的问题。智慧有时候甚至不解决眼前的问题，它只关心你这个想法，在这个方向上能不能长久正确。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p66","index":66,"text":"甚至还要先问：这个问题有必要解决吗？有意义吗？你解决得对吗？更长时间里还对吗？这才是智慧考虑的事情。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p67","index":67,"text":"比如我为什么只算小卦？几百块、千八百块的小卦，担的因果少。圈里有人想包下来，给一百万、几百万，家里有事就经常来问，行不行？我坚决不同意。看风水也只看小风水，越是重型家族的大风水，咱越不碰。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p68","index":68,"text":"我可以帮你几年，但人有气运，谁能一直帮着？以前香港那些风水大师，现在你让他们靠风水把家族的生意重新逆转一下，试试看。在我的判断里，整个地区走下坡运了，你光靠这个能拦得住吗？","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p69","index":69,"text":"原来地区向上，家族也向上，你帮的是把前进路上的坑洼填平，让人走得更好。等人家走下坡路，你再拦一下试试。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p70","index":70,"text":"家族从B运走到C运，这时候接风水，你觉得自己努力了，还替他踩了一脚刹车；人家却觉得，自打你动了风水，我家就越来越差。最后还是你不好使。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p71","index":71,"text":"人家投了几个亿，给你几百万风水费，最后几个亿亏了，你把风水费退回去就完了吗？你得承受更大的东西。所以我看到的是，更长远的结果不好，就不碰。哪怕能先帮他几年，也不接。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p72","index":72,"text":"短期内想办法弄上去，是聪明；长期关系早晚出事，自己要倒霉，那为什么还要做？这就是不能只看短期。","level":0,"key":false,"section":"ep10-p30"},{"id":"ep10-p73","index":73,"text":"二 时间尺度变了，取舍就变了","level":1,"key":false,"section":"ep10-p73"},{"id":"ep10-p74","index":74,"text":"大智若愚是怎么来的","level":2,"key":false,"section":"ep10-p73"},{"id":"ep10-p75","index":75,"text":"聪明的商人能抓住机会，智慧的商人抓的是长久稳定的机会。这是在人间层面讲聪明和智慧。有没有更高位面的智慧？咱们引用佛祖、道祖的说法，比如“宁损性命，终不作恶”，比如“冤冤相报何时了”。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p76","index":76,"text":"在人间，短时间有利和长时间有利，比较容易判断。我拿许老板和巴菲特作比较：一个挣得很多，二十年左右就出了事，我直播里说是“踩缝纫机去了”；另一个六七十年还在稳步增长。按这个尺度，长久的结果比较容易看出来。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p77","index":77,"text":"可把时间尺度再拉长，很多判断就变了。“宁损性命，终不作恶”，怎么理解？连这一世的生命都愿意放弃，还在乎什么？他要保证的是更长时间里的利益和正确性。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p78","index":78,"text":"“冤冤相报何时了”，佛教喜欢讲这个。我看西方很多电影、电视剧，常见的是以眼还眼、以牙还牙：被欺负了，先忍，忍不了就报官；正义得不到伸张，最后自己干，一定要让恶人得到报应。但佛祖看的，是更长远的未来。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p79","index":79,"text":"在轮回这个说法里，你甭管谁对谁错，最后互相咬在一起，这一世你咬我，下一世我咬你，两个笨蛋碰到一块，叫众生恒定向下。所以才说冤冤相报何时了。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p80","index":80,"text":"时间跨度足够长，目标不再以这一世为中心，你的目的、方式方法都会变，甚至出现大智若愚：放弃当前的利益，去保证长久的利益。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p81","index":81,"text":"历史上也有这种例子。我想到明朝的徐阶，跟严嵩周旋，能隐忍那么多年，一有机会就把严嵩父子弄下去了。大家以为他该长期做首辅了吧，他却当了几年，扶起下一代，就回家了。下一代是谁？我记得是张居正。据说徐阶七十多岁才去世。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p82","index":82,"text":"在古代，七十多岁已经很厉害。我看这个故事，注意的是他有接班人，能平安落地。再看张居正，很聪明，我还记得有说法，说要不是有人从中作梗，他有机会连中三元。可最后整个家族出了事。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p83","index":83,"text":"你作的选择，能不能让自己、政策、家人、后人一直有利？不能只看当时没人动得了你，还得想十年、三十年、五十年之后，甚至你这一辈子结束之后。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p84","index":84,"text":"你能得到什么，家族能得到什么？智慧主要考虑的就是更长远的时间。比如张良，帮刘邦打完天下，一拍屁股走了。还有范蠡，帮越王勾践之后也走了，走之前还劝朋友赶紧走。舍不得，没办法，最后还是被勾践弄死了。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p85","index":85,"text":"再看胖东来。一个做超市的，在没有名气的时候，要建立信任是极难的。但这种东西，你坚持到一定程度，爆发出来的力量，别人很难对抗。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p86","index":86,"text":"我举个“315曝光”的说法，就算你去曝光，人家也可能不搭理，因为当地已经建立了那种信任。可这个信任，没有几十年的痛苦期，很难建立起来。以后我们还会讲“一切都是自己的错误”。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p87","index":87,"text":"还有“他人即世界”。你说，人不为己，天诛地灭，为什么出错了，却先想是不是自己做错了？就算别人错了，也想，我为什么会招来这个错误？为什么跟一个容易出错的人接触？","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p88","index":88,"text":"看着挺蠢，好像什么都往自己身上找。但你真这么想，还坚持下去，在我讲的整个轮回尺度里，上升会很快。很多东西就是大智若愚，眼前看着蠢，长远却很正确。《道德经》里的不争而得、无为而无不为，还有“一曰慈，二曰俭，三曰不敢为天下先”，都有这个意思。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p89","index":89,"text":"先问拥有智慧是为了什么","level":2,"key":false,"section":"ep10-p73"},{"id":"ep10-p90","index":90,"text":"说了这么多，聪明和智慧的区别大概清楚了，能不能具体定义一下？定义之前，先用意义法则问：我拥有智慧，目的是什么？它能解决什么问题？","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p91","index":91,"text":"别什么都觉得好，这个也要，那个也要，要完了却不知道有什么用。别读了半天《心经》，除了心静一点，什么都没弄明白；读了半天《金刚经》，只说这有智慧，却说不出它能解决生活里的什么问题。先问目的，这才重要。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p92","index":92,"text":"所以我们先不急着下定义，先说拥有智慧，能解决生命中的什么事。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p93","index":93,"text":"它可以让我在更长久的时间里，处理问题、做事情，一直处于正确且有利的状态。能保持多久？看你的本事。智慧越高，能顾到的时间就越长。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p94","index":94,"text":"如果连聪明都没有，可能连一瞬间有利都很难做到。比如跟人吵架，对方骂你，你生气，揍了他一下，出了口气，爽了。这个当下，你觉得自己“正确且有利”。可打完呢？人家打110，要赔钱，未必占理；如果验出轻伤，还可能牵涉刑事责任。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p95","index":95,"text":"接下来考公、考编、工作，都可能受影响。为了一时痛快，把更长久的生活弄出问题。骗人也是，短期获利，时间越长，被发现的可能性越大。早晚被发现，名声就臭了。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p96","index":96,"text":"企业也一样，急功近利、做假账、乱忽悠、乱承诺，早晚要出问题。现在看起来有利，长期呢？很麻烦。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p97","index":97,"text":"职业经理人要靠业绩，有些行为就是短期促销，像给企业打强心针。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p98","index":98,"text":"经济上涨时，大家都往上走，这种办法比较好使；一到大萧条，我看更容易扛住的往往是家族企业，因为它能接受一段时间的波动。我记得李嘉诚的儿子有次投资亏了，就一直拿着，等了十多年，地产挣钱了再卖。换职业经理人，你可能不会给他这么久。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p99","index":99,"text":"再看明星，有飞机、游艇、别墅，甚至私人岛，异性追求也多。从人生看，很成功，简直是现代人的典范。可要从死后、轮回的角度看，在我这套说法里，这是不是大量燃烧福报呢？","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p100","index":100,"text":"辛辛苦苦攒的福报，拿来在这么个地方充大爷。从另一个尺度看，就会有另一种判断。王朝、家族也一样。比如朱元璋，从乞丐一路打到皇帝。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p101","index":101,"text":"中间经历多少九死一生。他想让子孙后代享福，让全国人都为这个家族服务，能不能做到？短时间可以，二百多年。可二百多年之后呢？按我讲的因果，整条家族线都要承担这些东西，后面可能很难再翻上来。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p102","index":102,"text":"如果我有这个机会，我会学华盛顿。拼，可以；开国之功、功德、福报，可以拿。但别把一切都归自己家。你能拿住多久？","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p103","index":103,"text":"权力争斗大的地方，九死一生终于上去了，又得为了保住位置继续斗争，折腾、抓人，想提前退休都不敢。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p104","index":104,"text":"中国皇帝里，能主动说退休的有几个？乾隆当太上皇，说不想超过爷爷的在位时间，算一个。很多人都等到死，因为中间怕有变数。争位置已经很累，为了保位置，又得折腾一堆。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p105","index":105,"text":"最后没有哪个人、哪个家族能永远保住。一辈子保住了，家族延续几十年、上百年、二百多年，很厉害，可最后仍然是一场空。那就得算，为了这二百年的东西，付出多大代价，值不值？","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p106","index":106,"text":"尺度不一样，值不值就不一样。搁我，我觉得开国之功很好，但别硬跟家族绑在一起。家里人真有能力，大家竞选选上了，你就上；没能力，就别坐那个位置。做共和制，对自己和整个家族的影响，在我看来更小。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p107","index":107,"text":"好，回到智慧。目的已经出来了：在更长的时间里，让自己处于正确且有利的状态。多长？看你的本事。目的明确，就可以给定义了。","level":0,"key":false,"section":"ep10-p73"},{"id":"ep10-p108","index":108,"text":"三 智慧的定义与定义的边界","level":1,"key":false,"section":"ep10-p108"},{"id":"ep10-p109","index":109,"text":"为什么认知、思维之后还要加行为","level":2,"key":false,"section":"ep10-p108"},{"id":"ep10-p110","index":110,"text":"在更长的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维和行为，我们称为智慧。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p111","index":111,"text":"前面是目的，后面是实现这个目的所用的东西。为什么除了认知、思维，还要加行为？因为想对了，你还得保证行为一直有效。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p112","index":112,"text":"很多人知道减肥好，可我饿呀，最后还是做不到。你知道方法，却没法达成行为，那对你还不能算智慧。所以要把行为加上。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p113","index":113,"text":"换一种说法：以长远视角，依靠认知、思维、行动，推动事态向正确且持续有利的方向发展。这也可以作为定义。你愿意用哪一种都行，只要说得清楚。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p114","index":114,"text":"终极智慧、圆满智慧与绝对正确","level":2,"key":false,"section":"ep10-p108"},{"id":"ep10-p115","index":115,"text":"什么叫终极智慧？就是在无量劫的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维与行为。这里的时间就明确了，是无量劫。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p116","index":116,"text":"终极智慧和圆满智慧有什么区别？比如我在养生上有一套办法，按照它做，在无量劫里身体都好，这是养生方面的终极智慧。圆满智慧，则是在全方面、各种各样的事情上，都能在无量劫的尺度里做到正确且持续有利。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p117","index":117,"text":"为什么用无量劫？上面还有没有别的时间维度？可能有，但不在我们的研究范围。我们学的东西，以佛教能发现的最高世界维度为主。我认为上面还可能有别的，但出了轮回，跟这里讨论的事就没关系了。我们先关心轮回之内，怎么让自己更厉害。轮回之外，不知道。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p118","index":118,"text":"这又带出一个东西，叫绝对正确。有绝对正确吗？不好说。在人间，学知识、挣钱、过好生活，很多商业行为看起来正确；换到天道角度，可能只是消耗福报，没什么意义。再到无量劫，又可能是另一个态度。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p119","index":119,"text":"无量劫之上呢？能保证佛祖看到的就一定正确吗？也不一定。但现在你能接触的最大老大就是佛祖，人家愿意跟你说点东西。你要找鸿钧老祖、菩提老祖，影儿都见不到。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p120","index":120,"text":"所以你现在能得到的认知上限，大概就是这个范围。佛祖在他所认知的空间、佛界和轮回所囊括的范围里，认为这套办法最正确，才会有无上正等正觉这样的说法。出了这个范围还对不对？不知道，就先不用想。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p121","index":121,"text":"意义思维最大的意义，就是跟你没关系、不能在你身上起作用、又无法验证的那些理论可能性，先放一边。空空、无无、无无无，关你什么事？这样心就放宽了。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p122","index":122,"text":"所以我们说有绝对正确，一定要加括号：有范围。在轮回、无量劫这个范围，在佛祖、道祖的认知体系下，按那些方法走，几乎不会出问题。我们在这个意义上称它为绝对正确。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p123","index":123,"text":"描述了表现，不等于解释了本身","level":2,"key":false,"section":"ep10-p108"},{"id":"ep10-p124","index":124,"text":"这就是我们总结的智慧、终极智慧、圆满智慧。再看看古人怎么说，你就能听出以前《问道》讲觉醒、解脱时提到的那个问题：描述性的解释。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p125","index":125,"text":"比如拆字说“智”，上面一个知，下面一个日，每天多知道一点、多积累一点，叫智。“慧”下面一个心，上面的部分好像扫掉灰尘，把心上的灰尘扫掉，让心干净，叫慧。这是用字形来形容。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p126","index":126,"text":"每天多知道一点，只是达到智慧所需的条件之一；心干净一点，是帮助你作出正确决定。它们都是认知、思维、行为所需的一部分，不能拿其中一条代表整个智慧。这就是描述性的解释。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p127","index":127,"text":"《六祖坛经》怎么说？我这里摘的意思是：“善知识，何名般若？般若者，一切处所，一切时中，念念不愚，常行智慧，即是般若。”说人话，就是不管什么时候、什么地方，每个念头都不愚钝，就是智慧。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p128","index":128,"text":"这就是我特别讨厌的那种描述性的解释。看似解释了般若，或者说般若是到达彼岸的智慧，可智慧究竟是什么，般若究竟是什么，还是没说。只告诉我必须时时刻刻不愚钝，那我怎么做到呢？","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p129","index":129,"text":"就像你说，一个成功的人，要幸福，有钱、有权，没人欺负，想怎样就怎样，自然活得自在。可我问的是怎么达到，用得着你描述那个样子吗？再看《大乘义章》，它区分智和慧，我就不念古文了。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p130","index":130,"text":"大概说智是懂得世间的事，慧是照见根本真理。怎么看到？还是不知道。《大智度论》又说，般若在一切智慧中最为第一，无上、无比、无等、无更胜者。你说它最好了，可它究竟是什么？又没说。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p131","index":131,"text":"说般若是到彼岸的智慧，彼岸是什么？那个智慧是什么？有的说什么都不执着、不抓，不贪、不困。这算不算智慧？这只是达到目标时，不被一些东西影响的一种方法。能说我的耳朵就是我吗？","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p132","index":132,"text":"还有说，般若在哪里，佛就在哪里，般若波罗蜜是诸佛母。这还是在描述。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p133","index":133,"text":"我又搜了一些《大智度论》的说法：卷四十三，说一切智慧中最高、无上无比无等；卷十八，说照见一切事物真实本质；卷八十四，说能从此岸到彼岸；卷七十七，说像虚空一样没有固定形状；卷一百，说是一切佛的母亲。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p134","index":134,"text":"这些都在形容般若。听完之后，你能告诉我具体怎么修、在生活里怎么应用吗？这就是我说的，净说些不管用的话。还有我看到归在朱熹名下的“智者自知其所不知”，知道自己不知道。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p135","index":135,"text":"这当然算智慧的一种表现，可不能说它就是智慧。像镜子、像虚空、像秤、像深谷，这些都只是某个方向的表现，是描述状态，不是解释本身。一个人下定义，如果只是描述现象，按我的判断，他最多抓住了一个代表现象，还没弄懂本身。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p136","index":136,"text":"我也承认自己有不懂的。什么是爱，我想了两年，到现在也没法下定义。能举很多案例、很多现象、很多描述，但我觉得那不是爱的本质。也可能爱本来就没有定义，可能我水平低，理解不了；也可能它就是混沌的，不应该有理由，甚至不应该有目的。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p137","index":137,"text":"我承认自己智慧水平也不高，这东西定义不出来。好，既然说古人不够，咱们得来点实在的：怎么提升智慧？这才是关键。要提升，得在六个方向上进步。","level":0,"key":false,"section":"ep10-p108"},{"id":"ep10-p138","index":138,"text":"四 提升智慧，要补哪些东西","level":1,"key":false,"section":"ep10-p138"},{"id":"ep10-p139","index":139,"text":"六个维度，不能只看眼前","level":2,"key":false,"section":"ep10-p138"},{"id":"ep10-p140","index":140,"text":"比如想挣钱，什么叫挣钱的智慧？得保证钱越来越多，自己还一直安全。别像我前面说的许老板，钱挣着了，后面出了事；也别像黄老板，挣了钱，被关进去，放出来之后又作了几个决定，输得更惨。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p141","index":141,"text":"还有贾老板，钱挣着了，却不敢回来，一堆人骂，何苦呢？真正要想的是，钱我要挣，我开心，大家也开心，同时我还安全。这才叫挣钱的智慧。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p142","index":142,"text":"第一个维度，远度。智慧解决的是长久问题，至少先保证这一生没问题。就算你说我死之后哪管洪水滔天，那这辈子，钱总得花到吧？别人没死，钱先没了。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p143","index":143,"text":"第一目标，人死了，钱正好没了。再好一点，人走了，钱还在，后代有花销，产业能继续，功德还持续增加。这个才厉害。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p144","index":144,"text":"所以先考虑长远：更长时间里，这个事对不对，会不会带来问题？第二个，提升高度，主要是认知高度。对事情的理解，要不停往上拔。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p145","index":145,"text":"第三个，全面不全面。了解不全面，就容易出意外。第四个，当前利益合不合适。第五个，未来利益合不合适。第六个，取舍，看你到底要什么。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p146","index":146,"text":"比如背叛、出卖信息，只要当前利益，对未来抱侥幸，就容易作出愚蠢决定。在我讲的累劫轮回里，这不只是卖几个信息的事。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p147","index":147,"text":"我记得一几年的时候，有个哥们特别喜欢出去玩，北京嫌贵，就往天津跑，说有个叫“繁花”的场子，比北京便宜一些，质量还高。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p148","index":148,"text":"他找小姐，还说：“我给她钱，她开心，我也开心，大家都开心。”我说，你理解的都是短期。更长期呢？你以为这次碰过，以后不见面，就没关系了？","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p149","index":149,"text":"按我这里讲的因果，累劫轮回里，两个人可能还会被各种关系拴在一起。石头丢进水里，你不知道涟漪最后影响多大。所以要从这六个维度考虑。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p150","index":150,"text":"读书、实证与前人的经验","level":2,"key":false,"section":"ep10-p138"},{"id":"ep10-p151","index":151,"text":"常规怎么提升？第一，读书，读有用的书。这就是为什么讲智慧之前，先给你们讲知识分类。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p152","index":152,"text":"读世界名著、《三体》《百年孤独》，可能有感悟，但按我这里提升智慧的目的，不会有特别大的帮助。我重视的是那五类：真相，认知和方向，心性和人性，实操，人情世故。时间花在这些以外的东西上，可能是在浪费生命。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p153","index":153,"text":"当然，生命有时候也需要浪费。我今天研究这些东西，上厕所也刷剧。该浪费就浪费，不能太浪费。读书有帮助，但书本只是人类现有认知和知识体系的一个上限，未必解决你的全部问题。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p154","index":154,"text":"知识大爆炸之后，读到更多东西，确实能更厉害。现在又逐渐走向大V时代，尤其一些海外的知识博主，讲政经、生活、时事，他们对事态的看法，有时比读很多书更有用。这也是一种方法，别走错路。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p155","index":155,"text":"第二，科学实证，通常在管理、工程或具体事情上用。比如盖大厦、修水坝，希望五十年、一百年不塌，就需要大量科学实证，保证更长时间里不出问题。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p156","index":156,"text":"第三，哲学、国学，智者的书，伟人的实践和人生金句，能不能提升智慧？可以，但也有上限。你学国学，学的是什么？我看主要是佛经、道经，再加上孔孟、王阳明、曾国藩这些人的东西。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p157","index":157,"text":"他们对世界的看法、对事物的定义，能帮助你活得更好，少犯人生错误。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p158","index":158,"text":"但也会出现前面讲的问题：听不懂，用不上，不明白意思，操作不了。六祖偶尔说一点，弘一法师偶尔说一点，我把它叫星星之火，难以燎原。算不算火？算，有帮助，只是还不够。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p159","index":159,"text":"要是这些东西已经把问题解决了，人类怎么还普遍不觉醒、不解脱？在我讲之前，连觉醒、解脱的定义都说不清，又凭什么觉得真正理解了世界，知道它怎么坑你？好，再说易学占卜、法界成相。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p160","index":160,"text":"占卜可以辅助，不能当拐棍","level":2,"key":false,"section":"ep10-p138"},{"id":"ep10-p161","index":161,"text":"能不能解决智慧的问题？我认为能解决一部分。因为智慧是让人在更长时间里正确且有利。如果直接看这件事十年、一百年之后的结果，就能辅助判断现在的选择。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p162","index":162,"text":"可没有核心方法，你看再多，最后可能都是不好的结局。为什么？智慧拼图没拼好，木桶的木板没搭全。改一个，占卜一下，失败；再改，往前走一点，又失败。因为你不知道一个事物要长久稳定地成功，需要多少条件，可能几百、上千个点，各方面都得优秀。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p163","index":163,"text":"所以我说，成功的人类千篇一律，失败的人类各有不同。任何一点出问题，都可能走不到那个位置。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p164","index":164,"text":"你说走A不通，走B不通，走C也不通，可能正确的路是先A，再B，再C，再回A、回B、回A。它是这么一条路。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p165","index":165,"text":"你自己穷举去吧，很难穷举出来。未来又像一棵树，有很多分岔，任何小错误都可能让未来不同。所以这个方法，在我的理解里，至少能让你在事情发生前，先看到一些未来影像。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p166","index":166,"text":"但前提是占卜得正确。第一，即使占得对，看到的也可能全是不好的结果；第二，你又不能保证占卜百分之百正确。所以不是完全不能走，是很难走通，不能把它当拐棍，辅助验证可以。这也是我一直说“法界成相”的意思。好，喝口水。","level":0,"key":false,"section":"ep10-p138"},{"id":"ep10-p167","index":167,"text":"五 冥想与悟，分别在说什么","level":1,"key":false,"section":"ep10-p167"},{"id":"ep10-p168","index":168,"text":"我讲的冥想四个境界","level":2,"key":false,"section":"ep10-p167"},{"id":"ep10-p169","index":169,"text":"第五种增长智慧的方法，打坐、冥想、感悟，好使不好使？有人会说，佛祖不就是在菩提树下打坐悟道的吗？凭什么说我不行？我就敢说，你去打坐，未必好使。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p170","index":170,"text":"这个本来要放在《法界天机》里讲，这里稍微穿插一点。不是所有打坐、冥想都能得到有用的东西。就靠打坐得到有用东西的人，我特别佩服佛祖和达摩。其他人不是完全不能成相，但也有条件。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p171","index":171,"text":"这里涉及两个事，一个冥想，一个悟。我把冥想分成四个境界。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p172","index":172,"text":"第一个，让自己静下来。很多人能做到，这件事本身有用。如果连静都静不下来，我认为要看环境磁场，有没有师父或法阵帮着清理，还要坚持一段时间。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p173","index":173,"text":"第二个，偶尔看到影像。一个人、一幅画面，甚至一句话，在我的说法里，都叫法界成相。可能是仙家、法界师父，也可能是前世的一些碎片记忆，通过这个方式沟通上了。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p174","index":174,"text":"但如果只是偶尔看到一点，我只能说沟通能力很一般。看完一段前世影像，想明白一件事，有没有可能？有。可想靠这点东西全面觉醒，想都不用想。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p175","index":175,"text":"我常把它比成电视机和电视台。上面得打信号，你这台电视也得能成像，有电、有天线。老电视一开，全是雪花，你得调台，同频共振。甭管仙家、师父，还是佛祖菩萨，信号打下来，你收到了，才出现影像。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p176","index":176,"text":"当然，我这套说法里，也可能有别的信号，灵敏度高，什么台都能收到，还可能串台。以后讲法界成相再细说。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p177","index":177,"text":"第三个，入境，能稳定进到一个境界里，待几十分钟，甚至几天。不是偶尔闪一下，而是持续传输，大量往脑子里灌知识。那得问，你有大号吗，上面有师父吗，能定在那个境界里吗？都做不到，谁给你传？","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p178","index":178,"text":"我有大号，我老婆也有。我的大号主“忽悠”，研究道法，走文的，传这些知识没问题。我是从他那里分出来的一部分，同频共振比较方便。你跟师父关系再好，也未必是同一个东西出来的，沟通可能就费劲。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p179","index":179,"text":"有大号还得看大号干什么。前几天说有个小姑娘是嫦娥的小号，长得挺漂亮，连上嫦娥，传点舞蹈知识可以；要传认知、佛法，那就未必是她擅长的。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p180","index":180,"text":"我媳妇的大号要是给她传，估计传的是怎么揍我，人家是练家子。我在法界从来没打赢过她。那边不论体重，论法力。她在人间只有我一半体重，到了法界，谁揍谁还不一定。很郁闷啊。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p181","index":181,"text":"第四个，最厉害的，是在入境中大量进行认知同步。我把佛祖在菩提树下的经历理解为这个。此前他还迷茫，后来放下一切，打坐几天，认知同步了，再看世界、再说话，底气就不一样。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p182","index":182,"text":"所以还得看大号是谁，是不是传法、研究智慧的。不是干这个的，连上也未必有用。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p183","index":183,"text":"就像有人说念阿弥陀佛就能往生极乐世界。在我看来，有些教这些方法的人，本来就是从佛界来的，完成任务、不犯大错就能回去。对他好使的方法，不见得直接放在你身上就好使。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p184","index":184,"text":"佛教、道教都有很厉害的人，他们的修行方法没错，但可能只适合他们自己。这几千年打坐的人多，有几个悟道？就算说悟了，留在人间的思想、文献又有多少足够高级？所以我的判断是，还是条件没接上。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p185","index":185,"text":"悟的五种方式","level":2,"key":false,"section":"ep10-p167"},{"id":"ep10-p186","index":186,"text":"再说悟。一个竖心旁，一个吾，我把它理解成，有个东西把你串通起来了。这个东西挺麻烦。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p187","index":187,"text":"第一，通过学习。学到好的知识、好的素材，明白更多，就有更大机会悟。学习对提升智慧和认知很有帮助。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p188","index":188,"text":"第二，点。某件事想不明白，有个明白的人点一下：“你为什么不这样做？”突然就通了，不一定费多大劲，这叫点。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p189","index":189,"text":"第三，传，有传承的。一般涉及道家的术法，或某个派系。比如我用的紫微、紫占，按我的说法，要有星辰殿的仙骨，才有灵感。大家同时为一个问题起卦，我用手指点出的盘，可能就更容易解。那一下代表机缘，方便我看。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p190","index":190,"text":"所以才会有仙骨、仙根、传承这些说法。不是那个传承，想学就费劲。密宗、道术、法术，也不是想学就能学；得属于那一派，祖师爷认可，手势、开光、请仙才好使。别人照着学，未必有用。这是我说的传。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p191","index":191,"text":"第四，因果碰撞，很重要。将来红尘道场里，我可以教无数知识，可你能不能真正领悟，还得靠碰撞。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p192","index":192,"text":"学完反复练，能不能精通、真正明白，不一定。可能帮别人做了一件事，经历了一个案例，突然一下懂了，这就叫因果碰撞式的领悟。告诉你了，跟你能应用，是两码事；明白了，跟真的通透，也是两码事。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p193","index":193,"text":"按我的理解，这种咔一下悟到的东西，轮回不散，一直能应用。有些学生说，很难感到慈悲、大爱和不恨。我讲了很多，可那是我的东西，不是他的。我只能告诉你我的理解，能不能触发你的感悟，不一定，也许时间还没到。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p194","index":194,"text":"有一天，突然一下，原来就是这样。像《庆余年》里的大宗师，需要那个机缘，可能一生就那么一次，感觉找到了，就上去了。我拿范闲举例，他有那个感觉却没继续，后来再怎么突破，也只是无限接近，始终到不了。这是我借小说打个比方，悟有时候就是那么一种感觉，feel。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p195","index":195,"text":"第五，像我这样，也是悟的一种，叫认知同步。我这个人极懒，仙家还说，你一天打坐半小时不行吗？我还是不想。你要让我看半小时小说，没问题。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p196","index":196,"text":"这两天大忏悔又有点懈怠，明天得坚持。给自己找了很多理由，说忙、没时间，其实呢？","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p197","index":197,"text":"今天累计看小说也有两个小时，找到个很多小说改动画的地方，看进去就没退出来。我不愿意打坐，大号就没时间给我传；他们还老在凌晨一点到三点传，挺讨厌。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p198","index":198,"text":"我现在的招是，研究不出来就先不研究，上个香，跟大号说：“不会了，你们自己努力。”我该干什么干什么，打游戏，喝点小啤酒。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p199","index":199,"text":"有时候凌晨三点传，我自己有感觉。过两天再想，突然就有感觉了，眉飞色舞。所以我本着能不干活就不干活，能让大号干就让大号干。你们在佛界，跟我这个小脏号较什么劲？你们干，我享受人间，该传给大家的照样传，不耽误。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p200","index":200,"text":"说白了，有些东西我自己想也想不明白，那就让他们干完传过来。这是我自己的方式。","level":0,"key":false,"section":"ep10-p167"},{"id":"ep10-p201","index":201,"text":"六 智慧要能在人间用起来","level":1,"key":false,"section":"ep10-p201"},{"id":"ep10-p202","index":202,"text":"为什么不能只带一套高处的道理下来","level":2,"key":false,"section":"ep10-p201"},{"id":"ep10-p203","index":203,"text":"所以打坐、冥想、感悟能不能提升智慧？这是宗教里常见的方式，但在我看来，多数情况下，光这么做不好使。偶尔想明白一点事，和全面解决问题还是两回事。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p204","index":204,"text":"前面征集过大家的问题，这里集中说几个。有人问，能不能直接有个大菩萨、佛祖转世下来，把道理告诉人间？我认为不行，已经试过很多次了。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p205","index":205,"text":"越高级的上位面生命，越干净、越简单，也越容易沟通天地。比如最近我说生成了道魂，上面的大领导还问，怎么目光看着有点呆滞？其实是清明、简单。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p206","index":206,"text":"可在下面生活不一样。要是直接下来就能解决问题，还用得着我们这样的人吗？上面的智慧带得下来，却未必能让人在下面活下去。太干净、太简单，出门就可能被骗。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p207","index":207,"text":"所以我讲的办法，是让至高佛界、至高道界的人，转世到较低、较脏的位面里经历。我一直说，天道掌握轮回门，就很难有真正的敌人。你总要生孩子、要繁衍，下一代是谁，可能就不是你决定的了。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p208","index":208,"text":"我理解地藏王菩萨，就是从佛界转到幽冥鬼界，再一点点成长。所以既懂佛法，又熟悉那个环境，才能创造出在那里可以用的佛法。普通佛法直接搬过去，未必好使。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p209","index":209,"text":"人间也一样，要经过漫长时间，熟悉人间、魔界、碎片空间、夹缝空间这些环境，再结合佛界、至高道界的东西去讲，才能贴合。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p210","index":210,"text":"还有人问，很多人聪明、能挣钱，为什么你说从法界看不算有智慧？因为他现在的所作所为，不一定让未来的自己更舒服、更快乐、更幸福。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p211","index":211,"text":"比如我对考公务员就常有这个疑问。你没有相应条件，又想上升，好不容易到一个位置，后面还有很多限制和风险。我有个朋友，七十岁，因为很多年前牵扯到一些事，据我了解被判了十五年。也曾经是个优秀的人，这一辈子何苦呢？如果一条路很难善终，为什么非走？","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p212","index":212,"text":"挣到钱的老板也是，要看自己所处的时期，看看历史，比如汉武帝后期发生过什么，去读读冯唐讲《资治通鉴》的东西。读书得读有用的，时政也得看。知道了却舍不得走，后面又可能走不了。聪明了一辈子，最后没办法善终，何苦呢？","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p213","index":213,"text":"一条至高智慧，还需要别的东西配合","level":2,"key":false,"section":"ep10-p201"},{"id":"ep10-p214","index":214,"text":"无上正等正觉算最高智慧吗？“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提。”在我的理解里，这是增加能量、增加福报的至高智慧。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p215","index":215,"text":"但只拿这一条在人间活，没有其他东西辅助，你可能走不到底。这一条的原则没问题，可还得掌握别的东西，包括怎么在长久利益、短期利益之间取舍。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p216","index":216,"text":"什么叫智慧圆满？各种事情，都能在很长的时间里，保证正确且有利。做不到，怎么叫圆满？","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p217","index":217,"text":"比如我说观世音菩萨给我的智慧打分，有时八点五分，有时八分。如果十分是满分，差的那一点五分、两分，就代表某些事情，我现在的认知还不能确保所作所为在未来圆满，可能带来伤害，或最后结算拿不到满分。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p218","index":218,"text":"我现在也就是百分之八十到八十五做得还可以，其余仍有想不明白的。也知道某些地方不对，可能修行不到，还是不愿意选择，没办法。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p219","index":219,"text":"怎么升级？不断磨练。在利益众生、帮人解决问题的时候，要能指出对他长远正确且有利的方法。他愿不愿干，是他的事，至少你能指出来。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p220","index":220,"text":"《人类说明书》要干的，就是懂了理论之后，带大家解决生活里的点点滴滴：怎么做，怎么想，怎么保证执行，才能更长久地正确且有利。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p221","index":221,"text":"讲那么多真相，是让你清楚一个决定怎么推导出来。但知道真相不是最后目的，目的是解决方方面面的事情。指望所有人自己总结应用，不现实，那就告诉他结果，带着练习，重新建立所思、所想、所行的方法。所以需要红尘道场，帮助大家练得更全面、更高、更长久。","level":0,"key":false,"section":"ep10-p201"},{"id":"ep10-p222","index":222,"text":"七 建立智慧思维体系的十二条","level":1,
