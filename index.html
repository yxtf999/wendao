<script type="application/json" id="site-data">{"version":"2026-10-11","title":"问道·直播试讲先行版","courses":[{"id":"ep1","number":1,"name":"问道一","title":"系列开篇总序","speaker":"悟聊天尊","source":"20260724_问道1_系列开篇总序_整理稿.docx","date":"2026-07-24","description":"从问自己、答众生出发，认识课程的缘起、讲述规则与学习方式。","blocks":[{"id":"ep1-p39","index":39,"text":"一 开场与课程安排","level":1,"key":false,"section":"ep1-p39"},{"id":"ep1-p40","index":40,"text":"近况与现场交流","level":2,"key":false,"section":"ep1-p39"},{"id":"ep1-p41","index":41,"text":"大家晚上好。红烧狮子头，这是啥玩意？最近的气色还行，主要睡眠质量还可以。现在可以平躺在床上睡觉了，气色就还行，以前基本上晚上都得疼醒好几次。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p42","index":42,"text":"声音比较小？给你们来个声音大的版本。现在声音如何？哈哈，二群太能注水了，这几天不看几千条，你们都说啥呢？我天呐。没什么事就别老乱聊，以后单独给你们弄一个群，叫什么闲聊群。说正事的时候，在那群里说。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p43","index":43,"text":"声音洪亮，晚上好。你这太能唠嗑了，你看其他群都不咋说话，就你们二群，疯了一样。今天好好吐槽。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p44","index":44,"text":"胳膊很不错，正常的都没什么问题了。现在练习，第一个星期真的挺疼，吃止疼药好像也不太管用，但是练着练着，有点练开了。现在什么叉腰、提裤子，都问题不大。背手的话，你得容我两分钟，得给它活动一下才行，不活动一下还是背不了手。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p45","index":45,"text":"现在把伤疤都给盖住了，这个还行，头型略有变化。但是每次用手摸的时候，想想人生总要有缺憾，少了一块，从头到尾少了一块，真也没办法。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p46","index":46,"text":"还可以再长长一点。上次找了一个理发师，结果给我理得感觉不是很好，没有发挥出我的优势。下次换一个，这不行，还是用之前的。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p47","index":47,"text":"就别夸了，我跟你说，最近总教主下来给我看了一下，我慢太高了，都达到五分了。分别心太高。我发现自打研究人类说明书之后，天天看一堆人都跟看……似的，你老觉得别人是……你说这个分别心能小得了吗？","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p48","index":48,"text":"你当然就觉得，这两千五百年大家都研究不出来的东西，我终于研究出来了。我说这看一切众生、看一切圣贤都跟……似的。所以最近有点压不住，我现在需要淡定。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p49","index":49,"text":"不，总教主人家不按百分制，人家按十分制，所以就相当于五十分了。最近这方面不太行，像贪念、嗔怒什么的都还行，就我慢之心有点压不住。对，那确实就是五十分。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p50","index":50,"text":"问道系列与四个阶段","level":2,"key":false,"section":"ep1-p39"},{"id":"ep1-p51","index":51,"text":"好，咱们正式开始了，不耽误大家时间了。大家晚上好，我先说一下咱们的情况。等了这么多年，终于成熟了，咱们从今天开始说《问道》系列。这其实也是人类说明书的一个系列，只不过起了一个更正式的名，一会我们做正式版本的时候再说。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p52","index":52,"text":"我们未来的正式版本叫《问道》。但是你看，越是正式的，我们越希望：很多人都能听得懂，一个是咱们老朋友能听得懂，一个就是从来都没听过的人也能听得懂。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p53","index":53,"text":"大家在群里的都看了说明书。咱们整个人类说明书，一共是四个阶段：逆修觉者、灵魂觉者、法界天机，还有道法自然。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p54","index":54,"text":"咱们现在讲的是逆修觉者阶段。逆修觉者阶段就没有任何封建迷信的东西，没有任何神佛仙的东西，主要处理的都是真相，还有思维模型。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p55","index":55,"text":"越是正式的东西，我越是比较谨慎。我们需要大家先提前听，比如我直播的时候，先按自己的稿子直播一遍。这不有四个群嘛，大家疯狂吐槽。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p56","index":56,"text":"吐槽完了之后，如果没有什么太大修改的，我就正式录制。录制的时候，肯定得换一套行头，把头型再梳梳，还得要配图。所以现在讲完了之后，如果没什么问题，会有一些相应的小伙伴得去做一些图。正式版本肯定要配图，这样能成为一个真正可以传播的东西。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p57","index":57,"text":"正式传播与内容规划","level":2,"key":false,"section":"ep1-p39"},{"id":"ep1-p58","index":58,"text":"我们正式的传播是在二〇二七年的春节之后。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p59","index":59,"text":"为什么定这个时间？主要就是你看《推背图》四十四卦，人家本来就是丁未卦，所以咱就必须得在丁未年去干这个事。正式的就是这样，到时候播放的时候，每天一集。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p60","index":60,"text":"我们逆修觉者这块，一共就分三大块，叫天道思维、人道思维和人设思维，三种思维模型。我估计想了一下，大概思维模型两百多集。你光思维模型是这样，还有零散的叫真相。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p61","index":61,"text":"真相就可以不用录得那么仔细，它不像思维模型比较难理解。真相说白了，跟你说这个事，你能接受就接受，不能接受拉倒。反正你活着，怎么着也得接受这个东西。你爱接受不接受，不能接受的话，到时候被这个规则影响了，也是你活该，就属于这种样子。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p62","index":62,"text":"所以真相会很小，有的可能十几分钟就说完了，有的可能要两三个小时，每个真相不太一样。但我尽可能把真相，比如经济的、生活的、工作的、财运的、结婚的、学习的、生孩子的、教育孩子的，还有养生的，都得说清楚。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p63","index":63,"text":"这些东西是你一定会发生的事情，你肯定活在这个规则里，你爱信不信。真相你能接受就接受，不能接受拉倒，反正这个东西不是我去决定的。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p64","index":64,"text":"真相的部分，逆修觉者、灵魂觉者，我估计加在一起怎么着一两千集，还是挺多的。涉及思维模型的，逆修觉者这行，两百多集我估计差不多。你想，咱们光第一期——第一期天道思维这行，现在已经确定了，目录出来的话，七十六集还是七十七集，今天可能又增加了一个，七十七集。因为随时可能增加，减可能不会减了，但加可能随时加。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p65","index":65,"text":"不定什么时候，上面的大号啪给我一个信号：“你小子还差上一集呢，赶紧把这个给说了。”有的时候想不出来，就是憋着憋着，就憋出来了。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p66","index":66,"text":"人道那块，我们先把天道的讲完，讲完之后，我估计可能要休息一个月，就开始再讲人道的，之后再讲人设。我估计加在一起反正是两百多集，差不多。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p67","index":67,"text":"这两百多集，明年二三月份开始放，一天放一集，就得放一年，这还没加上真相呢。你要加上真相，说白了，就基础的、大家能经常碰到的真相，二三百集我觉得还是没什么问题的。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p68","index":68,"text":"比如像ABC运这种东西，就不算什么思维模型，它就是一个真相。你爱信不信，反正你不信，最后他不那么倒霉的时候，你别哭。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p69","index":69,"text":"包括咱们说的叫“人生皆已知”，至少把人生大概可能会发生什么事、什么阶段会发生什么事，大概要说一下。你爱信不信，不信的话，自己碰到的时候别哭就行。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p70","index":70,"text":"包括金融的事情、理财的事情、给自己留点后手的东西，都得去说。我也是一边看着新闻，或者一边看着小说，一些什么东西，正好刷到了，有感悟了，赶紧写。我现在拿一个小本，赶紧给记上，到时候咱们就说这些东西。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p71","index":71,"text":"所以这个东西很多，最后还有案例。你光说理论，不玩案例，肯定没戏。这是一个非常庞大的东西，你想要把人类去改变，怎么可能这么简单？不可能这么简单。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p72","index":72,"text":"直播讨论与定稿录制","level":2,"key":false,"section":"ep1-p39"},{"id":"ep1-p73","index":73,"text":"这个就是咱们整体的发展阶段。我们的方式方法就是，我先用直播的形式，先给大家出大纲。出完大纲之后，先用直播的方式给你录，录完之后大家吐槽。你觉得看得好还是看得不好，看不懂的，我赶紧回来修改。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p74","index":74,"text":"我们要求的就是大道至简，你别看不明白，这个就不行。所以我们的节奏是先出大纲、先出目录，让大家清楚未来讲的顺序是什么。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p75","index":75,"text":"什么时候讲？未来讲得比较频繁，可不是一周只讲一次了。基本上我想好了，觉得写好了内容，觉得可以了，咱就开讲。所以未来讲的时间是不定的，哪天想好了咱就讲，属于这种样子。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p76","index":76,"text":"讲完之后，欢迎大家吐槽，有三天吐槽时间。我再收集一下问题，如果没什么问题，就直接定稿。定稿完之后，我就开始录，同时也给咱们一些做图的小伙伴一些时间，就是这种样子。","level":0,"key":false,"section":"ep1-p39"},{"id":"ep1-p77","index":77,"text":"二 人类说明书为什么现在开始","level":1,"key":false,"section":"ep1-p77"},{"id":"ep1-p78","index":78,"text":"从零散感悟到正式录制","level":2,"key":false,"section":"ep1-p77"},{"id":"ep1-p79","index":79,"text":"好，咱们不多说了，开始《问道》的第一期。首先得跟大家说，终于千呼万唤始出来了，咱们人类说明书正式开始录制。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p80","index":80,"text":"为什么现在才叫正式录制？主要原因是之前讲得太零散了，但是实在也没有任何办法。为什么？天道在给你下发东西的时候，用的是因果碰撞这种方式方法。你这段时间碰到什么事、感悟到什么事，他才让你悟一个东西。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p81","index":81,"text":"我以前都是什么？这礼拜感悟到什么东西了，觉得好像挺有意思，这个时候就开始给大家录。所以大家在听的时候，有些集会觉得很过瘾，有些集就觉得有点放水。不是我放水，关键是实在憋不出来。所以你们看的很多东西都是断断续续的，有很漂亮的集，有很感动的集。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p82","index":82,"text":"甚至我记得在清迈的时候，都临开场十分钟了，还不知道要讲什么。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p83","index":83,"text":"本来想给大家灌水，结果一开讲，上面大号传信息了，一下子灵感就来了，一讲大家还觉得挺满意，会出现这种情况。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p84","index":84,"text":"这就叫顿悟，不能确定什么时候悟，哪天能悟到什么东西你也不知道。但是在长达将近十年的时间里，断断续续，通过看到一些东西、看到一些事，你会对天地之间有感悟。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p85","index":85,"text":"对智慧的理解也在修改","level":2,"key":false,"section":"ep1-p77"},{"id":"ep1-p86","index":86,"text":"所以没办法，我也一直在修改我们的很多东西。比如前段时间，如果三月份的时候，你问我什么是智慧，我还会跟你说，用高维的思维去解决低维的事，这就是智慧。看似是对的，但是再琢磨琢磨，我忘了是因为什么事了，反正突然发生了一件事情。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p87","index":87,"text":"后来我又琢磨，好像不对，这个解释不完整。我就说，好像是从更长远的时间里面，始终保持你的正确性，叫长久正确，才是智慧。你甭管用什么方法，那是方式方法，不管，但是智慧的目的是为了解决这个东西。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p88","index":88,"text":"弄完了之后，你就觉得很牛叉，之前的古人没人总结过这个东西，包括你用AI，你总结不出来这东西。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p89","index":89,"text":"所以我也在成长，也在不停地修改。以后咱们人类说明书，第一版本这么说，第二版本就那么说了，有没有可能？肯定有这种可能。大家不要去怪，允许我在成长。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p90","index":90,"text":"目前从天道上来说，基本上跟我说的是，地基打好了，可以盖楼了。那咱们人类说明书就千呼万唤始出来，正式开始。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p91","index":91,"text":"让人生的每一关有说明书","level":2,"key":false,"section":"ep1-p77"},{"id":"ep1-p92","index":92,"text":"我们为什么起名叫人类说明书？很简单，你看我做阴阳师快十年了，也看了十万次不同的单子，处理过至少几万次不同的事情。我觉得经验还是有的，看过的人生也足够多，我相信很多人这一生都没有看过这么多人。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p93","index":93,"text":"但是你会发现一个问题，实际上最后总结出：大家生生死死，每一世都在干的一个事情是什么？就是迷茫地活着，我觉得都是在迷茫地活着。所以贯穿整个人类、我们这个小世界人类繁衍的过程，其实人真的不知道如何更好地活着。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p94","index":94,"text":"我也非常疑惑，每次都问：你既然要对所有的人进行考核，有因果、有惩罚、有奖励，为什么不告诉大家应该怎么做？一问到这事，人家跟你说天机，死活不跟你说，我也弄得没办法。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p95","index":95,"text":"所以我觉得这事挺奇怪，既然天道和轮回对我们一直处于一种考验，而我们一生之中都被考验着，不停地在做题——不停地解答人生的每一道题，过每一道关，但是他不给你说明书。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p96","index":96,"text":"比如咱们学个知识，是不是还给你本书？你得先学，学完之后给你画重点，再给一些题，你得去做做、刷刷题，再给个考试大纲和考试方向。这个时候定好时间，咱考试。这时候考不过去，那就纯属自己水平问题。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p97","index":97,"text":"我认，我也认。但现在这个东西就太不公平了，上来就考试，啥都不给。考过了，合格；不过，对不起，你就完蛋了，扣分。你说人下来之后，有几个能考过的？所以人生不如意十之八九。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p98","index":98,"text":"有的时候我也在想，天道这啥情况？不给考题，又要考试，你到底想让人过，还是不想让人过？所以我觉得，可能也是天道在给我们机会，别人出不了，我来吧。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p99","index":99,"text":"看了这么多之后，我非常想做的一件事情，就是让大家知道，天底下到底有多少个考题，考试的项目有什么，你需要具备什么样的知识，需要把自己锻炼成什么样子，才能进行一场好的考试，才能保证自己人生的每一关都一定能过关成功。咱别每次都裸考。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p100","index":100,"text":"我一直期待把这件事情做好，但准备的东西实在太多了，用了十年时间去准备，也算对得起这个东西。我觉得基本准备差不多了，至少初期阶段已经够用了，所以咱们人类说明书正式启动。","level":0,"key":false,"section":"ep1-p77"},{"id":"ep1-p101","index":101,"text":"三 问自己与答众生","level":1,"key":false,"section":"ep1-p101"},{"id":"ep1-p102","index":102,"text":"为什么节目叫问道","level":2,"key":false,"section":"ep1-p101"},{"id":"ep1-p103","index":103,"text":"第二个事情，就要跟大家说，既然叫人类说明书，为什么节目叫《问道》？因为我们做的事，最终的结果是人类说明书，但是咱们的形式叫问道。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p104","index":104,"text":"我记得曾经看了一本小说，有个主人公叫王林，《仙逆》，王林。有一集他在梦中轮回，所以做了一个天地大儒，心向往之。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p105","index":105,"text":"人家讲学十年，问道十年。我就打算，虽然水平上赶不上人家，但是时间上一定要超过他。我打算问道三十年，这就是给自己规定的一个东西，是个小目标。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p106","index":106,"text":"实际的东西是什么？两个事情：一个叫问自己，另外一个叫答众生。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p107","index":107,"text":"问自己是什么？我自己也是一样，修行也是一样，带着人生的困惑去追问真相、规则和方向。自己学会问自己为什么。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p108","index":108,"text":"答众生是什么？回答众生的问题，解众生之惑，同时也是圆满自己的一个过程。因为所有的问题、所有的思想，最终叫因果碰撞、思维碰撞。你没有那么多碰撞，想不出来这些事。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p109","index":109,"text":"所以看似你在帮助众生，解答众生的问题，实际上众生也在成就你。我最终想达到智慧的圆满，但是天地之间还有你回答不出来的问题，怎么能说自己的智慧圆满了？","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p110","index":110,"text":"我既然想修十级智慧，现在才八级，这玩意就跟焊一样，老不动了，挺郁闷。但是后来想想也是，天地间有这么多你解决不了的问题，凭什么说智慧圆满？慢慢解决吧，解决得足够多的时候，可能智慧就上升了。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p111","index":111,"text":"从怎么办到追问真相","level":2,"key":false,"section":"ep1-p101"},{"id":"ep1-p112","index":112,"text":"好，咱们再回到问自己。问自己这件事情非常重要。问道中，在人痛苦、迷茫、困惑的时候，不再只问怎么办，而是开始询问：我为什么会走到今天？这件事情背后的真相是什么？我哪里看错了？哪里想错了？我应该按照什么规则重新去活？","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p113","index":113,"text":"你一定要渴望知道真相和一切答案，而不是活在自己的梦境中。这是一种思维习惯。","level":0,"key":false,"section":"ep1-p101"},{"id":"ep1-p114","index":114,"text":"我希望培养出大量敢于提问、敢于质疑、敢于追求真相，也敢于打破现有规则的破法者。这个就是破梦的必要条件。","level":0,"key":true,"section":"ep1-p101"},{"id":"ep1-p115","index":115,"text":"四 从办公室矛盾追问问题本质","level":1,"key":false,"section":"ep1-p115"},{"id":"ep1-p116","index":116,"text":"为什么企业总会发生这些问题","level":2,"key":false,"section":"ep1-p115"},{"id":"ep1-p117","index":117,"text":"举一个最近的事情，你要学会问自己，我正好举个例子。最近我们办公室有一些小问题，发生了跟大家所有办公室都会发生的一些问题。比如员工之间互相有点小矛盾，信息有点不太流畅，说话不太注意。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p118","index":118,"text":"最后产生的情况是什么？第一，产生了误会；第二，让领导者决策上出现了问题；第三，有些员工情绪产生波动；第四，甚至有些员工做出了不太正确的决定。这是所有企业一定会发生的事情。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p119","index":119,"text":"那你作为老板应该干什么？先问问情况，看看谁有问题，实在不行各打五十大板，然后给个红枣，再给一个棒子，再“葫芦葫芦头”，大家继续过吧。这就是传统企业所干的事情。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p120","index":120,"text":"但我们在这里想的是什么？我们绝对不会去想这个事情。你要去想，为什么人类的企业一定会有这样的问题？为什么大家会产生不信任？为什么会产生情绪？","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p121","index":121,"text":"所以你一定要学会从根上找，从高维上看待这个问题，应该怎么解决？更应该解决的，不是谁对谁错。解决谁对谁错这件事情，是低维应该干的事情。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p122","index":122,"text":"就像夫妻吵架，你永远记住，如果从低维上解决问题，这辈子都解决不完世间所有夫妻吵架的事情。他会有各种各样的吵架方式，随着时代变化，有各种各样的理由、各种各样的对错，你永远解决不了。所以最重要的是从高维解决问题。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p123","index":123,"text":"信息透明与验证事实","level":2,"key":false,"section":"ep1-p115"},{"id":"ep1-p124","index":124,"text":"我们第一个说的是，只要办公室出现这种东西，第一件事情叫信息不透明。也就是说，事情的真相和本质你并不知道，只是看到片面。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p125","index":125,"text":"第二件事情，你会发现一个问题，没人去验证。比如谁说谁不好，谁做了一个什么东西，我们大概率不会验证这件事情是否真的发生。但是没有去验证，你会发现什么问题？未必是真实的。就是哪怕这个事情是真实的——大家因为什么原因产生这个事情，每个人的解释是不一样的，你要从更全面的角度上去弄。但最重要的一点，学会验证。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p126","index":126,"text":"因为在天界以上，很难出现这个问题，只有低层天界才会出现。低层天界还会有一点点人间的影子，在高维天界的时候，叫一切皆可查。一起心动念，这个事怎么回事，甚至我都不用知道怎么回事，只是凭一个感觉，就知道谁对谁错。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p127","index":127,"text":"所以叫一切无所遁形。你可以参考三体人，三体人为什么能发展得比人类更厉害？就是因为不会产生管理上的内耗，不可能有人说谎，不可能有人隐瞒事实，不可能有人能够篡改一些东西。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p128","index":128,"text":"所以人类世界，如果在企业上，你不解决大家信息透明的问题，或者在一个企业中大家敢于说话的事情，请记住，你的企业无论做得多大，最终解决不了内耗的问题。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p129","index":129,"text":"最后所有员工，只是在大家发展的时候，我忍了。就像以前我在的公司，马上就上市了，二〇〇六年的时候，有些销售人员拿期权就可以拿将近一千万。你别说别人冤枉你，天天管人叫爷爷都愿意，所以都忍了。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p130","index":130,"text":"但是一旦上市了，大家拿的期权都分完了，那就不忍了。有冤报冤，有仇报仇，都是这种样子。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p131","index":131,"text":"真的去看见别人的优点与付出","level":2,"key":false,"section":"ep1-p115"},{"id":"ep1-p132","index":132,"text":"后来我也在想另外一件事情，一个是信息透明，一个是愿意验证，但第二个事情是什么？你真的爱众生吗？","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p133","index":133,"text":"你会发现，在下意识的时候，别人说有问题、挑别人毛病这件事情，我们天生就会。但是找别人的可爱之处、值得称赞的东西，天生不会。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p134","index":134,"text":"都说修大爱、修慈悲，你有过真正去找别人的优点吗？哪怕有没有多看看别人怎么付出的？你想有一些东西，哪怕他做错了，他在这个事情上付出了多少？加班很晚，自己可能垫钱去弄一些东西。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p135","index":135,"text":"我们一直说修佛，修佛其实最终的两个事情，大爱和不恨。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p136","index":136,"text":"你真的爱众生吗？你不爱他。因为你最习惯的，是别人出问题的时候，第一时间怪他，这个人怎么样。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p137","index":137,"text":"第二，我们在指责别人的时候，总能找出很多东西，但请问你有没有看过别人的优点？应该很少看吧。记住，当你没有这种东西，看不到别人的优点，看不到别人曾经为你的付出的时候——你怎么可能爱他？你不爱他，就不会容忍他，怎么会愿意包容另一个人的错误？你觉得更多的是他耽误了你。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p138","index":138,"text":"所以你没有爱，就不可能产生包容，就会产生恨。你不会做到不恨不怨，愿意让众生在错误中成长。整个企业的所有人，并没有产生这种东西。如果产生了，更多的会是员工之间互相包容。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p139","index":139,"text":"但是我们下意识地，也就是说整个人间界都会下意识地干的这些事情，都是怀疑、指责、甩锅和不信任。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p140","index":140,"text":"最后一定会变成所有员工之间越来越出问题。你记住，你不用去努力。努力去安抚好一些员工，你只能安抚好少数，不可能安抚好多数。你只能对有缘的员工，多一些时间，跟你关系好。但是当这些事情不解决，你都在消耗你们曾经的缘分。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p141","index":141,"text":"包括夫妻之间，如果互相能够看到对方的付出，多去感恩对方，只要对方不是一种二五眼，你记住，夫妻的感情一定会很好，很多事情就不会发生，不会产生指责。这是从本质上解决问题。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p142","index":142,"text":"把佛法用到生活的一点一滴","level":2,"key":false,"section":"ep1-p115"},{"id":"ep1-p143","index":143,"text":"所以，如果我的公司不想经历普通人类公司所经历的这些东西，要从本质上改变。同时也让我更加坚定的，就是佛法生活化，真正入红尘。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p144","index":144,"text":"我之前讲的那些东西，很多只是理论。你记住，看完这些理论不可能成功，因为你不会把它应用在生活的一点一滴，没有真正把佛法应用在身边。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p145","index":145,"text":"就像不恨和大爱这两个事情，你就甭多了，多找、只看对方的优点，包容对方的缺点。把这件事情做到了，才是佛法真正的生活化。做不到这点，学再多也没用。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p146","index":146,"text":"所以学会问自己，没人告诉你答案，你得自己通过现象分析本质，超越一个思维去理解问题的关键是什么。只有这样，才能真正解决问题。","level":0,"key":false,"section":"ep1-p115"},{"id":"ep1-p147","index":147,"text":"五 问道与人类说明书的讲述规则","level":1,"key":false,"section":"ep1-p147"},{"id":"ep1-p148","index":148,"text":"只讲规则与只修规则","level":2,"key":false,"section":"ep1-p147"},{"id":"ep1-p149","index":149,"text":"好，第三个，说咱们整个《问道》和人类说明书，先把自己的小规则订立了。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p150","index":150,"text":"第一个，我们只讲规则，不宣传什么神通、法术这些东西。虽然我干这个干了十多年，客户很多，但是我希望让大家用理性的方法看待这些东西。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p151","index":151,"text":"你一定明白，世间没有神通，所有神通都是高维生物通过规则在影响我们，只是有些规则你摸不着、看不着。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p152","index":152,"text":"就跟你把电话、电脑、电视机拿到原始人那个社会，他理解不了为什么这个东西能出声、能出影。你在用他理解不了的规则改变他，这就是神通。所以没有神通，所有东西都是规则，我们只修规则。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p153","index":153,"text":"包括佛、道，实际上也是修规则。只不过佛用佛看到世间的方式方法，总结了一套东西去修行，这叫佛法。道家也看到天地同样的规则，但用他的东西总结了一套方式方法，这叫道家，仅此而已，没有什么区别，所以最后殊途同归。我们也是只修规则。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p154","index":154,"text":"只讲故事与只谈感悟","level":2,"key":false,"section":"ep1-p147"},{"id":"ep1-p155","index":155,"text":"第二个，我们只讲故事，只闲聊，只谈我的感想和感悟，不对这些东西定对错。你也不要找我去证明，我也证明不了。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p156","index":156,"text":"你找佛祖去证明因果、业力这些东西，我估计佛祖也给你证明不了。你爱信不信，愿意信就信吧，就是这样。所以咱不是传法，传法这件事责任就大了。咱就是闲聊，你能从闲聊中悟到什么，是你的本事。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p157","index":157,"text":"你要是悟不到，就直接当个笑话，当个无聊的单口相声，听了就完了，乐一乐其实也挺好。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p158","index":158,"text":"你看，上面既然管我叫悟聊天尊，虽然我对这个法号很有意见，一点也不大气。人家元始天尊、道德天尊、灵宝天尊，我这就悟聊，说得连贯点就变成无聊了：“你净说点无聊的事。”所以很郁闷。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p159","index":159,"text":"但是毕竟是领导嘛，领导安排的东西最大，我们支持领导安排，认也得认了。要不让你去守一个鸟不拉屎的地方一千年，我估计更惨。所以悟聊就悟聊吧。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p160","index":160,"text":"不许个人崇拜","level":2,"key":false,"section":"ep1-p147"},{"id":"ep1-p161","index":161,"text":"然后，咱们不许个人崇拜，大家都是同修关系。因为你到佛界也都是同修关系，你去叫佛祖，肯定不管他叫佛祖，只能叫同修。咱们也是一样，都是同修关系。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p162","index":162,"text":"这样也让我升高的我慢之心稍微降降。没有师徒，没有师生，都是同修。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p163","index":163,"text":"允许在错误中成长","level":2,"key":false,"section":"ep1-p147"},{"id":"ep1-p164","index":164,"text":"还要允许我在错误中成长。我虽然努力悟了十年，很努力地想把一些东西告诉大家，你说这些东西都一定正确吗？不一定，只能在实践中见真知。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p165","index":165,"text":"它在现实中好使了，就是真的；在现实中不好使，那就扯淡，就属于这种样子。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p166","index":166,"text":"所以未来我发现哪句话说错了，下一个版本就给改了。你说：“你怎么改了？你否定自己。”我凭啥不能否定自己？我最主要的目的，就是更好地帮助大家，所以否定自己很正常。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p167","index":167,"text":"大道至简并讲清过程","level":2,"key":false,"section":"ep1-p147"},{"id":"ep1-p168","index":168,"text":"还有咱们要求的，叫大道至简，这是最需要保持的一个东西。因为我最反感古人屁话太多，要不就是说不清楚，不说人话。所以我喜欢大道至简，只说人话。而且我最讨厌他们只说结果。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p169","index":169,"text":"前几天也是，我这老大观音下来了，我不就问他：“我智慧怎么老是八分？这焊死在上面了，这玩意就不能挪挪位置吗？”老人家给我来了一句：“你不求智慧的时候，就是智慧圆满了。”","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p170","index":170,"text":"我说，就是因为你们佛界这帮家伙天天说这些东西，才把人间搞乱了。他说得对不对？肯定是对的，因为你不求智慧的时候才是最高智慧，这个没毛病。在佛界，大家也都知道是这样的。但是我们在人间，你不要把结果性的东西告诉我。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p171","index":171,"text":"佛教特别喜欢说这个，道教也喜欢。《道德经》里说的很多东西都是结果性的，是圆满的结果性的东西。佛教这块也说什么“即心即佛”“平常即佛”，说得对不对？的确是对的。但是你说的是结果性的东西，而且是圆满结果性的东西。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p172","index":172,"text":"圆满结果性的东西会出现什么情况？返璞归真。返璞归真之后，就跟没修炼是一样的。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p173","index":173,"text":"我就跟他说，比如拿了一个武林宝典，是不是得先翻翻，先看？看完之后要不懂，得先问问。问完了，都看懂了，就练呗。练个十年八年，熟练了；再练个十年八年，精通了。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p174","index":174,"text":"达到精通之后，这时候要做的事是什么？叫忘掉。所以此时无招胜有招，没毛病。最后你问他武功的至高境界是什么，无招胜有招。那咋练？你让小白咋练？是不是先把那本书给我？你不给书，直接说结果，就出现这种事情。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p175","index":175,"text":"所以那天我把观音同学数落了一顿，我说祸害人间的就是你们这帮佛界的，老说结果性的东西——不告诉过程，最后弄得所有人都出问题。所以不要说结果性的东西，那是佛界的表示方法。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p176","index":176,"text":"咱们要做的是大道至简，但是不至于无。因为一无，就没得可说了，都不要去说了。简可以，但是不能无，说大白话，保证大家都能听明白。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p177","index":177,"text":"我得把那本书给你，还得带着你咋练。练得差不多的时候，最后跟你说：“你可以无招胜有招了，您就无去吧。”这个是可以的。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p178","index":178,"text":"讲清意义用法与代价","level":2,"key":false,"section":"ep1-p147"},{"id":"ep1-p179","index":179,"text":"最后要讲的规则是什么？所有东西必须讲清意义。这个东西拿过来干什么用？解决什么问题？用法是什么？适用场景是什么？","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p180","index":180,"text":"任何东西使用都会有代价，你要付出什么样的代价？什么人能学？什么人不能学？都得跟人说清楚。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p181","index":181,"text":"好，这是咱们的规则。希望通过这些规则，还这个世界一个清清白白的世界、明明白白的修行方法。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p182","index":182,"text":"给大家一个完整版的说明书，希望大家努力修炼，希望有一天修炼完之后，学会无招胜有招。","level":0,"key":false,"section":"ep1-p147"},{"id":"ep1-p183","index":183,"text":"六 时代背景与强者","level":1,"key":false,"section":"ep1-p183"},{"id":"ep1-p184","index":184,"text":"这段时间开始讲述的时机","level":2,"key":false,"section":"ep1-p183"},{"id":"ep1-p185","index":185,"text":"为什么咱们这些东西现在才出来，为什么这段时间才讲？好时机。首先有三个时机，非常好，我说传法好，但是对大家可不见得舒服。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p186","index":186,"text":"第一个，末法时代，哈哈，末法时代出乱象。首先叫魔作沙门，内部败坏，大家已经看到了，寺庙里抓起来的人已经不少了。然后叫僧俗颠倒，白衣说法。咱们白衣，不过今天穿的是黑衣，下次穿一个白衣。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p187","index":187,"text":"然后叫五浊恶世，邪见炽盛，乱七八糟的什么都能说。然后叫道德崩坏，人伦失序，咱们就不做解释了，都明白。然后叫女人精进，功德积累，男人懈怠轻法，视沙门如粪土。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p188","index":188,"text":"你看佛祖老先生，人家在两千五百年前已经说了。所以为什么咱们这叫“群阴慑服，百灵来朝”，就是这种样子，跟群阳没关系。所以最后改变世界靠女人了，男的已经解决不了问题。部分男的可能还有点希望，绝大多数男的咱们放弃吧。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p189","index":189,"text":"天灾人祸，环境恶化，这都是末法时代的情况。咱们在人间还要经历的，叫经济大萧条。大家请参考一九二九年的全球性经济大萧条，倒牛奶那个就是一九二九年的时候发生的。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p190","index":190,"text":"大家可以看看，十年经济大萧条。但是我们要经历多少年？二十年，哈哈哈。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p191","index":191,"text":"时代进步了，总要多增加点年头。是否已经经历了几年？可能刚经历一两年，所以残酷的时间还在后面。未来会有更多家庭出现问题，更多人活不起，活得极其艰难，这个没有办法。同时科技在进步的时候，也在淘汰人。所以人类如果不能活出个一二三，恐怕会活得越来越艰难。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p192","index":192,"text":"再加上九紫离火运，这好像是好运，但是一般的九紫离火运都不是特别好，哈哈。因为逢九的运代表一个时代的结束，一个运二十年，从一运走到九运，正好一百八十年。这种循环经历过很多次，你们可以看一下历史上的逢九的运，好像都不太好。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p193","index":193,"text":"为什么？主要是时代的变革，这个时代要结束了。你还坚持用这个时代的东西，只能被淘汰。你不进行人为的淘汰——人类怎么进步？大家经历过很多，比如马车时代，汽车淘汰马车，电力时代、蒸汽机时代、内燃机时代。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p194","index":194,"text":"还有很多人经历过的，比如像我这个岁数，七十年代人都经历过的计算机时代，九十年代的计算机时代。那个时候我在中关村卖电脑，很挣钱，能有计算机的很少。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p195","index":195,"text":"时代变更越来越快","level":2,"key":false,"section":"ep1-p183"},{"id":"ep1-p196","index":196,"text":"大家又经历了互联网时代，现在又经历人工智能时代，都一直在淘汰，而且时代越来越近。以前一个时代怎么着也得几十年，现在可能五年、十年就差不多了。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p197","index":197,"text":"大概二〇一五年的时候，我记得马云还在说，我拿着望远镜都找不着竞争对手。现在你看他还敢说这话吗？时代变更太快了。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p198","index":198,"text":"时代变更这么快，不好的东西那么多，我们应该怎么办？我们也一样，只要强者。因为大时代不好的时候，弱者活不下来。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p199","index":199,"text":"比如特别穷、特别苦的，不是咱们不想度化人家，是你没这本事。你想用木桶原则，他就剩一桶底，一块板都没有，你咋度？这事就交给地藏王菩萨和佛祖度去。人家时间无限，咱们就匆匆几十年，能不能把这些东西讲一遍、讲明白，就算不错了。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p200","index":200,"text":"所以很费劲，大时代不好的时候，弱者活不下来，只有强者才能活下来。你看看匈奴，还有很多游牧民族，北欧，还有动画片里什么魔族、兽族，全都是苦寒之地。越是苦寒之地，越要求个体强大、个体强悍，否则根本活不下来。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p201","index":201,"text":"包括北极熊那种东西，越是苦寒之地，越能诞生庞大的动物，因为弱小的不行。反而非洲这些，除了特别大的象和狮子、犀牛，也就那几个稍微大点，其他并不是特别大。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p202","index":202,"text":"能适应新规则的人","level":2,"key":false,"section":"ep1-p183"},{"id":"ep1-p203","index":203,"text":"我们要的是什么？什么是强者？很简单，只给强者听。那强者是什么？","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p204","index":204,"text":"能适应新规则的人，敢于适应新规则，敢于否定旧我的人，我们称之为强者。","level":0,"key":true,"section":"ep1-p183"},{"id":"ep1-p205","index":205,"text":"有缘众生智慧众生与觉醒众生","level":2,"key":false,"section":"ep1-p183"},{"id":"ep1-p206","index":206,"text":"我们同时也要有缘众生、智慧众生和觉醒众生。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p207","index":207,"text":"有缘众生是什么？不管你有钱没钱、有学问没学问，过得好与不好，只要听完这个东西之后，觉得对你有帮助，愿意听、愿意学，愿意根据上面的东西改变自己，我们称之为有缘众生。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p208","index":208,"text":"就像我们现在很多学生，以前讲的神神鬼鬼的东西，哪个能摸得着、看得着？哪个能证实？但为什么你就信？缘分。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p209","index":209,"text":"包括仙总，自己学紫微，当时我教紫微的时候学过来。那自己学吗？压根不学，就是听着那声音，觉得可信，就跑过来。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p210","index":210,"text":"我记得好像现在还有一个，是一个大厂的高管，也是听了我的课、听了我的声音。他说分辨一个人，就看这个人说得自信不自信、逻辑合理不合理。刚开始听一两集，觉得这个人太能忽悠。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p211","index":211,"text":"再听，好像说得有道理。所以这叫给有缘众生，他通过声音判断，我觉得非常重要。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p212","index":212,"text":"第二是智慧众生，说白了脑子得在线。智慧众生是什么？纯粹用理论、逻辑分析你说得对不对。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p213","index":213,"text":"所以你看，咱们特别能吸引清华的人，我就纳闷，怎么北大的那么少？哈哈，吸引的都是清华的，难道曾经跟清华很有缘分？有可能。这个叫智慧众生，纯靠人家脑子在线，一说就能明白，没问题。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p214","index":214,"text":"第三个叫觉醒众生。在轮回之中，我讲的这些东西并不稀奇，你肯定听过，只是在轮回的时候喝了孟婆汤，忘了。所以我一讲就激发了你，找回了你天魂的记忆，这叫觉醒众生，“一修说醒了”。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p215","index":215,"text":"我跟你说，你们评论区里说的有颜众生，这不行，到时候我媳妇会很有意见，不能只度化有颜众生，那就真的出事了。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p216","index":216,"text":"度化的三个阶段","level":2,"key":false,"section":"ep1-p183"},{"id":"ep1-p217","index":217,"text":"好，这同时也是未来咱们度化的三个阶段。我跟你说，人类世界去度化众生，就是三个阶段。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p218","index":218,"text":"第一个，就是给有缘、智慧、觉醒这三类众生听。因为不是这三个属性的，根本听不懂、听不下去，也坚持不了。你给他说，他脑子理解不了，就属于这种样子。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p219","index":219,"text":"第二阶段，是第一阶段积累了一定的众生之后，这些众生根据你的东西度化成功了，有很多成功案例可以往外放。这个时候，有些人奔着成功案例来：他成功了，我能不能按这个东西解决我的问题？","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p220","index":220,"text":"所以第二阶段是奔着成功案例来的，也叫学习众生，希望通过你的东西学习。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p221","index":221,"text":"第三阶段叫跟风众生，那就三五十年之后了。咱们如果不发展出几百万、上千万信徒，没人跟风。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p222","index":222,"text":"你看有些佛教的，就属于进入跟风阶段了，说一念阿弥陀佛，往生极乐。这就不要求你懂不懂，只要信就行。这是三大阶段。","level":0,"key":false,"section":"ep1-p183"},{"id":"ep1-p223","index":223,"text":"七 听众的六个条件","level":1,"key":false,"section":"ep1-p223"},{"id":"ep1-p224","index":224,"text":"接受真相与接受现实","level":2,"key":false,"section":"ep1-p223"},{"id":"ep1-p225","index":225,"text":"咱们未来的听众，也要求有六个条件，不是没条件。以前那些东西就是图个乐，很多神神鬼鬼的，还有自己经历，你愿意听，啥条件都不给规定。但现在没点水平，还别来。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p226","index":226,"text":"这几个条件是什么？第一个，接受真相，接受现实。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p227","index":227,"text":"我们不仅讲人间的真相，也会讲到各个位面的真相。所以如果你不能接受真相，就不要听了。你连真相都接受不了，我不去给一个叫不醒的人费劲。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p228","index":228,"text":"可能有很多真相不太好听。比如结婚，男女生过三十五岁之后很麻烦。包括女性离婚喜欢带孩子，带孩子和不带孩子的再婚率完全不一样，带男孩和带女孩的再婚率又不一样。所以我不管你爱听不爱听，这是真相。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p229","index":229,"text":"知道这个真相之后，你找的时候就找靠谱的，别找能离婚的。你为了自己的很多东西，我喜欢帅的、喜欢有钱的，最后找了一个不靠谱的，离婚了，自己带着孩子，那只能说你活该。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p230","index":230,"text":"因为我会告诉你哪些东西会怎样，包括你不结婚，到多少岁的时候，那个孤独感解决不了。你能接受就接受，不能接受就拉倒，我才不会哄你，你就等着物竞天择吧。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p231","index":231,"text":"所以为什么咱们故事会叫闲聊？为什么人类说明书是在末法时代、九紫离火运和经济大萧条的时候出来？你有没有想过？","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p232","index":232,"text":"当时二〇一八年的时候，我还搓火呢。我说，让我做个阴阳师，能不能让我在盛世的时候做？这快经济大萧条了，让我做阴阳师，挣谁钱去？这不等着饿死吗？后来我发现，你就记住，上天如果想给予你的，一定是你意料不到的——意料不到的好处。所以九紫离火运最重要的，是把大家全都打回原形。怎么打回原形？你天天让人过得很幸福，每个人都觉得自己可……了。那玩意能听你的，能重新理解世界，重新审视自己错了？不扯淡吗？都觉得自己——","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p233","index":233,"text":"我命由我不由天。你让他先放飞一段时间，由自己一段时间，等吃不上饭的时候，就觉得这还是天定。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p234","index":234,"text":"愿意改变自己并对抗旧我","level":2,"key":false,"section":"ep1-p223"},{"id":"ep1-p235","index":235,"text":"第二件事情，愿意改变自己，修正自己，并且有足够的毅力对抗旧我，很难。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p236","index":236,"text":"其实这就是我们说的“平时即命运”。比如我爱吃、爱喝小啤酒、爱吃小烤串，你要控制量。不控制量，就做好以后——脑血栓、对身体不好的情况的准备。因为我们家族已经发生很多事了。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p237","index":237,"text":"现在你看我一直带着这个东西。现在找到窍门了，血糖一到6，就可以开始加餐了。以前为什么高？你都在吃饭的时候，又想吃米饭，又想吃肉，还想吃水果，还想喝可乐，所有高糖的东西都加在一起。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p238","index":238,"text":"那不就高了吗？你可以等它下来的时候，苹果；等它再下来的时候，可乐，哪个也没耽误。但是这叫对抗旧我，因为之前的吃饭方式会产生血糖的极大波动。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p239","index":239,"text":"以前没这个东西，也不知道天天血糖有多高。所以我很推荐这个东西，到时候讲真相，我会直接说，它对你了解一个人的血糖、改变饮食习惯极有帮助，特别有帮助。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p240","index":240,"text":"以前我二〇〇九年就得糖尿病，开始打胰岛素了，但一直控制不好血糖，就是因为没有实时监控。有实时监控的时候，对这个东西就很清楚。我们家现在好多人、老人都弄上这东西，血糖现在全都很正常。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p241","index":241,"text":"这就叫对抗旧我，很难受。光不吃主食、少吃主食这件事情，我直接用了十年去改变，很难受。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p242","index":242,"text":"相信因果轮回与高维生物","level":2,"key":false,"section":"ep1-p223"},{"id":"ep1-p243","index":243,"text":"第三，相信因果，相信轮回，相信这个世界有高维生物。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p244","index":244,"text":"咱们前期逆修觉者这块，也不涉及什么神神鬼鬼的东西。但是所有的基础，是你得相信因果，相信轮回，相信世界上有更高维的生物影响我们。我们可能看不到、摸不着，但是你必须得信，不信不行。如果接受不了，那咱们就别看了，下面都别看了。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p245","index":245,"text":"学习规则与应用规则","level":2,"key":false,"section":"ep1-p223"},{"id":"ep1-p246","index":246,"text":"第四，相信一切皆是规则演化，要学习规则，应用规则。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p247","index":247,"text":"理性分析并重构认知","level":2,"key":false,"section":"ep1-p223"},{"id":"ep1-p248","index":248,"text":"第五，要足够理性，分析推导，并且重构自己的认知，这非常重要。用全新的认知替换过去的认知，因为过去的认知有问题，包括整个人类过去的认知，很多东西都有问题。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p249","index":249,"text":"比如今天举例的，公司的很多东西，你看所有公司都出现这个问题吧？我跟你说，所有公司都错了。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p250","index":250,"text":"很多人类公司之所以没有办法发展壮大，甚至壮大一段时间之后，必然出现员工之间的恶意伤害，叫内部管理的问题，是一定的，百分之百。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p251","index":251,"text":"这里谁做得最好？稻盛和夫。因为稻盛和夫是真的爱自己员工，真愿意把这个东西分给员工，这点做得非常到位。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p252","index":252,"text":"完善自我圆满自我与成就众生","level":2,"key":false,"section":"ep1-p223"},{"id":"ep1-p253","index":253,"text":"第六，愿意完善自我，圆满自我，成就众生。","level":0,"key":false,"section":"ep1-p223"},{"id":"ep1-p254","index":254,"text":"八 下集预告与结束","level":1,"key":false,"section":"ep1-p254"},{"id":"ep1-p255","index":255,"text":"今天这集咱们就说完了，下集是三把锁。先说三把锁，很难，很绕脑，叫三把锁是如何把人类锁在梦境中。","level":0,"key":false,"section":"ep1-p254"},{"id":"ep1-p256","index":256,"text":"因为实际上我认为你现在一直在睡觉。到时候又会说什么是梦，其实这个东西估计你从来没有仔细研究过。佛教很喜欢把人说成活在梦境中，包括《金刚经》上说梦幻泡影。但梦的原则是什么，如何觉醒，这些东西很重要。","level":0,"key":false,"section":"ep1-p254"},{"id":"ep1-p257","index":257,"text":"然后再吐槽一下所有坑害我们的规则和枷锁，人间界是怎么坑害我们、阻碍人类前进的，到时候都会说。","level":0,"key":false,"section":"ep1-p254"},{"id":"ep1-p258","index":258,"text":"好，今天咱们就说到这，拜拜。","level":0,"key":false,"section":"ep1-p254"}]},{"id":"ep2","number":2,"name":"问道二","title":"三把锁如何把人类锁在梦境中","speaker":"悟聊天尊","source":"20260731_问道2_三把锁_整理稿.docx","date":"2026-07-31","description":"辨认迷、困、觉、醒，理解三把锁与智慧落到生活中的五个断点。","blocks":[{"id":"ep2-p36","index":36,"text":"一 开场与本期说明","level":1,"key":false,"section":"ep2-p36"},{"id":"ep2-p37","index":37,"text":"近况与试讲安排","level":2,"key":false,"section":"ep2-p36"},{"id":"ep2-p38","index":38,"text":"大家晚上好。今天晚上的内容一定很烧脑，看不明白没关系，以后慢慢看。就跟佛经、道经似的，一次也看不明白，着什么急？也不影响自己吃喝。所以今天看不完、看不明白，不要着急，淡定，一定要淡定。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p39","index":39,"text":"还有，跟大家说一下，以后不要再给我寄东西了。我家又收到了一些东西，也不知道是谁寄的，还是肩颈的，听说是仙总的学生。人家老给我东西，我都没有表达过自己的谢意，这有点不太合适。所以大家以后还是不要寄东西，这样最好。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p40","index":40,"text":"第二，我的很多问题，不是你们帮忙买个什么东西就能解决的。不过还好，到现在为止，基本上我身上各种各样的问题都解决了。之前是脑子有问题，咱给脑子开了一个天窗，放放气，这一下就变聪明了。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p41","index":41,"text":"第二是血糖有问题，一戴上这东西，严格控制自己的饮食，血糖也正常了。第三个是肩周炎。最近我们家苍蝇都少了很多，以前碰着它，你不敢打，现在恢复了，我发现使劲打的时候，胳膊已经不疼了。现在消灭苍蝇的速度大幅提升，苍蝇已经很难在我们家驻足了。肩周炎也基本上好了，可以正常睡觉了，我觉得非常好。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p42","index":42,"text":"最后就是高血压。前几天我发现，是不是该换药了？突然一下子脑子就聪明了，说不行，该换药了，因为之前那药吃了三年了。去大医院换了一下药，真贵，半个月400马币。但这个药好像是德国的药，还不错，有些东西调整了剂量。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p43","index":43,"text":"刚吃第一天的时候还挺凑合，这玩意不吃还不长血糖，怎么吃了之后反而血糖更高了？但要耐心给它一点时间，发现吃了第三天之后，整个血糖都正常了，这个还是挺厉害的。所以到现在为止，基本上大病小病都解决了，我觉得非常好。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p44","index":44,"text":"今天声音稍微有点变，嗓子发炎了，搞不清楚怎么回事，可能会影响声音。但咱们主要是试讲，能把事说清楚就行。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p45","index":45,"text":"你看，就像走运、走大运，我正好是2025年开始走大运。你在走大运的时候，碰着一些倒霉的事先别着急，它有可能是让你提前发现问题。发现问题之后，赶紧把问题解决，你才能够上升。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p46","index":46,"text":"到现在为止，关于身体的问题都解决得不错。糖尿病和高血压都快20年了，解决不了的事，现在解决得基本上还挺不错。脑子这个问题其实一直都有，算是我人生里面最大的一个坎。不是说以后脑子不出问题，可能还会出，但是至少没有比这个更大的了。所以记住，你在运上的时候出现点问题，其实是一件好事，它在善意地提醒你，赶紧把它解决。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p47","index":47,"text":"好，咱们不耽误大家，正式开始。今天内容非常多，一时半会儿能不能讲完还不知道，我尽可能讲，说不定今天就要讲两个小时，你们慢慢听。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p48","index":48,"text":"这是《问道》的第二集，还是那个原则：试讲，就是吐槽版。大家听完之后，有听不明白的、有意见的、有需要吐槽的，直接到那四个群里去吐槽，到时候会有人帮大家收集。我看一下，没什么问题了，再修改，修改完之后去录制咱们正式版的文档。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p49","index":49,"text":"这一期本来想周二给大家讲，但是东西实在太绕。我自己琢磨来琢磨去，憋到周三，才给一些写框架的学生试讲了一下。他们也提出了一些意见，所以周四、周五又修改，到今天反正也改不出来了，就是它吧。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p50","index":50,"text":"能听懂，咱们就听；听不懂，等以后我的智慧水平更高，录《问道》第二版的时候再修改。这版实在是改不动了，太费劲了。我的原则是随缘，能想明白到什么地步，就想明白到什么地步，坚决不难为自己。你们能听明白就听明白，听不明白，就等下次我又想明白了，你再继续听，别着急，淡定。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p51","index":51,"text":"好，咱们正式开始《问道》第二集讨论版。先做上期回顾：上期说了，我们要做人类说明书，这个节目叫《问道》，希望这套内容能够帮助大家认识真相、规则、正确的生活方向。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p52","index":52,"text":"本期讲轮回怎样把人困住","level":2,"key":false,"section":"ep2-p36"},{"id":"ep2-p53","index":53,"text":"这一期要讲什么？既然咱们要写人类说明书，你要知道轮回是怎么坑害你的。知道之后，你就知道怎么用人类说明书去对抗轮回对你的坑害。我们要知道它怎么做，我们怎么防。所以这一集主要说的是，轮回是怎么坑害你的。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p54","index":54,"text":"下一集，也就是第三集，咱们再说，你应该怎么用人类说明书去防范这些事。这是咱们这两集的内容。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p55","index":55,"text":"轮回坑害你的主要方式，我们称之为入梦。大家一点都不生疏，佛祖在《金刚经》上讲的“梦幻泡影”，这句话大家听过很多次。整个佛教也在说，你处的是一个假的世界。没看佛教，也不影响马斯克这样的人说，我们活在一个虚拟的世界里。这都是说我们在梦中。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p56","index":56,"text":"在梦中要有什么特性？想想自己做梦的时候会碰到什么。第一个叫入幻；第二，你做的这些东西肯定不真实，是假的；第三，梦不能只是直接在里面待着，它一定要有一些故事性。哪怕坐花轿、娶媳妇，也是一个故事。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p57","index":57,"text":"第四，你在梦中要感觉这是真的。虽然是假的，大家醒了之后都知道，但不妨碍你在梦里的时候，真实感很强。一个梦需要具备这四个条件。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p58","index":58,"text":"梦与现实的关系是什么？其实不太好说，你自己去感觉。佛祖也说了，马斯克也说了，但你自己感觉我们的世界是真实的。包括双缝干涉实验、量子纠缠、微观不确定，你会发现很多事情，实际上都证明这个世界足够虚假。但我又不是科学家，我也证明不了什么。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p59","index":59,"text":"我只能跟你们说，我相信佛祖老人家说的东西，我们生活在梦幻泡影中。咱们做这个节目不是为了证明这个，不是为了得诺贝尔奖。我也没有那么科学，没那么严谨，我只是个人，咱们本来就是一个闲聊的体系。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p60","index":60,"text":"闲聊体系，就是所有东西都是我个人对一些事情的观点。今天讲的，也是我个人对现实中这场轮回大梦怎么坑害我们的一些想法。咱们只是闲聊，你能悟到什么，纯属于缘分。个人观点，闲聊，不是科学，咱也不为拿什么奖，我也不会给你证明什么。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p61","index":61,"text":"那么我们来说，梦首先有四个阶段，请大家一定记住：第一个阶段叫迷，第二个是困，把你困住；第三个就是咱们努力的阶段，叫觉；第四个阶段是醒。咱们经常说觉醒，但觉和醒是两个事。古人的话经常是一个字代表一个意思，所以觉和醒是两个事，就是迷、困、觉、醒四个字。","level":0,"key":false,"section":"ep2-p36"},{"id":"ep2-p62","index":62,"text":"二 迷 在错误中不断重复","level":1,"key":false,"section":"ep2-p62"},{"id":"ep2-p63","index":63,"text":"迷的三个特性","level":2,"key":false,"section":"ep2-p62"},{"id":"ep2-p64","index":64,"text":"首先，什么是迷？这个咱们经常经历。比如迷路，你在错误的道路上走来走去，找不到方向，这叫迷路。如果碰着鬼打墙，是不是也是迷路？鬼打墙最重要的是重复再重复，经常回到原点。走迷宫也是，走着走着，又走回原点了。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p65","index":65,"text":"所以被迷的时候有几个东西：第一，找不到方向；第二，做的事情是错误的，你做的事情如果正确，那不就不迷了吗？第三，经常会重复。这是迷的三个特性。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p66","index":66,"text":"我们人类很多时候，也是深入泥潭中而不自知。对于轮回大梦来说，它要迷住我们，让我们不停地重复犯错误。我们把这个称之为迷，这一点很重要。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p67","index":67,"text":"到现在为止，物质文明已经发展到令人惊叹的地步，可是精神文明基本上原地打转。思维上的问题，我们和几千年前的古人一样：古人碰到什么问题，你还能碰到；古人犯什么错，你还犯什么错。这不仅仅是人性的问题，也是思维惯性的问题。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p68","index":68,"text":"所以现在像冯唐给你讲《资治通鉴》，为什么？因为你可以通过古人所做的事情，知道我现在碰到这些事应该怎么办。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p69","index":69,"text":"通过研究古人来解决今天的很多问题，核心原理就是：很多问题的本质压根没有变过，古人犯的问题，我们一直在重复。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p70","index":70,"text":"当错误不是偶然发生，而是持续重复的时候，人类不是单纯遇到了一个问题，而是被困在某个规则里，在原地打转。这就是我们所说的梦中的迷。","level":0,"key":true,"section":"ep2-p62"},{"id":"ep2-p71","index":71,"text":"轮回大梦有三个特性。第一个叫跨代重复。上一代犯过的错误，下一代就算看明白了，该犯还犯。历史可以变化，人物可以变化，时代可以变化，但痛苦的结构没有变化。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p72","index":72,"text":"第二个叫形式仍然重复。有些东西只是表面上解决了，实质上换汤不换药。比如炫富，古人在炫富，现代人也在炫富；古人爱美，你也爱美；还有仇富，尤其是同学或者家里的亲戚，谁富了，说“他也有今天”。说闲话，古人说闲话，你也没少说。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p73","index":73,"text":"古代说看他起高楼、宴宾客、楼塌了，你看现在的企业家不都一样吗？只是事不一样，性质压根一样。过去男的有点钱喜欢去青楼，现在去KTV、夜总会，本质上没有什么区别，只不过没有“熟人”这么一说了。之前想多找一个老婆，叫娶妾，现在叫找小三。说法不一样，本质一样。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p74","index":74,"text":"婚姻与职场里的重复","level":2,"key":false,"section":"ep2-p62"},{"id":"ep2-p75","index":75,"text":"第三种是明知后果，仍然重复。比如发脾气，谁都知道不好、不对，但是阻止你发脾气了吗？该发的时候不还发吗？这叫本能性的反应。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p76","index":76,"text":"下面快点说一些案例。夫妻发生矛盾的时候，双方都在证明自己没错，却没人关心这段关系能不能继续。父母总担心孩子的婚姻，为其把关，希望孩子幸福。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p77","index":77,"text":"但我们更多关注的是对方的物质条件是否匹配，却很少关注两个孩子是否能够经营婚姻，以及对抗未来的风险。所以人类的婚姻大多数不幸福，尤其在剧烈变动的今天，婚姻稳定性更差，离婚率更高。父母这份关心并没有真正解决实际问题，整个解决问题的方向都错了。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p78","index":78,"text":"夫妻一方发现对方出轨，第一时间一哭二闹三上吊，手撕小三，昭告亲友，本意是想保住婚姻、出口气，但最后反而促成婚姻彻底决裂，自己也遍体鳞伤。古代这么干，现在也一样。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p79","index":79,"text":"前几天还有一个女同学跟我诉苦，说老公大男子主义。古代有大男子主义，现在也有。古代好多男的觉得自己老婆笨，现在好多男的也没觉得自己老婆多聪明。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p80","index":80,"text":"好多婚姻的问题，是老婆压根不知道生活成本是什么。整个生活运行起来，成本不少，可她忽视这个东西。我们之前讲成本思维，还有增量思维。当有这两个思维的时候，你放心，这个婚姻好不了了，因为这个时候她所有的东西都觉得理所应当。所以很多婚姻出问题，女的觉得“我离开你没有问题”，等真离开时发现不对。她从来没有算过这些。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p81","index":81,"text":"现在的婚姻构成里面，男方为此付出了多少？整个生活质量都是谁付出的？付出了多少？她完全不算这个东西，好多女生都是这样。好多婚姻出问题，来自于她越觉得理所应当，越忽略男士在此的付出。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p82","index":82,"text":"有的时候，一个男的一个月为家庭付出几万块钱，还不如她随便找一个健身教练，说“你真好，你很自信”，多夸她几句，她觉得这个人很好。真正供养她的，她觉得很一般。古代这样，现在也一样。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p83","index":83,"text":"职场也是，公司一出问题就追责，所有人学会的不是避免问题，而是隐藏问题和甩锅。最后没人愿意承担问题，也没人愿意创造，创造越多、揽事越多、问题越多，倒霉的就越多。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p84","index":84,"text":"办公室里经常拉帮结派。自己本身很讨厌拉帮结派，但为了保护自己，也得拉帮结派，最后活成了自己讨厌的人。老板害怕培养出能代替自己的人，越不培养，公司越没有人才，最后永远无法发展壮大。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p85","index":85,"text":"中年危机，我亲自体验过。我们之前做程序员的时候，所有人都知道自己有中年危机。35岁、40岁、45岁的程序员，你看看公司里有没有这样的人，没有就知道了。所以你也知道，早晚有一天公司要把你辞退，应对的方式就是做两手准备。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p86","index":86,"text":"但你会发现，自己每一天都活在痛苦中、等待中，拿不出太多时间真正为自己做两手准备，更多是在等待最后那个时刻出现。HR真正找你的时候，既害怕，也松了一口气，终于落定了。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p87","index":87,"text":"这就好比一个死刑犯知道自己活不了了，但是不知道哪天枪毙他。最恐怖的不是枪毙的时候，而是等待死亡的时候。一直都是这样。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p88","index":88,"text":"一个人为了获得权力参与斗争，获得权力后又害怕失去，只能进入更大的权力斗争，官场基本如此。你看像我们伟大祖国，还有一些其他地方，都是这样。为什么官场斗争越来越严重？他不能放，一放就完蛋了。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p89","index":89,"text":"开会明明有不同意见，也不说，都顺着领导讲场面话。方案出了问题，又开始互相甩锅。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p90","index":90,"text":"历史为什么还能给今天借鉴","level":2,"key":false,"section":"ep2-p62"},{"id":"ep2-p91","index":91,"text":"下一次开会，还是继续说场面话，没人说真话。财富方面，我就不多说了。类似的事情，我不是发给你们群里了吗？你可以把我给的案例放到AI上。我基本上放到GPT上，你花点钱，别弄那个最简单的版本。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p92","index":92,"text":"把这些东西输入进去，只需要说：“帮我找出人类类似的、一直活在错误中且不自知的案例。”你去找，无穷无尽。你看完几百上千个案例之后，真的会觉得人类从来没进步过。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p93","index":93,"text":"为什么要学历史？历史能够对你有帮助的本质，是你相信历史会重演。这也同时代表，人类的思维模型没有进步。但凡进步了，历史对你无用，因为这件事情不会再重复。但凡事情的工作原理重复了，就代表人类在这儿没有进步。这是很重要的反推，也就是所谓魔咒。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p94","index":94,"text":"我希望大家都去用AI找一下，真的是方方面面，哪里都有，非常恐怖。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p95","index":95,"text":"我希望有一天，我们未来碰到的问题，历史对你没有借鉴作用，就代表人类在提升。可能没有真正走出去，走出轮回，但至少提升了，不再用之前的经验解决现在的问题。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p96","index":96,"text":"这个就是迷。像魔咒一样，我们一直在错误中反复犯错，有的可能知道，有的可能不自知。这就是世尊所说的梦幻泡影，我们一直活在梦中而不自知，一直重复经历消耗人类的事情。这就是梦的“迷之力量”，力量的力。它用这种力量把你抓住，让你在里面迷失，这是非常重要的点。","level":0,"key":false,"section":"ep2-p62"},{"id":"ep2-p97","index":97,"text":"三 困 看不见边界的牢笼","level":1,"key":false,"section":"ep2-p97"},{"id":"ep2-p98","index":98,"text":"小困是约束 大困是自由","level":2,"key":false,"section":"ep2-p97"},{"id":"ep2-p99","index":99,"text":"第二个是困。记住，困比迷更厉害，而且是整个轮回把你框在轮回之内的一个非常重要的手段。困分为大困和小困。小困比较简单，称之为约束，但大困是给你自由。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p100","index":100,"text":"明显的约束可以让人产生反抗。把你圈在一个地方，你肯定不干；但是我让你哪里都能去，就是出不了地球，你觉得够玩了，觉得自己自由，但实际上一直被锁在地球上。所以大困是自由，小困是约束。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p101","index":101,"text":"当你不知道边界在哪里，也不会产生被困的想法，这才是最可怕的。真正难以识破的牢笼，是让你看不到边界，甚至真心相信自己已经获得自由。所以大困靠自由。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p102","index":102,"text":"井蛙的三个阶段","level":2,"key":false,"section":"ep2-p97"},{"id":"ep2-p103","index":103,"text":"我们用一只青蛙来解释，叫井蛙的故事，一共分三个阶段。第一个阶段，井盖盖上了，什么都看不着，一直黑漆漆的。青蛙从出生那一刻就没看到过光，这个时候它最安静。为什么？因为它从来没有看到过不同，连外面有没有另外一个世界都不知道。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p104","index":104,"text":"我记得之前有一次洗灵，看到过一个地狱的场景，里面所有众生从来没见过光。如果有一天你到这个地狱去传法，说外面很光明，他都不知道光是什么。这个才最可怕，因为没有这个东西，就没有办法产生意识差，没有追求。你跟他说的东西，他不知道，从来没听说过，这最麻烦。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p105","index":105,"text":"第二个阶段，是给你希望，但是你够不着。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p106","index":106,"text":"突然有一天，把井盖拿开了，它看到了蓝天白云、白天黑夜，可能还能看到星光、月亮，但信息极其有限。它知道井里是一个世界，井外是一个世界。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p107","index":107,"text":"最麻烦的是什么？井壁是垂直的，你想往外爬，对不起，爬不了，很难。知道不知道外面？知道，但是想出去很困难。努力几次之后就放弃了，还是那句话：“臣妾做不到。”这个时候，它会主动放弃，这也是一种困。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p108","index":108,"text":"就像很多监狱有铁栅栏，不是看不到外面的天，但是你出不去。你会跟铁栅栏较劲吗？大概率不会，因为知道较劲没用。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p109","index":109,"text":"第三个阶段，也是最可怕的。比如在井里修个小斜坡，青蛙脚上有吸盘，它慢慢爬。你给它设置点困难，但又能让它经过努力，慢慢爬出井口。当它爬出井的那一刻，看到了满天繁星、日月轮转，天地如此广阔，世界如此缤纷。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p110","index":110,"text":"你想它会怎么想？是不是很开心，觉得自己通过努力终于脱困了？只是它不知道，有一种困，是我在意识上困住你；有一种困，是给予你自由，而且还是通过你自己努力得到的自由。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p111","index":111,"text":"比如大家看过的电影，《基督山伯爵》和《肖申克的救赎》。电影时间有限，只能通过历经困难、隐忍算计、慢慢行动，最后有一天终于出去了。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p112","index":112,"text":"出去之后，就开始进入复仇和嘚瑟的环节了，因为这是电影。如果我想拍一个100集的电视剧怎么办？前50集，是他在监狱里面难受；后30集，他终于出了监狱；再后20集，他发现出了监狱，还在人家的算计中。这才最有意思。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p113","index":113,"text":"当青蛙真正通过自己的努力逃出牢笼，最大的问题，是它认为自己自由了。当它产生一个“我自由了”的心时，才是最大的牢笼。因为它从此连“我是不是不自由”这个想法都不会再有，它认定自己通过努力获得了自由。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p114","index":114,"text":"这就是井蛙、大困小困，我们用青蛙这个事情给大家做一个案例。所以困有三个境界。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p115","index":115,"text":"困的三个境界与习以为常","level":2,"key":false,"section":"ep2-p97"},{"id":"ep2-p116","index":116,"text":"第一个，我不让你看到真实，完全不让你看到，把井盖关上。当一个人生活在既有认知里，从未接触系统之外的东西，就不可能对这个系统产生怀疑。你根本不知道梦之外是什么，连醒这件事都不知道，怎么可能醒？记住，第一件事，是不让你看到真实。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p117","index":117,"text":"第二个，我让你看到一点点，但永远得不到。你经过努力，最后得不到，自己放弃了。这个也没问题，但是很少用。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p118","index":118,"text":"第三个，完成突破，于是相信自己自由了。这种最可怕。尤其把这些合在一起用，就是我们人类最大的问题。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p119","index":119,"text":"第一件事，不让你看到真实。第二件事，有一些真实传过来了。你看2500年前，佛祖、老子、基督、真主都一块儿传，有没有把世界之外的真实往下传？传了，但是只给你看了一点点，很难实现。最后你们把它定义成封建迷信，觉得这是忽悠、不实之言，这是你们自己定义的。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p120","index":120,"text":"第三件事，向人类开放科技，让人类可以通过科技改变自身的物质生活。人类不是没有看到过真实，曾经看到过一点点，但绝大多数外面的情况完全不知道。又给你开放一点真实、一点科技树，让你觉得可以掌控自己的命运。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p121","index":121,"text":"这个时候，人类基本上完全被迷住了，因为你相信自己自由，相信可以改变世界，相信我命由我不由天。这就是把人类困住的三种方式。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p122","index":122,"text":"困住你最大的目的，是所有东西都让你觉得习以为常，这是梦境最大的厉害之处。无论自己做梦，还是在人生的轮回大梦中，最重要的一点，是梦会把你识破它的能力拿走，让你相信这个梦境正常、正确，没有异常，一切合情合理。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p123","index":123,"text":"它拿走了你识破它的能力，最重要的就是“一切皆正常”，你会有习以为常、本该如此的想法。","level":0,"key":false,"section":"ep2-p97"},{"id":"ep2-p124","index":124,"text":"四 三把锁怎样把人锁住","level":1,"key":false,"section":"ep2-p124"},{"id":"ep2-p125","index":125,"text":"真相锁 让你看不到系统之外","level":2,"key":false,"section":"ep2-p124"},{"id":"ep2-p126","index":126,"text":"现实中也一样。我们太习惯身边发生的一切，并不觉得自己生活在梦幻泡影中，认为这一切难道不正常吗？当你认为一切皆正常的时候，大概率就活在轮回给你设置的梦境中。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p127","index":127,"text":"那么，梦困住你的手段是什么？三把锁：第一把是真相锁，第二把是思维锁，第三把是设定锁。真相锁很简单，我不让你看到真实。真相解决的是输入问题。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p128","index":128,"text":"当一个人只能接触系统内的东西，你再聪明，也只能看到系统内的东西。脑子非常好使，最多能做到丰富、深入、替换、总结，但绝对不可能突破这套系统。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p129","index":129,"text":"这跟之前讲的熵增一样，具体的我给忘了，那个意思是在一个封闭的系统中，如果没有外力改变，这个系统总会越来越混乱，越来越消耗。你看《三体》里面，第三部叫《死神永生》。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p130","index":130,"text":"最后宇宙的结果，就是如果宇宙之外没有力量来帮助，所有星球、所有生命都会进入热寂效应。整个宇宙越来越乱，能量不停地消耗。现在行星、恒星，包括黑洞所干的事情，都叫瞎折腾，除了瞎折腾，什么都没干。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p131","index":131,"text":"打破熵增的是什么？系统外的能量。那打破我们死循环的是什么？也是系统外的两个东西：一个是系统外的能量，称之为功德；一个是系统外的认知，称之为智慧。系统内解决不了，因为看不到真相，看不到真相就不可能做出正确选择。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p132","index":132,"text":"咱们别拿普通人为例，拿圣人为例。历史上主要的这些圣人，有没有逃出去？第一梯队，同一时期四大圣人：佛陀、老子、上帝、真主。可能上帝那边应该叫耶稣吧，真主那儿应该是穆罕默德。咱不太懂，但反正这四位圣人过来传法，有没有解决人类的问题？解决了一些。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p133","index":133,"text":"但大多数人仍然在梦中。有没有人想解脱？想解脱，但认知不足以突破，最终只是做了一个叫解脱的梦。说白了，只是换了一个姿势继续睡。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p134","index":134,"text":"当你看不到高维的东西，我们称之为低维无解。CPU再好，你只能做丰富、深入、更替、总结，不可能突破。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p135","index":135,"text":"熟知的圣人，比如孔子，有没有探知系统外的东西？没有。孔子成圣，是立规矩、下定义，比如什么是君子，什么是小人。因为那个时候，战国后期——对不起，战国时代，基本上大家都乱了，没有标准，甚至赡养老人都得讨论讨论。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p136","index":136,"text":"孔子在这个阶段非常重要，他给大家立了一个标准，人应该怎么活。但这个事情只是立规矩，并没有改变人类的思维模式，只是用现有系统的规矩约束了一下、改进了一下，性质没有改变，该发生的问题还会发生。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p137","index":137,"text":"王阳明干的事情叫深入，他真正深入了一下，但他说的所有东西，还是在整个系统范围之内。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p138","index":138,"text":"曾国藩干了什么？叫丰富。他很善于总结，也看了很多前人的书，所以有基础进行丰富。他把很多东西归类、整理，然后丰富了一下。但无论怎样，他们所做的事情，只不过是洞察通透、抓本质、归纳总结，除此以外也就这样，仍然活在思维茧房之内。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p139","index":139,"text":"小到个人，大到人类，基本上没有突破。比如很多学生，包括我合作的老张，清华、北大的，还有很多伟人，智商明显碾压我，水平比我强很多。但智商高，只解决了CPU好。思考再多，也没有太大的意义，因为只能做丰富、深入、更替、总结，不可能突破，你没有看到系统外的真实。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p140","index":140,"text":"AI也一样。我用AI做东西，只让它帮我找资料，比如找那些人类一直在犯错误、却没有任何察觉的事情，它能给你找一堆。搁我自己，我哪里总结得出这么多？所以脑子确实没有AI好使，但AI没有看过系统外的东西。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p141","index":141,"text":"你让它总结什么是智慧、空色、因果、慈悲，它一定下不了定义，只能在人类现有认知里面查找，并且在这之上做一点总结归纳和提升。想做出更深刻的东西，做不到，因为没看到过那个东西。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p142","index":142,"text":"当我不让你看到世界更真实的东西时，你再聪明没有用。这就是真相锁。再怎么聪明、再怎么研究，也没有用。盖上井盖之后，你怎么可能想到井盖之外是什么？","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p143","index":143,"text":"比如要想明白贪或者嗔，很难。贪基本上是让你快乐的事情，从来没有人一天打你800个嘴巴，然后你说“我很贪”，这做不到。为什么这么让我快乐的事情会伤害我？因为拉长了看，让你现在快乐的事情，未来会让你付出代价，会让你痛苦，所以贪才不对。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p144","index":144,"text":"假设做的事情现在快乐，未来快乐，永久快乐，那为什么不做？只有现在做很快乐，但未来会倒霉，所以我们认为贪不好。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p145","index":145,"text":"嗔的原理是什么？我现在愤怒了、发脾气了，可能伤害了对方，或者对方伤害了我。有的时候，我觉得自己是正义的，我用自己认为正义、有道理的方式还击对方。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p146","index":146,"text":"但在更久远、更长远的时间里看，就是两个笨蛋互相咬，两条狗互相咬。甭管谁的理由更对一点，本质上没什么区别。嗔就是要解决这个事情。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p147","index":147,"text":"你不以轮回的角度看待，就理解不了贪嗔。用人类的思维，站在人类一世的角度，理解不了它为什么伤害你。所以必须站在轮回之外看轮回，才能明白很多。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p148","index":148,"text":"思维锁 看到问题却不再追问","level":2,"key":false,"section":"ep2-p124"},{"id":"ep2-p149","index":149,"text":"第二个叫思维锁，让你看到，但是想不到。思维锁不是让人没有发现矛盾、没有发现问题，而是让人习惯性停在某个位置，不是一有问题就追根问到底，一发现毛病就打破砂锅问到底。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p150","index":150,"text":"它让人习惯性不问、不想，下意识不往那个方向想。当我把思维给你锁上时，世间不是没有问题，是你压根不往那个方向想。这才是思维锁最大的问题，它呈现的一个重要东西就是一切皆正常。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p151","index":151,"text":"你不觉得这是一件很意外的事。看不见，是信息的边界；不去问，是思维的边界。两者叠加，人既缺少新信息，也失去寻找新信息的动力。这就是我们为什么叫《问道》。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p152","index":152,"text":"《问道》最重要的一点，是破思维锁。让你学会问为什么，经常质疑，恢复提问和追问的能力，这对我们很重要。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p153","index":153,"text":"举一些简单的例子。比如智慧，你从来不去想：智慧是什么？对我们有什么用？能帮我们干什么？佛教里面讲了那么多空色，学了对我们有什么用？除了知道这个世界是假的，还有什么用？《道德经》说阴阳、说道，我知道有这个东西，它能解决生活中的什么问题？你从来不去想。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p154","index":154,"text":"为什么要结婚？为什么要生孩子？为什么要学习？学习重要吗？学历重要吗？","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p155","index":155,"text":"设定锁 明知道不对仍然改不了","level":2,"key":false,"section":"ep2-p124"},{"id":"ep2-p156","index":156,"text":"你有去想这些问题吗？不是它没有问题，是你下意识没去想，这才是最大的问题。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p157","index":157,"text":"第三把锁叫设定锁。轮回怎么把你困住？就是让你明知道这个东西不对，但仍然改不了。这涉及原罪。原罪叫与生俱来，天生就会，不用学习。人类有一些天生就会自动运行、不需要学习，却会伤害自己和他人的行为、习惯，我们称之为原罪。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p158","index":158,"text":"原罪分为三种。第一种叫天生原罪，像情绪、贪婪、嫉妒，五毒四心里面说的这些，基本上都是天生原罪。从来不需要专门学习，但绝对与生俱来。没听说谁不学一下贪、不学一下嗔，就没有贪念、不会生气。知识得学，这东西不用学。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p159","index":159,"text":"这叫本能、天生设定。这些东西不仅被设定了，还会影响整个人类。就算知道发脾气不对，你也改不了，这就是原始设定。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p160","index":160,"text":"第二种叫文明植入的原罪。不是人出生自带的，每个时代不一样，但每个时代都有一堆人被它影响。比如这个时代，孩子要好好学习。古代有一段，朱熹之后、民国之前，要求女人裹脚，大家都裹。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p161","index":161,"text":"你说这对不对？肯定不对，不是残害女性吗？把脚裹得变形，多少人痛苦过来的？责任大了。但那个时候大家觉得对，女人不裹脚嫁不出去，甚至很多女的因为不裹脚而羞耻。你说这是不是很奇怪？这个叫社会原罪。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p162","index":162,"text":"包括养老问题，有的社会有养老，有的社会不兴养老，也是社会植入的东西。重男轻女，有的社会重，有的社会不重。还有女生喜欢上嫁、慕强，也都是社会造成的。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p163","index":163,"text":"第三种是家庭和环境造成的原罪。一个区域，以及父母的习惯、认知，都会影响你。比如东北的暴脾气，会影响离婚率。离婚率居高不下，全国第一，是东北的。但是东北夫妻遇到的问题，南方不会遇到吗？其实南方也会，只不过大家处理的方式不一样，造成离婚率不一样。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p164","index":164,"text":"怎么办？没办法，因为他爷爷奶奶、爸爸妈妈都是这样，从小到大看到的所有人、所有朋友，处理问题都用这种方式。在他的认知里，没有出现过用其他方式处理相应问题的办法，所以只会用这种方法解决，下意识用这种方法。这叫环境产生的原罪。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p165","index":165,"text":"好，咱们说了这么多困住你的方式。","level":0,"key":false,"section":"ep2-p124"},{"id":"ep2-p166","index":166,"text":"五 觉 发现原有系统有问题","level":1,"key":false,"section":"ep2-p166"},{"id":"ep2-p167","index":167,"text":"第一种触发 反差太大","level":2,"key":false,"section":"ep2-p166"},{"id":"ep2-p168","index":168,"text":"下面再说觉，给人类产生希望的觉，马上入场了。觉是什么？其实很简单，发现不对了：“好像我被忽悠了。”觉察、觉醒，都是这个。发现不对，我要从原有系统中脱离出来，发现原有系统的认知、思维、行为有问题，这就是觉。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p169","index":169,"text":"觉一共有四种。你自己想想，从睡梦中要醒来，只可能发生四种。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p170","index":170,"text":"第一种，反差实在太大了。比如假设做梦娶媳妇，梦到娶范冰冰，虽然反差大，但不痛苦，这是多美妙的梦，为什么要醒？多睡会儿。那如果做梦发现娶了凤姐，觉得太噩梦、太痛苦了，赶紧醒了吧，这叫反差大。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p171","index":171,"text":"再比如发现别人长了八个鼻子、九个嘴，明显不对，这也叫反差太大。不好意思，对不起凤姐，咱们只能用她来说。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p172","index":172,"text":"但现实中反差大很难，因为你对现有的生活、人类经历的这些东西都习以为常。你觉得，难道人类不需要这样生活吗？你没看到系统之外的真实，就不觉得这个世界奇怪。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p173","index":173,"text":"如果经常能看到天界、佛界、鬼界、阿修罗界，看到诸天位面，看完再看人间，你就会想：“我怎么到这儿了？”因为你没看到过人间界之外的东西，所以觉得人间一切皆正常。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p174","index":174,"text":"所以很难产生反差。包括之前说的蓝天白云，其实在整个轮回的诸天位面里面，蓝天白云的界面并不多。搁我们经常看外面的，看到这个界面居然是蓝天白云，会多看一会儿。其他的天不是蓝的，不是蓝的多，蓝的少，所以觉得不一样，挺稀奇。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p175","index":175,"text":"搁你，你觉得这不是傻子吗？天天看，蓝天白云有什么可看的？所以，没有反差，就很难从这个梦中惊醒。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p176","index":176,"text":"第二种触发 发现逻辑不合理","level":2,"key":false,"section":"ep2-p166"},{"id":"ep2-p177","index":177,"text":"第二件事，叫逻辑上不合理。这是从梦中醒来的一种方式，我们只是说一下。实际上能在梦中觉得这个梦不合理的很少，纵观整个人类，在现实中觉得不合理的也非常少。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p178","index":178,"text":"比较熟悉的，龙树菩萨算其中一个。那么多佛教徒里面，能在现实里找到这个世界逻辑上不合理的，好像也就是龙树。他发明了一种叫“哥白尼反转”的梦话方式和思维方式。按照他那一套东西走，最后你会发现，所有东西都不符合逻辑。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p179","index":179,"text":"不符合逻辑，就应该是假的，这是他的观点。能做到这种地步，我也做不到，人家确实洞察力、分析能力极高，才能发现。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p180","index":180,"text":"对于咱们，也就发现点双缝干涉：光的成像怎么能根据观测和不观测，产生两种情况？它怎么知道我在观测？不合理，你就觉得这个世界是假的。但很难，所以我们只是在学术上列出这么一个东西，现实中真正能做到的很少。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p181","index":181,"text":"最主要的还得有反差。你得知道系统外的世界是什么样子，才会觉得系统内有问题。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p182","index":182,"text":"第三种触发 痛苦超出承受范围","level":2,"key":false,"section":"ep2-p166"},{"id":"ep2-p183","index":183,"text":"第三个叫痛苦，痛苦刺激超出承受范围。比如在梦中，一堆鬼追你，打不过，最后哭了，醒了。我记得喜灵师傅有一次，好像是恶鬼化成恶犬，直接咬他的手臂，连骨头茬都咬出来了。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p184","index":184,"text":"在梦里痛得实在受不了，突然醒了。所以能在梦中醒来，绝大多数不是睡到点了，就是痛醒、吓醒的。不刺激、不痛苦，想从梦中醒来挺费劲。假设这个梦一直不可能醒来的情况下，你得有痛苦。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p185","index":185,"text":"所以你会发现，人类世界真正愿意追求真理的，叫心不死道不生。你不痛到一定程度，怎么会否认或者重新审视自己的思维、所思所行是否正确？你不会认为自己错误。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p186","index":186,"text":"比如天天幸福，每天中个500万彩票，一堆美女或者帅哥追着你，要吃有吃、要喝有喝，要别墅有别墅。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p187","index":187,"text":"要游艇有游艇，你会反思这不正常吗？更多是觉得实力所归，老天终于看到我的实力，太好了。你大概率不会反思。能在幸福中反思的都是厉害人，绝大多数人都在痛苦中反思。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p188","index":188,"text":"所以每逢人类大灾大难之时，都是人类突破的时候。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p189","index":189,"text":"很多科技突破，不是在战争，就是在大灾中。要没有黑死病在欧洲折腾100年，一半人，人类医学肯定突破不了。很多东西也是在战争中突破的，这没办法。所以要想改变，必须给人类痛苦。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p190","index":190,"text":"为什么现在我们传法的时候，正好赶上这些？","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p191","index":191,"text":"末法时代、五浊恶世、经济大萧条、九紫离火运，为什么都是这些？不让大家痛得冒泡，大家想不到我要改变，就是这样。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p192","index":192,"text":"第四种触发 被人点醒","level":2,"key":false,"section":"ep2-p166"},{"id":"ep2-p193","index":193,"text":"第四个触发，是被人点醒。所以找一个好老师很重要。能遇到一个明白人，愿意跟你说点真话，在轮回中非常难。像以前的那些圣人，就很难得。","level":0,"key":false,"section":"ep2-p166"},{"id":"ep2-p194","index":194,"text":"六 醒 让伤害自己的错误不再重复","level":1,"key":false,"section":"ep2-p194"},{"id":"ep2-p195","index":195,"text":"觉醒需要一个清楚的定义","level":2,"key":false,"section":"ep2-p194"},{"id":"ep2-p196","index":196,"text":"说完迷、困、觉，最后该说醒了。醒这个部分也比较多。首先需要有一个定义，什么是觉醒？你自己去找AI，它一定没有统一标准。整个人类历史在很多东西上，没有具体定义，这很奇怪。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p197","index":197,"text":"传统定义说，从沉睡、迷惑、错误或者麻木状态中清醒过来，产生觉悟，这叫觉醒。稍微靠点边的说法是：“觉醒不是我想明白了一个问题，而是导致我痛苦和轮回的根本无明被破除。”这个说得靠谱点，但什么是无明？又没说。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p198","index":198,"text":"底下又来一个大明白，说“明心见性就是觉醒”。何为明心？何为见性？明到什么地步，见到什么地步，怎么明？又没说。不仅中国，其他地方也一样，不把事说清楚，这是特别讨厌的一件事。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p199","index":199,"text":"所以不看古人了，咱靠自己。先说点玩笑的：“醒来不做梦中事”，就称之为醒，这个定义不好，继续；“让自己和众生一切错误的过去不再重复”，好像靠点边；“让鉴古知今、学史明志再没有意义”，也有点贴边；“一层一层、一个一个消灭人类的顽疾”，这也算是。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p200","index":200,"text":"你看，这些是AI总结的，它没有给出具体定义，而是用描述的方式解释。给你的叫描述性的解释，不是定义，经常这样，因为不知道定义是什么。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p201","index":201,"text":"我们用说人话的方式，来定义什么是真正的觉醒：","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p202","index":202,"text":"发现、改正、清除轮回中让自己受伤害的一切认知、想法和行为。你能做到这点，就称之为觉醒。","level":0,"key":true,"section":"ep2-p194"},{"id":"ep2-p203","index":203,"text":"每修正一个问题，就是一次觉醒。当你能把所有问题都修正，就是圆满觉醒。就这么简单。有问题，发现一个，咱就改一个、解决一个。有的时候，不仅要从表面解决，还要从根源上挖掘，说白了，一定要断根。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p204","index":204,"text":"觉醒的目的，是让问题永远不再出现。如果只解决现在的问题，同样性质的下一次又出现，就叫没断根，只是解决了表面。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p205","index":205,"text":"什么是断根？就是永不复现。","level":0,"key":true,"section":"ep2-p194"},{"id":"ep2-p206","index":206,"text":"用定义重新看人类的状态","level":2,"key":false,"section":"ep2-p194"},{"id":"ep2-p207","index":207,"text":"以后再有一帮大聪明跟你说，打坐念经、顿悟就能觉醒，拿个东西“梆”敲一下就觉醒了，你就大嘴巴抽他，就醒了。一个连生活问题都发现不了的人，他觉醒个屁；一个连轮回怎么坑害你都搞不清楚的人，他觉醒个屁，就是这样。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p208","index":208,"text":"既然已经有定义，我问你，现在人类是什么状态？说好听点，半觉醒状态；说不好听点，觉醒也就是露个头。这里必须说一个问题，历史上不是没有圣贤把上面的东西带下来，有。我们也不缺少正确的智慧。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p209","index":209,"text":"但2000年内，如果用刚才对觉醒的定义重新看人类，该犯什么问题还犯什么问题，你怎么叫觉醒了？还困在人类大梦、轮回大梦中。有了定义，再重新看人类状态，你就知道了，这叫觉醒吗？说好听点，10%吧，说得更夸张一点，半觉醒。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p210","index":210,"text":"为什么有圣贤来人间，还是做不到人类全面觉醒？有几个断点，大家听一下。","level":0,"key":false,"section":"ep2-p194"},{"id":"ep2-p211","index":211,"text":"七 从圣贤智慧到现实应用的五个断点","level":1,"key":false,"section":"ep2-p211"},{"id":"ep2-p212","index":212,"text":"第一个断点 用不了的智慧","level":2,"key":false,"section":"ep2-p211"},{"id":"ep2-p213","index":213,"text":"第一个断点，叫用不了的智慧。就上次讲的故事，那次我在研究智慧，观音下来了，我就问：“你看我智慧这么多年，怎么就在八这个坎上不去了呢？我到底缺哪儿？圆满智慧到底是什么？”观音老人家来了一句：“等你不研究智慧的时候，你就是圆满智慧了。”","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p214","index":214,"text":"这说得似乎很有道理，但仔细想想，我不研究智慧就圆满智慧，难道不研究就能进步了吗？这不扯淡吗？记住，你们可不能跟观音这么说，关系不到，我就可以这么说。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p215","index":215,"text":"所以我直接薅着他说：“整个人间界，就是被你们这帮佛界的人给祸害了。”因为你们说的是“圆满的结论性的智慧”，我给它起这个名字。说得对不对？是对的，但在人间没办法用。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p216","index":216,"text":"就跟学武功似的，给一本武功秘籍，正常情况下先学习、研究，然后得练。练个十年八年，熟悉、精通了，咱们开始忘记。这个时候有人问，学武功的至高境界是什么？就是无招胜有招，确实没毛病。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p217","index":217,"text":"但不能跟人家刚开始的时候就说无招胜有招，你得先说怎么学的，过程怎么经历的。最后的状态的确是无招胜有招，但不能把它作为大家指导性的结论。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p218","index":218,"text":"我跟你说，四大宗教下来的所有圣人，都是一个鸟样。为什么我能说这句话？因为见过圣人之外传法的方式。比如兜率陀天大法会上说的东西，就不是这样的。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p219","index":219,"text":"上帝那边、耶稣那边、真主那边怎么传，我不太清楚，肯定不是大号下来，这个我敢肯定。佛教也好，道教也好，肯定是小号下来。道教的小号咱不好说，但佛界的是佛祖的一个小号，而且这个小号一定在人间传法没经验。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p220","index":220,"text":"为什么说没经验？因为他传的是佛界佛法，很多东西是圆满的结果性智慧和指导。说得对，但在人间很多东西用不上。包括让你吃素、远离红尘、持戒，这些都是标准的佛界修行方法，记住，标准的佛界修行方法。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p221","index":221,"text":"因为佛界那边很多众生本来不吃饭，很多一天只吃一顿饭没有问题，所以过午不食，真正的佛祖当年是过午不食。佛界很多众生没有什么人性，这不是说他坏，而是没有人类思维。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p222","index":222,"text":"所以对很多人类的东西，他不习惯，也觉得很脏，最重要的是避开。你看整个佛教传的是尽可能远离红尘，别跟他们产生关系。这是标准的佛界佛法。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p223","index":223,"text":"他自己明白这个东西的时候，你问观音智慧，他就这么说；问佛祖，也这么说。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p224","index":224,"text":"为什么？因为上面的人都明白。他不认为一个吃饭的行为，还要告诉你怎么拿筷子、怎么夹东西、怎么放嘴里，不就是夹完往嘴里放吗？这个还需要说吗？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p225","index":225,"text":"所以很多东西出了问题。什么是智慧、修行、大爱、慈悲、不恨、圆满，很多都没有说到底。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p226","index":226,"text":"上来就说你要修慈悲，普通人类怎么可能修慈悲？慈悲是大爱的表现形式，是大爱和不恨在人间的最终表现形式。大爱和不恨没修好，不可能在人间表现出真的慈悲。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p227","index":227,"text":"你不可能做到无限包容、无限忍让、无限成就、无限大爱，好像之前还有一个，我给忘了，一共五个。做不到这点，最多是一个好心人、一个善人，但那个不叫慈悲，不要去侮辱慈悲。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p228","index":228,"text":"大爱从哪里来？从感恩来。大爱的来源有两种。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p229","index":229,"text":"一个是通过感恩生出大爱，一个是女娲的慈母法则。但慈母法则很难修，因为众生不是你生出来的。女娲对众生的爱叫慈母之爱，不是说修不了，是很难修。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p230","index":230,"text":"普通众生应该更多修的是感恩大爱，像我一样，这个比较简单。但感恩大爱要先修什么？先修成本法则、代价法则。你根本不知道众生为你付出了什么，凭什么感恩？这是一套逻辑，谁跟你讲了？肯定没人跟你说。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p231","index":231,"text":"上来一帮傻子就说修慈悲，你不可能修出道果，认为的慈悲一定是假慈悲，经不住时间和事情的撞击。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p232","index":232,"text":"包括智慧、修行、大爱、慈悲、不恨、圆满、空色，把这些放到AI里，最多看到描述性的解释。不能说是定义。尤其智慧，你去问什么是智慧，学了对我有什么帮助，更多是说“学了能更好”，这解决什么问题？这是描述性的解释，不是定义。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p233","index":233,"text":"整个佛教、道教也好，我估计真主、上帝那边也好不到哪儿去。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p234","index":234,"text":"这四个圣人是真把东西传了，但是传的人太高了，所以传的时候都是这个问题。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p235","index":235,"text":"我们用螺丝刀理论来说。所有众生干的事情，是说这个螺丝刀可好了，用什么东西做的。所有经典多是解释、补充说明，很少有人总结，因为说不出来。都在说螺丝刀在哪里采的木头、用的铁，什么天外陨铁做的，可厉害了。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p236","index":236,"text":"你问这东西到底有什么用，解决生活中的什么问题？不知道，因为世尊没说。很多佛教、道教经典，包括海外那些圣人的经典，都没告诉你能干什么、怎么使、什么时候使。也就是说，螺丝刀给你了，但忘了说它是拧螺丝的。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p237","index":237,"text":"智慧能干什么，能解决人类什么问题？不知道。再去追究很多东西，比如什么是错误、什么是正确，没有人定义。修行最终的东西是什么？不知道，只能说会越来越好，但没有定义，这很奇怪。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p238","index":238,"text":"第二个断点 高高在上的无用智慧","level":2,"key":false,"section":"ep2-p211"},{"id":"ep2-p239","index":239,"text":"第二个，叫高高在上的无用智慧。慧能说“本来无一物，何处惹尘埃”，我不认同。既然空即是色、色即是空，凭什么说本来无一物？想修空，是不是修的色越多，空就越大？色无限，空也无限。怎么能说本来无一物？本来无一物，你下来干什么，闲的？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p240","index":240,"text":"当你不知道真相的时候，很多哲学家、名人天天说人生没有意义。但凡动点脑，用脚趾头想想，人生没意义，为什么能活着？你觉得没意义，上天创造这个体系，费了这么大资源，会让你活着没意义吗？你脑子怎么想的？本来无一物，那你算什么东西？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p241","index":241,"text":"你光听“应无所住而生其心”，《心经》忘了看吧？空即是色、色即是空怎么解释？空色一体怎么解释？还有一帮人没事修无无，比如把空给空掉，很多人不明白这是什么。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p242","index":242,"text":"这是污染法则，用污染法则就说明白了，结果一堆人说不清楚。还有说继续修无无无的，那东西到底有没有？反正我这么熟佛界，都不敢确定它存在。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p243","index":243,"text":"这就像数学。现在数学不是科学，为什么？因为很多东西无法验证，逻辑上成立，但现实中找不出来，这就是数学。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p244","index":244,"text":"无无这个东西，理论上应该成立，但佛界有没有真的找到无无？不好说。你这属于小学生研究量子力学。研究成或者研究不成，跟逃出人间界有个屁关系？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p245","index":245,"text":"先别想着去佛界，也别先研究无无，是不是先想咱们升上一级，去天界混混？很多东西，属于智力上的互相比拼，觉得不说出这个话就压不住他，都是这么来的。你别跟着学，很多东西到现在佛界都不一定有定论。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p246","index":246,"text":"几千年来古人都没想明白的事，你也不用去想，不要觉得自己能想明白。几千年没想明白，也没对你产生帮助，大概率未来也不会产生帮助。多一个不多，少一个不少。把能对自己产生帮助的，先让它产生帮助。去到天界后，说不定就能发现对自己有帮助的了。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p247","index":247,"text":"不影响去天界、不影响升一级的，能少研究就少研究。人生匆匆几十年，非要研究连佛界都搞不清楚的东西，你闲的？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p248","index":248,"text":"怎么判断这个东西世间无用？找圈内真正明白的人，他一听就明白。像社会经验强的人，你一张嘴，我就知道什么水平；往这一站，就知道大概人品怎么样。为什么？没有为什么，我看一眼就知道，因为我懂。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p249","index":249,"text":"比如西方说很多天使没有性别，一听就知道是色界天，因为色界天不能有性别。至少他们主神的控制范围在色界天。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p250","index":250,"text":"有个《超体》，那女的最后说“我无处不在”。能说出这句话，就代表他们主神所在空间至少到了无色界天。无色界天没有肉身，都是以思维或能量的形式存在，当然我无处不在。所以只要说出这句话，我就知道他们主神肯定在无色界天，不然说不出来。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p251","index":251,"text":"再比如，一帮人在人间求寿、求长生，一听就知道不是从上面来的，要不就是从上面来了之后没开脑袋、没开智。但凡从上面来做任务，你想想。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p252","index":252,"text":"你可能在人间求长寿吗？更多是想，完事拍屁股赶紧回去，这是又脏乱差的地方。你是大城市的，好不容易跑到城中村做检查，怎么，还打算常驻城中村？在人间一求寿，我就知道什么水平，肯定不能跟上面沟通。但凡恢复上面的记忆，绝对说不出这四个字。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p253","index":253,"text":"第二，人间修仙，修它干什么？你不是五魂状态，是三魂状态，神通法力、能量都不在身上，那不就是在沙漠里练游泳吗？真想修，回去修，功法、能量、法器到处都是，非跑这么一个旮旯角、穷了吧唧的地方学，你脑子进水。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p254","index":254,"text":"第三，希望通过翻古籍找到答案的，我跟你说，水平一定很差。不能说很差，给你点面子，我只能说永远做不到顶尖。所有顶尖，没有一个是翻古籍的。古籍会不会看？偶尔会看看。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p255","index":255,"text":"比如我这行，基本看完《金刚经》《心经》《地藏经》，还读过《楞严咒》《十善业道经》，偶尔每年念一次《月光菩萨陀罗尼咒》，《药师经》也读过，其他经一律不看。真明白的人，这些经文足够让你明白所有东西。不是那块料，不通透、不能连接上面，看再多也没用。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p256","index":256,"text":"还有人说要向上修、成仙成佛，一听就是初级阶段，小伙子慢慢修。还想从底下往上修、位列仙班，因为还需要增加能量往上走。但我们已经到了通过小号往下走，你还在修上的阶段，真正的大佬都往下修，开始修圆满。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p257","index":257,"text":"还有人想干点什么就去佛界，你当佛界是你家开的？很难的，一听就知道你不了解去佛界的难度。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p258","index":258,"text":"第三个断点 不知道如何做","level":2,"key":false,"section":"ep2-p211"},{"id":"ep2-p259","index":259,"text":"第三个断点，是不知道如何做。很多话没有大白话。我觉得也可能是上面传的时候，他觉得已经说完了，没有办法站在人类角度理解，这些话人类做不到。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p260","index":260,"text":"比如无上正等正觉，“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提”，这是《金刚经》上的原话。那我请问，在人间应该怎么做？不知道。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p261","index":261,"text":"说白了特别简单，什么都别想，把行善当成本能、习惯，当成连想都不用想的事情，这就叫无上正等正觉。不要问为什么，我就想做这事。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p262","index":262,"text":"《金刚经》说“庄严国土，即非庄严，是名庄严”，两个事。一个是污染法则，只要有庄严佛土的想法，就一定被污染了，就不是庄严佛土。只要有想脱离生死的想法，记住，永远脱离不了生死。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p263","index":263,"text":"第二件事是混沌。你修的是混沌，混沌不能有显相，有显相就不是混沌。所以世尊说，在燃灯佛祖那里无所得；有所得就是显相，只要有显相，就不是混沌，不是混沌法则。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p264","index":264,"text":"说白了就这两个事，说清楚就完了，非得用那种方式表达，结果一堆人看完还是搞不清。包括功德，用很多方式表达，说白了，一个是无相功德、无量功德，一个是法布施，无量功德；一个是具体做善事，是有量功德，就这么简单。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p265","index":265,"text":"慈悲、不恨、大爱、平等都一样，全没说清楚具体应该怎么弄，很遗憾。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p266","index":266,"text":"第四个断点 修行体系没有落到解脱枷锁","level":2,"key":false,"section":"ep2-p211"},{"id":"ep2-p267","index":267,"text":"第四点，也是整个文明最奇怪的一件事，我觉得可能就是时机不到。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p268","index":268,"text":"四位非常伟大的圣人，把很多高维知识传到人间时，人间其实有非常大的觉醒机会。但是不知道怎么回事，结果传歪了。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p269","index":269,"text":"比如说阴阳，大家都知道，那阳的部分是什么，阴的部分是什么，你倒说清楚。阴的部分绝对不是阴间。阳是摸得着、看得着的显化的东西，阴是摸不着、看不着的东西。世界由两部分组成，你倒告诉我，这摸不着、看不着的是什么？包括摸得着、看得着的，哪些重要，哪些不重要？没说。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p270","index":270,"text":"空色也是这样，叫显相和混沌，你大概说一下，无也一样。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p271","index":271,"text":"冰山法则最重要的，是从阴向阳、从无向有之间的转化。转化率是什么？说的是冰山法则，结果没说。连老子都说“万物生于阳，而阳生于阴”，很清楚的一套逻辑，但生多少，没说。既然已经说到阴阳，怎么不说法界成相？也没说，很奇怪。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p272","index":272,"text":"好，这些都可以不说。你来人间，说上面有上面的位面，下面有下面的位面，上面有神有佛，下面有人、畜生、鬼，这些都说了。那么影响人间、影响人类成长的，都有哪些指标，怎么不说？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p273","index":273,"text":"无论修佛、修道，还是修上帝、真主，问他：“在人间，我把哪些指标修了，就能确保轮回等级往上走？”没跟你说。有的可能说一点，比如修功德。那人间还有什么？这些东西没有归类总结。就觉得很奇怪，你们跑这一趟干什么来了？","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p274","index":274,"text":"包括高维世界观也没往下传。得出的智慧、五毒四心、生死这些，不都是站在高维之上才能看到的吗？那是人间能看到的吗？既然不是，为什么不说高维世界观？也没说。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p275","index":275,"text":"最后整个宗教体系变成什么？以佛教为例，拜神、拜佛、读经、打坐、持戒、布施、练功，这叫修行。再多加一个，做好人、做善事。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p276","index":276,"text":"道教也是，拜神，练法术、算卦，山医命相卜，念经、打坐、持戒、布施、练功，做点好事。伊斯兰教咱不知道，但信上帝的，也是做好事、不伤害、感恩。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p277","index":277,"text":"整个修行体系完全变成这一套，跟人类解脱枷锁一点关系没有，具体思想上哪里有问题，完全没说，这就很奇怪。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p278","index":278,"text":"第五个断点 星星之火没有燎原","level":2,"key":false,"section":"ep2-p211"},{"id":"ep2-p279","index":279,"text":"第五个断点，叫星星之火没有燎原。在几千年的历史中，除了这四个圣人，有没有更厉害的人？其实有。比如王阳明、弘一法师，总结的一些金句非常厉害。但一生中也就几个金句。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p280","index":280,"text":"你用AI总结这些先贤的东西，一生核心观点大概五条左右就算高人，能到十条的快成半圣，超过十条、三十条以内的，基本可以入圣，也就这水平。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p281","index":281,"text":"不是说没给人类带来希望，带来了，但是点状的，没有成片。有没有星星之火？有，但可惜，要把人类命运改变，想都别想。所以叫星星之火没有燎原。","level":0,"key":false,"section":"ep2-p211"},{"id":"ep2-p282","index":282,"text":"八 学习与练习 走向全觉醒","level":1,"key":false,"section":"ep2-p282"},{"id":"ep2-p283","index":283,"text":"自悟自修与跟着老师学习","level":2,"key":false,"section":"ep2-p282"},{"id":"ep2-p284","index":284,"text":"咱们要做什么？要进入全觉醒状态。全觉醒，两种方式。一个是自己觉醒，自己发现问题、解决问题。但凡你是那块料，我今天就不在这儿讲了。可能不可能？可能，但今生能达到这种状态，可能性不大。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p285","index":285,"text":"第二个，跟着老师学习。智慧、传法、觉醒，都是两条路。一个是自悟自修，整个轮回里面也不多，这个不要去想。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p286","index":286,"text":"就像从小学到高中，可能要学两万到四万个知识点，哪个是自己发明创造的？哪个也不是吧？耽误你变成一个非常优秀的人了吗？一点没耽误。虽然不是咱发明的，但不是不能学。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p287","index":287,"text":"觉醒、智慧这些事情，你自己想不明白，耽误你变成有智慧的人、觉醒的人吗？压根不耽误。只要把问题和知识点学会，一样会变成非常厉害的觉醒者。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p288","index":288,"text":"人类说明书要做的事情","level":2,"key":false,"section":"ep2-p282"},{"id":"ep2-p289","index":289,"text":"咱们人类说明书要干什么？第一，为圣贤们打打补丁。咱这辈子成不了圣贤，不代表不能给圣贤打补丁。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p290","index":290,"text":"第二，把影响你的所有主要木板，也就是木桶原则里的这些东西，都告诉你，把主要的先修了。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p291","index":291,"text":"第三，把影响人间和法界的规则，只要涉及人间界，能告诉你的都告诉你，能说的都说，让你活得清清楚楚、明明白白。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p292","index":292,"text":"第四，全面提升大家的真相和思维模型，让大家用更高级、超越人类的智慧去理解人间。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p293","index":293,"text":"想看清庐山全貌，就必须在庐山之外，在庐山中不行。想真正在人间活明白，必须有人类之外的智慧、视角，更要有人类之外的思维。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p294","index":294,"text":"难不难？不太容易。大家一定要用这一生和整个轮回的时间不停努力。正所谓：“难言菩提众，众生性志无定，习恶者多，纵发善心，须臾即退，为善为恶，逐恶而生。”所以不太容易。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p295","index":295,"text":"怎么办？请大家以后跟着明白人学习人类说明书，学好之后好好练习，最后形成习惯。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p296","index":296,"text":"四大部分与课程安排","level":2,"key":false,"section":"ep2-p282"},{"id":"ep2-p297","index":297,"text":"人类说明书的东西非常多，首先就是四大块。第一是逆修觉者，主要解决真相和思维。你们现在听的这部分叫天道思维，首先要给大家灌输轮回之外的思维是什么。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p298","index":298,"text":"第二是人道思维，说白了，有些做人做事的方式，你做得不对。第三是人设思维，学会给自己建防护墙。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p299","index":299,"text":"然后，人类说明书第二部分是灵魂觉者，解决大家灵魂上的问题。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p300","index":300,"text":"第三部分是法界天机，就是之前说的封建迷信那些东西。第四部分是道法自然，融会贯通。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p301","index":301,"text":"这四部加在一起，我估计：天道思维现在已经确定76集、77集；人道思维、人设思维加在一起，估计也得200多集，所以加起来二三百集是有的。再加灵魂觉者、法界天机、道法自然，总共五六百集差不多。这还没加真相，再加真相，估计一两千集是有的。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p302","index":302,"text":"把觉醒落实在生活问题的解决上","level":2,"key":false,"section":"ep2-p282"},{"id":"ep2-p303","index":303,"text":"想觉醒容易吗？知道这些，你就知道想活明白没那么容易。还得有人带着咱们走案例。想觉醒、想不被轮回坑，不容易。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p304","index":304,"text":"请大家记住，我不希望最后教完这些东西，又成了一堆人类吹嘘、茶余饭后比拼自己智慧高的方式。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p305","index":305,"text":"我觉得一定要真正落实在解决人类生活中的问题。我希望看到，通过学习人类说明书，你能真实地解决那些在轮回中一次又一次伤害自己的认知、思维和行为。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p306","index":306,"text":"咱不求一世就把所有问题解决，太难了，但要经常积累，叫正向积累。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p307","index":307,"text":"碰到一个问题，解决一个问题。就算不能全面解决，至少解决百分之七八十，减少这些问题在生命中对我们的伤害，最终达到圆满状态。我觉得这才是真正的觉醒，带着大家觉醒。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p308","index":308,"text":"一个觉醒者，如果发现不了生活中的问题，也解决不了生活中的问题，就不配称之为觉醒。觉醒不太容易，觉醒来自生活问题的解决，是让轮回中的错误不再伤害你，这才最重要。","level":0,"key":false,"section":"ep2-p282"},{"id":"ep2-p309","index":309,"text":"好，今天就讲到这儿，讲得有点多，快两个小时。但今天这个很难，能讲明白还挺费劲。希望没有打扰大家，咱们下次再见。之后的我估计就没那么费劲了。好，拜拜。","level":0,"key":false,"section":"ep2-p282"}],"note":{"title":"第三课已修订概念","text":"第三课将两者分开：觉醒是发现或确定问题；解脱是不再伤害、永不复现。第二课正文保留当时的表述。","target":"ep3-p68","label":"查看第三课修订"}},{"id":"ep3","number":3,"name":"问道三","title":"人类说明书框架","speaker":"悟聊天尊","source":"20260808_问道3_人类说明书框架_整理稿.docx","date":"2026-08-08","description":"修订觉醒与解脱的定义，说明四大框架与红尘道场，把知识带进生活。","blocks":[{"id":"ep3-p36","index":36,"text":"一 开场近况与本课安排","level":1,"key":false,"section":"ep3-p36"},{"id":"ep3-p37","index":37,"text":"身体近况","level":2,"key":false,"section":"ep3-p36"},{"id":"ep3-p38","index":38,"text":"又发烧感冒。上次《问道》第二集的时候，嗓子已经有问题了，结果还是没扛住。我吃了一堆药，该发烧还是发烧，该感冒继续感冒，没招，脑子已经不转了，那怎么办？继续休息。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p39","index":39,"text":"你看，要经历很多考验。首先脑子有问题，之后血糖总算弄好了，上了一个东西，还真的挺不错。我现在血糖很好，睡觉的时候都四点多了，这历史上都没发生过，控制得很好。肩周炎现在非常顺快，打苍蝇一点压力都没有。最后是血压，以为所有病都没问题了，但在不出意外的时候又出意外，来了一个重感冒。我已经半年没得感冒了。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p40","index":40,"text":"这就是所谓病气50、病气50%，不是这儿出问题，就是那儿出问题。等感冒好了，嗓子还有点痰，但基本算好了，又发现喝凉水、热水都牙疼，这事太奇怪了。我还是很爱护牙齿的，冲牙器、牙刷、牙缝刷都倒腾一遍，再用电动牙刷、漱口水。因为知道牙不好，我得弄。好几年没出事了，血压一下来，牙又出了问题。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p41","index":41,"text":"你看，不给你整点事，它不罢休，也搞不清楚怎么回事，这是命苦的人。所以你们修的时候，千万别修出一身病气，只要有病气，不定哪里就给你出点问题，这不好说。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p42","index":42,"text":"好，15分了，咱们正式开始。今天应该是《问道》和人类说明书介绍的最后一节课，就不讲新的东西了。有的学生之前听过，比如什么是逆修觉者、每个阶段干什么。为了咱们伟大的人类说明书，在这里再讲一下，看看大家能不能听明白。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p43","index":43,"text":"上期回顾 录制计划与现场交流","level":2,"key":false,"section":"ep3-p36"},{"id":"ep3-p44","index":44,"text":"上一集观点和理念实在太多，而且有点炸。我发现好多人在反复听，就把一些重点拿到这节课，帮大家总结一下。第一，先总结上期；第二，把人类说明书、《问道》和整个章程跟大家说清楚，说完就完事了，所以今天比较简单。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p45","index":45,"text":"在这里先替我朋友做个广告。梵音现在又在做半价活动，一直到9月10号，等于阴历七月份完事就结束。据说全新上架了，半年的、一年的、一个月的都有，都是半价。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p46","index":46,"text":"没购买的，大家赶紧去购买。我虽然不知道未来会不会有什么意外，但坚决不同意一周只录一期。这样一年才52周，连天道思维都录不完，肯定不行。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p47","index":47,"text":"我打算前三集录完之后，自己再重新看一下之前怎么说的。好多学生也写了非常好的提纲和细节，写得真的挺好。正式节目的时候，我还得把大家的图加上。非正式节目，也就是讨论版、碰撞版，没有图，都是讲完之后大家提感觉。所以大家该吐槽的时候，赶紧吐槽。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p48","index":48,"text":"正常情况下，怎么也得两到三天一集，不然几百集什么时候才能录完？但老出意外，我也没招。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p49","index":49,"text":"正式开始《问道》三。首先总结《问道》二，因为核心内容太多，颠覆性的东西也比较多，我看大家重复看的次数不少。正常情况下，就凭咱们这水平，两千多粉丝。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p50","index":50,"text":"今天还有人说，有7100人订阅了。别着急，本年度正常情况下应该不会超过一万。去年测过、看过，好像超不了一万。明年在大陆，还有全球正式开播《问道》，估计先把天道部分播了，明年可能新增一两万粉丝。到2030年，粉丝数能上五万就算不错。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p51","index":51,"text":"咱们上的人都是铁粉，没有虚的。不像其他主播，虚的太多，也不消费；咱们基本上还是消费，大头比较厉害。所以别着急，今年正常情况下上不了一万。你们不仅是金粉，是钻石粉。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p52","index":52,"text":"好，正常开始。上期有一些概念，我们得重新说一下。","level":0,"key":false,"section":"ep3-p36"},{"id":"ep3-p53","index":53,"text":"二 重说迷困与三把锁","level":1,"key":false,"section":"ep3-p53"},{"id":"ep3-p54","index":54,"text":"迷与困的定义","level":2,"key":false,"section":"ep3-p53"},{"id":"ep3-p55","index":55,"text":"第一个，什么是迷？你走错了，而且不停重复走错，就叫迷。比如迷路，转来转去，反正找不着正确方向。在轮回中，如果迷了，是一种什么现象？就是在错误中不停重复。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p56","index":56,"text":"但谁定义正确还是错误？肯定是天道，不是你。所以你并不觉得自己生命中的很多东西是错误的。这才是迷：你不知道自己做错了，也不知道自己不知道，才会出现这种情况。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p57","index":57,"text":"第二个，什么是困？把你限制在一个地方出不来，称之为困。物理上这样，思想上也是把你限制在某些思维、某些认知里面出不来。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p58","index":58,"text":"困分小困和大困，小困是约束，大困是自由。之前用井底之蛙说了三种困的级别。第一种，压根不让你看到光，把井盖焊死，一点光不露出来。青蛙从来没看到过光，都不知道有井外这么个事，这是大困。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p59","index":59,"text":"第二个是中困，让你看到光，但是你自己没出息，获得不了。试了几次不好使，那就放弃，这是第二种。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p60","index":60,"text":"第三种，给你一种找到自由、得到解脱的方式，并且帮助你获得解脱和自由。你以为走出井口，其实只是换一种方式，又把你困在世界中。这是人类现在正在经历的超级大困。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p61","index":61,"text":"我把科技树放开，让你看到、得到很多东西，让你看到通过自己的努力，获得物质文明的极大发展，但精神文明始终被我牢牢抓住。精神上的困，最重要的是习以为常。没觉得不一样，没觉得有差距，没觉得痛苦，还觉得一直在往上走。这才是最可怕的地方。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p62","index":62,"text":"真相锁 思维锁与原罪","level":2,"key":false,"section":"ep3-p53"},{"id":"ep3-p63","index":63,"text":"为了困住你，有三把锁，配合上面三种方式。第一个叫真相锁。我不让你看到真相，不让你知道井外存在，你怎么可能想井外之事？我直接不让你知道外面的世界怎样，这是真相锁的作用，对我们的约束非常大。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p64","index":64,"text":"这么多伟大的科学家，最后居然得出人生没有意义，那只能说你没有意义，人生有意义的多了。得出这种思维的人，绝大多数没看到过人生之外的世界，所以才能得出人生没有意义。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p65","index":65,"text":"第二个叫思维锁，很像第二种情况：让你看到真实，但不让你往真实、正确的方向想。佛祖、菩萨、佛家道家的神，有没有把一些东西传下来？传了。但传完后你使不了，而且都不觉得传下来的东西有问题，从来没怀疑过，下意识脑子就没往那方面想。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p66","index":66,"text":"让你看到了，你就是不往那方面想，没招。这叫思维锁，把你的思维方向锁上。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p67","index":67,"text":"第三个叫原罪。就算知道做错了，也改变不了。比如减肥，都知道多吃不好，能克服吗？不一定。都知道淫念不对，能克服吗？做不到。都知道发火不对，能克服吗？几乎克服不了。让你知道了也解决不了，这叫原罪。","level":0,"key":false,"section":"ep3-p53"},{"id":"ep3-p68","index":68,"text":"三 修正觉醒与解脱的定义","level":1,"key":false,"section":"ep3-p68"},{"id":"ep3-p69","index":69,"text":"发现问题是觉醒 不再伤害是解脱","level":2,"key":false,"section":"ep3-p68"},{"id":"ep3-p70","index":70,"text":"我们上次说了觉醒。后来一些学生跟我聊，说你把觉醒和解脱的定义混淆了。我一想，确实这样。觉醒其实只是发现问题，但能不能真的醒，还不好说。所以现在重新更改一下觉醒的定义。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p71","index":71,"text":"觉醒，是发现或者确定自己的哪些事情有问题。","level":0,"key":true,"section":"ep3-p68"},{"id":"ep3-p72","index":72,"text":"这是非常重要的标准。如果修行半天，连轮回中所做的哪些事情有问题、怎么伤害你，都没搞清楚，修行个屁！你还活在错误中，时刻被伤害，怎么说自己醒了？所以得能够发现、觉察自己哪里有问题。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p73","index":73,"text":"解脱，叫不再伤害、永不复现。","level":0,"key":true,"section":"ep3-p68"},{"id":"ep3-p74","index":74,"text":"咱们上次说的有点问题。你想，一根绳子，不管捆得紧还是松，都还捆着你。在轮回里，什么是绳子？规则。有一些规则能影响你，让你持续犯错误。你摆脱了吗？肯定没摆脱；摆脱了，怎么还能被规则影响而犯错？比如情绪法则，你摆脱了吗？","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p75","index":75,"text":"真正的解脱，就是某些对你产生伤害的规则，无法再伤害你。这是解脱。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p76","index":76,"text":"成佛需要什么？叫自觉、觉他、觉满。什么叫明心见性？你得清清楚楚知道轮回里的规则，哪些对自己有伤害，哪些没伤害。没伤害并且有益的，持续加强；有伤害的，坚决不能继续。这是真正的觉醒圆满，称为觉满。一般说自觉、觉他、觉满，然后可以成佛。","level":0,"key":false,"section":"ep3-p68"},{"id":"ep3-p77","index":77,"text":"但咱们现在要求更严格一些，你必须解脱满了，觉满不行。觉满只是确定有些东西能伤害你，但有没有真正解脱？规则能不能永不复现？不能做到。所以我们认为，成佛的标准，至少得是解脱圆满。","
