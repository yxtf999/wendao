，那不是脑子进水了吗？尤其创业或者做人生重大决定的时候，基本都按这套东西走。但是成功的寥寥无几。这时就出现一个很奇怪的事情：明明已经做了自己认为最正确的选择，为什么还会失败？ 最大的问题就是，你认为的正确不一定是正确的。 不要小看这个。人生不如意十之八九，为什么十之八九？对于人生来说，大的选择几十次，小的选择几百上千次，每次都选成功的可能性还是比较低。所以，只要是生物，我们就要研究，你的行为为什么失败？我们要反推一下。"},{"id":"ep4-k03","course":"ep4","number":3,"topic":"认知与思维","title":"五重链条：缘→真相→认知→思维模型→行为","summary":"本课将行为向前追溯为五个环节，说明接触的信息如何逐层影响选择。","points":["缘分影响能接触什么真相；真相影响如何认识事情。","认知影响解释、判断与处理问题的方式，进而影响行为。","真相、认知、思维模型，是讲者在本课反复强调的三个检查点。"],"start":53,"end":61,"quote":"行为由思维模型主导，思维模型由认知主导，认知由真相主导，真相由缘分主导。","quoteIndex":55,"related":["ep4-k05","ep4-k08","ep4-k13","ep6-k11"],"section":"ep4-p47","sectionTitle":"二 从行为反推成败的源头","searchText":"问道四 认知模型 第4课 问道4 五重链条：缘→真相→认知→思维模型→行为 本课将行为向前追溯为五个环节，说明接触的信息如何逐层影响选择。 认知与思维 缘分影响能接触什么真相；真相影响如何认识事情。 认知影响解释、判断与处理问题的方式，进而影响行为。 真相、认知、思维模型，是讲者在本课反复强调的三个检查点。 二 从行为反推成败的源头 行为 思维模型 认知 真相与缘分 我先直接把答案跟大家说。我们所有的东西都依赖于行为。行为正确不正确，来自于思维模型。什么是思维模型，不知道，别着急，后面慢慢说。思维模型来自于认知，认知来自于真相。你能掌握多少有用的真相？了解的真相全不全？你所有的真相，又来自于有没有缘分得到这份真相，你的能力和缘分。 行为由思维模型主导，思维模型由认知主导，认知由真相主导，真相由缘分主导。 请大家记住这条亘古不变，以及在任何情况下都是真理的、一层层递进的规则。这很重要。我们在轮回中是这样，轮回之外是不是这样，我不知道，但我相信大概也是这样，这是一个至高法则。 决定你做事是否成功的源头，只有三个：真相、认知、思维模型。这三个东西解决不了，你做出怎样的行动，大概率成功率都会很低，做出很多选择成功率都会很低。哪怕你成佛了，你是菩萨、天帝，都要遵守真相、认知、思维模型这三个东西。 这三个东西至关重要。作为生物，所有选择、决定、判断、反应，对世界的认识，都来自于这三个。你修行的几乎所有东西，也来自于这三个，这是核心的核心。 经常说认知，我举几个例子。对同样一件事情，不同的认知、不同的看法，决定了成功和失败。曾经马云还说刘强东必死，结果刘强东现在活得还挺好。 刘强东和马云都没重视的拼多多，结果现在干成了第一名。这就是认知，对同样一个世界的看法，决定了命运的不同。 仙家会不会出现这种事情？也是一样。找一些神或者仙去看一件事情，同样一件事，会有不同看法，尤其越大的事情。普通老百姓的小事，基本不会有什么太大问题。"},{"id":"ep4-k04","course":"ep4","number":4,"topic":"认知与思维","title":"同一件事，为什么会有不同判断？","summary":"讲者通过两个案例说明，不同信息范围、观察层次和过程理解，可能带来不同结论。","points":["不只比较结论，也要了解结论分别依据什么。","对过程、时间和具体条件的认识不同，行动也可能不同。"],"start":62,"end":73,"quote":"同样对一个孩子判断，判断出两种不同的东西，取决于你对这件事的认知、看法，对真相了解多少，了解在第几个层级。判断不一样，认知不一样，思维模型不一样，最后行动就不一样。","quoteIndex":72,"related":["ep4-k13","ep4-k20"],"section":"ep4-p47","sectionTitle":"二 从行为反推成败的源头","searchText":"问道四 认知模型 第4课 问道4 同一件事，为什么会有不同判断？ 讲者通过两个案例说明，不同信息范围、观察层次和过程理解，可能带来不同结论。 认知与思维 不只比较结论，也要了解结论分别依据什么。 对过程、时间和具体条件的认识不同，行动也可能不同。 二 从行为反推成败的源头 同一件事为什么会有不同判断 假设事情涉及的因果太大、牵扯的本源太多，就会很不一样。我举两个例子，是去年还是前年碰到的。 第一个，一个上市公司，干了好多年，身价也有几百亿，老板亲自来问：“我现在的气运怎么样？走上升气运还是下降气运？”不同教主怎么回答？其中一个说：“你已经走下坡路了，不要投资。”另外一个说：“你还在走上升运，继续投资。”为什么会这样？同一个人，就上升、下降两种结果，你两边堵，这是蒙呢，还是玩呢？ 其实不是这样。他们看到的东西不一样，每个仙家看到的最后结果没有问题，但是看到的过程和点不一样。 这个世界有很多不同观点，观点不同，结论、认知就不一样。这位女老板实际上还有三年上升气运。其中一个教主去看，说还有上升气运，有没有问题？没有，因为她还有三年。虽然上升不会太高，至少还有三年运。 另外一个教主也看到了，但她问的是能不能继续投资。她的投资可能是10块、20块的事吗？那是几个亿或者几十个亿。那个教主对这个事情把控比较好，直接说不要再投了，走下坡运。 为什么这么说？第一，这三年的运已经不是这么往上走，有点走平，但的确还在上升。第二，以她的体量投资，三年想把钱撤回来，撤不回来。另外一个仙家对这个体量比较清楚。同样一件事，同样法术很厉害，但是大家的看法不一样。 第二个例子，有一个孩子，从照片看各方面都没问题，长得挺漂亮、挺精神，结果有些习惯很奇怪。 其中一个教主看完，说：“你得好好教育这孩子，你教他呀。”说了一些人间的东西。他觉得孩子各方面没问题，怎么会出现父母描述的情况？觉得很奇怪，是不是父母有问题？ 另外一个教主直接能看到本源，就说这孩子的魂不全，是一片碎魂组成的人。本来是上古神兽转世，只不过是打碎了的上古神兽。上古神兽体量有多大？打碎成几千片，一片魂的大小还能组成一个人类，你想得有多厉害。就直接指出这跟父母没关系，父母再怎么教也没用。 同样对一个孩子判断，判断出两种不同的东西，取决于你对这件事的认知、看法，对真相了解多少，了解在第几个层级。判断不一样，认知不一样，思维模型不一样，最后行动就不一样。 其实就这么简单。不是大家不努力，跟你的权限、对世界的了解是否真实和全面有很大关系。好，咱们一层层反推，一层层解释。"},{"id":"ep4-k05","course":"ep4","number":5,"topic":"认知与思维","title":"什么是思维模型？","summary":"本课用白话定义：事情发生后，脑中习惯用什么方式解释、判断和处理，就是思维模型。","points":["它既包含下意识反应，也包含思考之后的处理方式。","重点是遇到事情时，自己习惯怎样回应。"],"start":75,"end":79,"quote":"一件事发生之后，你脑子里习惯用什么方式去解释、判断和处理，这就是思维模型。","quoteIndex":78,"related":["ep4-k06","ep4-k08"],"section":"ep4-p74","sectionTitle":"三 行动来自于思维模型","searchText":"问道四 认知模型 第4课 问道4 什么是思维模型？ 本课用白话定义：事情发生后，脑中习惯用什么方式解释、判断和处理，就是思维模型。 认知与思维 它既包含下意识反应，也包含思考之后的处理方式。 重点是遇到事情时，自己习惯怎样回应。 三 行动来自于思维模型 什么是思维模型 第一个，行动来自于思维模型。什么是思维模型？有官方版本，也有大白话，还有例子，我给大家讲讲。 官方说法：思维模型是对现实世界运行规则的抽象与简化，是一套可以重复调用的心智框架与思维范式。第二个官方说法：思维模型是大脑理解世界和做出选择的运算规则。是不是比较官方？听不懂就上大白话。 一件事发生之后，你脑子里习惯用什么方式去解释、判断和处理，这就是思维模型。 说白了，这事发生了，我要怎么做？这就是你的思维模型。还是大白话适合你们，人类世界需要大白话。光说这个没感觉，得举例子。举一个踩脚的例子，一个帅哥踩到女生的脚，咱们用东北人的模式和台湾叫“绿茶”的方式，来回答这个事情。"},{"id":"ep4-k06","course":"ep4","number":6,"topic":"认知与思维","title":"被踩脚的案例：反应怎样改变后续？","summary":"本课用被踩脚后的两种回应，比较不同处理方式怎样引出不同互动。","points":["同一事件，可以进入互相对抗，也可以进入解释与道歉。","通过后续互动观察自己的回应方式，是本节的讨论重点。"],"start":80,"end":84,"quote":"这就是思维模型。当我们碰到一件事情，对它下意识的反应，以及深思熟虑之后的反应，就称为思维模型。类似的事情很多，比如老婆发现老公出轨了。","quoteIndex":84,"related":["ep4-k07","ep2-k15"],"section":"ep4-p74","sectionTitle":"三 行动来自于思维模型","searchText":"问道四 认知模型 第4课 问道4 被踩脚的案例：反应怎样改变后续？ 本课用被踩脚后的两种回应，比较不同处理方式怎样引出不同互动。 认知与思维 同一事件，可以进入互相对抗，也可以进入解释与道歉。 通过后续互动观察自己的回应方式，是本节的讨论重点。 三 行动来自于思维模型 被踩脚时的两种反应 首先，东北的暴脾气上来了。男的踩了女的脚，女的说：“眼瞎呀？操，你他妈的看什么呢？”男的本来不对，但是面子挂不住，都是东北人嘛：“怎么没踩死你啊？”你看，东北模式。 台湾的“绿茶夹子”怎么说？男的踩了女的脚：“哎呀，哥哥你很不对呀，怎么踩我的脚了？我的脚踩得很痛。”男的听完：“老妹，你说这事闹的，哥没看着，真不好意思，还把你脚踩了。疼不疼？要不要到医院看看？”夹子说：“不疼不疼，没事。”帅哥还说：“那不行，加个微信吧，万一后期疼了，别忘了找哥，哥一定负责到底。” 同样被踩脚，东北模式和台湾的夹子模式不一样，人生就不一样。 这就是思维模型。当我们碰到一件事情，对它下意识的反应，以及深思熟虑之后的反应，就称为思维模型。类似的事情很多，比如老婆发现老公出轨了。"},{"id":"ep4-k07","course":"ep4","number":7,"topic":"家庭与沟通","title":"关系和教育中的习惯反应","summary":"本节把思维模型放到婚姻、子女教育和受伤后的处理方式中讨论。","points":["本讲提出先分析，再化解，作利弊取舍，最后决定。","留意自己是否只有一种惯常回应，以及它带来了什么结果。"],"start":85,"end":91,"quote":"逆修觉者怎么弄？先分析，再化解，再进行利弊取舍，最后做决定和选择。之前有一个女生，堪称经典式的反击，非常厉害。但正常人怎么着？一哭二闹三上吊，离婚，公布朋友圈，再把父母架上。这是正常人的反应，也是一种思维模型。碰到这种事，认知里只知道用这种方式解决。","quoteIndex":86,"related":["ep4-k21","ep5-k17"],"section":"ep4-p74","sectionTitle":"三 行动来自于思维模型","searchText":"问道四 认知模型 第4课 问道4 关系和教育中的习惯反应 本节把思维模型放到婚姻、子女教育和受伤后的处理方式中讨论。 家庭与沟通 本讲提出先分析，再化解，作利弊取舍，最后决定。 留意自己是否只有一种惯常回应，以及它带来了什么结果。 三 行动来自于思维模型 婚姻 教育与受伤后的反应 逆修觉者怎么弄？先分析，再化解，再进行利弊取舍，最后做决定和选择。之前有一个女生，堪称经典式的反击，非常厉害。但正常人怎么着？一哭二闹三上吊，离婚，公布朋友圈，再把父母架上。这是正常人的反应，也是一种思维模型。碰到这种事，认知里只知道用这种方式解决。 还有，孩子3分钟的作业做了30分钟。你进去一看，8加9等于几？不知道。这时候老娘就虎了：“8加9等于几？别光看着我，脸上没有答案！跟你爸一个德行。”这是很多正常女性的思维模型。 当然，也有夫妻之间，比如老公给老婆交作业，应该一次怎么也要30分钟，结果3分钟就完事了。 老婆也怒了：“你这啥‘青色’啊？喜新厌旧了是吧？看不上老娘了是吧？”老公说：“不是不是，熟能生巧，经常做，所以做得快了点。” 还有婆媳关系的处理方式。自己被欺负了，一定想“一帮坏蛋欺负我”。逆修觉者的想法是什么？一切皆是我的问题。每次失败和受伤，都要想，我应该从里面学到什么？这就是思维模型，就是碰到事情的反应。 咱们逆修觉者解决的就是真相、认知、思维模型。我不认为你现在所有的思维模型，可以真正有效、无错地帮助你在轮回里升级，以及更好地活着。所以思维模型很重要。"},{"id":"ep4-k08","course":"ep4","number":8,"topic":"认知与思维","title":"认知与思维模型，有什么区别？","summary":"认知侧重这是什么、为什么、意味着什么；思维模型侧重因此怎样解释、判断与处理。","points":["看到乌云，判断可能要下雨，是本课举出的认知例子。","随后决定带伞、暂不出门或寻找遮蔽，是相应的处理方式。"],"start":93,"end":97,"quote":"咱们说白话：认知就是，你认为这件事情是什么，为什么会这样，意味着什么。听官方还有听明白的，说明你很聪明。有些小伙伴脑袋大了，什么是思维模型，什么是认知？","quoteIndex":95,"related":["ep4-k05","ep4-k09"],"section":"ep4-p92","sectionTitle":"四 思维模型来自于认知","searchText":"问道四 认知模型 第4课 问道4 认知与思维模型，有什么区别？ 认知侧重这是什么、为什么、意味着什么；思维模型侧重因此怎样解释、判断与处理。 认知与思维 看到乌云，判断可能要下雨，是本课举出的认知例子。 随后决定带伞、暂不出门或寻找遮蔽，是相应的处理方式。 四 思维模型来自于认知 认知与思维模型的区别 思维模型来自于什么？来自于认知。先说官方的：从你看到一件事情，到理解它、记住它、判断它，这整个过程都属于认知。听明白了吗？大概率没听明白。 咱们说白话：认知就是，你认为这件事情是什么，为什么会这样，意味着什么。听官方还有听明白的，说明你很聪明。有些小伙伴脑袋大了，什么是思维模型，什么是认知？ 举个例子就知道了。天空很蓝，过段时间刮风，云越积越厚，变成黑色。看到这个现象，就知道有乌云，快下雨了。“有乌云，快下雨了”，这是认知。 知道要发生什么事情，要对此做什么反应？要不躲起来，要不别出门，要不带把伞，这就是思维模型。这就是认知和思维模型。"},{"id":"ep4-k09","course":"ep4","number":9,"topic":"认知与思维","title":"从哪里获得认知？","summary":"本课区分自己观察分析得来的认知，与从别人那里获得的认知。","points":["分析需要观察、洞察、判断和纠错。","从他人处得到的说法，还需要考虑真假、适用范围和使用方式。"],"start":98,"end":102,"quote":"正常生活里，很多认知会决定命运。自己又获得不了那么多认知，绝大多数都是从别人那里得来的。所以能否分析认知的真假，以及适用范围，非常重要。难度有多大？相当于开盲盒，非常困难。因为对得来的认知，没有足够的智慧和能力分辨真假，以及使用方式方法，所以才影响了自己的命运。","quoteIndex":102,"related":["ep1-k09","ep4-k11"],"section":"ep4-p92","sectionTitle":"四 思维模型来自于认知","searchText":"问道四 认知模型 第4课 问道4 从哪里获得认知？ 本课区分自己观察分析得来的认知，与从别人那里获得的认知。 认知与思维 分析需要观察、洞察、判断和纠错。 从他人处得到的说法，还需要考虑真假、适用范围和使用方式。 四 思维模型来自于认知 自己分析与从别人那里获得认知 经常说要提高认知，认知的确非常重要。人间大家比较在意认知，网上也说认知很重要，一定要改变认知。我们要清楚知道，认知怎么得来？一个是自己分析得来的，很难；第二个是从别人那里得来的，可真可假。 第一种，能自己分析出认知，我只能说你很聪明、很厉害、智商很高。要有足够的观察力、洞察力、分析能力、纠错能力，脑力足够强大才行。一会说真相的时候，会说这个分析，因为分析的肯定是真相。还要破迷，很多东西是真相和假象在一起，很难。 我们现在主要说人们经常获得认知的方式：从别人那里得来。上小学、初中、高中，得来的知识也是对世界的认知，是别人告诉你的，经过验证、可以拿来使用的东西。是否真的对？也不一定，但是对的比较多。 正常生活里，很多认知会决定命运。自己又获得不了那么多认知，绝大多数都是从别人那里得来的。所以能否分析认知的真假，以及适用范围，非常重要。难度有多大？相当于开盲盒，非常困难。因为对得来的认知，没有足够的智慧和能力分辨真假，以及使用方式方法，所以才影响了自己的命运。"},{"id":"ep4-k10","course":"ep4","number":10,"topic":"家庭与沟通","title":"婚姻案例：安排是否服务于今后的生活？","summary":"讲者用彩礼讨论认知差异，重点追问婚礼安排对新家庭长期生活的影响。","points":["本节比较态度、比较心理和家庭承受能力等不同出发点。","讲者强调关注新家庭的备用资源和应对未来变化的能力。","具体历史解释和观点保留在原文中。"],"start":103,"end":114,"quote":"更多的是，两个小家伙组成的家庭，要有足够多的备用金，要有足够的能力和应变能力，去抗击未来的可能性。我觉得这非常重要，不要乱花钱，这是正常的。但别人要彩礼你也要，这就属于认知错误。","quoteIndex":114,"related":["ep3-k23","ep1-k18","ep5-k11","ep10-k05"],"section":"ep4-p92","sectionTitle":"四 思维模型来自于认知","searchText":"问道四 认知模型 第4课 问道4 婚姻案例：安排是否服务于今后的生活？ 讲者用彩礼讨论认知差异，重点追问婚礼安排对新家庭长期生活的影响。 家庭与沟通 本节比较态度、比较心理和家庭承受能力等不同出发点。 讲者强调关注新家庭的备用资源和应对未来变化的能力。 具体历史解释和观点保留在原文中。 四 思维模型来自于认知 彩礼的认知与婚姻的本质 拿几个事情来说。第一件是彩礼。嫁女儿一般都要谈彩礼，结婚的男方也涉及被女方要彩礼。很多人要彩礼，真的清楚它的作用和意义吗？ 首先，你要明媒正娶别人家的闺女，或者你们家闺女不做妾、要做妻，应该下聘礼，而不是彩礼。彩礼是娶妾给的东西，娶妻叫聘礼。有聘礼就一定有陪嫁，所以叫门当户对：你家花多少钱，我们家能陪出多少钱。 有些很厉害的家族，女的从嫁到男方第一天开始，一直到棺材，全都陪嫁过去。什么意思？我们女方家足够强大，不占男方家的便宜。娶妾给的是彩礼，是买断性的东西，买断的是女孩未来生死跟你家没关系。所以娶妾可以不给陪嫁。 咱们说三妻四妾，头两级妾，妾和孩子可以写在族谱里，后两级妾连写族谱的权利都没有，生出男孩也不许入族谱。首先这是古代的。 现代的呢？要彩礼，第一是态度，“我要的是你一个态度”。第二，有些家庭尤其有弟弟的，因为弟弟娶妻也要给别人钱，基本嫁完姐姐，就有钱给弟弟娶老婆，所以会要得比较狠，是回本。 第三，看男方家的重视程度。第四，比较多的是别人家都给这么多。人家给10万、18万8，我们家只给8万8，好像我们家孩子不值钱。这是绝大多数家庭对彩礼的认知。 但这里有个很大的问题，很多家庭本来就没多少钱，又要房、车、家具、装修，男方家已经掏空钱包。再要彩礼、上车费、下车费，很多普通家庭承受不了。富裕家庭要一二百万彩礼不算事，普通家庭拿不出那么多。 你要的东西会对男方家庭造成极大伤害。为了结婚，到处借钱，焦头烂额。但一定记住，婚姻的本质是快乐，两个人快乐很重要。 从结婚那一刻，嫁到男方之后，男方家庭背上极重的负债，活钱全用于这些没有意义的东西。如果大量借债，四处借钱，因闹彩礼闹得很痛苦，从结婚那天开始，对女方的态度就已经不对了。那结婚为了什么？这就是没有搞清楚婚姻的本质。 可以用彩礼试试态度，但是我觉得，人家要给的时候就别要了，或者给完赶紧还回去。不要给别人造成太大压力，因为最后受伤的一定是你女儿。 更多的是，两个小家伙组成的家庭，要有足够多的备用金，要有足够的能力和应变能力，去抗击未来的可能性。我觉得这非常重要，不要乱花钱，这是正常的。但别人要彩礼你也要，这就属于认知错误。"},{"id":"ep4-k11","course":"ep4","number":11,"topic":"规则与实践","title":"一个结论，也有适用条件","summary":"本课以“学习改变命运”的说法为例，追问得到的认知是否经过检验、是否仍适合具体情境。","points":["某个阶段有效的经验，需要继续检查使用条件。","不仅记住结论，也要理解它为什么成立、什么时候适用。"],"start":115,"end":117,"quote":"身边有很多这种事情。比如好好学习，因为别人都在好好学习，曾经有一段时间好好学习可以改变命运，结果就认为好好学习可以改变人。可是，这是自己验证的吗？验证的东西在未来一定有用吗？如果在未来已经不太起作用，为什么要求孩子继续好好学习？","quoteIndex":116,"related":["ep4-k13"],"section":"ep4-p92","sectionTitle":"四 思维模型来自于认知","searchText":"问道四 认知模型 第4课 问道4 一个结论，也有适用条件 本课以“学习改变命运”的说法为例，追问得到的认知是否经过检验、是否仍适合具体情境。 规则与实践 某个阶段有效的经验，需要继续检查使用条件。 不仅记住结论，也要理解它为什么成立、什么时候适用。 四 思维模型来自于认知 学习能否改变命运也要看适用条件 身边有很多这种事情。比如好好学习，因为别人都在好好学习，曾经有一段时间好好学习可以改变命运，结果就认为好好学习可以改变人。可是，这是自己验证的吗？验证的东西在未来一定有用吗？如果在未来已经不太起作用，为什么要求孩子继续好好学习？ 这就是从别人那里得来的认知：“好好学习可以改变命运。”但结果出问题。还有在海外，经常听到各种频道说中国怎样怎样。"},{"id":"ep4-k12","course":"ep4","number":12,"topic":"智慧落地","title":"发现问题，不等于能系统地解决问题","summary":"本节区分指出一个现象中的缺点，与组织各方面条件解决整个问题。","points":["评价一个系统时，需要看整体运行与自我调整。","找到毛病之后，还要考虑可行的改进方式及相关条件。"],"start":118,"end":124,"quote":"为什么大家都说得咬牙切齿？找问题只需要发现现象，但想改变一个国家、一个政体、一个公司，需要系统性地解决所有问题。","quoteIndex":120,"related":["ep3-k08","ep1-k08"],"section":"ep4-p92","sectionTitle":"四 思维模型来自于认知","searchText":"问道四 认知模型 第4课 问道4 发现问题，不等于能系统地解决问题 本节区分指出一个现象中的缺点，与组织各方面条件解决整个问题。 智慧落地 评价一个系统时，需要看整体运行与自我调整。 找到毛病之后，还要考虑可行的改进方式及相关条件。 四 思维模型来自于认知 找问题与系统性解决问题 说领导人怎样怎样，你就记住了。他们说得对不对？确实有这些事发生，但代表中国就一定有问题，中国官场、组织、政体结构就一定有问题吗？不一定。任何国家都有问题。让他带14亿人口，还能带成这样，绝大多数人有车有房，保住14亿人的温饱，很多家庭有空调，已经很不容易了。 为什么大家都说得咬牙切齿？找问题只需要发现现象，但想改变一个国家、一个政体、一个公司，需要系统性地解决所有问题。 比如中国政体，能拼到那个位置的人，有几个福报低的，不在上面有上一号的？哪个不是尸山血海都过过的？政治斗争极其严重，还要抽时间，第一保证自己活着，第二想怎么为国家做贡献，很难。推动点东西非常费劲。 骂很多东西的人，让他自己上去干，一定干得不怎么样，还不如那帮家伙，这个我敢确定。谁都会找问题。比如国足，一看就说“你往那传”。挑人家踢球毛病，很多人都能挑，而且很正确。但想组建一个非常好的足球队，这是系统性问题。解决系统性问题，比找毛病难，根本不是一个数量级。 这也是认知问题。不要光人家说什么就听什么，的确有这个问题。 任何政体、国家，在发展和文明递进过程中都会出现很多问题。最后要看整体发展情况怎么样，自我迭代能力怎么样，这些很重要。这也是认知。"},{"id":"ep4-k13","course":"ep4","number":13,"topic":"认知与思维","title":"检查真相：全不全、真不真、在第几层？","summary":"本课提出三个问题，检查自己所据以判断的信息。","points":["完整性：还有哪些重要信息没有看到？","真实性：看到的是否经过扭曲或存在假象？","层次：目前看到的是哪一层，是否还有没有理解的部分？"],"start":126,"end":129,"quote":"真相涉及三个主要问题：第一，你得到的真相全不全？第二，真不真？第三，在第几层？这就是思维茧房。我可以用规则压住你，这三层决定了很多问题。","quoteIndex":129,"related":["ep2-k12","ep4-k14","ep8-k24"],"section":"ep4-p125","sectionTitle":"五 认知来自于真相","searchText":"问道四 认知模型 第4课 问道4 检查真相：全不全、真不真、在第几层？ 本课提出三个问题，检查自己所据以判断的信息。 认知与思维 完整性：还有哪些重要信息没有看到？ 真实性：看到的是否经过扭曲或存在假象？ 层次：目前看到的是哪一层，是否还有没有理解的部分？ 五 认知来自于真相 真相的含义与三个问题 认知来自于真相。什么是真相？官方说法：事物的本来面目与真实完整的情况，区别于表面被扭曲或者人为造假的表象和假象。大白话就是，扒掉所有滤镜之后，事物本来的样子。还是大白话比较简单。 为什么真相这一部分篇幅多一些？天地、整个轮回把你卡住，最主要的方式就是用真相把你卡住。只要脑子CPU这部分没有太大问题，拥有全部真实和全部真相时，极容易产生正确认知。这个世界绝大多数人类脑子没什么太大问题，但上天不可能让所有人都把事情做对。做不对最主要的问题，是没得到全部真相。 真相涉及三个主要问题：第一，你得到的真相全不全？第二，真不真？第三，在第几层？这就是思维茧房。我可以用规则压住你，这三层决定了很多问题。"},{"id":"ep4-k14","course":"ep4","number":14,"topic":"认知与思维","title":"从细节与异常反推","summary":"本节讨论通过观察、分析、推演与纠错，寻找表象背后的解释。","points":["对细微差异和反常之处保持注意。","将观察到的现象与已有理解对照，继续追问无法解释的地方。","原文用讲者自身的经历说明这一过程。"],"start":130,"end":138,"quote":"要学会观察，从现象分析，从细微之处分析，能够推论，通过反常推论，通过规则推论。发现真相很难。我举自己身上两个例子。","quoteIndex":133,"related":["ep4-k15","ep1-k09","ep5-k02"],"section":"ep4-p125","sectionTitle":"五 认知来自于真相","searchText":"问道四 认知模型 第4课 问道4 从细节与异常反推 本节讨论通过观察、分析、推演与纠错，寻找表象背后的解释。 认知与思维 对细微差异和反常之处保持注意。 将观察到的现象与已有理解对照，继续追问无法解释的地方。 原文用讲者自身的经历说明这一过程。 五 认知来自于真相 靠能力观察与反推真相 怎么得到比较全、比较真的真相？两个方式，第一靠能力，第二靠缘分。能力只限于同层真相。假设涉及不同界面、位面、级别，临近的，比如一层分析二层，有点可能。但用一层现象分析十层真相，可能性几乎为零，这没招。 能力也不是所有人都有，得会分析、推演、深挖。之前说过，天道把人类物质的科技树打开了，所以很多科学家可以通过很多东西反推出真相，很厉害。 要学会观察，从现象分析，从细微之处分析，能够推论，通过反常推论，通过规则推论。发现真相很难。我举自己身上两个例子。 比如紫微斗数，我怎么做的？第一，我相信规则，相信紫微斗数是真的。第二，我相信一切易学，要推断世间万事万物，一定要产生一一映射的关系。 既然相信紫微斗数能跟万事万物一一映射，我就研究出一套紫占的方式，以秒、以分进行映射。比如在山西看到一个红发美女，没看到正脸，因为她直接进电梯了。此时心在动，怎么办？起一卦，卦象叫“七煞火星”。什么意思？没明白。 为什么我的紫微能反推出这么多跟传统不一样的星和技法？就是因为我相信一一对应。 美女在那儿，卦象在这儿，我相信它们一定产生一一对应的关系。但用传统紫微的星意，怎么解释此时看到的人和卦象？对不上。多收集这些东西，就能反推出来。 比如喝可乐，假设还有一半，50%，正好发现太阴在“续宫”化忌。明白了，当“续宫”化忌的时候，原来是减少一半。很多东西都是这么反推出来的。要观察得足够细，从生活中反推。发现任何异常，一定琢磨，反向推理，才有可能发现真相。"},{"id":"ep4-k15","course":"ep4","number":15,"topic":"认知与思维","title":"从观察到规则，需要试错和整理","summary":"讲者用自身经历说明：零散信息可能真假混杂，从中整理出理解需要反复观察与试错。","points":["注意变化发生前后，有哪些细节不同。","一次印象之后，仍需要继续观察、对照与修正。"],"start":139,"end":147,"quote":"我这种就属于从很多乱序东西里总结规则、总结真相，非常痛苦。尤其刚开始，没人告诉哪个对哪个错，完全凭毅力，一点点从乱象里总结。很多信息有真有假，没办法验证，只能一点点试错，通过大量试错，最后总结一套东西。","quoteIndex":146,"related":["ep3-k14"],"section":"ep4-p125","sectionTitle":"五 认知来自于真相","searchText":"问道四 认知模型 第4课 问道4 从观察到规则，需要试错和整理 讲者用自身经历说明：零散信息可能真假混杂，从中整理出理解需要反复观察与试错。 认知与思维 注意变化发生前后，有哪些细节不同。 一次印象之后，仍需要继续观察、对照与修正。 五 认知来自于真相 从细节发现帮助与建立信任 包括我弄天地大道的东西，我看到的世界跟你们差不多，只不过还看到过更高级的世界。比如大菩萨平时说话那样，跟书本不一样，我就知道书本他妈的有杜撰。 还有“无为而无不为”，或者“信”，如何建立一个信？有的大菩萨级投胎之后，帮助别人，我有时问：“为什么不让别人知道？”他说不喜欢让别人知道。我说：“你自己花钱、受累，晚上帮人挡因果，半天起不来床，人家连屁都不知道，何苦呢？” 但我发现，这些人变好了之后，脑子比较聪明，自己反推出来：“怎么去他那里待一段时间就变好了，去别的地方就不管用？再试试。”最后，虽然很多高端客户从没听他亲口说在帮他们，但都能从细节反推出来。 后来我帮他总结：“智慧等级低于60分的，还是告诉他吧，因为他不会从细节分析，洞察力极差。任何反差、细微之处、推论，都不会在他生命中留下痕迹。” 智慧等级60分以上的，比较自我，跟他说在帮他，反而会不舒服。让他自己发现你在帮他，会更感恩。这是我又发现的事情，告诉他，他说我说得挺好。 能力是什么？能不能从所有错误信息里发现真相，并总结成系统？极难。普通人不用想，几乎不可能。连生活中哪些东西有问题都发现不了，能发现什么真相？凑合活着就完了。 我这种就属于从很多乱序东西里总结规则、总结真相，非常痛苦。尤其刚开始，没人告诉哪个对哪个错，完全凭毅力，一点点从乱象里总结。很多信息有真有假，没办法验证，只能一点点试错，通过大量试错，最后总结一套东西。 我告诉你们的，无论紫微还是这些东西，全部是自己一点点试错出来的。所以你们不要去想这个，没用。"},{"id":"ep4-k16","course":"ep4","number":16,"topic":"认知与思维","title":"本讲如何区分天赋与优势？","summary":"本节在讲者的本源观中讨论天赋，同时单独提出可以通过积累形成的优势。","points":["讲者将本源天赋与后天优势分开表述。","阅读时可对照本节定义，避免把两个词当作同一个意思。"],"start":149,"end":157,"quote":"普通人类可以积累的叫优势，有的人优势多，有的人少。","quoteIndex":155,"related":["ep4-k17","ep8-k09"],"section":"ep4-p148","sectionTitle":"六 获得真相的缘分","searchText":"问道四 认知模型 第4课 问道4 本讲如何区分天赋与优势？ 本节在讲者的本源观中讨论天赋，同时单独提出可以通过积累形成的优势。 认知与思维 讲者将本源天赋与后天优势分开表述。 阅读时可对照本节定义，避免把两个词当作同一个意思。 六 获得真相的缘分 本源 天赋与后天优势 第二种获得真相的方式是缘分。缘分又分本源和平时积累。本源就是出生有就有，没有就没有。前段时间，我记得左护法还问：“师父，天赋这个东西可以修吗？”我说看什么级别。那种可以改变世界的天赋，不可能修，从轮回里出生那一刻，有就有，没有就没有。 类似爱因斯坦、高斯、马斯克、稻盛和夫、段永平，这些都算天赋。 还有霍金。这种东西让人觉得绝望。清华姚班的一些人也叫天赋，但700分考进清华，只能算聪明，不能算天赋。 法界这边的天赋，比如我，叫传法天赋，一个是忽悠能力，一个是从乱序中总结规则的能力。不用学习，大概听一下、看一下就知道，你不用去想，几千年很难出这种人。 包括负责看卦的天巫本源、顶级天巫血脉的人，就是天赋，从来不需要学习。需要沟通天地时，想一下、感受一下就知道。但凡还需要学习，都不叫天赋。 普通人类可以积累的叫优势，有的人优势多，有的人少。 优势可以积累，但顶级天赋不可能。也可以认为小天赋能训练出来，累劫轮回，多轮回几世，怎么也能比较厉害。但像写《洛神赋》的，曹植吧，应该叫曹植，这就是天赋，没办法。这叫本源。 本源的缘分，比如我跟观世音菩萨、佛界的缘分，出生时就定了。你们还费劲修，我就大摇大摆带着族人跑到佛界。只不过现在变成小号，等级不行，再去佛界比较难，但现在也拿到门票了。你们要进佛界费大劲，这就叫本源。"},{"id":"ep4-k17","course":"ep4","number":17,"topic":"缘分与成长","title":"平时积累，如何影响接触的信息？","summary":"本课把机缘、人脉和接触经历，与能获得什么信息联系起来。","points":["不同经历可能使人接触到不同范围的知识与经验。","本节再次串起缘分、真相、认知、思维模型与行为的关系。"],"start":158,"end":165,"quote":"整个流程是，想有什么正确行为，取决于思维模型；思维模型取决于认知；认知取决于看到过、知道什么真相；能不能看到，取决于有没有这种缘分。所以缘决定一切。什么缘分最重要？师缘。","quoteIndex":165,"related":["ep4-k18","ep4-k27"],"section":"ep4-p148","sectionTitle":"六 获得真相的缘分","searchText":"问道四 认知模型 第4课 问道4 平时积累，如何影响接触的信息？ 本课把机缘、人脉和接触经历，与能获得什么信息联系起来。 缘分与成长 不同经历可能使人接触到不同范围的知识与经验。 本节再次串起缘分、真相、认知、思维模型与行为的关系。 六 获得真相的缘分 平时积累与获得信息的机缘 第二个叫平时积累。能不能看到真相，最重要的是平时积累，在累劫轮回里靠平时积累。因为能看到什么真相，取决于有什么缘分。 包括海外一些中文大V，论政治、经济的，他们一生里有你们通过学习努力也得不到的机缘和人脉，所以能进那个圈子，有幸知道这些东西，加上脑子在线，才能成就这些事。比如鲁博士分析政治很厉害，大老王说经济、国内一些事情，非常有参考价值。 像老张说有趣的事情，非常有天赋，都来自于人家有这个机缘。最后会发现，能得到什么，取决于缘分。 比如我，一个泥腿子、夜大学毕业、连正经高中都没上过的职高生，能坐在这里跟你们侃侃而谈，为什么？因为跟你们有不同机缘。 我看到的真相，不是你们通过努力能得到的。我能得到一些上位面的东西，比如大菩萨，菩萨比较多，神也多，偶尔有天帝，佛祖很少，但我觉得够了。是这些佛祖菩萨让我直接看到了真相。我跟他们有缘分，所以能轻易得到很多人终其一生得不到的真相，法界真相对我来说很简单。 我也认为自己有很好的师缘，上面有老师，有问题叫他跟我说一下就完了。有时他带我去看，一看佛界不是大家说的那样，这就是缘分不同。 整个流程是，想有什么正确行为，取决于思维模型；思维模型取决于认知；认知取决于看到过、知道什么真相；能不能看到，取决于有没有这种缘分。所以缘决定一切。什么缘分最重要？师缘。"},{"id":"ep4-k18","course":"ep4","number":18,"topic":"缘分与成长","title":"师缘与生活中的关系积累","summary":"本节在讲者的轮回观中讨论师缘、爱情缘以及其他生活关系。","points":["讲者强调日常如何对待关系，是其所说的积累过程。","本节把获得信息与关系经历联系起来，并过渡到课程的具体应用。"],"start":166,"end":172,"quote":"如果要积累缘分，第一个是师缘。师缘怎么积累？累劫轮回经常尊师重道，师缘就比较好；每次相信真理，这个缘分就很好。","quoteIndex":168,"related":["ep4-k28","ep3-k24"],"section":"ep4-p148","sectionTitle":"六 获得真相的缘分","searchText":"问道四 认知模型 第4课 问道4 师缘与生活中的关系积累 本节在讲者的轮回观中讨论师缘、爱情缘以及其他生活关系。 缘分与成长 讲者强调日常如何对待关系，是其所说的积累过程。 本节把获得信息与关系经历联系起来，并过渡到课程的具体应用。 六 获得真相的缘分 师缘与生活中的各种缘分 累劫轮回里，没办法得到重要信息，尤其跨位面信息，得不到，怎么做出正确判断？刚才说的还都是人间界的，在人间界就很难解决真相全不全。一涉及跨位面，人间再聪明也没用。几千年来这么多聪明的人类，有没有解决认识方向、认知方向的问题？没解决，一直重复错误，就在泥潭里。 如果要积累缘分，第一个是师缘。师缘怎么积累？累劫轮回经常尊师重道，师缘就比较好；每次相信真理，这个缘分就很好。 第二是爱情缘。老关心老公有没有找小三、劈腿、小金库，有没有伤害你，有意义吗？所有的防都没意义，还不如真心爱一个人。累劫轮回，真心爱自己的老公，真心把自己的东西做好，不用管他成功不成功，生命里一定会积累出非常好的爱情缘。 有足够多的爱情缘，就能碰到对你特别好的人，还需要管这些吗？这些都没意义。包括好身体、好贵人的缘分。我最近也找到一些解决身体问题的缘分，问题就解决了。子女缘、众生缘、员工缘都一样，有时会发现，一切皆在缘分。 这条路都讲完了。既然要打破之前讲知识的方式，就要树立新榜样。拆解、讲完后，一定告诉你，学完这些东西，要在脑子里建立怎样的认知？对你的意义是什么？如何帮助你在轮回里更好生活、提升？这些一定讲。 不能像那帮古人的大尾巴狼一样，动不动一句高深的话，结果所有人不明白怎么做。你是秀技术，还是真打算度化众生？咱们一定把这些讲透。"},{"id":"ep4-k19","course":"ep4","number":19,"topic":"认知与思维","title":"遇到意外，先检查还有什么不知道","summary":"本课把意料之外的结果，作为重新审视真相、认知和思维模型的入口。","points":["回看信息是否全面、真实，以及自己如何理解它。","找出此前没有想到的部分，再调整下一次判断。"],"start":174,"end":178,"quote":"只要发生了意料之外的事情，第一时间清醒地意识到，我一定有不知道的东西。","quoteIndex":177,"related":["ep4-k13","ep4-k20","ep8-k21"],"section":"ep4-p173","sectionTitle":"七 学完之后要建立怎样的认知","searchText":"问道四 认知模型 第4课 问道4 遇到意外，先检查还有什么不知道 本课把意料之外的结果，作为重新审视真相、认知和思维模型的入口。 认知与思维 回看信息是否全面、真实，以及自己如何理解它。 找出此前没有想到的部分，再调整下一次判断。 七 学完之后要建立怎样的认知 遇到意外先反思真相与认知 第一件事情，一定清楚所有源头都在真相、认知、思维模型。把这三个弄好，才能清清楚楚、明明白白活着，让自己顺利过关。 第二，一切问题、失败、错误，都来自于对事情的认知有问题。认知有问题，一定涉及了解不全面，或者了解不真实。所以要反思自己、反思真相、反思认知。如果都没有问题，才能做到没有意外。 只要发生了意料之外的事情，第一时间清醒地意识到，我一定有不知道的东西。 发生意外，一定有不知道、不了解的东西。不要怪任何人，是自己的认知和对真相的了解不全面。"},{"id":"ep4-k20","course":"ep4","number":20,"topic":"认知与思维","title":"认识判断的边界，不预设能掌控一切","summary":"本节明确提出，不应假设自己能够全面掌控所有事情。","points":["能力和知识仍有边界，合作可以补足部分不足。","即使经过多方面考虑，讲者也承认仍可能有意外。"],"start":179,"end":187,"quote":"规则之下，不可能没有意外。以这种组合补缺的方式弥补，出错概率已经不多，但仍然有。","quoteIndex":183,"related":["ep4-k04","ep8-k23"],"section":"ep4-p173","sectionTitle":"七 学完之后要建立怎样的认知","searchText":"问道四 认知模型 第4课 问道4 认识判断的边界，不预设能掌控一切 本节明确提出，不应假设自己能够全面掌控所有事情。 认知与思维 能力和知识仍有边界，合作可以补足部分不足。 即使经过多方面考虑，讲者也承认仍可能有意外。 七 学完之后要建立怎样的认知 不要相信自己可以掌控一切 下一条，不要相信自己可以掌控一切。首先从轮回规则来说，不可能全面掌控一切，神佛、大菩萨都一样。上面的观世音菩萨每次跟我说东西，一定正确吗？不一定。 但对我来说，能找到的最高智慧等级，能帮我看未来、做指导的，就是观世音菩萨，会亲自指导我。如果连他指导都出问题，那就是命。在指导未来、选择未来方向这件事上，我不如他。连我认为超越我的人都做出错误决定，我自己上去也不可能成功。 这是一个team，大家各司其职。涉及人间的东西，上面的大菩萨还是交给我。他觉得我在人间的把控力还可以，不能说最好，但能信任的人不多。在能信任的人里，把控力比较好的可能只有我。如果我做不好，他也不可能找到更多人替代我，所以也要认。 规则之下，不可能没有意外。以这种组合补缺的方式弥补，出错概率已经不多，但仍然有。 对于普通人，能掌握的都是阳间的东西。再厉害，像马斯克，也只能掌握阳间，不可能掌握阴的那面。我没说阴间，我说阴的那面，法界所有东西不可能掌握。 光把火箭弄上去，在阳间需要掌握多少知识？你觉得在阴间掌握的知识、需要考虑的东西会少于阳间吗？如果相信阴阳平衡，不可能。 缺少一半认知、一半真相的情况下，凭什么确定自己能掌控世界？很多人都在做傻子一样的决定。知道有阴阳，却不知道阴的那面有什么，凭什么确定掌控命运、掌控世界？ 第三，尽可能提升自己的圈子，不同圈子提供不同知识。我们这个圈子也有很多别人没有的认知和知识，要努力、大量积累。如果只是年轻人，请不要太相信自己的能力。"},{"id":"ep4-k21","course":"ep4","number":21,"topic":"家庭与沟通","title":"认知冲突：先理解对方看到了什么","summary":"本课将部分沟通矛盾追溯到双方所见和所理解的不同。","points":["与其不断灌输结论，可以先了解彼此的信息和经历。","让双方有机会接触和理解相关事实，是本节提出的沟通方向。"],"start":189,"end":192,"quote":"下一条是认知冲突，涉及人与人之间的沟通和看法。很多矛盾来自于认知冲突，就是对同一件事有不同看法。下次不要强行说服对方，因为说服对方是在进行认知冲突。","quoteIndex":190,"related":["ep4-k22","ep4-k24","ep4-k25"],"section":"ep4-p188","sectionTitle":"八 认知冲突与家庭沟通","searchText":"问道四 认知模型 第4课 问道4 认知冲突：先理解对方看到了什么 本课将部分沟通矛盾追溯到双方所见和所理解的不同。 家庭与沟通 与其不断灌输结论，可以先了解彼此的信息和经历。 让双方有机会接触和理解相关事实，是本节提出的沟通方向。 八 认知冲突与家庭沟通 让对方看到你所看到的真相 下一条是认知冲突，涉及人与人之间的沟通和看法。很多矛盾来自于认知冲突，就是对同一件事有不同看法。下次不要强行说服对方，因为说服对方是在进行认知冲突。 人类有一种机能叫认知保护。你说的东西跟我认为的不一样，我就进入认知保护阶段。所以不要直接灌输，有时没用，越聪明、越有主见，越不可能灌输。更多的是让他看到你能看到的真相，感受到这些真相。相信只要是正常人，他会改变。 知道认知来自真相，就多带自己的孩子、让配偶多看看世界，多了解人间，多看咱们成功案例，多了解规则，对他们有帮助。"},{"id":"ep4-k22","course":"ep4","number":22,"topic":"家庭与沟通","title":"父母与子女：经历不同，看法也不同","summary":"本节通过女儿恋爱的例子，讨论父母与子女为何会对同一个人作出不同判断。","points":["父母的生活经验，不等于孩子已经亲自见过和理解。","讲者用案例学习说明如何补充对方尚未接触的经验。"],"start":193,"end":196,"quote":"举几个例子。青少年时期搞对象，尤其女孩，直接给你找个“黄毛”，你肯定不同意。但以女儿对世界的了解，她不认为这个人坏，对自己很好。而以你三四十年、四五十年对世界的了解，女儿在干什么，你很清楚。","quoteIndex":194,"related":["ep4-k25"],"section":"ep4-p188","sectionTitle":"八 认知冲突与家庭沟通","searchText":"问道四 认知模型 第4课 问道4 父母与子女：经历不同，看法也不同 本节通过女儿恋爱的例子，讨论父母与子女为何会对同一个人作出不同判断。 家庭与沟通 父母的生活经验，不等于孩子已经亲自见过和理解。 讲者用案例学习说明如何补充对方尚未接触的经验。 八 认知冲突与家庭沟通 女儿恋爱与父母的不同看法 举几个例子。青少年时期搞对象，尤其女孩，直接给你找个“黄毛”，你肯定不同意。但以女儿对世界的了解，她不认为这个人坏，对自己很好。而以你三四十年、四五十年对世界的了解，女儿在干什么，你很清楚。 这时你不同意，说这人的坏话，但这些在女儿那里没办法证实，她会听吗？不会。想防止女儿找“黄毛”，最重要是多看咱们案例，多看世界，看看那些被骗女生最后怎么样。 我记得有个学生，之前还差点被“黄毛”卖了。但可能也是真爱吧，最后没卖成，这是咱们一个学生的真事。"},{"id":"ep4-k23","course":"ep4","number":23,"topic":"家庭与沟通","title":"理解管理的难处，需要具体经历","summary":"本节以配偶参与管理为例，讨论亲历问题如何改变对决策的理解。","points":["具体经历能帮助认识自己的强项与不足。","只有知道会遇到什么，才更容易理解某些决策为什么作出。"],"start":197,"end":199,"quote":"更没被各种人际关系和人类奇怪行为骚扰过，需要先经历。这样她会对自己的管理能力有清晰认识，知道哪些方面强、哪些弱，更多是知道管理不容易、很艰难。这也是让她看到很多真相。如果没看到，不会认为这些东西困难。","quoteIndex":199,"related":["ep4-k04","ep3-k21"],"section":"ep4-p188","sectionTitle":"八 认知冲突与家庭沟通","searchText":"问道四 认知模型 第4课 问道4 理解管理的难处，需要具体经历 本节以配偶参与管理为例，讨论亲历问题如何改变对决策的理解。 家庭与沟通 具体经历能帮助认识自己的强项与不足。 只有知道会遇到什么，才更容易理解某些决策为什么作出。 八 认知冲突与家庭沟通 让配偶经历管理中的困难 配偶也一样，夫妻有很多矛盾，是你看到的世界跟老婆不一样。像我老婆，最近涉及一些管理上的东西，为什么我基本不出手帮她管理？她未来要知道我很多事情，也会涉及很多决策。如果从没经历管理，就会决策失误，因为不知道会发生什么，不知道为什么做这些决定。她没经历伤痛、错误、痛苦。 更没被各种人际关系和人类奇怪行为骚扰过，需要先经历。这样她会对自己的管理能力有清晰认识，知道哪些方面强、哪些弱，更多是知道管理不容易、很艰难。这也是让她看到很多真相。如果没看到，不会认为这些东西困难。"},{"id":"ep4-k24","course":"ep4","number":24,"topic":"家庭与沟通","title":"老人带孩子：共同学习，减少认知差距","summary":"本节讨论育儿意见冲突时，长辈经验与年轻人的信息来源如何不同。","points":["与其反复指责，可以让双方接触相同的学习材料。","在共同理解中讨论具体做法及隐患。"],"start":200,"end":203,"quote":"大家共同学习，这时老人知道原来是这样，原来之前一些方式不是说不对，而是可能有隐患。这是解决很多人间矛盾的主要东西。我们更习惯指责。","quoteIndex":203,"related":["ep4-k21","ep3-k23"],"section":"ep4-p188","sectionTitle":"八 认知冲突与家庭沟通","searchText":"问道四 认知模型 第4课 问道4 老人带孩子：共同学习，减少认知差距 本节讨论育儿意见冲突时，长辈经验与年轻人的信息来源如何不同。 家庭与沟通 与其反复指责，可以让双方接触相同的学习材料。 在共同理解中讨论具体做法及隐患。 八 认知冲突与家庭沟通 老人带孩子与共同学习 年轻人生完孩子让老人带，老人会用曾经带孩子的方式，年轻人就说“这样不对”。老人郁闷：“你都是我这么养大的，反而变成我不对了？”就产生很多矛盾。 更多的是让老人看一些纪录片，跟你看的东西一样。 大家共同学习，这时老人知道原来是这样，原来之前一些方式不是说不对，而是可能有隐患。这是解决很多人间矛盾的主要东西。我们更习惯指责。"},{"id":"ep4-k25","course":"ep4","number":25,"topic":"家庭与沟通","title":"孩子听不懂道理，可能缺少相关经验","summary":"本节追问：成年人说的道理，是否建立在孩子尚未经历和理解的事情上。","points":["说得有道理，不代表对方已经具备理解它的基础。","沟通前先考虑对方看过什么、关心什么、能理解到哪里。"],"start":204,"end":206,"quote":"孩子更关心玩不玩、快乐不快乐、心烦不心烦，又没经历过那些。了解这套体系后，再跟别人交流，先想想有没有必要说这些？他有没有正确理解这些认知的能力，有没有看到相应的真相？如果他看到的世界跟你不一样，肯定不行。","quoteIndex":206,"related":["ep4-k08","ep4-k21","ep5-k17","ep8-k12"],"section":"ep4-p188","sectionTitle":"八 认知冲突与家庭沟通","searchText":"问道四 认知模型 第4课 问道4 孩子听不懂道理，可能缺少相关经验 本节追问：成年人说的道理，是否建立在孩子尚未经历和理解的事情上。 家庭与沟通 说得有道理，不代表对方已经具备理解它的基础。 沟通前先考虑对方看过什么、关心什么、能理解到哪里。 八 认知冲突与家庭沟通 孩子能否理解你说的道理 尤其一帮大傻子，孩子不学习，就跟孩子讲“以后会怎样怎样”，有用吗？用你的认知，让孩子明白20年后才会经历的事情，有意义吗？说的的确对，但叫正确的废话。 孩子更关心玩不玩、快乐不快乐、心烦不心烦，又没经历过那些。了解这套体系后，再跟别人交流，先想想有没有必要说这些？他有没有正确理解这些认知的能力，有没有看到相应的真相？如果他看到的世界跟你不一样，肯定不行。"},{"id":"ep4-k26","course":"ep4","number":26,"topic":"缘分与成长","title":"思维茧房的四个来源","summary":"本课把认知来源依次放在家庭、学校、社会与师父四个阶段中讨论。","points":["家庭、老师、同学及社会经历，都可能塑造已有认知。","第四阶段在讲者的体系中，指向获得其所说的人间之上的认知。"],"start":208,"end":211,"quote":"第二个来自学校，同学、老师，以及在学校学习的东西。第三个来自社会。第四个是能不能碰到师父，得到人间之上的认知。有些人类认知，再努力也不可能得到正确答案，因为答案不在人间。","quoteIndex":211,"related":["ep4-k09","ep4-k27","ep6-k12"],"section":"ep4-p207","sectionTitle":"九 思维茧房与缘分的积累","searchText":"问道四 认知模型 第4课 问道4 思维茧房的四个来源 本课把认知来源依次放在家庭、学校、社会与师父四个阶段中讨论。 缘分与成长 家庭、老师、同学及社会经历，都可能塑造已有认知。 第四阶段在讲者的体系中，指向获得其所说的人间之上的认知。 九 思维茧房与缘分的积累 家庭 学校 社会与师父 人类要分四个阶段，称为思维茧房的四个阶段。 第一个是家庭。我们不知道世界怎么样，很多事情是父母跟孩子说的，尤其女生，小女孩更不清楚、没怎么接触世界。很多认知来自父母和家庭环境。比如老公应该怎么样，该不该要彩礼，女孩没什么自己的看法，不知道，只不过你说应该这样，要看男方态度，所以她才这样，来自家庭。 第二个来自学校，同学、老师，以及在学校学习的东西。第三个来自社会。第四个是能不能碰到师父，得到人间之上的认知。有些人类认知，再努力也不可能得到正确答案，因为答案不在人间。"},{"id":"ep4-k27","course":"ep4","number":27,"topic":"缘分与成长","title":"积累有益的关系与不同经历","summary":"本节讨论接触范围如何影响得到的信息，强调平时积累。","points":["工作、管理、带人和研发等经历，也可能提供新的观察机会。","讲者把拓展圈层与积累有益缘分联系起来。"],"start":212,"end":215,"quote":"下一条，一切皆缘分。现在可能没有好缘分，但请相信生命是无量劫的，不要在意这一世的生死，更多是生生世世积累有益缘分，积累能看到、获得更多真相的缘。比如工作，管理、带人、研发，这些工作上的缘分，能看到真相，就很厉害。","quoteIndex":213,"related":["ep4-k17","ep4-k28"],"section":"ep4-p207","sectionTitle":"九 思维茧房与缘分的积累","searchText":"问道四 认知模型 第4课 问道4 积累有益的关系与不同经历 本节讨论接触范围如何影响得到的信息，强调平时积累。 缘分与成长 工作、管理、带人和研发等经历，也可能提供新的观察机会。 讲者把拓展圈层与积累有益缘分联系起来。 九 思维茧房与缘分的积累 积累有益的缘分与提升圈层 下一条，一切皆缘分。现在可能没有好缘分，但请相信生命是无量劫的，不要在意这一世的生死，更多是生生世世积累有益缘分，积累能看到、获得更多真相的缘。比如工作，管理、带人、研发，这些工作上的缘分，能看到真相，就很厉害。 希望大家学会跳圈、抱大腿。为什么一定往上跳，改变阶层？因为不同圈层掌握的信息远高于你。 “十年苦读怎能比得上三代经商？”现在我真理解这句话。如果家里三代都干这件事，积累的庞大人脉和经验，不是AI、不是靠学习能得到的。上面大哥告诉一些东西，比苦读十年强得多。所以记住，拼了命也要往上抱圈、抱大腿，很重要。"},{"id":"ep4-k28","course":"ep4","number":28,"topic":"缘分与成长","title":"多看、多学、多接触，也要会分析","summary":"第四课以继续学习和寻找指导收束，强调扩大见闻之后仍需理解与分析。","points":["主动接触不同的信息、经验与处理方式。","自己看不明白时，寻找能讲清楚的人帮助理解。","把这些内容用于日常判断，是本课最后的要求。"],"start":216,"end":222,"quote":"最后还是说，多看、多学、多了解，非常重要。希望今天这些东西，成为大家判断事情的天道思维中很重要的一点。平时多看、多接触，学会分析，找到好老师。自己看不明白时，有个好老师愿意把真的东西告诉你，很重要，基本就靠这个。","quoteIndex":219,"related":["ep4-k03"],"section":"ep4-p207","sectionTitle":"九 思维茧房与缘分的积累","searchText":"问道四 认知模型 第4课 问道4 多看、多学、多接触，也要会分析 第四课以继续学习和寻找指导收束，强调扩大见闻之后仍需理解与分析。 缘分与成长 主动接触不同的信息、经验与处理方式。 自己看不明白时，寻找能讲清楚的人帮助理解。 把这些内容用于日常判断，是本课最后的要求。 九 思维茧房与缘分的积累 天道打工人与下课寄语 下一条，有缘成为天道打工人。想了解更多天道知识、系统外知识、思维茧房外的东西，凭什么得到？不能成为天道打工人，天道有必要让你知道更多吗？这一定注意。 不知道的那一半，法界的东西得不到。法界东西至少占一半知识量。多少人，包括很多大老板，拼死拼活一辈子，燃烧福报，最后也没落个好，何苦呢？ 最后还是说，多看、多学、多了解，非常重要。希望今天这些东西，成为大家判断事情的天道思维中很重要的一点。平时多看、多接触，学会分析，找到好老师。自己看不明白时，有个好老师愿意把真的东西告诉你，很重要，基本就靠这个。 水平很高，才有可能跳出父母的圈子、摆脱学校的圈子。能接触到真正引领世界的顶级人才、资源获得者，掌权的、有钱的、有思想的、有名气的人，才能真正知道世界怎样运行。这还只是社会认知。 只有真正找到通两界、跨越两界的人，才有幸得到阳之外的那部分东西。最好别走错，不然一次次失败、重来，太可惜。 好，今天说到这里，耽误大家很多时间，再见。下次开始说阴阳法则，又要说很多，很重要，这些都是重要的思维模型。咱们下期再见，拜拜。"},{"id":"ep5-k01","course":"ep5","number":1,"topic":"课程导读","title":"第五课开场：活动通知与当时的环境判断","summary":"开场保留2026年9月13日当次试讲的活动安排、经历转述和环境判断。","points":["日期、活动与“最近”等说法，应按源稿时间理解。","本课末尾附有校对记录，说明转写疑点与未核实之处。"],"start":37,"end":48,"quote":"再说专场，明天黄财神专场，赶上就赶上，赶不上拉倒，实在没办法提醒，提醒也来不及。","quoteIndex":47,"related":["ep1-k03","ep6-k01"],"section":"ep5-p37","sectionTitle":"一 开场活动与近况","searchText":"问道五 意义思维 第5课 问道5 第五课开场：活动通知与当时的环境判断 开场保留2026年9月13日当次试讲的活动安排、经历转述和环境判断。 课程导读 日期、活动与“最近”等说法，应按源稿时间理解。 本课末尾附有校对记录，说明转写疑点与未核实之处。 一 开场活动与近况 一 开场活动与近况 九月份请符与环境提醒 好，正式8点了，咱们不耽误大家时间，正式开始。开始先不讲故事，先说一下9月份促销。每年好多人年底年初请符，其实不对，换法器、请符应该在9月份。像我这样的什么时候请都无所谓，但绝大多数人，尤其打工的、年底要账的，还是需要年底年初仙家比较给力。 为什么是9月份？首先，得让新的一批仙家对你有足够了解。什么都不了解，事情也不知道，直接上去弄，肯定不好使。有三个月时间，了解差不多了，帮你调运气、调事情，要给一定缓冲时间。打工、接工程、年底年初要答谢领导的，你的套符这个时候效果最好。年底总结拿一个好总结，年初资源拿到好资源，这时候请符非常好。 第二，咱们说大环境。最近好像新上了一个关于出入境的法规，之前可能忘了说。现在一些客户已经开始出问题。前几天一个客户的女儿从美国回来，再去美国时被边控了。现在能边控你的部门越来越多，以前要有明显犯罪证明，现在只要怀疑就可以，甚至县级公安部门都能边控。请大家注意。 小女孩后来托人找关系，问到底哪边控的，是公安还是怎么着？无犯罪证明还能打出来，没有犯罪记录，也没警察找她。后来发现是国安边控，也没有理由，你不知道谁边控的。怀疑因为在美国上学时，可能跟一些比较敏感的学生聊过天，就被边控。再想回美国上学，回不去了。英国的也出现这种情况，整个学业就完了。 还有敏感公司，比如跟美国或者全球有关的高科技公司，回中国后，很可能以国家安全和信息泄露为由边控，不算犯罪，但不允许出国。在海外一些博主底下留过言的，也一定注意，尤其翻墙的人，翻墙软件所有信息都在监控范围内，找麻烦很容易。一旦出不了国，海外的事情都没有了。 在加密货币公司做职员的也悠着点。在海外待得挺好，回国探一次亲，能不能再出来不好说，尤其大公司、加密货币敏感公司的职员，肯定国安那里都有一份。普通老百姓没什么事，别去敏感地区。像我们从泰国出来非常及时，现在泰国弄得鸡飞狗跳，很麻烦。这是大环境。 北京等很多大城市，吃饭、买东西、买奢侈品的人少了，上班的人也少了。很多人说找不到工作，说白了，他想要那个钱，没人要他；很多公司也找不到人，开的钱别人看不上，互相看不上。不是没有工作，是大家看不上对方。 经济大萧条。最近北京有朋友卖房，腰斩又腰斩，原来至少能卖300多万，现在100万出头就得卖，很郁闷，也没办法，这就是命。未来还得跌，不卖还得跌。未来至少还有15到20年经济大萧条，现在说白了还没开始。以后少挣中国的钱，挣点国外的钱。 再说专场，明天黄财神专场，赶上就赶上，赶不上拉倒，实在没办法提醒，提醒也来不及。 八月十五，9月25号，月光菩萨和月老专场。八月十五晚上，别忘了念108遍月光菩萨陀罗尼咒，还是非常好的。北京房价跌成什么样了，腰斩又腰斩，这很正常。9月28号九天玄女成道日，喜欢风水的多参加。10月2号，国庆第二天，燃灯古佛专场。"},{"id":"ep5-k02","course":"ep5","number":2,"topic":"追问根源","title":"电脑与网络：性能为何没有发挥出来？","summary":"讲者以电脑设置和有线网络的经历，引出“能力存在，但发挥受条件限制”的观察。","points":["先区分设备本身、配置、连接方式等不同环节。","从多件事情中寻找共同特征，是本节进入意义思维的切口。"],"start":49,"end":61,"quote":"最后发现，用双显示器玩赛车没问题，但一个横着、一个竖着，可能会出问题。我把另一个显示器一关，BIOS更新、内存调过、软件环境优化，再关一个显示器，现在所有游戏都能玩了。","quoteIndex":54,"related":["ep4-k14","ep5-k03"],"section":"ep5-p49","sectionTitle":"二 从近期现象反推本质","searchText":"问道五 意义思维 第5课 问道5 电脑与网络：性能为何没有发挥出来？ 讲者以电脑设置和有线网络的经历，引出“能力存在，但发挥受条件限制”的观察。 追问根源 先区分设备本身、配置、连接方式等不同环节。 从多件事情中寻找共同特征，是本节进入意义思维的切口。 二 从近期现象反推本质 二 从近期现象反推本质 显卡性能与电脑设置 最近这一个月，或者半个月发生一些事情，我先说现象。首先是家里的显卡。原来买了4090，部分游戏能玩，但《黑神话悟空》进去没多久就退出，战地系列的大型游戏也玩不了。像“荒野大镖客2077”什么的没问题，一直搞不清怎么回事。 后来用豆包AI帮我找机器问题，找出一部分。主板BIOS版本太低，是2023年的版本，现在2026年，差了20个版本，升级后好很多。第二，内存赫兹数，原来是5600，调5600容易崩，改5200好很多，但偶尔崩一次，现在调5000，没问题了。 第三是优化，我觉得可能不是优化的事。最开始以为缺程序、支持文件，电脑配置还不错，当时在泰国就为打游戏买的，“全打总套单”。还特地买了闪来闪去、连电线都发光的。头一个月天天盯着机箱看，现在能不看就不看，过了那个阵。人也是需要过了那阵。 最后发现，用双显示器玩赛车没问题，但一个横着、一个竖着，可能会出问题。我把另一个显示器一关，BIOS更新、内存调过、软件环境优化，再关一个显示器，现在所有游戏都能玩了。 无线网络与有线网络 第二件事，家里上网。马来西亚这里目前最大带宽2G，装完只能跑1400。我以为路由器有问题，把工程人员叫来，现场用他们自带Wi-Fi的光猫，也只跑1400。我想可能有损耗，大马科技不如祖国厉害，说2000跑不出2000，很正常，就没多想。 长达一年，最高1400，平时1000左右，波动，最差三五百。一直认为当地网络环境有问题。5090不敢换，看了一下太贵了，四五万一块，疯了，打个游戏而已。一会讲意义思维，这就没意义。 最近新开疗愈室要布网络，买几个hub，叫集线器。多弄一个给家里用上，连上10GB的网线，固定台式机全部跑出2G带宽，非常稳定，2060，“22060”，再没出问题。 后来发现，这里的绝大多数Wi-Fi，只要不是特别高级、几千块钱的，基本只能跑1400。我自己也有问题，Wi-Fi是方便联网，没说最大化发挥网络环境。台式机尽可能用有线。 之前线太硬，后来发现扁的超软线，不硬，随便弯，还能跑10Gb带宽。现在家里全换网线，笔记本也拿“网线转10GB的插头”，至少家里所有笔记本、台式机都是标准2G带宽。 有没有想明白老天要告诉你什么？如果连这两件事都没想明白，只能说对生活敏感性太差。7月份为什么没怎么干活？第一，录播的东西要一遍遍过，太费劲，这是工作问题，不多说。"},{"id":"ep5-k03","course":"ep5","number":3,"topic":"追问根源","title":"从现象反推本质：讲者如何理解自己的经历","summary":"讲者把电脑、网络与自身的洗灵经历联系起来，以个人宗教解释说明对生活现象的反思。","points":["本节保留讲者对魂、气运与身体经历的解释。","其提问方式是：这些现象有什么共同点，自己原先遗漏了什么？"],"start":62,"end":81,"quote":"从第三次洗灵时，显卡和网络出现转机。今天说一个很重要的东西，叫天道意义。未来聊天道思维，因果思维、天道布局，必须有意识：这段时间集中爆发事情，想告诉你什么？必须有从现象反推本质的能力。","quoteIndex":74,"related":["ep5-k02","ep5-k16"],"section":"ep5-p49","sectionTitle":"二 从近期现象反推本质","searchText":"问道五 意义思维 第5课 问道5 从现象反推本质：讲者如何理解自己的经历 讲者把电脑、网络与自身的洗灵经历联系起来，以个人宗教解释说明对生活现象的反思。 追问根源 本节保留讲者对魂、气运与身体经历的解释。 其提问方式是：这些现象有什么共同点，自己原先遗漏了什么？ 二 从近期现象反推本质 洗灵过程与身体经历 第二，一到7月份身体弱、脑子不好使、睡不醒，阴气重，我也是这么认为。但7月底应该好了，结果还出问题，因为又要升级了。 还记得去年跟大家说过，给一些学生做疗愈，那场用了20%的能量，给他们改变了，差点整个师门都快崩。 一定记住，不能消耗气运，越干大事越要洁身自好，很多东西靠气运。稍差一点，节拍赶不上，整个企业就崩，差一次就没了。那次只少20%，仙家很生气，但还没至于崩。 这一年总算恢复回来。出问题前，洗灵师傅帮我洗灵，正好看到我在海里被一堆鲸鱼围殴。后来帮学生做了一下，福报少20%，影响很大。再想补、再做，洗灵师傅就看不到影像，同频共振不上去。大概第49世或者50世，去年发生的。 今年最近终于连上，洗灵师傅有感应，说差不多，又要开始洗灵。我说行，谢谢。第一次，看到海里一个宫殿中的身体，怎么碰都不动。洗灵师傅同一时间传功，我想至少可以帮15万人同时传功，没问题，但想动我这个身体，动不了，没反应。 第二次还是没反应。第三次努力之后总算改变，变成我被关在水牢里，下半身腿泡得发胀、黑黑的。见过我的都知道，我经常得用包腿布裹着。看到了吧？ 一直以为年轻时不注意，再加糖尿病，小腿神经末梢有点萎缩，很怕凉。这么热的天也得裹着，否则小腿老觉得凉。现在才知道跟这个有关。当然血管萎缩也有，年轻时糟蹋也有，但跟这个关系很大。 为什么展示这些？没什么秘密可言，因为什么问题出现什么事，这是一种规则，得告诉你们清楚。又没露银行密码，怕什么？也不涉及再娶房小的，要给大家好形象、好面貌，有什么事就说一下。 发现这个了，但洗灵师傅弄不出来。到今年第四场，刚开始还是弄不动，以他的能量级别弄不动。 后来地藏王菩萨出现在幻境里，把那个东西拿掉一些，上面一堆佛祖菩萨打金光。这时我从水牢出来，沿很长的通道走，总算走出来。可能第49世还是50世，我忘了，把那一世被关着的魂弄出来。 但每次洗灵都得昏睡很久，尤其第四次，虽然解放出来，非常累，下午直接睡6小时，睡不醒。魂归位了，但受伤太严重，会拉低现在的魂能，恢复两三天才行。不是不想给大家录东西，实在有问题。 从第三次洗灵时，显卡和网络出现转机。今天说一个很重要的东西，叫天道意义。未来聊天道思维，因果思维、天道布局，必须有意识：这段时间集中爆发事情，想告诉你什么？必须有从现象反推本质的能力。 无论显卡还是网络，共同特性是什么？本身没有任何问题。 但是有一段时间，无法发挥全部威力，发挥不了全部功效，而且极度波动，比如网络。一定从现象发现本质，连这都发现不了，活得太白了。 魂回来后，精神状态完全不一样。《问道》三录播版，磨叽两星期写不出来，一弄就出来。今天的意义思维也是，磨叽两星期不知道怎么说。 魂回来后，半天就OK。原来素质没问题，但想发挥，发挥不出来。之前发挥不了的，现在可以满信号发挥，CPU干到100%。以前讲东西时好时不好，就是CPU有些没更新，发挥不全。像网络，最厉害四分之三，正常一半，现象不好时四分之一，500兆带宽。 通过这个事情，知道现在魂基本补全了，因为之前出现过魂裂、魂碎。 第二，也知道以洗灵师傅水平，再补之后轮回的东西挺费劲。50世都这样，51世不好说。我估计用这一生再帮我干10世、20世，就了不得。但小号人间100世、天界100世，连人间100世还没干完，为什么往上修难？越回归，动用能量等级越高。 不知道几亿年后，能清大号第一世。打位面战争杀人太多，不知道什么级别能帮清理冤亲债主，不好说。所以要通过现象分析本质。最近一些同学经常找我，身上总发生意外。"},{"id":"ep5-k04","course":"ep5","number":4,"topic":"风险与兜底","title":"突发事件之前，有没有应急准备？","summary":"讲者用自己的住院经历，回顾家人不了解资金情况时遇到的困难。","points":["准备不能只依赖事情发生时临时交代。","本节由个人经历引出对家庭应急安排的反思。"],"start":82,"end":90,"quote":"因为走上升运，倒霉是在调整。今年身体出了多少事？首先脑子开一瓢，当时头疼，直接拉医院，照CT后就要开颅。遗书没来得及写，银行密码、钱在哪都没来得及跟媳妇说，就推进去了。万一弄一下失忆，全废了。","quoteIndex":85,"related":["ep5-k09"],"section":"ep5-p49","sectionTitle":"二 从近期现象反推本质","searchText":"问道五 意义思维 第5课 问道5 突发事件之前，有没有应急准备？ 讲者用自己的住院经历，回顾家人不了解资金情况时遇到的困难。 风险与兜底 准备不能只依赖事情发生时临时交代。 本节由个人经历引出对家庭应急安排的反思。 二 从近期现象反推本质 气运变化与应急准备 女生40岁以后、男生45岁以后，基本要走衰运。如果一件事怎么弄都出现变数，包括我帮看也有变数，我建议先等等。不管着不着急，没有解决气运，这是走败运、弱运，往下滑，要通过现象分析本质。 像我，2025年换十年大运，将走这一生最好的运。换运会不会倒霉？会，但所有倒霉都是让你有更好的重生。 因为走上升运，倒霉是在调整。今年身体出了多少事？首先脑子开一瓢，当时头疼，直接拉医院，照CT后就要开颅。遗书没来得及写，银行密码、钱在哪都没来得及跟媳妇说，就推进去了。万一弄一下失忆，全废了。 大家提前写好遗书，不知道哪天出事。至少哪个银行有钱、密码在哪、哪个卡多少钱，跟媳妇说清楚，别真有事还得借钱。我看病时，媳妇掏不出钱，不知道放哪，还得跟学生借。手术花10万马币吧，相当于18万块钱。 来不及，推进去忘说了。藏私房钱不行就让媳妇知道，至少还能救命。第一件事发生，不懂无所谓；第二件是血糖不正常，后来直接上了这个，现在血糖非常合格。 这时应该有意识，好像今年这些事都是解决生命中的问题。胳膊疼，做完手术现在没事。高血压一直解决不了，后来找大夫换药，也没事。到现在所有指标、病，不管通过什么，都变好了。 处理胳膊时，已意识到好像今年要把身体问题爆发出来，再想办法压制、解决。所以高血压有问题时，直接意识到是好事，但什么契机、找哪个医生，不知道。 后来换药稍出意外，但最后结果非常好。今天教大家最重要一点，要学会分析天意，从现象分析本质，别天天瞎过。一件事可以叫意外，类似的发生两次，就不能叫意外，一定分析老天通过这件事想告诉什么。"},{"id":"ep5-k05","course":"ep5","number":5,"topic":"意义思维","title":"意义思维的定义：以目的和真实结果为尺度","summary":"本课将意义思维定义为对目的、价值、代价、后果、路径、本质和当下行动的持续审视。","points":["追问为什么做、能得到什么、付出什么、是否值得。","目标是让这种审视成为面对事情时会自动启动的习惯。"],"start":91,"end":99,"quote":"意义思维是以最终目的和真实结果为尺度，对一件事情的目的、价值、代价、后果、路径、本质和当下的行动进行持续审视的一种思维模型。","quoteIndex":94,"related":["ep1-k18","ep5-k22"],"section":"ep5-p91","sectionTitle":"三 意义思维的定义与习惯","searchText":"问道五 意义思维 第5课 问道5 意义思维的定义：以目的和真实结果为尺度 本课将意义思维定义为对目的、价值、代价、后果、路径、本质和当下行动的持续审视。 意义思维 追问为什么做、能得到什么、付出什么、是否值得。 目标是让这种审视成为面对事情时会自动启动的习惯。 三 意义思维的定义与习惯 三 意义思维的定义与习惯 正式进入意义思维。没什么太难的，最重要是分析这件事有没有意义、值不值得做、能让你得到什么。最难是融入生活，否则学了白扯。 我敢确定，今天学的意义思维，如果真融入生活，命运一定改变30%以上。不要小看，没难度，只是没融入生活、没产生思维习惯。真产生习惯，人生会很有意义。 意义思维是以最终目的和真实结果为尺度，对一件事情的目的、价值、代价、后果、路径、本质和当下的行动进行持续审视的一种思维模型。 说白了，我为什么做这事？能得到什么？最后得不到怎么办？付出什么代价？值不值得？继续走会怎么样？现在做的还在服务最初初心吗？经常问，就不容易走偏。 人生很大问题，是意义思维没有成为观察事物、解决问题的必选项。不是意义不存在，是大脑不主动往意义方面想。像之前说的思维枷锁，不是事情没发生，是大脑不往正确地方思考。 我产生思维习惯后，身边发生事情，大概率琢磨天道想干什么。现在一个学生找房，过程中发生事情，我就知道他肯定要换运。一定从表象发现天道要教你干什么。 经常出现奇怪状态：做一件事很多年，从不问为什么；学东西很多年，不知道干什么；争论几个小时，没解决问题；为了小目标，把大目标干掉；因为别人都做，自己跟着；被表象牵着走，看不到原因和因果；浪费大量时间，不算成本；发生问题先发泄，不处理最需要解决的东西。 意义思维要达到的状态，不是知道它叫什么，而是成为生命的一部分，成为大脑面对事情时自动启动的检查程序。咱们说七种模式。"},{"id":"ep5-k06","course":"ep5","number":6,"topic":"意义思维","title":"模式一：意义判断——学会把书读薄","summary":"本节要求从解释、故事和比喻中提炼核心，再说明知识有什么用途。","points":["理解核心教什么，能解决哪类生活问题。","知道一件工具很好，还需要知道它的用途、条件和操作方式。"],"start":100,"end":109,"quote":"古代经典像螺丝刀法则，给一把螺丝刀，说材质好、厉害，忘说到底干什么。至少得说拧螺丝，螺丝长什么样、什么时候拧、怎么使用。说一堆却忘了用途。","quoteIndex":108,"related":["ep2-k23","ep5-k07"],"section":"ep5-p100","sectionTitle":"四 意义判断","searchText":"问道五 意义思维 第5课 问道5 模式一：意义判断——学会把书读薄 本节要求从解释、故事和比喻中提炼核心，再说明知识有什么用途。 意义思维 理解核心教什么，能解决哪类生活问题。 知道一件工具很好，还需要知道它的用途、条件和操作方式。 四 意义判断 四 意义判断 把经典读薄并找到用途 从七种模式分析合不合适。第一，意义判断。我为什么做？成了值得吗？最后得到什么？就是目的、结果、价格、价值、代价，是否值得。 第一种错误，知道是好东西，却不知道有什么用。人类2500年，智慧是什么？《心经》《金刚经》《道德经》到底讲什么？学佛教、道教，能在生活中改变什么？改变了吗？没有改变，是教得不好，还是学得有问题？ 《道德经》有一句重要的话，叫“为学日益，为道日损，损之又损，以至于无”。咱这“以至于无”倒不至于。学习不断增加知识没问题，但学得差不多，是不是要剥离细枝末节、重复、案例、形式、文字，琢磨最后核心是什么？读经典不能越读越厚。 得越读越薄。经典几千字、几万字，大量解释、故事、比喻、举例、重复说明、不同角度展开。最后必须回答核心教什么，对改变一生有什么帮助？没帮助，学它干什么？很多人读一辈子《心经》，不知道讲什么，最后变成明心净性、让人静心的东西，这跟扯淡。 《金刚经》总结起来四到五句话，讲几个事。不断注解、解释、引申，为了理解每句话，但到底干什么，对生活有什么帮助，问过自己吗？学那么多空色，《大般若经》花600卷讲，对我有什么意义？除了知道世界是假的，混沌法则、污染法则，还有什么意义？没什么，明白几个事就行。 污染法则怎么对抗，人家也说了，只不过大概率不明白。不能用一句话或现实行为解释，不能融入生活，对你无用。 古代经典像螺丝刀法则，给一把螺丝刀，说材质好、厉害，忘说到底干什么。至少得说拧螺丝，螺丝长什么样、什么时候拧、怎么使用。说一堆却忘了用途。 一帮捧佛祖、道祖臭脚的人，以为研究几个字就厉害。得为道日损，学会把书读薄，你读薄了吗？也没看怎么样。"},{"id":"ep5-k07","course":"ep5","number":7,"topic":"意义思维","title":"研究与争论，值得投入多少生命？","summary":"讲者从能否验证、能否应用、是否关联目标等角度，讨论研究和争论的价值。","points":["先问争论内容能否证明，证实后能改变什么。","再问是否关联生活与目标，这场争论会产生什么价值。","把是否值得追究，与是否能争赢分开。"],"start":110,"end":118,"quote":"第一，争吵内容能证明吗？谁都证明不了，吵什么？足球赛踢之前争谁赢，踢完就知道，扯这个干什么？第二，证实后能改变什么？第三，跟生活、自己目标有没有关系？第四，这场争论产生什么价值？","quoteIndex":117,"related":["ep5-k06","ep6-k06"],"section":"ep5-p100","sectionTitle":"四 意义判断","searchText":"问道五 意义思维 第5课 问道5 研究与争论，值得投入多少生命？ 讲者从能否验证、能否应用、是否关联目标等角度，讨论研究和争论的价值。 意义思维 先问争论内容能否证明，证实后能改变什么。 再问是否关联生活与目标，这场争论会产生什么价值。 把是否值得追究，与是否能争赢分开。 四 意义判断 判断研究与争论是否有价值 第二种，把生命浪费在无法验证、无法应用、跟自己目标无关的事情上。有些人喜欢研究虚头巴脑的东西，不知道有无用、没办法验证、不知道操作、最后能改变什么，却投入几年甚至几十年。 一定明白弄这东西为了什么。判断顺序：能不能验证？怎么应用？跟当前目标有没有关系？这里面占一个就别碰，占两个以上离远点。 《道德经》的东西都明白吗？“无为而无不为”怎么做，会做吗？不会，研究干什么？两千年没研究出名头，凭什么确定自己对？没研究的人也没耽误成功。既然不耽误，为什么研究，闲的。 为什么用现在有限生命，长期投入既不能验证、不能应用、跟当前人生没关系的东西？比如研究佛教的“无无”，有什么用？无、空，不就是假的，污染法则、混沌法则明白就行，还能弄什么花，至于赔一辈子吗？研究“本来无一物，何处惹尘埃”，还当博士论文，研究完对自己有什么影响？ 对人类、自己都没影响。研究有没有外星人，关你什么事？有证据、素材、案例、经历吗？能不能解决第二天挨饿、老婆打架？解决不了，研究这个，闲的。 某个明星出没出轨，你趴窗口去了？有没有离婚，到民政局查一下不就完了？两个明星有没有恋爱、是不是真心，你自己还嫁不出去，关心跟自己有关的事。甚至吵架时，先问四句话。 第一，争吵内容能证明吗？谁都证明不了，吵什么？足球赛踢之前争谁赢，踢完就知道，扯这个干什么？第二，证实后能改变什么？第三，跟生活、自己目标有没有关系？第四，这场争论产生什么价值？ 跟别人、媳妇、儿子、闺女吵架，先看这四个问题能不能解决。不能，就别吵，及时退出才有意义。很多人不是没时间，而是大量时间花在与人生毫无意义的事情上，人生就这么浪费。真正值得争论的，不是能不能赢你，而是答案值不值得花生命价值去争论。"},{"id":"ep5-k08","course":"ep5","number":8,"topic":"意义思维","title":"模式二：多步推演——收益之后还有什么？","summary":"本课用五步结构，把眼前收益延伸到反应、连锁变化、风险与终局。","points":["第一步收益，第二步反应，第三步连锁，第四步风险，第五步终局。","加薪和夫妻冷战案例都在追问：第一步有利，最终是否仍有利？"],"start":119,"end":133,"quote":"第一步是收益，第二步是反应，第三步是连锁，第四步是风险，第五步才是终局。","quoteIndex":122,"related":["ep9-k12"],"section":"ep5-p119","sectionTitle":"五 多步推演","searchText":"问道五 意义思维 第5课 问道5 模式二：多步推演——收益之后还有什么？ 本课用五步结构，把眼前收益延伸到反应、连锁变化、风险与终局。 意义思维 第一步收益，第二步反应，第三步连锁，第四步风险，第五步终局。 加薪和夫妻冷战案例都在追问：第一步有利，最终是否仍有利？ 五 多步推演 五 多步推演 第一步有利不等于最终有利 第二个叫多步推演，多想几步，别想一步就干，干完发现错。睿智的“睿”是什么意思？多想几步才叫睿智。不要以为第一步有好处，就值得做，真正该问第二、第三、第四、第五步，然后呢？ 第一步是收益，第二步是反应，第三步是连锁，第四步是风险，第五步才是终局。 让你们想十步不可能，想到第三、第五步就行，人生一定没问题。第一步正确、对自己有利，不代表整个事情对自己有利。 比如老板加薪50%。第一步涨工资很开心，第二步发现工作时间从8小时变14小时，第三步身体越来越差。 第四，经常不回家，跟老婆、孩子关系恶化。第五，几年后身体、家庭都不行，最后发现不如不拿那50%，多出来也没干什么，何苦？打工挣100万年薪非常费劲，比考清华北大费劲得多。 靠打工，不是做生意。做生意大概率做对，挣100万比较简单；打工得拼，拼完值不值，要琢磨。 创业一年挣一二百万，还能通过税务洼地解决税务、流水问题；净利润1000万，税务问题就麻烦。工商、税务，甚至公安、竞争对手、死对头，有人开始盯你。穷小区换车，就有人说闲话、戳脊梁骨，人际关系都变化。不是只想1000万挣到了怎么样。 穷人觉得挣1000万是好事，挣过的富人知道，各方面得配得上。挣一个亿更麻烦。但在中国，一辈子挣3000万到5000万还是快乐，很多问题能解决；一年一个亿，很多问题不好解决，藏钱都难，容易惹麻烦，钱能不能拿10年、20年不好说。 上10亿，麻烦更大，扛不住是灭顶之灾。10亿、几十亿，觉得国内有问题，还能跑；一两个亿不至于上红通，10亿以上就够格。 如果政府要折腾，够格上红通，麻烦，但也不是不能解决。上100亿就不是红通问题。假设做100亿之间的生意，会互相产生伤害，能挣100亿的人，调配社会资源不是你能想象。 不只是政府，黑白两道、暗网都可能折腾。没有保镖、安保团队、出行规划，容易出大事。涉及国家层面，甚至特工、国家层面灭杀，抓不回来直接灭，不一样。 夫妻冷战也这样，开始赌气，想用这种方法让对方求我。 男女都有这种想法。但你出招，对方也出招，“我也不理”，互相防御，越来越想不通，不愿沟通，到第五步感情消散。就算第一、第二步赢了，最终不愿一起过，输最多的是什么？"},{"id":"ep5-k09","course":"ep5","number":9,"topic":"风险与兜底","title":"拉长时间：为人生的意外留下兜底","summary":"讲者把储蓄与未来数十年的家庭、身体和收入变化联系起来。","points":["考虑的不只是本月收支，还包括未来可能同时出现的压力。","核心问题是：如果预想之外的事情发生，靠什么承接？"],"start":134,"end":137,"quote":"有时不是看今天、明天、下个月，而是看5年、10年、20年、30年，提前定好。像我，不管挣没挣钱，都会拿一部分作为储蓄，因为不相信人生没有意外。","quoteIndex":135,"related":["ep5-k04","ep8-k21"],"section":"ep5-p119","sectionTitle":"五 多步推演","searchText":"问道五 意义思维 第5课 问道5 拉长时间：为人生的意外留下兜底 讲者把储蓄与未来数十年的家庭、身体和收入变化联系起来。 风险与兜底 考虑的不只是本月收支，还包括未来可能同时出现的压力。 核心问题是：如果预想之外的事情发生，靠什么承接？ 五 多步推演 长期风险与储蓄兜底 有时不是看今天、明天、下个月，而是看5年、10年、20年、30年，提前定好。像我，不管挣没挣钱，都会拿一部分作为储蓄，因为不相信人生没有意外。 就算认知比很多人高、经验多，还有法界帮助，出大问题可能性不大，也不能说一定不出意外。真出意外，兜底的东西是什么，有没有？三四十岁，尤其40、45岁，存款多少？越接近50岁，父母容易出问题，孩子也开始要劲。 夫妻关系容易出问题，挣钱能力大幅下降，社会排挤你，能不能解决？年轻时光嘚瑟、买东西，又出新iPhone，光惦记买，没人兜底，最后人生失败。气运、身体、世界格局、经济、家人变化都要算进去。别活太简单，越简单越痛苦。"},{"id":"ep5-k10","course":"ep5","number":10,"topic":"意义思维","title":"模式三：终局反推——小目标服从大目标","summary":"本课提出先写清最终想得到什么，再反推必要条件与当前行为。","points":["现在的行动，是否有助于最终目的？","局部得失是否破坏了长期原则和整体目标？"],"start":138,"end":146,"quote":"现在干的跟最终想得到的有没有关系？没有，甚至破坏，为什么做？先写好终局，再看必要条件、当前行为，是否跟终局所需一致。小目标必须服从大目标，开始人生反推。","quoteIndex":141,"related":["ep5-k11"],"section":"ep5-p138","sectionTitle":"六 终局反推","searchText":"问道五 意义思维 第5课 问道5 模式三：终局反推——小目标服从大目标 本课提出先写清最终想得到什么，再反推必要条件与当前行为。 意义思维 现在的行动，是否有助于最终目的？ 局部得失是否破坏了长期原则和整体目标？ 六 终局反推 六 终局反推 小目标必须服从大目标 第三个，反向思维，叫终局反推。经常出现的问题，是现在干的跟最终想得到的不一样、没关系。所以一定先反推，最终想得到什么？ 现在干的跟最终想得到的有没有关系？没有，甚至破坏，为什么做？先写好终局，再看必要条件、当前行为，是否跟终局所需一致。小目标必须服从大目标，开始人生反推。 比如修行者，相信因果轮回、业力，最关心的是这一世完成后能不能升级。得看升级需要什么。福报、众生善缘是两个核心。现在干的跟增加福报、功德、众生善缘有关系吗？ 为什么跟人分手，或者相处一段时间闹毛病，不想想众生善缘？下辈子见不见？因为这辈子一点事，下辈子善缘出问题，值不值？ 不管别人干什么，是因果消散前最终展现。没有一辈子缘分，大多中间会出事，跟所有众生都会，很正常。出事后开始怨，还是服从众生善缘这个大原则？刷游戏、跟老婆吵架、出去happy，跟功德有关系吗？没有，为什么干？这叫人生反推。 不能完成大目标，为什么干？当然偶尔休息可以。像我也刷剧、躺着、打游戏、逗儿子，肯定也干。但一天主力时间要工作，挣钱的工作先做，因为要养家糊口。第二，要大量时间利益众生。第三，照顾家人，跟儿子玩，处理家里的事，比如上保险。 这些很正常，也会花时间，跟这个没关系，但让你活得更好。大原则不能违背，违背了，这一生最后是个零。小问题不要影响大原则。"},{"id":"ep5-k11","course":"ep5","number":11,"topic":"家庭与沟通","title":"从长久生活反推教育与婚姻","summary":"讲者以独立生存、家庭相处和身体照顾等长期课题，反思学习与关系经营的目标。","points":["婚姻案例关注信任、尊重、沟通、安全感与共同利益。","衡量一次争执时，同时看它增加还是消耗了共同生活的条件。"],"start":147,"end":153,"quote":"婚姻目标是两个人长久、欢喜、愿意一起生活。反推需要信任、尊重、沟通、安全感、共同利益、亲密和情绪。每次吵架，有没有想现在是否伤害这些？为什么男人不愿回家，女人对男人失望？你是在增加还是减少这些感觉？不要陷入具体事情，因为它会影响人生。","quoteIndex":152,"related":["ep5-k10","ep4-k10"],"section":"ep5-p138","sectionTitle":"六 终局反推","searchText":"问道五 意义思维 第5课 问道5 从长久生活反推教育与婚姻 讲者以独立生存、家庭相处和身体照顾等长期课题，反思学习与关系经营的目标。 家庭与沟通 婚姻案例关注信任、尊重、沟通、安全感与共同利益。 衡量一次争执时，同时看它增加还是消耗了共同生活的条件。 六 终局反推 教育与婚姻的长久目标 教育最终结果是什么？别老说报效祖国、报效人类，先让自己成为不会饿死、能独立生存的人。 假设大量学习不能活得更好，意义是什么？得反推。这一生经常干、经常解决的是什么？先学会生存，是持续做的。结婚、处理婚姻关系，是几十年的事；养儿育女、教育孩子，是几十年；照顾身体也是。夫妻两性生活，绝经前是不是得发生，和不和谐，也几十年。身体健康、不生病，一辈子。跟父母关系、让父母善终，也几十年。 这些影响一生，却在人类最美好年龄，用10年、20年学终生几乎用不上的知识道理。陪伴几十年、影响生活质量甚至一生成败的东西，却没人教。 不奇怪吗？学一辈子用不到的，还用它评价成功失败、优秀不优秀，为什么用你们的标准衡量我的人生？用意义思维反推，不能别人干什么就干什么。 婚姻目标是两个人长久、欢喜、愿意一起生活。反推需要信任、尊重、沟通、安全感、共同利益、亲密和情绪。每次吵架，有没有想现在是否伤害这些？为什么男人不愿回家，女人对男人失望？你是在增加还是减少这些感觉？不要陷入具体事情，因为它会影响人生。 谁多干少干、谁父母有问题，钱、孩子、两性问题，一句话谁对谁错，天天争吵。就算争出对错，日子过不下去，意义是什么？事业赚钱也一样，先想大原则、大目标，此刻做的有没有伤害大目标。"},{"id":"ep5-k12","course":"ep5","number":12,"topic":"意义思维","title":"模式四：不盲从——学习服务于人生","summary":"本节区分人生目的与学习手段，要求对“大家都这样”的做法重新提问。","points":["别人都做，并不能直接说明自己也应该做。","课堂成绩与持续学习能力，是本节明确区分的两个概念。"],"start":154,"end":160,"quote":"学习应该服务人生，而不是人生服务于学习。","quoteIndex":159,"related":["ep5-k15"],"section":"ep5-p154","sectionTitle":"七 不盲从","searchText":"问道五 意义思维 第5课 问道5 模式四：不盲从——学习服务于人生 本节区分人生目的与学习手段，要求对“大家都这样”的做法重新提问。 意义思维 别人都做，并不能直接说明自己也应该做。 课堂成绩与持续学习能力，是本节明确区分的两个概念。 七 不盲从 七 不盲从 学习服务于人生 第四个，不盲从。别人说什么就信什么，动点脑子、智慧。以前有教无类，以后不能成为逆修觉者，我都懒得度化，跟你说话浪费时间。 别人做什么，不构成我应该做什么的理由。经常听“大家不都这样吗”，马上问：“大家都这样，我为什么要做，对我有什么好处？” 学习刚说很多，努力学习才有未来，本来是应该有更好未来，学习只是其中一种手段，而且现在用处逐渐削弱。幸福美好才是目的，不是学习。 学习应该服务人生，而不是人生服务于学习。 “学习好才能挣钱”，一听就是穷苦家庭、中下贫农、小市民思维，没理解什么是学习，也没理解挣钱。这种学习好后挣钱，大概率是服务资本、打工，不是创业。这里说的学习是课堂文化课，不是自我学习能力，别混了。"},{"id":"ep5-k13","course":"ep5","number":13,"topic":"意义思维","title":"职业比较：从竞争、替代和持续时间入手","summary":"技术岗位与包子店的比较，是讲者用来展开多维判断的案例。","points":["比较竞争压力、替代可能、可持续时间和自我把握度。","关注扩张后能否生存，以及换公司、地方或团队后的依赖程度。","源稿中的薪资与年龄判断属于当次讲述。"],"start":161,"end":173,"quote":"再往下，换公司、地方、团队，还行不行？最后，干好了能不能传承？用这些衡量年薪百万技术人员和卖包子的，谁更合适。","quoteIndex":163,"related":["ep5-k14"],"section":"ep5-p154","sectionTitle":"七 不盲从","searchText":"问道五 意义思维 第5课 问道5 职业比较：从竞争、替代和持续时间入手 技术岗位与包子店的比较，是讲者用来展开多维判断的案例。 意义思维 比较竞争压力、替代可能、可持续时间和自我把握度。 关注扩张后能否生存，以及换公司、地方或团队后的依赖程度。 源稿中的薪资与年龄判断属于当次讲述。 七 不盲从 从多个方面比较技术岗位与包子店 没理解一个生意、行为有没有价值的根本。衡量能不能挣钱，第一竞争压力大不大？第二会不会被替代？比如马被汽车、汽车被火车、火车被飞机、飞机被火箭替代，是速度上的替代关系。第三能干多久？第四自我把握度多少？第五扩张时有没有自我生存性，能自我扩张是好生意。 再往下，换公司、地方、团队，还行不行？最后，干好了能不能传承？用这些衡量年薪百万技术人员和卖包子的，谁更合适。 年薪百万相当不容易。我可以负责地说，清华北大计算机博士可以；普通985博士，理工科也很难，六七十万不错。海归top前30、热门专业，七八十万以上有可能。 普通的没戏。普通985本科、非热门专业，一个月两三万就烧高香。干掉全国多少人才能985、清北？拿这钱太辛苦。 卖包子的，就廊坊我喜欢那家，很破，还不是临街，一年二三十万没问题，小学毕业就可以。同拿二三十万，双方付出成本不对等。 二三十万，是现在985非热门专业刚毕业能拿的钱。卖包子再努力，挣三四十万，相当于985热门专业硕士。 竞争压力呢？技术岗位一年一茬招生，还有其他学校。清华至少有北大，还有麻省理工、耶鲁、帝国理工、牛津，很多人竞争。包子也有竞争，但以店为原点，3公里内才有压力。 超过3公里很少，超过5公里基本不竞争。就算别家好吃10倍，也不会早上专门跑5公里吃。只要干掉3公里内的就OK。 研发成本简单，一天做一种馅，用AI、看视频，自己做，一年内一定能做出特别厉害的包子铺，我绝对相信。实在干不动这活，就卖包子，300多天研究，也能弄出特别的馅，竞争不难。 第三，能否替代。计算机、数据库、大模型、AI，一定会被替代。包子几千年没被替代，只要有人类，还愿意吃，被替代可能极小。 工作周期呢？见过华为几个P8、P9程序员——是不是叫P8、P9，我不知道，反正年薪百万——能干到45岁以后？有生命周期，男的优势45岁前，女的基本40岁前。工作丢了再找，不可能。 卖包子45岁就没人吃，可能吗？只要能和面、开张，就没这个问题。自我把控，你干得好，但参加政治斗争，是A领导的人，B领导得势要干掉你，把控不高。卖包子，只要口味不下滑、附近人还在，很容易把控。"},{"id":"ep5-k14","course":"ep5","number":14,"topic":"意义思维","title":"继续比较：增长、积累与传承","summary":"讲者继续从口碑发展、持续增长、客户积累与传承，讨论一项事业的长期价值。","points":["已有投入能否形成可保留的积累？","离开特定支持后，能否继续提供价值？","这些维度用于理解本课的比较过程。"],"start":174,"end":185,"quote":"最后两点，一是能否持续增长。做技术没办法持续增长，但只要有人认可我能力、提供的价值，东西就一直增长，是好生意。最后是传承，干一辈子，这代完了下代不行。","quoteIndex":180,"related":["ep5-k13","ep9-k10"],"section":"ep5-p154","sectionTitle":"七 不盲从","searchText":"问道五 意义思维 第5课 问道5 继续比较：增长、积累与传承 讲者继续从口碑发展、持续增长、客户积累与传承，讨论一项事业的长期价值。 意义思维 已有投入能否形成可保留的积累？ 离开特定支持后，能否继续提供价值？ 这些维度用于理解本课的比较过程。 七 不盲从 自我扩张，技术到35、40岁，再扩张很难，成功性低。卖包子、做生意，我很在意不宣传的情况下，有多少通过口碑扩张。能自我传播，就有生命力，是好生意。一年或三年不宣传，能不能自我复制、扩张？不做广告、不跟人说，闻着味或凭名声过来。 像我现在疗愈、身心灵这部分，基本不宣传，从不在这里宣传，就看它能不能自己发展。 能发展，有生命力；不能，可能水平不行。需要广告、促销，本身就有问题。 再往下，从华为出来，45岁后还有谁接？没有很危险。换公司没人接得住，就出大事。换地方呢？我从北京到廊坊、泰国、马来西亚，不影响挣钱。换公司、地方就挣不到，像从美国到日本就不行，那悠着点，很危险。 卖包子要允许发展时间。别跑印度，人家不吃包子，你去卖就扯淡。但只要喜欢吃包子的地方，过去能再发展，生命力很强。 有的人依赖团队、某些人，麻烦。比如田朴珺，不是王石的女人，谁搭理？Angelababy离开黄晓明，自己是什么？景甜离开某些金主爸爸呢？依赖性太强，容易出问题。 最后两点，一是能否持续增长。做技术没办法持续增长，但只要有人认可我能力、提供的价值，东西就一直增长，是好生意。最后是传承，干一辈子，这代完了下代不行。 像洗灵师傅，到现在没找到同源传承者，可能就这一代，老了、干不动，洗灵在人间界又消灭了。 卖包子能传承吗？只要手艺没问题，很容易。要通过这些分析生意好坏，别谁说靠学习挣钱容易就信。 清华计算机博士，不是顶尖姚班，只是进一线大公司，马上面临这些：容易竞争，每年新生代出来；不是不能替代；有工作周期。 45岁后能否再找到相同工作，不好说。能否自我把控，好好干就越来越好，做不到；能否扩张，能扩张至于还是打工？换公司、地方、团队、老大支持，就不行。东西不停积累，客户跟着积累吗？以前我做程序员，不断学编程语言，客户还是那些，没产生积累，不是好生意。 努力一辈子，能不能传下一代？不能，不是好生意。用这些判断好坏。花大价钱培养人成为别人工具，君子不器，很蠢。大目标是持久挣钱、积累、传给下一代，你做不到，只是好用的工具，用旧就扔。"},{"id":"ep5-k15","course":"ep5","number":15,"topic":"意义思维","title":"具体选择要放回具体条件","summary":"职业、创业与彩礼的讨论，都延续了对承受能力和实际代价的追问。","points":["同一种选择，需要结合当时环境与个人条件衡量。","彩礼案例着重追问支出是否让后续生活与关系更艰难。"],"start":186,"end":189,"quote":"彩礼，有钱就要，没什么高低。比如我儿子看上姑娘，别说18万8、28万、38万，188万愿意也给，又不是给不起，家里能扛就给。只一点，别因为彩礼，让生活更艰难、感情破裂、有芥蒂，咬牙结婚，后面都是事。","quoteIndex":189,"related":["ep5-k12","ep7-k12"],"section":"ep5-p154","sectionTitle":"七 不盲从","searchText":"问道五 意义思维 第5课 问道5 具体选择要放回具体条件 职业、创业与彩礼的讨论，都延续了对承受能力和实际代价的追问。 意义思维 同一种选择，需要结合当时环境与个人条件衡量。 彩礼案例着重追问支出是否让后续生活与关系更艰难。 七 不盲从 职业 创业与彩礼的具体条件 从这点说，985工科博士不如包好点的包子店有价值。公务员也得考虑，现在抓多少，不行贿、不玩潜规则能上去？不上去，为伺候领导？还往里钻。有些省、市效益不好，发不出工资；赶上活动、运动，还得自己垫钱帮助民众，脑子有问题。 中医也这样，“中医你得才行，你不，干不干也就那么回事”。创业，以前年轻经济好，女孩找男的说创业，好；现在男的说创业，赶紧跑，离远点，成功率极低，不一样了。 彩礼，有钱就要，没什么高低。比如我儿子看上姑娘，别说18万8、28万、38万，188万愿意也给，又不是给不起，家里能扛就给。只一点，别因为彩礼，让生活更艰难、感情破裂、有芥蒂，咬牙结婚，后面都是事。"},{"id":"ep5-k16","course":"ep5","number":16,"topic":"意义思维","title":"模式五：穿透表象——言语背后在表达什么？","summary":"本节借节日、职场言语与议价案例，说明表面行为之外还可能有意图和诉求。","points":["遇到表现，继续追问其原因与背景。","例子展示的是讲者的推断方式，具体动机仍要结合情境了解。"],"start":190,"end":195,"quote":"明白领导要干什么。菜市场吵架，挑菜叶黄、有洞，这不好那不好，是挑毛病吗？希望赶紧便宜，得明白意思。","quoteIndex":195,"related":["ep5-k03","ep9-k07"],"section":"ep5-p190","sectionTitle":"八 穿透表象","searchText":"问道五 意义思维 第5课 问道5 模式五：穿透表象——言语背后在表达什么？ 本节借节日、职场言语与议价案例，说明表面行为之外还可能有意图和诉求。 意义思维 遇到表现，继续追问其原因与背景。 例子展示的是讲者的推断方式，具体动机仍要结合情境了解。 八 穿透表象 八 穿透表象 从言语和行为看背后的意思 别老跟风。第五个，穿透表象，别被表面影响，分析底层意思，学会提问。老婆今天唉声叹气，是不是翻日历？一看生日，一看二月十四，“这不七夕”。 或者立秋，该秋天第一杯奶茶，要懂事。老婆发脾气，先翻日历、问AI：“今天老婆不高兴，今天什么节日，是不是踩在哪个点？”让AI帮分析，就知道怎么回事。一定学会看表面之下，融到思维。 领导说：“小王，多吃鱼。这鱼是好鱼，刺太多。”此时说：“领导，吃鱼肚子肉，心腹没有刺。”或者说：“鱼刺多，但有一条主干，有主心骨。” 明白领导要干什么。菜市场吵架，挑菜叶黄、有洞，这不好那不好，是挑毛病吗？希望赶紧便宜，得明白意思。"},{"id":"ep5-k17","course":"ep5","number":17,"topic":"家庭与沟通","title":"孩子不写作业：先找阻碍在哪里","summary":"讲者列出不会、太难、害怕、困倦、兴趣与注意力等不同可能，强调先问原因。","points":["相同的表面行为，可能来自不同的困难。","只处理表象可能暂时压住问题，找到原因才有机会改变。"],"start":196,"end":198,"quote":"孩子不爱写作业，别上来就骂、罚，这么蠢。越说越不敢，得看为什么。为什么叫问道？问为什么：不会、太难、害怕、太困、没兴趣、注意力有问题、家庭有问题，还是谈恋爱？都可能，从现象分析本质。","quoteIndex":197,"related":["ep4-k07","ep4-k25"],"section":"ep5-p190","sectionTitle":"八 穿透表象","searchText":"问道五 意义思维 第5课 问道5 孩子不写作业：先找阻碍在哪里 讲者列出不会、太难、害怕、困倦、兴趣与注意力等不同可能，强调先问原因。 家庭与沟通 相同的表面行为，可能来自不同的困难。 只处理表象可能暂时压住问题，找到原因才有机会改变。 八 穿透表象 孩子不写作业时先问为什么 孩子不爱写作业，别上来就骂、罚，这么蠢。越说越不敢，得看为什么。为什么叫问道？问为什么：不会、太难、害怕、太困、没兴趣、注意力有问题、家庭有问题，还是谈恋爱？都可能，从现象分析本质。 解决表象，只让问题暂时消失，找到原因才真正改变。不要只问发生什么，还要问为什么发生，行为、事情背后想告诉什么，真正推动原因是什么。所以今天先讲天道思维，从事情理解天意。"},{"id":"ep5-k18","course":"ep5","number":18,"topic":"意义思维","title":"模式六：时间与成本——省钱是否也在耗时？","summary":"本节通过排队、优惠券和反复奔波的例子，把时间纳入成本衡量。","points":["看见金钱支出的同时，计算占用的时间和精力。","收入换算是讲者用于说明时间价值的近似例子。"],"start":199,"end":206,"quote":"领10块优惠券研究半小时，便宜50块跑三趟商场，这是浪费时间，对时间能产生的价值没感觉。","quoteIndex":205,"related":["ep5-k19"],"section":"ep5-p199","sectionTitle":"九 时间与成本","searchText":"问道五 意义思维 第5课 问道5 模式六：时间与成本——省钱是否也在耗时？ 本节通过排队、优惠券和反复奔波的例子，把时间纳入成本衡量。 意义思维 看见金钱支出的同时，计算占用的时间和精力。 收入换算是讲者用于说明时间价值的近似例子。 九 时间与成本 九 时间与成本 把时间算成成本 第六个，时间与成本。最好把时间算成本。越低收入越不在乎时间，很多时间去消耗；越高收入越在意，计算一小时得失。 一年挣1000万，除365，再除8小时，大概3400块钱。一小时3600秒，大概率相当于一秒一块。按365天除，但不可能工作365天，按实际工作时间，大概率一秒一块，年薪百万就是一秒一毛。 马斯克为什么说，你的思维赶不上我的价值、时间，是浪费时间？人家一秒多少钱，甚至几千美元都有可能，我没具体算。他听5分钟汇报，浪费多少时间、钱？ 只有没钱的人不在意。为省20块开车两小时；加油站涨价前排队，一箱油差几毛、几块，排两小时，为这点钱，闲的。 领10块优惠券研究半小时，便宜50块跑三趟商场，这是浪费时间，对时间能产生的价值没感觉。 很多人抱怨，“有钱后找他吃顿饭也吃不着，耽误不了多久”。有钱人想的是，跟你吃饭为了什么？有意义思维，就进入不同阶级，只有高收入或对生命有价值的人才思考行动意义。"},{"id":"ep5-k19","course":"ep5","number":19,"topic":"意义思维","title":"交往的意义：成长、关系与时间选择","summary":"讲者说明自己选择聚会和吃饭的理由，包括彼此提升、工作需要与长期情谊。","points":["先明确这次交往对自己和对方意味着什么。","本节也保留了为多年友情投入时间的例子。"],"start":207,"end":210,"quote":"我个人，吃饭能对他、对我有提升，会去，但只限学生。不是学生，哪有时间？对师门发展有帮助，会去。什么都没有、就为吃饭，目前只有一个高中同学，关系好，将近30年交情。","quoteIndex":209,"related":["ep5-k18","ep6-k03"],"section":"ep5-p199","sectionTitle":"九 时间与成本","searchText":"问道五 意义思维 第5课 问道5 交往的意义：成长、关系与时间选择 讲者说明自己选择聚会和吃饭的理由，包括彼此提升、工作需要与长期情谊。 意义思维 先明确这次交往对自己和对方意味着什么。 本节也保留了为多年友情投入时间的例子。 九 时间与成本 吃饭交往与时间选择 三脚踹不出屁，跟你吃什么饭？珍惜几十年同学友情，可以。工作同事没什么交集，不下坏水就不错，离开公司99.99%可能一辈子见不到，在乎什么？ 我个人，吃饭能对他、对我有提升，会去，但只限学生。不是学生，哪有时间？对师门发展有帮助，会去。什么都没有、就为吃饭，目前只有一个高中同学，关系好，将近30年交情。 为这交情可以吃，否则有功夫还研究东西利益众生，扯这些有什么用？这很重要。"},{"id":"ep5-k20","course":"ep5","number":20,"topic":"意义思维","title":"模式七：当下有效性——此刻先处理什么？","summary":"孩子受伤的案例，用来说明当下行动应服务于最迫切的问题。","points":["区分解决问题、情绪发泄与责任讨论的先后。","本节重点是及时照顾伤者，再讨论防范与责任。"],"start":211,"end":219,"quote":"最后第七个，当下有效性。事情已经发生，此刻最需要处理什么？很多人第一反应不是解决，而是生气、害怕、抱怨、指责、追责、证明对错、发泄。真正问题摆旁边，所有人处理情绪。","quoteIndex":213,"related":["ep5-k21"],"section":"ep5-p211","sectionTitle":"十 当下有效性","searchText":"问道五 意义思维 第5课 问道5 模式七：当下有效性——此刻先处理什么？ 孩子受伤的案例，用来说明当下行动应服务于最迫切的问题。 意义思维 区分解决问题、情绪发泄与责任讨论的先后。 本节重点是及时照顾伤者，再讨论防范与责任。 十 当下有效性 十 当下有效性 孩子受伤时先解决眼前问题 最后第七个，当下有效性。事情已经发生，此刻最需要处理什么？很多人第一反应不是解决，而是生气、害怕、抱怨、指责、追责、证明对错、发泄。真正问题摆旁边，所有人处理情绪。 我自己亲历，关车门，儿子平时不扶那儿，这次扶了，我没看到，夹住了。一疼使劲一扥，整个手皮爆出来，血一下出来。 场面很刺激，老婆急了，孩子叫声跟平时不一样，估计真疼。但此刻最重要，不要发泄，不要紧张。第一，伤的是手指，再严重大不了截肢，也只是手指，对一生不会有太大问题。 第二，两门之间还留缝，实际上不会太严重。第三，此刻家人安抚、抱孩子，老公赶紧开车找最近医院，做伤口处理，这是应该干的。 我老婆先打再指责，我说现在都别说话，会影响开车。心情不好撞别人、车，都被耽误。最该处理什么，而不是发泄、论责任，事情已发生，任何对孩子手指没帮助的，现在不要处理。 还有学生，孩子玩水果刀伤手，爸爸在旁边。妈妈看孩子哭、流血，心疼，先埋怨爸爸“你在旁边干什么吃的”。有没有这么说不知道，据说话可能不太好听。爸爸马上反击：“他自己玩弄的，我还天天盯着？”进入互相埋怨、推卸责任。 后来夫妻干仗，孩子看没人管，哭着、带着流血手指找姥姥。最该先解决流血，再说平时怎么防范。"},{"id":"ep5-k21","course":"ep5","number":21,"topic":"家庭与沟通","title":"关系出问题后，先问自己的目标","summary":"本节在婚姻案例中，把是否继续、个人利益和关系前景放进同一讨论。","points":["先明确希望得到怎样的结果。","再检查当下的言行，是否有助于处理问题。","关于气运的取舍，保留为讲者在本次试讲中的解释。"],"start":226,"end":230,"quote":"老婆发现老公有小三，情绪激动，也要用意义思维评价，此刻所做对处理有没有帮助。思维模型不应该是闹、谁对不起谁，重要是让自己利益最大化。","quoteIndex":227,"related":["ep5-k20","ep9-k17"],"section":"ep5-p211","sectionTitle":"十 当下有效性","searchText":"问道五 意义思维 第5课 问道5 关系出问题后，先问自己的目标 本节在婚姻案例中，把是否继续、个人利益和关系前景放进同一讨论。 家庭与沟通 先明确希望得到怎样的结果。 再检查当下的言行，是否有助于处理问题。 关于气运的取舍，保留为讲者在本次试讲中的解释。 十 当下有效性 婚姻出现问题时先看目标与利益 老婆发现老公有小三，情绪激动，也要用意义思维评价，此刻所做对处理有没有帮助。思维模型不应该是闹、谁对不起谁，重要是让自己利益最大化。 第一先想婚姻还要不要，第二考虑老公走上升运还是败运。败运就算了，分家产，反正没感觉，也选择别人，还扯什么。但正在上升运，凭什么把位置让出？ 想都别想，老娘熬也熬死你。此刻坚决跟老公站一起，抵制小三。尤其生孩子想上位，只关心老公在A、B、C哪个运。C运就分，人家找别人；A运，想占后面的运，想都别想。 生活真有这样的人，这才正确。能不能继续过，看心情、利益、缘分。很多男人找小三图一时，时间长腻，哪个娶回也腻，还得找其他。不用管能跟多久，我们是用规则拯救人类的。"},{"id":"ep5-k22","course":"ep5","number":22,"topic":"意义思维","title":"意义七问：目的、结果、代价与后果","summary":"本课将意义思维浓缩成七个可以反复使用的问题。","points":["一：为什么做？二：能得到什么？三：值不值？","四：后面会是什么？五：大目标是什么？","六：真正的问题核心在哪里？七：此刻最应该干什么？"],"start":231,"end":240,"quote":"第一问，为什么做这件事？先搞清目的。第二问，能得到什么？学完改变什么，解决什么，价值和结果是什么？第三问，值不值？付出这么多，得到值不值？想想包子店和博士后。时间、金钱、健康、精力、风险、关系，值得吗？解决成本问题。","quoteIndex":234,"related":["ep5-k05","ep5-k24","ep5-k23","ep10-k23"],"section":"ep5-p231","sectionTitle":"十一 意义七问与日常应用","searchText":"问道五 意义思维 第5课 问道5 意义七问：目的、结果、代价与后果 本课将意义思维浓缩成七个可以反复使用的问题。 意义思维 一：为什么做？二：能得到什么？三：值不值？ 四：后面会是什么？五：大目标是什么？ 六：真正的问题核心在哪里？七：此刻最应该干什么？ 十一 意义七问与日常应用 十一 意义七问与日常应用 为什么做 能得到什么 值不值得 把意义思维浓缩为意义七问，一定融入生活，不然就废。 第一问，为什么做这件事？先搞清目的。第二问，能得到什么？学完改变什么，解决什么，价值和结果是什么？第三问，值不值？付出这么多，得到值不值？想想包子店和博士后。时间、金钱、健康、精力、风险、关系，值得吗？解决成本问题。 比如历史上传法得善终的人不多，为什么还选择？想得到什么？先说伟大的，为利益众生、六道提升，不负神佛仙期待培养，感恩天道。私心是什么？得升级，要功德、众生善缘，要领导看得上，派点事都干糊，天地生你何用，得把事做好。 领导看得上，下次给更好资源，这是私心。功德、众生善缘、领导认可都有了，关心这辈子过好不好，闲的。像我已经拿天界、佛界资格，就算出门出意外，也赚了；多活一天赚一天，凭什么不活，凭什么在意未来结果？ 这就是意义思维，值不值。人间看，不得善终不好，但大家来玩游戏，我已做好万一不得善终准备，肯定要玩高阶游戏：争取传法、挣功德、拿善缘、领导重视，还得善终。这是想法，能否实现不知道。越低端越不可控，越高端越好控。 后果 大目标 真正问题与当下行动 第四问，后面是什么？继续走，第二、第三、第四、第五步怎么样？第六步先不用问，以你们脑子不容易；聪明可以到十步，但出错概率大，能研究三到五步已经厉害。这解决长期后果。 第五问，大目标是什么？别干了小目标，毁掉大目标，叫终局反推。第六问，真正问题核心在哪里？从表象看到真相，穿透表象。第七问，此时在干什么，最应该干什么？现在做的对解决有没有帮助？没有就别干。"},{"id":"ep5-k23","course":"ep5","number":23,"topic":"学习与执行","title":"把七问放进日常提醒","summary":"讲者提出用标签、饰品等提醒，把意义思维带回生活中的具体场景。","points":["做事前问意义，做事中看方向，做事后看结果。","不要求每件事都宏大，而是减少不明所以的消耗。"],"start":241,"end":246,"quote":"做事前问意义，做事中看方向，做事后看结果。小事服从大事，眼前服从长远，表象从本质看，情绪服从解决问题。","quoteIndex":244,"related":["ep5-k22","ep5-k24"],"section":"ep5-p231","sectionTitle":"十一 意义七问与日常应用","searchText":"问道五 意义思维 第5课 问道5 把七问放进日常提醒 讲者提出用标签、饰品等提醒，把意义思维带回生活中的具体场景。 学习与执行 做事前问意义，做事中看方向，做事后看结果。 不要求每件事都宏大，而是减少不明所以的消耗。 十一 意义七问与日常应用 孩子流血还跟老公吵，对流血没帮助，先别干，处理完情绪稳了再说，这叫当下有效性。听完都说有道理，别回家没三天全忘，全还回来了。 这就是红尘道场要解决的。以后做小标签、小饰品，天天看到，喝水看意义在哪，放床头、最容易跟老婆吵架的地方。给孩子出背心，写逆修觉者，下面“请关注此时的我”，别先吵其他，我才是最大意义。 以后开始算，我花了多少生命。这时意义思维才不只是学过的学问，而是大脑工作方式。不要求人生每件事都伟大，是尽量不在稀里糊涂中消耗生命。 做事前问意义，做事中看方向，做事后看结果。小事服从大事，眼前服从长远，表象从本质看，情绪服从解决问题。 为什么做？值不值得做？然后呢？ 压成最简单三句话，经常问就行。"},{"id":"ep5-k24","course":"ep5","number":24,"topic":"意义思维","title":"再压缩成三问：为什么、值不值、然后呢？","summary":"本课最后把日常提问进一步缩短，便于反复唤起。","points":["为什么做？","值不值得做？","然后呢？"],"start":243,"end":246,"quote":"为什么做？值不值得做？然后呢？","quoteIndex":245,"related":["ep5-k22","ep10-k06","ep5-k23","ep10-k23"],"section":"ep5-p231","sectionTitle":"十一 意义七问与日常应用","searchText":"问道五 意义思维 第5课 问道5 再压缩成三问：为什么、值不值、然后呢？ 本课最后把日常提问进一步缩短，便于反复唤起。 意义思维 为什么做？ 值不值得做？ 然后呢？ 十一 意义七问与日常应用 以后开始算，我花了多少生命。这时意义思维才不只是学过的学问，而是大脑工作方式。不要求人生每件事都伟大，是尽量不在稀里糊涂中消耗生命。 做事前问意义，做事中看方向，做事后看结果。小事服从大事，眼前服从长远，表象从本质看，情绪服从解决问题。 为什么做？值不值得做？然后呢？ 压成最简单三句话，经常问就行。"},{"id":"ep5-k25","course":"ep5","number":25,"topic":"学习路径","title":"配套课程：知识分类与错误来源","summary":"第五课结尾预告知识分类和错误来源，后续第六、第七课接着展开。","points":["选择内容时，继续问它能带来什么帮助和成长。","区分专门投入注意力学习，与单纯消遣的不同目的。"],"start":247,"end":250,"quote":"今天聊到这里，又耽误太长时间。过几天有两个配套小课：一生可能犯的错误，错误来自哪；另一个知识分类。别看一堆书就以为有用，要分类、想有没有用。","quoteIndex":248,"related":["ep6-k01"],"section":"ep5-p231","sectionTitle":"十一 意义七问与日常应用","searchText":"问道五 意义思维 第5课 问道5 配套课程：知识分类与错误来源 第五课结尾预告知识分类和错误来源，后续第六、第七课接着展开。 学习路径 选择内容时，继续问它能带来什么帮助和成长。 区分专门投入注意力学习，与单纯消遣的不同目的。 十一 意义七问与日常应用 配套课程与下课寄语 今天聊到这里，又耽误太长时间。过几天有两个配套小课：一生可能犯的错误，错误来自哪；另一个知识分类。别看一堆书就以为有用，要分类、想有没有用。 看大V也要想，选这个对我有什么帮助、成长？纯闲的，还是怎么？上厕所、吃早餐、洗澡无聊，旁边有声，随便。但专门用脑子听，一定反思。连大V的话都要反思：知识已知道，为什么重复听？为听故事还是掌握知识？别把生命、时间浪费在无意义事情上。 好，拜拜，大家再见，过几天再见，应该很快。"},{"id":"ep6-k01","course":"ep6","number":1,"topic":"课程导读","title":"第六课定位：把意义思维用于知识分类","summary":"本课延续第五课，以知识分类与后续错误分类作为意义思维的应用。","points":["先直播、回看校正，再编辑录制，是本课说明的制作顺序。","本节的集数、活动与时间安排保留当次试讲语境。"],"start":33,"end":55,"quote":"大家晚上好。咱们现在直播，直接就上吧。今天讲知识分类，也是意义思维的一个延续。上次讲了意义思维，你得应用。应用的时候，找两个东西应用：一个是知识分类，一个是错误分类，或者叫成功的条件，这是咱们这两次讲的。","quoteIndex":36,"related":["ep5-k01","ep7-k01","ep5-k25"],"section":"ep6-p33","sectionTitle":"一 开场与课程安排","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 第六课定位：把意义思维用于知识分类 本课延续第五课，以知识分类与后续错误分类作为意义思维的应用。 课程导读 先直播、回看校正，再编辑录制，是本课说明的制作顺序。 本节的集数、活动与时间安排保留当次试讲语境。 一 开场与课程安排 一 开场与课程安排 直播计划与正式版制作 希望我们在十一月份之前，能够换一个地方给大家直播，看看施工怎么样。今天我刚把两个疗愈室的网络给调好，还挺费劲的，不过网速还是杠杠的，全部都从无线改成有线了。 大家晚上好。咱们现在直播，直接就上吧。今天讲知识分类，也是意义思维的一个延续。上次讲了意义思维，你得应用。应用的时候，找两个东西应用：一个是知识分类，一个是错误分类，或者叫成功的条件，这是咱们这两次讲的。 正好这段时间我出差，虽然出差了，但是每天也是弄很多东西，所以最近直播的速度就会快一点。大概的流程是这样：今天先知识分类，明天、后天——后天就是错误分类，或者叫成功的条件。再过两天，咱们就是讲智慧，还有什么延时法则、当下困局，都是在智慧里面讲。再往下走，就是修行的意义。 这四个的草稿都已经弄好了，所以讲得会快一点。基本上前面是隔一天讲一个，后面是隔两天讲一个。所以在十几天的时间里面，可能要连着上四次直播，赶紧都讲完。看看能不能还有时间，把因果法则和轮回法则给大家讲了。讲完这个，某一阶段就完事了。 然后我可能又要去憋一段时间大招。憋完大招之后，咱就直接讲有无、空色、法界成相、冰山法则，还有为什么要有人间、考验思维、万物皆可查、用高维思维去理解人间、大轮回观、大因果观，什么叫全面正向思维、木桶原则，还有从时间角度看修行。 这是第二阶段的东西。讲完了之后，咱们就先闭关一下。还是咱们之前的玩法：我先有感觉的，先把东西直播。直播的东西肯定不是特别圆满。一般我先直播，直播完了之后，等一周、十天，你再重新看自己的直播，就有感觉了。有感觉的时候，再重新校正、编辑一些东西，感觉就不一样了。这个时候我再把它重新编辑一下，再去重新录制，这就是成品了。 我记得当时最费劲的就是《问道二》，简直是又臭又长，我天哪，就那个东西，我自己至少看了四遍。还有咱们一个同学，努力地帮我剪辑了一下，把这个都转成文字。我拿着他的文字，自己又看了四遍，又加了很多东西。而且《问道二》还加了一个大白话版，正式版讲完了之后，再来一个大白话版。这些东西可能都没有给大家看过。 到时候等他们后期都剪辑完了，如果没什么问题，我先把《问道二》给大家看看，咱们未来的成片是啥样，就给大家放一集。 以后我还就一直按这个顺序努力工作。咱们争取明年的中期，我估计怎么着也能录个六七十集了。这个时候，我估计咱们逆修觉者的天道思维，六七十集基本上都差不多了之后，就一次性放给大家，这个就是正式版。 大概就是这么一个情况。但是我觉得挺费劲的。当时录播，不是直播，录播《问道二》的时候，那真是挺费劲。我看他们剪辑，一集好像是二十分钟还是三十分钟，光《问道二》正式版本，四集了还没剪完呢。这反正是比较能忽悠，没办法，只能说东西太多，希望大家能看明白。 我觉得他们做的动画挺好。你看咱直播版本没有动画，很多都即兴发挥，所以这就是咱们的一个安排。 在我讲完两部分之后，咱们开始进行录播的时候，我估计录播怎么着也得一两个月。这一两个月的时间，我就开始凑数了，给大家开始讲真相，一周一集吧。真相反正也得去弄，我估计整体的真相全弄下来，也得五六百集，因为它涉及的各个方面都有。 我是希望，从大家出生到大家死亡，还有死后的事，你这辈子要经历什么，咱们都提前告诉大家。反正这些东西，你愿意不愿意，都得经历。怎么着都得考试的东西，你还是提前知道点答案比较好，就是这样。 好，咱们计划说完了，现在开始上广告时间。 套符与专场的活动提醒 首先，你们年底年初用的那些套符，赶紧该订就订。你别十二月份要用，十二月份再订，那不好使。仙家的力量的确比较强，但是有一个问题：你得让仙家有一段时间能了解你，有一些东西该布局布局，该提前准备的提前准备。你别什么东西都屎堵屁股门了再上，那玩意肯定不好使。所以赶紧请，就现在赶紧请，专门年底年初用的套符，尤其是干工作的。 第二，今天晚上——今天是几号？九月三十号。今天晚上是九九重阳节这批烧纸的最后截止日了。因为咱们又是一堆，有给仙烧的，有给家人烧的，一堆东西，你赶紧，今天晚上是最后截止日期。 你们别忘了，九九重阳节的时候，该上供的得上供，那是大日子。有仙家、供仙和供神的，一定要上点好酒，因为他们经常拿到各个界面去，跟其他朋友吹的时候，得有点好东西。你不能光给二锅头，那也太惨了，拿不出手。 咱们的专场，一个是阳历十月二号，燃灯古佛专场；一个是九九重阳节，这不用说了，重中之重。这个专场帮助仙家冲仙门，包括功过，都是这一天要上报天庭的，大家一定表现好。 你看这几天，我都趁着现在胳膊好了，已经趴在地上大忏悔了。今天咬了半天牙，忏悔了二十个。哈哈，我觉得我要说的东西有点多，忏悔一个都需要一分钟。我下次精简点，至少临时抱佛脚嘛，该表现点表现。至少咱们得忏悔个十几天，代表咱真忏悔。 你这上次都答应说要忏悔的，结果从三月三都快到九月九了，半年过去了，都忘了这事。之前可以说胳膊有问题，现在就不能说胳膊有问题了。"},{"id":"ep6-k02","course":"ep6","number":2,"topic":"知识分类","title":"选择知识：现阶段能否落地？","summary":"本课评价知识的重点，是是否适合现阶段、能否改变行为与处境，并持续产生正向结果。","points":["知识的深奥、名气与数量，并不直接等于对自己的价值。","分类与评级，是为了决定哪些要深学，哪些只需了解。"],"start":56,"end":66,"quote":"真正重要的，不是这个知识到底高不高，而是是否适合你现阶段，是否能够落地，是否能够长期产生正向的结果，是否可以真正改变一个人的行为、处境和命运。","quoteIndex":63,"related":["ep6-k04"],"section":"ep6-p56","sectionTitle":"二 为什么要给知识分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 选择知识：现阶段能否落地？ 本课评价知识的重点，是是否适合现阶段、能否改变行为与处境，并持续产生正向结果。 知识分类 知识的深奥、名气与数量，并不直接等于对自己的价值。 分类与评级，是为了决定哪些要深学，哪些只需了解。 二 为什么要给知识分类 二 为什么要给知识分类 好，咱们开始吧。这次讲知识分类，下期讲人类错误或者成功的条件，都属于之前讲过的东西。只不过咱们讲了意义思维之后，我觉得有必要也给其他没听过的说一下，所以不是什么新东西，大家先凑合听听就行。 如果想听有意思的，一个是智慧那集，大概五六天之后，直播那集还是不错的；还有一个，讲修行的那个还可以。好，咱们开始吧。 衡量知识是否适合自己 咱们学完意义法则之后，为什么要说知识分类？主要对于我们人类来说，这一生其实都是在各种各样的信息和知识中度过，所以知识分类是非常重要的一件事。甭管是有用的知识，还是没用的垃圾知识，反正你这一生，脑子都不会太闲着，一直在吸收。 这么多种类型的知识或者信息，总得要分类：哪些东西着重听一些，哪些东西大概了解一下就行，别浪费时间。 人类很容易陷入知识混乱，一个主要根源就是知识不分级。很多人一直认为，知识越多越好、越全越好、越高级越好、越有名越好、越深奥越好，其实不是这样。好多人也觉得“读书破万卷，下笔如有神”。但其实： 真正重要的，不是这个知识到底高不高，而是是否适合你现阶段，是否能够落地，是否能够长期产生正向的结果，是否可以真正改变一个人的行为、处境和命运。 这些东西才是对你真正有用的。所以我们要给人生中经历的每一个信息分类、评级，确定它是否有用，以及有用多少，这都是咱们要做的。 如果不这样做，你就会陷入：沉迷于高维的理念，却无法实现；追求名著传记，却改变不了命运；学了很多工具技巧，却用错了方向；掌握了短期有效的方式方法，却在长期中被错误反噬。还有，把人的生命大量耗在了看似有文化，却难以改命的知识上。这些东西都很有问题。 人类的时间非常有限，看似百年，真正用来学习、提升自己的时间却非常有限。我们还要对抗社会、环境的变化，身体也有幼年、青年、中年、老年的时候。就算学习了很多东西，总得有时间应用才行。"},{"id":"ep6-k03","course":"ep6","number":3,"topic":"学习路径","title":"学习之后，还要留出应用时间","summary":"本节把学习放进工作、家庭与生活的时间约束中，强调应用同样需要时间。","points":["社会中的问题往往没有统一书本、范围和考试大纲。","需要识别自己要面对的问题，再安排学习与实践。"],"start":67,"end":77,"quote":"而有用的东西还不是像学校的。你在学校里学的所有东西，有个性质：有书本，有明确的方向、明确的范围，也有考试大纲。但是社会上真正能提升你的这些东西，从来没有人告诉你，哪些重要、哪些有用、哪些是应该看的，你的考试方向是什么，你要经历什么。这些东西没人跟你说，你得自己琢磨。","quoteIndex":71,"related":["ep5-k19","ep6-k08"],"section":"ep6-p56","sectionTitle":"二 为什么要给知识分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 学习之后，还要留出应用时间 本节把学习放进工作、家庭与生活的时间约束中，强调应用同样需要时间。 学习路径 社会中的问题往往没有统一书本、范围和考试大纲。 需要识别自己要面对的问题，再安排学习与实践。 二 为什么要给知识分类 有限的学习时间与应用时间 而且，不是说学了就行。你还得被家庭、孩子、父母、工作、生活上的很多琐事影响，我们的时间非常有限。本来就有限的时间，真正能够学习和应用的有多少？ 在一生里面，最开始的头二三十年其实非常珍贵，脑子又好使，精力又充沛，又没有那堆屁事，也没有家庭那些屁事，也不需要挣钱。但是我们把最精华的二三十年，都用于学一些这一辈子都用不上的知识，而且还用这些知识衡量你到底是不是优秀的，其实大量浪费了时间。 二三十年学完了之后，真到社会，开始要学有用的东西，又要工作、结婚、生子，还要对抗各种各样的办公室政治，一系列事情。所以你必须在一边工作、一边生活、一边挣钱的情况下，还得想办法学习有用的东西。 而有用的东西还不是像学校的。你在学校里学的所有东西，有个性质：有书本，有明确的方向、明确的范围，也有考试大纲。但是社会上真正能提升你的这些东西，从来没有人告诉你，哪些重要、哪些有用、哪些是应该看的，你的考试方向是什么，你要经历什么。这些东西没人跟你说，你得自己琢磨。 所以，你得在有限的时间里面——比如咱们就这么说，你二十五岁，终于从学校出来，进入社会了。 这个时候，你要开始学对自己这一辈子有用的东西，可是没人教你。你得自学、自悟，自己找方向。这些东西弄完了之后，你必须在五到十年的时间里面，也就是三十五岁之前，把有用的东西基本都学到。 学完了之后，三十五岁之后还得应用，还得赶时机。如果大运不给你，时机不给你，老天不给你机会，你也扯淡。 你看我快五十岁了，老天爷才给这个机会。所以前面将近这四十八年、四十九年，纯粹叫积累、学习。这就是一个普通人，没有任何背景、任何资源，从泥腿子一点一点往上升，很费劲。 所以你想，你的时间到底够不够？绝大多数人，男的基本上四十五岁之后就走衰运了，女的基本上四十岁就开始走衰运了。你想想，实现自己抱负的时间有多少？咱们别把人生一辈子都用在没用的东西上。 现在就要开始分类。分类之后，就会避免学错知识、用错知识、沉迷错误的东西，最终被知识反过来约束。"},{"id":"ep6-k04","course":"ep6","number":4,"topic":"知识分类","title":"第一套分类：知识五象限","summary":"讲者将原先的四象限扩展为五类，加入“低维有用但高维错误”。","points":["高维有用、高维无用、低维有用、低维无用。","第五类着重提示短期收益与长期后果可能相反。","这些维度沿用本课的命名。"],"start":78,"end":80,"quote":"第一种叫知识四象限，应该是五象限，但是咱们就先说四象限吧，有一个是新加出来的。主要就是高维有用、高维无用、低维有用、低维无用，还有一个是低维看上去有用，但是高维容易错误，就是五个。","quoteIndex":80,"related":["ep6-k02","ep7-k11","ep6-k05"],"section":"ep6-p78","sectionTitle":"三 按维度与作用分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 第一套分类：知识五象限 讲者将原先的四象限扩展为五类，加入“低维有用但高维错误”。 知识分类 高维有用、高维无用、低维有用、低维无用。 第五类着重提示短期收益与长期后果可能相反。 这些维度沿用本课的命名。 三 按维度与作用分类 三 按维度与作用分类 现在咱们对知识进行分类。我一般分类的方式有两种。当然，大家也可以按自己的习惯和方式方法分类，把觉得有用的、没用的都分开。 第一种叫知识四象限，应该是五象限，但是咱们就先说四象限吧，有一个是新加出来的。主要就是高维有用、高维无用、低维有用、低维无用，还有一个是低维看上去有用，但是高维容易错误，就是五个。"},{"id":"ep6-k05","course":"ep6","number":5,"topic":"知识分类","title":"高维有用：理解、承接与等待反馈","summary":"在本课的分类中，有些理念需要较长时间和相应条件，才可能进入实践。","points":["门槛包括认知、心性、耐力和实践条件。","讲者以长期积累与信任为例，讨论反馈来得慢时能否坚持。"],"start":81,"end":93,"quote":"所以高维有用，不是说不好使，关键是你使起来得有一定的时间，而且不容易看到正反馈。人就是这种样子，看不到正反馈，就不一定能坚持下去，很麻烦。想验证这些东西，都需要时间。","quoteIndex":93,"related":["ep6-k04","ep6-k06"],"section":"ep6-p78","sectionTitle":"三 按维度与作用分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 高维有用：理解、承接与等待反馈 在本课的分类中，有些理念需要较长时间和相应条件，才可能进入实践。 知识分类 门槛包括认知、心性、耐力和实践条件。 讲者以长期积累与信任为例，讨论反馈来得慢时能否坚持。 三 按维度与作用分类 高维有用 高维有用，这很简单。本身这个东西很高维，比如佛经、道经讲的一些道理，就是很高维、很正确的。但有一个问题：你会发现，越高维、越正确的东西，它离你很远，因为这个规则、法则离你很远。 离你很远，就会出现一个问题：你现阶段未必能理解，也未必能够承接、实践。比如段永平的价值投资，巴菲特的长期主义、复利，还有佛教中很多高阶的修行理念。 还有很多高级的哲学、高阶的人生规划，这些东西本身是对的。但有一个很大的问题：普通人不一定具备相应的心性、认知、耐力，还有实践条件。 而且越高的东西，比如“宁损性命，终不作恶”，你如果没有几世的记忆合在一起看，几乎不可能验证它。 几乎没办法验证，因为这些东西本身就是一个很长时间的东西。越没有时间去验证，越是短时间之内不容易成功的，会出现什么情况？ 人类推动行动力的一个很重要的动力，叫正反馈。这个正反馈不是没有，但是来得很迟。比如段永平投资，哪个东西也不能说三五年，马上买了之后就见效，甚至很有可能买完之后还要先跌上百分之五十。你能不能扛得住？扛不住，肯定享受不到那些东西。 像巴菲特，还有芒格，哪个不是几十年才见效？短期很难看到很大的收益，你不一定能扛得住。因为很多“道心道我”的东西没有，所以很麻烦。听完觉得有道理，但真正实操，一旦遇到诱惑、挫折或其他情况，就动摇、崩溃了。 所以不是人家的东西不好使，是门槛太高，实现起来很难，短时间之内不能见到效果。我记得当时在雪球上放段永平的投资理念，我就跟学生说：“你看吧，放了之后也没有用。”绝大多数人很难应用。 比如胖东来，大家都知道，也很熟悉。胖东来实现了这种因信任而产生的消费行为，你知道得积累多少年？短时间肯定很痛苦，见不了效果，而且很可能还要吃亏。 现在几十年的时间建立起这种信任，那绝对是无敌了。很多高维正确的东西，最大的问题就是你等不到，等不到那个时间。没有个五到十年，都看不出来你比别人……那五到十年之内，说不定你还比别人……它属于这种样子。 但真正一旦建立出来，尤其像信任这种东西，一旦建立起来，基本上别人就很难干到你。这就是高维厉害的地方。 所以高维有用，不是说不好使，关键是你使起来得有一定的时间，而且不容易看到正反馈。人就是这种样子，看不到正反馈，就不一定能坚持下去，很麻烦。想验证这些东西，都需要时间。"},{"id":"ep6-k06","course":"ep6","number":6,"topic":"知识分类","title":"高维无用：追问实际用法","summary":"本课把听起来高深、却说不清现实用法的知识列入这一类。","points":["如何实现，如何用于具体生活？","本节对经典语句的评价，是讲者采用实操尺度作出的判断。"],"start":94,"end":103,"quote":"第二，高维无用。很简单，听起来很高深、很玄妙、很有境界，但不能落地。任何理论和东西，你就问他：“这个东西我怎么能实现？在现实中怎么应用？”如果说不出来，就让他哪凉快哪待着去。","quoteIndex":95,"related":["ep5-k07","ep10-k10","ep6-k05","ep6-k07"],"section":"ep6-p78","sectionTitle":"三 按维度与作用分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 高维无用：追问实际用法 本课把听起来高深、却说不清现实用法的知识列入这一类。 知识分类 如何实现，如何用于具体生活？ 本节对经典语句的评价，是讲者采用实操尺度作出的判断。 三 按维度与作用分类 高维无用 第二，高维无用。很简单，听起来很高深、很玄妙、很有境界，但不能落地。任何理论和东西，你就问他：“这个东西我怎么能实现？在现实中怎么应用？”如果说不出来，就让他哪凉快哪待着去。 这里面有很多古代人写的东西都是这样。对不起，六祖吧，比如他的“本来无一物，何处惹尘埃”，就是这种样子。 这个东西算不算一种很高级的理论？算。但是你告诉我，人间怎么执行？如何应用在每一件事情上？平时怎么应用？如果你想证明这个世界是假的，不用说这个，很多东西都可以证明这个世界是假的，我也不用非得学这个。所以你就看，这个应用在哪。 很多东西是一些玄学的口号，包括“即心即佛”“无明所障”。到底什么叫无明？本心是啥？有没有定义？这些东西都没有一个具体的东西。它可能确实很高级，但你以后学了意义法则，就记住：只要不能进入实操，就去他们的，学了也没有用。 这么长时间，人类都没把实操研究出来，你现在学它有什么意义？几千年来没研究明白实操，也没耽误大家活着，那为什么要研究它、学习它？所以一定记住，凡是不能实操的东西，就去他们的。 “万物归一”“一切皆成空”，什么宇宙真理、超越人间，什么空空、无无，还有无无无，这就是理论上的东西。只要不能进入实操阶段，就跟我们没关系，就去他们的。 请大家一定记住，不要被这些高高在上的东西影响。曾经有一段时间，佛教也好，道教也好，都是必须高级知识分子才能研究的东西。很多时候，他们属于比拼智力：我要不说点玄而又玄的东西，你好像觉得我没水平。 但咱们不是为了这样。我只关心，这些东西能不能让你未来更幸福。如果高深的东西通过我这，你不能听明白，那是我的失败。 只学能实操的，哈哈，只学能实操的。大家记住，只要在人间没有办法验证、没有办法实操，不能告诉我这条具体在生活中如何应用，就一切都去他们的。让他们自己慢慢装逼去，古人就把他们扫进历史的尘埃里。"},{"id":"ep6-k07","course":"ep6","number":7,"topic":"知识分类","title":"低维有用：具体工具与实操能力","summary":"本课以记账、编程等技能说明，不必玄妙的知识也能处理现实问题。","points":["关注它能否完成具体任务。","工具和技能的用途，与后文的功能分类可以对照阅读。"],"start":104,"end":106,"quote":"更多都是一些技能、工具类，或者实操类的东西。我觉得比学那种高维无用的强多了。","quoteIndex":106,"related":["ep6-k06","ep6-k08"],"section":"ep6-p78","sectionTitle":"三 按维度与作用分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 低维有用：具体工具与实操能力 本课以记账、编程等技能说明，不必玄妙的知识也能处理现实问题。 知识分类 关注它能否完成具体任务。 工具和技能的用途，与后文的功能分类可以对照阅读。 三 按维度与作用分类 低维有用 第三，低维有用。这个不用说，比如控制情绪、识人、厚黑学，这些低维很有用。包括哪怕学点财务知识，会算个账，会编个程，这叫低维有用，不叫多高维的东西，但实际上有用。 更多都是一些技能、工具类，或者实操类的东西。我觉得比学那种高维无用的强多了。"},{"id":"ep6-k08","course":"ep6","number":8,"topic":"知识分类","title":"低维无用：消遣与持续占用注意力","summary":"本节以八卦、骂战和低质量信息说明注意力消耗，也区分了适当放松。","points":["讲者承认自己也会把短视频用于休息。","需要判断它占用了多少时间，是否挤走了重要事情。"],"start":107,"end":110,"quote":"这个是这样，我也看无价值的短视频，我还付费看了，哈哈。刷动画片这些东西，我也干。这是在无聊、睡不着觉、睡前准备的时候，上厕所、吃饭的时候，也刷，但纯粹是放松大脑。我是真干活了，所以放松没问题。你们好多人其实不怎么干活，你不能一天十八个小时都在放松，那就有问题了。","quoteIndex":109,"related":["ep6-k03","ep7-k08","ep6-k07","ep6-k09"],"section":"ep6-p78","sectionTitle":"三 按维度与作用分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 低维无用：消遣与持续占用注意力 本节以八卦、骂战和低质量信息说明注意力消耗，也区分了适当放松。 知识分类 讲者承认自己也会把短视频用于休息。 需要判断它占用了多少时间，是否挤走了重要事情。 三 按维度与作用分类 低维无用 第四，低维无用。这个更简单，什么八卦、低质量的争论、情绪价值，研究哪个明星是不是谁的小三，这不闲的吗？纯粹是闲的。还有网络骂战、无价值的短视频。 这个是这样，我也看无价值的短视频，我还付费看了，哈哈。刷动画片这些东西，我也干。这是在无聊、睡不着觉、睡前准备的时候，上厕所、吃饭的时候，也刷，但纯粹是放松大脑。我是真干活了，所以放松没问题。你们好多人其实不怎么干活，你不能一天十八个小时都在放松，那就有问题了。 这些没有什么太大的实际意义，不会对你的人生产生什么，还容易让注意力被打碎、情绪被污染、判断力被降低、生命被消耗，这些东西都称为垃圾。"},{"id":"ep6-k09","course":"ep6","number":9,"topic":"知识分类","title":"短期有效，长期却有害","summary":"第五类关注某些办法短期看似获利，长期或整体上却造成伤害。","points":["不能仅凭眼前收益判断方法是否有用。","本课列举欺骗、控制等行为，用来说明长期反噬。"],"start":111,"end":115,"quote":"最后一个，叫低维有用，但高维错误。有些方式方法和认知，在短时间之内对你非常有帮助，但是在长期、整体或者更长的时间层次上看，你是犯错误的。","quoteIndex":112,"related":["ep6-k08","ep2-k13"],"section":"ep6-p78","sectionTitle":"三 按维度与作用分类","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 短期有效，长期却有害 第五类关注某些办法短期看似获利，长期或整体上却造成伤害。 知识分类 不能仅凭眼前收益判断方法是否有用。 本课列举欺骗、控制等行为，用来说明长期反噬。 三 按维度与作用分类 低维有用但高维错误 最后一个，叫低维有用，但高维错误。有些方式方法和认知，在短时间之内对你非常有帮助，但是在长期、整体或者更长的时间层次上看，你是犯错误的。 比如很多老板，老觉得自己是天命之子，恨不得跟皇帝一样，这属于脑子有问题。还有学什么帝王之术，你一个不是帝王的，没事学这个干什么？还有研究诈骗的，怎么P2P的，怎么用情绪控制人的，再研究点厚黑学，在办公室里折腾点。 咱们就这么说，人类中短期对自己有益、长期对自己有害的，你可以看看刑法就知道了。刑法里很多罪名，其实都是短期对自己极其有益，长期对自己是极大伤害，就是这样。 好，四象限，应该说五象限，说完了。咱们再把知识按种类分类。"},{"id":"ep6-k10","course":"ep6","number":10,"topic":"知识分类","title":"第二套分类：十种功能型知识","summary":"另一套分类按知识承担的功能划分，与五象限可以并用。","points":["真相、方向引领、人性心性、学术边界、高维不确定。","工具方法技能、生活生存、交流与人情世故、见识扩展、无用信息。","本课展开前三类，其余七类在第七课继续。"],"start":116,"end":120,"quote":"第一个是真相；第二个是方向引领性的知识；第三个是人性心性类的知识；第四个是学术边界类的知识；第五个是高维不确定的知识，或者就说不确定；第六个是工具、方式方法、技能类的知识；第七个是生活生存类的知识；第八个是交流沟通、人情世故类的知识；第九个是见识类、扩展类的知识；第十个就是无用的知识。","quoteIndex":119,"related":["ep6-k11","ep7-k09"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 第二套分类：十种功能型知识 另一套分类按知识承担的功能划分，与五象限可以并用。 知识分类 真相、方向引领、人性心性、学术边界、高维不确定。 工具方法技能、生活生存、交流与人情世故、见识扩展、无用信息。 本课展开前三类，其余七类在第七课继续。 四 按功能分类与真相类知识 四 按功能分类与真相类知识 十种功能型知识 第二种分类的方法，就是十种功能类型的知识和信息。 第一个是真相；第二个是方向引领性的知识；第三个是人性心性类的知识；第四个是学术边界类的知识；第五个是高维不确定的知识，或者就说不确定；第六个是工具、方式方法、技能类的知识；第七个是生活生存类的知识；第八个是交流沟通、人情世故类的知识；第九个是见识类、扩展类的知识；第十个就是无用的知识。 哎，对，刑法里有很多发家致富的方式方法，那都是人类智慧的结晶，哈哈，就看你有没有命扛得住了。"},{"id":"ep6-k11","course":"ep6","number":11,"topic":"知识分类","title":"第一类：真相知识研究运行机制","summary":"本课所称的真相知识，关注底层规律、因果结构和真实机制。","points":["接续第四课的链条：缘分、真相、认知、思维模型、行为。","当原有理解无法解释结果时，讲者由此提出“思维茧房”的问题。"],"start":121,"end":128,"quote":"第一个，咱们说真相知识。真相知识研究的是什么？这个世界到底怎么运行。它关注的不是表面观点，而是底层规律、因果结构和真实机制。这一类叫真相类知识，本身就很少，非常非常少，你这辈子能得到点，不容易。","quoteIndex":122,"related":["ep6-k10","ep6-k18","ep4-k03","ep7-k19"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 第一类：真相知识研究运行机制 本课所称的真相知识，关注底层规律、因果结构和真实机制。 知识分类 接续第四课的链条：缘分、真相、认知、思维模型、行为。 当原有理解无法解释结果时，讲者由此提出“思维茧房”的问题。 四 按功能分类与真相类知识 真相与认知的关系 第一个，咱们说真相知识。真相知识研究的是什么？这个世界到底怎么运行。它关注的不是表面观点，而是底层规律、因果结构和真实机制。这一类叫真相类知识，本身就很少，非常非常少，你这辈子能得到点，不容易。 上节课刚说完的认知体系：行为来自于什么？来自于思维模型。思维模型来自于认知，认知来自于真相，真相来自于缘分。一定把这个东西记熟，融入自己的生活。所以最重要的是，你要能获得有用的真相。 说到真相，就要明白什么叫思维茧房。人类要突破自己的思维茧房，本身就是一件非常困难的事情。因为这类知识，只能从更大的思维茧房里面获得，从更高维的。这其实就像天界，一层套一层，像俄罗斯套娃一样。 想知道我们这层空间的真实东西，得从上层空间获得。但上层空间就一定不是思维茧房了吗？也有，上层还有上层。所以，要破除自己当前的思维茧房，就必须从上一层的思维茧房里面获得知识。 这是很麻烦的一件事。因为思维茧房的出现，你会下意识地习以为常，觉得现有圈子里并没有出现让你觉得奇怪或者有问题的事情。但是，你发现最终的结果总是很难把握：我按现有的认知努力了、工作了，很多人辛辛苦苦干了一辈子，最后一场空，仍然过不好这一生；很多人做了一辈子好人，也没落到好的结果。 这就是思维茧房，因为你知道的真相有问题，又没有获得更真实的，或者更高层的真相认知，所以发现不了问题。时间长了，你就会发现：“怎么我按这个做，并没有得到所希望得到的东西？” 出现这种情况的时候，你就要有意识：你正活在一个思维茧房里，且知道的东西有问题。在这个思维茧房里，很难发现自己有问题，所以导致努力了一辈子，人生还是失败，还是一场空。"},{"id":"ep6-k12","course":"ep6","number":12,"topic":"认知与思维","title":"家庭与学校：认知来源如何变化","summary":"讲者把家庭与学校列为两种认知环境，讨论信息来源扩展后的理解差异。","points":["家庭首先影响世界观与相处方式。","学校带来同学、老师等新信息，可能与家庭形成冲突。"],"start":129,"end":135,"quote":"所以家庭对你说的那些东西，有时就不太认可。为什么？因为已经产生了新的信息茧房，不再困在家庭里，有新的信息渠道了。虽然这个渠道不一定多正确，但至少也是一个新的。","quoteIndex":133,"related":["ep4-k26","ep6-k13"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 家庭与学校：认知来源如何变化 讲者把家庭与学校列为两种认知环境，讨论信息来源扩展后的理解差异。 认知与思维 家庭首先影响世界观与相处方式。 学校带来同学、老师等新信息，可能与家庭形成冲突。 四 按功能分类与真相类知识 常见的思维茧房 家庭与学校 我们常见的四大思维茧房，第一个是家庭。人类认知第一波被影响，就是家庭。你的父母长辈、亲人，对你进行这个世界的描述，你应该干什么、不应该干什么，都来自这里。人与人之间的关系，对世界的三观，也来自家庭。所以好多人说，原生家庭有问题，容易影响这个人的人生，就是这样。 第二个，还好，你有出去溜达的机会，年轻时出去的机会就是上学。进了学校之后，认知层次已经不仅来自家庭了。有同学、老师，还有其他同学的家长，有时还能自己从网上获取信息。 所以家庭对你说的那些东西，有时就不太认可。为什么？因为已经产生了新的信息茧房，不再困在家庭里，有新的信息渠道了。虽然这个渠道不一定多正确，但至少也是一个新的。 你看，为什么很多妈妈解决不了闺女和黄毛之间的问题？主要是在闺女的思维茧房里，认为黄毛很可爱、很值得信任。但在妈妈的认知体系里，黄毛是很……可是闺女不信，因为闺女没有妈妈的认知体系。 产生认知冲突之后，谁也说服不了谁，就开始玩脾气了呗。这就是第二个思维茧房。"},{"id":"ep6-k13","course":"ep6","number":13,"topic":"认知与思维","title":"社会圈层与天道认知","summary":"本课继续讨论社会经历造成的认知差异，并把天道认知列为第四层讨论。","points":["不同圈子和经历，让人接触到不同信息。","天道认知部分沿用讲者的宗教世界观。"],"start":136,"end":151,"quote":"不同的缘分，造就了不同的人生和能够看到的真相；不同的真相，造成了对世界不同的看法和认知。所以，一定要好好学习。","quoteIndex":149,"related":["ep6-k12","ep7-k20"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 社会圈层与天道认知 本课继续讨论社会经历造成的认知差异，并把天道认知列为第四层讨论。 认知与思维 不同圈子和经历，让人接触到不同信息。 天道认知部分沿用讲者的宗教世界观。 四 按功能分类与真相类知识 社会与不同圈层 第三个思维茧房是社会。进入社会之后，发现对世界的认知、对人性的了解，又不一样了。大家都有公司、有圈子，还有外面的社交圈子，对世界又有一个全新的认知。 你的老板、同事、朋友，还有外面的社会人士，都会给你提供新的东西。你又突破了学校的认知，产生一个新的认知，觉得更厉害了。这个时候，又进入社会的信息茧房，因为得到的认知只能从这些人得来。 而且人是分等级、分阶层的。能够给你更好认知的，可能就是这些大老板、小老板。 包括你出了一个国家，比如韩国——对不起，比如朝鲜人民，对世界的认知和我们就不太一样。我们在七十年代、八十年代——不能说七十年代、八十年代，我们说九十年代、零零年吧，那时候还没有太多网络，还要看《新闻联播》。我们认为的是什么？前二十五分钟，祖国山河一片大好；后面五分钟，国际新闻，外面的人民都生活在水深火热之中。这就是我们的认知。 所以有时得走出国家，到外面看看世界怎么样。比如现在，我们在马来西亚，也有很多马来西亚的员工出来了。他们还在说：“我们这边娶媳妇之后，要孝敬公婆，要在家伺候。”国内女生听完，瞬间震惊，表示不能接受。 这时候再看马来西亚的女生，就觉得：“你们果真生活在水深火热之中，还生活在旧社会的封建迷信之中。”你看，这就是圈子不一样。 但有些男生充满了对娶马来西亚女生的向往，因为国内女生实在拿不下。“马来西亚女生这么传统吗？真的太好了。”所以，多走几个国家，说不定结婚的问题就解决了。解决不了的问题，出去溜一趟，说不定很多事情都能解决，哈哈。 好，这边也要彩礼，但泰国不要，泰国好像没那么多事。不行，娶个俄罗斯的也行，弄个金发碧眼的，是吧？ 咱们不开玩笑了。社会的思维茧房，又分很多不同等级。比如普通刚进入社会的，跟老油子对社会的认知不一样；那帮老油子，跟我这样的人不一样；我这样的人，跟一些拥有很大能量的人，认知肯定也不一样。 所以，各自到社会里面的时候，看到的真相不一样。 真相来自于什么？来自于缘分。你们有的喜欢看网上大V，跑到海外翻墙看大V。人家讲的很多东西，你们觉得很新鲜、很有意思，为什么？其实人家讲的这些东西，不是你的人生。在你的人生、你的缘分里，这辈子也碰不到这些事，包括一些讲政治、社会、历史的。 我听到这些东西，也觉得很震惊，也很羡慕、佩服人家的认知和经历。当然，要是比跟天道、法界打交道，那我直接甩你几十条街。这是什么？这是我的缘分。 不同的缘分，造就了不同的人生和能够看到的真相；不同的真相，造成了对世界不同的看法和认知。所以，一定要好好学习。 天道认知 第四个，你要有天道认知。人间认知再厉害，也没有用，因为很多东西叫人间正确、天道错误。你很可能努力了一辈子，辛苦了一辈子，干掉所有竞争对手，解决所有难题，最后走的是一条死路，有可能这样。这属于不知道天道认知，那就没办法了。"},{"id":"ep6-k14","course":"ep6","number":14,"topic":"学习路径","title":"破圈的五种途径","summary":"本课提出交流、阅读、不同经历、经验指导和老师带领等学习途径。","points":["走出去交流，多读有用的书，了解他人的经历。","向有经验的人请教，让已有经验帮助自己少走弯路。","借助老师指导，是本节列出的第五种途径。"],"start":152,"end":173,"quote":"如果有大哥、大姐，人家真看得上你，一句话，那是几十年换出来的经验，可以节省你几十年的时间。所以抱大哥、抱大姐很重要，大腿很重要。","quoteIndex":169,"related":["ep6-k15"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 破圈的五种途径 本课提出交流、阅读、不同经历、经验指导和老师带领等学习途径。 学习路径 走出去交流，多读有用的书，了解他人的经历。 向有经验的人请教，让已有经验帮助自己少走弯路。 借助老师指导，是本节列出的第五种途径。 四 按功能分类与真相类知识 破圈的几种途径 多走出去与不同的人交流 既然有思维茧房，就要破圈。怎么破圈？说到真相这条，一定要记住，因为有些真相不是你有这个缘分，你才能得到的。很多缘分你没有，很多人的人生你不具备。 第一件事，多去外面走走，多跟一些人聊天，别跟你同级的人聊天。记住一点：如果跟旁边的人聊天，很长时间之内，已经没有人说出一些东西、看法、思路，让你觉得震惊、意外或者惊讶，那身边这些人，很可能跟你已经进入同一个思维茧房。明白了吧？得通过现象分析本质。 如果跟很多人聊得很快乐，但是人生已经没有“经验的东西”了，就一定记住，你已经进入一个思维茧房。这几年碰到的人，你把他们拉上一个圈，把这个圈认为是跟现在的我相同，或者比我更低。或者这个人一张嘴，就知道他要说什么，要记住，他的水平小于等于你现在的水平，没有意义。 你需要多走出去，多看世界，尤其不要只在自己的国家。甭管哪个国家，都需要到外面走走，才能了解世界的真相。我觉得这非常重要，什么风土人情，看看别的国家怎么生活。别去危险的国家，别去。 多读有用的书 第二，多读书，多读有用的书。有用的书其实很少。比如咱们说《逻辑思维》，还有樊登读书会，这都是公开的、能够读的书。你放心，里面绝大多数知识，都不会对你产生什么人生的提升。说白了，这种圈子已经没有用了，这种作家做出来的书，已经不可能对人类产生太大的帮助，看或者不看就那么回事。 当然，你是一个新人，值得去看看。如果三十五岁了，他讲的那些知识还能让你震惊，我觉得你本身就是一个问题，就是这样。 看海外的视频与不同经历 第三，多去海外看一些名人的视频。我觉得海外一些大V的视频还是值得看。有的讲政治、历史、经济、人情，讲得像奇幻似的那种，就不用看了。但是社会、经济、政治，还有历史事件的演变，我觉得对自己都很有帮助。 这些东西在国内几乎看不到，但我觉得对你们很重要。就像刚才说的，都是源自人家一生的缘分。你怎么修行也没有用，因为没有这个缘分，别费劲了。 包括你们来我这，听很多东西，我也在贩卖我的缘分。我有这个缘分接触这些真相，把东西看完、总结完告诉你们。因为你们注定累劫轮回，绝大多数情况下，也不可能有我这样的缘分，你放心，不可能有。 所以只能从我这获得。当然，一些国外大V讲政治，你听完也很佩服，心向往之，确实很厉害。 找大哥大姐借助经验 再往下，就是找大哥大姐，抱大腿。很多现实的东西，真是寒窗苦读十年，怎么可能比得过人家三代经商？书中的很多东西还是太简单，包括问AI，也好使不了。具体走通一些事，很多明道、暗道、机会，书里没有这些东西。 所以光读书，光自己了解，光用AI了解，解决不了问题。比如现在我们整个海外支付这套东西，说白了，我自己开个公司，专门帮助别人进行海外支付，都能开始收钱。为了走通这条路，我走了大概将近五年，交的学费多了。被坑、被骗，好不容易走通，发现还不好使，或者钱收完转不出去，或者成本太高、政策变化，事多了。 如果有大哥、大姐，人家真看得上你，一句话，那是几十年换出来的经验，可以节省你几十年的时间。所以抱大哥、抱大姐很重要，大腿很重要。 不仅在人间重要，在天界、佛界、神界也一样。人家老大指点你：“不要往这边修，修完上面没什么结果。”那都是几百万年换出来的经验。包括“执手去”，你去攻打第十魔界，那边有熟人，做个样子就完了。没事打他们第一魔界去，那不直接被干？佛祖都被拍好几个，所以很重要。 你是上面的人，出去溜一圈，混点那个啥……哎呦，操，讲太多了，不能太多。反正抱大腿很重要，要不然咋死的都不知道。很多东西是人家的经验，这一句话就可以“点火你”，一句话也可以把你坑死，而且人家还是正规的，表面上没做着坑的。这很重要。 有好老师带着 第五，有一个好老师带着。自己分析行不行？你就别想这事了。它又涉及几个问题：我不抱大腿，也不看别人，自己能不能推导出很多规则？能不能靠自己破解？"},{"id":"ep6-k15","course":"ep6","number":15,"topic":"认知与思维","title":"独自推导的五种限制","summary":"讲者并未把自行推导说成绝不可能，而是强调其难度和成本。","points":["推导能力与信息完整性有限，时间和试错成本可能很高。","还要面对危险，以及本课所说的规则压制。"],"start":174,"end":182,"quote":"第一个，底层推导上层的规则，不是说不行。你得很聪明，分析能力、洞察能力很强，说白了脑子得在线。能不能行？行，但往上推一层还可以。很多东西是推出来的，不是看出来的，很可能不全面，但能推出来一部分，已经很厉害。","quoteIndex":176,"related":["ep6-k14","ep6-k16"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 独自推导的五种限制 讲者并未把自行推导说成绝不可能，而是强调其难度和成本。 认知与思维 推导能力与信息完整性有限，时间和试错成本可能很高。 还要面对危险，以及本课所说的规则压制。 四 按功能分类与真相类知识 自行推导面临的五种限制 首先，这个事不是说不行，是很难，有五条规则压制着你。 第一个，底层推导上层的规则，不是说不行。你得很聪明，分析能力、洞察能力很强，说白了脑子得在线。能不能行？行，但往上推一层还可以。很多东西是推出来的，不是看出来的，很可能不全面，但能推出来一部分，已经很厉害。 比如弄元素周期表的，叫门捷列夫吧？对，门捷列夫。通过现象总结规律，直接把元素周期表推出来，确实很厉害。但你想再推上一层的上一层，能推两层，几乎算奇迹；想推到第三层，几乎不可能。从底下往上推，不是说不行，是很困难。 比如星魂这件事，说白了，距离咱们这个第三十层空间，你拿什么推？推出屎来也推不出来。像大天魂、小天魂，谁跟你说？像影魂，谁跟你说？没这水平，就看不出来。还有本源，更没戏了，都不定多少世之前的事。在人间，能看十世之内的，都算厉害了。但很多因果不是，有些老魂动不动几百世。看不到那么远，很多东西都解释不了。 第二，时间太长。人家几十年走出来的经验，你短时间之内弄出来，可能性很低。 第三，成本太高。比如我走海外支付，各种各样的海外支付，基本上都走了一遍。你想穷举一遍，得多少成本？如果没太多活钱，基本没戏。成本太高了，穷举一遍，基本上可能性不大。 第四，太危险。有些东西一旦走错，就没有回头路了，就不行了，所以不能自己往上冲。 第五，规则压制。仔细想想，当年我是泥腿子的时候，费了多少劲想往上走，就想多挣钱，就是挣不出来。"},{"id":"ep6-k16","course":"ep6","number":16,"topic":"机缘与贵人","title":"突破原有圈层，需要什么新资源？","summary":"本节提出，原有认知、人脉与能力可能不足以支持下一阶段。","points":["关注能带来新机会、新经验与新资源的帮助。","讲者以自己的发展和人类说明书规划说明这一想法。"],"start":183,"end":191,"quote":"这是为什么？因为原有的人脉、认知、能力，不足以突破那个圈子。原有的东西突破不了，必须引入优质的机会、优质的贵人、优质的资源。","quoteIndex":184,"related":["ep6-k15","ep7-k18","ep8-k02"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 突破原有圈层，需要什么新资源？ 本节提出，原有认知、人脉与能力可能不足以支持下一阶段。 机缘与贵人 关注能带来新机会、新经验与新资源的帮助。 讲者以自己的发展和人类说明书规划说明这一想法。 四 按功能分类与真相类知识 突破圈层需要新的资源 这是为什么？因为原有的人脉、认知、能力，不足以突破那个圈子。原有的东西突破不了，必须引入优质的机会、优质的贵人、优质的资源。 你看我从一个泥腿子往上升级，升级到阴阳师，咱们就说升级到阴阳师，没有强大的法界支持，根本不可能，别想了。经过将近十年，发展到现在这个地步。如果再想升级，怎么办？还用现有的资源，已经不可能再推动升级了。 再想升级，就要新的创新，新的可以承载更大量人群的东西，那是什么？叫天道知识，就是人类说明书。 人类说明书，得上面给你灵感、智慧、感觉，让你看到足够多的真相。不看这些东西，怎么总结？所以也得上面有大号，而且大号还得是比较……懂的东西比较多，至少也得从远古出来。要是最近一两亿年刚生出来的大号，肯定没戏，因为远古很多事没经历，对很多事情都很难推动，也是一样。 假设通过这个东西，我们的粉丝扩张到几十万、上百万、上千万。如果再往上走，又需要新的资源。这个资源谁给？一定是天道给，包括你累劫轮回里得积累这些东西，没积累肯定积累不了。 这就是破圈，很难的一件事。真相这行讲得有点多。你们最好想办法多看外面的东西，多看到比现有圈层更高级的东西。 怎么才叫比现有圈层更高级？他讲的东西足够让你震惊。如果对你没有什么感觉，肯定不叫提升。 还有，一定要学会抱大腿，抱大腿是所有生物必须掌握的。只要不抱大腿，你放心，他自己能活起来、能破圈的可能性极低，基本上就是穷人思维，不抱大腿，所以一定注意。"},{"id":"ep6-k17","course":"ep6","number":17,"topic":"知识分类","title":"已有的知识，要学会降级","summary":"当新内容只是更换人物和故事，未增加新的认识时，本课提出调整其关注等级。","points":["分清新闻更新、认知增长与真相学习。","已经理解的原理，不必因为换了案例就投入同等注意力。"],"start":192,"end":198,"quote":"你心中要把知识归类：它对我算是新闻类的知识，还是认知类的知识，还是真相类的知识？一定学会分类，这样关注点、重点就不一样。别每个东西都听一遍，那你的人生有得……类似的事不是一直在重复吗？","quoteIndex":198,"related":["ep7-k07"],"section":"ep6-p116","sectionTitle":"四 按功能分类与真相类知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 已有的知识，要学会降级 当新内容只是更换人物和故事，未增加新的认识时，本课提出调整其关注等级。 知识分类 分清新闻更新、认知增长与真相学习。 已经理解的原理，不必因为换了案例就投入同等注意力。 四 按功能分类与真相类知识 已有的知识要学会降级 真相这一块，还有一点：看大V的东西，刚开始比较有意思，但如果持续说的东西，尤其讲历史、社会的，你分析一下，跟之前讲的差不多，只换一个形式。 比如贪污，古代讲一些贪污，很厉害；现在讲贪污，就知道谁贪污了，实际上知识点没有升级。今天谁被拿下，明天谁被拿下，你会发现，拿下这个事情没变，只是人变了。 这个就要降级。记住，要学会降级。 这种认知已经有了，他只是像新闻一样，告诉你谁又出了问题。今天张三，明天李四，后天王五、麻六，实际上性质差不多。这个知识就把它降成新闻类的知识。 但有些人讲传记，有很多精彩的东西，你觉得可以总结一下，这个可以。所以一定学会分。别每次人家讲一个东西，张三被抓了，太有意思了；李四被抓了，太有意思了，其实本质、性质没什么区别。比如谁去哪了，一堆人抗议，这不是闲的吗？哪次出行不抗议？知道就行了。 你心中要把知识归类：它对我算是新闻类的知识，还是认知类的知识，还是真相类的知识？一定学会分类，这样关注点、重点就不一样。别每个东西都听一遍，那你的人生有得……类似的事不是一直在重复吗？"},{"id":"ep6-k18","course":"ep6","number":18,"topic":"知识分类","title":"第二类：方向引领——应该往哪里走？","summary":"方向类知识解决做什么、不做什么，以及怎样少走弯路的问题。","points":["它承担取舍与方向的功能。","本课用经典与人生指导性内容说明这一分类。"],"start":199,"end":206,"quote":"第二，方向引领性的东西，决定的是：我应该往哪走？什么事应该做，什么事不应该做？说白了解决这个问题，让人少走错路、少走弯路。","quoteIndex":203,"related":["ep6-k11","ep6-k21","ep6-k19"],"section":"ep6-p199","sectionTitle":"五 方向引领性的知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 第二类：方向引领——应该往哪里走？ 方向类知识解决做什么、不做什么，以及怎样少走弯路的问题。 知识分类 它承担取舍与方向的功能。 本课用经典与人生指导性内容说明这一分类。 五 方向引领性的知识 五 方向引领性的知识 第二个，就是方向引领性的东西。咱们今天肯定讲不完了，真相讲完了。 方向引领的，还有心性、人性的东西讲一下，留一大串尾巴，咱下次讲。因为直播主要很随性，为了人类说明书，先演播一遍，看看大家有没有吐槽的地方、需要修正的地方。如果没有，我就可以成稿，进入录播，就是干这事，所以就是瞎讲。 应该往哪里走 第二，方向引领性的东西，决定的是：我应该往哪走？什么事应该做，什么事不应该做？说白了解决这个问题，让人少走错路、少走弯路。 凡是对人类有用的东西，都不多。那种乐的、垃圾剧，一堆一堆的，什么“霸道总裁爱上了绝经的我”，这些可多了，但真正拍点有用的，很少。 为什么这类东西少？很简单，谁没事指导你？指导你有什么好处？把你指导得那么聪明，以后怎么好领导你？整个人类社会更希望你们是好用的工具，而不是有思想、有认知、有独立人格和独立思维能力的人。这个世界更多希望你为他们服务，没有人愿意希望你过得更好，就是这样。 这类知识，比如佛经肯定算一个。佛经指导的是天道之上、轮回之上的认知，用无量劫的时间、轮回之上的角度，帮助大家规避世间的问题。"},{"id":"ep6-k19","course":"ep6","number":19,"topic":"智慧落地","title":"经典的方向与具体学习路径","summary":"讲者比较佛经、道经时，继续追问长期方向如何转化为可学习的过程。","points":["本节有关经典、高维和反馈的解释沿用讲者观点。","“结果性的智慧没有说明如何得到”，与前面课程的实操问题相连。"],"start":207,"end":215,"quote":"道经说了很多指导性的东西，但《道德经》也有很大问题：都是结果性的智慧，没说怎么得到，很麻烦。好，这是道经。","quoteIndex":215,"related":["ep6-k18","ep6-k20"],"section":"ep6-p199","sectionTitle":"五 方向引领性的知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 经典的方向与具体学习路径 讲者比较佛经、道经时，继续追问长期方向如何转化为可学习的过程。 智慧落地 本节有关经典、高维和反馈的解释沿用讲者观点。 “结果性的智慧没有说明如何得到”，与前面课程的实操问题相连。 五 方向引领性的知识 佛经与道德经 你应该怎么走、怎么做、怎么规避问题、怎么积累能量，才能更好地活着，这就是佛经要干的事。但是整个佛经的知识点，大概大几十个吧，也就这些，其他都是证明。 你看空色，像《大般若经》，基本都讲空色，六百多卷吧。实际上佛经上的空色也没讲多深，说白了，让你知道的是世界是假的。 因为当年要给一帮泥腿子讲。咱们现在知识文化都很高了，你想两千五百年前，印度和中国差不多，读书的人很少。想给连字都不认识的人讲清楚世界是假的，他很难相信。所以当年佛经更多的任务，是让别人相信世界是假的，很难。 而且那时候流行辩论，动不动辩论输了就以死明志。辩论输了可是要死人的，很严重，不像现在输了还能给你搅和几下。 《道德经》肯定也算是。道德经说的东西更真实一些，更接近人间实操；佛经说的更长远一些。但马上去修，不一定修出非常好的结果，因为需要积累。越是高维的东西，高维程度越高，正反馈速度越慢，很麻烦。 所以之前说过，修行有一个叫洛希极限。必须先盲修，修到一定程度，达到洛希极限，超出去了，就发现有感觉了，越修越爱修。 没到这个水平，怎么修都发现没什么用：怎么我蹦多高，还是被吸引到地球上？超过这个洛希极限，就没事了，终于不用再往下走了，这叫永不退转。 道经说了很多指导性的东西，但《道德经》也有很大问题：都是结果性的智慧，没说怎么得到，很麻烦。好，这是道经。"},{"id":"ep6-k20","course":"ep6","number":20,"topic":"学习路径","title":"人类说明书：提前了解人生考题","summary":"本课把真相系列的目标比作提前了解人生会遇到的考题。","points":["了解可能发生的事、阶段与选择。","在实际遇到之前先学习与练习，是讲者说明的课程用途。"],"start":216,"end":225,"quote":"既然一定要做人生的考题，就一定把考试点弄清楚：怎么考，什么时间考，都准备好，并且在这之前尽可能多练习一下，真考的时候也不慌。","quoteIndex":221,"related":["ep6-k19","ep1-k17"],"section":"ep6-p199","sectionTitle":"五 方向引领性的知识","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 人类说明书：提前了解人生考题 本课把真相系列的目标比作提前了解人生会遇到的考题。 学习路径 了解可能发生的事、阶段与选择。 在实际遇到之前先学习与练习，是讲者说明的课程用途。 五 方向引领性的知识 人类说明书与其他指导性内容 第三，我觉得真正愿意说结果性的书籍，我们的东西算一个，叫人类说明书，是指导性的认知。真正未来愿意仔仔细细指导大家，我们的人类说明书算一个。 尤其逆修觉者这一块，是天道思维、人道思维、人设思维，这三大思维，目前应该是截至现在的历史上，对人类很多东西描写得最细、指导性最强的文字性东西，也就是我们这个东西。 包括法界天机、灵魂觉者，说的是法界的东西，其实对你也很有帮助。 还有真相部分，就是一生里面，可能碰到什么东西，哪个阶段碰到什么问题，应该怎么选择比较好。这就是真相的目的，也是帮助大家过关。 既然一定要做人生的考题，就一定把考试点弄清楚：怎么考，什么时间考，都准备好，并且在这之前尽可能多练习一下，真考的时候也不慌。 我们的目标，是关心大家这一生过得到底幸福不幸福。我并不关心你给不给我钱，更关心你过得幸福不幸福，这就是我们的东西。 历史上还有没有人生指导性的东西？也有。比如圣贤，像孔子、孟子、王阳明、曾国藩，他们写的也有指导性，但其实指导了几个点。 比如孔子的东西，指导性还多一些：什么是君子，什么是小人，应该怎么跟长辈交流，怎么跟友人交流。他定义的比较多，也算指导性的。再说有指导性的，就很少了。 包括弘一法师，一些哲学家，说的东西也有指导性。但说白了，一辈子可能也就研究出那么几个点，听听也有作用，你说能改变什么？我觉得太小。这就是之前讲的，叫星星之火难以燎原。"},{"id":"ep6-k21","course":"ep6","number":21,"topic":"人性与心性","title":"第三类：从触发、取舍到行动","summary":"本课的人性与心性讨论，围绕事件如何触发需要、想法、选择与行动展开。","points":["这件事对我意味着什么，唤起了哪些感受与欲望？","哪些想法会成为行动，哪些原则和底线会约束行动？"],"start":226,"end":232,"quote":"我们说一下人性，就是遇到事情之后，产生怎样的心情、感受、想法、取舍、决定和行为。一件事触动了人的什么需要？怎么理解这件事？产生哪些互相竞争的想法？哪些最后变成行动，哪些只是想想？会因为什么事情停下来，也会因为什么事情突破底线、破例？这就是人性要解决的东西。","quoteIndex":230,"related":["ep6-k18","ep7-k02","ep6-k22"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 第三类：从触发、取舍到行动 本课的人性与心性讨论，围绕事件如何触发需要、想法、选择与行动展开。 人性与心性 这件事对我意味着什么，唤起了哪些感受与欲望？ 哪些想法会成为行动，哪些原则和底线会约束行动？ 六 人性与心性 六 人性与心性 人性与心性研究什么 第三个需要了解的知识，叫心性和人性的东西，应该是人性和心性。什么是人性？很简单，解决的是人类遇到具体事情之后，应该怎么做。说细一点，具体事情中，怎么被触发、怎么形成想法、怎么走向行动，又受到哪些原则和底线约束，这些是人性。 心性是什么？心性跟人性其实差不多。人性研究的是人类的问题；心性研究的是你具体碰到某些事的时候，会怎么被触发，形成什么想法，有怎样的行动，又受哪些原则和底线约束，这是心性问题。 我们说一下人性，就是遇到事情之后，产生怎样的心情、感受、想法、取舍、决定和行为。一件事触动了人的什么需要？怎么理解这件事？产生哪些互相竞争的想法？哪些最后变成行动，哪些只是想想？会因为什么事情停下来，也会因为什么事情突破底线、破例？这就是人性要解决的东西。 其过程就是：遇到事情了，这件事对我意味着什么？我的感受与欲望被唤起了什么？出现什么不同想法？怎么判断与取舍？ 行动或者不行动，以及面对后果应该如何做，这就是人性的东西。"},{"id":"ep6-k22","course":"ep6","number":22,"topic":"人性与心性","title":"危险与利益：同样的需要，不同的边界","summary":"讲者分别以安全受威胁和机会出现为例，区分是否越界的反应。","points":["自我保护可以表现为求助、防护，也可能被扭曲为转嫁伤害。","面对利益，可以正当争取，也可能突破底线。"],"start":233,"end":238,"quote":"再举一个例子，利益和机会出现，比如有金钱、职位、资源、名气的时候，最重要的是想得到、怕错过、怕吃亏。不越界的行为，就是正当争取、提高能力、协商交换；越界的，欺骗、侵占、隐瞒重要事实，类似的事等等。","quoteIndex":237,"related":["ep
