"人品不用多说，守不守信用，撒谎、甩锅、背刺、忘恩负义、见利忘义、底线太低，这些都是人品问题。","quoteIndex":144,"related":["ep6-k24","ep9-k19","ep9-k17"],"section":"ep9-p140","sectionTitle":"六 人与人之间的问题","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 合作中的人品与稳定性 本节把信用、责任、底线与压力下的表现列为识人和合作的观察点。 人性与心性 看是否守信，以及出现问题时怎样承担。 也看利益、压力与情绪变化时，行为是否稳定。 六 人与人之间的问题 六 人与人之间的问题 人品稳定性与边界感 最后一部分，人与人之间的问题。要懂人情世故，了解人性、心性，在人品、稳定性、边界感、一致性、人的欲望弱点和人情世故上，都做得到位。 毕竟是人的世界，要学会跟人打交道，不能只跟机器。要很好地识人、用人、防人、处人。 人品不用多说，守不守信用，撒谎、甩锅、背刺、忘恩负义、见利忘义、底线太低，这些都是人品问题。 稳定性很重要。情绪波动很大，不稳定，不能用；上升空间很低，不能用；压力下一做事就变形，不能用；利益面前容易翻脸，不要用。"},{"id":"ep9-k19","course":"ep9","number":19,"topic":"家庭与沟通","title":"边界与分寸：日常相处的具体表现","summary":"本课用隐私、公私界限、使用他人物品与表达感谢等细节说明边界。","points":["尊重别人可以从小事上体现。","同样需要了解自己和他人的欲望与弱点。"],"start":146,"end":148,"quote":"边界感，看会不会碰不该碰的东西，打探隐私、混淆公私，能不能守住分寸。欲望、弱点，像钱、色、权、名。","quoteIndex":146,"related":["ep9-k18","ep9-k20"],"section":"ep9-p140","sectionTitle":"六 人与人之间的问题","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 边界与分寸：日常相处的具体表现 本课用隐私、公私界限、使用他人物品与表达感谢等细节说明边界。 家庭与沟通 尊重别人可以从小事上体现。 同样需要了解自己和他人的欲望与弱点。 六 人与人之间的问题 边界感，看会不会碰不该碰的东西，打探隐私、混淆公私，能不能守住分寸。欲望、弱点，像钱、色、权、名。 还有赞美、安全感、控制欲、虚荣心、报复心。人间的东西，以后讲人道思维会重点讲。 人情世故，比如吃饭吧唧嘴，到别人家到处乱溜达，跟自己家一样，没大没小；未经同意拿别人东西；该说话不会说，人家帮了你，连谢谢也不说。"},{"id":"ep9-k20","course":"ep9","number":20,"topic":"机缘与贵人","title":"请人指点：看见对方投入的时间","summary":"讲者通过学生请教前辈的饭局，讨论求助中的感谢与付出。","points":["先辨明自己是在求教，还是普通礼尚往来。","本节着重提醒不要忽略他人为帮助自己投入的时间。"],"start":149,"end":157,"quote":"我说没错，但有个问题。如果别人求到你，礼尚往来没问题。现在是你求别人，取经、处关系，得先付出。不能到人家那儿取经，还要人家请你，这就不对了。","quoteIndex":153,"related":["ep8-k08","ep9-k19"],"section":"ep9-p140","sectionTitle":"六 人与人之间的问题","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 请人指点：看见对方投入的时间 讲者通过学生请教前辈的饭局，讨论求助中的感谢与付出。 机缘与贵人 先辨明自己是在求教，还是普通礼尚往来。 本节着重提醒不要忽略他人为帮助自己投入的时间。 六 人与人之间的问题 好多学生普通家庭出身，家长没教过这些。再拿一个可爱的学生举例。当时在泰国，好多师兄师姐跟他吃饭，他从来没掏过钱。 请人指点与先付出 我说：“师兄师姐肯定看我面子才带你，你太小了。抽一天时间跟你吃饭已经不错，怎么次次不掏钱，都让他们掏？到人家那儿取经，怎么能不掏钱？” 他说：“我妈说了，别人请你，你再回请。” 我说没错，但有个问题。如果别人求到你，礼尚往来没问题。现在是你求别人，取经、处关系，得先付出。不能到人家那儿取经，还要人家请你，这就不对了。 其实就是小孩子，父母也是普通工薪阶层，没教过。 我当年不也这样？人家在桌上快打起来，我还吃得挺高兴。后来指着鼻子骂我们“silly boy”，坏了，英文也没听懂。后来才知道，是他们闹不和、快打起来了。 我哪听得懂话里的讥讽？就觉得饭好吃，赶紧吃。还问：“从哪句话听出要打架、闹问题？看着都笑得挺好，也没互相骂。”人家怎么教，没法教，说长大就明白了。 所以人情世故很重要，我在这方面也不行。"},{"id":"ep9-k21","course":"ep9","number":21,"topic":"学习与执行","title":"反馈修正：发现、承认，再改变","summary":"本课结尾再次强调反馈速度和修正速度。","points":["愿意复盘，接收他人指出的问题。","承认问题之后，还要落实修改。"],"start":158,"end":161,"quote":"反馈、修正速度要足够快。别不复盘，别人指出问题拒不承认，承认了又拒不修正，那就那样了。就是这些事。","quoteIndex":161,"related":["ep9-k03","ep10-k26"],"section":"ep9-p158","sectionTitle":"七 反馈修正与本课结束","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 反馈修正：发现、承认，再改变 本课结尾再次强调反馈速度和修正速度。 学习与执行 愿意复盘，接收他人指出的问题。 承认问题之后，还要落实修改。 七 反馈修正与本课结束 七 反馈修正与本课结束 反馈和修正的速度要足够快 最后一项，做事一定要反馈修正，这是最大一点。前面所有东西可以没有，但修正速度、反馈速度足够快，就没问题，像导弹一样。要去这边，一开始往那边飞，没关系，发现错了，扭过来就行。 反馈、修正速度要足够快。别不复盘，别人指出问题拒不承认，承认了又拒不修正，那就那样了。就是这些事。"},{"id":"ep9-k22","course":"ep9","number":22,"topic":"成事条件","title":"成事三课的收束：持续检查各环节","summary":"第九课将第七、第八课与本课的内容合在一起，说明成事需要多方面条件配合。","points":["一时被机会推动，与长期维持，是不同问题。","讲者明确表示，这份框架还没有列尽所有细节。"],"start":162,"end":165,"quote":"任何一点出问题，可能被气运、机缘推着往前走一段，但因为不圆满，没办法一直持续。所以世界上很少有人能跨越经济周期，一直富贵，就是条件里有缺，而且我列得还不全。","quoteIndex":163,"related":["ep7-k14"],"section":"ep9-p158","sectionTitle":"七 反馈修正与本课结束","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 成事三课的收束：持续检查各环节 第九课将第七、第八课与本课的内容合在一起，说明成事需要多方面条件配合。 成事条件 一时被机会推动，与长期维持，是不同问题。 讲者明确表示，这份框架还没有列尽所有细节。 七 反馈修正与本课结束 今天速度快些，都是人间法上的东西，没太多新鲜的，简单捋一下。总算把成事讲完了。虽然粗略，也足足讲了快三期，想成一件事得多费劲？方方面面做好，才能真成就一番事业。 任何一点出问题，可能被气运、机缘推着往前走一段，但因为不圆满，没办法一直持续。所以世界上很少有人能跨越经济周期，一直富贵，就是条件里有缺，而且我列得还不全。 记得当时做法界指标，选总经理的指标大概两三百项，看看那些东西，任何一项解决不了，企业都做不下去，就是这样。 今天不是什么新鲜课，把事说完，大家知道就行。等周四正式讲智慧，很重要的一节课。周四见，明天是小啤酒时间，拜拜。别忘点赞、收藏、分享。"},{"id":"ep10-k01","course":"ep10","number":1,"topic":"课程导读","title":"第十课：智慧与领悟的“悟”","summary":"本课比较聪明与智慧，提出定义，再讨论提升路径与日常判断方法。","points":["直播内容仍处于讲述、回看与继续校正的过程。","最后给出十二条初步练习方向。"],"start":30,"end":38,"quote":"今天讲一个智慧，一个领悟的悟。这个对传统国学的冲击可能比较大，还得数落他们一顿，咱们才能继续。没办法，前人存在的意义就是让我们踩在脚下；后人进步的根基，也是把我们踩在脚下，都一样。","quoteIndex":38,"related":["ep9-k01"],"section":"ep10-p30","sectionTitle":"一 从聪明说到智慧","searchText":"问道十 智慧和悟 第10课 问道10 第十课：智慧与领悟的“悟” 本课比较聪明与智慧，提出定义，再讨论提升路径与日常判断方法。 课程导读 直播内容仍处于讲述、回看与继续校正的过程。 最后给出十二条初步练习方向。 一 从聪明说到智慧 一 从聪明说到智慧 今天讲智慧，也讲领悟的悟 看到的扣一啊。已经有人扣一了，看来网速还不错。大家晚上好，正好八点。今天是大课，值得反复听。前几期都是讲完意义思维之后，附带的一些小课。 今天美颜给得多。我最近经常看直播里的自己，就觉得自己长得帅，后来一照镜子，好像不是这样。脱了美颜都不行啊，跟气色没关系。咱们等一分钟，马上开始。今天一边憋智慧的文章，一边刷抖音。 好，大家好，今天咱们就开始吧，早点完事。 今天开始讲智慧，别忘了点赞、收藏、分享。我估计今天甭管讲到几点，都得把智慧讲完。今天是周四，下礼拜一讲修行，之后休息十天，我要去闭关。回来继续讲，到十二月份之前，应该会比较密集地输出。 输出完了，咱们休息一段时间，一周安排一次，讲点真相，我再把已经讲过的东西做成录播。从《问道》三到现在，这些都还是直播。我大号给我传东西，属于先撒上一个网，放十天半个月再回来看，可能会有不一样的感受。 所以录播会比直播更精细一些。直播嘛，大姑娘上轿头一回，能凑合说出来就行，大家也别太当回事。 今天讲一个智慧，一个领悟的悟。这个对传统国学的冲击可能比较大，还得数落他们一顿，咱们才能继续。没办法，前人存在的意义就是让我们踩在脚下；后人进步的根基，也是把我们踩在脚下，都一样。"},{"id":"ep10-k02","course":"ep10","number":2,"topic":"智慧与悟","title":"从既有定义出发：智慧只是算得快吗？","summary":"讲者回顾词典与传统解释，继续追问智慧与聪明的区别。","points":["本节以大脑算力与长远取舍作初步比较。","后文会进一步把认知、思维和行为连到一起。"],"start":39,"end":49,"quote":"听完这些解释，是不是反而更郁闷了？咱们用普通人的说法粗略总结一下：聪明人能快速计算得失，有智慧的人知道，有些得失不能只计算数字。聪明是大脑的算力，智慧是对取舍、分寸和长远后果的判断。","quoteIndex":45,"related":["ep10-k03"],"section":"ep10-p30","sectionTitle":"一 从聪明说到智慧","searchText":"问道十 智慧和悟 第10课 问道10 从既有定义出发：智慧只是算得快吗？ 讲者回顾词典与传统解释，继续追问智慧与聪明的区别。 智慧与悟 本节以大脑算力与长远取舍作初步比较。 后文会进一步把认知、思维和行为连到一起。 一 从聪明说到智慧 先看看现有的解释 咱们先看看传统上怎么定义智慧。我找的《现代汉语词典》第七版，说的是辨析、判断、发明创造的能力。用大白话讲，就是看懂事物本质、分清对错，还能作出合适选择、解决难题的能力。你看，这就是词典给出的东西。 再看《辞海》，说的是对事物能认知、辨析、判断、处理和发明创造的能力。这样一说，智慧跟聪明有什么区别呢？ 中国传统哲学的说法，是智慧不单纯是掌握知识，而是理解事物运行的规律，懂取舍、分寸，明善恶，知行合一。至少又前进了一点。儒家的说法是明是非、守仁义，遇事中庸有度；道家的说法是洞悉万物本质，顺势而为，不逞强。 可这些只是智慧的某一种表现，怎么能代表智慧本身呢？就像我的耳朵长得还可以，那只是我的一个表象，不能完全代表我。 当代心理学又给了五个要素：掌握生活事实性的知识；掌握处事策略性的知识；懂得从多角度考虑事情；认识到世事的不确定性和可变性；能权衡不同价值，兼顾多方利益。 听完这些解释，是不是反而更郁闷了？咱们用普通人的说法粗略总结一下：聪明人能快速计算得失，有智慧的人知道，有些得失不能只计算数字。聪明是大脑的算力，智慧是对取舍、分寸和长远后果的判断。 这个就有点接近了。网上找不出特别合适的定义，怎么办？看看生活里耳熟能详的人，哪些算聪明，哪些算有智慧。 先请第一位，牛顿。他在微积分、光学、引力方面有重要贡献。你可以说他有智慧，也可以说他很聪明，对吧？ 第二位，冯·诺依曼，流体力学、博弈论、统计学，都很厉害。第三位，高斯，曾经是我心目中的神。据说他眼睛都睁不开了，听儿子说了一遍题，闭着眼睛在心里推了七八十步，就把题解出来了。咱们当年学数学、物理，学了多少高斯定理，偶像啊。 还有爱因斯坦，E＝mc²，这不用多说。商业上，乔布斯也绝对是天才。"},{"id":"ep10-k03","course":"ep10","number":3,"topic":"智慧与悟","title":"一时成功与跨越周期","summary":"本课通过历史和商业人物案例，把观察尺度从一次成功拉长到长期稳定。","points":["某一领域的突出能力，不直接等于所有方面的长远判断。","相关人物评价保留为讲者当次试讲的观察。"],"start":50,"end":62,"quote":"科学成就、商业成就，可能解决了人类的某个问题。比如最近说北大有个小女孩，解决了一个世界数学难题，你可以说她很聪明，却不能只凭这个说她有智慧。聪明更多是解决眼前或某一阶段的问题，智慧更多是看长久。","quoteIndex":62,"related":["ep10-k02","ep10-k04"],"section":"ep10-p30","sectionTitle":"一 从聪明说到智慧","searchText":"问道十 智慧和悟 第10课 问道10 一时成功与跨越周期 本课通过历史和商业人物案例，把观察尺度从一次成功拉长到长期稳定。 智慧与悟 某一领域的突出能力，不直接等于所有方面的长远判断。 相关人物评价保留为讲者当次试讲的观察。 一 从聪明说到智慧 一时富贵与跨越周期 但他们到底算不算有智慧？不好说，至少聪明肯定是聪明。马斯克也是，人家脑袋好使。我连大学都考不上，人家读国际一流大学，so easy，咱这脑子肯定不行。 再换一组人。国美的黄光裕，苏宁的张近东，恒大的许老板，乐视的贾老板，是聪明还是智慧？有点感觉了吧？再说几位：巴菲特、查理·芒格、段永平、稻盛和夫。 还有李嘉诚。我记得二〇一五年左右，他大量清理国内资产的时候，有人骂他老糊涂了。那时候房价还在涨，好像一直涨到二〇一八年。他可能从二〇一二、二〇一三年就开始逐步卖了。现在回头看十多年前这段，确实厉害。 因为他的盘子太大，不提前卖，后面就卖不出去。你家卖一套房，看清趋势，二〇一八年再卖可能还来得及；他那个资产量，到那时就不好使了。所以房价还往上冲，他已经提前出手。 点完这些人，再感觉一下，什么是聪明，什么是智慧？所有定义都要为人服务。你心里明明有感觉，知道哪些人聪明、哪些人有智慧，却找不到能对应生活的定义，那就有问题。 像国美、恒大、乐视这些老板，资产做到几个亿、几十亿、上百亿，甚至上千亿，都没问题。但可能只是一时富贵。我管这叫枭雄的性格、枭雄的气运，很聪明，大势托着的时候，一下冲起来了。 乔布斯也是这样。马斯克还没看到后面，他现在仍在势头上，有点像一几年时的马云，拿放大镜、望远镜都找不着对手。这时候还不能下结论。从目前看，更多还是势头上的聪明选择，长远布局最后怎么样，还得看。 不过，人家的布局也很厉害。我们说巴菲特、芒格、段永平、稻盛和夫、李嘉诚，看的是更长时间里，能不能始终保持正确。这里很重要的一点，叫跨越经济周期。 只能抓住一段大势，最多是一个枭雄。当然，咱们想成为枭雄都很难。但每个时代、每一年都有起来的，也有倒下的。能跨过四十年、五十年，还保持增长、保持稳定的人，整个世界也没几个。 有人说司马懿。司马懿肯定算啊。 他至少到死的时候几乎没怎么败过，那个隐忍很厉害。了解完这些人，古人总结得不合适，咱们就自己总结。 科学成就、商业成就，可能解决了人类的某个问题。比如最近说北大有个小女孩，解决了一个世界数学难题，你可以说她很聪明，却不能只凭这个说她有智慧。聪明更多是解决眼前或某一阶段的问题，智慧更多是看长久。"},{"id":"ep10-k04","course":"ep10","number":4,"topic":"智慧与悟","title":"先问这个问题值不值得解决","summary":"本课把聪明侧重的解题能力，与智慧侧重的长远判断区分。","points":["这个问题有必要解决吗，解决方向是否合适？","即使眼前有效，更长时间里会怎样？"],"start":63,"end":72,"quote":"所以，聪明和智慧的区别，不是谁反应快、谁反应慢，也不是谁更会算计，而是重点不同。聪明主要看理解、分析、解决问题的能力有多强；智慧更多看认知和思维，能不能引导人作出正确、有利、经得住长远考验的判断、取舍和行动。","quoteIndex":64,"related":["ep2-k13","ep10-k05","ep10-k03"],"section":"ep10-p30","sectionTitle":"一 从聪明说到智慧","searchText":"问道十 智慧和悟 第10课 问道10 先问这个问题值不值得解决 本课把聪明侧重的解题能力，与智慧侧重的长远判断区分。 智慧与悟 这个问题有必要解决吗，解决方向是否合适？ 即使眼前有效，更长时间里会怎样？ 一 从聪明说到智慧 眼前的问题，要不要解决 所以，聪明和智慧的区别，不是谁反应快、谁反应慢，也不是谁更会算计，而是重点不同。聪明主要看理解、分析、解决问题的能力有多强；智慧更多看认知和思维，能不能引导人作出正确、有利、经得住长远考验的判断、取舍和行动。 大白话就是，聪明看你的CPU快不快，几核的，几纳米的，能不能解决现阶段的问题。智慧有时候甚至不解决眼前的问题，它只关心你这个想法，在这个方向上能不能长久正确。 甚至还要先问：这个问题有必要解决吗？有意义吗？你解决得对吗？更长时间里还对吗？这才是智慧考虑的事情。 比如我为什么只算小卦？几百块、千八百块的小卦，担的因果少。圈里有人想包下来，给一百万、几百万，家里有事就经常来问，行不行？我坚决不同意。看风水也只看小风水，越是重型家族的大风水，咱越不碰。 我可以帮你几年，但人有气运，谁能一直帮着？以前香港那些风水大师，现在你让他们靠风水把家族的生意重新逆转一下，试试看。在我的判断里，整个地区走下坡运了，你光靠这个能拦得住吗？ 原来地区向上，家族也向上，你帮的是把前进路上的坑洼填平，让人走得更好。等人家走下坡路，你再拦一下试试。 家族从B运走到C运，这时候接风水，你觉得自己努力了，还替他踩了一脚刹车；人家却觉得，自打你动了风水，我家就越来越差。最后还是你不好使。 人家投了几个亿，给你几百万风水费，最后几个亿亏了，你把风水费退回去就完了吗？你得承受更大的东西。所以我看到的是，更长远的结果不好，就不碰。哪怕能先帮他几年，也不接。 短期内想办法弄上去，是聪明；长期关系早晚出事，自己要倒霉，那为什么还要做？这就是不能只看短期。"},{"id":"ep10-k05","course":"ep10","number":5,"topic":"智慧与悟","title":"时间尺度改变，取舍也会改变","summary":"讲者用大智若愚、退让与长期信任等案例，讨论眼前得失和长久目标。","points":["判断一次选择时，把影响延伸到家人、后续阶段与更远未来。","本节的轮回尺度属于讲者使用的宗教前提。"],"start":73,"end":88,"quote":"时间跨度足够长，目标不再以这一世为中心，你的目的、方式方法都会变，甚至出现大智若愚：放弃当前的利益，去保证长久的利益。","quoteIndex":80,"related":["ep4-k10","ep10-k04","ep10-k06"],"section":"ep10-p73","sectionTitle":"二 时间尺度变了，取舍就变了","searchText":"问道十 智慧和悟 第10课 问道10 时间尺度改变，取舍也会改变 讲者用大智若愚、退让与长期信任等案例，讨论眼前得失和长久目标。 智慧与悟 判断一次选择时，把影响延伸到家人、后续阶段与更远未来。 本节的轮回尺度属于讲者使用的宗教前提。 二 时间尺度变了，取舍就变了 二 时间尺度变了，取舍就变了 大智若愚是怎么来的 聪明的商人能抓住机会，智慧的商人抓的是长久稳定的机会。这是在人间层面讲聪明和智慧。有没有更高位面的智慧？咱们引用佛祖、道祖的说法，比如“宁损性命，终不作恶”，比如“冤冤相报何时了”。 在人间，短时间有利和长时间有利，比较容易判断。我拿许老板和巴菲特作比较：一个挣得很多，二十年左右就出了事，我直播里说是“踩缝纫机去了”；另一个六七十年还在稳步增长。按这个尺度，长久的结果比较容易看出来。 可把时间尺度再拉长，很多判断就变了。“宁损性命，终不作恶”，怎么理解？连这一世的生命都愿意放弃，还在乎什么？他要保证的是更长时间里的利益和正确性。 “冤冤相报何时了”，佛教喜欢讲这个。我看西方很多电影、电视剧，常见的是以眼还眼、以牙还牙：被欺负了，先忍，忍不了就报官；正义得不到伸张，最后自己干，一定要让恶人得到报应。但佛祖看的，是更长远的未来。 在轮回这个说法里，你甭管谁对谁错，最后互相咬在一起，这一世你咬我，下一世我咬你，两个笨蛋碰到一块，叫众生恒定向下。所以才说冤冤相报何时了。 时间跨度足够长，目标不再以这一世为中心，你的目的、方式方法都会变，甚至出现大智若愚：放弃当前的利益，去保证长久的利益。 历史上也有这种例子。我想到明朝的徐阶，跟严嵩周旋，能隐忍那么多年，一有机会就把严嵩父子弄下去了。大家以为他该长期做首辅了吧，他却当了几年，扶起下一代，就回家了。下一代是谁？我记得是张居正。据说徐阶七十多岁才去世。 在古代，七十多岁已经很厉害。我看这个故事，注意的是他有接班人，能平安落地。再看张居正，很聪明，我还记得有说法，说要不是有人从中作梗，他有机会连中三元。可最后整个家族出了事。 你作的选择，能不能让自己、政策、家人、后人一直有利？不能只看当时没人动得了你，还得想十年、三十年、五十年之后，甚至你这一辈子结束之后。 你能得到什么，家族能得到什么？智慧主要考虑的就是更长远的时间。比如张良，帮刘邦打完天下，一拍屁股走了。还有范蠡，帮越王勾践之后也走了，走之前还劝朋友赶紧走。舍不得，没办法，最后还是被勾践弄死了。 再看胖东来。一个做超市的，在没有名气的时候，要建立信任是极难的。但这种东西，你坚持到一定程度，爆发出来的力量，别人很难对抗。 我举个“315曝光”的说法，就算你去曝光，人家也可能不搭理，因为当地已经建立了那种信任。可这个信任，没有几十年的痛苦期，很难建立起来。以后我们还会讲“一切都是自己的错误”。 还有“他人即世界”。你说，人不为己，天诛地灭，为什么出错了，却先想是不是自己做错了？就算别人错了，也想，我为什么会招来这个错误？为什么跟一个容易出错的人接触？ 看着挺蠢，好像什么都往自己身上找。但你真这么想，还坚持下去，在我讲的整个轮回尺度里，上升会很快。很多东西就是大智若愚，眼前看着蠢，长远却很正确。《道德经》里的不争而得、无为而无不为，还有“一曰慈，二曰俭，三曰不敢为天下先”，都有这个意思。"},{"id":"ep10-k06","course":"ep10","number":6,"topic":"意义思维","title":"拥有智慧，是为了解决什么问题？","summary":"本课先用意义思维明确目的，再给智慧下定义。","points":["讲者希望判断与行动在更长时间里保持正确且有利。","短期满足之后的后果，同样进入价值衡量。"],"start":89,"end":107,"quote":"好，回到智慧。目的已经出来了：在更长的时间里，让自己处于正确且有利的状态。多长？看你的本事。目的明确，就可以给定义了。","quoteIndex":107,"related":["ep5-k24","ep10-k05","ep10-k07"],"section":"ep10-p73","sectionTitle":"二 时间尺度变了，取舍就变了","searchText":"问道十 智慧和悟 第10课 问道10 拥有智慧，是为了解决什么问题？ 本课先用意义思维明确目的，再给智慧下定义。 意义思维 讲者希望判断与行动在更长时间里保持正确且有利。 短期满足之后的后果，同样进入价值衡量。 二 时间尺度变了，取舍就变了 先问拥有智慧是为了什么 说了这么多，聪明和智慧的区别大概清楚了，能不能具体定义一下？定义之前，先用意义法则问：我拥有智慧，目的是什么？它能解决什么问题？ 别什么都觉得好，这个也要，那个也要，要完了却不知道有什么用。别读了半天《心经》，除了心静一点，什么都没弄明白；读了半天《金刚经》，只说这有智慧，却说不出它能解决生活里的什么问题。先问目的，这才重要。 所以我们先不急着下定义，先说拥有智慧，能解决生命中的什么事。 它可以让我在更长久的时间里，处理问题、做事情，一直处于正确且有利的状态。能保持多久？看你的本事。智慧越高，能顾到的时间就越长。 如果连聪明都没有，可能连一瞬间有利都很难做到。比如跟人吵架，对方骂你，你生气，揍了他一下，出了口气，爽了。这个当下，你觉得自己“正确且有利”。可打完呢？人家打110，要赔钱，未必占理；如果验出轻伤，还可能牵涉刑事责任。 接下来考公、考编、工作，都可能受影响。为了一时痛快，把更长久的生活弄出问题。骗人也是，短期获利，时间越长，被发现的可能性越大。早晚被发现，名声就臭了。 企业也一样，急功近利、做假账、乱忽悠、乱承诺，早晚要出问题。现在看起来有利，长期呢？很麻烦。 职业经理人要靠业绩，有些行为就是短期促销，像给企业打强心针。 经济上涨时，大家都往上走，这种办法比较好使；一到大萧条，我看更容易扛住的往往是家族企业，因为它能接受一段时间的波动。我记得李嘉诚的儿子有次投资亏了，就一直拿着，等了十多年，地产挣钱了再卖。换职业经理人，你可能不会给他这么久。 再看明星，有飞机、游艇、别墅，甚至私人岛，异性追求也多。从人生看，很成功，简直是现代人的典范。可要从死后、轮回的角度看，在我这套说法里，这是不是大量燃烧福报呢？ 辛辛苦苦攒的福报，拿来在这么个地方充大爷。从另一个尺度看，就会有另一种判断。王朝、家族也一样。比如朱元璋，从乞丐一路打到皇帝。 中间经历多少九死一生。他想让子孙后代享福，让全国人都为这个家族服务，能不能做到？短时间可以，二百多年。可二百多年之后呢？按我讲的因果，整条家族线都要承担这些东西，后面可能很难再翻上来。 如果我有这个机会，我会学华盛顿。拼，可以；开国之功、功德、福报，可以拿。但别把一切都归自己家。你能拿住多久？ 权力争斗大的地方，九死一生终于上去了，又得为了保住位置继续斗争，折腾、抓人，想提前退休都不敢。 中国皇帝里，能主动说退休的有几个？乾隆当太上皇，说不想超过爷爷的在位时间，算一个。很多人都等到死，因为中间怕有变数。争位置已经很累，为了保位置，又得折腾一堆。 最后没有哪个人、哪个家族能永远保住。一辈子保住了，家族延续几十年、上百年、二百多年，很厉害，可最后仍然是一场空。那就得算，为了这二百年的东西，付出多大代价，值不值？ 尺度不一样，值不值就不一样。搁我，我觉得开国之功很好，但别硬跟家族绑在一起。家里人真有能力，大家竞选选上了，你就上；没能力，就别坐那个位置。做共和制，对自己和整个家族的影响，在我看来更小。 好，回到智慧。目的已经出来了：在更长的时间里，让自己处于正确且有利的状态。多长？看你的本事。目的明确，就可以给定义了。"},{"id":"ep10-k07","course":"ep10","number":7,"topic":"智慧与悟","title":"本课的智慧定义：认知、思维与行为","summary":"本课将智慧界定为推动自己或事态长期走向正确且可持续有利状态的认知、思维和行为。","points":["长远结果是目的，认知、思维与行为是实现方式。","把行为纳入定义，是因为想对了之后还要做得出来。"],"start":108,"end":113,"quote":"在更长的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维和行为，我们称为智慧。","quoteIndex":110,"related":["ep10-k06","ep1-k04","ep10-k08"],"section":"ep10-p108","sectionTitle":"三 智慧的定义与定义的边界","searchText":"问道十 智慧和悟 第10课 问道10 本课的智慧定义：认知、思维与行为 本课将智慧界定为推动自己或事态长期走向正确且可持续有利状态的认知、思维和行为。 智慧与悟 长远结果是目的，认知、思维与行为是实现方式。 把行为纳入定义，是因为想对了之后还要做得出来。 三 智慧的定义与定义的边界 三 智慧的定义与定义的边界 为什么认知、思维之后还要加行为 在更长的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维和行为，我们称为智慧。 前面是目的，后面是实现这个目的所用的东西。为什么除了认知、思维，还要加行为？因为想对了，你还得保证行为一直有效。 很多人知道减肥好，可我饿呀，最后还是做不到。你知道方法，却没法达成行为，那对你还不能算智慧。所以要把行为加上。 换一种说法：以长远视角，依靠认知、思维、行动，推动事态向正确且持续有利的方向发展。这也可以作为定义。你愿意用哪一种都行，只要说得清楚。"},{"id":"ep10-k08","course":"ep10","number":8,"topic":"智慧与悟","title":"终极智慧与圆满智慧：时间与范围","summary":"在本课的宗教框架中，终极智慧把时间尺度放到无量劫，圆满智慧进一步强调全面性。","points":["终极智慧可以指一个方面的长远正确。","圆满智慧则要求各种事情都能达到相应状态。"],"start":114,"end":117,"quote":"终极智慧和圆满智慧有什么区别？比如我在养生上有一套办法，按照它做，在无量劫里身体都好，这是养生方面的终极智慧。圆满智慧，则是在全方面、各种各样的事情上，都能在无量劫的尺度里做到正确且持续有利。","quoteIndex":116,"related":["ep10-k07","ep10-k09"],"section":"ep10-p108","sectionTitle":"三 智慧的定义与定义的边界","searchText":"问道十 智慧和悟 第10课 问道10 终极智慧与圆满智慧：时间与范围 在本课的宗教框架中，终极智慧把时间尺度放到无量劫，圆满智慧进一步强调全面性。 智慧与悟 终极智慧可以指一个方面的长远正确。 圆满智慧则要求各种事情都能达到相应状态。 三 智慧的定义与定义的边界 终极智慧、圆满智慧与绝对正确 什么叫终极智慧？就是在无量劫的时间维度里，让自己或事态走向正确且可持续有利的状态，所运用的认知、思维与行为。这里的时间就明确了，是无量劫。 终极智慧和圆满智慧有什么区别？比如我在养生上有一套办法，按照它做，在无量劫里身体都好，这是养生方面的终极智慧。圆满智慧，则是在全方面、各种各样的事情上，都能在无量劫的尺度里做到正确且持续有利。 为什么用无量劫？上面还有没有别的时间维度？可能有，但不在我们的研究范围。我们学的东西，以佛教能发现的最高世界维度为主。我认为上面还可能有别的，但出了轮回，跟这里讨论的事就没关系了。我们先关心轮回之内，怎么让自己更厉害。轮回之外，不知道。"},{"id":"ep10-k09","course":"ep10","number":9,"topic":"智慧与悟","title":"“绝对正确”也要说明讨论范围","summary":"讲者进一步讨论不同时间、认知层次下的判断边界。","points":["本课使用“绝对正确”时，附带所讨论的范围。","超出当前可接触、可验证范围的问题，暂不作为本课的研究目标。"],"start":118,"end":122,"quote":"所以我们说有绝对正确，一定要加括号：有范围。在轮回、无量劫这个范围，在佛祖、道祖的认知体系下，按那些方法走，几乎不会出问题。我们在这个意义上称它为绝对正确。","quoteIndex":122,"related":["ep10-k08","ep10-k10"],"section":"ep10-p108","sectionTitle":"三 智慧的定义与定义的边界","searchText":"问道十 智慧和悟 第10课 问道10 “绝对正确”也要说明讨论范围 讲者进一步讨论不同时间、认知层次下的判断边界。 智慧与悟 本课使用“绝对正确”时，附带所讨论的范围。 超出当前可接触、可验证范围的问题，暂不作为本课的研究目标。 三 智慧的定义与定义的边界 这又带出一个东西，叫绝对正确。有绝对正确吗？不好说。在人间，学知识、挣钱、过好生活，很多商业行为看起来正确；换到天道角度，可能只是消耗福报，没什么意义。再到无量劫，又可能是另一个态度。 无量劫之上呢？能保证佛祖看到的就一定正确吗？也不一定。但现在你能接触的最大老大就是佛祖，人家愿意跟你说点东西。你要找鸿钧老祖、菩提老祖，影儿都见不到。 所以你现在能得到的认知上限，大概就是这个范围。佛祖在他所认知的空间、佛界和轮回所囊括的范围里，认为这套办法最正确，才会有无上正等正觉这样的说法。出了这个范围还对不对？不知道，就先不用想。 意义思维最大的意义，就是跟你没关系、不能在你身上起作用、又无法验证的那些理论可能性，先放一边。空空、无无、无无无，关你什么事？这样心就放宽了。 所以我们说有绝对正确，一定要加括号：有范围。在轮回、无量劫这个范围，在佛祖、道祖的认知体系下，按那些方法走，几乎不会出问题。我们在这个意义上称它为绝对正确。"},{"id":"ep10-k10","course":"ep10","number":10,"topic":"智慧落地","title":"描述智慧的表现，是否已经解释了智慧？","summary":"讲者将对状态和表现的描述，与定义及实现路径分开。","points":["某一种良好表现，可以是智慧的一部分。","本课继续追问如何达到、如何应用，并承认仍有自己无法定义的问题。"],"start":123,"end":137,"quote":"每天多知道一点，只是达到智慧所需的条件之一；心干净一点，是帮助你作出正确决定。它们都是认知、思维、行为所需的一部分，不能拿其中一条代表整个智慧。这就是描述性的解释。","quoteIndex":126,"related":["ep6-k06","ep10-k09","ep10-k11"],"section":"ep10-p108","sectionTitle":"三 智慧的定义与定义的边界","searchText":"问道十 智慧和悟 第10课 问道10 描述智慧的表现，是否已经解释了智慧？ 讲者将对状态和表现的描述，与定义及实现路径分开。 智慧落地 某一种良好表现，可以是智慧的一部分。 本课继续追问如何达到、如何应用，并承认仍有自己无法定义的问题。 三 智慧的定义与定义的边界 描述了表现，不等于解释了本身 这就是我们总结的智慧、终极智慧、圆满智慧。再看看古人怎么说，你就能听出以前《问道》讲觉醒、解脱时提到的那个问题：描述性的解释。 比如拆字说“智”，上面一个知，下面一个日，每天多知道一点、多积累一点，叫智。“慧”下面一个心，上面的部分好像扫掉灰尘，把心上的灰尘扫掉，让心干净，叫慧。这是用字形来形容。 每天多知道一点，只是达到智慧所需的条件之一；心干净一点，是帮助你作出正确决定。它们都是认知、思维、行为所需的一部分，不能拿其中一条代表整个智慧。这就是描述性的解释。 《六祖坛经》怎么说？我这里摘的意思是：“善知识，何名般若？般若者，一切处所，一切时中，念念不愚，常行智慧，即是般若。”说人话，就是不管什么时候、什么地方，每个念头都不愚钝，就是智慧。 这就是我特别讨厌的那种描述性的解释。看似解释了般若，或者说般若是到达彼岸的智慧，可智慧究竟是什么，般若究竟是什么，还是没说。只告诉我必须时时刻刻不愚钝，那我怎么做到呢？ 就像你说，一个成功的人，要幸福，有钱、有权，没人欺负，想怎样就怎样，自然活得自在。可我问的是怎么达到，用得着你描述那个样子吗？再看《大乘义章》，它区分智和慧，我就不念古文了。 大概说智是懂得世间的事，慧是照见根本真理。怎么看到？还是不知道。《大智度论》又说，般若在一切智慧中最为第一，无上、无比、无等、无更胜者。你说它最好了，可它究竟是什么？又没说。 说般若是到彼岸的智慧，彼岸是什么？那个智慧是什么？有的说什么都不执着、不抓，不贪、不困。这算不算智慧？这只是达到目标时，不被一些东西影响的一种方法。能说我的耳朵就是我吗？ 还有说，般若在哪里，佛就在哪里，般若波罗蜜是诸佛母。这还是在描述。 我又搜了一些《大智度论》的说法：卷四十三，说一切智慧中最高、无上无比无等；卷十八，说照见一切事物真实本质；卷八十四，说能从此岸到彼岸；卷七十七，说像虚空一样没有固定形状；卷一百，说是一切佛的母亲。 这些都在形容般若。听完之后，你能告诉我具体怎么修、在生活里怎么应用吗？这就是我说的，净说些不管用的话。还有我看到归在朱熹名下的“智者自知其所不知”，知道自己不知道。 这当然算智慧的一种表现，可不能说它就是智慧。像镜子、像虚空、像秤、像深谷，这些都只是某个方向的表现，是描述状态，不是解释本身。一个人下定义，如果只是描述现象，按我的判断，他最多抓住了一个代表现象，还没弄懂本身。 我也承认自己有不懂的。什么是爱，我想了两年，到现在也没法下定义。能举很多案例、很多现象、很多描述，但我觉得那不是爱的本质。也可能爱本来就没有定义，可能我水平低，理解不了；也可能它就是混沌的，不应该有理由，甚至不应该有目的。 我承认自己智慧水平也不高，这东西定义不出来。好，既然说古人不够，咱们得来点实在的：怎么提升智慧？这才是关键。要提升，得在六个方向上进步。"},{"id":"ep10-k11","course":"ep10","number":11,"topic":"智慧与悟","title":"提升智慧的六个维度","summary":"本课提出从时间、认知、信息和利益取舍等方面扩展判断。","points":["远度：看更长时间；高度：提升认知层次。","全面性：检查遗漏；当前利益与未来利益：分别衡量。","取舍：明确到底要什么，以及愿意付出什么。"],"start":138,"end":149,"quote":"第三个，全面不全面。了解不全面，就容易出意外。第四个，当前利益合不合适。第五个，未来利益合不合适。第六个，取舍，看你到底要什么。","quoteIndex":145,"related":["ep10-k10","ep10-k12"],"section":"ep10-p138","sectionTitle":"四 提升智慧，要补哪些东西","searchText":"问道十 智慧和悟 第10课 问道10 提升智慧的六个维度 本课提出从时间、认知、信息和利益取舍等方面扩展判断。 智慧与悟 远度：看更长时间；高度：提升认知层次。 全面性：检查遗漏；当前利益与未来利益：分别衡量。 取舍：明确到底要什么，以及愿意付出什么。 四 提升智慧，要补哪些东西 四 提升智慧，要补哪些东西 六个维度，不能只看眼前 比如想挣钱，什么叫挣钱的智慧？得保证钱越来越多，自己还一直安全。别像我前面说的许老板，钱挣着了，后面出了事；也别像黄老板，挣了钱，被关进去，放出来之后又作了几个决定，输得更惨。 还有贾老板，钱挣着了，却不敢回来，一堆人骂，何苦呢？真正要想的是，钱我要挣，我开心，大家也开心，同时我还安全。这才叫挣钱的智慧。 第一个维度，远度。智慧解决的是长久问题，至少先保证这一生没问题。就算你说我死之后哪管洪水滔天，那这辈子，钱总得花到吧？别人没死，钱先没了。 第一目标，人死了，钱正好没了。再好一点，人走了，钱还在，后代有花销，产业能继续，功德还持续增加。这个才厉害。 所以先考虑长远：更长时间里，这个事对不对，会不会带来问题？第二个，提升高度，主要是认知高度。对事情的理解，要不停往上拔。 第三个，全面不全面。了解不全面，就容易出意外。第四个，当前利益合不合适。第五个，未来利益合不合适。第六个，取舍，看你到底要什么。 比如背叛、出卖信息，只要当前利益，对未来抱侥幸，就容易作出愚蠢决定。在我讲的累劫轮回里，这不只是卖几个信息的事。 我记得一几年的时候，有个哥们特别喜欢出去玩，北京嫌贵，就往天津跑，说有个叫“繁花”的场子，比北京便宜一些，质量还高。 他找小姐，还说：“我给她钱，她开心，我也开心，大家都开心。”我说，你理解的都是短期。更长期呢？你以为这次碰过，以后不见面，就没关系了？ 按我这里讲的因果，累劫轮回里，两个人可能还会被各种关系拴在一起。石头丢进水里，你不知道涟漪最后影响多大。所以要从这六个维度考虑。"},{"id":"ep10-k12","course":"ep10","number":12,"topic":"学习路径","title":"读书、实证与前人经验的作用","summary":"本课讨论选择有用知识、通过实践验证，以及参考前人经验等路径。","points":["读书选择与第六、第七课的知识分类相接。","前人的观点有帮助，也仍需解决听懂、落地与应用的问题。"],"start":150,"end":159,"quote":"第二，科学实证，通常在管理、工程或具体事情上用。比如盖大厦、修水坝，希望五十年、一百年不塌，就需要大量科学实证，保证更长时间里不出问题。","quoteIndex":155,"related":["ep7-k12","ep10-k11","ep10-k13"],"section":"ep10-p138","sectionTitle":"四 提升智慧，要补哪些东西","searchText":"问道十 智慧和悟 第10课 问道10 读书、实证与前人经验的作用 本课讨论选择有用知识、通过实践验证，以及参考前人经验等路径。 学习路径 读书选择与第六、第七课的知识分类相接。 前人的观点有帮助，也仍需解决听懂、落地与应用的问题。 四 提升智慧，要补哪些东西 读书、实证与前人的经验 常规怎么提升？第一，读书，读有用的书。这就是为什么讲智慧之前，先给你们讲知识分类。 读世界名著、《三体》《百年孤独》，可能有感悟，但按我这里提升智慧的目的，不会有特别大的帮助。我重视的是那五类：真相，认知和方向，心性和人性，实操，人情世故。时间花在这些以外的东西上，可能是在浪费生命。 当然，生命有时候也需要浪费。我今天研究这些东西，上厕所也刷剧。该浪费就浪费，不能太浪费。读书有帮助，但书本只是人类现有认知和知识体系的一个上限，未必解决你的全部问题。 知识大爆炸之后，读到更多东西，确实能更厉害。现在又逐渐走向大V时代，尤其一些海外的知识博主，讲政经、生活、时事，他们对事态的看法，有时比读很多书更有用。这也是一种方法，别走错路。 第二，科学实证，通常在管理、工程或具体事情上用。比如盖大厦、修水坝，希望五十年、一百年不塌，就需要大量科学实证，保证更长时间里不出问题。 第三，哲学、国学，智者的书，伟人的实践和人生金句，能不能提升智慧？可以，但也有上限。你学国学，学的是什么？我看主要是佛经、道经，再加上孔孟、王阳明、曾国藩这些人的东西。 他们对世界的看法、对事物的定义，能帮助你活得更好，少犯人生错误。 但也会出现前面讲的问题：听不懂，用不上，不明白意思，操作不了。六祖偶尔说一点，弘一法师偶尔说一点，我把它叫星星之火，难以燎原。算不算火？算，有帮助，只是还不够。 要是这些东西已经把问题解决了，人类怎么还普遍不觉醒、不解脱？在我讲之前，连觉醒、解脱的定义都说不清，又凭什么觉得真正理解了世界，知道它怎么坑你？好，再说易学占卜、法界成相。"},{"id":"ep10-k13","course":"ep10","number":13,"topic":"智慧与悟","title":"占卜作为辅助：讲者自己列出的限制","summary":"讲者认为占卜可以辅助判断，同时说明它不能替代完整的方法与能力。","points":["在其解释中，看见结果与掌握改变结果的方法仍有距离。","他明确说不能保证占卜百分之百正确，也不能把它当作拐棍。"],"start":160,"end":166,"quote":"但前提是占卜得正确。第一，即使占得对，看到的也可能全是不好的结果；第二，你又不能保证占卜百分之百正确。所以不是完全不能走，是很难走通，不能把它当拐棍，辅助验证可以。这也是我一直说“法界成相”的意思。好，喝口水。","quoteIndex":166,"related":["ep10-k12","ep10-k14"],"section":"ep10-p138","sectionTitle":"四 提升智慧，要补哪些东西","searchText":"问道十 智慧和悟 第10课 问道10 占卜作为辅助：讲者自己列出的限制 讲者认为占卜可以辅助判断，同时说明它不能替代完整的方法与能力。 智慧与悟 在其解释中，看见结果与掌握改变结果的方法仍有距离。 他明确说不能保证占卜百分之百正确，也不能把它当作拐棍。 四 提升智慧，要补哪些东西 占卜可以辅助，不能当拐棍 能不能解决智慧的问题？我认为能解决一部分。因为智慧是让人在更长时间里正确且有利。如果直接看这件事十年、一百年之后的结果，就能辅助判断现在的选择。 可没有核心方法，你看再多，最后可能都是不好的结局。为什么？智慧拼图没拼好，木桶的木板没搭全。改一个，占卜一下，失败；再改，往前走一点，又失败。因为你不知道一个事物要长久稳定地成功，需要多少条件，可能几百、上千个点，各方面都得优秀。 所以我说，成功的人类千篇一律，失败的人类各有不同。任何一点出问题，都可能走不到那个位置。 你说走A不通，走B不通，走C也不通，可能正确的路是先A，再B，再C，再回A、回B、回A。它是这么一条路。 你自己穷举去吧，很难穷举出来。未来又像一棵树，有很多分岔，任何小错误都可能让未来不同。所以这个方法，在我的理解里，至少能让你在事情发生前，先看到一些未来影像。 但前提是占卜得正确。第一，即使占得对，看到的也可能全是不好的结果；第二，你又不能保证占卜百分之百正确。所以不是完全不能走，是很难走通，不能把它当拐棍，辅助验证可以。这也是我一直说“法界成相”的意思。好，喝口水。"},{"id":"ep10-k14","course":"ep10","number":14,"topic":"智慧与悟","title":"冥想四个境界：本课的宗教解释","summary":"讲者把冥想分为静下来、偶尔成像、入境和入境中的认知同步。","points":["第一层关注平静；第二层被他解释为偶尔接收到影像。","第三层指持续入境；第四层指其所说的大量认知同步。","后面三层的机制与条件沿用讲者的信仰叙述。"],"start":167,"end":184,"quote":"这里涉及两个事，一个冥想，一个悟。我把冥想分成四个境界。","quoteIndex":171,"related":["ep10-k13","ep10-k15"],"section":"ep10-p167","sectionTitle":"五 冥想与悟，分别在说什么","searchText":"问道十 智慧和悟 第10课 问道10 冥想四个境界：本课的宗教解释 讲者把冥想分为静下来、偶尔成像、入境和入境中的认知同步。 智慧与悟 第一层关注平静；第二层被他解释为偶尔接收到影像。 第三层指持续入境；第四层指其所说的大量认知同步。 后面三层的机制与条件沿用讲者的信仰叙述。 五 冥想与悟，分别在说什么 五 冥想与悟，分别在说什么 我讲的冥想四个境界 第五种增长智慧的方法，打坐、冥想、感悟，好使不好使？有人会说，佛祖不就是在菩提树下打坐悟道的吗？凭什么说我不行？我就敢说，你去打坐，未必好使。 这个本来要放在《法界天机》里讲，这里稍微穿插一点。不是所有打坐、冥想都能得到有用的东西。就靠打坐得到有用东西的人，我特别佩服佛祖和达摩。其他人不是完全不能成相，但也有条件。 这里涉及两个事，一个冥想，一个悟。我把冥想分成四个境界。 第一个，让自己静下来。很多人能做到，这件事本身有用。如果连静都静不下来，我认为要看环境磁场，有没有师父或法阵帮着清理，还要坚持一段时间。 第二个，偶尔看到影像。一个人、一幅画面，甚至一句话，在我的说法里，都叫法界成相。可能是仙家、法界师父，也可能是前世的一些碎片记忆，通过这个方式沟通上了。 但如果只是偶尔看到一点，我只能说沟通能力很一般。看完一段前世影像，想明白一件事，有没有可能？有。可想靠这点东西全面觉醒，想都不用想。 我常把它比成电视机和电视台。上面得打信号，你这台电视也得能成像，有电、有天线。老电视一开，全是雪花，你得调台，同频共振。甭管仙家、师父，还是佛祖菩萨，信号打下来，你收到了，才出现影像。 当然，我这套说法里，也可能有别的信号，灵敏度高，什么台都能收到，还可能串台。以后讲法界成相再细说。 第三个，入境，能稳定进到一个境界里，待几十分钟，甚至几天。不是偶尔闪一下，而是持续传输，大量往脑子里灌知识。那得问，你有大号吗，上面有师父吗，能定在那个境界里吗？都做不到，谁给你传？ 我有大号，我老婆也有。我的大号主“忽悠”，研究道法，走文的，传这些知识没问题。我是从他那里分出来的一部分，同频共振比较方便。你跟师父关系再好，也未必是同一个东西出来的，沟通可能就费劲。 有大号还得看大号干什么。前几天说有个小姑娘是嫦娥的小号，长得挺漂亮，连上嫦娥，传点舞蹈知识可以；要传认知、佛法，那就未必是她擅长的。 我媳妇的大号要是给她传，估计传的是怎么揍我，人家是练家子。我在法界从来没打赢过她。那边不论体重，论法力。她在人间只有我一半体重，到了法界，谁揍谁还不一定。很郁闷啊。 第四个，最厉害的，是在入境中大量进行认知同步。我把佛祖在菩提树下的经历理解为这个。此前他还迷茫，后来放下一切，打坐几天，认知同步了，再看世界、再说话，底气就不一样。 所以还得看大号是谁，是不是传法、研究智慧的。不是干这个的，连上也未必有用。 就像有人说念阿弥陀佛就能往生极乐世界。在我看来，有些教这些方法的人，本来就是从佛界来的，完成任务、不犯大错就能回去。对他好使的方法，不见得直接放在你身上就好使。 佛教、道教都有很厉害的人，他们的修行方法没错，但可能只适合他们自己。这几千年打坐的人多，有几个悟道？就算说悟了，留在人间的思想、文献又有多少足够高级？所以我的判断是，还是条件没接上。"},{"id":"ep10-k15","course":"ep10","number":15,"topic":"智慧与悟","title":"悟的五种方式","summary":"本课依次讨论学习、点拨、传承、因果碰撞与认知同步。","points":["学习与点拨：获得材料，或被人点通。","传承与因果碰撞：分别涉及本课的宗教传承解释和实际经历中的领悟。","认知同步：讲者对自身灵感来源的一种解释。"],"start":185,"end":200,"quote":"再说悟。一个竖心旁，一个吾，我把它理解成，有个东西把你串通起来了。这个东西挺麻烦。","quoteIndex":186,"related":["ep10-k14","ep10-k16"],"section":"ep10-p167","sectionTitle":"五 冥想与悟，分别在说什么","searchText":"问道十 智慧和悟 第10课 问道10 悟的五种方式 本课依次讨论学习、点拨、传承、因果碰撞与认知同步。 智慧与悟 学习与点拨：获得材料，或被人点通。 传承与因果碰撞：分别涉及本课的宗教传承解释和实际经历中的领悟。 认知同步：讲者对自身灵感来源的一种解释。 五 冥想与悟，分别在说什么 悟的五种方式 再说悟。一个竖心旁，一个吾，我把它理解成，有个东西把你串通起来了。这个东西挺麻烦。 第一，通过学习。学到好的知识、好的素材，明白更多，就有更大机会悟。学习对提升智慧和认知很有帮助。 第二，点。某件事想不明白，有个明白的人点一下：“你为什么不这样做？”突然就通了，不一定费多大劲，这叫点。 第三，传，有传承的。一般涉及道家的术法，或某个派系。比如我用的紫微、紫占，按我的说法，要有星辰殿的仙骨，才有灵感。大家同时为一个问题起卦，我用手指点出的盘，可能就更容易解。那一下代表机缘，方便我看。 所以才会有仙骨、仙根、传承这些说法。不是那个传承，想学就费劲。密宗、道术、法术，也不是想学就能学；得属于那一派，祖师爷认可，手势、开光、请仙才好使。别人照着学，未必有用。这是我说的传。 第四，因果碰撞，很重要。将来红尘道场里，我可以教无数知识，可你能不能真正领悟，还得靠碰撞。 学完反复练，能不能精通、真正明白，不一定。可能帮别人做了一件事，经历了一个案例，突然一下懂了，这就叫因果碰撞式的领悟。告诉你了，跟你能应用，是两码事；明白了，跟真的通透，也是两码事。 按我的理解，这种咔一下悟到的东西，轮回不散，一直能应用。有些学生说，很难感到慈悲、大爱和不恨。我讲了很多，可那是我的东西，不是他的。我只能告诉你我的理解，能不能触发你的感悟，不一定，也许时间还没到。 有一天，突然一下，原来就是这样。像《庆余年》里的大宗师，需要那个机缘，可能一生就那么一次，感觉找到了，就上去了。我拿范闲举例，他有那个感觉却没继续，后来再怎么突破，也只是无限接近，始终到不了。这是我借小说打个比方，悟有时候就是那么一种感觉，feel。 第五，像我这样，也是悟的一种，叫认知同步。我这个人极懒，仙家还说，你一天打坐半小时不行吗？我还是不想。你要让我看半小时小说，没问题。 这两天大忏悔又有点懈怠，明天得坚持。给自己找了很多理由，说忙、没时间，其实呢？ 今天累计看小说也有两个小时，找到个很多小说改动画的地方，看进去就没退出来。我不愿意打坐，大号就没时间给我传；他们还老在凌晨一点到三点传，挺讨厌。 我现在的招是，研究不出来就先不研究，上个香，跟大号说：“不会了，你们自己努力。”我该干什么干什么，打游戏，喝点小啤酒。 有时候凌晨三点传，我自己有感觉。过两天再想，突然就有感觉了，眉飞色舞。所以我本着能不干活就不干活，能让大号干就让大号干。你们在佛界，跟我这个小脏号较什么劲？你们干，我享受人间，该传给大家的照样传，不耽误。 说白了，有些东西我自己想也想不明白，那就让他们干完传过来。这是我自己的方式。"},{"id":"ep10-k16","course":"ep10","number":16,"topic":"学习与执行","title":"学习与点拨：理解可以怎样被打开？","summary":"本课把好知识、好素材与他人的一句提示，都列为可能帮助领悟的途径。","points":["学习增加理解所需的材料。","点拨可能改变原先看问题的角度。"],"start":187,"end":188,"quote":"第二，点。某件事想不明白，有个明白的人点一下：“你为什么不这样做？”突然就通了，不一定费多大劲，这叫点。","quoteIndex":188,"related":["ep9-k06","ep10-k18","ep10-k15","ep10-k17"],"section":"ep10-p167","sectionTitle":"五 冥想与悟，分别在说什么","searchText":"问道十 智慧和悟 第10课 问道10 学习与点拨：理解可以怎样被打开？ 本课把好知识、好素材与他人的一句提示，都列为可能帮助 研究和日常生活的自述。"],"start":195,"end":200,"quote":"说白了，有些东西我自己想也想不明白，那就让他们干完传过来。这是我自己的方式。","quoteIndex":200,"related":["ep10-k18"],"section":"ep10-p167","sectionTitle":"五 冥想与悟，分别在说什么","searchText":"问道十 智慧和悟 第10课 问道10 认知同步：讲者对自身灵感的解释 讲者以与“大号”同步的宗教说法，描述卡住之后又突然产生思路的个人体验。 智慧与悟 这是本课列出的第五种悟的方式。 原文保留其打坐、研究和日常生活的自述。 五 冥想与悟，分别在说什么 第五，像我这样，也是悟的一种，叫认知同步。我这个人极懒，仙家还说，你一天打坐半小时不行吗？我还是不想。你要让我看半小时小说，没问题。 这两天大忏悔又有点懈怠，明天得坚持。给自己找了很多理由，说忙、没时间，其实呢？ 今天累计看小说也有两个小时，找到个很多小说改动画的地方，看进去就没退出来。我不愿意打坐，大号就没时间给我传；他们还老在凌晨一点到三点传，挺讨厌。 我现在的招是，研究不出来就先不研究，上个香，跟大号说：“不会了，你们自己努力。”我该干什么干什么，打游戏，喝点小啤酒。 有时候凌晨三点传，我自己有感觉。过两天再想，突然就有感觉了，眉飞色舞。所以我本着能不干活就不干活，能让大号干就让大号干。你们在佛界，跟我这个小脏号较什么劲？你们干，我享受人间，该传给大家的照样传，不耽误。 说白了，有些东西我自己想也想不明白，那就让他们干完传过来。这是我自己的方式。"},{"id":"ep10-k20","course":"ep10","number":20,"topic":"智慧落地","title":"高处的道理，要适应具体生活环境","summary":"本节通过宗教故事讨论：拥有一套高层理念，未必已经能处理不同环境中的问题。","points":["讲者强调经历具体环境，并理解身处其中的人。","方向之外，还需要能够在人间生活和做事的配套知识。"],"start":201,"end":212,"quote":"人间也一样，要经过漫长时间，熟悉人间、魔界、碎片空间、夹缝空间这些环境，再结合佛界、至高道界的东西去讲，才能贴合。","quoteIndex":209,"related":["ep1-k17","ep2-k20","ep10-k21"],"section":"ep10-p201","sectionTitle":"六 智慧要能在人间用起来","searchText":"问道十 智慧和悟 第10课 问道10 高处的道理，要适应具体生活环境 本节通过宗教故事讨论：拥有一套高层理念，未必已经能处理不同环境中的问题。 智慧落地 讲者强调经历具体环境，并理解身处其中的人。 方向之外，还需要能够在人间生活和做事的配套知识。 六 智慧要能在人间用起来 六 智慧要能在人间用起来 为什么不能只带一套高处的道理下来 所以打坐、冥想、感悟能不能提升智慧？这是宗教里常见的方式，但在我看来，多数情况下，光这么做不好使。偶尔想明白一点事，和全面解决问题还是两回事。 前面征集过大家的问题，这里集中说几个。有人问，能不能直接有个大菩萨、佛祖转世下来，把道理告诉人间？我认为不行，已经试过很多次了。 越高级的上位面生命，越干净、越简单，也越容易沟通天地。比如最近我说生成了道魂，上面的大领导还问，怎么目光看着有点呆滞？其实是清明、简单。 可在下面生活不一样。要是直接下来就能解决问题，还用得着我们这样的人吗？上面的智慧带得下来，却未必能让人在下面活下去。太干净、太简单，出门就可能被骗。 所以我讲的办法，是让至高佛界、至高道界的人，转世到较低、较脏的位面里经历。我一直说，天道掌握轮回门，就很难有真正的敌人。你总要生孩子、要繁衍，下一代是谁，可能就不是你决定的了。 我理解地藏王菩萨，就是从佛界转到幽冥鬼界，再一点点成长。所以既懂佛法，又熟悉那个环境，才能创造出在那里可以用的佛法。普通佛法直接搬过去，未必好使。 人间也一样，要经过漫长时间，熟悉人间、魔界、碎片空间、夹缝空间这些环境，再结合佛界、至高道界的东西去讲，才能贴合。 还有人问，很多人聪明、能挣钱，为什么你说从法界看不算有智慧？因为他现在的所作所为，不一定让未来的自己更舒服、更快乐、更幸福。 比如我对考公务员就常有这个疑问。你没有相应条件，又想上升，好不容易到一个位置，后面还有很多限制和风险。我有个朋友，七十岁，因为很多年前牵扯到一些事，据我了解被判了十五年。也曾经是个优秀的人，这一辈子何苦呢？如果一条路很难善终，为什么非走？ 挣到钱的老板也是，要看自己所处的时期，看看历史，比如汉武帝后期发生过什么，去读读冯唐讲《资治通鉴》的东西。读书得读有用的，时政也得看。知道了却舍不得走，后面又可能走不了。聪明了一辈子，最后没办法善终，何苦呢？"},{"id":"ep10-k21","course":"ep10","number":21,"topic":"智慧落地","title":"一条原则，还需要其他条件配合","summary":"本课把全面处理问题与只掌握某一条原则区分。","points":["短期利益、长期利益与执行条件，需要一起考虑。","讲者也承认自己仍有想不明白、做不到的部分。"],"start":213,"end":218,"quote":"但只拿这一条在人间活，没有其他东西辅助，你可能走不到底。这一条的原则没问题，可还得掌握别的东西，包括怎么在长久利益、短期利益之间取舍。","quoteIndex":215,"related":["ep10-k20","ep10-k22"],"section":"ep10-p201","sectionTitle":"六 智慧要能在人间用起来","searchText":"问道十 智慧和悟 第10课 问道10 一条原则，还需要其他条件配合 本课把全面处理问题与只掌握某一条原则区分。 智慧落地 短期利益、长期利益与执行条件，需要一起考虑。 讲者也承认自己仍有想不明白、做不到的部分。 六 智慧要能在人间用起来 一条至高智慧，还需要别的东西配合 无上正等正觉算最高智慧吗？“以无我、无人、无众生、无寿者，修一切善法，即得阿耨多罗三藐三菩提。”在我的理解里，这是增加能量、增加福报的至高智慧。 但只拿这一条在人间活，没有其他东西辅助，你可能走不到底。这一条的原则没问题，可还得掌握别的东西，包括怎么在长久利益、短期利益之间取舍。 什么叫智慧圆满？各种事情，都能在很长的时间里，保证正确且有利。做不到，怎么叫圆满？ 比如我说观世音菩萨给我的智慧打分，有时八点五分，有时八分。如果十分是满分，差的那一点五分、两分，就代表某些事情，我现在的认知还不能确保所作所为在未来圆满，可能带来伤害，或最后结算拿不到满分。 我现在也就是百分之八十到八十五做得还可以，其余仍有想不明白的。也知道某些地方不对，可能修行不到，还是不愿意选择，没办法。"},{"id":"ep10-k22","course":"ep10","number":22,"topic":"学习与执行","title":"红尘道场：把推导带进实际问题","summary":"本课把真相学习的最终目的落在解决具体事情，并通过练习建立行动习惯。","points":["理解一个决定怎样推导出来。","在具体事情里练怎么想、怎么做，以及如何执行。"],"start":219,"end":221,"quote":"《人类说明书》要干的，就是懂了理论之后，带大家解决生活里的点点滴滴：怎么做，怎么想，怎么保证执行，才能更长久地正确且有利。","quoteIndex":220,"related":["ep10-k21","ep3-k21","ep1-k11"],"section":"ep10-p201","sectionTitle":"六 智慧要能在人间用起来","searchText":"问道十 智慧和悟 第10课 问道10 红尘道场：把推导带进实际问题 本课把真相学习的最终目的落在解决具体事情，并通过练习建立行动习惯。 学习与执行 理解一个决定怎样推导出来。 在具体事情里练怎么想、怎么做，以及如何执行。 六 智慧要能在人间用起来 怎么升级？不断磨练。在利益众生、帮人解决问题的时候，要能指出对他长远正确且有利的方法。他愿不愿干，是他的事，至少你能指出来。 《人类说明书》要干的，就是懂了理论之后，带大家解决生活里的点点滴滴：怎么做，怎么想，怎么保证执行，才能更长久地正确且有利。 讲那么多真相，是让你清楚一个决定怎么推导出来。但知道真相不是最后目的，目的是解决方方面面的事情。指望所有人自己总结应用，不现实，那就告诉他结果，带着练习，重新建立所思、所想、所行的方法。所以需要红尘道场，帮助大家练得更全面、更高、更长久。"},{"id":"ep10-k23","course":"ep10","number":23,"topic":"智慧与悟","title":"智慧十二条·一至三：知识体系与意义","summary":"本课把十二条作为仍可修订的初级判断框架。","points":["第一：用所学课程原则对照自己的决定。","第二：建立人间的知识体系。","第三：先想清做事的意义、目的与希望得到的结果。"],"start":222,"end":232,"quote":"终于讲到最后了，今天讲得有点多。学完别直接扔了，得像意义思维一样，分析事情时真按这个路子走。我总结十二条，不算完善，先当初级版本。要允许我们犯错，允许在错误里成长。","quoteIndex":224,"related":["ep5-k24","ep10-k27","ep10-k24","ep5-k22"],"section":"ep10-p222","sectionTitle":"七 建立智慧思维体系的十二条","searchText":"问道十 智慧和悟 第10课 问道10 智慧十二条·一至三：知识体系与意义 本课把十二条作为仍可修订的初级判断框架。 智慧与悟 第一：用所学课程原则对照自己的决定。 第二：建立人间的知识体系。 第三：先想清做事的意义、目的与希望得到的结果。 七 建立智慧思维体系的十二条 七 建立智慧思维体系的十二条 前三条：知识、认知与意义 终于讲到最后了，今天讲得有点多。学完别直接扔了，得像意义思维一样，分析事情时真按这个路子走。我总结十二条，不算完善，先当初级版本。要允许我们犯错，允许在错误里成长。 第一，平时多看、多听、多学《人类说明书》《逆修觉者》《真相》《法界天机》这些知识。做事情时，用学到的原则对照一下，现在的决定合不合适，符合原则，再继续做。 第二，建立人间的知识体系。现在逐渐进入大V时代。那些动不动喊“听懂了掌声”的，或者空说某种东西是一种智慧的，越来越不好使，因为大家整体认知提高了。现在更需要说实话的人。 像我教这些知识体系，都是不收费的。 我教知识时，咱们之间没有这层收费关系，我希望你跟着学就行。忽悠不忽悠都不收费，那我有什么必要忽悠？这是我自己的想法。 现在网上一些大V，尤其海外的一些人，说的东西比较实在。到底对不对，也可以放到更长时间里验证。 可以多听时政、经济。比如我提到的老王、鲁社长，还有讲经济的小林，这些内容我觉得讲得很好。别净看八卦，对你没多大帮助。人间的知识体系也要建立起来。 第三，先想清楚意义。你要干什么，做这事是为了什么？我看过一个短剧，夫妻都失业，讨论未来怎么办，讨论两个小时，没结果。又想挣钱、解决危机，又不想吃苦，那讨论什么？如果不能解决收入问题，这次讨论的意义在哪里？ 再比如，发现老公跟一个妹子多聊了会儿，你先想，此时最该做什么，想得到什么结果，再去跟他扯。别发完脾气，连自己的目的都不知道。很多人做事真不想结果，只凭感觉，这种人不在少数。"},{"id":"ep10-k24","course":"ep10","number":24,"topic":"智慧与悟","title":"智慧十二条·四至六：后果、概率与情绪","summary":"本组将多步推演、预期判断与情绪检查放在一起。","points":["第四：从影响与时间两个维度，向后推三到五层。","第五：检查期望是否超过事情的实际可能。","第六：检查决定中有多少情绪；可等待时先缓一缓。"],"start":233,"end":241,"quote":"第四，想后果，尽量推三到五层。我做完会得到什么，得到之后会产生什么影响，那个影响又会产生什么后果？推几层，觉得合适，再做。前四条能做到，我觉得就能超过一半人了。","quoteIndex":234,"related":["ep9-k12","ep9-k17","ep10-k23","ep10-k25"],"section":"ep10-p222","sectionTitle":"七 建立智慧思维体系的十二条","searchText":"问道十 智慧和悟 第10课 问道10 智慧十二条·四至六：后果、概率与情绪 本组将多步推演、预期判断与情绪检查放在一起。 智慧与悟 第四：从影响与时间两个维度，向后推三到五层。 第五：检查期望是否超过事情的实际可能。 第六：检查决定中有多少情绪；可等待时先缓一缓。 七 建立智慧思维体系的十二条 第四至第六条：后果、概率与情绪 第四，想后果，尽量推三到五层。我做完会得到什么，得到之后会产生什么影响，那个影响又会产生什么后果？推几层，觉得合适，再做。前四条能做到，我觉得就能超过一半人了。 后果有两个维度。一个是影响。比如买了一辆跑车，发朋友圈，目的是什么，会带来什么？中了五百万，公开告诉大家，亲戚会有什么反应？别只做、不想。影响的影响，再往下推三到五层。 另一个维度是时间。一个月、一年、十年、三十年之后，甚至按我说的下一生，会有什么影响？不合适就别做。很多事，放到更长的角度想，可能就不做了。 第五，不要对低概率的事情抱有过高期望。 什么叫低概率？以后讲人类金字塔还会说。比如你成为富人的概率有多大，婚姻幸福的概率有多大？我在直播里拿东北举例，随口说了“百分之七十出问题”。我要说的是，别只按自己最想要的结果来想。 很多人对低概率的事情抱极大期望，活在幻想里。你得看看自己的想法，实际有多大概率。 第六，检查决定里有没有情绪。喜欢一个东西就必须买，跟谁较劲就必须把那句话说出去，这都有情绪。情绪上来的时候，只要不是必须马上处理的生死急事，就先别作决定。 有人说太扎心了。其实很多事成功率本来就低，只是自己不认可。看看一辈子有几个人富，凭什么一定落到你身上？可你心里已经把自己的可能性放大到百分之九十九以上了。"},{"id":"ep10-k25","course":"ep10","number":25,"topic":"智慧与悟","title":"智慧十二条·七至九：请教、辅助判断与原则","summary":"本组讨论借助外部经验、讲者自己的宗教判断方法，以及不违背原则。","points":["第七：请有经验、认知更高的人指点。","第八：讲者在自己的方法中使用法界成相作辅助判断。","第九：不在天道、人道的大原则上出问题。"],"start":242,"end":246,"quote":"第七，能不能找高人指点？前面都想过了，人还是有思维茧房：认知就这么大，没办法发现认知以上的问题。","quoteIndex":243,"related":["ep10-k24","ep10-k26","ep8-k02"],"section":"ep10-p222","sectionTitle":"七 建立智慧思维体系的十二条","searchText":"问道十 智慧和悟 第10课 问道10 智慧十二条·七至九：请教、辅助判断与原则 本组讨论借助外部经验、讲者自己的宗教判断方法，以及不违背原则。 智慧与悟 第七：请有经验、认知更高的人指点。 第八：讲者在自己的方法中使用法界成相作辅助判断。 第九：不在天道、人道的大原则上出问题。 七 建立智慧思维体系的十二条 第七至第九条：求助、验证与原则 第七，能不能找高人指点？前面都想过了，人还是有思维茧房：认知就这么大，没办法发现认知以上的问题。 认知更高的人一看，就知道你哪里选错了；自己没有那个认知，就看不出来。身边有这样的人，把事情说给他听，点你一句，可能比自己苦上十年都强。 第八，按我这套方法，用法界成相看一下靠不靠谱。我做很多事，也会找仙家、神，比较大的事找更高级别的菩萨去看。确定没问题，再往前冲。你觉得各方面没问题，却还没有成相，按我的理解，一定有认知之外的东西出了问题。 第九，在天道、人道的大原则上别出问题。明显违反规则的事，不要去做，不要铤而走险。"},{"id":"ep10-k26","course":"ep10","number":26,"topic":"智慧与悟","title":"智慧十二条·十至十二：能力圈、反馈与确定","summary":"本组从自知、外部反馈和自主判断三个方面收束。","points":["第十：在能力圈内做事。","第十一：建立反馈、修正和复盘体系。","第十二：只做自己想清楚、有把握的事，避免盲目跟随。"],"start":247,"end":252,"quote":"第十二，只做自己确定的事。很多人根本没想清楚要不要做，就跟着别人干了。别人干什么，你就干什么，跟你有什么关系？这一点一定注意。","quoteIndex":252,"related":["ep7-k12","ep9-k21","ep10-k25","ep10-k27"],"section":"ep10-p222","sectionTitle":"七 建立智慧思维体系的十二条","searchText":"问道十 智慧和悟 第10课 问道10 智慧十二条·十至十二：能力圈、反馈与确定 本组从自知、外部反馈和自主判断三个方面收束。 智慧与悟 第十：在能力圈内做事。 第十一：建立反馈、修正和复盘体系。 第十二：只做自己想清楚、有把握的事，避免盲目跟随。 七 建立智慧思维体系的十二条 第十至第十二条：能力圈、反馈与确定 第十，能力圈以上的事情不要碰，做能力圈以内的事情。 人贵在自知之明，这点很重要。有女生找我算姻缘，说自己特别漂亮，为什么还没人找？我看了照片，觉得经过PS都没有她自己说得那么好。我就问，身边没有反馈吗？ 比如你走在街上，有没有很多人回头看？做游戏主播，说可以花一千块加朋友圈，有多少人愿意？或者拍生活视频，放半年，能不能有五十万、一百万粉？我举这些例子，是说别光凭自己觉得。 这就到了第十一，建立反馈、修正和复盘体系。老觉得自己优秀，总得跟外面的反应对应一下。范冰冰走到街上，一堆人看，她不用怀疑自己是美女；凤姐走到街上，情况就不一样。这是直播里的一个玩笑，但要说的是，你得有反馈。 第十二，只做自己确定的事。很多人根本没想清楚要不要做，就跟着别人干了。别人干什么，你就干什么，跟你有什么关系？这一点一定注意。"},{"id":"ep10-k27","course":"ep10","number":27,"topic":"学习与执行","title":"从逐条检查，到形成习惯","summary":"本课最后要求把判断过程反复练熟，而不止于听过一次。","points":["先意识到自己在哪一步被情绪或旧习惯带走。","通过日常练习，将检查逐步转化为稳定的思考方式。","讲者再次说明，十二条仍是可以完善的版本。"],"start":253,"end":260,"quote":"用熟了，判断可能就是几秒钟，不会耽误太多。刚开始逐条对，可能花很久。可很多人宁愿在错误里痛苦、悔恨，也不愿花一两分钟，或者一两天，把这些东西校正一下，很奇怪。","quoteIndex":257,"related":["ep10-k23","ep10-k26","ep3-k18"],"section":"ep10-p222","sectionTitle":"七 建立智慧思维体系的十二条","searchText":"问道十 智慧和悟 第10课 问道10 从逐条检查，到形成习惯 本课最后要求把判断过程反复练熟，而不止于听过一次。 学习与执行 先意识到自己在哪一步被情绪或旧习惯带走。 通过日常练习，将检查逐步转化为稳定的思考方式。 讲者再次说明，十二条仍是可以完善的版本。 七 建立智慧思维体系的十二条 把十二条练成习惯 这十二条还不完善，但做大事之前，可以先用它建立一个判断过程。行，再做；不行，就别做。 我平时也是这么判断。尤其情绪上来，会先想办法压住。不是每件事都能做到，但至少能意识到：现在这个决定带着情绪，不对，先等等。能意识到，已经不一样。这里面的东西，你能用上一半，就很厉害。 都用上，人生出大问题的概率会低一些。能不能大富大贵，我说还得看命，但至少不容易作太大的错误决定。 用熟了，判断可能就是几秒钟，不会耽误太多。刚开始逐条对，可能花很久。可很多人宁愿在错误里痛苦、悔恨，也不愿花一两分钟，或者一两天，把这些东西校正一下，很奇怪。 咱们只渡能听懂、也愿意修行的人。为什么叫逆修觉者？不是明白了就一定能做到，改变生活习惯是很大的问题。这些东西，其实就是在改习惯。 希望大家学完真能用，别又还给我。成立红尘道场，就是给大家练习、养成习惯的地方。不然最后又变成罗辑思维、樊登读书会，学得再多，没应用，还是一场空。 好，今天到这儿，别忘了点赞、收藏、分享。谢谢大家，今天忽悠时间太长了，拜拜。"}],"topics":["课程导读","追问根源","规则与实践","迷与困","三把锁","觉醒与解脱","智慧落地","学习路径","认知与思维","家庭与沟通","缘分与成长","意义思维","知识分类","人性与心性","成事条件","机缘与贵人","风险与兜底","学习与执行","智慧与悟"],"edition":"第1—10课"}</script>

function updateProgress(){
 $('back-top').hidden=window.scrollY<420;
 if(state.mode!=='read')return;
 const el=document.querySelector('.article-body');if(!el)return;
 const r=el.getBoundingClientRect(),header=window.innerWidth<=820?145:104;
 const percent=Math.max(0,Math.min(100,(header-r.top)/Math.max(1,r.height-window.innerHeight+header)*100));$('reading-progress').style.width=percent+'%';
}
function wire(){
 document.addEventListener('click',event=>{
  const a=event.target.closest('a[href^="#"]');
  if(a&&a.getAttribute('href')==='#main'){event.preventDefault();$('main').focus({preventScroll:true});$('main').scrollIntoView({block:'start',behavior:'auto'});return}
  if(a&&a.getAttribute('href')===location.hash){event.preventDefault();handleRoute();return}
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action;
  if(action==='bookmark'){
   const id=button.dataset.card;if(!cardMap.has(id))return;saved.has(id)?saved.delete(id):saved.add(id);
   const success=saveStored('wendao-pilot-saved-v1',[...saved]);
   if(state.savedOnly)renderCards();else{button.setAttribute('aria-pressed',String(saved.has(id)));button.setAttribute('aria-label',(saved.has(id)?'取消收藏：':'收藏：')+cardMap.get(id).title);button.title=saved.has(id)?'取消收藏':'收藏这张卡片';renderSidebar()}
   toast(success?(saved.has(id)?'已收藏到当前浏览器':'已取消收藏'):'当前环境无法长期保存，收藏仅在本次打开期间有效。');return;
  }
  if(action==='more-cards'){state.limit+=12;const y=window.scrollY;renderCards();window.scrollTo({top:y});return}
  if(action==='more-hits'){state.hitLimit+=12;const y=window.scrollY;renderCards();window.scrollTo({top:y});return}
  if(action==='font-less'||action==='font-more'){state.font=Math.max(16,Math.min(24,state.font+(action==='font-more'?1:-1)));updateFont();saveStored('wendao-font',state.font);return}
  if(action==='print'){window.print();return}
  if(action==='reset'){resetFilters();return}
  if(action==='read'){openRead(state.course==='all'?state.reader:state.course);return}
  if(action==='cards'){state.mode='cards';state.topic='all';state.q='';state.limit=12;$('search-input').value='';clearRoute();render();setMenu(false,false);topScroll();return}
  if(action==='course'){
   if(state.mode==='read'&&button.dataset.course!=='all'){state.q='';$('search-input').value='';openRead(button.dataset.course);return}
   state.course=button.dataset.course;state.mode='cards';state.topic='all';
  }
  if(action==='topic'){state.topic=button.dataset.topic;state.mode='cards'}
  if(action==='saved'){state.savedOnly=!state.savedOnly;state.mode='cards'}
  if(action==='quick-search'){state.q=button.dataset.query;state.course='all';state.topic='all';state.savedOnly=false;$('search-input').value=state.q}
  state.limit=12;state.hitLimit=12;clearRoute();render();setMenu(false,false);topScroll();
 });
 $('menu-button').addEventListener('click',()=>setMenu(!state.menu));$('backdrop').addEventListener('click',()=>setMenu(false));
 $('theme-button').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('wendao-theme',dark?'dark':'light')}catch{}setTheme()});
 $('search-input').addEventListener('compositionstart',()=>{composing=true;clearTimeout(searchTimer)});
 $('search-input').addEventListener('compositionend',()=>{composing=false;clearTimeout(searchTimer);runSearch()});
 $('search-input').addEventListener('input',()=>{if(composing)return;clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,160)});
 $('search-form').addEventListener('submit',e=>{e.preventDefault();clearTimeout(searchTimer);runSearch();setMenu(false,false);topScroll()});
 $('back-top').addEventListener('click',()=>{topScroll();$('main').focus({preventScroll:true})});
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.menu){e.preventDefault();setMenu(false);return}
  if(e.key==='Escape'&&document.activeElement===$('search-input')){clearTimeout(searchTimer);$('search-input').value='';runSearch();return}
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')&&!document.activeElement?.isContentEditable){e.preventDefault();$('search-input').focus();return}
  if(e.key==='Tab'&&state.menu){const focusables=Array.from($('sidebar').querySelectorAll('summary,button:not([disabled]),a[href]')).filter(el=>el.getClientRects().length);const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}
 });
 window.addEventListener('hashchange',handleRoute);
 window.addEventListener('scroll',()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{updateProgress();scrollTick=false})},{passive:true});
 window.addEventListener('resize',()=>{if(window.innerWidth>820&&state.menu)setMenu(false,false);$('sidebar').inert=window.innerWidth<=820&&!state.menu;updateProgress()});
}
function boot(){setTheme();updateFont();wire();render();$('sidebar').inert=window.innerWidth<=820;handleRoute()}
// BOOT_ENTRY: kept separate so data, rendering, and filtering can be checked without a browser.
boot();
</script>
</body>
</html>
