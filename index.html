6-k21","ep6-k23"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 危险与利益：同样的需要，不同的边界 讲者分别以安全受威胁和机会出现为例，区分是否越界的反应。 人性与心性 自我保护可以表现为求助、防护，也可能被扭曲为转嫁伤害。 面对利益，可以正当争取，也可能突破底线。 六 人性与心性 安全受威胁与利益出现时的反应 举几个例子。当人的安全受到威胁，面临危险、失去基本保障，比如饥荒、战争、疫情、洪水，出现这种情况，最重要的是什么？害怕、求生、要自我保护。 不越界的处理方式，比如求助、防护、寻找自救的方法。但没有底线的人，为了保护自己，甚至可以把伤害转嫁给别人。 比如人吃人这种事，现在基本没有了，但古代还挺多。史书上也有，像“两脚羊”，古代十国比较多。 再举一个例子，利益和机会出现，比如有金钱、职位、资源、名气的时候，最重要的是想得到、怕错过、怕吃亏。不越界的行为，就是正当争取、提高能力、协商交换；越界的，欺骗、侵占、隐瞒重要事实，类似的事等等。 我就不继续说了，因为一说到人性和心性，我估计能说几十集，这是人类需要学习的一大块，咱们就不展开了。"},{"id":"ep6-k23","course":"ep6","number":23,"topic":"人性与心性","title":"哪些因素会改变人的选择？","summary":"本课列出社会标准、底线、惩罚、关系、欲望、情绪和群体等影响因素。","points":["相同事件，不同人可能有不同的取舍。","身边人的劝阻或推动，也会影响当事人的行动。"],"start":239,"end":246,"quote":"还有欲望，有的人对这个东西很有欲望，有的人没有；还有情绪，因为情绪造成很多心性、人性的波动。这些是产生人性波动、选择不同的因素，我列的肯定不全。同样一件事情，不同的人为什么产生不同的改变？因素很多。","quoteIndex":244,"related":["ep6-k22","ep6-k24"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 哪些因素会改变人的选择？ 本课列出社会标准、底线、惩罚、关系、欲望、情绪和群体等影响因素。 人性与心性 相同事件，不同人可能有不同的取舍。 身边人的劝阻或推动，也会影响当事人的行动。 六 人性与心性 影响选择与底线的因素 人性的东西比较多。首先，有社会标准。比如现在大家认同的社会标准是男女平等，但古代可不是这样，一定是男尊女卑，甚至觉得女性是赔钱货，家里多几个丫头属于赔钱货。这是社会标准不一样。 在不同社会标准下，还会有道德、底线的问题。有的人坚持底线，还有担心惩罚的问题，担心干了这事别人会不会报复，还有亲情、友情。 比如“宁损性命，终不作恶”，如果死我没关系，要死我们家人，这还得考虑一下。 死自己没问题，死老婆呢？有的可能开心，有的可能难过，但基本不会选择死自己的孩子。所以，不同的人，同样一个事，底线是不一样的。 还有欲望，有的人对这个东西很有欲望，有的人没有；还有情绪，因为情绪造成很多心性、人性的波动。这些是产生人性波动、选择不同的因素，我列的肯定不全。同样一件事情，不同的人为什么产生不同的改变？因素很多。 还有群体，比如朋友圈、闺蜜圈这么说，另外一个圈那么说，它不一样。不怕没好事，就怕没好人，就是这句话。包括“家有贤妻，夫不遭横祸”，也很重要。 比如老公喝多了，要跟人干仗，老婆赶紧上去劝：“算了，你还有孩子呢，跟他弄干啥？”可能劝劝就行。如果老婆说：“干死丫的，操！”说不定气势输了，人生也没了。所以旁边的、身边的人很重要。"},{"id":"ep6-k24","course":"ep6","number":24,"topic":"人性与心性","title":"了解人性，首先用于保护自己","summary":"本节将研究人性的用途，落在理解不同状态下的反应和行动上。","points":["本课首先提出保护自己的目的。","后续环境预测与案例保留为讲者当时的判断。"],"start":247,"end":254,"quote":"好，这是人性。了解人性是做什么？学习人性，是了解人类在什么状态下，可能做出什么反应和行动。","quoteIndex":248,"related":["ep6-k23","ep9-k18"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 了解人性，首先用于保护自己 本节将研究人性的用途，落在理解不同状态下的反应和行动上。 人性与心性 本课首先提出保护自己的目的。 后续环境预测与案例保留为讲者当时的判断。 六 人性与心性 了解人性先保护自己 好，这是人性。了解人性是做什么？学习人性，是了解人类在什么状态下，可能做出什么反应和行动。 知道人在什么状态下做出什么反应和行动，对自己有什么帮助？你看，这就意义思维了。第一，首先能保护自己。 我们小团队现在又开始做一些提前预防的事。我知道未来大家生活可能比较艰难，而且越来越艰难。你放心，不会有什么回转，偶尔两三年会有一个反弹，但是未来十五到二十年，大家生活一定越来越不如以前、越来越艰难。 这个时候，人性极其容易出现问题，我现在就在做防范。同时大家一定记住，十年后和十五年后，极容易发生国家和国家之间的大范围战争。 为什么？拿泰国来说，以前很欢迎大家投资，你看现在开始追你税，开始清算外国人买的房子。办证的时候，能不知道一堆外国人买房了吗？能不知道很多东西不是租借的，就是用公司持有的？肯定知道。 为什么那时不收拾你？那时候过得好，没必要玩这一套。为什么现在收拾你？很简单，没钱了，苍蝇再小也是一块肉。等以后连苍蝇肉都吃不上，你想想政府会干些什么？所以一看国家已经开始做一些不太地道的行为，就赶紧跑，别在那晃荡了。 这就叫了解人性，先保护自己，再学会如何应用人性帮助自己。比如追女朋友，得赶她伤心难过的时候去追；人家正春风得意，你去追，有你啥事？所以得了解女人什么时候容易做出“正确的选择”，这也是人性的一部分。"},{"id":"ep6-k25","course":"ep6","number":25,"topic":"人性与心性","title":"修心的桶：用什么承接已有成果？","summary":"讲者用装水的桶比喻心性，并在轮回观中把功德与善缘视为需要承接的成果。","points":["善良、利他、责任、担当、公正与包容，是本节列举的品质。","木桶比喻强调拥有资源之后能否稳妥承接。"],"start":255,"end":257,"quote":"修心干的是什么？可以把修心当成桶。桶是装水的，修心的桶装什么？装你在轮回里能够积累出来的好的成果，有两个：一个功德，一个善缘。","quoteIndex":256,"related":["ep6-k26"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 修心的桶：用什么承接已有成果？ 讲者用装水的桶比喻心性，并在轮回观中把功德与善缘视为需要承接的成果。 人性与心性 善良、利他、责任、担当、公正与包容，是本节列举的品质。 木桶比喻强调拥有资源之后能否稳妥承接。 六 人性与心性 修心性为了保住轮回中的成果 修心干的是什么？可以把修心当成桶。桶是装水的，修心的桶装什么？装你在轮回里能够积累出来的好的成果，有两个：一个功德，一个善缘。 修心性主要修什么？第一，得善，善良；第二，利他；第三，仁，仁义礼智信，这些都得修，都是好的心性。包括人类好的品德、品质，都应该修。还有责任、担当、正义、公正、无私、大爱、包容等等，这就不说了。"},{"id":"ep6-k26","course":"ep6","number":26,"topic":"人性与心性","title":"静与稳定：本课所说的“免疫”","summary":"本课把稳定理解为经历事情后仍能保持平静，减少被诱惑和愤怒带动。","points":["本节区分“免疫”与“消除”。","平静并非从未遇到过事情，而是经历之后仍能稳定应对。"],"start":258,"end":262,"quote":"记住，这种东西叫免疫，而不是消除。是免疫，不是消除。最后达到的状态，叫稳定。","quoteIndex":261,"related":["ep6-k25","ep6-k27"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 静与稳定：本课所说的“免疫” 本课把稳定理解为经历事情后仍能保持平静，减少被诱惑和愤怒带动。 人性与心性 本节区分“免疫”与“消除”。 平静并非从未遇到过事情，而是经历之后仍能稳定应对。 六 人性与心性 要对抗什么？五毒四心，还有各种负面情绪。修完之后，目标是什么？达到什么状态才是好的心性？有两个东西：一个静，一个稳定。 静和稳定是修心性很重要的东西。静就是平静，但不能说没经过事。古人形容静的水平：“心中有惊雷，面如平湖者，可拜上将军。”至少不形于颜色，内心有什么变化咱不说，但至少不形于颜色。我觉得这是第一等。 第二，本身心如止水，经历大风大浪之后，仍然平静面对这一切。不被诱惑的东西影响，也不被愤怒的东西影响，几乎没什么太大的情绪波动。不是说没有情绪，是有没有情绪波动。 记住，这种东西叫免疫，而不是消除。是免疫，不是消除。最后达到的状态，叫稳定。 稳定最重要的就是不被影响，也是免疫的一种，免疫的最后就叫稳定。"},{"id":"ep6-k27","course":"ep6","number":27,"topic":"人性与心性","title":"心性不足，更多资源可能放大问题","summary":"在本课的宗教叙述中，心性影响能否保住所积累的成果。","points":["认知、能力与意外仍可能带来问题。","讲者以天骄等故事，说明承载能力与所处位置之间的关系。"],"start":263,"end":267,"quote":"所以没有足够的心性，也别要求有更多东西，说白了就德不配位。","quoteIndex":265,"related":["ep6-k26","ep3-k05"],"section":"ep6-p226","sectionTitle":"六 人性与心性","searchText":"问道六 意义思维的应用与知识分类 第6课 问道6 心性不足，更多资源可能放大问题 在本课的宗教叙述中，心性影响能否保住所积累的成果。 人性与心性 认知、能力与意外仍可能带来问题。 讲者以天骄等故事，说明承载能力与所处位置之间的关系。 六 人性与心性 当心性没有问题，在轮回里真正能影响你的，是认知、能力和意外，只剩这三个。意外不可能消除。但是知道意外不可能消除，出现意外时，为什么要产生情绪波动？也就稳定了。认知足够高，什么都看过，也就逐渐稳定，不容易做出错误的事。 当然，不可能不犯错误，但不容易因为心性的问题做出错误决定，你轮回里很多成果就容易保住。不然，成果保不住，哪怕位列仙班，在上面犯一个事，惹的麻烦更大。还不如一个泥腿子犯点事，说白了，杀个人、放个火，也不至于有多大问题。在上位面，杀个人放个火——不是说杀个人放火，是犯点错误，可能动不动就影响一界生灵几千年的幸福。 所以没有足够的心性，也别要求有更多东西，说白了就德不配位。 给你更大的东西，只能更大地伤害自己，就是这样。不是说历史上没有人往上走，有，包括法界也一样。各族天骄，最后活到最后的很少。 天骄最大的优势是什么？极其容易获得成功，获得功力、法力、神通都极其容易。但心性关只要上不去，最后很容易把自己祸害死，死得更惨，还容易惹外面的麻烦，带来全族的伤害。所以这就是心性。"},{"id":"ep7-k01","course":"ep7","number":1,"topic":"课程导读","title":"第七课：接完知识分类，再谈成事","summary":"本课先完成第六课余下的七种知识类型，再进入错误来源与成功条件。","points":["讲者再次说明直播用来整理思路，内容会继续修正。","成事问题延伸到第八、第九课。"],"start":34,"end":51,"quote":"马上开始的是什么呢？人类犯错误，主要错误可能从哪出来？或者说，你要想成一个大事，需要准备什么样的东西，把什么东西都弄好，才能成大事？我记得冯唐先生有一个叫《成事》，说得很好，不过他只能从人间的层面说，我们更多的是把人间、法界都给说了。","quoteIndex":44,"related":["ep6-k01","ep8-k01"],"section":"ep7-p34","sectionTitle":"一 开场近况与直播安排","searchText":"问道七 意义思维与错误分类 第7课 问道7 第七课：接完知识分类，再谈成事 本课先完成第六课余下的七种知识类型，再进入错误来源与成功条件。 课程导读 讲者再次说明直播用来整理思路，内容会继续修正。 成事问题延伸到第八、第九课。 一 开场近况与直播安排 一 开场近况与直播安排 大家好，百忙之中又来听我瞎唠叨。还有几分钟，咱们先简单唠唠嗑，正式8点开始。最近直播会比较频繁，因为我正好准备了一批素材，能讲多少就讲多少。大家晚上好。 那天我还查了一下，我这不脑袋上开了一个天窗嘛，开完天窗之后，能够恢复到我这种好像一点副反应都没有的，还挺少。除了现在有时候自己摸自己的脑袋，手感不太爽之外，其他还没什么太大问题。精神状态还不错，阴阳调和，哈哈。出问题是这边，但最近这边好像头发长得还挺多，不知道怎么回事。 脖子还是有点费劲。手感不太爽，它有一道疤嘛，至少骨头少了一块，就觉得手感不好。大家晚上好，咱们正式8点开始，不废话。 还好，幸亏老天爷保佑，不然万一有什么后遗症，没办法跟大家聊天了，可能这一世也就这样了。那天做手术的时候，推进去太快，后来才知道那个不能拖。我刚开始都觉得，妈的，我都没事了，你还让我做什么手术？但后来一看CT确实不行，人家说你别拖了，拖时间长了容易死，就只能推进去了。 本来说还不行转到新加坡，但新加坡再找人、再过关，又得耽误几个小时。算了，这就是命，不过还非常好。好，咱们正式开始，8点了。我们的导播同志说，你每次都不让大家点赞，这不好。请大家一定要点赞、收藏、分享，也让我们的数据好看一点。 咱们直播的意义，就是把我自己的想法先给大家讲一遍，先溜一遍脑子，看看大家的反应，自己也反复听上几遍，再进行录播。大概就这么一个意义。 这几天我一直想赶，老想把这些东西都讲完，后来觉得自己又忘了本心、忘了初心。咱直播就是为了捋一下思路嘛。之前的直播，都是哪天直播，哪天现想今天播什么，没什么章法，想起哪块播哪块。现在要做人类说明书，基础打得差不多了，就把它弄成一个成体系的东西。 有的东西想得还不是那么完整，也请大家原谅，准备得不太好。因为很多东西都是第一次面世，有想不到的地方，也有想得不合适的时候，包括语言组织也未必多好。我觉得第一遍先走上一遍。 今天咱们把上一级知识分类后面那几个快速扫一下，主要的就是上面那些东西，底下的其实不是太重要，也没太多可说的，都是人间的东西，就不多说了。 马上开始的是什么呢？人类犯错误，主要错误可能从哪出来？或者说，你要想成一个大事，需要准备什么样的东西，把什么东西都弄好，才能成大事？我记得冯唐先生有一个叫《成事》，说得很好，不过他只能从人间的层面说，我们更多的是把人间、法界都给说了。 声音有点小吗？有的人说卡，有的人说不卡，我也搞不清楚，咱们先继续。我估计人类可能犯的错误，今天百分之百说不完。说不完，周一晚上再继续，把人类犯错的东西收一下尾。 让他们关手机，还有现场给我开声音的，真讨厌，不守规矩。 可能周二、周三是正式的大课，该讲智慧了。我估计智慧一集应该能讲完，万一讲不完，再拖一天讲。我现在也不给自己定什么目标，随意讲，什么时候讲完什么时候算，不要因为一些规矩影响了随意发挥。到时候速度会快一点。好，咱们继续开始。 二 知识分类的后续内容 上期讲的是知识分类，用意义法则去分类，就是你学完这个东西到底有什么用。包括我也想了一下，咱们做直播最大的意义是什么？为了帮我捋思路。既然捋思路，为什么一定要可丁可卯地在一集之内都讲完？讲不完，下次再唠点不就完了吗？又不是做节目。如果是录播、做节目，这一集是一集，直播本身就是唠嗑的事。所以我一下子也给自己放松了，没那么多事了。 上期知识分类没讲完。 上次讲的是人性和心性。人性和心性太大了，单独出一本书都没问题，不可能在一集里面讲完。我们只是讲一个知识分类：这类知识你必须去看，对你很重要。知道这些事就行了。"},{"id":"ep7-k02","course":"ep7","number":2,"topic":"知识分类","title":"第四类：学术边界知识","summary":"本课用知识地图的比喻，说明某一领域已经研究到多深、多远。","points":["它帮助了解现有认知的边界。","是否深入学习，应结合自己是否需要研究该领域判断。"],"start":52,"end":59,"quote":"第四个知识分类，叫学术边界类知识。其实很简单，人类所有的知识，就像在一个地图上开疆破土。边界是什么？某一些知识，在整个人类版图里面，最高和最外延的点在哪里，这就是边界类知识。","quoteIndex":53,"related":["ep6-k21","ep7-k03"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第四类：学术边界知识 本课用知识地图的比喻，说明某一领域已经研究到多深、多远。 知识分类 它帮助了解现有认知的边界。 是否深入学习，应结合自己是否需要研究该领域判断。 二 知识分类的后续内容 第四类 学术边界类知识 第四个知识分类，叫学术边界类知识。其实很简单，人类所有的知识，就像在一个地图上开疆破土。边界是什么？某一些知识，在整个人类版图里面，最高和最外延的点在哪里，这就是边界类知识。 比如数学，现在出什么弦理论，这已经算边界的东西了。如果突破，人类整个档次和级别就增高了。所以它不是普通科学知识，而是整个人类对世界的认知边界到底在哪里，这非常重要。 一些伟人、科学家、哲学家、某个学术的导师，他们在哲学、逻辑、语言、科学体系上，究竟把问题研究得有多高、多深，代表人类的边界到底在哪里，这就称为学术边界类知识。 比如哲学里面，维特根斯坦说的“语言即世界”，其实在哲学某一个领域里面，基本上算很高的成就了，目前还没有比这个更高的。 像霍金研究黑洞，已经是很高的理论，目前还没有人超过他。这种东西很多，跟我们日常生活、平常老百姓几乎用不到。大概知道一下就行，别去较劲，因为咱不是搞科研的。你要搞科研，就去看看这些东西。 包括前段时间北大一个女生，把一个数学难题又解决了，还获得了奖，算是中国籍第一个获得这个奖的女性，非常厉害。这也是数学的一个边界。某个数学难题，大概将近100年没人解决，她把这事解决了，人家很厉害。知道有这么一个事就行，不用知道太多。 知道这些，就知道人类现在扩张领土扩张到哪去了。虽然没必要到那个边界去，了解一下就行。像数学、物理、化学、天文类，很容易出现边界突破，一突破，就代表人类世界的认知又往外扩张了一些。"},{"id":"ep7-k03","course":"ep7","number":3,"topic":"知识分类","title":"第五类：高维不确定知识","summary":"本课把真实性、完整性、验证性或现实适用性尚不稳定的内容列入此类。","points":["理论上的可能性，与能够稳定应用的手段需要分开。","沿用意义思维，继续判断它与当前目标的关系。"],"start":60,"end":70,"quote":"第五个知识分类，叫高维不确定，就是那些看起来非常高、非常深、非常接近终极，但在人类当前阶段，其真实性、完整性、验证性、现实性都还不稳定的知识。","quoteIndex":61,"related":["ep7-k02","ep7-k04"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第五类：高维不确定知识 本课把真实性、完整性、验证性或现实适用性尚不稳定的内容列入此类。 知识分类 理论上的可能性，与能够稳定应用的手段需要分开。 沿用意义思维，继续判断它与当前目标的关系。 二 知识分类的后续内容 第五类 高维不确定知识 第五个知识分类，叫高维不确定，就是那些看起来非常高、非常深、非常接近终极，但在人类当前阶段，其真实性、完整性、验证性、现实性都还不稳定的知识。 这也不是说都是玄学，科学、哲学和修行里面都有。比如“万法归一”，万法是不是最终归一？好像也不一定，它是理论上可推的。 就像人类物理的很多公式，正着推也行，反着推也可以。公式上可行，但现实中不能够实现，做不到。只能按时间轴正向走，按时间轴负向走肯定做不到。理论上正反都一样，实际上只能往正的方向走，不能往反的方向走。所以万法归一也属于可能性。 理论上应该归一了，但真的能归一吗？不一定。对于高维不确定的东西，只需要用意义思维理解就可以：这东西对我有没有用？现实中有没有用？没有用、应用不上，就边去，不用把它当成一回事，爱谁谁就完了。 类似“本来无一物，何处惹尘埃”，又对不起六祖，又要用他的东西来弄，因为实在太高了，高得的确应用不上，哈哈。所以每次都拿六祖举例。它也没什么用，包括“无无”，还有像“五五五”，这能不能实现？理论上好像应该有这么一个，但具体跟人间界有什么关系？鸟关系都没有，也不用太看这些东西。 科学上像暗物质，你说暗物质应不应该存在？理论上应该存在，但目前无法证明。有没有外星人？可能应该有，但有没有，反正也不关我们活得好不好。 咱们就别说外星人了，身边的这帮神佛仙鬼你都看不着，就在你身边你也看不着，没事观察什么外星人？这些高维的，就在身边差一个维度的人你都查不到，就别关心外星人的事。这属于低维——对不起，高维无用。 这类理论很可能很高、很真，也可能很接近终极，但没有办法成为普通人很稳定、很确定、能够应用的真理或者手段，实际上知道也没什么意义，纯粹浪费时间，大概知道一下就行。一定记住，甭管谁说的，谁说的都不重要。 比如我跟你们说的星魂，跟你说完有什么用？好奇听一下就完了，还真去研究？星魂确实挺重要。一个星魂至少管理几十个魂，少的几十个，多的几百个，它的能量和天赋都有总数。 很可能我这一世有点穷，能不能把其他现在不用财富的分魂的东西调过来？谁来调？星魂去调。但你有相应的手段吗？能到第三十层空间吗？都没有，所以听了也没用，就别扯了。"},{"id":"ep7-k04","course":"ep7","number":4,"topic":"知识分类","title":"第六类：工具、方法与技能","summary":"这类知识围绕具体任务提供工具、流程和执行方法。","points":["它能增加处理现实问题的能力。","工具本身不提供人生方向，仍需结合真相、方向与心性使用。"],"start":71,"end":77,"quote":"工具类的东西本身没有方向、对错，也不决定善恶。它不是方向类的，就是技能类的东西。","quoteIndex":77,"related":["ep7-k03","ep7-k05"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第六类：工具、方法与技能 这类知识围绕具体任务提供工具、流程和执行方法。 知识分类 它能增加处理现实问题的能力。 工具本身不提供人生方向，仍需结合真相、方向与心性使用。 二 知识分类的后续内容 第六类 工具方法与技能知识 第六种知识分类，叫工具、方式、方法、技能类知识。这个很重要。之前讲的知识都比较高，实际上不能马上起作用，但这种知识能够立竿见影地解决问题。 比如看了手机说明书，说不定就会用手机；考一个会计证，就能够从事会计行业；弄一个从医资格证，就可以当医生，给人正式看病。这属于技能类的东西。 类似的有工具类、方法类、技术类、流程类、软件类、技能类、系统类、操作手段、执行方法，还有现实转化的路径，都属于技能和工具类的书。 哪怕不会做菜，买一本厨艺大全跟着做做，至少先解决吃饭问题。这些非常有帮助。比如小学生不会写作文，看一本优秀作文300选，说不定就有感觉了；或者词汇大全，说不定能拽出点文了。 这些很容易立竿见影。如果想迅速改变自己的生活和命运，技能类的东西一定还是要多学。但是它不能提供方向，只能增加你被别人需要的程度，或者增加你应对生活中一些麻烦的技巧。 工具类的东西本身没有方向、对错，也不决定善恶。它不是方向类的，就是技能类的东西。"},{"id":"ep7-k05","course":"ep7","number":5,"topic":"知识分类","title":"第七类：生活与生存知识","summary":"本课列出健康、饮食、睡眠、运动、安全、基本财务和生活管理等内容。","points":["其功能是维持生活和改善生活质量。","大方向之外，现实中的基本需要也要得到处理。"],"start":78,"end":80,"quote":"第七个，叫生活和生存类知识，就是人如何活下去、如何活得稳定、活得不崩溃。比如健康、饮食、睡眠、运动、基本财务、安全常识、基本法律、工作、家庭秩序、生活管理。","quoteIndex":79,"related":["ep7-k04","ep7-k06"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第七类：生活与生存知识 本课列出健康、饮食、睡眠、运动、安全、基本财务和生活管理等内容。 知识分类 其功能是维持生活和改善生活质量。 大方向之外，现实中的基本需要也要得到处理。 二 知识分类的后续内容 第七类 生活与生存知识 第七个，叫生活和生存类知识，就是人如何活下去、如何活得稳定、活得不崩溃。比如健康、饮食、睡眠、运动、基本财务、安全常识、基本法律、工作、家庭秩序、生活管理。 这些能够让你活得更好，大概可以看看。我觉得看看也不错，它解决的是生活质量问题。"},{"id":"ep7-k06","course":"ep7","number":6,"topic":"知识分类","title":"第八类：交流与人情世故","summary":"这一类关注人与人的相处、合作和冲突处理。","points":["包括表达感谢、尊重分寸、建立信任与减少打扰。","能力之外，相处方式也会影响合作能否持续。"],"start":81,"end":86,"quote":"哪怕有些场合上的应酬，怎么表达感谢、怎么不打扰别人，都很重要。还有建立信任、价值交换、识别虚伪、处理冲突、懂得尊重。","quoteIndex":84,"related":["ep7-k05","ep7-k07"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第八类：交流与人情世故 这一类关注人与人的相处、合作和冲突处理。 知识分类 包括表达感谢、尊重分寸、建立信任与减少打扰。 能力之外，相处方式也会影响合作能否持续。 二 知识分类的后续内容 第八类 交流与人情世故知识 第八个属于交流类、人情世故的知识，非常重要。因为你活在人的世界里，人和人之间怎么相处，怎么减少冲突、形成合作，这类书籍我建议还是看一看。 包括说话的分寸、办公室政治，怎么从细微表情、动作看出一个人的情绪和心理变化，我觉得很重要。 哪怕有些场合上的应酬，怎么表达感谢、怎么不打扰别人，都很重要。还有建立信任、价值交换、识别虚伪、处理冲突、懂得尊重。 一个人能力可以很强，但说话总让人不舒服，做事不顾别人感受，不懂感恩、不懂分寸，最后别人都不愿接触他、帮助他，也不愿长期合作，再有本事也走不远。 反过来，一个人可能能力中等，但懂得尊重、配合、表达，懂得给别人安全感，反而更容易获得机会。这类知识很人间化，非常重要。"},{"id":"ep7-k07","course":"ep7","number":7,"topic":"知识分类","title":"第九类：见识扩展知识","summary":"本课把增加见闻、素材和理解角度的内容归入见识扩展。","points":["知道更多故事，不一定已经形成新的判断能力。","深入到什么程度，仍要结合学习目标衡量。"],"start":87,"end":91,"quote":"第九个，叫见识扩展类知识。扩展知识范围，增加见闻、谈资、文化感，丰富理解素材，让人知道世界上还有不同的点。","quoteIndex":88,"related":["ep7-k06","ep7-k08","ep6-k17","ep7-k12"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第九类：见识扩展知识 本课把增加见闻、素材和理解角度的内容归入见识扩展。 知识分类 知道更多故事，不一定已经形成新的判断能力。 深入到什么程度，仍要结合学习目标衡量。 二 知识分类的后续内容 第九类 见识扩展知识 第九个，叫见识扩展类知识。扩展知识范围，增加见闻、谈资、文化感，丰富理解素材，让人知道世界上还有不同的点。 类似《时间简史》《人类简史》《枪炮、细菌与钢铁》，还有很多名人传记、《百年孤独》，大量名著，写得的确非常好。但这些只是表达作者对人生或者一些事物的观点，具体能不能对你产生思想上的很大飞跃、能够提升什么，我觉得不一定。 这类东西看看就行，不用太浪费时间。一年我觉得看两三本就够了，或者连看都不用看。 让AI帮你解读一下，大概知道一个情况。别人聊《百年孤独》讲什么，你都不知道，这就有点low了。但需要花太多时间去读，甚至精读吗？我觉得不一定，大概理解就行。"},{"id":"ep7-k08","course":"ep7","number":8,"topic":"知识分类","title":"第十类：无用信息","summary":"本课以低质量八卦、谣言、骂战和无意义争论等，说明只有消耗而缺乏实际帮助的信息。","points":["观察它占据的时间与注意力。","分类的目的，是有意识地决定关注什么。"],"start":92,"end":94,"quote":"第十个就是无用的东西，对个人成长、现实、命运、判断、行动没有任何价值。比如低级八卦、网络骂战、情绪垃圾、谣言、低质量短视频、无意义争论、阴谋论垃圾，还有纯粹刺激欲望的信息，纯粹没有价值。","quoteIndex":93,"related":["ep6-k08","ep7-k07"],"section":"ep7-p48","sectionTitle":"二 知识分类的后续内容","searchText":"问道七 意义思维与错误分类 第7课 问道7 第十类：无用信息 本课以低质量八卦、谣言、骂战和无意义争论等，说明只有消耗而缺乏实际帮助的信息。 知识分类 观察它占据的时间与注意力。 分类的目的，是有意识地决定关注什么。 二 知识分类的后续内容 第十类 无用信息 第十个就是无用的东西，对个人成长、现实、命运、判断、行动没有任何价值。比如低级八卦、网络骂战、情绪垃圾、谣言、低质量短视频、无意义争论、阴谋论垃圾，还有纯粹刺激欲望的信息，纯粹没有价值。 反而越是这种东西，越占据人很多时间。我觉得这就是浪费生命。"},{"id":"ep7-k09","course":"ep7","number":9,"topic":"学习路径","title":"学习次序一：真相、方向与心性","summary":"本课将真相、方向引领、人性心性列为建立整体判断的优先内容。","points":["先理解世界，再判断方向与选择。","本节强调，更多工具不能自动修正错误方向。"],"start":95,"end":98,"quote":"这三类真正决定命运，决定一个人怎么看世界、自己和众生，往哪里走，能不能承载正确的规则。这三类没有建立起来，后面建立再多也没用。工具类、生活类建立再多，方向一旦错了，基本全白费。","quoteIndex":98,"related":["ep6-k10","ep7-k10"],"section":"ep7-p95","sectionTitle":"三 用意义思维安排学习次序","searchText":"问道七 意义思维与错误分类 第7课 问道7 学习次序一：真相、方向与心性 本课将真相、方向引领、人性心性列为建立整体判断的优先内容。 学习路径 先理解世界，再判断方向与选择。 本节强调，更多工具不能自动修正错误方向。 三 用意义思维安排学习次序 三 用意义思维安排学习次序 最后做一些总结。这十类知识，如果要改变命运、迅速提升水平，应该先看什么？先看真相类知识，再看方向指引。因为真相不了解，方向指引说多了也没用。 比如很多女孩不知道黄毛的危害，妈妈给她做方向指引，你觉得她能接受吗？肯定接受不了。所以得先有足够多的真相，再有方向引领类知识，然后看人性、心性的知识。 这三类真正决定命运，决定一个人怎么看世界、自己和众生，往哪里走，能不能承载正确的规则。这三类没有建立起来，后面建立再多也没用。工具类、生活类建立再多，方向一旦错了，基本全白费。"},{"id":"ep7-k10","course":"ep7","number":10,"topic":"学习路径","title":"学习次序二：落地能力与适量了解","summary":"工具、生存和人情世故负责把想法转为现实结果；其余类型按用途安排投入。","points":["大方向之外，要能做事、生活与合作。","学术边界、高维不确定和见识扩展，按当前需要决定学习深度。"],"start":99,"end":105,"quote":"还有人情世故，这是第二优先级要看的。这三类决定你在人间能不能活得稳、能不能做事、合作，能不能把想法变成结果。","quoteIndex":100,"related":["ep7-k09","ep7-k11"],"section":"ep7-p95","sectionTitle":"三 用意义思维安排学习次序","searchText":"问道七 意义思维与错误分类 第7课 问道7 学习次序二：落地能力与适量了解 工具、生存和人情世故负责把想法转为现实结果；其余类型按用途安排投入。 学习路径 大方向之外，要能做事、生活与合作。 学术边界、高维不确定和见识扩展，按当前需要决定学习深度。 三 用意义思维安排学习次序 第二类，是在现实中马上能落地的，比如工具、方式方法、生存类知识，我觉得也非常重要。 还有人情世故，这是第二优先级要看的。这三类决定你在人间能不能活得稳、能不能做事、合作，能不能把想法变成结果。 前面三类是人生大方向，大方向别走错了，但不能解决下一顿饭怎么办。方向都对了，现在要解决吃饭问题，还不如去做个包子店。方向问题不解决吃饭问题，不解决这月工资从哪来。所以第二类也很重要，哪怕多研究研究怎么做包子，也不至于饿死。 第三类，叫学术边界和高维不确定的东西。 高维不确定的东西可以看看，代表人类至少某一层次的边界，人类世界的认知扩张到哪里，想得有多高、多宽。少量看就行，因为跟生活没太大关系，不要太多研究。 少量了解即可的知识，叫见识扩展类知识。比如看看《百年孤独》《人类简史》《时间简史》。 这些也可以，开眼界，跟人聊天、吹的时候，至少咱博学，哈哈。然后要远离无聊的东西，其实也不能说远离，上厕所、睡觉前需要酝酿感情的时候可以看看，或者吃饭时旁边放点东西、开车时旁边放点东西，属于干这事。"},{"id":"ep7-k11","course":"ep7","number":11,"topic":"意义思维","title":"知识分类的四种常见混淆","summary":"本节总结把高深当可用、把短期当长期、把见识当认知，以及有工具却缺方向等问题。","points":["当前能不能承接，与理论是否高级是不同问题。","工具和信息的增加，需要放回方向、心性和长期结果中衡量。"],"start":106,"end":110,"quote":"真正的智慧，不是知道得有多多，而是知道什么应该学、什么不应该学，什么该深学，什么只需略微知晓；什么知识可以改命，什么东西会耗你的命。","quoteIndex":109,"related":["ep6-k04","ep7-k12","ep7-k10"],"section":"ep7-p95","sectionTitle":"三 用意义思维安排学习次序","searchText":"问道七 意义思维与错误分类 第7课 问道7 知识分类的四种常见混淆 本节总结把高深当可用、把短期当长期、把见识当认知，以及有工具却缺方向等问题。 意义思维 当前能不能承接，与理论是否高级是不同问题。 工具和信息的增加，需要放回方向、心性和长期结果中衡量。 三 用意义思维安排学习次序 知识分类最后的总结是什么？人类不是缺知识，而是缺少对知识的分类。 很多人把高维知识当成当前可用的知识，陷入高维正确陷阱；把短期有效的东西当成真正有用的东西，遭到长期反噬；把见识扩展类知识当成认知提升，生命被大量消耗。 很多人掌握了工具、方式、方法，却没有真相、方向和心性，最后把错误的事情越做越大；追求学术边界、高维不确定知识，却没有解决现实人生的基本问题。 真正的智慧，不是知道得有多多，而是知道什么应该学、什么不应该学，什么该深学，什么只需略微知晓；什么知识可以改命，什么东西会耗你的命。 什么短期有效但长期有害？什么短期无感但长期有大用？所有东西一定要用意义思维去审定。"},{"id":"ep7-k12","course":"ep7","number":12,"topic":"意义思维","title":"选一条知识时，再过一遍意义思维","summary":"本课最后把知识分类落到当下的选择上。","points":["它起什么作用，属于哪一类？","是否适合当前阶段，能否落地？","在更长时间里，能否持续产生正向结果？"],"start":110,"end":113,"quote":"我此时此刻看的东西，对我在人生里面起到什么作用？属于哪一类？适不适合当前阶段？能不能落地？能不能在更长时间里产生正向结果？只有经得起时间检验、能持续产生正向结果的知识，我觉得对我们才非常有用。","quoteIndex":111,"related":["ep5-k15","ep10-k26","ep7-k11","ep7-k07","ep10-k12"],"section":"ep7-p95","sectionTitle":"三 用意义思维安排学习次序","searchText":"问道七 意义思维与错误分类 第7课 问道7 选一条知识时，再过一遍意义思维 本课最后把知识分类落到当下的选择上。 意义思维 它起什么作用，属于哪一类？ 是否适合当前阶段，能否落地？ 在更长时间里，能否持续产生正向结果？ 三 用意义思维安排学习次序 什么短期有效但长期有害？什么短期无感但长期有大用？所有东西一定要用意义思维去审定。 我此时此刻看的东西，对我在人生里面起到什么作用？属于哪一类？适不适合当前阶段？能不能落地？能不能在更长时间里产生正向结果？只有经得起时间检验、能持续产生正向结果的知识，我觉得对我们才非常有用。 知识分类说完了，开始今天主要的东西。先喝口水，叫错误，在错误中成长吧。我还没想好具体叫什么名字，叫成事宝典也行。 大家先点个赞、分享一下、收藏一下，别费了半天劲，最后连几个分享收藏都没有，数据不好看。我稍微休息，再等几十秒，8点30分正式开始。"},{"id":"ep7-k13","course":"ep7","number":13,"topic":"成事条件","title":"失败可能发生在整条成事链上","summary":"本课将做事拆成之前、之中、之后，反对用单一性格或努力程度解释所有失败。","points":["条件、信息、分析、执行、身体、情绪、关系与修正，都可能出问题。","查找具体失效环节，是理解错误来源的起点。"],"start":114,"end":127,"quote":"人在条件、真相、分析、研究、执行、掌握、身体承载、心性、情绪、人际关系和反馈修正这些系统环节中，任意一层发生失真、失控或者失效，都会导致判断和行动出错。一旦出错，就要承担失败的后果。","quoteIndex":122,"related":["ep7-k14"],"section":"ep7-p114","sectionTitle":"四 成事中的错误与七个环节","searchText":"问道七 意义思维与错误分类 第7课 问道7 失败可能发生在整条成事链上 本课将做事拆成之前、之中、之后，反对用单一性格或努力程度解释所有失败。 成事条件 条件、信息、分析、执行、身体、情绪、关系与修正，都可能出问题。 查找具体失效环节，是理解错误来源的起点。 四 成事中的错误与七个环节 四 成事中的错误与七个环节 你们现在还卡？真奇怪，最近老是卡，逼着我要换地方。我们已经新建了直播间，以后换个地方，不在这个小区了，这小区风水不好，决定换个好点的地方。 好，正式开始，8点30分。本来想讲意义思维在分析错误上的一些应用，后来想这时间有点太长，咱们先说结论。今天肯定讲不完，就讲到9点30分，讲一个小时，看能讲到哪。 我们说的是人类在成事上容易犯的错误。把错误都讲了，你不犯错误，不就容易成事了吗？也可以理解成成事宝典。冯唐也有《成事》，人间部分咱们肯定没有人家丰富，但总体框架上，我们肯定考虑更多因素。 想成功，不是简单一句“这个人太笨、太蠢、太情绪化、没努力”就能解释清楚的。真正看透，要分三个阶段。这不是小事，是人生做一些大事：做事之前、做事之中、做事之后，整条链路得学会拆开看。 为什么一个人会出错？可能做事之前就压根没有成功条件，也可能从来没有接触过能够让他成功的真相。看到的信息不真、不全、不对，也可能是低维的。也可能分析、学习、研究的能力不足，或者做着做着碰到压力，顶不住压力和阻力。 最后，有可能身体撑不住了。比如那个是叫张雪峰吧，就属于身体撑不住了。还有把个人情绪和不好的心性带给大家，大家产生反感，导致出问题；有可能用错人、看错人、处错关系；当然也有不会复盘、不承认错误、不愿修正。 人类犯错误有很多点，不是单点缺陷就完了，而是在整个成事链条里面，任何一层发生问题，都容易出现失真、失控和失效。 人在条件、真相、分析、研究、执行、掌握、身体承载、心性、情绪、人际关系和反馈修正这些系统环节中，任意一层发生失真、失控或者失效，都会导致判断和行动出错。一旦出错，就要承担失败的后果。 一个人想成大事，本身就是系统工程。想成就的事情越大，越需要方方面面都不能失败。所以成功的人或者能力、能量巨大的人，你会发现很少。成功的人总是千篇一律，失败的人各有不同，因为不定是在这坎失败，还是在那坎失败。 比如稻盛和夫、巴菲特、段永平，基本都是一个模子出来的，所以可以做得很成功，而且能够穿越经济周期。马斯克能不能穿越经济周期，都不好说，现在只不过还在势头上。他犯错误的概率不大，但还是有。 至少在几十条甚至上百条成功因素中，基本全部都要占优，而且不能犯太大的问题，才能保证最终成功的可能性。 互联网上，尤其海外互联网，能成为很厉害的大V的，能力、心性、品质基本都差不多。反而底下做不起来的，多多少少会有问题。 就算一时运气爆棚，偶尔成功了，基础素质出了问题，最终失败也只是早晚的事。有点像拼图，哪怕差一块，整个图版都不完整；也像木桶原则，差一块木板，积不了水，就算积上了，早晚也得漏光。"},{"id":"ep7-k14","course":"ep7","number":14,"topic":"成事条件","title":"成事的七个大方向","summary":"本课给出贯穿后续两课的七项框架。","points":["一：条件与真相；二：分析、学习、研究。","三：执行掌控；四：身体承载；五：心性与情绪。","六：人与人之间的问题；七：反馈修正。"],"start":128,"end":139,"quote":"按这七个大方向修行自己，做一个事才不容易失败，不然很容易失败。为什么很多人不成功？","quoteIndex":137,"related":["ep7-k13","ep9-k22","ep7-k15"],"section":"ep7-p114","sectionTitle":"四 成事中的错误与七个环节","searchText":"问道七 意义思维与错误分类 第7课 问道7 成事的七个大方向 本课给出贯穿后续两课的七项框架。 成事条件 一：条件与真相；二：分析、学习、研究。 三：执行掌控；四：身体承载；五：心性与情绪。 六：人与人之间的问题；七：反馈修正。 四 成事中的错误与七个环节 成事的七个大方向 我们总结了成套体系，需要在七个大部分上注意。还是只说大框，不做细致分析，因为细致分析又是一本书，东西太多。只是让大家了解方向，细致的等未来有时间再弄。什么都弄得特别细，那就别讲了。 第一，条件和真相。没干事之前，必须提前具备。 第二，这两个具备之后，才是分析、学习、研究的能力，说白了就是自我迭代。 第三，执行掌控。 第四，身体不要出问题。 第五，心性和情绪。 第六，人与人之间的问题。 第七，修正反馈。 按这七个大方向修行自己，做一个事才不容易失败，不然很容易失败。为什么很多人不成功？ 把这七项都做成功的人很少，七项里面又有很多细节，一会儿再讲。我估计今天条件和真相能不能讲完，都是一个事。底下第二条到第七条，反而不是我应该讲的重点，都是人间的正确、人间的东西，包括学MBA，这些是人间已经掌握的东西。 人间已经掌握的，咱们不重点讲。我专门讲人间掌握不了的东西，这是我们应该多讲的。"},{"id":"ep7-k15","course":"ep7","number":15,"topic":"成事条件","title":"先检查条件，再讨论怎么做","summary":"在本课框架中，行动前先问有没有成事条件，以及看见的信息是否真实。","points":["条件部分列出机缘、贵人、天赋、福报、因果业力与冤债、高维对抗、环境与意外。","其中涉及法界的解释，属于讲者采用的宗教前提。"],"start":140,"end":144,"quote":"第一部分叫条件和真相。为什么放在前面？因为人在真正分析、学习、研究、执行之前，最先遇到的不是会不会做、努力不努力，而是两个更基本的问题：有没有成事的条件？到底有没有看到过真实的真相？","quoteIndex":141,"related":["ep7-k14","ep8-k01","ep7-k16"],"section":"ep7-p140","sectionTitle":"五 做事之前的条件与真相","searchText":"问道七 意义思维与错误分类 第7课 问道7 先检查条件，再讨论怎么做 在本课框架中，行动前先问有没有成事条件，以及看见的信息是否真实。 成事条件 条件部分列出机缘、贵人、天赋、福报、因果业力与冤债、高维对抗、环境与意外。 其中涉及法界的解释，属于讲者采用的宗教前提。 五 做事之前的条件与真相 五 做事之前的条件与真相 第一部分叫条件和真相。为什么放在前面？因为人在真正分析、学习、研究、执行之前，最先遇到的不是会不会做、努力不努力，而是两个更基本的问题：有没有成事的条件？到底有没有看到过真实的真相？ 一个人没有真正的机缘，没有碰到真相的机缘，也没有成事的机会，没有贵人引导、相应天赋、相应福报，又容易被因果业力、冤债、高维对抗、环境和意外干扰，再努力也没用。 第一部分分两块，一是条件，一是真相。条件这坎，法界的东西会多一些。一个人开始做事之前，或者事情已经开始存在了，能够影响他的东西是什么？首先是机缘，第二贵人，第三天赋，第四福报，第五因果业力与冤债，第六高维对抗，第七环境与意外。 用到的就是经常说的法界成像。既然读了《道德经》，就知道“天下万物生于有，而有生于无”。什么是阴阳，什么是有无？学了咱们很多东西，一定要明白。"},{"id":"ep7-k16","course":"ep7","number":16,"topic":"成事条件","title":"本课如何用“法界成像”解释条件","summary":"讲者以法界成像说明为何反对看到他人成功后直接照搬。","points":["本节的因果解释沿用讲者的信仰体系。","其贯穿的提问是：自己是否具备对方的条件，投入是否匹配？"],"start":145,"end":155,"quote":"任何东西，阳间呈现的叫显化，但在阳间显化之前，法界必须提前成像。这就是我为什么不希望大家盲目跟风的主要原因。人家做成功了，你就去做成功，这不可能。","quoteIndex":146,"related":["ep7-k15","ep7-k17"],"section":"ep7-p140","sectionTitle":"五 做事之前的条件与真相","searchText":"问道七 意义思维与错误分类 第7课 问道7 本课如何用“法界成像”解释条件 讲者以法界成像说明为何反对看到他人成功后直接照搬。 成事条件 本节的因果解释沿用讲者的信仰体系。 其贯穿的提问是：自己是否具备对方的条件，投入是否匹配？ 五 做事之前的条件与真相 法界成像与盲目跟风 任何东西，阳间呈现的叫显化，但在阳间显化之前，法界必须提前成像。这就是我为什么不希望大家盲目跟风的主要原因。人家做成功了，你就去做成功，这不可能。 马云做成功了，你试试，就算各个条件比马云高，没有人家的气运和法界成像，也做不成功。比如我这行，应该算做人类说明书这一块，再大的努力，想超过我，可能性也没有，因为你身上没有法界成像，没有那种成像机制。 法界没有成像，再努力也不可能成功。对于绝大多数人类来说，时间基本就放在了根本没有这命、没有这运的东西上。 我有时候一直说，“王侯将相宁有种乎？”从人间层次说，不应该有，但从法界说，的确有。别管出生是什么，哪怕像朱元璋，出生就是一个碗，家里都饿死了，只要法界能成像、有帝王命，走着走着一定能当皇帝。 别管出生家庭多好，没有当帝王的命，再怎么努力，再怎么“布化”，这事也跟你没关系。本身不具备，就别在那扯。 人类不知道法界成像是前提条件，很多人把一生浪费在这些没有意义的事情上。所以一定要抓好自己的气运。尤其心念很高，觉得此生不平凡，不想做普通人，一定先确定是不是气运之子、气运之女。如果不是，把自己定义成能够抱老大大腿的人，也能沾光。 大哥大姐的大腿抱不上，踏踏实实做个普通人，别想太多。人类大量痛苦，就是在根本不可能的道路上努力。 比如学习，很多人认为逼着孩子学习，学好了就能改变命运。你们家孩子是不是学习那块料，心里没点数？比如我儿子，他就不是学习这块料，现在还上幼儿园，我就知道这事。你觉得我会逼他学习吗？根本不可能吃学习这碗饭。他能把老爹的事接班，我就阿弥陀佛了。所以不要让他在不可能成功的事上努力。 第二，很多人一生都想创业。你有创业的命，有挣大钱的命吗？不是那类人，就别想。创业能做多大也很重要。创业能成功，就去创业；不成功，别在那混。经济好的时候，混混也行，大不了半死不活，不亏钱还不至于。 但经济大萧条的时候，想创业成功，说白了，不是玩野路子的，不是资源很厉害、优势非常强的，尤其在互联网上，不能在某一个细分行业数一数二的，就别扯这蛋了。浪费自己时间，浪费家里财力，也浪费很多人。很多人追求了今生根本不可能追求的东西，所以一定记住，法界成像很重要。"},{"id":"ep7-k17","course":"ep7","number":17,"topic":"成事条件","title":"积累之财：讲者对自身路径的解释","summary":"讲者用自己的经历和命理理解，说明为何把长期做事积累作为挣钱路径。","points":["这是讲者对自身选择的解释。","本节继续讨论选择与个人条件是否对应。"],"start":156,"end":161,"quote":"就跟我似的，能不能有钱？首先要查法界成像。你的有钱，是积累之富、积累之钱。未来积累足够多，还算有钱人。但以我现在都50岁了，估计怎么也得10年、20年后慢慢积累，因为钱属于积累之财，跟暴富命没关系。","quoteIndex":157,"related":["ep7-k16","ep7-k24"],"section":"ep7-p140","sectionTitle":"五 做事之前的条件与真相","searchText":"问道七 意义思维与错误分类 第7课 问道7 积累之财：讲者对自身路径的解释 讲者用自己的经历和命理理解，说明为何把长期做事积累作为挣钱路径。 成事条件 这是讲者对自身选择的解释。 本节继续讨论选择与个人条件是否对应。 五 做事之前的条件与真相 积累之财与自己的挣钱方式 就跟我似的，能不能有钱？首先要查法界成像。你的有钱，是积累之富、积累之钱。未来积累足够多，还算有钱人。但以我现在都50岁了，估计怎么也得10年、20年后慢慢积累，因为钱属于积累之财，跟暴富命没关系。 所以别想这事。有人说，师父，不行去投资点东西吧。你看看自己的命盘，只能靠事业宫，通过做事提升命运和财力，紫微上写得很清楚，没事投资去？ 投资的本质是什么？别人帮你努力，你坐享其成。有那命吗？命局的挣钱格局不是这个，投资能挣到钱？包括我们用仙家给很多人看股票，你看我买过吗？没这命就别使劲，踏踏实实干活就完了。 一定跟自己的东西对上。至少我这辈子还算能通过几十年努力挣点小钱，大钱肯定不能挣。一会儿说天赋，我就很郁闷，这他们的，这种天赋都注定不能富。 太有钱不可能，尤其太早有钱，你还会传法吗？没事研究这东西？不经历点苦难，能让你想出来？所以肯定得先穷。等快咽气了，一看，终于挣了点钱，妈的，也没来得及花，嘿嘿，这就是命。"},{"id":"ep7-k18","course":"ep7","number":18,"topic":"机缘与贵人","title":"机缘分两种：遇见真相与遇见成事机会","summary":"本课将接触信息的机会，与实际做成一件事的机会分开。","points":["能遇到真相，不等于已经具备成事条件。","先看见足够的信息，才有后续归纳与判断的材料。"],"start":162,"end":168,"quote":"第一个先说机缘。机缘拆成两部分：碰到真相的机缘，成事的机缘。一个解决能不能见到真实的东西，一个解决能不能遇到能成的事，这是两个东西。","quoteIndex":163,"related":["ep6-k16","ep8-k02","ep7-k19"],"section":"ep7-p162","sectionTitle":"六 机缘之一 遇到真相的机会","searchText":"问道七 意义思维与错误分类 第7课 问道7 机缘分两种：遇见真相与遇见成事机会 本课将接触信息的机会，与实际做成一件事的机会分开。 机缘与贵人 能遇到真相，不等于已经具备成事条件。 先看见足够的信息，才有后续归纳与判断的材料。 六 机缘之一 遇到真相的机会 六 机缘之一 遇到真相的机会 第一个先说机缘。机缘拆成两部分：碰到真相的机缘，成事的机缘。一个解决能不能见到真实的东西，一个解决能不能遇到能成的事，这是两个东西。 碰到真相的机缘，还不是真相，只是能不能碰到真相的机会，非常重要。之前讲过思维茧房、破圈，破圈很重要。碰到真相的机缘，是指有没有机会接触能够让你飞黄腾达、真正有用的东西。 还是举海外一些大V的例子，讲经济、政治、历史、国情、现实、世界新闻的，人家的见识不是你想学就能学。没有那个命、那个机缘，想去撵他们，根本撵不上。 人家讲的东西，你就觉得，都从哪听的？太有意思了，听得如痴如醉，听完觉得学习了，这是海外大V非常厉害的地方。 咱们讲天道认知也是一样，想超过我的水平挺费劲。十多年里面，我见过的东西也不是他们能看到的。没看到这些，怎么产生相应认知？别费劲，有什么样的机缘，就能看到什么样的真相。一旦看到，就会产生不一样的认知；认知能超越别人，就非常厉害。 真相至少分成三种。"},{"id":"ep7-k19","course":"ep7","number":19,"topic":"机缘与贵人","title":"跟风真相、行业真相与高维真相","summary":"本课按接触到的信息类型，进一步讨论机会来源。","points":["跟风真相：先接触某些已有做法与机会。","行业真相：来自行业经验与接触。","高维真相：本课对天道、法界相关叙述的称呼。"],"start":169,"end":181,"quote":"网上这些很厉害的大V，比他们总结能力更强的人，一定存在，只不过没那命。像人类探索世界，先看到足够多的真相，再归纳、总结、找规律，最后形成一套体系。","quoteIndex":176,"related":["ep6-k11","ep8-k24","ep7-k18","ep7-k20"],"section":"ep7-p162","sectionTitle":"六 机缘之一 遇到真相的机会","searchText":"问道七 意义思维与错误分类 第7课 问道7 跟风真相、行业真相与高维真相 本课按接触到的信息类型，进一步讨论机会来源。 机缘与贵人 跟风真相：先接触某些已有做法与机会。 行业真相：来自行业经验与接触。 高维真相：本课对天道、法界相关叙述的称呼。 六 机缘之一 遇到真相的机会 跟风真相 行业真相与高维真相 第一种，叫跟风真相。现在可能比较难弄，但当年百度、新浪、淘宝、快递行业、电动车，还有可回收火箭，这都叫跟风。比别人更先接触这些东西，就很容易把海外先进的东西引入国内，这是90年代、00年代那帮人干的事。 百度、新浪、淘宝、快递、电动车，还有现在玩火箭回收的这帮人，不都是抄外国的吗？这叫跟风下海。能见到真相，在我们那个年代就很厉害。 像百度，我们那会儿还努力用调制解调器上网，插根电话线，嘣嘣嘣嘣，弄一堆事，最后上网了，还特别慢，偶尔打开几个网页就觉得很厉害。人家在美国，早经历过这些。没有人家那个经验，也没办法。 第二，叫行业真相。还是外网那几个很厉害的大V，讲政经、历史、经济、人生，没有一定高度的接触，根本不可能讲出来那些东西。所以非常重要。 第三，我们这种叫高维真相，天道之事、法界之事。真相大概分这几类。 想成为一个行业的翘楚，至少要接触行业的顶级真相，不然想成大事，绝对不可能。包括国美也是，人家赶上机会。能看到真相的人所创造的东西，也没什么太新鲜。包括我，我相信比我聪明的人很多，假设他们能够看到我所看到的真相，相信总结得会比我更厉害。 网上这些很厉害的大V，比他们总结能力更强的人，一定存在，只不过没那命。像人类探索世界，先看到足够多的真相，再归纳、总结、找规律，最后形成一套体系。 只不过人家有机会接触，你没机会接触，想成体系，对不起，做不到，不是脑子好使就可以。 所以为什么我说，真相来源于缘分，修行最终就是一场善缘，这很重要。什么东西跟你有缘，什么允许你超过别人、看到更有用的东西，就决定高度和方向，也决定努力有没有价值。像我这样能看到天道真相的，只不过有机缘能看到，你没有而已，所以修一场善缘非常重要。 做不到怎么办？只能一辈子在低维信息圈打转。接触不到真正的人、法、规则、门路，也接触不到真正能让你开窍的东西。这不是努力不努力，努力也没用，只是没有碰到真相的机缘。 一个人没有碰到机缘，可能学了很多东西，但都是浅的、碎的、假的、普通层面的。可能非常努力，但也只能在低层次循环。 碰到真相的机缘，看的是有没有机会接触真正接近本质、规则、高维、核心的东西，最后一定会让你产生独特、惊艳、数一数二的优势。"},{"id":"ep7-k20","course":"ep7","number":20,"topic":"认知与思维","title":"现有圈子还能带来新的认识吗？","summary":"讲者用交流中是否出现新信息与新思路，反思认知环境是否停滞。","points":["关注交流有没有增加自己原先不知道的东西。","本课以震撼感和求知意愿描述个人体验。"],"start":182,"end":185,"quote":"怎么判断自己一直处于平庸中？认识的所有人说话时，已经没有任何新鲜感，没有对知识渴望的情绪波动，一切都很平常，就代表这个圈子给你产生的知识或者认知，已经很难帮助你突破，就这么简单。","quoteIndex":185,"related":["ep6-k13","ep7-k19","ep7-k26"],"section":"ep7-p162","sectionTitle":"六 机缘之一 遇到真相的机会","searchText":"问道七 意义思维与错误分类 第7课 问道7 现有圈子还能带来新的认识吗？ 讲者用交流中是否出现新信息与新思路，反思认知环境是否停滞。 认知与思维 关注交流有没有增加自己原先不知道的东西。 本课以震撼感和求知意愿描述个人体验。 六 机缘之一 遇到真相的机会 怎么判断圈子能否帮助自己突破 怎么判断遇到了很好的圈子？很简单，听别人讲的东西，对你是一种震撼，是一种渴求的状态。跟这个人在一起，有可能提升认知。 怎么判断自己成为了别人渴望的圈子？现在你说话、讲话，一堆人围着愿意听，并且很饥渴，想得到你的知识，你就成为别人期望遇到的圈子。 怎么判断自己一直处于平庸中？认识的所有人说话时，已经没有任何新鲜感，没有对知识渴望的情绪波动，一切都很平常，就代表这个圈子给你产生的知识或者认知，已经很难帮助你突破，就这么简单。"},{"id":"ep7-k21","course":"ep7","number":21,"topic":"成事条件","title":"收入分层讨论：先分清收入与流水","summary":"讲者以不同收入区间展开成事机会的讨论，并反复区分拿回家的收入与经营流水。","points":["相关薪资、门槛与财富层级，均属于本次试讲的举例与估计。","案例把行业位置、特长、机会和资源放在一起讨论。"],"start":186,"end":209,"quote":"第二，能够遇到成事的机缘。成小事靠福报，成大事靠天运。正好细谈一下收入。收入是揣到兜里、能够拿回家的钱，不是流水。","quoteIndex":187,"related":["ep7-k22"],"section":"ep7-p186","sectionTitle":"七 机缘之二 遇到能够成事的机会","searchText":"问道七 意义思维与错误分类 第7课 问道7 收入分层讨论：先分清收入与流水 讲者以不同收入区间展开成事机会的讨论，并反复区分拿回家的收入与经营流水。 成事条件 相关薪资、门槛与财富层级，均属于本次试讲的举例与估计。 案例把行业位置、特长、机会和资源放在一起讨论。 七 机缘之二 遇到能够成事的机会 七 机缘之二 遇到能够成事的机会 第二，能够遇到成事的机缘。成小事靠福报，成大事靠天运。正好细谈一下收入。收入是揣到兜里、能够拿回家的钱，不是流水。 年收入十万元以下到一百万元 第一个，年收入10万元以下。我觉得费不了多大福报，就凑合活着，踏踏实实活着，什么都别想，做到这件事就行，以最低生活标准活着就可以了。 第二，年收入10万到30万元，尤其接近30万元的，在普通大众里面已经算优秀者。如果房车都有、没有贷款，在中国这个环境里，应该是生活非常舒服的阶层。大事做不了，但小日子只要不嘚瑟，还是挺滋润的。 偶尔吃个小烤串，没什么问题。比如明天我又要喝小啤酒，所以今天讲不完，明天也不讲，不能耽误我喝小啤酒的时间。属于这样，大钱没有，小钱还有一点，也能让孩子上上学，但别指望太大投入和支出。家人没有太大病灾，或者想实现的东西，还是可以的。 国内不要富游，一年一两次旅游问题不大，出国有点穷游，但还可以。这是年收入30万元以下，还是挺不错，而且税务局也不会找你，也不会有人盯着什么事，所以30万元以下工资还是可以的。 如果年收入达到30万到50万元，就叫小有成就。普通工人、打工的人想达到这个生活水平，尤其在经济大萧条的情况下，已经算很厉害。 很多大厂员工能达到年收入30万到50万元，已经是在优秀的人里面比较优秀的。如果年收入50万到80万元，一般是什么水平？得是985或者211、博士以上学历，还得是热门专业。咱不说超一流985，清华北大不算，说普通985、211博士，还要热门行业，普通行业基本做不到。 50万到80万元，国内的还行。80万到100万元，就得比较好的，比如清华北大博士、热门行业，或者海外名校博士、热门行业，能回国基本是这个。但都在海外博士、热门行业了，没事回国干什么？我也不知道咋想的。 100万元，请大家记住，对于人间界是很重要的分水岭。对普通人，基本就是一生的天花板。这是收入100万元，不是流水，不是公司流水。打工能达到年薪100万元，绝对万里挑一，非常艰难。 自己创业、做生意，年收入100万元，也得有一定的机缘机会。 比如得有比较厉害的特长，或者进入很厉害的行业。我年轻时，房地产还比较热，那帮小老板、包工头赶上好时期，年收入100万元问题不大。 记得当时中关村理想大厦刚开工，一帮小工头开着小面包、破桑塔纳来。 理想大厦盖完，装修都完了，这帮家伙基本换车了，要不宝马，要不奥迪A6。大概这水平。必须有很厉害的特长，或者进入较好的行业，正好赶上行业上升期。 要不就是有大哥大姐带。比如深圳的“水杯市场”，可以没学历。我见过给人干活、拉车的小伙子，嘴勤快，人也勤快，看着踏实，大哥大姐叫得很好。人家说什么东西归你了，给了一个机会，100万元挣到手，很容易。 但这是不打工的。打工想挣100万元，远比创业、做生意挣100万元难得多。到100万元这个阶层，多多少少得有点机缘、气运和能力，普通人已经很难了。 从100万元以上再说，就会发现不是靠能力，而是要靠一定气运。收入幅度越高，需要气运足够多，不是说能力很强。当然，能力也很重要。 年收入一百万元到一千万元 100万到300万元，年收入能够到300万元，拿回家这部分钱能到这个水平，需要在一个行业里面小有成就。至少在一个小城市，或者比较好的县城，普通县城还达不到。 在一个小行业里算比较知名，一提这个小城市、较好的县城，比如做洗车的，你们家是老大，恨不得得这样。没有这个东西，都不太容易。 300万到500万元，所需福报是另外一个层次，基本在中等城市里能做得小有名气。真拿500万元回家，生意怎么着得做一两千万、2000万到3000万元左右，还得是利润率较好的。 做电商，很可能做到5000万元或者1亿元，能不能拿500万元回家还是一个事，大概这样。 500万到1000万元，注意，1000万元又是一个坎。福报能够上升到拿1000万元入自己口袋、拿回家，生意至少得3000万到4000万元以上体量。做三四千万元，拿1000万元回家，已经算暴利了。这里说的不是销售额，是收入。"},{"id":"ep7-k22","course":"ep7","number":22,"topic":"成事条件","title":"富贵年限与灵魂等级：本课的宗教叙述","summary":"本节用客户故事和灵魂等级，解释讲者理解中的福报与财富承载。","points":["故事中的前世、功德与等级对应关系，保留为讲者的解释。","阅读时可对照第八课继续讨论的福报与承载能力。"],"start":210,"end":227,"quote":"比如之前说过东北一个学生，也不能说学生，人家没跟我学，是客户。一个长得很漂亮的大眼美女，我看她一年挣100多万元，现在肯定挣不到了，也就10年气运。长得漂亮，能挣钱，也有朋友帮她，主要也有朋友帮。大概是200年守护一个村庄。","quoteIndex":212,"related":["ep7-k21","ep7-k23"],"section":"ep7-p186","sectionTitle":"七 机缘之二 遇到能够成事的机会","searchText":"问道七 意义思维与错误分类 第7课 问道7 富贵年限与灵魂等级：本课的宗教叙述 本节用客户故事和灵魂等级，解释讲者理解中的福报与财富承载。 成事条件 故事中的前世、功德与等级对应关系，保留为讲者的解释。 阅读时可对照第八课继续讨论的福报与承载能力。 七 机缘之二 遇到能够成事的机会 富贵年限与福报的案例 每年能够拿1000万元以上回家，已经不是普通人的区域。就算天界之上，也必须上仙以上级别。 比如之前说过东北一个学生，也不能说学生，人家没跟我学，是客户。一个长得很漂亮的大眼美女，我看她一年挣100多万元，现在肯定挣不到了，也就10年气运。长得漂亮，能挣钱，也有朋友帮她，主要也有朋友帮。大概是200年守护一个村庄。 这个功德换了大概10年左右、每年100多万元净利润的福报，也就这水平。长得真挺漂亮，眼睛很大，我见过本人。没见本人时，我还怀疑那眼睛是不是特效弄的，见过之后发现真不是特效，确实挺大。所以一定记住，很难。 记得还有一哥们，以前一个女同事的老公，好像跟着餐饮协会的老大混，当时给他很多资源，也是十年富贵。那十年里，我估计一年肯定上不了500万元，也就两三百万元。爱嘚瑟，换换车，也就这水平。 这是什么？前世一世在佛前供灯，换了可能不到10年富贵。之后好像做人把上面领导得罪了，人家不理他，不给资源，马上打落尘埃。 如果一年挣100万元以上，普通人大概得修行一辈子，换那么10年；那只小狐仙200年换10年，大概这水平，很不容易。 每年能拿1000万元以上，天上至少得上仙以上级别才有这样的福报。普通仙人能够拿三五百万元，就算很不错、很厉害了。 现场延伸 灵魂等级与上古神兽 尤其天界小婢女、小丫头、小金鱼、小灵兽，想换这个很费劲。看你们又说天庭财神殿的，人家神兽级别不一样，人都上古年代的。 上古之前没有人，只有两种生物，一种天生灵物，一种神兽。包括女娲、伏羲，有一个像，腰部以下蛇身缠在一起，上半身是人。 所以那个时候，大家还没选好人应该长什么样，没有决定出来，就没有人。我徒弟说人家是畜生，说这话被人抽活该。应该说神兽，而且上古神兽，不是上古神兽，说白了没有用。 师门也一样，真正业绩好的，还得是之前很厉害的，比如我之前左右护法。级别如果低，根本撑不起重要的事。 我这种没什么财富，但传法这事能撑起来。我当年是什么？至少是“第十三海的界主”吧，相当于第十山海界的一界之主。才有这种灵魂级别，普通人想弄不行。手底下做得比较好的，也都是一界之主，只不过第十山海下面的一界。那时候打位面战争，很多位面，你至少得一个位面之主，福报等级和各方面才行。 又有点说多了。很多事跟普通老百姓没啥关系，凑合过着就完了，别想那些。真正改变世界、大富大贵的，哪个灵魂等级低？甭管出生可能就是泥腿子，说白了没有灵魂等级低的。能挣几十亿元，灵魂等级能低吗？ 所以当年只能说人家神兽，不能说畜生，这肯定不对。 像观音，也是先天灵物，就是一块紫色玉石；孙悟空不也是先天灵物？“造化金良”也是先天灵物。狮驼岭那仨，哪个水平低？不是先天灵物，是先天神兽。像唐僧、金蝉子，洪荒十大凶兽之一吧，创造的杀戮少了？ 上仙不是星君，还差一级。扯多了，跟你们一开火车，就不知道开哪去了。"},{"id":"ep7-k23","course":"ep7","number":23,"topic":"成事条件","title":"更高收入与行业位置的讲述","summary":"本课继续将团队、资源、行业位置与气运联系起来讨论。","points":["收入规模、行业排名与福报等级的对应，是讲者当时的说法。","本节也包含其对行业使命与“应运而生”的宗教解释。"],"start":228,"end":260,"quote":"一年挣3000万元，需要星君以上的福报。为了挣这点钱，要打通银行、政府、市场、销售手法、促销各环节，还有自己的团队。智慧等级、团队等级都非常厉害。","quoteIndex":235,"related":["ep7-k22","ep8-k14"],"section":"ep7-p228","sectionTitle":"八 更高收入层次与气运的讲述","searchText":"问道七 意义思维与错误分类 第7课 问道7 更高收入与行业位置的讲述 本课继续将团队、资源、行业位置与气运联系起来讨论。 成事条件 收入规模、行业排名与福报等级的对应，是讲者当时的说法。 本节也包含其对行业使命与“应运而生”的宗教解释。 八 更高收入层次与气运的讲述 八 更高收入层次与气运的讲述 年净收入三千万元与行业位置 我们说3000万元。每年能踏踏实实拿回3000万元，需要的福报和气运完全不一样，最基础也得星君以上级别。 我在北京接触过做地产的小老板，自己包地、建楼。房地产好的时候，一年做一两个项目，都结算完净利润大概三四千万元，也就这水平。 做一两个小区，不是多大的小区，里面可能四五栋楼，了不得了，都结算完，能拿回家的可能3000万元，差不多。 你们想听那些东西，等讲法界天机再讲，不许给我拉偏。现在讲的是非封建迷信的东西，不能讲太多。以后讲洪荒时期的事情再说，可有意思了。 记得前段时间有些断卦还说鸿钧老祖属于邪教，为什么会出现这个情况？上面有一部分人也这么认为，属于理念不合。等讲《山海经》时，再跟你们说。 一年挣3000万元，需要星君以上的福报。为了挣这点钱，要打通银行、政府、市场、销售手法、促销各环节，还有自己的团队。智慧等级、团队等级都非常厉害。 达到这个级别，在小城市或者中等城市，行业里算得上一号人，基本能算number one。 前五名吧，前五名没问题。在大城市，至少地产圈提一下，圈里人知道有你这么一号人，才行。这是3000万元。 五千万元到一亿元及更高层次 一年能拿5000万元到1亿元回家，算比较高级的星君。一定记住，星君等级划分跨度非常大。真君基本下来可能性很小，威压和能力比较大。 你们能看到在人间折腾出来的，星君比较多。半佛级别，我也曾见过一个，大概4家还是6家上市公司，就这水平。人家的脑子、福报、手段、人脉确实厉害，也是泥腿子上去的。 一年能拿回家5000万元到1亿元，就是比较高级的星君。 在大城市的小圈子、小行业里，基本能排前几名。一年拿1亿元回家，产业可能得做到10亿元左右，拿这么多钱回家挺费劲。 再说普通人能接触到的，一年拿1亿到9亿元回家，产业至少得将近百亿元。 包括像王健林这些人，也不可能每年分红直接拿回家。只能说股份、资产很高，但真敢稀释吗？也不一定。股东分红都往兜里揣吗？也不敢都揣。基本上你们能见到的绝大多数人。 顶天了，净收入在1亿到9亿元，已经很厉害，产业基本得做到百亿元左右。在国内某个行业应该算老大。中国代工厂比较多，整个世界里面，有些代工厂、产业都能排前20。 一般都是比较顶级的星君以上福报，或者初级真君以上福报，才有这样的福报。不是这个级别，很麻烦。他们下来也不可能把所有功德福报都带下来，带一部分能达到这程度，也就这水平。 为什么这些人一定是这个级别、在天上有说道？他们干的事不是想干就能干，基本代表这个国家在某一个行业的代言人，属于天道在人间设立的某个行业、某个方向的代言人，带领这个国家的人类往某个方向走。 这种人要承受极重的天道气运，代表天道在人间的一些规划。再往上，一年能拿10亿元以上的，在全球范围内某个行业都得算很厉害的老大。 比如福耀玻璃，老大也不能说一年给自己分红10亿元，也不敢这么分红，已经很厉害了。相当于整个地球人类在某个行业全靠他领军。没有这种气运，不受天道加持，想玩多大，可能性不大，这才叫气运之子。 一年能拿100亿元回家的，咱就不考虑了。 行业使命与应运而生的说法 马斯克估计都不见得拿100亿元回家，还不敢大量稀释自己的股份。 像马斯克，不用说了。因为人类未来两条出路，一条是逆修觉者。我决定你死后能不能升级到更高位置。马斯克决定的是什么？万一人类活不过1000年，800年后完蛋了，他做的事情能够把一小部分人类带到火星，不让人类断绝，是人类气运。他这事情决定灭世的时候，整个人类能不能留下种子。 能不能留下种子，是很重要的事情，所以他气势如虹，天道气运加持在这里。我们也是一样。 比如曾经的马云，代表网购行业，他是老大。但把这个行业做完，就不代表这个行业，完成历史使命、天道使命了。剩下只要不嘚瑟，没什么太大事。 要嘚瑟，老指点江山，估计还是有人收拾你。像刘强东，虽然也做网购，但解决快递速度，基本创造了人类最快的快递速度，这是他的功绩，很大，代表一个行业在人间落地。 比如《推背图》第四十四象，叫“日月立天，群鹰慑服，百灵来朝，双语四足”。我问你，双语四足是什么？是一个生物。这句话很奇怪，前面正常，最后一句“双语四足”，前不搭村后不着地，怎么突然蹦出这么一句？这就叫寓言。 寓言是什么？让不应该听懂的人瞎猜，让能听懂的人知道这人是谁。“双语四竹”是一个生物，如果本源是这个，一听就知道说谁；本源不是这个，听完也在瞎猜。我可没说是我，不许瞎猜。 如果不是应运之人，听这些寓言故事全部是瞎猜，没有意义。 这很重要。这个人传法，过程中想成圣，你觉得努力就完了吗？想都别想。能够成为改变众生、提高整个人类智慧和思维等级的人，如果不是应运而生，想都别想。"},{"id":"ep7-k24","course":"ep7","number":24,"topic":"成事条件","title":"财富成像与转命：两组命理案例","summary":"讲者以鸟窝中的金蛋、紫微中的条件等故事，说明自己对财富路径与转命的理解。","points":["这些案例属于本课的命理与宗教叙述。","原文保留有关失败、打基础和等待发展阶段的讨论。"],"start":261,"end":273,"quote":"有没有例外？原来没这个命，通过修行有了，也有，比如大家了解的袁了凡，这叫转命。","quoteIndex":267,"related":["ep7-k17","ep7-k25"],"section":"ep7-p261","sectionTitle":"九 财富成像与转命的例子","searchText":"问道七 意义思维与错误分类 第7课 问道7 财富成像与转命：两组命理案例 讲者以鸟窝中的金蛋、紫微中的条件等故事，说明自己对财富路径与转命的理解。 成事条件 这些案例属于本课的命理与宗教叙述。 原文保留有关失败、打基础和等待发展阶段的讨论。 九 财富成像与转命的例子 九 财富成像与转命的例子 鸟窝与四个金蛋 讲了半天，讲的是什么？有没有干成这个事的气运。多少收入对应什么福报等级，要有什么气运。没有这气运，就别想，根本不可能。 比如之前说，我的财富是鸟窝里面四个金蛋。也就是说，以后至少同时干四种收入，都能够挣钱，这是我要做的东西。 但很可惜，只是一个鸟窝。人家厉害的，直接一大金元宝，或者金山，财富在法界成像是那样。咱就四个金蛋，还行，至少比鸡蛋大点，跟鹅蛋差不多，没有鸵鸟蛋大，但比鹌鹑蛋强多了，哈哈。都是蛋，大小不一样。 转命与紫微中的条件 有没有例外？原来没这个命，通过修行有了，也有，比如大家了解的袁了凡，这叫转命。 之前用紫微比较少，八字里能不能看出转命，我不太清楚。但紫微里面比较容易看到，一个人有没有转命的可能。比如命宫有右弼、迁移宫有右弼、来因宫有右弼，都具备转命、改变命运的条件。 没有，只能小步升级或者减少破坏。右弼这颗星在这三个宫位，至少有改命的可能性。但一定注意，右弼必须在水位或者木位，力量才大。在金位、火位，力量不大，只是小幅改变，不会改变多厉害。 没有气运或者过运的人比较多，比如唐伯虎、李白、孔子。孔子一直想当官，谁都不要。还有苏轼，一直在被贬的过程中，比较郁闷。咱们绝大多数都是普通人。 别说承载天地气运，有足够多福报，已经很不容易。所以做事之前，一定先看看法界有没有成像，有没有匹配的成功可能。没有就别太费劲，尤其已经走B运、C运的，很多事别多想、乱想。 法界不能成像，就没有这个影像。想做上市公司，没有这个命，就别扯淡，别以为我命由我不由天，所有东西都是天定，别费劲。 但如果是A运，建议先不要查，因为很可能做事就失败。比如我，2025年之前，做的所有事情基本都是为了打地基。要允许失败，不失败、不受挫，对未来成就是有问题的。"},{"id":"ep7-k25","course":"ep7","number":25,"topic":"成事条件","title":"命运起伏：本课对称骨与人生阶段的讨论","summary":"讲者以称骨、M型起伏和个人经历，继续解释成就与低谷的变化。","points":["源稿保留了“不确定”“大概”等限定。","本节的对应关系沿用讲者说法。"],"start":274,"end":284,"quote":"再多说点，可以看称骨算命。不要看前面那个东西，要看走运的部分。有很多三两多的，也有资产上亿元的，不要光看批文。之前说骨重越重，富贵、财气越好，但这不确定。","quoteIndex":275,"related":["ep7-k24","ep8-k11"],"section":"ep7-p261","sectionTitle":"九 财富成像与转命的例子","searchText":"问道七 意义思维与错误分类 第7课 问道7 命运起伏：本课对称骨与人生阶段的讨论 讲者以称骨、M型起伏和个人经历，继续解释成就与低谷的变化。 成事条件 源稿保留了“不确定”“大概”等限定。 本节的对应关系沿用讲者说法。 九 财富成像与转命的例子 称骨与人生起伏的讲述 再多说点，可以看称骨算命。不要看前面那个东西，要看走运的部分。有很多三两多的，也有资产上亿元的，不要光看批文。之前说骨重越重，富贵、财气越好，但这不确定。 比如说“好一个抓钱手”，有这句话，至少一个阶段财运还不错。 之前一个山西朋友，忘了三两几，三两七还是三两几，有句“好一个抓钱手”。那小子挣钱速度还行，只不过后面气运败了，都被他败了，也就五年左右富贵运。虽然一些亲戚在政府或者企事业单位高层，但基本不管用，自己把福报败光了，很可惜。 看这个有什么好处？知道两点。第一个，说低于六以下的人。你看我称骨算命是六两二，我上一个、以前老板是六两一，六两一明确是大富之命。 六两二是什么？属于清流，说什么“锦鱼一时”，不是，你要看后面的解释，一看就是前面没什么戏，越往后越好。比如我50多岁“天赐麒麟送老”，至少说子女运不错。六两二先别关心多富，至少人生前面狗屎，后面越走越行。 但低于六两的，如果已经过了40岁、45岁或者50岁，基本后面没什么运，大概这样。比如四两九，我经常拿它说，因为很有意思，是M型的运。 前段时间给一个学生看紫微，他也是四两九，发现真的就是。两个运中间，30多岁到40多岁被砸下去了。四两九的人生M型，有两个波峰、一个谷底，会出现这情况，很有意思。 大概看看就知道。如果没有上六两，一定记住，45岁或50岁以后少嘚瑟，基本没什么用。四两九要注意M型，第一个成就之后赶紧把钱搂兜里，别拿出去。 像历史上越王勾践，还有史玉柱、乔布斯，都是典型的四两九、M型人生。还有明朝土木堡之变那个皇帝，“大明战神”，也是典型M型。之前当皇帝，之后当俘虏，回去又当皇帝，我觉得太神奇，谁也算不到，太厉害了。 有时大概看一下命运格局就行。有的人虽然一定会有奇迹发生，但不一定所有人。"},{"id":"ep7-k26","course":"ep7","number":26,"topic":"机缘与贵人","title":"机缘的总结：两个入口","summary":"本课最后把机缘归纳为真相入口和成事入口。","points":["先问能否接触关键信息，是否存在实际成事机会。","后面再展开分析、学习、资源、方法与执行；第八课从贵人继续。"],"start":285,"end":292,"quote":"机缘不只是气运，而是有没有真相的入口和成事的入口。","quoteIndex":288,"related":["ep7-k20","ep8-k02"],"section":"ep7-p285","sectionTitle":"十 机缘的总结与后续课程","searchText":"问道七 意义思维与错误分类 第7课 问道7 机缘的总结：两个入口 本课最后把机缘归纳为真相入口和成事入口。 机缘与贵人 先问能否接触关键信息，是否存在实际成事机会。 后面再展开分析、学习、资源、方法与执行；第八课从贵人继续。 十 机缘的总结与后续课程 十 机缘的总结与后续课程 总之，不是所有事情都值得做。这类机缘不是看有没有努力，而是这件事在法界上有没有被打开，有没有成功可能，有没有值得投入的口子。没有机缘，硬做就属于消耗。 有机缘，再考虑后面的分析、学习、研究、资源、方式方法、执行，才有可能做起来。前面的东西没有，肯定不行。所以遇到事，先看有没有机会，真的有没有成事的可能。 机缘不只是气运，而是有没有真相的入口和成事的入口。 本来还想多讲点，这个贵人都没讲完。今天先这样，周一晚上再嘚瑟。 周二、周三，我看看智慧有没有总结好。这个基本都总结好了，不用再看，周一直接上来讲就完了。智慧这几天可能要捋一下，捋完，讲完这个之后就讲智慧。 今天又白活太多，瞎白活一堆，被你们打乱了。坏事的都是你们，没事老想知道神奇的东西。还有想知道鸿钧老祖的，这不能跟你们说太多，是法界天机时讲的事。 好，今天就到这里，大家再见。"},{"id":"ep8-k01","course":"ep8","number":1,"topic":"课程导读","title":"第八课：继续展开成事之前的条件","summary":"本课接续机缘，讨论贵人、天赋、福报、因果业力、高维对抗、环境与意外。","points":["本课主要保留讲者对法界相关条件的解释。","分析、执行与反馈等内容在第九课继续。"],"start":28,"end":35,"quote":"但我不会讲太细，因为人类本身已经总结得很不错了，我就告诉大家哪些方向一定要注意。成事本身是一个非常大的工程，不可能一两集讲完，所以大概给大家列个方向。涉及法界的东西，咱轻车熟路，就多讲讲；涉及人间的，留到明天晚上。本来想今天一起讲，估计讲不完，而且稿子忘了放到我的 iPad 里，明天继续。","quoteIndex":33,"related":["ep7-k01","ep9-k01","ep7-k15"],"section":"ep8-p28","sectionTitle":"一 开场与本课安排","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 第八课：继续展开成事之前的条件 本课接续机缘，讨论贵人、天赋、福报、因果业力、高维对抗、环境与意外。 课程导读 本课主要保留讲者对法界相关条件的解释。 分析、执行与反馈等内容在第九课继续。 一 开场与本课安排 一 开场与本课安排 大家晚上好。我这抓紧时间往外输出，希望能给大家带来不一样的东西。 什么，最近吃胖了？明天去买个减肥药去，叫什么司美格鲁肽，对吧？好像是类似的东西，要打一下。这两天有点压不住食欲了。声音小吗？大家看看。吃嘛嘛香，也是上岁数了，做点大礼拜，腰酸背痛屁股疼。 好，八点了，咱们不耽误大家时间。本来今天还是想继续讲成事、人类犯错误的一些条件。 自己总结好了文章，从家出来的时候忘了发到本上。还好本上有一些之前写的东西。今天肯定也讲不完，基本上可以把成事有关法界的那部分讲完，我估计没问题。明天晚上讲成事的人间那部分，它也是很重要的一部分，东西还挺多。 但我不会讲太细，因为人类本身已经总结得很不错了，我就告诉大家哪些方向一定要注意。成事本身是一个非常大的工程，不可能一两集讲完，所以大概给大家列个方向。涉及法界的东西，咱轻车熟路，就多讲讲；涉及人间的，留到明天晚上。本来想今天一起讲，估计讲不完，而且稿子忘了放到我的 iPad 里，明天继续。 周三记住，是大课，正式开始讲智慧，讲完智慧再讲修行。智慧和修行都是大课。讲完意义法则之后，知识分类、成事分类，属于花絮，或者说知识拓展，不算大课之一。结果一个拓展讲了三次，你这玩意闹的。 好，咱们开始。昨天讲到哪儿都忘了，好像讲的是机缘。今天开始讲第二，贵人。"},{"id":"ep8-k02","course":"ep8","number":2,"topic":"机缘与贵人","title":"贵人的定义：关键时刻的实际帮助","summary":"本课将贵人界定为能够提携、引导、点醒或拉人一把的人。","points":["认识一个人，与得到关键帮助，是不同层面的关系。","贵人的作用包括打开机会、看清规则与少走弯路。"],"start":36,"end":44,"quote":"再继续说，贵人可不是普通人脉。普通人脉只是认识，贵人是真的能帮你打开一扇门，少走弯路，看清规则，避开大坑。很多人不是没努力，也不是没能力，而是没人点他、带他，没人把关键的门打开，所以今生无缘。","quoteIndex":42,"related":["ep7-k18","ep7-k26","ep6-k16","ep8-k03","ep10-k25"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 贵人的定义：关键时刻的实际帮助 本课将贵人界定为能够提携、引导、点醒或拉人一把的人。 机缘与贵人 认识一个人，与得到关键帮助，是不同层面的关系。 贵人的作用包括打开机会、看清规则与少走弯路。 二 贵人与破圈的机会 二 贵人与破圈的机会 贵人怎样在关键节点拉你一把 贵人是什么？可以在关键时刻提携你、引导你、点醒你、拉你一把的人。有时候生命中还会出现非常神奇的贵人，比如一些奇人异事，或者你怎么都想不到，还会以这种方式帮你。 现在马来西亚有一个美女，她就发现，曾经的暗卫也变成了她的贵人。很奇怪，正常情况下你不接触这个暗卫，不知道人和人之间的关系还能这样。 接触之后，有些之前不敢想的事情，就可以想到、可以去做了。没有这种人存在，你还做不到。只能说天下之大，无奇不有。 之前类似死士营那种。咱们有些学生，比较往前的前世位高权重，有自己的暗卫和死士营，坚决执行主人的命令。你会发现，这个人一见到咱们学生，就言听计从，基本没有反抗的思维。两个灵魂碰到了，就勾起曾经的前世记忆，很神奇。是谁可不能说。 再继续说，贵人可不是普通人脉。普通人脉只是认识，贵人是真的能帮你打开一扇门，少走弯路，看清规则，避开大坑。很多人不是没努力，也不是没能力，而是没人点他、带他，没人把关键的门打开，所以今生无缘。 你越干大的项目、大的事业，越会发现：不知道从哪个犄角旮旯蹦出这么个人，结果他就能把这事解决了，很厉害。 我们经常碰到的问题，之前已经说了，人类本身活在思维茧房里，也活在状态茧房里。你是什么级别的人，就会碰到什么样的问题。想用现有资源破圈，很难。你看，有很多这样的死循环。"},{"id":"ep8-k03","course":"ep8","number":3,"topic":"机缘与贵人","title":"资源循环：为什么有时需要外部帮助？","summary":"讲者用换房与借款的设想，说明现有资源无法跨过门槛时的循环。","points":["本节的风水与收入变化属于讲者设定的案例。","案例旨在说明，一次外部支持可能改变原有的行动条件。"],"start":45,"end":57,"quote":"贵人的主要作用，就是帮你看见真相、理解规则、避开错路、少走弯路，进入正确的门，接触更高级的信息，在关键节点拉你一把。贵人还不是下面最主要的事，咱们先说这些。","quoteIndex":54,"related":["ep8-k02","ep8-k04"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 资源循环：为什么有时需要外部帮助？ 讲者用换房与借款的设想，说明现有资源无法跨过门槛时的循环。 机缘与贵人 本节的风水与收入变化属于讲者设定的案例。 案例旨在说明，一次外部支持可能改变原有的行动条件。 二 贵人与破圈的机会 换房与资金的循环 比如你想提升财运，但发现住的房子风水不行，财气不足，就想换个有财气的好房子。有没有？有。关键是你有钱换吗？这不就变成一个死局了吗？ 因为住的房子不行，才没钱；想换个有财气的房子，又需要先有钱，这不就成死结了吗？很难突破。那就剩几个方法，第一，慢慢积累。比如这个房子值一百万。 我一个月挣一万块钱，就啃馒头，十年怎么着能挣到这钱了吧？能挣到，但是等你钱够的时候，房子升值了，或者早被别人买走了。好房子不等人，你看着好风水的，得想办法直接拿下。要不然，就只能铤而走险，做一些有危险、有风险的事情。 那也能破圈，但代价很大，后患无穷。说不定做完大概率得出事，就算成功了，也有很多后患。大家都明白，你可以看看刑法里的那些方式，都是来钱速度比较快的方式。 这个时候，假设有个贵人说：“小李，没事，哥借你钱。房子不是一百万吗？先借给你一百万，你以后慢慢还，先把这风水弄上去。”这个就是帮你破圈的人。 住到好的房子里，挣钱速度从一个月一万变成三万，可能三四年，这一百万就还清了。但不住这个房子，你就发现想挣这钱挣不到。 想通过积累的方式弄，可能又跟你没什么关系。请大家记住，无论思维、财运，还是境遇，都会出现这种情况。需要一个更高级的贵人，拉你一把，点你一下，或者抬你一下，这关就过去了。过去以后，到了另外一个阶层。 他不仅把你抬上去，而且给了你一个很重要的机会。没有他，你抓不住这个机会，凭自己积累也抓不住，所以很重要。 贵人的主要作用，就是帮你看见真相、理解规则、避开错路、少走弯路，进入正确的门，接触更高级的信息，在关键节点拉你一把。贵人还不是下面最主要的事，咱们先说这些。 比如刘强东，想发展没钱，没钱就发展不了，卡在那个坎上。这是一个循环，想从这个循环到上一个循环，需要有人撑一下。你看他头上有一撮白头发，那就是急的。一夜白发这个东西真能出现，在他的认知范围里已经没有招，找谁都不好使了。 后来有贵人真帮了一把，直接跨过那个圈，整个事情就能转起来。绝大多数人没办法升级，还在原来的圈子里，就是没有这样的贵人拉你，指着自己弄，过不去。 让他找找客服。好，贵人还能帮你判断什么该做、什么不该做，打开你连想都不敢想，也不可能得到的思路或者资源。"},{"id":"ep8-k04","course":"ep8","number":4,"topic":"机缘与贵人","title":"高贵、平贵、低贵：三种位置关系","summary":"本课按相对的认知、能力或支持位置，把贵人分成三类。","points":["高贵：讲者所说的能够从更高经验或能力上指点自己的人。","平贵：同层次的伙伴，也可能存在竞争。","低贵：在具体工作中提供重要支撑的人。"],"start":58,"end":64,"quote":"下面主要说贵人的种类。第一个，比你高等级的，称为高贵；第二个，跟你同级的，叫平贵；第三个，比你低一些的，叫低贵。这三个都很重要。","quoteIndex":59,"related":["ep8-k03","ep8-k05"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 高贵、平贵、低贵：三种位置关系 本课按相对的认知、能力或支持位置，把贵人分成三类。 机缘与贵人 高贵：讲者所说的能够从更高经验或能力上指点自己的人。 平贵：同层次的伙伴，也可能存在竞争。 低贵：在具体工作中提供重要支撑的人。 二 贵人与破圈的机会 高贵 平贵与低贵 下面主要说贵人的种类。第一个，比你高等级的，称为高贵；第二个，跟你同级的，叫平贵；第三个，比你低一些的，叫低贵。这三个都很重要。 高贵容易理解，人家在认知、能力、水平上非常厉害，点你一下，大家就能明白，这个不用太多解释。 平贵是跟你同级别的，同行是冤家。按紫微来说，属于兄弟宫，同种属性的，竞争关系会严重一些。 比如我跟马云比，跟刘强东比，不用比，人家肯定比我强。我压根不会因为这件事有什么心理负担。但是跟我一块的同学、家里的亲戚朋友，但凡比我高了，心里就难受：“他也有这一天？凭什么？”平贵特别难处理。 低贵是帮助你的一些人，比如你当老板，能碰到几个非常得力的员工，很重要。像马云要解决网络安全的问题。 招聘时就能碰到一个大神去他们公司应聘。为了验证水平，人家能把现场办公的 Wi-Fi 弄瘫，这就是水平。在你很低的时候，就能碰到很有能力的人，正好在身边，这叫低贵。"},{"id":"ep8-k05","course":"ep8","number":5,"topic":"机缘与贵人","title":"平贵：同伴关系中的比较与竞争","summary":"讲者用同学、亲戚和同行的例子，讨论面对身边人发展时的比较心理。","points":["与遥远人物相比，身边人的变化可能更容易引起情绪。","本节把这些情绪放回同伴合作与支持关系中观察。"],"start":60,"end":62,"quote":"比如我跟马云比，跟刘强东比，不用比，人家肯定比我强。我压根不会因为这件事有什么心理负担。但是跟我一块的同学、家里的亲戚朋友，但凡比我高了，心里就难受：“他也有这一天？凭什么？”平贵特别难处理。","quoteIndex":62,"related":["ep8-k04","ep8-k06"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 平贵：同伴关系中的比较与竞争 讲者用同学、亲戚和同行的例子，讨论面对身边人发展时的比较心理。 机缘与贵人 与遥远人物相比，身边人的变化可能更容易引起情绪。 本节把这些情绪放回同伴合作与支持关系中观察。 二 贵人与破圈的机会 高贵容易理解，人家在认知、能力、水平上非常厉害，点你一下，大家就能明白，这个不用太多解释。 平贵是跟你同级别的，同行是冤家。按紫微来说，属于兄弟宫，同种属性的，竞争关系会严重一些。 比如我跟马云比，跟刘强东比，不用比，人家肯定比我强。我压根不会因为这件事有什么心理负担。但是跟我一块的同学、家里的亲戚朋友，但凡比我高了，心里就难受：“他也有这一天？凭什么？”平贵特别难处理。"},{"id":"ep8-k06","course":"ep8","number":6,"topic":"机缘与贵人","title":"低贵：把具体事情托起来的人","summary":"本节以合作人员、学生、行政、财务等，说明实际支撑的重要性。","points":["关键帮助可能来自看似普通的具体岗位。","讲者用自己的项目经历，描述长期合作如何发展。"],"start":63,"end":73,"quote":"我们师门也有几个很好的学生，业务很厉害，也是我的低贵。还有很好的行政、财务，都很厉害。到海外以后，有些朋友告诉你怎么收现金，海外税务、工商的流程，人家都很清楚，也帮了很大的忙。","quoteIndex":73,"related":["ep8-k05","ep8-k07"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 低贵：把具体事情托起来的人 本节以合作人员、学生、行政、财务等，说明实际支撑的重要性。 机缘与贵人 关键帮助可能来自看似普通的具体岗位。 讲者用自己的项目经历，描述长期合作如何发展。 二 贵人与破圈的机会 低贵是帮助你的一些人，比如你当老板，能碰到几个非常得力的员工，很重要。像马云要解决网络安全的问题。 招聘时就能碰到一个大神去他们公司应聘。为了验证水平，人家能把现场办公的 Wi-Fi 弄瘫，这就是水平。在你很低的时候，就能碰到很有能力的人，正好在身边，这叫低贵。 低贵非常重要。还有一种叫桥贵，不过低贵再说一下。我们干这行，大家都知道，要烧纸，量非常大。老天想帮你的时候，可能会用一种很奇怪的方式帮你。 当时量少，都去白云观烧。认识一个大哥，应该叫大叔了，我管他叫大叔。据说从一九七八年就在白云观负责烧纸，在外面卖纸、卖桶，干这个事。 我去的时候，据说至少干了四十多年，当地的警察、城管，他都门儿清、门儿熟。人家一看是他，搭理都不搭理。 我二〇一八年开始从事这些事情，正赶上严打。到了二〇一九年，白云观门口不能烧了，给我气的：“人家干了四十年都没事，凭什么我过去就不让烧？”很挫火。那时候还没觉得应该干多大，这条道走不通，就郁闷，觉得天绝了。 后来在旁边瞎溜达，在菜市场发现一家卖这个的，一联系，还挺热情。结果这家后来发展到，我估计曾经在中国范围内，应该算烧纸行业做得最大的。没想到。他说自己也是试着租个摊位，就租了三个月，结果碰到我了。 我就觉得，甭管什么原因，老天让你专门找到这样的人，他能帮你解决问题。没想到现在这哥们国内业务不做了，因为污染这些事情比较麻烦，一直跟到泰国、马来西亚，专门从事烧纸一条龙服务。 这叫低贵，是支撑你的一个很重要的柱子。现在烧元宝，这么大一塑料袋，一千个金元宝。我们一烧三五百万，就是三五千袋。一般的火场，我跟你说，就现在这个屋子，摞满了都放不下。 上次给你们看的视频，鬼节那次，四辆卡车拉元宝，拉了两趟吧？烧纸的应该能看到，非常壮观。没有足够的场地，没有当地关系，根本别想干。这叫低贵，是支撑你的。 我们师门也有几个很好的学生，业务很厉害，也是我的低贵。还有很好的行政、财务，都很厉害。到海外以后，有些朋友告诉你怎么收现金，海外税务、工商的流程，人家都很清楚，也帮了很大的忙。"},{"id":"ep8-k07","course":"ep8","number":7,"topic":"机缘与贵人","title":"桥贵：只陪一段，也可能非常关键","summary":"桥贵指帮助跨过某个节点的人，后续未必长期同行。","points":["贡献大小不只由相处时间决定。","本课以说一句话、扫清一个障碍和早年老师的帮助作例子。"],"start":74,"end":78,"quote":"还有一个很重要的，叫桥贵。什么叫桥贵？一条河拦住你，过不去，必须过这座桥。但这个桥在整个路程里，只算一难、一个节点。过去以后，可能再也没关系，可是不找他，这事就过不去。","quoteIndex":75,"related":["ep8-k06","ep8-k08"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 桥贵：只陪一段，也可能非常关键 桥贵指帮助跨过某个节点的人，后续未必长期同行。 机缘与贵人 贡献大小不只由相处时间决定。 本课以说一句话、扫清一个障碍和早年老师的帮助作例子。 二 贵人与破圈的机会 桥贵与分离时的善缘 还有一个很重要的，叫桥贵。什么叫桥贵？一条河拦住你，过不去，必须过这座桥。但这个桥在整个路程里，只算一难、一个节点。过去以后，可能再也没关系，可是不找他，这事就过不去。 很多人对桥贵理解不到位。未来讲因果，有一个重要法则叫镜面法则。你不认可桥贵对你一生的贡献。 以后再轮回，碰到坎过不去，你就别哭。有些事情，人家替你说一句话、递一个眼神、扫清一件事，或者劝了谁一句，事情就过去了。如果不过去，这个劫难未必能走得通。 包括小学老师。我们一般特别感激大学、硕士、博士的导师，但小学老师有时也非常重要。没有他的栽培，往上走不了，走不到那个高度，这也是桥贵。"},{"id":"ep8-k08","course":"ep8","number":8,"topic":"缘分与成长","title":"面对分离，怎样理解曾经的帮助？","summary":"讲者在轮回与善缘的框架中，讨论关系有期限以及分离时的取舍。","points":["本节强调记得已经得到的帮助。","有关缘分年限与轮回的换算，保留为讲者的宗教说法。"],"start":79,"end":83,"quote":"修行一辈子，修的是什么？众生善缘很重要。别一次次轮回，善缘越来越少，未来就活不下去了。如果每一次修行，虽然都遇到分离，但至少没有闹掰。","quoteIndex":82,"related":["ep8-k07","ep9-k20"],"section":"ep8-p36","sectionTitle":"二 贵人与破圈的机会","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 面对分离，怎样理解曾经的帮助？ 讲者在轮回与善缘的框架中，讨论关系有期限以及分离时的取舍。 缘分与成长 本节强调记得已经得到的帮助。 有关缘分年限与轮回的换算，保留为讲者的宗教说法。 二 贵人与破圈的机会 再下面一个规则：跟谁都有一定缘分。你现在碰到的人，跟你能有一到两年的缘分，就是普通缘分；三到五年，就算不错了。 能达到十年，已经很稀少了；二十年、三十年，甚至一生，很难。之前说过，比如你在天界跟众生有几百万年的好缘分，这一生就容易处成一生的朋友。记住，几百万年。 如果只是几万年的缘分，我想想，应该除以一万倍吧，这是天界往人间转的缘分，大概是这样。所以我们必将面临一个问题，叫分离。分离，是人生碰到的各种缘分里经常要面对的事。 修行一辈子，修的是什么？众生善缘很重要。别一次次轮回，善缘越来越少，未来就活不下去了。如果每一次修行，虽然都遇到分离，但至少没有闹掰。 分离时很容易不愉快，一定要放下利益。利益对你来说不重要，更多的是众生善缘，轮回里早晚还要见面。所以众生善缘比当下利益重要得多，把这几个东西记住就行。"},{"id":"ep8-k09","course":"ep8","number":9,"topic":"成事条件","title":"天赋与优势：本课怎样区分？","summary":"讲者将天赋定义为在某项能力上远超大多数人的表现，与一般优势分开。","points":["本课采用较高的天赋标准。","学习分数与学校案例是讲者的举例，核心在于辨别能力差异。"],"start":84,"end":97,"quote":"第三个讲天赋。人欲成大事，一定要拥有天赋。天赋不是普通优势，也不是比别人强一点点，而是一个人在某一项，或者极少数人在几项能力上，天然远远超出绝大多数人的现象。","quoteIndex":86,"related":["ep4-k16","ep8-k10"],"section":"ep8-p84","sectionTitle":"三 天赋与优势的区别","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 天赋与优势：本课怎样区分？ 讲者将天赋定义为在某项能力上远超大多数人的表现，与一般优势分开。 成事条件 本课采用较高的天赋标准。 学习分数与学校案例是讲者的举例，核心在于辨别能力差异。 三 天赋与优势的区别 三 天赋与优势的区别 什么程度才叫天赋 第三个讲天赋。人欲成大事，一定要拥有天赋。天赋不是普通优势，也不是比别人强一点点，而是一个人在某一项，或者极少数人在几项能力上，天然远远超出绝大多数人的现象。 首先一定是绝对少数，不可能每个人都有，每个人都有就不叫天赋。第二，在人类某些能力上，应该达到数一数二的原则。 做大事需要天赋，普通人能有优势就算不错。下面讲什么是天赋、什么是优势，给大家一些比较和数据，就清楚了。如果想创业，想干到资产上亿，你要有超越很多众生的、很大的优势，但这还不算天赋。 第二，你得有气运。比较大的优势和气运加在一起，至少能干成一个事。但如果要成为整个人类某个行业的领袖，或者必须通过你的努力，才能改变整个人类的现状，优势就不好使了，需要天赋，非天赋不能成。 拿学习来说，学得比别人快，叫天赋吗？不叫，只能算优势。对国内的学生、观众来说，你家孩子如果连九八五、二一一都考不上，至少在学习上，我说连优势都算不上。能考个一本，算比别人学得稍微好一点。至少裸考九八五、二一一，才叫有一些学习优势。就算考上清华北大，也只是优势比较大一些。 说起来确实很扎心。可能到十二月份，我这段时间一直突击直播，到一定程度要转录播。那时还会有直播，一周一次，再讲《真相》。其中要涉及人类金字塔：什么样的人才算金字塔尖的人？要活得清清楚楚，知道在跟什么样的人竞争。 为什么你是穷人？为什么怎么做都做不起来？你就是金字塔底的一个基石，就别提塔尖的事。我跟你说一些指标，看看人家能达到的，你能不能达到。 为什么要了解这些？得清清楚楚知道自己活在哪个位置，自知者明。像韦神，算天赋。普通清华北大的，只能算优势大一些。 我记得抖音上有个讲语文的北大哥们说过一句话：“都考到北大，六百八十分进的和七百分进的，性质完全不一样。”七百分以上进的，那叫天才、天赋；六百八十分，可以通过优势和努力堆积出来，跟天赋不是一个级别。 比如同一张考卷，得九十九分和得一百分，有明显差距。得九十九分，你的水平就是九十九分；得一百分，只能说这张卷子摸不出你到底有多高，所以有区分。 清华北大学习上能堪称天赋的，我说就是七百分以上这帮人，还有能进清华姚班的。比如进哈佛、麻省理工这些热门专业，能拿到博士，或者做到博士后，这些人一般得有点天赋。所以为什么出来年薪很高？ 为什么你就很费劲？最近我刷抖音，刷到 UCL，还有前段时间帝国理工的数学专业，刷下来的人一片一片。你费劲努力，好不容易到了那个点，上了帝国理工，那个专业就不是给普通人设的，一个普通人去学，根本学不动。至少学习上是这样。"},{"id":"ep8-k10","course":"ep8","number":10,"topic":"成事条件","title":"开创性工作与日常成事的不同要求","summary":"本节区分需要建立新体系的工作，与可以通过努力、经验和稳定完成的普通事情。","points":["普通事情可以依靠时间、纪律、稳定与经验积累。","讲者认为推动全新体系的工作，需要不同程度的天赋。"],"start":98,"end":109,"quote":"很多普通事情不需要很强的天赋，靠努力、时间、纪律、稳定、经验也能完成。但是想推动人类社会的文明、规则、思想、整个体系往前走，做开创性的东西，建立一套新体系，需要天赋。","quoteIndex":100,"related":["ep8-k09","ep8-k11"],"section":"ep8-p84","sectionTitle":"三 天赋与优势的区别","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 开创性工作与日常成事的不同要求 本节区分需要建立新体系的工作，与可以通过努力、经验和稳定完成的普通事情。 成事条件 普通事情可以依靠时间、纪律、稳定与经验积累。 讲者认为推动全新体系的工作，需要不同程度的天赋。 三 天赋与优势的区别 开创体系与不同层次的天赋 历史上哪些人有天赋？高斯、牛顿、爱因斯坦，这是天赋；佛祖、老子，这是天赋；龙树，辩才第一，这是天赋；六祖慧能不识字，听一句《金刚经》悟了，这叫天赋。 很多普通事情不需要很强的天赋，靠努力、时间、纪律、稳定、经验也能完成。但是想推动人类社会的文明、规则、思想、整个体系往前走，做开创性的东西，建立一套新体系，需要天赋。 像霍金也是。我忘了，好像是上牛津大学吧？别人已经学得不行了，他一周可能就上几天课，还能拿满分，这叫天赋。 天赋还分不同等级。有的连学都不用学，比如经常说的纯种天巫血脉。这谁啊，没事说什么嫪毐？哈哈，那当然也算有天赋，但不是我们推崇的。 纯种天巫血脉，直接能跟天地沟通，都不用学习。有一个重要特点，他的魂一定是分裂状态的。比如一边听电话，一边看电视，旁边还有人说话，三个人同时说，不影响他回答。魂可以分成一个看电视，一个听旁边人说话，一个听电话，没有问题。 脑子快的，我记得像克林顿，也能一边下国际象棋，一边看电视，一边跟希拉里通电话。他是脑子快，切换速度快，属于假多线程，天巫血脉是真的多线程，不一样。没有分魂状态，就不能说自己是纯种天巫血脉。沟通天地非常容易。 第二种天赋，简单看看就行，像六祖这样的人。虽然老说“本来无一物”这个事，但必须承认，六祖的天赋确实逆天，根本不是普通人能行的。看一下就明白，这就叫天赋。 再下一层，像我这种比较水的，多少也算有点天赋。比如玩“紫占”，也能琢磨出一套全新的体系，还帮你把紫微重新定位一下，这也算。 我研究天道，那就是纯天赋，但也得憋点时间。每天早上起来望着天想，今天想什么问题？想着想着，可能想明白。我比较懒，想不明白就刷视频，刷着刷着，过两天不定因为什么事，就想明白了。 所以我估计，想不明白时，就告诉我的大号：“赶紧帮我想问题，我想不出来，你自己想吧，想好了告诉我。”可能晚上一般一点到三点传东西，传完以后，第二天不定因为什么事，突然一想：“我为什么不这么说？”就这样，也算有点天赋。 不管怎么说，有天赋的人，能在很短时间里走出别人根本走不出来的路，后期也很难有人超越。这就是天赋。但天赋里面还有很苦的天赋，比如我这种。"},{"id":"ep8-k11","course":"ep8","number":11,"topic":"成事条件","title":"天赋的发挥：时间、环境与经历","summary":"讲者通过自身的宗教经历，解释天赋为什么可能需要特定条件才发挥。","points":["本节包含轮回、魂和觉醒条件等个人解释。","时代环境和亲身经历，是他讨论中的重要条件。"],"start":110,"end":122,"quote":"不同天赋，觉醒时间、觉醒条件不一样。有的确实能做很伟大的事，可是前期条件太苦，还不如开包子铺，弄个厨子天赋。好，开个玩笑。","quoteIndex":118,"related":["ep7-k25","ep8-k10","ep8-k12"],"section":"ep8-p84","sectionTitle":"三 天赋与优势的区别","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 天赋的发挥：时间、环境与经历 讲者通过自身的宗教经历，解释天赋为什么可能需要特定条件才发挥。 成事条件 本节包含轮回、魂和觉醒条件等个人解释。 时代环境和亲身经历，是他讨论中的重要条件。 三 天赋与优势的区别 天赋的觉醒条件与个人经历 传法、传天道的天赋，属于苦逼型天赋。那天还跟观音聊，我说这天赋太苦了。人类社会不发展到一定程度，把你扔下来压根没用。因为要把天道和人间的东西结合起来，人类自己的知识体系没发展到一定程度，做不到。 比如老子、佛祖那个时期，把你扔下来有什么用？不好使。所以我这天赋可能一直都有，但是至少在人间这一百世，前面都没打开。之前属于纯混，做个算命师，去宫殿里当高官，在某个地区当土皇帝，或者法师、将军。当然也有当纨绔子弟、被人追得到处逃命的时候。 需要人类社会发展到一定程度，通过这些东西，我才能看明白一些事情。包括没有到网络时代，很难激发这种天赋，也很难做到，很麻烦。而且这种天赋，注定不能出生在大富之家，做富二代的梦想不可能，每次都得出生在苦哈哈的人家。 得从社会最底层一点点爬起来，所以前四十年很可能过得很苦。我当将军那次，弄不好不是明朝就是宋朝。当时是一个将领，忽悠元帅：“咱们这么打吧。”元帅听了意见，打赢是打赢了，但是违背朝廷，把我们抓起来，以反叛的罪名砍头。 所以为什么我脖子第六节、第七节出问题？有砍头经历，就容易有颈椎病，刀从这个位置下去。好，这个不多说。 像我的天赋就费劲。人类不发展到一定程度，你不经历很多苦难，很难真正理解世界，对世界的看法很难圆满，因为不知道普通老百姓怎么想，没有经历过。如果想传法，就不能进太好的家庭，太好的家庭会让理解世界有所残缺。 我还跟观音聊：“还不如给个厨子的天赋，包子做得好吃点，至少前期能挣点钱。”当年什么天赋都没有，就是普通人，挣点钱多费劲。不行，把算命的天赋提前打开也行，或者做包子的天赋，至少还能活嘛，啥都没有咋弄？“星空包子铺”，听着挺好。 不同天赋，觉醒时间、觉醒条件不一样。有的确实能做很伟大的事，可是前期条件太苦，还不如开包子铺，弄个厨子天赋。好，开个玩笑。 天赋也很难传下去。高斯、爱因斯坦、霍金，都没把天赋传给后代。说深一点，很多天赋是轮回第一世就给你的东西。整个众生轮回，实际上是一部棋局。天道就那么多天赋，怎么可能平均分配？会分配在一些重要的、最开始出生的众生身上。所以越是之前出生的众生，越有天赋。 你看海外一些讲政经的大 V，讲经济、人情世故、国情，人家有很强的天赋。不然怎么在行业里获得这么高的地位？听一听、看一看，马上知道经济怎么玩，脑子就在这儿。你看半天也没算明白。所以普通众生就不要再去努力这个天赋了，没有天赋，就好好做个普通人。 好好学会抱大腿，这才重要，别自己啥都没有，还往上冲。这世界奖励的是数一数二，自己做不到，就别在那费劲。像我，也不可能每一世轮回都有天赋。 以后讲法界天机再说，有个背包原则。说白了，每次下来执行某个任务，允许选十样东西，背包空间就那么多。选不同东西，或者给你不同东西，能发挥的就不一样，一定要注意。"},{"id":"ep8-k12","course":"ep8","number":12,"topic":"家庭与沟通","title":"父子未必需要承担相同的任务","summary":"讲者从希望儿子继承自己，转向区分开创与传播两种任务。","points":["自己的长处，未必就是孩子应该重复的方向。","本节以“无中生有”和“发扬光大”说明不同定位。"],"start":123,"end":130,"quote":"无中生有应该是我的天赋，为什么一定要儿子继承？他再去无中生有什么？更多应该发扬光大。利用在天界或者佛界比较好的人脉，让更多人愿意支持，这是他应该做的，不是我应该做的。很多老子总希望儿子接班，其实未必。","quoteIndex":130,"related":["ep4-k25","ep8-k11","ep8-k13"],"section":"ep8-p84","sectionTitle":"三 天赋与优势的区别","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 父子未必需要承担相同的任务 讲者从希望儿子继承自己，转向区分开创与传播两种任务。 家庭与沟通 自己的长处，未必就是孩子应该重复的方向。 本节以“无中生有”和“发扬光大”说明不同定位。 三 天赋与优势的区别 课堂玩笑与父子的不同方向 自己看看有没有天赋，也比较简单。说一些曾经在佛界的事情。比如找个小美女唠唠嗑，这不违规。一个仙子走过来，你说：“仙子早上好，小生有疑问，想请教仙子。”她问什么问题，你说：“八加五乘三除四加五，到底是多少？”哈哈，看看她的反应。 如果一下就说出答案，可能是天巫系。她没算，是靠直觉摸出来的，就别忽悠人家，说“小生拜服”，赶紧放人。这是灵感系的，灵感系女生别碰，忽悠不了。如果啪啪一算，马上算出来。 那肯定是文殊那边的，脑子好使，忽悠不了，也不行。如果没算，开始柳眉倒竖，一看就是执法堂的。你要扛揍就忽悠，不扛揍就躲远点。 碰到那种听完眼神发呆，开始想，五秒钟想不明白的，就是你了，今天忽悠你。这一测试就没天赋。尤其下位面的佛界，心性纯良，赶上我们第十山海的人过去，不把你忽悠瘸了？哈哈。 好，自己也可以看有没有天赋。一定是在某方面超出众生非常多，才叫天赋。有点说多了，不能再说下去了。 比如我的天赋想传给儿子，也挺难，他基本不是。之前挺郁闷，后来觉得也对。我最重要的是把一套规则带到人间；儿子要做的，是把它发扬光大。发扬光大，应该是他的天赋。 无中生有应该是我的天赋，为什么一定要儿子继承？他再去无中生有什么？更多应该发扬光大。利用在天界或者佛界比较好的人脉，让更多人愿意支持，这是他应该做的，不是我应该做的。很多老子总希望儿子接班，其实未必。"},{"id":"ep8-k13","course":"ep8","number":13,"topic":"学习与执行","title":"方向选择：兴趣、优势与长期试错","summary":"本节提醒区分兴趣、短期优势与本课定义的天赋。","points":["选择与自身能力相配的方向。","讲者用多年练习占筮的经历，说明爱好如何支持漫长试错。"],"start":131,"end":136,"quote":"最核心的，天赋不是比别人强一点点，而是某项能力远远超出绝大多数人。总之，要做自己有天赋、有兴趣、爱好的事情。做起来比较容易得到正反馈，人是正反馈的动物；升级也容易快，因为这是你的优势。","quoteIndex":134,"related":["ep8-k12"],"section":"ep8-p84","sectionTitle":"三 天赋与优势的区别","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 方向选择：兴趣、优势与长期试错 本节提醒区分兴趣、短期优势与本课定义的天赋。 学习与执行 选择与自身能力相配的方向。 讲者用多年练习占筮的经历，说明爱好如何支持漫长试错。 三 天赋与优势的区别 选对方向与长期试错 每个人有自己的天赋、能力和优势，一定选对。优势可以下传，但概率也不大；天赋几乎不容易传下去，有就有，没有就没有。 没有天赋，又想做高端的事，基本就出问题了。不要把兴趣当成天赋，不要把短期优势、普通资质当成天赋，不要在错误赛道长期消耗自己。明明天赋在 A 方向，非要做 B，也别干。对天赋判断错误，导致路线选择错误，很愚蠢。想做开创的事，却没有相应超常能力支撑，也容易出问题。 最核心的，天赋不是比别人强一点点，而是某项能力远远超出绝大多数人。总之，要做自己有天赋、有兴趣、爱好的事情。做起来比较容易得到正反馈，人是正反馈的动物；升级也容易快，因为这是你的优势。 第三，就算有负面的东西，因为喜欢、爱好，也不容易把它当成阻力。就像当年研究占筮，至少一万到十万卦，属于无效看卦。各种事情都占，占不对的比较多，要一点点试错。 穷举和试错绝对不舒服。长达十年，几乎没什么正反馈，凭什么支持下去？就是爱好，真喜欢。所以这个东西，就叫天赋。"},{"id":"ep8-k14","course":"ep8","number":14,"topic":"成事条件","title":"福报与承载：本课的两个关键词","summary":"本课以“门当户对”和“同频共振”解释讲者理解中的福报。","points":["讨论的不仅是能否得到，也包括能否承接。","这些资源与福报的对应，沿用讲者的宗教解释。"],"start":137,"end":144,"quote":"第二，福报还有同频共振。并不只是得到，更重要的是能托住现在的事情。","quoteIndex":142,"related":["ep3-k05","ep8-k15","ep7-k23","ep8-k16"],"section":"ep8-p137","sectionTitle":"四 福报与承载能力","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 福报与承载：本课的两个关键词 本课以“门当户对”和“同频共振”解释讲者理解中的福报。 成事条件 讨论的不仅是能否得到，也包括能否承接。 这些资源与福报的对应，沿用讲者的宗教解释。 四 福报与承载能力 四 福报与承载能力 门当户对与同频共振 第四个，福报。说白了，有多大福报，做多大事。上次讲机缘已经说了一些，就不说太多。但要记住，有什么样的福气，承载什么样的气运。没那么大福报，就别扯那事，不是你能干的。 福报有两个东西。一个叫门当户对，有一个亿的福报，就干一个亿的事；只有一个包子店的福报，就干包子店。多开第二家，你都撑不住，撑不住容易败。包括福报大的，娶的老婆都长得好看。你换三五万的比亚迪，和弄一辆迈巴赫。 需要的福报等级肯定不一样。买上海江景大平层，五百平方米，和住五十平方米的鸽子窝，福报也不一样。这叫门当户对，有等级。 第二，福报还有同频共振。并不只是得到，更重要的是能托住现在的事情。 没有福报，很多资源进不来，机会接不住，贵人遇不到，财富得不到，位置坐不上去。之前哪一年，我忘了，有个小女孩，说六月份好像能碰到比较好的对象，结果没碰到。仙家一查，说福报下降了，问她干什么了，她说没干什么。 那时候仙家还比较爱说话，直接说：“自己想想干了什么不该干的事。去酒吧找一夜情，以为完了就完了？没弄点病就算不错，但扣福报肯定扣得很狠。”一定注意，邪淫扣福报比较快。福报等级低下去，相应的同频共振就振不出来了。"},{"id":"ep8-k15","course":"ep8","number":15,"topic":"成事条件","title":"得到之后，能不能托住与守住？","summary":"讲者通过自身经历，讨论福报消耗与后续机会衔接的关系。","points":["本节把财富、位置、事业、资源和关系放在承载问题中讨论。","所述比例和变化过程来自讲者个人经历与解释。"],"start":145,"end":152,"quote":"我在二〇一一年体验过一次。福报刚被扣时，前三个月没感觉，三个月后发现很多机缘跟你没关系，自然消失了，再想就起不来了。二〇一一年还能挣点钱，二〇一二年完全不行，果真没福气。体验过一次就知道。所以福报决定能不能得到，更决定能不能托住、接住、守住。","quoteIndex":152,"related":["ep8-k14","ep8-k16"],"section":"ep8-p137","sectionTitle":"四 福报与承载能力","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 得到之后，能不能托住与守住？ 讲者通过自身经历，讨论福报消耗与后续机会衔接的关系。 成事条件 本节把财富、位置、事业、资源和关系放在承载问题中讨论。 所述比例和变化过程来自讲者个人经历与解释。 四 福报与承载能力 消耗福报与错过后续节点 第二，福报不要被消耗掉。很多大老板为什么中间出问题？挣钱以后乱嘚瑟，消耗福报很大，有些局就赶不上了。正常可以走十年，可能三四年就走不动。 比如去年，被我媳妇忽悠，费点事发功，给几个学生弄了一下脉轮，就那一天损失百分之二十的福报。为什么仙家都急了？因为损失这些，很多节点就不容易赶到。 还好只损失百分之二十，如果损失到只剩百分之六十，就不用努力，直接散掉，因为后面的东西肯定接不上。每次往下走，比如半年或者一年之后，有下一个机缘。要拿到，就得有相匹配的福报，叫同频共振点，达到那个位置才行。 假如下一次机缘在一年后，正好能把这百分之二十填上，虽然辛苦，至少还能拿到。但如果只剩百分之六十，努力一年也拉不出这么多福报，到同频共振时就拿不到机缘。再下一个机缘，又要更高福报，就完了。一个正在上升的企业，一定注意不要消耗这些东西。 找女朋友可以，但每一个都是以谈婚论嫁为主，真不合适，分手后再找另一个，没什么事，不算邪淫。同时交往几个，就有问题。 原来有福报，自己一嘚瑟，被消耗了，就容易财富托不住、位置托不住、事业托不住、资源和关系托不住，做着做着局面崩掉。 我在二〇一一年体验过一次。福报刚被扣时，前三个月没感觉，三个月后发现很多机缘跟你没关系，自然消失了，再想就起不来了。二〇一一年还能挣点钱，二〇一二年完全不行，果真没福气。体验过一次就知道。所以福报决定能不能得到，更决定能不能托住、接住、守住。"},{"id":"ep8-k16","course":"ep8","number":16,"topic":"成事条件","title":"虚运：机会出现，却难以落实","summary":"本课用“虚运”描述与机会有缘、却难以取得或留住成果的状态。","points":["讲者将其归因为缘分与福报的不匹配。","原文列举资金、管理、人脉等不同表现。"],"start":153,"end":157,"quote":"这叫虚运，事情跟你有缘分，但是福报托不住。","quoteIndex":155,"related":["ep8-k14","ep8-k15","ep8-k17"],"section":"ep8-p137","sectionTitle":"四 福报与承载能力","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 虚运：机会出现，却难以落实 本课用“虚运”描述与机会有缘、却难以取得或留住成果的状态。 成事条件 讲者将其归因为缘分与福报的不匹配。 原文列举资金、管理、人脉等不同表现。 四 福报与承载能力 有缘分却托不住的虚运 有些人每次都能碰到一些东西。比如百度的李彦宏，我说就是典型的福报不足。老天只给了一次，后面肯定有嘚瑟的事，百分之百。百度是个很神奇的企业，次次踩点准，最后次次又没什么关系。做打车、外卖、地图，发展着发展着，好像就没什么人用了。 这叫虚运，事情跟你有缘分，但是福报托不住。 表现形式各种各样，比如资金、管理、人脉出了问题。很多人每次招标都能叫上，可是拿不下来；或者拿下来，总被别人啃掉一块，这叫虚运，不容易把事做成。 我之前认识一大姐，是典型的虚运。为人、做关系都很厉害，可是每次拿完的东西，最后都跟她没关系。好不容易拿下来，干着干着就没关系了。本来能挣一百万，最后挣十万就不错。这叫缘分很好，但是福报不足。"},{"id":"ep8-k17","course":"ep8","number":17,"topic":"成事条件","title":"因果业力与债主：本课作出的区分","summary":"在本课信仰框架中，规则作用与具体债主的干扰被视为不同情况。","points":["因果业力未必有一个具体债主。","债主则被讲者描述为与当事人有具体怨恨关系的对象。"],"start":158,"end":168,"quote":"没有什么东西来找麻烦，没有债主。债主一定是具体的、对你产生仇恨的生物来找麻烦；因果业力不见得是债主，有时就是天道规则、天道惩罚。","quoteIndex":164,"related":["ep8-k16","ep8-k18"],"section":"ep8-p158","sectionTitle":"五 因果业力与阴债","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 因果业力与债主：本课作出的区分 在本课信仰框架中，规则作用与具体债主的干扰被视为不同情况。 成事条件 因果业力未必有一个具体债主。 债主则被讲者描述为与当事人有具体怨恨关系的对象。 五 因果业力与阴债 五 因果业力与阴债 规则作用与具体债主的区别 第五，因果业力与阴债，放在一起讲，但必须分清。因果很简单，曾经做好事，天道返一个好事；做坏事，返一个坏事。就像镜面法则，弄了什么东西，就有相应的东西找你。 之前有个台湾学生，说：“我没招这个女的，这个女鬼老折腾我干嘛？”查因果，他俩不是债主关系，叫外道关系。为什么有外道关系？想想到底触犯什么规则。以后学完天道法则，一定要学会。 从事情分析自己触犯哪条天道法则。不能用天道思维理解生命中的事，就算白跟我学了。这叫什么？伤及无辜。这小子之前肯定做过伤及无辜的事，所以别人无缘无故伤害你，也别哭。这叫因果业力。 之前查得最多的是学生。典型的，曾经在古代当官员，为难过考生。这孩子平时学习没问题，一考试就出事，尤其重大考试，一定发挥不好。曾经阻碍别人的仕途，就要承担相应的事情。 没有什么东西来找麻烦，没有债主。债主一定是具体的、对你产生仇恨的生物来找麻烦；因果业力不见得是债主，有时就是天道规则、天道惩罚。 之前讲过一个天罚，叫“天地灾杀报”。那个哥们以前当王爷，经常拿国家政策坑害老百姓。今生是我认识的一位大哥，我亲眼看过。水平不错，为人好，做关系一把好手，饭圈、酒场上很厉害，很多大哥真愿意帮他。 结果刚要帮，或者他已经投资很多事情，国家改政策，之前努力全废。不会是哪个债主能让国家改政策，那得多大力量？所以叫“天地灾杀”。 我真看过两次。一次是禁酒令，布局几年，各方面没问题，马上等富贵，禁酒令一下来就废了。后来还有什么事，我忘了，也是这样。一辈子就那么几次机会，两次重大事情隔十年各来一次，人基本就废了。这叫“天地灾杀报”，没办法。 再回顾前面，因果业力要注意，之前有没有干坏事？有，就会返一个相应的东西。比如拿刀把人捅了，至少有三种东西要承担，可能更多。"},{"id":"ep8-k18","course":"ep8","number":18,"topic":"成事条件","title":"伤害行为的三种影响：讲者的解释","summary":"本节在宗教叙述中，将伤害后果分成镜面法则、冤亲债主与众生怨念。","points":["三种解释在原文中分别展开。","本节以长期后果继续追问一时行为是否值得。"],"start":169,"end":175,"quote":"第三，杀了以后，他肯定有怨念，恨你、骂你，怨念粘在身上。他的家人也会恨、怨，诅咒你的家族，这叫众生怨念。至少三个东西产生影响，所以看看到底值不值。","quoteIndex":172,"related":["ep8-k17","ep8-k19"],"section":"ep8-p158","sectionTitle":"五 因果业力与阴债","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 伤害行为的三种影响：讲者的解释 本节在宗教叙述中，将伤害后果分成镜面法则、冤亲债主与众生怨念。 成事条件 三种解释在原文中分别展开。 本节以长期后果继续追问一时行为是否值得。 五 因果业力与阴债 伤害行为带来的三种影响 第一，因为什么杀这个人？因财、因色、因怨，像镜面法则一样存到天道上，不定哪一世返到身上。什么时候不一定，但一定返，百分之百。这叫镜面法则。 第二，把人杀了，只杀了一个壳。他有灵魂，还会轮回，记着这事，这叫冤亲债主。如果他投胎了，碰到叫小人；没投胎，碰到叫阴债。 第三，杀了以后，他肯定有怨念，恨你、骂你，怨念粘在身上。他的家人也会恨、怨，诅咒你的家族，这叫众生怨念。至少三个东西产生影响，所以看看到底值不值。 坏人前程、婚姻、事业、钱财，都容易出问题。有时福报够，机缘有，天赋不错，可是一上去就被阻碍，这属于因果业力。 债主又不一样，是“我曾经就恨你，你想把这事做成功，不可能，我就折腾你”。他折腾你，看能不能扛得住，或者找法师处理一下，可能能够圆满，人家不找麻烦了。 但我见过一种债主，先想办法让你成功，等你把一切都压进去，最后再让你痛哭流涕。有直接阻碍事业的，有间接阻碍的，还有先帮你、后阴你的，这就是债主。"},{"id":"ep8-k19","course":"ep8","number":19,"topic":"成事条件","title":"高维对抗：本课对另一类阻力的叙述","summary":"讲者将高维对抗与普通竞争对手区分，并用自己的传法任务解释这一概念。","points":["本节属于讲者对法界博弈的解释。","它在课程框架中被列为自身能力之外的一类条件。"],"start":176,"end":181,"quote":"第六，高维对抗。这种事很少，除非第一次把某样东西带到人间，容易出现高维对抗，它不是竞争对手。比如我们要把《人类说明书》带到人间，也会有高维对抗，我的发挥有时也不稳定。","quoteIndex":178,"related":["ep8-k18","ep8-k20"],"section":"ep8-p176","sectionTitle":"六 高维对抗与环境","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 高维对抗：本课对另一类阻力的叙述 讲者将高维对抗与普通竞争对手区分，并用自己的传法任务解释这一概念。 成事条件 本节属于讲者对法界博弈的解释。 它在课程框架中被列为自身能力之外的一类条件。 六 高维对抗与环境 六 高维对抗与环境 高维博弈在人间的表现 第六，高维对抗。这种事很少，除非第一次把某样东西带到人间，容易出现高维对抗，它不是竞争对手。比如我们要把《人类说明书》带到人间，也会有高维对抗，我的发挥有时也不稳定。 佛界、神界想把东西带下来，魔界还不愿意。得看你的重要性，敌人重不重视。活到连敌人都不重视，重要性也不大。尤其利益众生，利益了一堆，居然连个魔都没来找麻烦，只能说水平还差点，连敌人都不重视。 高维对抗不是我们能决定的。我也只是神佛这边一个小棋子，老大之间互相博弈，跟我们有什么关系？正常干，上面万一有问题，也没招，在人间就倒霉。如果老大赢了，人间就出现破除万难，最后终于成功。其实成功不成功，是高维在人间的显化。 普通做生意很少。但像马云把网络购物带到中国，像抖音、马斯克，改变人间的东西，没有上面的博弈是不可能的。博弈成功就成功，失败，人间看到的就是一个伟大的天才陨落。"},{"id":"ep8-k20","course":"ep8","number":20,"topic":"成事条件","title":"环境：同样能力，发挥可能不同","summary":"本课用不同天气下搬砖的比喻，说明环境对能力发挥的影响。","points":["条件变化后，原先可行的行动不一定仍然可行。","本节强调重新观察环境与行动时机。"],"start":182,"end":186,"quote":"如果烈日暴晒，四十多度，估计只能搬五百块；特别冷，出去冻成冰棍，也只能搬几百块；狂风暴雨、龙卷风，一块都搬不了，出去还容易被刮丢。这就是环境的影响。","quoteIndex":185,"related":["ep9-k10","ep8-k19"],"section":"ep8-p176","sectionTitle":"六 高维对抗与环境","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 环境：同样能力，发挥可能不同 本课用不同天气下搬砖的比喻，说明环境对能力发挥的影响。 成事条件 条件变化后，原先可行的行动不一定仍然可行。 本节强调重新观察环境与行动时机。 六 高维对抗与环境 同样的能力在不同环境下发挥不同 第七，环境。我说咱们现在正处在经济大萧条，估计大家都明白。前面各方面都解决了，结果生不逢时，正好赶上大萧条，怎么办？ 像我年轻二十多岁时，家里盖房要搬砖。我估计一下午搬一千块到三楼，问题不大。我们家当时住二楼，搬一千块到二楼应该没问题。这是在风和日丽时，我正常体力能发挥的。 如果烈日暴晒，四十多度，估计只能搬五百块；特别冷，出去冻成冰棍，也只能搬几百块；狂风暴雨、龙卷风，一块都搬不了，出去还容易被刮丢。这就是环境的影响。 有时得看环境，环境变了，就不一样。前面的东西可能具备，但大环境不好，就等等。大环境不好还往外走，就很麻烦。"},{"id":"ep8-k21","course":"ep8","number":21,"topic":"风险与兜底","title":"意外：计划和预判之外的变量","summary":"本课将意外定义为计划、预判、准备之外突然出现的变量。","points":["对真相理解不足，会造成一类意外。","信息不全面，即使分析过，也可能遗漏关键因素。"],"start":187,"end":194,"quote":"跟法界有关的因素，最后一个叫意外。多说一些，因为很多人理解不透。意外就是计划之外、预判之外、准备之外，突然插进来的变量。","quoteIndex":189,"related":["ep5-k09","ep8-k22","ep4-k19"],"section":"ep8-p187","sectionTitle":"七 意外与给自己兜底","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 意外：计划和预判之外的变量 本课将意外定义为计划、预判、准备之外突然出现的变量。 风险与兜底 对真相理解不足，会造成一类意外。 信息不全面，即使分析过，也可能遗漏关键因素。 七 意外与给自己兜底 七 意外与给自己兜底 真相不清与信息不全 跟法界有关的因素，最后一个叫意外。多说一些，因为很多人理解不透。意外就是计划之外、预判之外、准备之外，突然插进来的变量。 对了，请大家点赞、收藏、分享。导播经常说“你得说这事”，我每次都忘，让更多人看到。 好，再说意外。意外不是人的错误，是这个世界总有你掌握不了的东西，一定记住。意外也分等级。比如真相层的意外，普通人对事情的真相了解不够，这时做决定，就容易出意外。 第二，全面层。为什么我坚决不做股票？我相信很多人分析得厉害，但假设决定一只股票走向有一百个因素，普通人能掌握二三十个，已算高手；掌握五六十个，就是高手中的高手。 掌握七八十个更厉害，但世界总有你看不到的意外，千万不要完全相信自己。我更多做很有把握的事。 像巴菲特也是，九十年代末、二〇〇〇年初，放任科技股狂飙，不去碰，因为有些东西把握不了。不可能掌握全面，但对某些公司，他很有把握，所以只做确定的事情，这点很不一样。"},{"id":"ep8-k22","course":"ep8","number":22,"topic":"风险与兜底","title":"意外的层次：操作与未知变量","summary":"本节继续列出操作、资源以及其他难以确定的因素。","points":["讲者明确承认，自己也有解决不了和不敢确定的问题。","在其宗教叙述中，意外同样没有被完全排除。"],"start":195,"end":200,"quote":"我的命局、大概的财富、从哪来财，心里大概有数。怎么做能保护自己，也清楚。但有这么多神佛仙看着，有这么多准备，就一定成功吗？不一定，还是不一定。","quoteIndex":200,"related":["ep8-k21","ep8-k23"],"section":"ep8-p187","sectionTitle":"七 意外与给自己兜底","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 意外的层次：操作与未知变量 本节继续列出操作、资源以及其他难以确定的因素。 风险与兜底 讲者明确承认，自己也有解决不了和不敢确定的问题。 在其宗教叙述中，意外同样没有被完全排除。 七 意外与给自己兜底 操作与更难确定的变量 第三，操作层意外。自己开车，撞车、剐车时，有时明明觉得有问题，还是这么做了，很奇怪。还有资源层、高维、因果业力的意外，以及很多不明意外。 很多人问：“您都是阴阳师，能跟上面接触，是不是不可能出意外？”我可以很负责地说，看卦和得到高维信息的水平，绝对远超人类。 但是仍有解决不了的问题、不敢确定的问题。甚至知道事情应该往这边走，却连说都不敢说，想都不敢想。因为一说、一想，在法界就相当于公开，可能出变数。这叫事以密成，我们也一样。 那到大菩萨或者佛祖，就不出意外吗？也一样。每过一段时间，佛界也会有佛祖陨落，不是做到佛祖就不会陨落。别觉得能掌握一切。 我的命局、大概的财富、从哪来财，心里大概有数。怎么做能保护自己，也清楚。但有这么多神佛仙看着，有这么多准备，就一定成功吗？不一定，还是不一定。"},{"id":"ep8-k23","course":"ep8","number":23,"topic":"风险与兜底","title":"为不如预期的结果留出准备","summary":"本课提出即使已有准备，也要考虑失败或突发情况发生后如何承接。","points":["提前问：如果失败，后面靠什么兜底？","“预备队”的比喻，用来说明备用安排的作用。"],"start":201,"end":204,"quote":"意外一定有可能发生，有大有小。真出事时，必须有自己给自己兜底的，打仗还得有预备队，一定注意。","quoteIndex":202,"related":["ep8-k22","ep9-k15","ep4-k20"],"section":"ep8-p187","sectionTitle":"七 意外与给自己兜底","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 为不如预期的结果留出准备 本课提出即使已有准备，也要考虑失败或突发情况发生后如何承接。 风险与兜底 提前问：如果失败，后面靠什么兜底？ “预备队”的比喻，用来说明备用安排的作用。 七 意外与给自己兜底 所以我也会做一些仙家觉得奇怪的事情：做负面的准备。万一败了？万一什么都没有了？万一真出事了？这些都得准备。 意外一定有可能发生，有大有小。真出事时，必须有自己给自己兜底的，打仗还得有预备队，一定注意。 你们碰到的，多数是真相、全面性、操作层面出问题。这些没问题，却被疫情、战争、天灾、黑天鹅影响，就不好预测。 我记得疫情期间，石油能跌出负数，谁能想到？哪怕一分钱一升都认了，居然负数，一下让一帮人爆仓。所有人都不认为怎么能出负数，结果它就出了，会出现这种情况。"},{"id":"ep8-k24","course":"ep8","number":24,"topic":"认知与思维","title":"检查真相：真不真、全不全、对不对、在哪层？","summary":"本课结尾回到第四课的认知讨论，为后续分析与执行作准备。","points":["先检查信息的真实性、完整性与理解是否对应。","也要辨别自己看到的是哪个层面的信息。"],"start":205,"end":211,"quote":"意外说完，第二个就是真相部分。这些跟法界没有太大关系。注意你了解的信息真不真、全不全、对不对，还有在第几层。之前讲过，就不多说，只告诉你有这么件事，盯着点。","quoteIndex":206,"related":["ep7-k19","ep4-k13","ep9-k02"],"section":"ep8-p205","sectionTitle":"八 真相判断与课程结束","searchText":"问道八 意义思维：重新看懂成功与失败 第8课 问道8 检查真相：真不真、全不全、对不对、在哪层？ 本课结尾回到第四课的认知讨论，为后续分析与执行作准备。 认知与思维 先检查信息的真实性、完整性与理解是否对应。 也要辨别自己看到的是哪个层面的信息。 八 真相判断与课程结束 八 真相判断与课程结束 意外说完，第二个就是真相部分。这些跟法界没有太大关系。注意你了解的信息真不真、全不全、对不对，还有在第几层。之前讲过，就不多说，只告诉你有这么件事，盯着点。 要看自己在哪个境界，才能保证很多东西正确运行。上几节课，好像认知和思维模型那一节，讲过真相，这很重要。 真不真、全不全、对不对、第几层。但是能碰到真相也靠机缘，没有机缘根本碰不到。比如外网那些大 V，没有人家那个机缘，怎么知道那些真相？真的是把天上的东西拿到人间。 包括没有我的机缘，想知道这些真相，门都没有，几千年也没人跟你说这些。反正尽可能多修一些众生善缘吧。 好，今天说到这。这些是决定一个人成功或者失败的法界部分。明天再把人间部分快速捋一遍，成事这部分就讲完了。 感谢大家。愿意点赞的再点点赞，收藏、分享。谢谢大家，辛苦听我唠叨，拜拜。"},{"id":"ep9-k01","course":"ep9","number":1,"topic":"课程导读","title":"第九课：成事的现实执行部分","summary":"本课接续前两课的条件讨论，展开分析、执行、身体、情绪、人际与反馈。","points":["本课以列出检查方向为主，没有展开所有细节。","与第七课的七项框架、前一课的条件与真相部分对照阅读。"],"start":22,"end":37,"quote":"今天还是讲成事的人间部分。昨天把法界部分讲完了，成事本身就分人间和法界。法界大家不特别清楚，所以讲得多些：得有缘分、有福气，对真相有足够了解，有贵人、有气运。","quoteIndex":31,"related":["ep8-k01","ep10-k01"],"section":"ep9-p22","sectionTitle":"一 开场与课程安排","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 第九课：成事的现实执行部分 本课接续前两课的条件讨论，展开分析、执行、身体、情绪、人际与反馈。 课程导读 本课以列出检查方向为主，没有展开所有细节。 与第七课的七项框架、前一课的条件与真相部分对照阅读。 一 开场与课程安排 一 开场与课程安排 听到的扣一。这网速这么好吗？还挺厉害。来，咱们先唠会儿嗑。这么多次直播，今天好不容易第一次早来。结果他们一打开电脑，今天特别白，不知道怎么调的，可能开了双重美颜。 刚开始没开美颜，我正琢磨：“这是我吗？”哈哈，发现看习惯之后，也是接受不了现实。你们看到的都是经过三十多块钱美颜的效果，正常情况不是这样。今天磨皮有点太白，不过先这样吧，反正也不追求什么，又不是什么大明星。 今天属于纯人间的，就没有那些法界的东西了，所以讲得快一点，有点 AI 整理的东西。明天决定给自己放假一天，去喝个小啤酒，不想给你们直播，后天晚上再播。周四讲智慧，基本准备得差不多了，还需要再憋一小会儿，估计上几趟厕所就憋出来了，憋点东西挺费劲。 在周一之前，含周一，再把修行给大家说了。之后先等等，我再找个地方憋十天半个月，再密集输出。剩下因果、轮回、空色、有无，就开始了。 还是觉得十二月份之前，能冲一把就冲一把，怎么着也得把《逆修觉者》冲到二十集，要不太费劲。这今年不是闰年嘛，所以一月份，我估计就进入腊月了，进入腊月二十三了。一定要在腊月二十三之前完成二十五集，要不然不得了。 上面领导问：“你丫今年干什么了？”我说：“光憋，没憋出来。”怎么着也得憋点东西。直播完就算完成任务，录播那帮人太慢，不能怪我，是他们跟不上我的速度，哈哈。这也得冲 KPI。腊月二十三，天地考核之前，必须想办法冲一把。 我觉得从去年十一月份开始憋，一直憋不出来。好不容易有点感觉，脑袋还出问题；脑袋好了，又开始憋。要把好东西带到人间，不是那么简单的事。 凌晨四五点起床，就在那憋：今天到底讲什么？然后刷着刷着视频，可能就想明白了。 今天还是讲成事的人间部分。昨天把法界部分讲完了，成事本身就分人间和法界。法界大家不特别清楚，所以讲得多些：得有缘分、有福气，对真相有足够了解，有贵人、有气运。 很多人自命不凡，“我命由我不由天”，其实早就天注定。不是那块料、不是那个命，哪怕是天地的儿子，投胎时忘了带福报下来，该缩着也得缩着。不要做无谓的努力，抓紧时间把今生能完成的事完成，珍惜缘分和机会。 跟你没关系的，别乱努力。比如动不动创业，人家可以，问题是你是不是？别浪费时间。绝大多数人把时间浪费在这些没用的事上，所以先说法界成事的条件。法界都不成相，往上冲什么？纯粹浪费时间、人力、金钱。 走 A 运时，失败一下无所谓，人要经历失败才能成长，没太大问题。但都 B 运、C 运了，就老老实实歇着。尤其福报有限，四十、四十五、五十了还没怎么样，就别觉得四十五、五十以后还能怎么样，收着点。 或者前半生已经挣过大钱，后半生还能再挣大钱的可能性很低，别乱折腾。哪怕折腾，动嘴可以，别动钱，也别做惊天动地的大事。这是法界部分主要想说的。 今天说人间部分，会比较快。估计半小时、四十分钟差不多，基本都是流水化的东西，不会说得太细。后面还有好多项，再说细了，更没完。明天休息一天，我要喝小啤酒。 周四大课，都来，讲智慧。相当于从人间界定义什么是智慧，修行方向这些就全定了。所有违背我跟你说的修行宗旨的，全是扯淡，你直接这样认为就行。周四这节课比较大，再憋几天，把修行讲了，再休息，计划就是这样。"},{"id":"ep9-k02","course":"ep9","number":2,"topic":"学习与执行","title":"分析、学习、研究：把信息转成能力","summary":"本课强调，接触信息之后，还需要独立理解、分析和研究。","points":["复杂事情很难在开始前准备齐全。","在行动中学习、调整方向，并使用或创造新的资源。"],"start":38,"end":44,"quote":"必须在运动中，一边学习，一边准备，一边前进，一边反馈，一边修正，得这么弄才行。不是说你认为什么地方可能有意外，这个想法就不正常；有意外很正常。但是非得等所有东西都准备好了，才肯往前走，我说这个不可能。干小事和干大事，在这点上是不一样的。","quoteIndex":43,"related":["ep8-k24","ep9-k07","ep9-k03"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 分析、学习、研究：把信息转成能力 本课强调，接触信息之后，还需要独立理解、分析和研究。 学习与执行 复杂事情很难在开始前准备齐全。 在行动中学习、调整方向，并使用或创造新的资源。 二 分析学习与研究能力 二 分析学习与研究能力 大事要在行动中不断修正 好，讲成事的第二部分，人间部分。第一块叫分析、学习、研究。要成事，得有独立分析、独立学习、独立研究的能力。接触到信息、真相、条件之后，能不能分析明白、学进去、研究透彻，非常重要。 为什么要求这些能力？一个人不可能什么都准备好才开始。小事可以，比如出去玩，把该想到的都想好，准备好了再去，没问题。但干任何一件大事，怎么可能什么都准备好？ 有些学历挺高的学生问：“你怎么证明这些事情？怎么知道一定没有意外？”我认为你觉得有意外，很正常。但非要把什么都准备好，就凭这个想法，不可能是干大事的人。人类任何足以推动进步、非常伟大的成就，从来没有一开始就准备好的。 必须在运动中，一边学习，一边准备，一边前进，一边反馈，一边修正，得这么弄才行。不是说你认为什么地方可能有意外，这个想法就不正常；有意外很正常。但是非得等所有东西都准备好了，才肯往前走，我说这个不可能。干小事和干大事，在这点上是不一样的。 只要干大事，没有人一开始就知道该怎么走、怎么变、怎么动，未来遇到什么事、什么机缘，什么又不可能。所以有几个能力重要：洞察力、学习能力、分析能力、研究能力。准备随时调整方向，应用手头资源，甚至创造新资源，这才重要。"},{"id":"ep9-k03","course":"ep9","number":3,"topic":"学习与执行","title":"导弹思维：前进中持续校正","summary":"讲者以子弹和导弹作比喻，说明持续修正方向的重要性。","points":["一次准备之后不再调整，难以应对持续变化。","把自我提升、反馈和修正放进整个行动过程。"],"start":45,"end":51,"quote":"人生一定要学导弹，别学子弹。这就要求自我提升、自我修正、自我进化的能力非常强。历史上谁做得厉害？还得朱元璋。开局比他惨的很少，最后达到开国皇帝的水平，你想自我提升、进化、修正得多强？","quoteIndex":49,"related":["ep9-k02","ep9-k21"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 导弹思维：前进中持续校正 讲者以子弹和导弹作比喻，说明持续修正方向的重要性。 学习与执行 一次准备之后不再调整，难以应对持续变化。 把自我提升、反馈和修正放进整个行动过程。 二 分析学习与研究能力 我们要做的不是一颗子弹。狙击手把东西都调好，砰，放一枪，子弹一出枪管，你就失去控制了。 能不能打到，看前面准备得怎么样。厉害点的子弹，打一千米、两千米，也就这个水平。创造最厉害狙击纪录的人，打两千四百、两千七百米外的目标，也没有说首枪命中的，都是打一枪，看看弹着点，调整再打一枪，至少第二枪才行。为什么？变数太多。 任何细微变化，到一千米、两千米时都会放大。但有没有办法精准击中几百、几千公里外的东西？可以，用导弹。 导弹发射时，甭管往哪边，哪怕相反方向，也不影响最后击中目标。为什么？几秒钟校正一次，有时可能一秒钟一次。经常修正方向，哪怕最开始差距很大，最后也能击中目标。 人生一定要学导弹，别学子弹。这就要求自我提升、自我修正、自我进化的能力非常强。历史上谁做得厉害？还得朱元璋。开局比他惨的很少，最后达到开国皇帝的水平，你想自我提升、进化、修正得多强？ 真得佩服老朱，啥都没有，开局一个碗，是不是完整的都不一定。全家好像就他和一个姐姐没饿死，其他都饿死了，实在厉害。 一定记住，小事可以准备好再做，大事不可能都准备好，必须在做中不断修正。人间的东西，一定要学会快速进化、快速迭代，这个能力非常重要。大老板和小老板的区别就在这儿。"},{"id":"ep9-k04","course":"ep9","number":4,"topic":"学习与执行","title":"学习吸收：知道之后，能不能用出来？","summary":"本课把理解、吸收和应用作为衡量学习的重点。","points":["看过多少书、听过多少课，只能说明接触过多少内容。","判断与行为能否改变，遇事能否调用，才是本节的关注点。"],"start":52,"end":55,"quote":"吸收不好，就是学不进去，听不懂，看不明白，学了不会用，只会记，不会转化。学很多，判断和行为基本没变化。你说听了多少课、看了多少书，接触了多少信息，这些还不等于你就学到了。真正考的，是学懂没有，明白没有，到事情上能不能用出来。核心一句话：学习不是知道了，而是学会了。不能理解、吸收、应用，就不能算真正学到。","quoteIndex":55,"related":["ep3-k18","ep9-k05"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 学习吸收：知道之后，能不能用出来？ 本课把理解、吸收和应用作为衡量学习的重点。 学习与执行 看过多少书、听过多少课，只能说明接触过多少内容。 判断与行为能否改变，遇事能否调用，才是本节的关注点。 二 分析学习与研究能力 学习吸收与社会上的学习 需要哪些东西？学习吸收能力、洞察悟性、抓核心的能力、高维分解、方向与资源、方式方法。当然还有更多，咱们不是讲 MBA，大概列列就行。 第一个，学习和吸收。不是接触多少信息、听多少课、看多少书就行。真正的学习，考的是能不能学懂、学明白、应用。 吸收不好，就是学不进去，听不懂，看不明白，学了不会用，只会记，不会转化。学很多，判断和行为基本没变化。你说听了多少课、看了多少书，接触了多少信息，这些还不等于你就学到了。真正考的，是学懂没有，明白没有，到事情上能不能用出来。核心一句话：学习不是知道了，而是学会了。不能理解、吸收、应用，就不能算真正学到。"},{"id":"ep9-k05","course":"ep9","number":5,"topic":"学习路径","title":"社会学习：问题和大纲都要自己找","summary":"本节比较学校学习与社会学习，指出后者往往连问题和方向也需要自己辨认。","points":["先识别要解决的事情，再寻找知识与资源。","在尝试中归纳总结，并及时调整。"],"start":56,"end":59,"quote":"社会完全不是这样。首先没人告诉你问题是什么，你连问题都不知道。出了问题怎么做，往哪个方向走，学什么、准备什么、应用什么，才能拿到社会上的高分？没人告诉你。","quoteIndex":58,"related":["ep9-k04","ep9-k06"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 社会学习：问题和大纲都要自己找 本节比较学校学习与社会学习，指出后者往往连问题和方向也需要自己辨认。 学习路径 先识别要解决的事情，再寻找知识与资源。 在尝试中归纳总结，并及时调整。 二 分析学习与研究能力 这涉及社会学习和学校学习的区别。我们要求的是社会上的学习能力。学校里买哪本书，都指定好了。 大纲框架、学什么、标准是什么，相应经验、案例、考题，都给你了。好好学，学得足够多，经常刷题，基本不会出太大问题。考七百分不容易，但脑子不错，加上足够努力，上六百分问题不大。 社会完全不是这样。首先没人告诉你问题是什么，你连问题都不知道。出了问题怎么做，往哪个方向走，学什么、准备什么、应用什么，才能拿到社会上的高分？没人告诉你。 要在这些东西里迅速试错，快速找出路，归纳总结，这才是社会上的学习方式。"},{"id":"ep9-k06","course":"ep9","number":6,"topic":"学习与执行","title":"机场排队：已有投入如何影响转向？","summary":"讲者用新柜台开放的例子，讨论不同排队位置的人面对机会时的反应。","points":["已经等待的时间，可能让人更难改变路线。","案例用于反思既有位置与新机会之间的取舍。"],"start":60,"end":67,"quote":"排到前面的，是既得利益：“马上轮到我，干嘛走？”也不走。最难受的是中间，不高不低，排了一半。走吧，已经排一半；不走吧，又错失机会。几秒钟，换过去就在前面，没换过去就没机会了。人也是这样，要注重社会学习。","quoteIndex":62,"related":["ep9-k05","ep10-k16"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 机场排队：已有投入如何影响转向？ 讲者用新柜台开放的例子，讨论不同排队位置的人面对机会时的反应。 学习与执行 已经等待的时间，可能让人更难改变路线。 案例用于反思既有位置与新机会之间的取舍。 二 分析学习与研究能力 所以《亮剑》里，李云龙为什么能把好多上黄埔军校的打得狗吃屎？就是社会应用特别强。这也是什么原因，很多九八五、二一一、上过大学的人，最后社会成就反而不如泥腿子。 泥腿子里，有人不爱学习，但不代表学习能力差，而且没有负担。就跟排队一样：去机场换登机牌，旁边开了一个新柜台，也能换，你看谁转过去？一定排最后那帮人，没负担。“反正已经在后面，直接冲过去。” 排到前面的，是既得利益：“马上轮到我，干嘛走？”也不走。最难受的是中间，不高不低，排了一半。走吧，已经排一半；不走吧，又错失机会。几秒钟，换过去就在前面，没换过去就没机会了。人也是这样，要注重社会学习。 真正解决问题的是社会学习能力。怎么评判是不是学习能力很强？很简单。比如到一家公司，某个东西从没接触过，小规模公司、小规模行业，两三个月，如果不能在某个小领域变成绝对高手，学习能力就有点差。 大的东西，用几年的时间，咱们三五年一个小阶段，五到十年一个大阶段，必须在某个行业、某个领域，成为这个赛道全球最顶尖的人才。我说的是你能不能在一个领域里学进去，最后达到那个水平。这才是咱们这一项的评判标准，不是看你原来接触没接触过，也不是只看你原来上过什么学校。 这说明学习能力很厉害。做不到，就做个普通人，别太费劲，别太难为自己，哈哈。 包括找我们开堂口的，我都跟他们说：“我知道你们想开堂口干什么，想算命，觉得开完自己就厉害，你想错了。一定是没开堂口之前，就很厉害。开堂口只是把法界程序走完。”没开之前不厉害，开了也不会多厉害，就是这个真实情况。 我估计十二月份逐渐讲一些真相，首先讲人类金字塔。知道跟什么样的人竞争，就知道为什么一直赚不到钱。真的就是水平差，只是圈子让你感觉不到到底多差。真正看到几个厉害的，就知道为什么挣不到钱。"},{"id":"ep9-k07","course":"ep9","number":7,"topic":"认知与思维","title":"洞察与悟性：看见问题、想明白问题","summary":"本课将洞察与悟性联系起来，分别讨论发现与理解。","points":["洞察：看到未被注意的问题。","悟性：理解和想通原先不明白的东西。","本节关注能否较早发现机会与问题。"],"start":68,"end":71,"quote":"第二，洞察。看到别人看不到的问题，叫洞察。再加悟性，想明白别人想不明白的东西，叫悟性，可以合并讲。","quoteIndex":69,"related":["ep5-k16","ep9-k02","ep9-k08"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 洞察与悟性：看见问题、想明白问题 本课将洞察与悟性联系起来，分别讨论发现与理解。 认知与思维 洞察：看到未被注意的问题。 悟性：理解和想通原先不明白的东西。 本节关注能否较早发现机会与问题。 二 分析学习与研究能力 洞察悟性与抓核心 第二，洞察。看到别人看不到的问题，叫洞察。再加悟性，想明白别人想不明白的东西，叫悟性，可以合并讲。 洞察、悟性好，就能发现别人发现不了的问题，看到别人看不到的东西，想到别人想不到的东西，想明白别人想不明白的，理解别人费很大力气才能理解的，这些都重要。 没这个能力，就做不到提前发现机会和问题。等你发现问题，事已经大了；等你确定是机会，其实快没机会了。这是洞察力和悟性太弱的表现。"},{"id":"ep9-k08","course":"ep9","number":8,"topic":"认知与思维","title":"抓核心：找出真正影响成败的变量","summary":"复杂事情中，信息很多，但关键问题可能只有少数几个。","points":["区分主要问题、次要问题与表面干扰。","表达问题时，也需要说清到底要解决什么。"],"start":72,"end":75,"quote":"第三，抓核心。从复杂事物中找出真正决定成败的关键点。很多事情看着复杂，变量、信息、干扰很多，真正决定胜负的往往就那几个东西。毛主席在这方面就很厉害。","quoteIndex":72,"related":["ep9-k07","ep9-k09"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 抓核心：找出真正影响成败的变量 复杂事情中，信息很多，但关键问题可能只有少数几个。 认知与思维 区分主要问题、次要问题与表面干扰。 表达问题时，也需要说清到底要解决什么。 二 分析学习与研究能力 第三，抓核心。从复杂事物中找出真正决定成败的关键点。很多事情看着复杂，变量、信息、干扰很多，真正决定胜负的往往就那几个东西。毛主席在这方面就很厉害。 抓核心不好，就抓不住重点，容易被复杂的表面现象带跑，把次要问题当主要问题，忽略真正决定胜负的变量。花很多力气，没打中真正的问题，解决一堆小问题，大问题还在。 很多学生提交单子，知道为什么一定要出查事模板吗？二〇一八、二〇一九、二〇二〇这三年，我快被折磨疯了。有时听一个女的或者男的说俩小时，最后还不明白到底想解决什么。咱们女性客户多，所以听女的多些，真是这样。 今天好像还听了鲁社长的现场答疑，一个哥们说快十分钟，都没介绍清楚想干什么。就这样还回来当教授？别当了。的确可能紧张，但语言表达和抓重点的能力实在太差，这一点很重要。"},{"id":"ep9-k09","course":"ep9","number":9,"topic":"认知与思维","title":"高维分解：看层次，也看传导","summary":"本课用分层方法区分表面、原因、结构、规则与更高层影响。","points":["把多层问题拆开。","继续看上层如何影响下层，下层如何承接上层。"],"start":76,"end":78,"quote":"高维分解是什么？把多层事物拆开，看懂层与层的关系。并不只是看每一层，而是看哪层是表面、哪层是原因、哪层是结构、哪层是规则、哪层是更高维的影响。","quoteIndex":77,"related":["ep9-k08","ep9-k10"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 高维分解：看层次，也看传导 本课用分层方法区分表面、原因、结构、规则与更高层影响。 认知与思维 把多层问题拆开。 继续看上层如何影响下层，下层如何承接上层。 二 分析学习与研究能力 高维分解与方向资源 高维分解是什么？把多层事物拆开，看懂层与层的关系。并不只是看每一层，而是看哪层是表面、哪层是原因、哪层是结构、哪层是规则、哪层是更高维的影响。 层与层怎么传导？上层如何影响下层，下层如何承接上层？要学会把问题分解。"},{"id":"ep9-k10","course":"ep9","number":10,"topic":"成事条件","title":"方向与资源：值得做，也要做得起来","summary":"本节把方向和可调用资源放在一起分析。","points":["方向影响后续努力是否被带偏。","资源包括时间、物质、人脉、通路和其他可以调用的支持。"],"start":79,"end":89,"quote":"第五，方向和资源。共同决定事情值不值得做、能不能做起来。有时想法没问题，就是没有资源，或者方向错了。","quoteIndex":79,"related":["ep5-k14","ep8-k20","ep9-k09","ep9-k11"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 方向与资源：值得做，也要做得起来 本节把方向和可调用资源放在一起分析。 成事条件 方向影响后续努力是否被带偏。 资源包括时间、物质、人脉、通路和其他可以调用的支持。 二 分析学习与研究能力 第五，方向和资源。共同决定事情值不值得做、能不能做起来。有时想法没问题，就是没有资源，或者方向错了。 确保发展路径、方向正确。方向错，在错误道路上努力，就是不停白费精力、资源，越努力，错误越大。方向决定值不值得做，后面所有努力会不会被带偏。 资源就是整合资源，用资源再创造价值，所有东西都在用资源。包括我，忽悠能力还可以，在佛界来说。 至少排进前十大忽悠，没问题。主要是佛界的人不太能忽悠，我在佛界比较能忽悠。但在轮回里排，肯定不行。可这不就是机缘吗？咱能在佛界忽悠，底下再能忽悠，上不了佛界。 佛界的人比较好忽悠。昨天说怎么忽悠佛界美女，很简单，但后果严重。我曾经被追杀过，忽悠完容易被追杀。 非得问：“你居然小菩萨级，为什么后面还长俩翅膀？大家不都会飞吗？为什么你长翅膀才能飞？”觉得奇怪，一不小心说：“原来你是个鸟人啊！” 得，完了，被追杀多少世。有些佛界美女下手比较狠。我这吹没输过，打架没赢过，一直是被揍的对象。缘分就这么出来的，很郁闷。所以不要乱忽悠，容易出事，轮回里追杀很多。 好，资源包括时间资源、物质资源、通路资源、人脉资源、矿物资源，还有社会资源和一切可调用资源。包括智商、师父、朋友，都能调用。没有资源，除非很小众、很小规模的事，能做成功。 稍微大点的事情，就拿咱们这么小的事来说，法界没有足够多的仙家、神佛仙资源，想讲出这些东西，想什么呢？人类几千年都没讲出这些。 看评论可以说一下，关键是法界武力值不是按肌肉算。 今生像我老婆，我两百斤，她一百左右，有时不到一百。按人间来说，一划拉就给她划拉到一边。但法界不这么算，是按法力值，谁揍谁就不一定了。不同界面有不同规则。"},{"id":"ep9-k11","course":"ep9","number":11,"topic":"学习与执行","title":"结构化处理与复杂问题承载","summary":"本课要求把复杂问题拆分、看清关系，再连接成可处理的结构。","points":["不同部门、多人、多件事同时出现时，处理能力会受到考验。","讲者用早年的客服经历说明多任务负荷。"],"start":90,"end":95,"quote":"还可以拆成几个方面。第一，结构化处理。学会把复杂问题拆分，看清关联和逻辑，把问题拆开、连通、讲通。第二，复杂问题的承载。","quoteIndex":92,"related":["ep9-k10","ep9-k12"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 结构化处理与复杂问题承载 本课要求把复杂问题拆分、看清关系，再连接成可处理的结构。 学习与执行 不同部门、多人、多件事同时出现时，处理能力会受到考验。 讲者用早年的客服经历说明多任务负荷。 二 分析学习与研究能力 方式方法与复杂问题的处理 第六，方式方法。首先方法正确，讲究效率，等级是否正确，处理问题的层次是否匹配。这些不多说。 还可以拆成几个方面。第一，结构化处理。学会把复杂问题拆分，看清关联和逻辑，把问题拆开、连通、讲通。第二，复杂问题的承载。 对创业者、领导者来说，说白了就是脑子算力够不够，多线程处理够不够，能不能把复杂问题简单处理。我年轻时做过客服，公司杂事基本都归我。 刚开始处理一个就捉襟见肘，多加几个问题、几个人，更麻烦。原来一两个员工找你，还能解决；三四十个排队找你，能不能也解决？能不能同时处理几个部门的事？这就是处理复杂问题的能力。 那时过得苦，但对处理多线程任务、高负载量，很有帮助。原来一两个问题能处理，问题一多，人一多，几个部门一起找你，你还能不能处理？这个才看得出复杂问题的承载能力。老板只能处理单线程，一来复杂的、多线程的就处理不了，肯定不行。"},{"id":"ep9-k12","course":"ep9","number":12,"topic":"学习与执行","title":"应变与推演：变化之后怎么改？","summary":"本节把行动中的调整速度，与行动前的后果推演联系起来。","points":["突发变化后，判断是否继续、怎样修改。","向后多推几步，观察可能的结果和预警。"],"start":96,"end":99,"quote":"对自己的所思、所想、所行，要有更长远的规划和推演。不要求推到五步之外，至少两三步，确定安全，也行。别什么都做了，又不管产生什么情况，那不就拍脑袋？怎么叫智慧？","quoteIndex":98,"related":["ep5-k08","ep10-k24","ep9-k11","ep9-k13"],"section":"ep9-p38","sectionTitle":"二 分析学习与研究能力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 应变与推演：变化之后怎么改？ 本节把行动中的调整速度，与行动前的后果推演联系起来。 学习与执行 突发变化后，判断是否继续、怎样修改。 向后多推几步，观察可能的结果和预警。 二 分析学习与研究能力 第三，应变能力。肯定有突然变化，事情要不要继续，要不要改，改成什么样，速度怎么样，都很重要。 再往下，推演。很多人想事情，没想做完以后可能产生什么结果，有什么预警，下意识认为照着办就行，肯定不行。 对自己的所思、所想、所行，要有更长远的规划和推演。不要求推到五步之外，至少两三步，确定安全，也行。别什么都做了，又不管产生什么情况，那不就拍脑袋？怎么叫智慧？ 年轻人可能自己推演不了，也尝试着推演，变成习惯以后，其实没多大负担。"},{"id":"ep9-k13","course":"ep9","number":13,"topic":"成事条件","title":"执行掌控：把想明白的事推进下去","summary":"本课以学自行车作比喻，说明理解方法后仍需实践。","points":["需要对人、事、资源、节奏和局面有实际把握。","能说清一个想法，与能稳定推进，是不同环节。"],"start":100,"end":105,"quote":"主要是掌控力，对人、事、资源、节奏和局面，能不能有好的掌控，决定事情能不能做成。还没说具体人情世故，光到这儿，想成就伟大事业，得准备多少事？不是拍脑袋就行。","quoteIndex":103,"related":["ep9-k12","ep9-k14"],"section":"ep9-p100","sectionTitle":"三 执行掌控与压力阻力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 执行掌控：把想明白的事推进下去 本课以学自行车作比喻，说明理解方法后仍需实践。 成事条件 需要对人、事、资源、节奏和局面有实际把握。 能说清一个想法，与能稳定推进，是不同环节。 三 执行掌控与压力阻力 三 执行掌控与压力阻力 把想明白的事情推进下去 第三部分，大块叫执行掌控。上面都说完了，想好的东西能不能真推进下去？就像学自行车，理论教了，车有了，怎么着也得上手试试。刚开始平衡掌握不好，需要多练，这就是执行掌控。 主要是掌控力，对人、事、资源、节奏和局面，能不能有好的掌控，决定事情能不能做成。还没说具体人情世故，光到这儿，想成就伟大事业，得准备多少事？不是拍脑袋就行。 不像某些人的老婆，一拍脑袋：“咱做个高端的东西。”结果老公的钱赔得裤衩都不剩。想明白不等于能成功，真做时，要压得住局面，推得动节奏，对人、事、资源、节奏、局面有把握。 再往下，压力和阻力。做事不可能都顺，都顺不就爽文小说了？为什么爽文这么多？大家郁闷的事太多。"},{"id":"ep9-k14","course":"ep9","number":14,"topic":"成事条件","title":"压力、阻力与持续推进的韧性","summary":"本节讨论人的阻力、事情的阻力、资源不足以及外部竞争。","points":["行动过程可能反复受挫，需要承受压力并处理具体阻碍。","坚持、信心和毅力，在本节被放进执行能力中讨论。"],"start":106,"end":118,"quote":"再往下是韧性，信心、坚持、毅力，也是抗压的一种。能不能真正顶到最后，承受痛苦、消耗和反复打击，非常重要。不是说这个事一开始想好了，后面就顺着走，人在其中会有压力，外面也会有阻力。你得能顶得住，才有可能往后推进。所以执行掌控说到这儿，还不只是把事情想明白的问题。","quoteIndex":118,"related":["ep9-k13"],"section":"ep9-p100","sectionTitle":"三 执行掌控与压力阻力","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 压力、阻力与持续推进的韧性 本节讨论人的阻力、事情的阻力、资源不足以及外部竞争。 成事条件 行动过程可能反复受挫，需要承受压力并处理具体阻碍。 坚持、信心和毅力，在本节被放进执行能力中讨论。 三 执行掌控与压力阻力 小说中的机缘与成事的阻力 现实里很难成功，就在小说、短剧世界成功。但看小说短剧的主人公，像《凡人修仙传》《仙逆》，觉得他可能是泥腿子出来的吗？没外挂、没机缘能成功，那才见鬼。 《凡人修仙传》的男主人公是普通人吗？属于轮回道祖重新投胎，要不掌天瓶怎么落到脚边？《仙逆》的“仙逆珠”凭什么落在身边？没挂、没绝对资源，想从泥腿子往上升，想什么呢？ 连爽文小说都得有挂，没挂不行。有挂了，像王林，活得多苦，整个一部苦逼史，被揍、面临生死大劫，救媳妇每次失败，只有最后一次成功，失败了又重新找希望。 这就是阻力和压力。人的阻力、事的阻力、资源的阻力，都会产生很大压力，能不能成事要看能不能承受。 为什么很多女性很难成就特别大的事业？中国也好，世界也好，女性领导者、女性权贵不是很多，我说主要是在抗压、抗阻上出现问题。最后能做成大事的女性。 基本都有“男人婆”的感觉。比如撒切尔夫人、德国女总理、中国的董小姐，哪个是纯女性风格？女性各方面不比男生差，但属于感性思维，不把自己弄得非常坚定，很容易自己把自己压趴下。 顺境还行，逆境、尤其绝境，指着感性思维的人抗压，基本扛不住，包括男的也一样。居里夫人也是非常坚强的女性，都得这样才行。我说思维要很男性化，才能扛住，不然费劲。所以想成大事，就必须抗压，还要学会应对外部对抗和破坏。 外部对抗与坚持到底的韧性 像咱们这行业，几乎没竞争，因为在缘分、真相上，基本垄断了。放开让你竞争，也竞争不了，有些东西看不到，想竞争没用。 但正常在市场做生意不行，肯定有竞争对手，有搞破坏、挖陷阱的，有人抢资源、抢位置，反制你、拆台、制造麻烦。 或者诬陷，诱导你犯错，在关键节点翻车，能不能扛住？这涉及反制手段。对方反制手段太多，在博弈上就容易出问题。 再往下是韧性，信心、坚持、毅力，也是抗压的一种。能不能真正顶到最后，承受痛苦、消耗和反复打击，非常重要。不是说这个事一开始想好了，后面就顺着走，人在其中会有压力，外面也会有阻力。你得能顶得住，才有可能往后推进。所以执行掌控说到这儿，还不只是把事情想明白的问题。"},{"id":"ep9-k15","course":"ep9","number":15,"topic":"成事条件","title":"身体承载：持续做事的基础条件","summary":"讲者以个人经历说明，身体状态可能影响乃至中断事业。","points":["精力、体力、疲劳度与耐力，都会影响工作。","本节关注行动能力的承载条件。"],"start":119,"end":134,"quote":"首先身体不能影响事业发展，精力、体力、疲劳度、耐力都重要。以前忙、熬夜，年轻时还行，现在只要十二点以后睡，大概要休息两三天，岁数确实不行，得休息一段。","quoteIndex":132,"related":["ep8-k23","ep9-k16"],"section":"ep9-p119","sectionTitle":"四 身体承载与工作状态","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 身体承载：持续做事的基础条件 讲者以个人经历说明，身体状态可能影响乃至中断事业。 成事条件 精力、体力、疲劳度与耐力，都会影响工作。 本节关注行动能力的承载条件。 四 身体承载与工作状态 四 身体承载与工作状态 身体出问题可能中断整个事业 说完这些就是身体，一定保护好。别小看身体，很多人出问题就在身体上。举两三个例子，像我有家族遗传带来的劫难。我们家如果不想办法抵改或者调整，男性很难活过六十，基本五十左右就出问题。 我爸算比较晚，五十七得脑血栓，瘫在床上。其他人基本连他这个岁数都没活过去。我也是正好五十左右。 来了这场劫难，熬过去就过去，没熬过去，比如现在瘫痪了，流着哈喇子，光辉伟大的事业就终止了，一瞬间的事。 比如医生开颅时，突然飞来个苍蝇，进鼻孔，打个喷嚏，一下刀多划两下，就完了。这就是身体容易出问题。 这里面我觉得最可惜的，是那段“太子奶老大”的故事。辛辛苦苦一辈子，最后所有东西给了司机，钱、老婆、孩子都没了。找个漂亮、特别听话、没主意的，好控制；这个女的唯一能接触的男性就是司机。 人走了以后，产业都给老婆。她没有社会上的帮助，司机就顶起来了。司机那句话是：“一直以为我给老板打工，没想到老板给我打工。”哈哈。这就说身体，别小看。 清晨思考与自己的作息 像我们这样的人，为什么四五点起床？看硅谷那帮老大，也是四五点。那时没人打扰，很静，可以一边锻炼身体，一边思考。 我虽然懒，不爱锻炼，但四五点想问题效率高。白天动不动有人找，一会儿处理问题，一会儿看单子，甚至孩子回来在楼下一叫唤，楼上就别想干活。 我大概十点到十点半就睡着，躺枕头上就能睡。也刷手机，快十点上床，刷一会儿就睡着，四点多起来。 中午一定睡午觉，不多，半小时，一般很少一小时。我要仰一下脖子，不枕脑袋，头向后，把枕头放脖子这块，这么窝着睡一下，就舒服。这对我很重要，才能保证有效工作。 首先身体不能影响事业发展，精力、体力、疲劳度、耐力都重要。以前忙、熬夜，年轻时还行，现在只要十二点以后睡，大概要休息两三天，岁数确实不行，得休息一段。 这时想也想不出东西，脑子不转，与其这样，不如踏踏实实睡觉。前段时间我也有中招，一年总得几次。像七月十五、清明前后，阴气太重，脑子不转，索性给自己放假，爱谁谁，该打游戏打游戏，该刷剧刷剧。 创造不出价值，只是机械工作，没有意义。"},{"id":"ep9-k16","course":"ep9","number":16,"topic":"学习与执行","title":"工作状态：给思考留出安静与休息","summary":"讲者介绍自己选择清晨思考、疲惫时休息的习惯。","points":["这是讲者个人的作息与工作体验。","本节区分有效思考与状态不佳时的机械消耗。"],"start":127,"end":134,"quote":"我虽然懒，不爱锻炼，但四五点想问题效率高。白天动不动有人找，一会儿处理问题，一会儿看单子，甚至孩子回来在楼下一叫唤，楼上就别想干活。","quoteIndex":129,"related":["ep9-k15","ep9-k17"],"section":"ep9-p119","sectionTitle":"四 身体承载与工作状态","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 工作状态：给思考留出安静与休息 讲者介绍自己选择清晨思考、疲惫时休息的习惯。 学习与执行 这是讲者个人的作息与工作体验。 本节区分有效思考与状态不佳时的机械消耗。 四 身体承载与工作状态 清晨思考与自己的作息 像我们这样的人，为什么四五点起床？看硅谷那帮老大，也是四五点。那时没人打扰，很静，可以一边锻炼身体，一边思考。 我虽然懒，不爱锻炼，但四五点想问题效率高。白天动不动有人找，一会儿处理问题，一会儿看单子，甚至孩子回来在楼下一叫唤，楼上就别想干活。 我大概十点到十点半就睡着，躺枕头上就能睡。也刷手机，快十点上床，刷一会儿就睡着，四点多起来。 中午一定睡午觉，不多，半小时，一般很少一小时。我要仰一下脖子，不枕脑袋，头向后，把枕头放脖子这块，这么窝着睡一下，就舒服。这对我很重要，才能保证有效工作。 首先身体不能影响事业发展，精力、体力、疲劳度、耐力都重要。以前忙、熬夜，年轻时还行，现在只要十二点以后睡，大概要休息两三天，岁数确实不行，得休息一段。 这时想也想不出东西，脑子不转，与其这样，不如踏踏实实睡觉。前段时间我也有中招，一年总得几次。像七月十五、清明前后，阴气太重，脑子不转，索性给自己放假，爱谁谁，该打游戏打游戏，该刷剧刷剧。 创造不出价值，只是机械工作，没有意义。"},{"id":"ep9-k17","course":"ep9","number":17,"topic":"人性与心性","title":"延迟决定：这件事必须马上处理吗？","summary":"本课在情绪波动时先检查决定的紧迫性，对可以等待的事保留冷静时间。","points":["先问是否需要立刻决定。","能等待时，平复后再比较处理方式。","延迟针对可等待的决定，要结合具体问题判断。"],"start":135,"end":139,"quote":"最常见是发脾气、不冷静，在冷静期之外作出错误决定。所以我们要求延迟法则：这事需不需要马上决定？不需要，哪怕员工出什么事，先等一两天，心情平复再处理。","quoteIndex":138,"related":["ep5-k21","ep10-k24","ep9-k16","ep9-k18"],"section":"ep9-p135","sectionTitle":"五 心情情绪与延迟决定","searchText":"问道九 意义思维：成功与失败2 第9课 问道9 延迟决定：这件事必须马上处理吗？ 本课在情绪波动时先检查决定的紧迫性，对可以等待的事保留冷静时间。 人性与心性 先问是否需要立刻决定。 能等待时，平复后再比较处理方式。 延迟针对可等待的决定，要结合具体问题判断。 五 心情情绪与延迟决定 五 心情情绪与延迟决定 身体承载很重要，所有东西都得用肉身承载。下一部分是心情和情绪。很多人的错误，不是前面条件没有，而是做事时情绪波动。 碰到事恐惧、退缩，赶上好事欲望又大，成功后傲慢，觉得与众不同，不听别人说。傲慢固执、逃避懈怠、内耗敏感、情绪失控，都会出现，一出现很麻烦。 最常见是发脾气、不冷静，在冷静期之外作出错误决定。所以我们要求延迟法则：这事需不需要马上决定？不需要，哪怕员工出什么事，先等一两天，心情平复再处理。 年轻时一发现问题，啪，拿电话就开骂。但骂得对不对，有没有更好解决方式？当时正在气头上，也没去想这些。等心情平复以后，再看怎么处理，和一发现就打电话开骂，是不一样的。不是每件事都需要马上下决定，先看看需不需要，能等的就等一两天。很多缘分就是不小心这样弄掉的，所以心情、情绪控制很重要。"},{"id":"ep9-k18","course":"ep9","number":18,"topic":"人性与心性","title":"合作中的人品与稳定性","summary":"本节把信用、责任、底线与压力下的表现列为识人和合作的观察点。","points":["看是否守信，以及出现问题时怎样承担。","也看利益、压力与情绪变化时，行为是否稳定。"],"start":140,"end":145,"quote":
